roles:
  bluetooth: "Setup (pairing the scale with the phone app and handing it the Wi-Fi network) and later Wi-Fi network changes, driven by the phone app."
  wifi: "The only data path. The scale uploads by itself after every weigh-in, direct to the router."
  weigh_in_over_bluetooth: "No vendor statement says a weigh-in ever travels over Bluetooth."
  basis: vendor
  basis_note: "That the Wi-Fi change travels over Bluetooth is inferred: the app needs the scale nearby and the scale has no other way to hear the phone."
  vendor_statement:
    quote: "use Wi-Fi to connect directly to your router"
    said_of: [FB201, FB202]
    contrasted_with: "trackers, watches and the Aria Air, which sync over Bluetooth Low Energy with a phone"
    source: "https://support.google.com/googlehealth/answer/14237221"
  sync_visibly_carries:
    basis: inferred
    uplink: [weight, "impedance-derived body fat", "user assignment or guest", battery level]
    downlink: ["lean or regular mode per person", "whether body fat and BMI are displayed", weight units, "list of people and their icons"]
    consequence: "A stand-in for the vendor's server would have to supply user profiles before the scale could work out body fat or recognise anyone."
  firmware_updates:
    arrive_over_wifi: {answer: true, basis: inferred, from: "the three vendor statements below, taken together; no vendor page says so in as many words"}
    vendor_statements:
      - {source: "Aria 2 manual, 2019 edition, safety list", url: "https://staticcs.fitbit.com/content/assets/help/manuals/manual_aria_2_en_US.pdf", quote: "Your scale will receive automatic firmware updates", names_a_channel: false, basis: vendor}
      - {source: "set-up help page", url: "https://support.google.com/googlehealth/answer/14236818", quote: "may slow down the sync process and prevent an update", said_of: "setting up over a phone hotspot", basis: vendor}
      - {source: "scale help page, Aria 2 icon table", url: "https://support.google.com/googlehealth/answer/14236805", statement: "One icon covers a successful Wi-Fi connection or a completed update, one covers a failed connection or a failed update, and one means the scale is currently updating.", basis: vendor}
    not_a_source:
      url: "https://support.google.com/googlehealth/answer/14236401"
      why: "The 'About Fitbit Aria 2' page does not contain the word 'firmware' or mention an update. An earlier draft of this research cited it for the Wi-Fi claim; that citation was wrong."
    word_firmware_absent_from: {pages: ["answer/14236805", "answer/14236818", "answer/14236515", "answer/14236401", "answer/14236618"], fetched: "2026-11-24T01:54Z"}
    update_address: not_published
    image: not_published
    update_observed_in_transit: {found: false, basis: not_found}
    authentication: unknown

machine_observable_identifiers:
