    The IEEE registry lists address blocks assigned to Fitbit, but no source
    ties one to the FB202, and the two prefixes seen on original Arias are
    registered to GainSpan (maker of its Wi-Fi module) and to Delta
    Electronics (no source says why), not to Fitbit. Only a prefix observed on
    a scale counts.

