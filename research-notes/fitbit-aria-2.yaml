experiments:
  rules:
    - "Observe your own scale and network only."
    - "Before reporting: replace LAN addresses, hostnames you set, network name, Wi-Fi password, serial number and account identifiers with placeholders. Of a MAC or Bluetooth address report only the first three bytes."
    - "Send facts, never the capture file. A Bluetooth log of a Wi-Fi change may hold the Wi-Fi password."
    - "Keep deliberately failed syncs to four or fewer a day."
    - "On a scale you want to keep: never unpair it, never reset it, never press or hold its button, never write to anything over Bluetooth, and never answer a request from it that looks like an update check."
  ordered_by: "Value now that pairing has ended: first what can only be captured while it still exists, then what an owner most needs answered, then what the catalogue needs, then work that needs a scale with nothing to lose."
  leave_the_pairing_alone: [1, 3, 4, 5, 6]
  leave_the_pairing_alone_note: "They use none of the app's setup, network or removal functions and never press the scale's button."
  limits_on_that:
    - {applies_to: [5, 6], statement: "They take the scale's network away for a while. That its stored Wi-Fi settings survive failed joins is inferred (Google's troubleshooting assumes a scale survives a router restart); nobody has reported it for an Aria 2.", basis: inferred}
    - {applies_to: [4], statement: "The optional connect step is not passive. No source documents its effect on this scale; that it is harmless is inferred.", basis: inferred}
  order:
    - n: 1
      id: app_menu_observation
      group: on_a_paired_scale
      touches: nothing
      touches_pairing: false
      who: "Every owner, now."
      do: "Open Connections, then Aria 2. Note app version, date, and whether 'Wi-Fi Network' or 'Pair Scale to Different Network' is offered. Note whether the Add device list still shows the Aria 2. Look only; do not tap through."
      repeat: "Optional second look a week or two later. The other language editions still say 28 November, so it would show whether anything changes then. That date is not a deadline: by the English notice the change has already happened."
      settles: ["whether the block has reached the Aria 2", "whether the Wi-Fi change survives app 5.12"]
      catalogue_publishes: "A dated observation in this note and in owner guidance. No spec yet."
    - n: 2
      id: wifi_change_bluetooth_log
      group: on_a_paired_scale
      route: log_in_app_wifi_change
      requires: [1]
      only_if: "experiment 1 shows the control is still offered"
      urgency: "For those named in who, at once: the control may be gone tomorrow. Not a general instruction to every owner."
      touches: "The log: nothing. The change it records: the scale's network settings, through Google's own control."
      touches_pairing: {the_log: false, the_change_it_records: unknown}
      who: "Anyone about to change network anyway; a spare; an owner who accepts the stated unknown."
      before_you_tap: "The log is read-only, but what it records is the app changing the scale's network. Nobody has published a run of that since app 5.12. If the app starts the change and is then refused or interrupted, nobody knows what the scale is left holding, and a lost network can no longer be repaired by re-pairing."
      stop_rule: "If the app asks you to remove the scale, reset it, press or hold its button, or set it up as new, stop and back out. Nobody has published what even a brief press of the button keeps."
      steps:
        - {actor: user, action: "On an Android phone, switch on the developer option that logs Bluetooth traffic ('Enable Bluetooth HCI snoop log') and turn Bluetooth off and on."}
        - {actor: user, action: "Start the router log of experiment 3 for both the phone and the scale."}
        - {actor: user, action: "In the app: Connections, Aria 2, 'Wi-Fi Network' or 'Pair Scale to Different Network', Next; enter the SAME network the scale is already on and let it finish."}
        - {actor: user, action: "Weigh once and wait for the check mark."}
        - {actor: user, action: "Export the log (it is inside an Android bug report) and read it in a protocol analyser."}
      iphone_method: not_given
      record: ["which services and characteristics the app uses, and whether one is adabfb00-6e7d-4601-bda2-bffaa68956ba", "whether the link is encrypted", "whether the phone contacts Google's servers during the exchange, from the router log", "whether the network name and password cross in clear (yes or no; do not send them)", "what the scale then does on Wi-Fi", "what its display shows", "what the app asked you to do to the scale"]
      scrub: "The log holds the network name and password, the scale's Bluetooth address and serial number, and possibly an account token. Keep the file; send only derived facts."
      settles: ["whether the change is local between phone and scale or needs a round trip to Google", "which characteristics carry it", "whether the link is encrypted", "in practice, whether 're-pair' covers the Wi-Fi change"]
      catalogue_publishes: "The provisioning stage of the setup block; if local, possibly a Wi-Fi re-provisioning spec of its own."
    - n: 3
      id: passive_network_log
      group: on_a_paired_scale
      touches: nothing
      touches_pairing: false
      who: "Any owner who can log at the router."
      perishable: "Only possible while Google's servers still answer; Google names no end date."
      do: "Log DNS at the resolver and capture the scale's traffic at the router or a mirrored port for one normal weigh-in. Repeat once. If the log can run for several days, note any contact that is not a weigh-in. Look only: never answer it."
      record: ["first three bytes of the MAC", "DHCP hostname, vendor class and requested options", "every DNS name queried", "destination ports", "whether it asks for the time", "plain HTTP: request line, header names, body length", "TLS: protocol version, server name sent, issuer of the certificate shown", "broadcast or multicast traffic", "total bytes each way"]
      settles: ["names the scale depends on", "HTTP or TLS", "any resemblance to the original Aria", "first matcher candidates"]
      catalogue_publishes: "An identify-only spec, device-specs/devices/fitbit-aria-2.yaml: observed prefix in identification.mac_prefixes; each observed name in cloud.egress as verification reported, the sync name with when_blocked.impact breaks so no generated blocklist sinkholes it."
    - n: 4
      id: passive_bluetooth_scan
      group: on_a_paired_scale
      touches: nothing
      touches_pairing: false
      who: "Any owner with a scanner."
      do: "Scan for the scale when idle, when stepped on and just after a weigh-in. Do not press the button. Note whether adabfb00-6e7d-4601-bda2-bffaa68956ba is among the advertised services."
      record: [advertised name, advertised service UUIDs, manufacturer-data company identifier, address type, connectable flag]
      optional_active_step:
        do: "If connectable: connect, decline any pairing prompt, list services and characteristics with their properties, read the device-information strings, disconnect. Note whether the tracker service, its neighbour 558dfa00-4fa8-4105-9f02-4eaa93e62980, or any standard weight service is in the list. Write to nothing, and do not switch notifications on: that is a write."
        touches_pairing: unknown
        basis: inferred
        note: "No source documents what this scale does on a connection from an unknown device. That it is harmless is inferred. Skip it on a scale you depend on."
      settles: ["an identity matcher on the setup radio", "whether the Fitbit tracker service is reused", "whether any weight is offered over Bluetooth"]
      catalogue_publishes: "The Bluetooth identification for the identify-only spec. Experiment 3 or 4 alone is enough to publish it."
    - n: 5
      id: cloned_network
      group: on_a_paired_scale
      route: same_network_on_new_router
      touches: "The scale's network, for a while."
      touches_pairing: false
      who: "Any owner with a second access point."
      do: "Bring up a second access point with the identical network name, security mode and passphrase; switch the original off; weigh in. Vary one thing at a time: channel, WPA2-only against WPA2/WPA3 mixed, 802.11b rates disabled. Switch the original back on afterwards."
      settles: ["whether a router replacement can be survived with no app"]
      catalogue_publishes: "The router-replacement answer (setup.rejoin), and the untested label comes off route 1 and the owner guidance."
    - n: 6
      id: offline_behaviour
      group: on_a_paired_scale
      touches: "The scale's network, for a day."
      touches_pairing: false
      who: "Any owner."
      do: "With the access point off, weigh three or four times over a day, no more, writing each reading down. Note whether body fat is shown. Restore Wi-Fi, weigh once, count what reaches the account."
      settles: ["whether offline weigh-ins are kept at all", "a lower bound on how many", "usefulness of a stranded but configured scale"]
      catalogue_publishes: "Buffering and standalone behaviour as reported facts."
    - n: 7
      id: setup_attempts_on_an_unpaired_scale
      group: only_on_a_scale_already_unpaired_or_reset
      route: older_app_build_pairing
      touches: "Whatever the scale still holds."
      who: "Only a scale that is already unpaired or reset."
      never: "Never unpair or reset a working scale to run this."
      at_stake: "No pairing is left to lose. A scale removed from the account but never reset may still hold its people and its network; whether a failed setup clears them is not documented."
      steps:
        - {actor: user, action: "Scan the scale as in experiment 4; its setup state may advertise differently."}
        - {actor: user, action: "Attempt setup in the current app with the Bluetooth log and the router log of experiment 2 running; note exactly where it is refused."}
        - {actor: user, action: "If a phone or tablet still has an app older than 5.12, attempt setup there with the same logs."}
      expectation: "Do not expect it to work. Press reports say old builds are being shut out (local_routes, older_app_build_pairing, old_builds_reported_shut_out), so the older app may refuse to run, or insist on updating, before it reaches setup; if it does, that is the result to record."
      expectation_basis: reported
      settles: ["whether the block is in the app or on the servers", "whether an older build still pairs", "what the scale advertises in its setup state"]
      catalogue_publishes: "Pairing and setup blocks with the refusal point as a dated fact; if an older build pairs, that as a dated owner route with its conditions."
    - n: 8
      id: certificate_test
      group: changes_what_the_scale_talks_to
      requires: [3]
      only_if: "experiment 3 showed the upload is TLS; if it showed plain HTTP, skip to experiment 9"
      touches: "What the scale's sync reaches."
      who: "Not a scale you depend on."
      consequence: "Each failed attempt is a failed sync, and nobody has published what repeated failed syncs do to an Aria 2. Four or fewer a day."
      do: "Point the observed name at a TLS listener you run, by a DNS override scoped to the scale, one case per attempt. Record for each whether the scale completes the handshake and sends a request or aborts, the alert it gives, and the display. Remove the override and confirm a normal sync."
      never: "The listener only completes or refuses the handshake: it sends no reply, and it never answers anything that looks like an update check."
      cases: ["self-signed certificate", "certificate for the right name from an authority you created", "publicly trusted certificate for a different name", "expired certificate"]
      settles: ["whether the scale checks who it is talking to", "whether a local stand-in is possible at all"]
      catalogue_publishes: "If every stand-in is refused: the spec records the Wi-Fi door as closed and local_access.status stays none_known. If one is accepted: experiment 9 becomes possible."
    - n: 9
      id: pass_through_capture
      group: changes_what_the_scale_talks_to
      requires: [3]
      only_if: "experiment 3 showed plain HTTP, or experiment 8 showed the scale accepts a certificate that is not the vendor's"
      touches: "What the scale's sync reaches."
      who: "Not a scale you depend on."
      consequence: "While it runs, the scale's sync depends on your relay. A relay that fails is a failed sync, and nobody has published what repeated failed syncs do to an Aria 2."
      do: "Relay the sync through your own host while still forwarding to the real server; record request and response. Forward rather than answer locally until the response is understood. Relay every request and every reply unchanged and whole, not only the weigh-in upload."
      never: "Never alter or invent a reply that tells the scale an update is available: a wrong or cut-off image could leave it unable to start, and no image exists to restore it."
      genuine_update_in_transit:
        statement: "A genuine update can arrive while the relay is in the path: the scale updates itself, and while it syncs through your host anything the real server starts travels through it."
        basis: inferred
        basis_note: "This note's reasoning from its own premises. How this scale fetches an update is not known to anyone."
        rules:
          - "Relay every request and every reply unchanged and whole, not only the weigh-in upload."
          - "If your relay cannot pass a large download whole, do not run this experiment: a relay that drops a transfer part-way could leave the scale with the cut-off image named under never."
          - "If the scale shows its updating icon, leave the relay, the network and the batteries alone until it finishes, and do not step on."
        vendor_on_the_updating_icon: {quote: "Wait until the process completes before stepping on", basis: vendor, source: "https://support.google.com/googlehealth/answer/14236805"}
      settles: ["upload and response formats"]
      catalogue_publishes: "Possibly an owner-run server contract with independent test vectors."
    - n: 10
      id: board_photographs_and_pad_map
      group: case_open_spare_only
      touches: "The case."
      who: "An opened spare."
      do: "Photograph every chip marking: the host chip's part number, the flash chip's part number, the unmarked component by the antenna connectors. Peeling the barcode label is for a unit you are prepared to lose. Photograph the test pads square-on and say how many groups there are and how many pads in each: the readings of the FCC photograph differ (one cluster, or a group of ten and a group of six). With the batteries out and a meter only, trace each pad in every group to the chip pin it reaches. Report part numbers and pad functions only."
      settles: ["radio and microcontroller identity", "how many test pads there are, in how many groups, and what they carry", "whether a debug port, a boot-select pin or a serial line is brought out"]
      catalogue_publishes: "Hardware facts on the device page."
    - n: 11
      id: debug_identity_read_and_serial_listen
      group: case_open_spare_only
      route: debug_pads
      requires: [10]
      touches: "The board."
      who: "An opened spare; advanced."
      do: "Attach a debug probe and read the chip's identity code. Attempt one read of the program memory. On any serial line found, listen only: ground and the adapter's receive line, never its transmit line, after measuring the board's logic voltage."
      stop_rule: "If the read is refused, stop: read-out protection is on. Never issue the command that turns it off. That erases the chip, there is no Aria 2 image to put back, and the scale is dead for good. The built-in serial loader is behind the same protection and ends the same way."
      settles: ["the read-out protection level", "whether a console exists and what it prints at start-up"]
      catalogue_publishes: "Hardware facts only. No image or code."
    - n: 12
      id: flash_chip_clip_read
      group: case_open_spare_only
      route: flash_chip_clip_read
      touches: "The board."
      who: "An opened spare."
      do: "With the batteries out, clip a serial-flash reader onto the eight-lead chip and read it twice; the two reads must match. Do not write. Treat the dump as a secret. Report what kinds of data it holds, not the data."
      settles: ["what the external flash holds", "whether a firmware image or the stored network lives there"]
      catalogue_publishes: "Derived facts only."
    - n: 13
      id: load_cell_tap_on_the_bench
      group: case_open_spare_only
      route: load_cell_tap_without_cutting
      touches: "The cell wiring."
      who: "An opened spare."
      do: "On the table, with the Fitbit board still connected and running from its batteries, connect a hobby load-cell amplifier across the cell wiring without cutting anything. The amplifier and whatever reads it both run from batteries, with no lead to a computer or anything else plugged into the mains. Load the platform with known weights set down on it, not by pressing with a hand or standing on it. Note whether the amplifier reads a load and whether the scale's own reading stays right."
      load_with: known_weights_only
      never_load_with: [a hand, a person standing on it]
      power: {amplifier: batteries_only, whatever_reads_the_amplifier: batteries_only, lead_to_mains_powered_equipment: never}
      why: {statement: "With the Fitbit board running, its measuring current can reach whoever touches the glass, and a fault in mains-powered equipment attached to the scale could reach them too.", basis: inferred, from: "the vendor's description of how the scale measures body fat"}
      settles: ["whether the less destructive fallback exists", "which lead is which"]
      catalogue_publishes: "The wiring facts, and whether route 11 is real."
  bench_rules_apply_to: [10, 11, 12, 13]
  bench_rules: "See local_routes.bench_rules: an opened spare only; nobody stands or presses on the scale while anything is attached; nothing powered from the mains is in circuit with a person; facts are reported, never memory contents."

