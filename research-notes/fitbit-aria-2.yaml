      - {seen: "2026-11-24T03:10Z", editions: [de, fr, ja]}
  app_version_named: "5.12"
  wording:
    - "Starting November 9, 2026, with the release of app version 5.12, you can no longer pair or re-pair Aria and Aria 2 scales."
    - "If you choose to unpair your scale after this date, you will not be able to pair it again."
    - "Any scales that were paired prior to this date, and remain paired, will continue to sync."
    - "Previously synced data will not be impacted."
  wording_about_aria_air: "Aria Air is not impacted by this change."
  models_affected: [FB201, FB202]
  models_not_affected: [FB203]
  security_updates_ended_per_notice: {FB201: "2020", FB202: "2022"}
  not_stated_by_google:
    - an end date for syncing
    - any promise that syncing continues
    - "a definition of 're-pair'; whether it covers changing the Wi-Fi network is not said, though Google's own wording calls that change setup and pairing (see contradictions, wifi_change_is_repairing)"
    - "where the block is enforced: app, servers or both"
    - "which of its two published dates, 2026-11-09 or 2026-11-28, its systems enforce"
  aria_2_pairing_already_blocked:
    answer: vendor_says_ended_2026-11-09
    basis: vendor
    independent_observation: {found: false, basis: not_found, note: "No owner report of an Aria 2 pairing attempt, refused or accepted, dated after app 5.12 began rolling out was found. Reddit could not be searched."}
    reasons:
      - "Google's English notice, as read 2026-11-24, dates the end of pairing and re-pairing to 2026-11-09. Until 2026-11-23 it said 2026-11-28, and other language editions still do."
      - "The original Aria's web setup address already redirects to an 'Aria is no longer supported' page (observed 2026-11-23) whose Last-Modified header reads 2026-11-09 17:02:17 GMT (fetched 2026-11-24). That is the FB201's path; the Aria 2 has no web flow."
      - "A press article of 2026-11-20 says some Aria and Aria 2 owners cannot pair, but the only mechanism it describes is the web setup flow. It shows no Aria 2 being refused."
    already_unpaired_scale: {statement: "An owner whose scale is already unpaired or reset has no pairing left to lose by attempting setup now; where it is refused is experiment 7.", basis: inferred}
  contradictions:
    - id: date_differs_by_language_and_was_edited
      detail: "English notice: 2026-11-09. Until 2026-11-23 it said 2026-11-28, which the press article of 2026-11-20 quotes and eight other language editions still said on 2026-11-24. Every version ties its date to the release of app 5.12. Google's 5.12 rollout post is dated 2026-11-06 and 5.13 followed on 2026-11-20; neither post mentions a scale. 9 November falls inside the 5.12 rollout and matches the timestamp of the page that replaced the original Aria's web setup; 28 November was three weeks after the named version shipped. Google has not explained the edit or said which date its systems enforce."
      other_change_sharing_both_dates:
        what: "The end of installing or updating third-party apps and clock faces on Fitbit smartwatches. A different change; neither of its two pages mentions a scale."
        takes_effect: "2026-11-28"
        announced: "2026-11-09T20:35Z"
        announced_how: "the timestamp embedded in Google's community post"
        repeated_in: ["the app 5.13 rollout post", "https://support.google.com/googlehealth/answer/14237121"]
        also_names_app_version: "5.12"
        basis: vendor
        observation: "Each of the two dates the scale notice has carried coincides with a day of that other change: 2026-11-09 with its announcement, 2026-11-28 with its effect."
        link_to_the_scale_notice: not_stated_by_google
        why_the_english_text_now_says_november_9: not_stated_by_google
        owner_reading: "This reopens no window. By the English notice, pairing of the Aria 2 ended on 2026-11-09."
        sources: ["https://support.google.com/googlehealth/thread/477099339", "https://support.google.com/googlehealth/answer/14237121", "https://support.google.com/googlehealth/thread/478477332"]
      sources: ["https://support.google.com/googlehealth/answer/14236805", "https://support.google.com/googlehealth/blog/475060763", "https://support.google.com/googlehealth/thread/478477332", "https://aria1.fitbit.com/", "https://gadgetsandwearables.com/2026/11/20/fitbit-aria-support-cutoff-early/"]
    - id: security_update_end
      detail: "Help notice: Aria 2 security updates ended in 2022. Security-update table: guaranteed until at least September 2023."
      sources: ["https://support.google.com/googlehealth/answer/14236805", "https://support.google.com/product-documentation/answer/15181553"]
    - id: destructive_advice_left_standing
      detail: "The page that announces the cutoff still tells Aria 2 owners to factory-reset and set up again for guest problems, and still describes the in-app Wi-Fi change, without saying either may now be final. The sync-troubleshooting page its Aria 2 error table points to still says to remove 'other Fitbit devices' from the account, and to 'Disconnect device' then 'Add device' to clear connection errors, with no exception for a scale that cannot be added back."
      sources: ["https://support.google.com/googlehealth/answer/14236805", "https://support.google.com/googlehealth/answer/14236618"]
    - id: continue_to_sync_against_no_longer_connect
      detail: "Help notice: paired scales will continue to sync. The page that replaces the original Aria's web setup says Google no longer supports or connects to these scales and that their data cannot be viewed in the app. That page is titled for the Aria and does not name the Aria 2."
      sources: ["https://support.google.com/googlehealth/answer/14236805", "https://aria1.fitbit.com/"]
    - id: web_api_switch_off_day
      detail: "Google's developer site: legacy Fitbit Web API turned off 2026-11-02. Older banner on the Fitbit developer site: 2026-10-30."
      sources: ["https://developers.google.com/health/about", "https://dev.fitbit.com/build/"]
    - id: wifi_change_is_repairing
      detail: "Google's notice does not define 're-pair'. Its own wording describes the network change as setup and pairing (vendor_wording below). A press article asserts that after a router change the scale cannot be reconnected. That the block therefore covers the in-app Wi-Fi change is inferred; no Google statement says so in terms."
      basis: inferred
      basis_note: "vendor for the three quoted phrases; inferred for the conclusion drawn from them."
      vendor_wording:
        - {phrase: "using the setup method above", where: "both Aria 2 manual editions, the section on changing the Wi-Fi network"}
        - {phrase: "set up your Aria 2 again after you make changes to your network", where: "https://support.google.com/googlehealth/answer/14236818"}
        - {phrase: "Pair Scale to Different Network", where: "one of the two menu labels, https://support.google.com/googlehealth/answer/14236805"}
      sources: ["https://support.google.com/googlehealth/answer/14236805", "https://support.google.com/googlehealth/answer/14236818", "https://staticcs.fitbit.com/content/assets/help/manuals/manual_aria_2_en_US.pdf", "https://storage.googleapis.com/support-kms-prod/maAIG2kfodcmEajCR4DmV73m2pVsfok940UY", "https://gadgetsandwearables.com/2026/11/20/fitbit-aria-support-cutoff-early/"]

