# Fitbit Aria 2 (FB202) — structured research note, consolidated 2026-11-23,
# revised 2026-11-24 with a second research round on local routes
#
# NOT A SPEC. Nothing here is checked against device-specs/schema.json and
# nothing here was run on this project's hardware. No public source describes
# the Aria 2's Bluetooth or Wi-Fi protocol, so this file records identity,
# vendor-documented behaviour, the pairing cutoff (2026-11-09 in Google's
# English notice since an edit on 2026-11-23; 2026-11-28 before that edit and
# in other language editions), every local route anyone has proposed with its
# rating, the negative findings, and the experiments that would settle them.
#
# Rule for this file: a value appears only if a source states it. Anything
# unsettled is listed under `not_published` or `open_questions`; it is never
# written into a field as if it were known. There are deliberately no UUIDs
# and no hostnames OF THIS SCALE below, and no claim about whether its upload
# is plain HTTP or TLS: those appear only as questions. The UUIDs under
# `tracker_research` belong to Fitbit trackers. They are what a scan should
# look for; they are not identifiers of this scale and must not be used as a
# matcher for it.
#
# `basis` vocabulary: vendor (manual or help page, read 2026-11-23; the cutoff
# notice and the pages quoted beside it again 2026-11-24 00:22 and 01:54 UTC;
# the three notice pages once more at 03:10 UTC)
# | fcc (measured or stated in the public filing) | photo_read (read off the
# FCC internal photograph by this project's research; shows a part is on the
# board, never that a route through it works) | academic (peer-reviewed work
# on Fitbit TRACKERS; none mentions a scale) | reported (third party with the
# device, unchecked) | unverified (search snippet only) | inferred (this
# note's reasoning) | general (general knowledge about a chip family or a
# technique, not specific to this board and not re-read for this note) |
# not_found (looked; see `search`).
#
# `local_routes` vocabulary:
#   brick_risk: none | unknown | recoverable | unrecoverable. The chance of
#     leaving the scale unable to work as it does today. It rates the entry as
#     a whole; `brick_risk_parts`, where present, rates its steps separately.
#   standing: try_first |
#     only_if_changing_network_anyway_or_on_a_spare_then_at_once |
#     only_on_an_already_unpaired_scale | research_direction_not_a_route |
#     untested_blocked_on_unknown_protocol | bench_work_on_a_spare |
#     not_available | one_way_last_resort | undemonstrated_bench_work
#   not_a_route: true on the three entries that the checking pass said must
#     not be shown as routes. Its absence on the others claims nothing: no
#     entry here has been shown to work on this scale.
#   run_on_an_aria_2: false on every entry. Nobody has run any of them.
#
# Prose write-up: research-notes/fitbit-aria-2.md

