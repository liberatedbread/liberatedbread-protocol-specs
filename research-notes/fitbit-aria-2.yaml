owner_guidance:
  premise: "By Google's English notice pairing and re-pairing ended on 2026-11-09. Treat pairing as over; no window is left."
  do_not:
    - action: "Unpair the scale or remove it from the account."
      why: "Google: a scale unpaired after the cutoff date cannot be paired again, and by its English notice that date (2026-11-09) has passed. No owner report of an Aria 2 being refused or accepted was found, so treat the door as closed."
      basis: vendor
      app_label: "Disconnect device"
      app_path: [Connections, the scale, System, "Disconnect device"]
      ios_note: "On iPhone and iPad, removing yourself as a user of the scale is the documented first step of removing the scale; do not do that either."
      source: "https://support.google.com/googlehealth/answer/14236818"
    - action: "Factory-reset it."
      why: "Erases the stored Wi-Fi networks, stored weights and all other user data on the scale; the scale then prompts for setup, which Google says has ended. Irreversible by any documented means."
      basis: inferred
      warning: "Google's own troubleshooting for guest weigh-ins still ends in a factory reset. Stop after the 30-second battery removal."
    - action: "Follow Google's sync troubleshooting for another device as far as removing 'other Fitbit devices', or 'Disconnect device' then 'Add device', where that would include the Aria 2."
      why: "Once disconnected the Aria 2 cannot be added back. The advice appears in four places on the sync-troubleshooting page: the tracker step names 'trackers or watches'; the Pixel Watch and Aria Air steps say 'other Fitbit devices' without limit; the fourth is the disconnect-then-add step for clearing connection errors. The Aria 2 error table sends owners to that page when the scale is not syncing."
      basis: inferred
      basis_note: "vendor for the advice and its wording; inferred for the consequence."
      source: "https://support.google.com/googlehealth/answer/14236618"
    - action: "Touch the battery-bay button while fitting batteries."
      why: "The reset is that button held while the batteries go in."
      basis: vendor
    - action: "Remove people from the scale."
      why: "Whether a person can be added back after the cutoff is not stated."
      basis: inferred
    - action: "Change the Wi-Fi name, password, security mode or router if it can be avoided."
      why: "Reconnecting is done in the app over Bluetooth. Google has not said that survives the cutoff, and its own wording calls the network change setup and pairing, so treat the in-app change as already gone unless experiment 1 shows otherwise (that last step is inferred; see vendor_documented.wifi_change.survives_cutoff)."
      basis: vendor
    - action: "Point the scale at a server written for the original Aria, or apply a network-wide DNS override for any Fitbit name."
      why: "Nobody has shown the Aria 2 speaks that protocol, and which names it depends on is unknown."
      basis: inferred
    - action: "Open a scale you depend on."
      why: "Everything that involves the board is bench work for a spare; see local_routes.bench_rules."
      basis: inferred
    - action: "Expect a phone or computer to read your weight from it over Bluetooth."
      why: "Bluetooth is the setup channel only; by Google's description weigh-ins travel over Wi-Fi to its servers. No source shows this scale offering a weight over Bluetooth."
      basis: inferred
  untested_suggestion:
    id: cloned_network
    route: same_network_on_new_router
    standing: try_first
    action: "When replacing a router, give the new one the same network name, the same security mode and the same passphrase, and keep the old router until the scale shows its check mark."
    tested_on_aria_2: false
    basis: inferred
    reason: "A Wi-Fi client normally joins any access point presenting the network it already knows. Nobody has published a result for this scale. It uses neither the app nor the scale's setup, so a failed try should be undoable by switching the old router back on."
    undo_by_restoring_old_router: {expected: true, basis: inferred, note: "Google's troubleshooting assumes the scale survives a router restart, but nobody has reported what an Aria 2 does after repeated failed joins, and one commenter's unnamed Fitbit scale had to be paired again after dropping off Wi-Fi on low batteries."}
    stay_within: "2.4 GHz b/g/n; WEP / WPA / WPA2 personal; DHCP; name and password at most 32 characters each; no sign-in page."
  if_already_unpaired_or_reset:
    still_weighs: {answer: true, shows: "weight only", basis: vendor}
    try: "Setup with the current app, and with an app older than version 5.12 if a phone or tablet still has one (experiment 7)."
    at_stake: "No pairing, because none is left. A scale that was unpaired but never reset may still hold its people and its network; whether a failed setup clears them is not documented."
    expectation: "Do not expect either to work. If the block is on Google's servers an older app is refused as well, and press reports say old enough builds no longer run at all (see local_routes, older_app_build_pairing)."
    never: "Never unpair or reset a working scale to test this."
    route: older_app_build_pairing
    basis: inferred
  still_true:
    - {statement: "It weighs and shows weight with no network and no account.", basis: vendor}
    - {statement: "A new phone should not matter; sign in on the new phone and do not remove the scale in the old phone's app.", basis: inferred}
    - {statement: "Replace batteries when the low-battery icon shows; one commenter had to pair 'that Fitbit scale' again whenever batteries ran low (model not named).", basis: reported}
  data_export:
    - {route: "Google Takeout with Google Health selected", state: "documented export for Google-account users", basis: vendor, source: "https://support.google.com/googlehealth/answer/14236615"}
    - {route: "Google Health API, weight and body-fat data types", state: "live; lists the Aria 2 as compatible; restricted scopes; unverified apps limited to 100 users", basis: vendor, sources: {data_types_and_compatible_devices: "https://developers.google.com/health/data-types", restricted_scopes: "https://developers.google.com/health/about", unverified_app_user_limit: "https://developers.google.com/health/app-verification"}}
    - route: "Health Connect on Android"
      state: "Google's help lists Weight and Body fat percentage among the data types the Google Health app can write to Health Connect."
      basis: vendor
      source: "https://support.google.com/googlehealth/answer/14506680"
      scale_weigh_ins_written: {statement: "One forum post of 2026-09-28, which addresses an Aria 2 owner by name, says the Aria's weight and body fat reach Health Connect the same way, from where another app can forward them.", basis: reported, caveat: "one post, whose author wrote the forwarding app it recommends; read directly on 2026-11-24", source: "https://community.home-assistant.io/t/fitbit-migration-to-google-health/1010341"}
    - {route: "Legacy Fitbit Web API", state: "switched off 2026-11-02, answers HTTP 410; older sync tools built on it are dead", basis: vendor}
    - {route: "fitbit.com Data Export", state: "documented only for accounts still on a Fitbit login; those logins ended 2026-05-19", basis: vendor}
  export_note: "All routes read the cloud copy. None is a local route, and none helps a scale that has lost its pairing or its Wi-Fi."

local_use_without_vendor:
  answer: none_known
  routes_run_on_an_aria_2_by_anyone: 0
  bluetooth_reads_a_weight:
    expected: false
    basis: inferred
    from: "Google's description: the Aria 2 uses Wi-Fi to connect directly to the router, while trackers, watches and the Aria Air sync over Bluetooth."
    caveat: "Nobody has listed the scale's Bluetooth services, so this rests on the vendor's description and not on an observation. Experiment 4 would show it if the inference were wrong."
  setup_access_point_on_the_scale: {present: false, basis: vendor, note: "by absence; that was the original Aria's method"}
  web_page_on_the_scale: {present: false, basis: vendor, note: "by absence"}

local_routes:
  how_rated: "A second research round listed every route anyone could propose; a separate pass then opened each cited source and re-rated it. Where the two disagreed, the stricter rating is the one recorded."
  listing_is_not_endorsement: "Being listed does not make something a route. own_client_bluetooth_reprovisioning, firmware_over_bluetooth and firmware_over_wifi are listed only so that nobody mistakes them for one."
  reading_rules:
    - "Nothing here has been run on an Aria 2 by anyone."
    - "A part seen in a photograph is not a route."
    - "Re-pairing has ended, so a step that makes the scale forget its network or its account can no longer be repaired the normal way."
  bench_rules:
    applies_to: [debug_pads, flash_chip_clip_read, load_cell_replacement, load_cell_tap_without_cutting]
    spare_only: "Opening the scale (battery-bay label, two Torx T10 screws, prying the base off the glass) puts a working scale at risk. Bench work is for a spare, never a scale you depend on."
    nobody_on_the_scale: "Nobody stands on the scale while anything is attached to it. The scale passes a small current through the feet to measure body fat (vendor), so its circuit is in contact with the person on it. That holds for a hand pressed on the glass as much as for feet (inferred). A debug probe, serial adapter, flash programmer or computer powered from the mains must never be part of that circuit: a fault in mains-powered equipment would then have a path through the person. Anything added to a scale that will be stood on again runs from batteries."
    power_rule:
      added_electronics_power: batteries_only
      never: ["a mains adapter", "a computer's USB port", "a lead to anything plugged into the mains while a person touches the scale"]
      applies_while: "anyone stands on, or presses on, the scale"
      basis: inferred
      from: "the vendor's statement that the scale passes a small current through the body, and general electrical safety"
    facts_not_contents: "A dump of either memory is a firmware extraction and may hold the Wi-Fi password and account material. No image or code from it may be sent to or committed in this project."
  routes:
    - n: 1
      id: same_network_on_new_router
      name: "New router with the old network name, security mode and passphrase"
      evidence: "Ordinary Wi-Fi behaviour."
      evidence_basis: inferred
      run_on_an_aria_2: false
      needs: ["a router or access point configured with the identical network name, security mode and passphrase"]
      gives: "A paired scale keeps syncing through a router change, with no app."
      brick_risk: none
      brick_risk_basis: inferred
      pairing_effect: "Leaves it alone."
      standing: try_first
      note: "Untested on this model. A failed try should be undoable by switching the old router back on (inferred)."
      experiment: 5
    - n: 2
      id: log_in_app_wifi_change
      name: "Log the app's own Wi-Fi change"
      evidence: "The control is vendor-documented; the capture method is inferred; whether the control still works since app 5.12 is unknown."
      evidence_basis: inferred
      run_on_an_aria_2: false
      needs: ["an Android phone with its Bluetooth traffic log switched on", "a router log of the phone and the scale", "an app that still offers the Wi-Fi change"]
      gives: "The one dataset that says whether a paired scale can ever be moved to a new network without Google."
      brick_risk: unknown
      brick_risk_parts: {the_log: none, the_change_it_records: unknown}
      brick_risk_note: "The log is read-only and adds no risk of its own; the second round and its check rated it none. The route cannot be run without the app's Wi-Fi change, which is untested since app 5.12, so the route as a whole is rated by that step."
      underlying_action:
        what: "The app's Wi-Fi change with the same network entered again."
        tested_since_app_5_12: false
        risk: unknown
        consequence: "If the app starts the change and is then refused or interrupted, nobody knows what the scale is left holding. If it has dropped its stored network, the only documented way to put one back is this same control, and Google says re-pairing has ended."
        stop_rule: "If the app asks you to remove the scale, reset it, press or hold its button, or set it up as new, stop and back out."
        stop_rule_reason: "Nobody has published what even a brief press of the button keeps (vendor_documented.restart.what_it_keeps)."
      pairing_effect: "The log does not touch it. The change it records: unknown."
      standing: only_if_changing_network_anyway_or_on_a_spare_then_at_once
      for_whom:
        - "an owner who must change the network anyway"
        - "a spare scale"
        - "an owner who accepts underlying_action.consequence"
      not_for: "A working scale with no network change coming, unless its owner accepts underlying_action.consequence: a refused or interrupted change may leave the scale without a network for good."
      urgency: "For those in for_whom, at once: the control may already be gone."
      note: "The control may already be gone; experiment 1 is the one-minute look that says."
      experiment: 2
    - n: 3
      id: older_app_build_pairing
      name: "Pair with an app build older than 5.12"
      evidence: "None. Google ties the block to the release of app 5.12 and does not say where it is enforced; the pass that checked this route judged the servers more likely. Press reports say old builds are already being shut out (old_builds_reported_shut_out)."
      evidence_basis: inferred
      run_on_an_aria_2: false
      needs: ["a scale that is ALREADY unpaired or reset", "a phone or tablet whose app is older than 5.12"]
      gives: "If the block is in the app only, the normal setup back."
      brick_risk: none
      pairing_effect: "Only for a scale that is already unpaired. A failed attempt costs no pairing, because none is left; a scale that was unpaired but never reset may still hold its people and its network, and whether a failed setup clears them is not documented."
      at_stake: {pairing: none_left, stored_people_and_network_on_a_scale_never_reset: "may still be held; whether a failed setup clears them is not documented"}
      standing: only_on_an_already_unpaired_scale
      warnings:
        - "Never unpair or reset a working scale to test this."
        - "May well not work."
        - "This project did not obtain or examine any app build. An app package from an unofficial download site is software of unknown origin that is then given a Google account sign-in; this note links none."
        - "The Fitbit app became the Google Health app on 2026-05-19 and Fitbit-account sign-in ended after that date (vendor); a build from before then may not sign in at all (inferred)."
        - "Old builds are reported to be shut out already (press, one outlet): an older build may refuse to run, or insist on updating, before it ever reaches setup (inferred from old_builds_reported_shut_out)."
      old_builds_reported_shut_out:
        basis: reported
        basis_note: "Press, one outlet, two articles; not checked by this project."
        reports:
          - {published: "2026-06-25", statement: "A Google notice gave 2026-07-15 as the day app versions older than 5.0 stop working.", versions_older_than: "5.0", stop_working: "2026-07-15", source: "https://gadgetsandwearables.com/2026/06/25/google-is-about-to-kill-the-old-fitbit-app-workaround/"}
          - {published: "2026-10-11", statement: "Owners still on the old app were being met by update prompts that would not let them carry on; a few could still dismiss the prompt.", source: "https://gadgetsandwearables.com/2026/10/11/fitbit-holdouts-forced-google-health-update/"}
          - {published: "2026-10-11", statement: "App version 5.08, in September, dropped sign-in with a Fitbit account.", app_version: "5.08", source: "https://gadgetsandwearables.com/2026/10/11/fitbit-holdouts-forced-google-health-update/"}
        consequence: {statement: "An older build may refuse to run, or insist on updating, before it reaches setup.", basis: inferred}
      fitbit_account_sign_in_ended:
        readings:
          - {when: "after 2026-05-19", basis: vendor, source: "https://support.google.com/googlehealth/answer/14237024"}
          - {when: "in September 2026, with app version 5.08", basis: reported, source: "https://gadgetsandwearables.com/2026/10/11/fitbit-holdouts-forced-google-health-update/"}
        resolved: false
        note: "Possibly the policy date and the app change. Either way a build from before then may not sign in."
      sources: ["https://support.google.com/googlehealth/answer/17068213", "https://support.google.com/googlehealth/answer/14237024", "https://gadgetsandwearables.com/2026/06/25/google-is-about-to-kill-the-old-fitbit-app-workaround/", "https://gadgetsandwearables.com/2026/10/11/fitbit-holdouts-forced-google-health-update/"]
      experiment: 7
    - n: 4
      id: own_client_bluetooth_reprovisioning
      name: "Send new Wi-Fi details over Bluetooth from your own client"
      evidence: "None: no published services and no capture. Plausible only by analogy with Fitbit trackers."
      evidence_basis: inferred
      run_on_an_aria_2: false
      needs: ["the scale's Bluetooth provisioning exchange, which is unknown", "possibly something only Google's servers issue"]
      gives: "In theory, a paired scale moved to a new network with no cloud."
      brick_risk: unknown
      pairing_effect: "A lost network or account link could not be repaired by re-pairing."
      standing: research_direction_not_a_route
      not_a_route: true
      warnings:
        - "A write that goes wrong, or one that works and makes the scale drop its stored network or its account link, cannot be repaired by re-pairing, because re-pairing has ended. The loss would be permanent by any normal means."
        - "This note gives no bytes to send. Nobody should send any to a scale they depend on."
      experiment: 2
    - n: 5
      id: dns_override_and_lan_server
      name: "DNS override plus a LAN server, the original Aria's route"
      evidence: "Works on the original Aria. Untested on the Aria 2; the two FB201 projects that mention this model call it unsupported and untested."
      evidence_basis: reported
      run_on_an_aria_2: false
      needs: ["the upload hostname", "whether the upload is plain HTTP or TLS", "whether the scale checks certificates", "the upload and reply formats"]
      needs_status: all_unknown
      gives: "In theory, local weigh-ins with no cloud."
      brick_risk: none
      brick_risk_scope: "a passive look at the traffic"
      pairing_effect: "Leaves it alone."
      standing: untested_blocked_on_unknown_protocol
      warnings:
        - "A stand-in server must never tell the scale that a firmware update is available: a wrong or cut-off image could leave the scale unable to start, and no image exists to restore it."
        - "Scope any DNS override to one device; a network-wide override for a Fitbit name could cut a paired Aria 2 off."
      experiment: 3
    - n: 6
      id: debug_pads
      name: "Debug pads on the board"
      evidence: "Bare test pads (two groups by the latest reading of the photograph; one cluster by earlier readings) and an ST ARM microcontroller are photo-read. Nobody has connected to anything; which group serves which chip, and which pad is which, is unknown."
      evidence_basis: photo_read
      route_demonstrated: false
      run_on_an_aria_2: false
      needs: ["an opened spare", "the pad functions, which are unknown", "a debug probe", "read-out protection being off, which is unknown"]
      gives: "In theory, a read of the host firmware."
      brick_risk: unknown
      brick_risk_note: "Reading the chip's identity code is harmless. There is an unrecoverable branch: forcing read-out protection off erases the chip, and no Aria 2 firmware image exists to put back."
      pairing_effect: "Reading: none. Erasing or patching: destroys it."
      standing: bench_work_on_a_spare
      read_out_protection:
        basis: general
        levels: ["off", "on: a debugger can attach but cannot read program memory, and turning protection back off erases the whole chip", "permanent: debug access disabled for good"]
        usual_on_production_devices: "on"
        level_on_this_chip: unknown
        note: "General to ST's ARM microcontroller families, from the maker's documentation; not re-read for this note, and the exact part on this board is unknown."
      warnings:
        - "If the first read of the program memory is refused, stop. Never use the command that turns read-out protection off: it erases the chip, no image exists to restore, and the scale is then dead for good."
        - "Probing unlabelled pads with the batteries in risks shorting neighbours."
      sub_routes:
        - id: built_in_serial_loader
          what: "A loader built into chips of this family, entered by holding a boot-select pin at power-up, that reads and writes program memory over a serial line."
          basis: general
          same_protection_gate: true
          boot_select_pin_brought_out_here: unknown
          warning: "With protection on it will not read, and removing protection through it erases the chip just the same."
        - id: serial_console
          what: "A serial console, if one exists. The original Aria had one; nothing shows this board does."
          exists_here: unknown
          rule: "Listen only: ground and the adapter's receive line, never its transmit line. Measure the board's logic voltage first; it is not published."
          warning: "Tracker firmware studied by academics had an unauthenticated factory console able to change a tracker's serial number and key, so typing into a console here could change the scale's identity or state."
          value: "Low: diagnostics at best. A way to point the scale at another server through it is a guess."
      experiment: 11
    - n: 7
      id: flash_chip_clip_read
      name: "Clip-on read of the flash chip"
      evidence: "An eight-lead chip with the Macronix logo is photo-read; that it is serial flash is inferred from the maker and package. A read is undemonstrated and the contents are unknown."
      evidence_basis: photo_read
      route_demonstrated: false
      run_on_an_aria_2: false
      needs: ["an opened spare", "a test clip and a serial-flash reader", "batteries out"]
      gives: "What the external flash holds."
      contents: unknown
      contents_note: "Display assets, logs, settings, stored networks and a firmware image are all possible and none is shown."
      covered_by_microcontroller_read_out_protection: {answer: false, basis: general}
      brick_risk: recoverable
      brick_risk_note: "Reading is non-destructive (none). Writing is recoverable only from a dump taken first; a bad write with no good dump, or a board that checks the chip and then refuses to start, can be unrecoverable. Desoldering adds the risk of lifting pads."
      pairing_effect: "Reading: none."
      standing: bench_work_on_a_spare
      warnings:
        - "Read only. Writing is for a sacrificial unit, and only after two reads that match."
        - "Whether an in-circuit read works on this board is untested."
      experiment: 12
    - n: 8
      id: firmware_over_bluetooth
      name: "Firmware over Bluetooth, as on Fitbit trackers"
      evidence: "Shown only on trackers, and only where the tracker ran unencrypted or its key had been extracted. Never shown on any scale."
      evidence_basis: academic
      run_on_an_aria_2: false
      needs: ["a per-device key held inside the device, which no owner can obtain", "the image format", "tools"]
      needs_status: none_public
      gives: "Nothing today."
      brick_risk: unknown
      pairing_effect: "Would replace the firmware."
      standing: not_available
      not_a_route: true
      why_not_available: "Flashing was shown in two cases only: trackers running unencrypted, which the paper describes as an option on models from before 2015; and two early models whose key could be read out of the device through a weakness Fitbit patched in October 2017. A 2017 product would be expected to always encrypt (inferred), so an image would need a per-device key no owner can obtain. The image format and tools for this scale are not public. Nobody has shown any Fitbit scale accepting firmware over Bluetooth, and nobody knows whether this one takes updates that way at all."
      warnings:
        - "Do not attempt it on a scale you want: nothing says a failed attempt could be recovered."
    - n: 9
      id: firmware_over_wifi
      name: "Firmware over Wi-Fi"
      evidence: "None. No update address for this model is documented anywhere."
      evidence_basis: not_found
      run_on_an_aria_2: false
      needs: ["an update address", "an image", "knowledge of how an update is authenticated"]
      needs_status: none_exist_publicly
      gives: "Nothing today."
      brick_risk: unknown
      pairing_effect: "Would replace the firmware."
      standing: not_available
      not_a_route: true
      why_not_available: "The scale updates itself and the help text ties updates to the Wi-Fi connection, but no update address is documented, no image has been published, nobody has observed an update in transit, and how an update is authenticated is unknown. There is nothing to try. The original Aria's update address belongs to a different design and nothing ties it to this model."
      warnings:
        - "Never offer or signal an update to the scale from a server of your own: a wrong or cut-off image could leave the scale unable to start, and no image exists to restore it."
    - n: 10
      id: load_cell_replacement
      name: "Replace the electronics with your own load-cell amplifier"
      evidence: "Four load cells are photo-read. The technique is generic and widely used; nobody has published doing it on this chassis, and which lead is which is not published."
      evidence_basis: photo_read
      route_demonstrated: false
      run_on_an_aria_2: false
      needs: ["an opened scale", "cutting the load-cell leads", "a hobby load-cell amplifier and a small microcontroller, both running from batteries", "calibration with known weights"]
      gives: "A weighing platform that depends on nobody."
      loses: [the Fitbit board, the pairing and account link, body fat, user recognition, "the display, which has no published interface"]
      brick_risk: unrecoverable
      pairing_effect: "Ends it for good."
      standing: one_way_last_resort
      added_electronics_power: batteries_only
      warnings:
        - "One-way. The Fitbit function does not come back."
        - "This is the one route that ends with someone standing on a rewired scale. Whatever is added runs from batteries, never from a mains adapter or a computer's USB port, for as long as anyone stands on it: a fault in mains-powered equipment wired into a scale could reach the person on it (general electrical safety, not specific to this scale)."
        - "While it is on the bench and connected to a computer for calibration, load it with weights, not with a person."
        - "local_routes.bench_rules apply."
    - n: 11
      id: load_cell_tap_without_cutting
      name: "Tap the load cells without cutting them"
      evidence: "None. A second amplifier can sometimes share load-cell wiring that stays attached to its original board; whether it works here depends on how the board drives the cells, which is unknown."
      evidence_basis: general
      route_demonstrated: false
      run_on_an_aria_2: false
      needs: ["an opened spare", "a hobby load-cell amplifier and whatever reads it, both running from batteries, with no lead to anything plugged into the mains"]
      gives: "If it works, a local weight reading with the Fitbit electronics still alive."
      brick_risk: unknown
      pairing_effect: "Should leave it alone; unproven."
      standing: undemonstrated_bench_work
      added_electronics_power: batteries_only
      warnings:
        - "It may read nothing useful or disturb the scale's own readings."
        - "Nobody stands or presses on the scale while the amplifier is attached; local_routes.bench_rules apply."
      experiment: 13
  ruled_out:
    - {idea: "Joining a setup access point or opening a web page on the scale", why: "The Aria 2 has neither; all setup and network changes go through the app over Bluetooth.", basis: vendor}
    - {idea: "Pointing the scale, as it is, at a server written for the original Aria", why: "Not shown to speak that protocol; see dns_override_and_lan_server.", basis: reported}
    - {idea: "Using the Aria Air's Bluetooth recipe", why: "A different product: Bluetooth-only data path, different hardware, a different FCC filing, no Wi-Fi.", basis: inferred}
    - {idea: "The original Aria's Wi-Fi-module download mode and labelled switches", why: "Different hardware: the FB201's Wi-Fi module is not on this board.", basis: photo_read}
    - {idea: "Checking whether a firmware address for this model still answers", why: "None is published, so there is nothing to check. This project did not guess addresses.", basis: not_found}
    - {idea: "Google Takeout, the Google Health API, Health Connect", why: "They read Google's copy for a paired scale. They are not local.", basis: vendor}
  rating_disagreement:
    subject: "Is logging the in-app Wi-Fi change safe for a scale you depend on?"
    first_draft: "Placed among experiments not safe for such a scale, because nobody knows what a refused change leaves behind."
    second_round_and_its_check: "The capture is read-only, with no risk to the scale or the pairing."
    recorded_as: "Both, in brick_risk_parts: none for the log, unknown for the change it records. By how_rated the stricter of the two is the route's brick_risk, so it reads unknown."

tracker_research:
  what: "Peer-reviewed reverse engineering of Fitbit TRACKERS. Recorded because the Aria 2 is added in the same app and its host chip comes from the same maker as the host chip of the tracker those authors took apart."
  mentions_a_scale: false
  mentions_a_scale_check: "IMWUT 2018, RAID 2017 and TCHES 2022 papers text-searched: 'Aria' never appears, and 'scale' appears only in the sense of 'at scale' or 'large scale'."
  link_to_the_aria_2: {shown: false, basis: not_found}
  established_for_trackers:
    basis: academic
    source: "https://homepages.inf.ed.ac.uk/ppatras/pub/imwut18.pdf"
    findings:
      - id: link_opening_has_no_security
        statement: "The link between app and tracker is opened by a proprietary exchange, not standard Bluetooth pairing, with no security of its own: any device in radio range could open it and request data or deliver a server reply."
        would_mean_here: "An owner's own computer could probably open a link to the scale. That says nothing about being allowed to change its network."
      - id: account_link_needs_the_servers
        statement: "Tying a tracker to an account ran through the vendor's servers, with proof of presence such as tapping the tracker or typing a code it shows."
        would_mean_here: "First-time setup would need Google, the step Google says has ended. Whether a later Wi-Fi change also needs the servers is the open question."
      - id: per_device_key
        statement: "Tracker data is encrypted with a 128-bit key set per device at manufacture. Models before 2015 could run unencrypted; Fitbit then moved them to always encrypt."
        key_bits: 128
        would_mean_here: "A 2017 product would be expected to always encrypt, so its exchanges would be unreadable without a key held inside the device."
      - id: firmware_update_path
        statement: "A firmware update reaches a tracker inside a server reply relayed by the app, normally encrypted with that key and protected by checksums. Trackers running unencrypted accepted modified and older images over Bluetooth, and so did two early models once their key had been read out through a weakness patched in October 2017. The firmware is in two sections, a small loader and the main program, so that one can repair the other."
        would_mean_here: "See local_routes, firmware_over_bluetooth: not available."
      - id: factory_console
        statement: "The firmware contained a factory console with no authentication, able to set a tracker's serial number and key."
        would_mean_here: "Why a serial line on this board is to be listened to and never typed into."
      - id: tracker_hardware
        statement: "One tracker's hardware: an ST ARM microcontroller as host and a separate Bluetooth chip from another maker."
        would_mean_here: "The same maker as the ARM chip photo-read here. Nothing more follows."
    would_mean_here_basis: inferred
  tracker_service:
    belongs_to: "Fitbit trackers, not this scale"
    service_uuid: "adabfb00-6e7d-4601-bda2-bffaa68956ba"
    characteristic_uuids:
      - "adabfb01-6e7d-4601-bda2-bffaa68956ba"
      - "adabfb02-6e7d-4601-bda2-bffaa68956ba"
      - "adabfb03-6e7d-4601-bda2-bffaa68956ba"
      - "adabfb04-6e7d-4601-bda2-bffaa68956ba"
    second_service_uuid: "558dfa00-4fa8-4105-9f02-4eaa93e62980"
    observed_on: "a Fitbit Charge 2 tracker, in one hobbyist's published scan"
    basis: reported
    source: "https://remyhax.xyz/posts/adventures-in-bluetooth-2/"
    printed_in_the_papers: false
    on_the_aria_2: unknown
    use_as_a_matcher_for_this_scale: never
    why_never: "Unobserved on this scale; and even if present it is shared with trackers, so it could not identify the scale by itself."
  settling_scan:
    experiment: 4
    writes: none
    look_for: "adabfb00-6e7d-4601-bda2-bffaa68956ba"
    where: ["the services the scale advertises", "its service list, if it accepts a connection without pairing"]
    outcomes:
      present: "The scale reuses the tracker stack; the tracker research becomes relevant to it, with Wi-Fi provisioning as a step no tracker had."
      absent_from_the_full_service_list: "A different service, standard or bespoke; the tracker work does not apply."
      absent_from_the_advertisement_only: "Nothing is settled: a device need not advertise every service it has."

negative_findings:
  summary: "No public source gives any part of the Aria 2's wire protocols, and no interception attempt of any kind, successful or failed, was found. No route in local_routes has been run on an Aria 2 by anyone."
  not_published:
    bluetooth:
      - advertised name, service UUIDs, manufacturer-data company identifier, address type
      - the GATT table
      - "bonding, link encryption, pairing method"
      - what the reported four-digit code is for
      - whether the Wi-Fi network list comes from the scale or the phone
      - how the Wi-Fi password is protected in transit
      - whether Google's servers take part in provisioning
    wifi:
      - MAC prefix
      - DHCP hostname and options
      - any DNS name or port
      - whether the transport is plain HTTP or TLS
      - any certificate observation
      - "request path, payload, response contents"
      - retry rules and offline buffer depth
      - any listening port or multicast traffic
    firmware:
      - "any image, update address, extraction or analysis"
      - how an update is authenticated
      - any CVE or advisory for this model
      - any open-source licence notice naming its software stack
    hardware:
      - the radio chip
      - the exact microcontroller part
      - the chip under the barcode label
      - what the board's test pads carry
      - the microcontroller's read-out protection level
      - what the flash chip holds
      - which load-cell lead is which
  do_not_borrow_from:
    - {product: "Fitbit Aria (FB201)", why: "Its plain-HTTP upload is documented, but nobody has reported pointing an Aria 2 at such a server. Its Wi-Fi module, serial console and download mode are a different design and are not on this board."}
    - {product: "Fitbit Aria Air (FB203)", why: "Bluetooth only, a different filing, no Wi-Fi; nothing links its GATT layout to the Aria 2."}
    - {product: "Fitbit trackers", why: "Their Bluetooth service is studied in academic work that never mentions a scale. Reuse is a hypothesis for experiment 4, not a fact; see tracker_research."}
  unverified_snippets:
    firmware_versions: {values: ["23.21.6.0", "23.25.4.0", "23.27.2.0"], latest: "23.27.2.0", basis: unverified}
    offline_buffering: {statement: "Owners say weigh-ins taken offline appeared later.", count: unknown, basis: unverified}

