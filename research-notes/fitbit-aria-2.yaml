      model_named: false
      cause: unknown
      basis: reported
      read: "directly, 2026-11-24"
      two_readings:
        - "The scale stopped reaching Google."
        - "Weigh-ins stopped reaching Home Assistant: the thread is about Home Assistant's cloud integration, and on 2026-07-08 the same user wrote that a newer Google Health component supports scales and seems to work."
      which_reading: not_stated_by_the_post
      source: "https://community.home-assistant.io/t/fitbit-migration-to-google-health/1010341"
    - {statement: "The public page of one personal connector, last updated 2026-08-23, describes it as reading Aria 2 weight and body-fat measurements through the Google Health API.", basis: reported, caveat: "a description of the tool, not a dated sync observation", source: "https://github.com/SarelBeets/donna-fitbit-health"}
  vendor_app_acquired: false
  firmware_acquired: false
  uuids_recovered: false
  uuids_note: "The UUIDs under tracker_research were read from a public write-up about a tracker. None was recovered from, or observed on, this scale."
  protocol_recovered: false
  hardware_session_needed: true
  next_steps:
    - "Owner runs experiment 1 now. If the Wi-Fi change is still offered, an owner who must change network anyway, has a spare, or accepts the stated unknown logs it at once (experiment 2). It is not an instruction to every owner."
    - "Owner runs experiments 3 and 4; either one yields the first identifier, and 4 answers the tracker-service question."
    - "Publish device-specs/devices/fitbit-aria-2.yaml as identify-only, with a device page, once any identifier is reported."
    - "Owner runs experiment 5; publish the router-replacement answer."
    - "Owner of an already-unpaired scale runs experiment 7."
    - "Retry the Wayback Machine for the retired forum threads listed under sources."
    - "Search Reddit, which this pass could not reach."
