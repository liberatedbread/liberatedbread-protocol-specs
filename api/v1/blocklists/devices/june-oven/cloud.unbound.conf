# Liberated Bread DNS blocklist: profile 'cloud', device 'june-oven', format 'unbound'
# Generated from cloud.egress in https://github.com/liberatedbread/liberatedbread-protocol-specs
# by scripts/generate_blocklists.py. Do not edit this file; fix the spec.
#
# Every host the device itself contacts, except time sources. The DNS half of cutting
# the device off from its vendor; the firewall rule is the other half.
#
# A DNS list is the second layer. A device that ignores your resolver walks
# straight past it, so firewall the device as well: https://liberatedbread.com/firewall/
#
# Paste under a server: clause. Exact names get local-data (a null address, or your
# --sinkhole); names with subdomains get a local-zone, which covers everything under
# them. Each time redirect carries its own local-zone, because Unbound ignores a bare
# local-data that sits under a blocking zone.
#
# Devices:
#   June Intelligent Oven (june-oven)
#
# Each rule below is preceded by: devices | roles | verification.
# 'reported' and 'hypothesis' entries have not been observed by this project.

# june-oven | firmware_check, firmware_download | reported
local-data: "dev-devices-ota.junelife.com. A 0.0.0.0"
local-data: "dev-devices-ota.junelife.com. AAAA ::"
# june-oven | firmware_check, firmware_download | hypothesis
local-data: "devices-ota.walker-cloud.com. A 0.0.0.0"
local-data: "devices-ota.walker-cloud.com. AAAA ::"
# june-oven | device_cloud, firmware_check | reported
local-data: "messaging.junelife.com. A 0.0.0.0"
local-data: "messaging.junelife.com. AAAA ::"
