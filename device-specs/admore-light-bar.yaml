# AdMore Light Bar Pro — Device Spec (skeleton)
# Status: Research — UUIDs and command bytes are TBD placeholders.
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0

device:
  name: "AdMore Light Bar Pro"
  manufacturer: "AdMore Lighting Inc."
  manufacturer_status: "active"  # active but app-dependent
  protocol: "ble"
  notes: >
    Bluetooth-enabled motorcycle brake light bar with accelerometer-based smart
    braking. Settings are configured via the AdMore Connect app. UUIDs and command
    bytes in this spec are placeholders awaiting reverse engineering.
  identification:
    local_name_prefix: "AdMore"  # hypothesized — confirm via BLE scan
    service_uuids: []            # TBD — discover via GATT enumeration

services:
  - uuid: "TBD-control-service-uuid"
    name: "Control Service"
    characteristics:
      - uuid: "TBD-command-characteristic-uuid"
        name: "Command"
        properties: ["write"]
        commands:
          set_brake_brightness:
            description: "Set brake light brightness"
            template: ["TBD_CMD_ID", "{brightness}"]
            parameters:
              brightness:
                type: "uint8"
                min: 0
                max: 255  # TBD — may be 0-100
          set_flash_count:
            description: "Set number of brake light flashes before solid"
            template: ["TBD_CMD_ID", "{count}"]
            parameters:
              count:
                type: "uint8"
                min: 0
                max: 255  # TBD — likely a small range
          set_flash_speed:
            description: "Set brake light flash speed"
            template: ["TBD_CMD_ID", "{speed}"]
            parameters:
              speed:
                type: "uint8"
                min: 0
                max: 255  # TBD — may be enum or small range
          toggle_plate_led:
            description: "Turn license plate LED on or off"
            template: ["TBD_CMD_ID", "{state}"]
            parameters:
              state:
                type: "uint8"
                min: 0
                max: 1  # 0=off, 1=on
          set_accel_sensitivity:
            description: "Set accelerometer sensitivity for deceleration-triggered braking"
            template: ["TBD_CMD_ID", "{sensitivity}"]
            parameters:
              sensitivity:
                type: "uint8"
                min: 0
                max: 255  # TBD — may be 0-100 or enum
          set_running_brightness:
            description: "Set running light brightness"
            template: ["TBD_CMD_ID", "{brightness}"]
            parameters:
              brightness:
                type: "uint8"
                min: 0
                max: 255  # TBD — may be 0-100
          set_taillight_brightness:
            description: "Set taillight brightness"
            template: ["TBD_CMD_ID", "{brightness}"]
            parameters:
              brightness:
                type: "uint8"
                min: 0
                max: 255  # TBD — may be 0-100

      - uuid: "TBD-status-characteristic-uuid"
        name: "Status"
        properties: ["read", "notify"]
        format:
          - offset: 0
            length: 1
            name: "brake_brightness"
            type: "uint8"
          - offset: 1
            length: 1
            name: "flash_count"
            type: "uint8"
          - offset: 2
            length: 1
            name: "flash_speed"
            type: "uint8"
          - offset: 3
            length: 1
            name: "plate_led"
            type: "bool"
          - offset: 4
            length: 1
            name: "accel_sensitivity"
            type: "uint8"
          - offset: 5
            length: 1
            name: "running_brightness"
            type: "uint8"
          - offset: 6
            length: 1
            name: "taillight_brightness"
            type: "uint8"

entities:
  - platform: "light"
    name: "Brake Light"
    features: ["brightness"]
    state_characteristic: "TBD-status-characteristic-uuid"
    state_mapping:
      brightness: "brake_brightness"
    commands:
      set_brightness: "set_brake_brightness"

  - platform: "light"
    name: "Running Light"
    features: ["brightness"]
    state_characteristic: "TBD-status-characteristic-uuid"
    state_mapping:
      brightness: "running_brightness"
    commands:
      set_brightness: "set_running_brightness"

  - platform: "light"
    name: "Taillight"
    features: ["brightness"]
    state_characteristic: "TBD-status-characteristic-uuid"
    state_mapping:
      brightness: "taillight_brightness"
    commands:
      set_brightness: "set_taillight_brightness"

  - platform: "switch"
    name: "License Plate LED"
    state_characteristic: "TBD-status-characteristic-uuid"
    state_mapping:
      is_on: "plate_led"
    commands:
      turn_on: "toggle_plate_led"
      turn_off: "toggle_plate_led"

  - platform: "number"
    name: "Flash Count"
    state_characteristic: "TBD-status-characteristic-uuid"
    state_mapping:
      value: "flash_count"
    commands:
      set_value: "set_flash_count"

  - platform: "number"
    name: "Flash Speed"
    state_characteristic: "TBD-status-characteristic-uuid"
    state_mapping:
      value: "flash_speed"
    commands:
      set_value: "set_flash_speed"

  - platform: "number"
    name: "Accelerometer Sensitivity"
    state_characteristic: "TBD-status-characteristic-uuid"
    state_mapping:
      value: "accel_sensitivity"
    commands:
      set_value: "set_accel_sensitivity"
