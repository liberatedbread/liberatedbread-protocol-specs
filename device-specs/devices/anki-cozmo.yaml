# Anki / Digital Dream Labs Cozmo robot (robot-hosted Wi-Fi AP, UDP 5551) — Device Specification
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# Sources (all public; clean-room — derived facts only):
#   - zayfod/pycozmo (MIT, (c) 2019-2020; last commit read 2020-11-12,
#     1b6dcd9b): docs/protocol.md, docs/functions.md, docs/capturing.md,
#     docs/esp8266.md, docs/versions.md, and the code in pycozmo/frame.py,
#     conn.py, window.py, protocol_ast.py, protocol_declaration.py,
#     protocol_base.py, client.py, robot.py, anim_controller.py, audio.py,
#     image_encoder.py, tests/test_frame.py, examples/events.py.
#     pycozmo's NOTICE credits Anki's own Apache-2.0 Cozmo Python SDK and
#     cozmoclad library, which its message names follow.
#   - NOT used: cozmo-stack or anything else built from decompiled vendor
#     material.
# Every example frame below was built from the layouts in protocol_details
# with invented values (sequence numbers, times, speeds, pose) and is rebuilt
# by scripts/test_anki_cozmo_spec.py. None is a capture of real hardware.

device:
  name: "Cozmo robot"
  manufacturer: "Anki (assets later Digital Dream Labs)"
  manufacturer_status: "shutdown"
  testing:
    status: untested
    notes: >
      Not driven against hardware by this project. The frame header, frame
      and packet types, sequence/ack rules and message layouts are
      transcribed from pycozmo's protocol document and its client code;
      pycozmo's README presents that client as working against real robots.
      The example frames are internally consistent with those rules (the
      spec's own test rebuilds them) but nothing here was replayed.
  protocol: "wifi"
  category: "robot"
  type: "toy-robot"
  transport: "udp"
  aliases: ["Anki Cozmo", "Cozmo Collector's Edition", "Cozmo Limited Edition"]
  notes: >
    Cozmo is Anki's small tracked robot with a forklift-style lift, a tilting
    head with a 128x64 OLED face (used as 128x32, see display_image), a
    camera, a speaker and three Bluetooth light cubes. Anki shut down in
    April 2019 and Digital Dream Labs took over the assets; the Pennsylvania
    Attorney General sued Digital Dream Labs in 2024 (see the Vector spec's
    page for that suit). Nearly all of Cozmo's "brain" (the app pycozmo
    calls the engine) runs on the phone, not the robot: the robot is a
    sensor-and-actuator peripheral that streams state and executes
    low-level commands.

    TOPOLOGY: the robot is always a Wi-Fi access point (SSID Cozmo_ followed
    by six upper-case hex digits) and a DHCP server handing out addresses in
    172.31.1.0/24. The phone joins it; the robot never joins a home network.
    The robot is the UDP server on port 5551 at its fixed AP address; the
    phone is the client and opens the session.

    PROTOCOL: every UDP datagram is one frame: the 7-byte id "COZ\x03RE\x01",
    a frame type, three little-endian 16-bit sequence fields (first_seq,
    seq, ack) and zero or more packets. Packets that are not out-of-band
    carry implicit sequence numbers and are retransmitted until
    acknowledged, a selective-repeat ARQ scheme with a 62-packet window.
    Commands and events are packets with an 8-bit message id; ids 0x00-0xAF
    go phone to robot, 0xB0-0xFF robot to phone, and 0xF0-0xFF are
    out-of-band state streams (RobotState among them) that are never
    retransmitted. All multi-byte integers and floats are little-endian.
    See protocol_details.cozmo_udp.

    The message layer is FIRMWARE-SPECIFIC. pycozmo targets robot firmware
    2381 and notes fields that are absent on 2214 and older; a client should
    read the FirmwareSignature message the robot sends on connect before
    trusting any layout below.

  openness:
    status: "undocumented"
    reverse_engineered: true
    source_code: "https://github.com/zayfod/pycozmo"
    license: "MIT (pycozmo); pycozmo's NOTICE carries Apache-2.0 attributions for Anki's Cozmo SDK and cozmoclad"
    upstream_docs:
      - url: "https://github.com/zayfod/pycozmo/blob/master/docs/protocol.md"
        title: "pycozmo — Cozmo Protocol"
        covers: "Network setup, the frame header, frame and packet types, the message id table and connection establishment."
      - url: "https://github.com/zayfod/pycozmo/blob/master/docs/functions.md"
        title: "pycozmo — Cozmo Functions"
        covers: "What each robot function needs (Enable, SyncTime, EnableStopOnCliff, display, speaker, firmware update)."
    notes: >
      Anki never published the robot-side protocol; its official SDK talked
      to the phone app, not to the robot. pycozmo is an independent
      re-implementation of the engine side. Its transport description is in
      prose; its message definitions live in a declaration file from which
      its encoder is generated, so the message layer here is transcribed
      from code.

  identification:
    ssid_prefix: "Cozmo_"
    default_port: 5551
    lan_protocols: ["cozmo-udp"]
    notes: >
      A Wi-Fi scan is the only discovery: an SSID of the form Cozmo_XXXXXX
      (six upper-case hex digits, unique per robot) is a Cozmo. pycozmo's
      capture guide reports the AP running 802.11b/g. There is no mDNS,
      SSDP or broadcast probe.

  discovery:
    none: >
      Nothing to discover on a LAN: the robot is its own access point, found
      by the Wi-Fi scan in identification.ssid_prefix, and it always answers
      at its fixed address (protocol_details.cozmo_udp.link.ap_ip) on UDP
      5551 once joined.
    identity:
      stable_keys: ["ssid"]
      display: "ssid"
      notes: >
        The Cozmo_XXXXXX SSID is the per-robot key available before joining.
        After connecting, the HardwareInfo (0xC9) and BodyInfo (0xED)
        messages carry head and body serial numbers; those are per-unit
        identifiers and must not be logged into shared documents.
    static_ip_required: true

  setup:
    required: false
    confidence: "medium"
    notes: >
      No provisioning exists. Setup is joining the robot's own access point
      with the per-robot passphrase the robot shows on its face, then
      opening the UDP session. Source: pycozmo's protocol and capture
      documents. Not replayed by this project.
    methods:
      - type: "none"
        name: "Join the robot's access point and open the UDP session"
        role: "primary"
        verified: false
        description: >
          Wake the robot, show its Wi-Fi passphrase on its face, join the
          Cozmo_XXXXXX network with it, then send a Reset frame to UDP 5551.
          The phone loses internet access while joined; a client should
          expect that.
        issues_credentials:
          wifi_passphrase:
            user_entered: true
            notes: >
              The robot's own WPA2 passphrase. pycozmo's capture guide says
              raising and lowering the lift makes the robot display it. It is
              per robot; never record a real one.
        steps:
          - action: "Wake the robot by placing it on its charging platform."
            actor: "user"
            expect: "A Cozmo_XXXXXX network appears in the Wi-Fi scan."
          - action: "Raise and lower the robot's lift by hand to show the Wi-Fi passphrase on its face."
            actor: "user"
            expect: "The passphrase is shown on the robot's display."
          - action: "Join the Cozmo_XXXXXX network with that passphrase."
            actor: "user"
            expect: "The phone gets a DHCP address in 172.31.1.0/24."
          - action: "Send the Reset frame (protocol_details.cozmo_udp.examples.reset) to the robot's fixed address on UDP 5551."
            actor: "client"
            expect: "A robot-packets frame (type 0x09) carrying a Connect packet, then HardwareInfo and FirmwareSignature commands."
    factory_reset:
      applicable: "unknown"
      confidence: "low"
      effect: >
        Not established. pycozmo documents no factory-reset procedure.
      description: >
        No source read describes a button or app procedure that returns a
        Cozmo to factory state. The robot stores app data (progress,
        unlocks, enrolled faces, saved cube ids) in its NV storage, which the
        NvStorageOp message (0x81) can erase entry by entry; that is a
        memory operation, not a documented reset, and is left out of this
        spec's commands. pycozmo's flash map shows a recovery / factory
        firmware image beside two application images, and pycozmo warns
        that a robot can fall back to it; that is a firmware state, not a
        settings reset.
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        The robot never joins a home network, so a router change does
        nothing to it. A new phone simply joins the same Cozmo_XXXXXX AP.
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device:
        - "The robot's own Wi-Fi AP passphrase (per robot; shown on its face)."
      issued_to_client: []
      notes: >
        Nothing is provisioned onto the robot. The UDP protocol has no
        authentication of its own: anyone joined to the robot's AP from an
        address in 172.31.1.0/24 can open a session.

  pairing:
    required: false
    confidence: "medium"
    security_mode: "none"
    bonding: "none"
    pin:
      source: "device_screen"
      notes: >
        The only secret is the robot's WPA2 passphrase, which the robot
        displays when its lift is raised and lowered (pycozmo capture
        guide). Per robot, so it is never written down here.
    exclusivity:
      single_connection: "unknown"
      single_bond: false
      recovery: >
        Close the Cozmo app on every phone before connecting another client.
        The robot answers only one engine at a time in pycozmo's model (the
        Reset frame binds the session to the sender's address), but whether
        the robot rejects or takes over on a second Reset from another
        address is not documented.
      notes: >
        The robot accepts packets only from 172.31.1.0/24, and the engine
        accepts packets only from the robot's fixed address (pycozmo
        protocol.md).
    enter_pairing_mode:
      required: false
    notes: >
      Nothing pairs and nothing is issued. Joining the robot's access point
      is the whole gate; after that the Reset frame opens a session with no
      key, token or challenge. No vendor server is involved at any point.

protocol_handler: "cozmo_udp_arq"

protocol_details:
  cozmo_udp:
    link:
      ssid_pattern: "^Cozmo_[0-9A-F]{6}$"
      ap_ip: "172.31.1.1"
      port: 5551
      client_subnet: "172.31.1.0/24 (DHCP from the robot)"
      notes: >
        The robot is the UDP server at ap_ip:5551 and only accepts datagrams
        from 172.31.1.0/24. The engine (phone) is the client, sends from any
        local port, and should only accept datagrams from ap_ip. pycozmo
        receives into a 2048-byte buffer. All integers and floats on the
        wire are little-endian; floats are IEEE-754 single (4 bytes) unless
        stated as double.
    frame_header:
      size: 14
      fields:
        - {offset: 0, length: 7, name: "id", value: "434f5a03524501", notes: "ASCII COZ, 0x03, ASCII RE, 0x01. A datagram not starting with it is not a frame."}
        - {offset: 7, length: 1, name: "type", notes: "Frame type; see frame_types."}
        - {offset: 8, length: 2, name: "first_seq", notes: "u16 LE. Sequence number of the first sequenced packet in this frame, or 0 when the frame carries none."}
        - {offset: 10, length: 2, name: "seq", notes: "u16 LE. Sequence number of the last sequenced packet in this frame, or 0 when the frame carries none."}
        - {offset: 12, length: 2, name: "ack", notes: "u16 LE. Sequence number of the latest packet received from the peer, or 0 when nothing has been received yet."}
      max_payload: >
        pycozmo's comment says the robot drops frames whose payload (the
        bytes after the 14-byte header) exceeds 1037 bytes; pycozmo never
        builds a frame larger than that and declares 1051 as its maximum
        frame size.
    frame_types:
      "0x01": "Reset — engine to robot. Opens (or re-opens) a session. Header only, no payload."
      "0x02": "Reset ACK — listed for the robot in pycozmo's table, but pycozmo's protocol text and client expect the robot to answer a Reset with a 0x09 frame carrying a Connect packet instead; when the robot sends 0x02 is not documented."
      "0x03": "Disconnect (FIN) — engine to robot. Header only. Closes the session."
      "0x04": "Engine packet, single — engine to robot. The header is followed directly by one command's message id and payload, with no packet type or length byte. pycozmo decodes it but never sends it."
      "0x07": "Engine packets — engine to robot. Zero or more packets, each [type u8][length u16 LE][body]."
      "0x09": "Robot packets — robot to engine. Same packet list as 0x07."
      "0x0b": "Out-of-band engine ping — engine to robot. first_seq and seq are 0; the 17-byte Ping body follows the header directly, with no packet type or length."
    packet_types:
      "0x02": {name: "Connect", from: "robot", out_of_band: false, body: "empty (length 0)"}
      "0x03": {name: "Disconnect", from: "engine", out_of_band: false, body: "empty (length 0)"}
      "0x04": {name: "Command", from: "both", out_of_band: false, body: "[message id u8][payload]"}
      "0x05": {name: "Event", from: "robot", out_of_band: true, body: "[message id u8][payload]; ids 0xF0-0xFF"}
      "0x0a": {name: "Keyframe", from: "engine", out_of_band: true, body: "not documented"}
      "0x0b": {name: "Ping", from: "both", out_of_band: true, body: "17-byte Ping body; see keepalive"}
    packet_encoding: >
      Inside a 0x07 or 0x09 frame each packet is [packet type u8][length u16
      LE][body]. For Command (0x04) and Event (0x05) packets the body is the
      1-byte message id followed by the payload, and length counts the id
      byte too (payload length + 1). For every other packet type, length is
      the body length. A receiver should skip to the end of a packet by its
      length even if its decoder read fewer bytes, because payload lengths
      change between firmware versions (pycozmo does exactly this).
    sequencing:
      numbering: >
        Every packet that is not out-of-band (Connect, Disconnect, Command)
        gets the next sequence number from its sender's own counter;
        out-of-band packets (Event, Keyframe, Ping) get none and are never
        retransmitted. Packets in one frame are numbered consecutively from
        first_seq, skipping out-of-band ones, so seq = first_seq + (number of
        sequenced packets - 1). On the wire sequence numbers run 1..0xFFFE
        and wrap from 0xFFFE back to 1; 0 means "none". (pycozmo stores them
        zero-based internally and adds 1 when writing; the wire values above
        are what matters.) A session starts each side's counter at 1.
      ack: >
        Each frame's ack field reports the newest peer sequence number the
        sender has seen. The receiver of an ack treats it as cumulative: it
        drops every packet up to and including that number from its
        retransmission window. pycozmo fills ack from the seq field of the
        most recent robot frame it received; after a robot frame that held
        only out-of-band packets that value is 0, which the robot evidently
        tolerates.
      window: >
        pycozmo uses a 62-packet window on both sides. A sender stops taking
        new packets while 62 are unacknowledged. A receiver buffers packets
        that arrive out of order anywhere inside its window, discards
        duplicates and packets outside it, and delivers in sequence order;
        out-of-band packets are delivered at once.
      retransmission: >
        pycozmo resends every still-unacknowledged packet, in order and with
        its original sequence number, when no ack has arrived for 100 ms
        (three 30 fps frame times). New packets are gathered for about 11 ms
        and sent together, each frame filled up to the payload limit.
      verification: "reported"
    handshake:
      - "Engine sends a Reset frame (type 0x01) with first_seq 1, seq 1, ack 0 and no payload (examples.reset)."
      - "Robot answers with a 0x09 frame, first_seq 1, seq 1, ack 1, holding one Connect packet (02 00 00) (examples.connect). The session is now open."
      - "Robot then sends HardwareInfo (0xC9: head serial u32, two unknown bytes) and FirmwareSignature (0xEE: u16 unknown, then a u16-length-prefixed JSON string with version, git-rev, build and per-controller signatures). A build of FACTORY means recovery firmware with degraded function."
      - "Engine sends Enable (0x25) — pycozmo sends it twice and notes the repetition seems to be what makes the robot send BodyInfo (0xED: body serial u32, body hardware version u32, body colour i32). Enable powers the body; drive, lift and head need it."
      - "Engine sends SetOrigin (0x45) and SyncTime (0x4B). SyncTime zeroes the RobotState timestamp and starts the RobotState and ObjectAvailable streams; it needs Enable first."
      - "To play audio or show images, engine sends EnableAnimationState (0x9F), which also starts AnimationState (0xF1) events; it needs Enable first."
      - "pycozmo waits about 0.5 s for head and lift calibration before issuing motion; proper completion detection is a pycozmo TODO."
    keepalive:
      interval: "pycozmo sends a ping every 0.5 s once connected."
      timeout: "The robot drops the session if it receives no ping for more than 5 s, and shows COZMO 01 on its face."
      ping_body:
        size: 17
        fields:
          - {offset: 0, length: 8, name: "time_sent_ms", type: "float64", notes: "Sender's clock. pycozmo actually puts its performance-counter value in seconds here despite the name; the robot only echoes it."}
          - {offset: 8, length: 4, name: "counter", type: "uint32", notes: "Ping counter, from 0 per session."}
          - {offset: 12, length: 4, name: "last", type: "uint32", notes: "pycozmo sends 0; meaning not documented."}
          - {offset: 16, length: 1, name: "unknown", type: "uint8", notes: "pycozmo sends 0."}
      engine_ping: "A 0x0b frame: first_seq 0, seq 0, ack = current ack value, then the 17-byte body (examples.ping)."
      robot_echo: "The robot answers with a 0x09 frame holding a Ping packet (type 0x0b, length 17) that copies the engine's body, so the engine can measure round-trip time (examples.ping_echo)."
    disconnect: >
      Two graceful forms: a header-only Disconnect frame (type 0x03,
      examples.fin), or a 0x07 frame holding a Disconnect packet (03 00 00;
      commands.disconnect), which is what pycozmo sends. pycozmo stops
      sending anything after it: its comment says the robot does not expect
      packets after a disconnect and that doing so has led to robot reboots
      or a fall back to factory firmware.
    message_direction: "Message ids 0x00-0xAF are engine to robot; 0xB0-0xFF are robot to engine; 0xF0-0xFF are out-of-band Event packets."
    messages:
      "0x25": {name: "Enable", payload: "empty"}
      "0x32": {name: "DriveWheels", payload: "f32 lwheel_speed_mmps, f32 rwheel_speed_mmps, f32 lwheel_accel_mmps2, f32 rwheel_accel_mmps2 (16 bytes)"}
      "0x33": {name: "TurnInPlaceAtSpeed", payload: "f32 wheel_speed_mmps, f32 wheel_accel_mmps2, i16 direction (10 bytes)"}
      "0x34": {name: "MoveLift (DriveLift in pycozmo's table)", payload: "f32 speed_rad_per_sec (4 bytes)"}
      "0x35": {name: "MoveHead (DriveHead in pycozmo's table)", payload: "f32 speed_rad_per_sec (4 bytes)"}
      "0x36": {name: "SetLiftHeight", payload: "f32 height_mm, f32 max_speed_rad_per_sec, f32 accel_rad_per_sec2, f32 duration_sec, u8 action_id (17 bytes; action_id absent on firmware 2214 and older)"}
      "0x37": {name: "SetHeadAngle", payload: "f32 angle_rad, f32 max_speed_rad_per_sec, f32 accel_rad_per_sec2, f32 duration_sec, u8 action_id (17 bytes; action_id absent on firmware 2214 and older)"}
      "0x3b": {name: "StopAllMotors", payload: "empty"}
      "0x45": {name: "SetOrigin", payload: "u32 unknown0, u32 pose_frame_id, u32 pose_origin_id, f32 pose_x, f32 pose_y, u32 unknown5 (24 bytes); pycozmo defaults 0, 0, 1, 0.0, 0.0, 0x80000000"}
      "0x4b": {name: "SyncTime (EnableBodyACC in pycozmo's table)", payload: "u32 timestamp, u32 unknown (8 bytes); pycozmo sends zeros"}
      "0x60": {name: "EnableStopOnCliff", payload: "bool enable (1 byte)"}
      "0x64": {name: "SetRobotVolume", payload: "u16 level, 0-65535 (2 bytes)"}
      "0x8e": {name: "OutputAudio", payload: "744 bytes of 8-bit u-law samples"}
      "0x8f": {name: "OutputSilence", payload: "empty"}
      "0x97": {name: "DisplayImage", payload: "u16 length, then that many bytes of run-length-encoded image (pycozmo's table: 4-188 bytes total)"}
      "0x9f": {name: "EnableAnimationState", payload: "empty"}
      "0xa9": {name: "ShutdownRobot", payload: "empty; behaviour not documented beyond the name"}
      "0xae": {name: "WifiOff", payload: "bool enable; behaviour not documented beyond the name"}
      "0xaf": {name: "FirmwareUpdate", payload: "u16 chunk_id, 1024 bytes data (1026 bytes)"}
      "0xc4": {name: "AcknowledgeAction", payload: "u8 action_id; robot sends it before SetHeadAngle / SetLiftHeight motion starts"}
      "0xc9": {name: "HardwareInfo", payload: "u32 serial_number_head, u8 unknown1, u8 unknown2"}
      "0xdb": {name: "ButtonPressed", payload: "bool pressed (backpack button, v1.5 hardware and newer; no Enable needed)"}
      "0xed": {name: "BodyInfo", payload: "u32 serial_number, u32 body_hw_version (5 production, 7 development), i32 body_color"}
      "0xee": {name: "FirmwareSignature", payload: "u16 unknown, u16 length, JSON string"}
      "0xef": {name: "FirmwareUpdateResult", payload: "u32 byte_count, u16 chunk_id, u8 status (0 chunk OK, 10 update complete)"}
      "0xf0": {name: "RobotState", payload: "91 bytes; see robot_state"}
      "0xf1": {name: "AnimationState", payload: "u32 timestamp, i32 num_anim_bytes_played, i32 num_audio_frames_played, u8 enabled_anim_tracks, u8 tag, u8 client_drop_count (last field absent on firmware 2214 and older)"}
    robot_state:
      message_id: "0xf0"
      packet: "Event packet (type 0x05), out-of-band, length 92 (id + 91-byte payload)."
      cadence: "About every 30 ms (pycozmo functions.md), once SyncTime has been sent."
      fields:
        - {offset: 0, type: "uint32", name: "timestamp", notes: "Robot time, zeroed by SyncTime. Unit not stated (ms is likely, not confirmed)."}
        - {offset: 4, type: "uint32", name: "pose_frame_id"}
        - {offset: 8, type: "uint32", name: "pose_origin_id"}
        - {offset: 12, type: "float32", name: "pose_x", notes: "Position in the world frame set by SetOrigin. Unit not stated by pycozmo's declaration."}
        - {offset: 16, type: "float32", name: "pose_y"}
        - {offset: 20, type: "float32", name: "pose_z"}
        - {offset: 24, type: "float32", name: "pose_angle_rad", unit: "rad"}
        - {offset: 28, type: "float32", name: "pose_pitch_rad", unit: "rad"}
        - {offset: 32, type: "float32", name: "lwheel_speed_mmps", unit: "mm/s", notes: "Measured left tread speed."}
        - {offset: 36, type: "float32", name: "rwheel_speed_mmps", unit: "mm/s"}
        - {offset: 40, type: "float32", name: "head_angle_rad", unit: "rad"}
        - {offset: 44, type: "float32", name: "lift_height_mm", unit: "mm"}
        - {offset: 48, type: "float32", name: "accel_x", notes: "Units not documented."}
        - {offset: 52, type: "float32", name: "accel_y"}
        - {offset: 56, type: "float32", name: "accel_z"}
        - {offset: 60, type: "float32", name: "gyro_x", notes: "Angular velocity; units not documented."}
        - {offset: 64, type: "float32", name: "gyro_y"}
        - {offset: 68, type: "float32", name: "gyro_z"}
        - {offset: 72, type: "float32", name: "battery_voltage", unit: "V", notes: "pycozmo's functions.md calls it raw; its example prints it as volts."}
        - {offset: 76, type: "uint32", name: "status", notes: "Bit flags; see status_flags."}
        - {offset: 80, type: "uint16[4]", name: "cliff_data_raw", notes: "Four raw cliff-sensor readings."}
        - {offset: 88, type: "uint16", name: "backpack_touch_sensor_raw", notes: "pycozmo found it does not change with backpack-button presses."}
        - {offset: 90, type: "uint8", name: "curr_path_segment"}
      status_flags:
        "0x00000001": "IS_MOVING"
        "0x00000002": "IS_CARRYING_BLOCK"
        "0x00000004": "IS_PICKING_OR_PLACING"
        "0x00000008": "IS_PICKED_UP"
        "0x00000010": "IS_BODY_ACC_MODE"
        "0x00000020": "IS_FALLING"
        "0x00000040": "IS_ANIMATING"
        "0x00000080": "IS_PATHING"
        "0x00000100": "LIFT_IN_POS"
        "0x00000200": "HEAD_IN_POS"
        "0x00000400": "IS_ANIM_BUFFER_FULL"
        "0x00000800": "IS_ANIMATING_IDLE"
        "0x00001000": "IS_ON_CHARGER"
        "0x00002000": "IS_CHARGING"
        "0x00004000": "CLIFF_DETECTED"
        "0x00008000": "ARE_WHEELS_MOVING"
        "0x00010000": "IS_CHARGER_OOS"
    limits:
      head_angle_rad: "-25 deg to 44.5 deg (about -0.436 to 0.777 rad), per pycozmo's robot constants"
      lift_height_mm: "32 to 92 mm"
      wheel_speed_mmps: "200 mm/s maximum"
      track_width_mm: 45
      notes: "These are pycozmo's client constants (taken over from Anki's SDK); the robot's own behaviour outside them is not documented."
    display_image:
      geometry: >
        The face is a 128x64 OLED driven as 128x32: pycozmo's docs say
        consecutive images are interleaved over alternate rows to reduce
        burn-in, so one image is 128 columns by 32 rows, one bit per pixel.
      encoding: >
        Column-major run-length code, one opcode byte at a time. The top two
        bits select the operation: 00 skip columns, 01 repeat the previous
        column, 10 draw or skip a run of up to 16 pixels down the current
        column, 11 the same for runs of 17 to 32. The low six bits hold the
        count (and, for 10/11, the draw flag). The bit-exact rules are in
        pycozmo's image_encoder.py; this spec carries the structure only.
      packet: >
        Command packet 04, length (u16 LE) = 3 + N, id 97, then image
        length N (u16 LE) and the N image bytes. pycozmo's table gives 4-188
        bytes for the payload after the id, so N is 2-186.
      blank: "The two bytes 3f 3f clear the face (pycozmo's clear_screen); see commands.display_image_clear."
      refresh: >
        pycozmo resends the current image every animation tick because the
        robot stops showing an image that is not refreshed for 30 s. Images
        are sent paced with audio (below).
    audio:
      format: "OutputAudio carries exactly 744 8-bit u-law samples. pycozmo converts 16-bit WAV at 22050 Hz (or 48000 Hz, taking every second sample) into 744-sample frames."
      pacing: >
        pycozmo's animation loop runs at 30 frames per second and sends,
        every tick, one OutputAudio (or OutputSilence when there is no
        audio) followed by one DisplayImage. pycozmo's docs say display and
        audio are synchronised by the audio messages; the robot plays
        nothing until EnableAnimationState has been sent.
      companding: >
        Structure only. pycozmo's encoder is its own u-law routine; whether
        the robot expects the standard G.711 bit inversion is not
        established, so a client should transcribe pycozmo's encoder rather
        than a library one until a capture settles it.
    firmware_update:
      image: >
        Updates come as "cozmo.safe" files that begin with a JSON firmware
        signature (version, git-rev, date, build, message hashes, wifiSig,
        rtipSig, bodySig) and appear to hold images for all three
        controllers (ESP8266 Wi-Fi/head, K02 real-time processor, nRF51
        body). The rest of the file's structure is unknown.
      transfer: >
        The image is sent as-is in FirmwareUpdate (0xAF) commands of 1024
        bytes, chunk_id counting from 0. The robot confirms each chunk with
        FirmwareUpdateResult (0xEF) status 0. Completion is a FirmwareUpdate
        with chunk_id 0xFFFF and 1024 zero bytes; the robot answers with
        FirmwareUpdateResult repeating the last chunk id with status 10.
    examples:
      reset: "434f5a0352450101010001000000"
      connect: "434f5a0352450109010001000100020000"
      ping: "434f5a035245010b0000000001000000000000000440040000000000000000"
      ping_echo: "434f5a03524501090000000010000b11000000000000000440040000000000000000"
      fin: "434f5a0352450103000000000700"
      robot_state_on_desk: "434f5a0352450109000000001000055c00f040e201000000000001000000000020410000a0c0000000000000803e000000000000000000000000000080be000000420000000000000000000000000000000000000000000000009a99794000030000c800d200cd00c600000000"
      robot_state_on_charger: "434f5a0352450109000000001000055c00f006120f0002000000030000000000f14200002042000000000000c0bf000000000000f0410000f041cdcccc3d000034420000000000000000000000000000000000000000000000000000984001300000b400b500b600b700000002"
      notes: >
        Invented values throughout. ping: time 2.5, counter 4, ack 1.
        ping_echo: the robot's echo of it, ack 16. fin: ack 7.
        robot_state_on_desk: timestamp 123456, frame 0, origin 1, pose
        (10.0, -5.0, 0.0), angle 0.25 rad, wheels 0, head -0.25 rad, lift
        32.0 mm, battery 3.9 V, status 0x300 (LIFT_IN_POS | HEAD_IN_POS),
        cliff 200/210/205/198. robot_state_on_charger: timestamp 987654,
        frame 2, origin 3, pose (120.5, 40.0, 0.0), angle -1.5 rad, wheels
        30.0/30.0 mm/s, head 0.1 rad, lift 45.0 mm, battery 4.75 V, status
        0x3001 (IS_MOVING | IS_ON_CHARGER | IS_CHARGING), cliff
        180/181/182/183, path segment 2. Every command example_body uses
        frame type 0x07 with first_seq 16, seq 16, ack 7.

payload_formats:
  RobotState:
    description: >
      Payload of message 0xF0 (after the id byte), 91 bytes, little-endian,
      fields packed with no padding in the order below. Offsets and widths
      are in protocol_details.cozmo_udp.robot_state.fields.
    parse_rules:
      - "Find a 0x09 frame packet with packet type 0x05, length 92 and message id 0xF0."
      - "Read the 91 bytes after the id as: u32 timestamp, u32 pose_frame_id, u32 pose_origin_id, 16 x f32 (pose_x, pose_y, pose_z, pose_angle_rad, pose_pitch_rad, lwheel_speed_mmps, rwheel_speed_mmps, head_angle_rad, lift_height_mm, accel_x, accel_y, accel_z, gyro_x, gyro_y, gyro_z, battery_voltage), u32 status, 4 x u16 cliff_data_raw, u16 backpack_touch_sensor_raw, u8 curr_path_segment."
      - "If the packet length differs, skip it by its length: the layout is for firmware 2381."
    fields:
      - {name: "timestamp"}
      - {name: "pose_frame_id"}
      - {name: "pose_origin_id"}
      - {name: "pose_x"}
      - {name: "pose_y"}
      - {name: "pose_z"}
      - {name: "pose_angle_rad", unit: "rad"}
      - {name: "pose_pitch_rad", unit: "rad"}
      - {name: "lwheel_speed_mmps", unit: "mm/s"}
      - {name: "rwheel_speed_mmps", unit: "mm/s"}
      - {name: "head_angle_rad", unit: "rad"}
      - {name: "lift_height_mm", unit: "mm"}
      - {name: "accel_x"}
      - {name: "accel_y"}
      - {name: "accel_z"}
      - {name: "gyro_x"}
      - {name: "gyro_y"}
      - {name: "gyro_z"}
      - {name: "battery_voltage", unit: "V"}
      - {name: "status", description: "Bit flags; protocol_details.cozmo_udp.robot_state.status_flags."}
      - {name: "cliff_data_raw", description: "Four u16 readings."}
      - {name: "backpack_touch_sensor_raw"}
      - {name: "curr_path_segment"}
    example: "40e201000000000001000000000020410000a0c0000000000000803e000000000000000000000000000080be000000420000000000000000000000000000000000000000000000009a99794000030000c800d200cd00c600000000"

# Every command below is ONE packet. `body` is that packet as hex
# ([packet type][length u16 LE][message id][payload]) with {name} holes for
# little-endian fields; the ARQ layer (protocol_details.cozmo_udp.sequencing)
# gives it a sequence number and puts it in a 0x07 frame. `example_body` is
# one complete UDP datagram with the invented header first_seq 16, seq 16,
# ack 7. A client cannot send these without a session, which is why
# protocol_handler is declared and no entity is bound.
commands:
  enable:
    description: "Enable (0x25): power the body. Needed before drive, head, lift, SyncTime and EnableAnimationState. pycozmo sends it twice after FirmwareSignature arrives."
    transport: "udp"
    body: "04 01 00 25"
    example_body: "434f5a035245010710001000070004010025"
    verification: "reported"
  set_origin:
    description: "SetOrigin (0x45): set the world-frame origin and pose ids. Shown with pycozmo's defaults (frame 0, origin 1, x 0, y 0, last word 0x80000000)."
    transport: "udp"
    body: "04 19 00 45 00000000 00000000 01000000 00000000 00000000 00000080"
    example_body: "434f5a035245010710001000070004190045000000000000000001000000000000000000000000000080"
    verification: "reported"
  sync_time:
    description: "SyncTime (0x4B): zero the RobotState timestamp and start the RobotState and ObjectAvailable streams. Requires Enable."
    transport: "udp"
    body: "04 09 00 4b 00000000 00000000"
    example_body: "434f5a03524501071000100007000409004b0000000000000000"
    verification: "reported"
  enable_animation_state:
    description: "EnableAnimationState (0x9F): enable audio/image playback and AnimationState events. Requires Enable."
    transport: "udp"
    body: "04 01 00 9f"
    example_body: "434f5a03524501071000100007000401009f"
    verification: "reported"
  drive_wheels:
    description: >
      DriveWheels (0x32): run each tread at a speed with an acceleration.
      The robot keeps driving until another drive command or StopAllMotors;
      pycozmo's timed drive is a client-side sleep followed by StopAllMotors.
    transport: "udp"
    body: "04 11 00 32 {lwheel_speed_mmps} {rwheel_speed_mmps} {lwheel_accel_mmps2} {rwheel_accel_mmps2}"
    parameters:
      lwheel_speed_mmps: {type: "float32", required: true, min: -200, max: 200, unit: "mm/s", description: "Left tread speed, f32 LE. Negative drives backwards. 200 mm/s is pycozmo's maximum."}
      rwheel_speed_mmps: {type: "float32", required: true, min: -200, max: 200, unit: "mm/s", description: "Right tread speed, f32 LE."}
      lwheel_accel_mmps2: {type: "float32", default: 0.0, unit: "mm/s2", description: "Left tread acceleration, f32 LE. pycozmo defaults to 0; what 0 means to the robot is not documented."}
      rwheel_accel_mmps2: {type: "float32", default: 0.0, unit: "mm/s2", description: "Right tread acceleration, f32 LE."}
    example_body: "434f5a035245010710001000070004110032000048420000c8410000c8420000c842"
    example_notes: "Left 50.0 mm/s, right 25.0 mm/s, both accelerations 100.0."
    advanced: true
    advanced_reason: >
      Starts the treads and they keep turning until stopped. Cozmo lives on
      tables and will drive straight off an edge unless cliff stop is on
      (enable_stop_on_cliff) or the client watches CLIFF_DETECTED. A dropped
      session does not obviously stop the motors. Send stop_all_motors to
      recover.
    verification: "reported"
  turn_in_place_at_speed:
    description: "TurnInPlaceAtSpeed (0x33): spin in place. Which sign of direction is clockwise is not documented."
    transport: "udp"
    body: "04 0b 00 33 {wheel_speed_mmps} {wheel_accel_mmps2} {direction}"
    parameters:
      wheel_speed_mmps: {type: "float32", required: true, min: 0, max: 200, unit: "mm/s", description: "Tread speed, f32 LE."}
      wheel_accel_mmps2: {type: "float32", default: 0.0, unit: "mm/s2", description: "Tread acceleration, f32 LE."}
      direction: {type: "int16", required: true, min: -1, max: 1, description: "i16 LE; the sign selects the direction (pycozmo does not say which)."}
    example_body: "434f5a0352450107100010000700040b0033000020420000a0420100"
    example_notes: "Speed 40.0 mm/s, acceleration 80.0, direction 1."
    advanced: true
    advanced_reason: >
      Spins the robot until stopped; near a table edge a spin can carry it
      off. Send stop_all_motors to recover.
    verification: "reported"
  stop_all_motors:
    description: "StopAllMotors (0x3B): stop treads, head and lift."
    transport: "udp"
    body: "04 01 00 3b"
    example_body: "434f5a03524501071000100007000401003b"
    verification: "reported"
  enable_stop_on_cliff:
    description: >
      EnableStopOnCliff (0x60): make the robot stop by itself when the cliff
      sensor sees an edge. Whether it is on by default is not documented;
      send it before any drive command.
    transport: "udp"
    body: "04 02 00 60 {enable}"
    parameters:
      enable: {type: "uint8", default: 1, enum: [0, 1], description: "1 on, 0 off."}
    example_body: "434f5a03524501071000100007000402006001"
    verification: "reported"
  move_head:
    description: "MoveHead (0x35): drive the head motor at a speed until stopped or at its end stop."
    transport: "udp"
    body: "04 05 00 35 {speed_rad_per_sec}"
    parameters:
      speed_rad_per_sec: {type: "float32", required: true, unit: "rad/s", description: "f32 LE; positive raises the head (pycozmo's convention, not independently confirmed)."}
    example_body: "434f5a0352450107100010000700040500350000803f"
    example_notes: "1.0 rad/s."
    verification: "reported"
  set_head_angle:
    description: "SetHeadAngle (0x37): move the head to an absolute angle. The robot answers with AcknowledgeAction (0xC4) before it moves."
    transport: "udp"
    body: "04 12 00 37 {angle_rad} {max_speed_rad_per_sec} {accel_rad_per_sec2} {duration_sec} {action_id}"
    parameters:
      angle_rad: {type: "float32", required: true, min: -0.436, max: 0.777, unit: "rad", description: "f32 LE; -25 to 44.5 degrees."}
      max_speed_rad_per_sec: {type: "float32", default: 10.0, unit: "rad/s", description: "f32 LE. pycozmo's client sends 10.0 (its declaration default is 15.0)."}
      accel_rad_per_sec2: {type: "float32", default: 10.0, unit: "rad/s2", description: "f32 LE. pycozmo's client sends 10.0 (declaration default 20.0)."}
      duration_sec: {type: "float32", default: 0.0, unit: "s", description: "f32 LE. pycozmo sends 0; semantics of a non-zero value not documented."}
      action_id: {type: "uint8", default: 0, description: "Echoed in AcknowledgeAction. Omit the byte (length 0x11) for firmware 2214 and older."}
    example_body: "434f5a0352450107100010000700041200370000003f00002041000020410000000000"
    example_notes: "0.5 rad, max speed 10.0, accel 10.0, duration 0, action id 0."
    verification: "reported"
  move_lift:
    description: "MoveLift (0x34): drive the lift motor at a speed until stopped or at its end stop."
    transport: "udp"
    body: "04 05 00 34 {speed_rad_per_sec}"
    parameters:
      speed_rad_per_sec: {type: "float32", required: true, unit: "rad/s", description: "f32 LE; positive raises the lift (pycozmo's convention, not independently confirmed)."}
    example_body: "434f5a035245010710001000070004050034000000c0"
    example_notes: "-2.0 rad/s."
    verification: "reported"
  set_lift_height:
    description: "SetLiftHeight (0x36): move the lift to an absolute height. The robot answers with AcknowledgeAction (0xC4) before it moves."
    transport: "udp"
    body: "04 12 00 36 {height_mm} {max_speed_rad_per_sec} {accel_rad_per_sec2} {duration_sec} {action_id}"
    parameters:
      height_mm: {type: "float32", required: true, min: 32, max: 92, unit: "mm", description: "f32 LE; lift height above the ground."}
      max_speed_rad_per_sec: {type: "float32", default: 10.0, unit: "rad/s", description: "f32 LE. pycozmo's client sends 10.0 (declaration default 3.0)."}
      accel_rad_per_sec2: {type: "float32", default: 10.0, unit: "rad/s2", description: "f32 LE. pycozmo's client sends 10.0 (declaration default 20.0)."}
      duration_sec: {type: "float32", default: 0.0, unit: "s", description: "f32 LE."}
      action_id: {type: "uint8", default: 0, description: "Echoed in AcknowledgeAction. Omit the byte (length 0x11) for firmware 2214 and older."}
    example_body: "434f5a0352450107100010000700041200360000704200002041000020410000000000"
    example_notes: "60.0 mm, max speed 10.0, accel 10.0, duration 0, action id 0."
    verification: "reported"
  display_image_clear:
    description: "DisplayImage (0x97) with the two-byte blank image 3f 3f: clear the face."
    transport: "udp"
    body: "04 05 00 97 02 00 3f 3f"
    example_body: "434f5a03524501071000100007000405009702003f3f"
    verification: "reported"
  output_audio:
    description: >
      OutputAudio (0x8E): 744 u-law samples, one 30 fps tick of sound. Send
      one OutputAudio or OutputSilence every tick, each followed by a
      DisplayImage. Needs EnableAnimationState. Structure only; see
      protocol_details.cozmo_udp.audio.
    transport: "udp"
    body: "04 e9 02 8e {samples}"
    parameters:
      samples: {type: "bytes", required: true, min_length: 744, max_length: 744, description: "744 8-bit u-law samples."}
    verification: "reported"
  output_silence:
    description: "OutputSilence (0x8F): a tick with no sound, sent in place of OutputAudio."
    transport: "udp"
    body: "04 01 00 8f"
    example_body: "434f5a03524501071000100007000401008f"
    verification: "reported"
  set_robot_volume:
    description: "SetRobotVolume (0x64): speaker volume."
    transport: "udp"
    body: "04 03 00 64 {level}"
    parameters:
      level: {type: "uint16", required: true, min: 0, max: 65535, description: "u16 LE, 0 silent to 65535 loudest."}
    example_body: "434f5a035245010710001000070004030064204e"
    example_notes: "Level 20000."
    verification: "reported"
  disconnect:
    description: "Disconnect packet (type 0x03, no body) in an engine frame: the graceful close pycozmo uses. Send nothing afterwards."
    transport: "udp"
    body: "03 00 00"
    example_body: "434f5a0352450107100010000700030000"
    verification: "reported"
  firmware_update_chunk:
    description: >
      FirmwareUpdate (0xAF): one 1024-byte chunk of a cozmo.safe image. The
      robot answers FirmwareUpdateResult (0xEF) status 0 per chunk. Finish
      with chunk_id 0xFFFF and 1024 zero bytes; the robot answers status
      10.
    transport: "udp"
    body: "04 03 04 af {chunk_id} {data}"
    parameters:
      chunk_id: {type: "uint16", required: true, min: 0, max: 65535, description: "u16 LE, from 0; 65535 marks completion."}
      data: {type: "bytes", required: true, min_length: 1024, max_length: 1024, description: "1024 bytes of the image (zeros on the completion chunk)."}
    advanced: true
    advanced_reason: >
      Rewrites the robot's firmware. The image format and its signing are
      not understood, an interrupted or wrong image may leave the robot on
      its recovery firmware with degraded function, and no community source
      documents a recovery path. Only send an unmodified official image.
    verification: "reported"

features:
  - type: "firmware_update"
    dfu:
      mechanisms: ["custom"]
      transport: "udp"
      image:
        signing: "unknown"
        algorithm: "unknown"
        source: "bundled_in_app"
        format: "cozmo.safe: a JSON firmware signature followed by images for the three controllers; structure beyond the header unknown"
        notes: >
          pycozmo reports the images ship inside the companion app's
          resources. The JSON header names per-controller signatures
          (wifiSig, rtipSig, bodySig); whether the robot verifies them
          cryptographically is unknown.
      enter:
        how: "in_place"
        command: "firmware_update_chunk"
        notes: "Sent over the normal session; no separate bootloader mode is documented."
      dfu_mode:
        notes: "How the robot looks during and after an update is not documented."
      recovery:
        interrupted: "unknown"
        notes: >
          pycozmo's flash map of the ESP8266 shows two application image
          slots and a separate recovery / factory image, and its client
          warns when a robot reports FACTORY firmware. That suggests an
          interrupted update falls back rather than bricks, but no source
          says so.
      verification: "reported"
    notes: "The update protocol is documented in pycozmo's functions.md; pycozmo's README lists OTA updates as supported."

cloud:
  required: false
  vendor_service: "None for robot control; the phone app is the robot's brain"
  hosts: []
  failure_mode: >
    Nothing in this protocol touches a server. The robot is controlled
    entirely over its own access point by whatever engine runs on the
    phone or computer. What depends on the vendor is the companion app
    itself and the firmware images bundled in it.
  notes: "Recorded to make the absence machine-readable."

local_access:
  status: "native"
  summary: >
    Fully local by construction: the robot is its own access point and
    speaks only to the client joined to it, over UDP 5551 with no
    authentication beyond the Wi-Fi passphrase. pycozmo is a working
    replacement engine.
  covers:
    - "Session open/close, keep-alive and the ARQ transport"
    - "Treads, head and lift motion, cliff stop"
    - "Face display and speaker (structure)"
    - "Robot state stream: pose, wheel speeds, head angle, lift height, IMU, battery, status flags, cliff sensors"
    - "Firmware update transfer (procedure only)"
  not_covered:
    - "Camera image chunks, cubes and charger lights, path following, NV storage and animations: present in pycozmo but not specified here"
    - "Cozmo's behaviours and personality, which run in the phone app and are not a robot protocol"

helpful_urls:
  - title: "zayfod/pycozmo"
    url: "https://github.com/zayfod/pycozmo"
    description: "MIT-licensed pure-Python Cozmo engine: the source of every protocol fact here."
  - title: "pycozmo — Cozmo Protocol (docs/protocol.md)"
    url: "https://github.com/zayfod/pycozmo/blob/master/docs/protocol.md"
    description: "Network setup, frame header, frame/packet types, message id table, connection establishment."
  - title: "pycozmo — Cozmo Functions (docs/functions.md)"
    url: "https://github.com/zayfod/pycozmo/blob/master/docs/functions.md"
    description: "Per-function notes: Enable, cliff stop, display, speaker, NV storage, firmware updates."
  - title: "pycozmo documentation"
    url: "https://pycozmo.readthedocs.io/"
    description: "Rendered API documentation for pycozmo."

evidence:
  artifacts:
    - type: "public_implementation"
      artifact: "zayfod/pycozmo, master at commit 1b6dcd9b869a3784f1d8b02e820bb033f95fd13a (2020-11-12)"
      url: "https://github.com/zayfod/pycozmo"
      description: >
        Read, not executed. docs/protocol.md gave the network setup, frame
        header, frame and packet types, message id table and handshake;
        frame.py the packet encoding inside frames and the +1 sequence
        offset; conn.py and window.py the window size, ack handling,
        retransmission timer, ping interval and the disconnect warning;
        protocol_declaration.py and protocol_ast.py every message layout;
        client.py, robot.py and anim_controller.py the start-up order,
        limits, status flags and audio/display pacing; tests/test_frame.py
        cross-checked the header and packet framing against a recorded
        engine frame (not copied).
    - type: "public_research"
      url: "https://github.com/zayfod/pycozmo/blob/master/docs/capturing.md"
      description: "SSID form, the lift gesture that shows the Wi-Fi passphrase, and waking the robot on its charger."
  documentation_review: >
    pycozmo's names for messages follow Anki's own Apache-2.0 cozmoclad and
    SDK, which its NOTICE credits. cozmo-stack and other material derived
    from the decompiled app were deliberately not consulted.

remaining_unknowns:
  - "Whether and when the robot sends frame type 0x02 (Reset ACK); pycozmo expects a 0x09 frame with a Connect packet instead."
  - "Contents of the Keyframe (0x0a) packet, and of the 0x04 single-packet engine frame in practice (pycozmo never sends one)."
  - "The robot's own retransmission timer and window size; the 100 ms timer and 62-packet window are pycozmo's choices."
  - "What the robot does with a Reset from a second address while a session is open."
  - "Whether a lost session (no pings for 5 s) stops moving treads."
  - "Whether stop-on-cliff is enabled by default, and which sign of TurnInPlaceAtSpeed.direction is clockwise."
  - "Units of the pose position, accelerometer and gyro fields, and of the RobotState timestamp."
  - "The meaning of the Ping 'last' and trailing byte, SetOrigin's unknown words, and SyncTime's second word."
  - "The exact u-law variant the speaker expects and the bit-exact display run-length rules beyond pycozmo's encoder."
  - "The structure of cozmo.safe beyond its JSON header, whether the robot checks the per-controller signatures, and what an interrupted update leaves behind."
  - "Any factory-reset procedure, and whether the AP passphrase can be changed."
  - "How layouts differ on firmware other than 2381 beyond the action_id and client_drop_count fields pycozmo notes."
