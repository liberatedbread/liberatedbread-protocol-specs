# NYAN BT Image Controller device spec (LOY SPACE protocol)
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0

device:
  name: "NYAN BT Image Controller"
  manufacturer: "NYAN GEAR / LOY SPACE / popled.cn"
  manufacturer_status: "abandoned"
  protocol: "ble"
  notes: >
    BLE-only variant of the LOY SPACE protocol (identical to AUTOBABA LED Backpack).
    White-label reskin of the LOY SPACE platform with BLE-only mode (no Wi-Fi).
    BLE device name starts with "YS" or "TL".
    Packet format: [0xAA, 0x55, addr_hi, addr_lo, len_hi, len_lo, sno_hi, sno_lo, flags, type, ...payload].
    JSON-based commands, 24-bit BMP image upload.
    Default resolution: 32x16. Supports same resolution table as AUTOBABA.
    Backend: store-cdn.popled.cn (shared API key and auth).
  identification:
    local_name_prefix: "YS"
    service_uuids:
      - "0000fff0-0000-1000-8000-00805f9b34fb"

services:
  - uuid: "0000fff0-0000-1000-8000-00805f9b34fb"
    name: "LOY SPACE BLE Service"
    characteristics:
      - uuid: "0000fff1-0000-1000-8000-00805f9b34fb"
        name: "Notify"
        properties: ["read", "notify"]

      - uuid: "0000fff2-0000-1000-8000-00805f9b34fb"
        name: "Write"
        properties: ["write"]
        commands:
          power_toggle:
            description: "Toggle screen power. JSON: {power:{type:0}}"
            value: []
          set_brightness:
            description: "Set brightness 0-15. JSON: {light:{type:0, value_fix:N}}"
            value: []
          get_device_info:
            description: "Query device info. JSON: {get:'dev_info'}"
            value: []
          delete_all_programs:
            description: "Delete all programs. JSON: {delete:{del_all:1}}"
            value: []
          set_rotation:
            description: "Set screen rotation. JSON: {rotate:N}"
            value: []
          play_program:
            description: "Play a program by index. JSON: {pgm_play:{model:0, index:N}}"
            value: []

entities:
  - platform: "light"
    name: "LED Screen"
    features: ["brightness"]
    commands:
      set_brightness: "set_brightness"
