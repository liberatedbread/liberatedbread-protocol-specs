device:
  name: ThermoPro TempSpike / TP9xx BBQ Thermometer
  manufacturer: ThermoPro (Adsmart)
  category: sensor
  category_hierarchy: ["measurement", "temperature"]
  type: bbq-thermometer
  transport: "ble-gatt"
  protocol: ble
  manufacturer_status: active
  testing:
    status: untested
  notes: |
    Extracted by static analysis of the official ThermoPro companion app.
    Its BLE stack is the OEM's (Adsmart, the OEM behind ThermoPro's
    connected devices), not ThermoPro-specific code.

    TRANSPORT IS PLAIN BLE GATT — NOT BLE MESH. The app contains no mesh stack
    (no/nordicsemi/android/ holds only ble/ + support/; no Mesh Proxy 0x1828,
    no PB-GATT, no provisioning anywhere in the sources). Two independent RE
    efforts agree: daniel-corbett/thermopro-cli calls it "a simple BLE
    notification-based protocol", and Bluetooth-Devices/thermopro-ble decodes
    TempSpike probes passively from advertisements with no connection at all.
    An earlier revision of this spec describing BLE Mesh provisioning was
    fabricated.

    THERE IS NO SINGLE UNIVERSAL UUID SET. The app picks one of FIVE
    per-family BLE configs at connect time — its BLE manager picks one of
    five per-family config classes (16-bit codes expand to
    0000XXXX-0000-1000-8000-00805F9B34FB):
    - TP9012 family (deviceType 7/8, its own per-family BLE config in the app): service
      0b863e05-ba64-4f7a-922d-007fd52dcaa9 — NOT 1086FFF0 — write FFF1,
      notify FFF2.
    - TP922 (deviceType 22, its own per-family BLE config in the app): service
      baaafff0-0001-4e6e-886a-57d347c919fe, write BAAAFFF1-…, notify
      BAAAFFF2-….
    - TP940 (deviceType 24) and TempSpike TP960 (deviceTypes 30/31):
      service 93bb7cab-eb14-c5a9-2354-a24f4df9330f with roles REVERSED —
      write = FF02, notify = FF01 — plus a read characteristic FF03.
    - TP426 infrared (deviceType 50): service
      0f86fff0-63e8-4762-9dfb-7b6fe113376a, write FFF1, notify FFF2.
    - Default (all other deviceTypes, incl. TP920/TP25W and TP980,
      the app's default BLE config): service 1086fff0-3343-4817-8bb2-b32206336ce8, write
      FFF1, notify FFF2.
    Clients must identify the family (advertised name, per the app's scan
    config)
    before choosing a service; 1086FFF0 is the fallback, not the universal
    case.

    WRITE FRAMING IS PER-FAMILY. Only the TP9012 family wraps commands as
    0xAA | payload | checksum | 0xFF, where checksum = sum of the payload
    bytes EXCLUDING the opcode byte, & 0xFF (the app's TP9012 checksum helper);
    its notifications mirror this with 0xAA at offset 0 and the opcode at
    offset 1. TP920/TP25W-family frames have NO 0xAA/0xFF wrapper and a
    trailing checksum that INCLUDES the opcode byte
    (the app's TP920 checksum helper); this family additionally expects a
    fixed init handshake write (starting 01 09 8a 7a ...) plus a
    timestamp-sync command 0x28 after connect (thermopro-cli
    create_handshake_command). TP940, TP960 (TempSpike) and TP980 send raw
    opcode-prefixed frames with NO wrapper and NO checksum at all
    (the app's TP940, TP960 and TP980 command builders emit the opcode
    bytes as-is).

    Eight device parser families are dispatched in the app (by its BLE
    manager's notification callback): TP9012, TP920, TP940, TP960,
    TP962, TP968, TP980 and TP426 (infrared). The TempSpike line
    (TP960/962/968 and TP970-973) is the current retail focus.

    TEMPSPIKE PASSIVE MODE: TP96x/TP97x probes broadcast probe index,
    temperatures and battery voltage in BLE advertisement manufacturer data
    (company id prepended LE by the parser) — fully decodable without
    connecting (Bluetooth-Devices/thermopro-ble parser.py, actively
    maintained). This is the cheapest integration path for those models and
    obviates most of the setup below. TWO DIFFERENT LAYOUTS EXIST; exact
    machine-readable contracts are in payload_formats:
    - TP96x (7-byte payload, or 13 bytes with a reversed base-station MAC at
      7-12 to ignore): probe_index u8 @0, internal u16 LE @1, battery mV
      u16 LE @3, ambient u16 LE @5. Both temperatures are integer °C with a
      -30 offset (raw - 30), NOT °F.
    - TP97x (23-byte payload): probe_index u8 @0, ambient u16 LE @1,
      battery mV u16 LE @3, three float32 LE internal temperatures
      (tip/center/end) @5/@9/@13, and three ignored u16 fields @17/@19/@21.
      The internal floats are °F + 54: celsius = (raw - 54 - 32) * 5/9.
      Ambient is instead an INTEGER u16 °F + 54 value, converted with the
      same formula and rounded to integer °C; it is not a float.
    Battery from advertisements uses a fitted tanh curve (mV → %):
    52.317286 * tanh(v/273.624277936 - 8.76485439394) + 51.06925, clamped
    0-100 (tp96_battery).

    FIRMWARE/DFU: the app picks its updater by the app-internal deviceType
    it assigned the unit, and only two deviceTypes are ever offered a BLE
    update. deviceType 40 (the TP980R scan name, i.e. the TP980 variant)
    gets the Silicon Labs Gecko OTA path (OTA service
    1d14d6ee-fd63-4fa1-bfa4-8f47b42119f0, control
    f7bf3564-fb6d-4e53-88a4-5e37e0326063, data
    984227f3-34fc-4045-a5d0-2c581f81a153) with a bundled GBL image,
    version 1.17. deviceType 22 (the TP920-family Wi-Fi units that report
    type byte 0x62, scan names TP922/TP923/TP924, which are not a variant
    of this spec) gets the ASR560X path (service
    0917fe11-5d37-816d-8000-00805f9b34fb, write 09170001-…, notify
    09170002-…) with a bundled ASR560X image, version 2.5, string
    app-2.5.0-20251011.1000. TempSpike (TP960/TP962/TP968), TP940 and
    TP9012 units are never offered an update, so the ASR560X image says
    nothing about TempSpike silicon. The app also declares a 0x1850
    service (0x2C00/0x2C01) in a DFU config that no GATT lookup ever
    reads. Details are in the firmware_update feature.

    ThermoPro is rebranding to "TempPro" (announced ~April 2026; temppro.com);
    the app already references both buythermopro.com and temppro.com.

  identification:
    # The vendor app's scan config compares exact names. Broad TP9/TP2/P9
    # prefixes also admitted unrelated or unsupported products.
    local_names:
      - "Thermopro"
      - "TP901"
      - "TP902"
      - "TP922"
      - "TP939"
      - "TP938"
      - "P900"
      - "TP903"
      - "TP904"
      - "TP25"
      - "TP910"
      - "TP920"
      - "TP930"
      - "TP923"
      - "TP924"
      - "TP960R"
      - "TP962R"
      - "I61"
      - "TP970R"
      - "TP960W"
      - "I61W"
      - "TP971R"
      - "TP972R"
      - "TP963"
      - "TP971S"
      - "TP972S"
      - "TP973R"
      - "TP965R"
      - "TP966R"
      - "TP940R"
      - "TP980R"
      - "P426"
      - "P925"
      - "SmartBBQ"
    notes: >
      Exact advertised names from the vendor app's general, TempSpike, TP940,
      Wi-Fi and infrared scan groups, plus legacy SmartBBQ. "TempPro" and
      "iBBQ" are not advertised names for this spec.
  setup:
    required: false
    confidence: medium
    notes: >
      Plain BLE GATT: scan, identify the family (the UUID set and framing
      are per-family — see device.notes), connect, subscribe to the family's
      notify characteristic, run the short init handshake where the family
      requires it, then exchange opcode-prefixed commands. There is no
      provisioning, no pairing and no mesh layer. For TempSpike TP96x/TP97x
      models even the connection is optional — temperatures and battery
      arrive passively in advertisements.

      Confidence is medium: the flows are read from the vendor app and two
      independent RE projects, but have not been run against a device here.
    methods:
      - type: ble_direct
        description: >
          Scan for the advertised name (TP940R, TP980R, TP960R, Thermopro,
          SmartBBQ, ... per the app's scan config), identify the family from the
          name, connect to the family's service (see the five configs in
          device.notes — 1086FFF0-… is only the default for TP920/TP980 and
          others, write FFF1 / notify FFF2; TP940/TP960 use
          93bb7cab-… with write FF02 / notify FF01; TP9012-family uses
          0B863E05-…), enable notifications, and — on the TP920/TP25W/TP904
          family — write the fixed handshake (01 09 8a 7a ...) plus
          timestamp sync (command 0x28) before issuing commands.
        verified: false
        ble:
          pairing_required: false
        steps:
          - action: Power the thermometer on; it advertises immediately.
            actor: user
          - action: Scan for the advertised name and identify the family; the service UUID in the device's own advertisement distinguishes it (1086FFF0 is the default, not the universal case).
            actor: client
          - action: Connect to the family's service, enable notifications on its notify characteristic, and send the family handshake where required.
            actor: client
          - action: Exchange commands in the family's framing (0xAA|payload|checksum|0xFF only on TP9012; checksum-including-opcode on TP920; raw opcodes on TP940/TP960/TP980) — or, on TempSpike models, just parse the advertisements.
            actor: client
    factory_reset:
      applicable: false
      confidence: low
      effect: >
        No factory reset is documented for the probe or its transmitter, and
        there is little for one to clear: the pair holds no credentials and no
        bond, and the probe is a sealed wireless unit that charges in its
        transmitter. Removing the probe from the transmitter and re-seating it
        is the only state change available.
      description: >
        `false` rather than `unknown`, but with low confidence, and the
        distinction is worth stating: the answer here is that the vendor
        documents no reset and the hardware exposes no control that could be
        one, not that a reset was found and ruled out. If a TempSpike ever
        turns out to have a service gesture, this should become `true`.

        The pairing between the probe and its own transmitter is a separate
        matter from the BLE link this spec documents, and re-seating the probe
        in the transmitter is what re-establishes it.
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        Nothing binds the thermometer to a BLE client: no keys, no pairing, no
        account. Switching controllers is scanning and connecting from the new
        one. (The WiFi families — TP980 and TP920/TP25W — additionally hold
        WiFi credentials and a vendor-cloud binding for their uplink — that
        binding is between the device and the cloud, not the BLE client.)
    credentials:
      wifi_passphrase_protection: unknown
      stored_on_device:
        - "WiFi families (TP980, TP920/TP25W): WiFi credentials + 18-char device id (did) / cloud binding"
      issued_to_client: []
      notes: >
        No credential protects the BLE link itself — any central can connect
        and exchange commands. WiFi/cloud binding is NOT TP980-only: TP980
        (scan name TP980R, the app's "tempWifi" group) uses notification
        opcodes decimal 80-84 = 0x50-0x54 (an earlier revision of this spec
        wrote "0x80-0x84", confusing decimal with hex) for
        wifi-scan/wifi-connect/wifi-check and cloud binding, returning the WiFi
        MAC, an 18-char device did and the bound-user field; the TP920/TP25W
        family has the same capability on opcodes 0x60-0x67 (writes: scan-wifi
        0x60, connect-wifi 0x62, check-wifi 0x63, unbind 0x64, check-did 0x66;
        notifications: wifi-scan-return 0x61, wifi-connect-return 0x63/0x67,
        bound-notification 0x65, check-did-return 0x66 — from the app's TP920
        command and parse code). Unlike the TP980 set, no decimal/hex
        confusion applies to these: the literals in the app are decimal
        96-103, which equal hex 0x60-0x67 exactly as written here. The
        apparent write/notify overlaps are real request/response opcode
        sharing — the device's reply notification echoes the request's
        opcode (check-wifi write 0x63 → wifi-connect-return notify 0x63,
        check-did write 0x66 → check-did-return notify 0x66; 0x61 and 0x65
        likewise double as the client's ack writes — the wifi-scan-return ack
        carrying the scan index, and the unbind ack), while 0x67 is a
        notification-only WiFi connect-state variant with no matching write.
        So a
        WiFi passphrase IS involved for those families, and TP980W is sold as
        a Wi-Fi model. No TP980 cloud broker endpoint is identifiable from
        static code; the binding rides the device did.
  pairing:
    required: false
    confidence: "medium"
    security_mode: "none"
    bonding: "none"
    enter_pairing_mode:
      required: false
  variants:
    - model: TP9012
      description: Basic 2-probe BBQ thermometer (app code family — "TP9012" may be an internal/OEM designation; no retail page found)
      probe_count: 2
      temperature_encoding: nibbles
      temperature_encoding_detail: "(byteHigh << 4) + byteLow °C — the app's TP9012 probe-temperature decoder, NO /10. Sentinels: 0xFF,0x9C → -999.0; 0xDD,0xDD → -100.0; 0xEE,0xEE → 666.0"
      command_opcodes:
        - code: 0xB0
          name: DEVICE_CHECK
          description: Device discovery/check write and reply (write is {-80})
        - code: 0xB1
          name: SETTING_TEMP
          description: Write per-probe meat/target temp settings (the app's TP9012 temperature-setting writer, byte 0 = 0xB1)
        - code: 0xB2
          name: TEMP_AND_BATTERY_UPLOAD
          description: Temperature and battery status upload
        - code: 0xB3
          name: REMOVE_ALARM
          description: Clear probe alarm (write {-77, 1})
        - code: 0xB5
          name: SETTING_TEMP_UNIT
          description: Write temp unit C/F (the app's TP9012 unit-setting writer, byte 0 = 0xB5)
      data_format:
        temp_upload:
          - byte_offset: 0
            size: 1
            name: frame_header
            value: 0xAA
          - byte_offset: 1
            size: 1
            name: opcode
            value: 0xB2
          - byte_offset: 2
            size: 2
            name: probe1_temp_raw
            description: "(high << 4) + low °C"
          - byte_offset: 4
            size: 2
            name: probe2_temp_raw
            description: "(high << 4) + low °C"
          - byte_offset: 6
            size: 1
            name: battery_raw
            description: "battery percent = 100 - 33 * raw"
          - byte_offset: 7
            size: 1
            name: alarm_flags

    - model: TP940
      description: 4-probe (+ambient slot) BBQ thermometer with meat temperature settings
      probe_count: 4
      temperature_encoding: bcd
      temperature_encoding_detail: >
        BCD: temp = (b1>>4)*100 + (b1&0x0F)*10 + (b2>>4) + (b2&0x0F)*0.1 °C;
        negative when the high nibble of b1 is 0x9 (subtract 1000). Disconnect
        sentinel 0xCC,0xCC → -999.0 (the app's TP940 probe-temperature decoder). The TP920/
        TP25W family uses the same BCD digit layout but DIFFERENT sign/sentinel
        handling — sign = bit 0x80 of b1, sentinels 0xFF,0xFF → -999.0 /
        0xDD,0xDD → -100.0 / 0xEE,0xEE → 666.0 (the app's TP920
        probe-temperature decoder) — which is also the scheme thermopro-cli's
        decode_temperature implements, so the CLI is a valid reference for
        TP920 but NOT for TP940's sign/sentinels. TempSpike TP96x does not
        use BCD at all (u16 LE − 30, see the TP960 family below).
      features:
        - meat_temp_target_setting
        - temp_unit_change (C/F)
        - alarm_per_probe
        - probe_disconnect_detection (-999.0°C sentinel)
      protocol_notes: |
        Per-probe push notifications (temperature-return opcodes 0x61/0x10,
        probe index in byte 1) — there is NO polling state machine on this
        family; the sequential per-probe target-temp flow belongs to TP980.
        Other opcodes:
        0x02 unit, 0x04 alarm setting, 0x05 alarm close, 0x06 device close,
        0x67 color. Battery: raw×33 for both probes and box
        (per the app's TP940 parser) — note this is the INVERSE of the
        TP9012 formula (100 − 33×raw).

    - model: TP960 (TempSpike)
      description: TempSpike wireless single-probe spike + base station — the current retail focus (scan names TP960R, TP960W, I61, I61W)
      probe_count: 1
      temperature_encoding: u16le_minus_30
      temperature_encoding_detail: >
        Connected mode: u16 LE minus 30 °C (temp = raw - 30) — the SAME
        encoding as the TP96x
        passive-advertisement layout, NOT the TP940 BCD scheme. Sentinels:
        0xFF,0xFF → -999.9, and raw - 30 ≤ -30 → -999.9. Passive mode layout
        per TEMPSPIKE PASSIVE MODE in device.notes.
      features:
        - passive_advertisement_decoding (preferred — no connection needed)
        - temperature_history_upload
        - temp_unit_change (C/F)
        - per_probe_alarm
        - probe_color_setting
      protocol_notes: |
        CONNECTED-MODE opcodes. Service 93bb7cab-…, write FF02 / notify FF01,
        raw frames with NO checksum. Notifications (opcode at offset 0):
        0x01 current temp, 0x02 history upload first frame, 0x05 low battery
        upload, 0x06 box battery upload, 0x10 auto temp return, 0x11 low
        battery (alt), 0x12 probe connect upload, 0x13 temp alarm close,
        0x14 ambient temp alarm close. Writes: 0x01 read temp, 0x02 read temp
        history, 0x03 auto-notification on/off, 0x04 set probe temp alarm,
        0x05 read battery state, 0x06 read battery (TP962), 0x15 set ambient
        temperature alarm, 0x19 set temp unit, 0x1A read probe color.
        THREE BATTERY PATHS MUST NOT BE MERGED. Probe battery retains u16 LE
        millivolt bands <2311 → 0%, 2311-2450 → 33%, 2451-2600 → 66%,
        ≥2601 → 100%. Base-station/box battery is byte 1 × 33 percent (clamp
        to 100). The TP960 low-battery value is Boolean: byte 1 > 0 → 0%,
        otherwise → 100%. Passive advertisements use the fitted tanh curve
        (see device.notes), not either connected-mode conversion.

    - model: TP962 / TP968 (TempSpike variants)
      description: TempSpike multi-probe variants (scan names TP962R, TP963, TP965R, TP966R)
      probe_count: 2
      temperature_encoding: u16le_minus_30
      temperature_encoding_detail: "Same u16 LE − 30 °C encoding as TP960 (per the app's TP962/TP968 parsers); sentinel 0xFF,0xFF → -999.9."
      features:
        - passive_advertisement_decoding
        - sequential_multi_probe_read
      protocol_notes: |
        Same service/framing as TP960 but a WIDER notification dispatch
        adding a sequential target-temperature probing state machine:
        0x81 read-next-probe, 0x04/0x84 target-temperature return, 0x06/0x16
        box battery, 0x09/0x89 unit-setting return, plus 0x10 auto temp,
        0x12 probe connect,
        0x13/0x14 alarm close, 0x17 charge state change, 0x18 device close,
        0x19 temp unit change, 0x1A probe color check. Base-station/box
        battery uses byte 1 × 33 percent as on TP960; probe millivolt bands
        remain separate.

    - model: TP980
      description: Pro-grade 4-probe thermometer with history upload and WiFi uplink (TP980/TP980W sold as Wi-Fi + Bluetooth models)
      probe_count: 4
      temperature_encoding: float32le_and_u16le_fahrenheit_plus_54
      temperature_encoding_detail: >
        TP980 carries THREE float32 LE internal temperatures plus a separate
        scalar u16 LE Fahrenheit+54 value; it is not a float-only payload.
        Opcode 0x11 uses scalar @1-2 and floats @5/@9/@13; opcode 0x20 uses
        scalar @2-3 and floats @6/@10/@14. Convert each as
        °C = (raw - 54 - 32) * 5/9. Exact fields and unavailable sentinels
        are in payload_formats.TP980_TempReturn and TP980_TempAutoReturn.
      features:
        - temperature_history_upload
        - temp_unit_change
        - per_probe_target_temp
        - sequential_multi_probe_read
        - wifi_uplink_and_cloud_binding
      protocol_notes: |
        History upload: multi-chunk transfer with a first frame (opcode 0x02)
        and continuation frames, 6 bytes/record. Probe reading uses the
        sequential per-probe target-temp / read-next-probe state machine.
        Notification opcodes: 0x11 temp return, 0x12 probe connect, 0x13 temp
        alarm close, 0x14 ambient temp alarm close, 0x17 charge state change,
        0x18 device close, 0x19 temp unit change, 0x1A probe color check,
        0x20 temp auto-return, and decimal 80-84 = 0x50-0x54 for WiFi
        scan/connect/check plus cloud binding (did, bound-user). Probe
        battery retains the u16 LE millivolt bands (<2311 → 0%, 2311-2450 →
        33%, 2451-2600 → 66%, ≥2601 → 100%). Base-station battery instead
        uses byte 1 × 33 percent, clamped to 100; do not apply the probe
        millivolt bands to the base station.

payload_formats:
  TP96x_Advertisement:
    description: >
      Seven-byte TP96x manufacturer-data payload; a 13-byte variant appends
      the reversed base-station MAC at bytes 7-12. All multibyte values are
      little-endian. Layout from the open parser and app review (reported).
    fields:
      - {name: "probe_index", offset: 0, length: 1, type: "uint8"}
      - {name: "internal_temperature", offset: 1, length: 2, type: "uint16", endianness: "little", unit: "C", value_offset: -30, description: "Integer wire value minus 30 °C."}
      - {name: "battery_voltage", offset: 3, length: 2, type: "uint16", endianness: "little", unit: "mV"}
      - {name: "ambient_temperature", offset: 5, length: 2, type: "uint16", endianness: "little", unit: "C", value_offset: -30, description: "Integer wire value minus 30 °C, not Fahrenheit+54."}
      - {name: "reversed_base_station_address", offset: 7, length: 6, type: "bytes", description: "Present only in the 13-byte form; ignore for measurements."}
    parse_rules:
      - "Accept exactly 7 or 13 bytes. In the 13-byte form ignore bytes 7-12 when decoding measurements."
      - "battery_percent = clamp(52.317286 * tanh(battery_voltage / 273.624277936 - 8.76485439394) + 51.06925, 0, 100)."

  TP97x_Advertisement:
    description: >
      Twenty-three-byte TP97x manufacturer-data payload. The three internal
      temperatures are float32 LE Fahrenheit+54; ambient is a separate integer
      u16 LE Fahrenheit+54 value, NOT a float. All multibyte integers are LE.
    fields:
      - {name: "probe_index", offset: 0, length: 1, type: "uint8"}
      - {name: "ambient_temperature", offset: 1, length: 2, type: "uint16", endianness: "little", unit: "C", scale: 0.5555555555555556, value_offset: -47.77777777777778, description: "Integer Fahrenheit+54 on wire; round the converted value to integer °C."}
      - {name: "battery_voltage", offset: 3, length: 2, type: "uint16", endianness: "little", unit: "mV"}
      - {name: "tip_temperature", offset: 5, length: 4, type: "float32", endianness: "little", unit: "C", scale: 0.5555555555555556, value_offset: -47.77777777777778, description: "IEEE754 Fahrenheit+54; °C = (raw - 86) * 5/9."}
      - {name: "center_temperature", offset: 9, length: 4, type: "float32", endianness: "little", unit: "C", scale: 0.5555555555555556, value_offset: -47.77777777777778, description: "IEEE754 Fahrenheit+54; °C = (raw - 86) * 5/9."}
      - {name: "end_temperature", offset: 13, length: 4, type: "float32", endianness: "little", unit: "C", scale: 0.5555555555555556, value_offset: -47.77777777777778, description: "IEEE754 Fahrenheit+54; °C = (raw - 86) * 5/9."}
      - {name: "ignored_u16_0", offset: 17, length: 2, type: "uint16", endianness: "little"}
      - {name: "ignored_u16_1", offset: 19, length: 2, type: "uint16", endianness: "little"}
      - {name: "ignored_u16_2", offset: 21, length: 2, type: "uint16", endianness: "little"}
    parse_rules:
      - "Require exactly 23 bytes. Ambient °C = round((u16le @1 - 54 - 32) * 5/9); do not read ambient as float32."
      - "battery_percent = clamp(52.317286 * tanh(battery_voltage / 273.624277936 - 8.76485439394) + 51.06925, 0, 100)."

  TP980_TempReturn:
    description: "Opcode 0x11 notification, at least 17 bytes: scalar u16 Fahrenheit+54 plus three float32 LE Fahrenheit+54 temperatures (reported)."
    fields:
      - {name: "opcode", offset: 0, length: 1, type: "uint8", values: {17: "temperature return"}}
      - {name: "scalar_temperature", offset: 1, length: 2, type: "uint16", endianness: "little", unit: "C", scale: 0.5555555555555556, value_offset: -47.77777777777778, description: "0xFFFF = unavailable; otherwise °C = (raw - 86) * 5/9."}
      - {name: "temperature_1", offset: 5, length: 4, type: "float32", endianness: "little", unit: "C", scale: 0.5555555555555556, value_offset: -47.77777777777778}
      - {name: "temperature_2", offset: 9, length: 4, type: "float32", endianness: "little", unit: "C", scale: 0.5555555555555556, value_offset: -47.77777777777778}
      - {name: "temperature_3", offset: 13, length: 4, type: "float32", endianness: "little", unit: "C", scale: 0.5555555555555556, value_offset: -47.77777777777778}
    parse_rules:
      - "Require at least 17 bytes and opcode 0x11. Bytes 3-4 have no established meaning."
      - "Scalar 0xFFFF is unavailable. Any scalar or float whose converted value is <= -30 °C is unavailable, not a measurement."

  TP980_TempAutoReturn:
    description: "Opcode 0x20 notification, at least 18 bytes; scalar and float offsets differ from 0x11 and must not be shared (reported)."
    fields:
      - {name: "opcode", offset: 0, length: 1, type: "uint8", values: {32: "temperature auto-return"}}
      - {name: "scalar_temperature", offset: 2, length: 2, type: "uint16", endianness: "little", unit: "C", scale: 0.5555555555555556, value_offset: -47.77777777777778, description: "0xFFFF = unavailable; otherwise °C = (raw - 86) * 5/9."}
      - {name: "temperature_1", offset: 6, length: 4, type: "float32", endianness: "little", unit: "C", scale: 0.5555555555555556, value_offset: -47.77777777777778}
      - {name: "temperature_2", offset: 10, length: 4, type: "float32", endianness: "little", unit: "C", scale: 0.5555555555555556, value_offset: -47.77777777777778}
      - {name: "temperature_3", offset: 14, length: 4, type: "float32", endianness: "little", unit: "C", scale: 0.5555555555555556, value_offset: -47.77777777777778}
    parse_rules:
      - "Require at least 18 bytes and opcode 0x20. Bytes 1 and 4-5 have no established meaning."
      - "Scalar 0xFFFF is unavailable. Any scalar or float whose converted value is <= -30 °C is unavailable, not a measurement."

  TP9xx_BaseStationBattery:
    description: "Connected TP960/TP980 base-station battery response; separate from the probe's u16 millivolt bands (reported)."
    fields:
      - {name: "battery_percent_raw", offset: 1, length: 1, type: "uint8", unit: "%", scale: 33, description: "Byte 1 × 33, clamped to 100 percent."}
    parse_rules:
      - "battery_percent = min(100, byte_1 * 33). Do not read this byte as part of the probe's u16 millivolt field."

  TP960_LowBattery:
    description: "TP960 low-battery response is a Boolean alarm, not a voltage or percentage (reported)."
    fields:
      - {name: "low_battery", offset: 1, length: 1, type: "uint8", description: "Greater than zero means low battery."}
    parse_rules:
      - "battery_percent = 0 if byte_1 > 0 else 100."

services:
  # DEFAULT family config (the app's default BLE config) — TP920/TP25W, TP980 and all
  # deviceTypes without a dedicated config. NOT universal: the TP9012,
  # TP922, TP940/TP960 and TP426 families below use different UUIDs.
  - uuid: "1086fff0-3343-4817-8bb2-b32206336ce8"
    name: ThermoPro Vendor Service (default — TP920/TP25W, TP980, others)
    characteristics:
      - uuid: "1086fff1-3343-4817-8bb2-b32206336ce8"
        name: Command Write
        properties: ["write"]
        description: >
          Client → device command channel. Framing is per-family: on TP920
          frames carry a trailing checksum that INCLUDES the opcode (no
          0xAA/0xFF wrapper); on TP980 frames are raw opcode bytes with no
          checksum. This is a custom vendor service — NOT the BLE Mesh
          Proxy service (that would be 0x1828); there is no mesh anywhere
          in this product.
      - uuid: "1086fff2-3343-4817-8bb2-b32206336ce8"
        name: Notification
        properties: ["notify"]
        description: >
          Device → client notifications, opcode at offset 0 for this
          family. (The 0xAA-at-offset-0 / opcode-at-offset-1 layout belongs
          to the TP9012 family only.)

  # TP9012 family (deviceType 7/8)
  - uuid: "0b863e05-ba64-4f7a-922d-007fd52dcaa9"
    name: ThermoPro TP9012-Family Service
    characteristics:
      - uuid: "0000fff1-0000-1000-8000-00805f9b34fb"
        name: Command Write
        properties: ["write"]
        description: >
          Client → device command channel, 0xAA | payload | checksum | 0xFF
          framed (checksum = sum of payload bytes EXCLUDING the opcode, &
          0xFF — the app's TP9012 checksum helper). This wrapper is TP9012-only.
      - uuid: "0000fff2-0000-1000-8000-00805f9b34fb"
        name: Notification
        properties: ["notify"]
        description: "Notifications mirror the write side: 0xAA at offset 0, opcode at offset 1."

  # TP922 (deviceType 22)
  - uuid: "baaafff0-0001-4e6e-886a-57d347c919fe"
    name: ThermoPro TP922 Service
    characteristics:
      - uuid: "baaafff1-0001-4e6e-886a-57d347c919fe"
        name: Command Write
        properties: ["write"]
        description: "Client → device command channel."
      - uuid: "baaafff2-0001-4e6e-886a-57d347c919fe"
        name: Notification
        properties: ["notify"]
        description: "Device → client notifications."

  # TP940 (deviceType 24) and TempSpike TP960 (deviceTypes 30/31) —
  # write/notify roles are REVERSED relative to the other families.
  - uuid: "93bb7cab-eb14-c5a9-2354-a24f4df9330f"
    name: ThermoPro TP940 / TempSpike TP960 Service
    characteristics:
      - uuid: "0000ff02-0000-1000-8000-00805f9b34fb"
        name: Command Write
        properties: ["write"]
        description: "Client → device command channel (raw opcode bytes, no wrapper, no checksum). NOTE: on this service FF02 is the WRITE characteristic."
      - uuid: "0000ff01-0000-1000-8000-00805f9b34fb"
        name: Notification
        properties: ["notify"]
        description: "Device → client notifications, opcode at offset 0. NOTE: on this service FF01 is the NOTIFY characteristic."
      - uuid: "0000ff03-0000-1000-8000-00805f9b34fb"
        name: Read
        properties: ["read"]
        description: "Additional read characteristic (a second read characteristic the app's BLE manager subscribes to)."

  # TP426 infrared (deviceType 50)
  - uuid: "0f86fff0-63e8-4762-9dfb-7b6fe113376a"
    name: ThermoPro TP426 Infrared Service
    characteristics:
      - uuid: "0f86fff1-63e8-4762-9dfb-7b6fe113376a"
        name: Command Write
        properties: ["write"]
        description: "Client → device command channel."
      - uuid: "0f86fff2-63e8-4762-9dfb-7b6fe113376a"
        name: Notification
        properties: ["notify"]
        description: "Device → client notifications."

  # DFU mode
  - uuid: "00001850-0000-1000-8000-00805f9b34fb"
    name: ThermoPro DFU Service
    characteristics:
      - uuid: "00002c00-0000-1000-8000-00805f9b34fb"
        name: DFU Write
        properties: ["write"]
        description: "Named in the app's DFU config, but no code path looks it up on a connected device; its role is unknown."
      - uuid: "00002c01-0000-1000-8000-00805f9b34fb"
        name: DFU Notification
        properties: ["notify"]
        description: "Named in the app's DFU config, but no code path looks it up on a connected device; its role is unknown."

  # Vendor OTA profiles (the app's OTA config) — two SoC families with bundled firmware.
  - uuid: "0917fe11-5d37-816d-8000-00805f9b34fb"
    name: ASR560X OTA Service
    characteristics:
      - uuid: "09170001-5d37-816d-8000-00805f9b34fb"
        name: OTA Write
        properties: ["write"]
        description: "ASR560X OTA image write. The app bundles a matching image (version 2.5) and uses this path only for its deviceType 22 (TP922/TP923/TP924), not for any variant of this spec."
      - uuid: "09170002-5d37-816d-8000-00805f9b34fb"
        name: OTA Notification
        properties: ["notify"]
        description: "ASR560X OTA notifications."
  - uuid: "1d14d6ee-fd63-4fa1-bfa4-8f47b42119f0"
    name: Silicon Labs OTA Service
    characteristics:
      - uuid: "f7bf3564-fb6d-4e53-88a4-5e37e0326063"
        name: OTA Control
        properties: ["write"]
        description: "Silicon Labs OTA control point. The app writes the stack's OTA start command here, on TP980 only. Bundled firmware: a Silicon Labs OTA image, version 1.17."
      - uuid: "984227f3-34fc-4045-a5d0-2c581f81a153"
        name: OTA Data Write
        properties: ["write"]
        description: "Silicon Labs OTA data write."

features:
  # The app chooses its updater by the deviceType it assigned the unit.
  # Only two deviceTypes are ever offered a BLE update: 40 (TP980, below)
  # and 22 (TP922/TP923/TP924, the ASR560X path, not a variant here).
  # TP9012, TP940 and the TempSpike line (TP960/TP962/TP968) never are,
  # so they carry no firmware_update entry.
  - type: "firmware_update"
    variants: ["TP980"]
    dfu:
      mechanisms: ["silabs_ota", "vendor_cloud"]
      transport: ["ble", "cloud"]
      services: ["1d14d6ee-fd63-4fa1-bfa4-8f47b42119f0"]
      image:
        signing: "unknown"
        algorithm: "ecdsa_p256"
        encrypted: true
        source: "bundled_in_app"
        format: "Silicon Labs GBL (the app's bundled image, version 1.17)."
        notes: >
          The bundled GBL's header marks it encrypted and signed. It carries
          an encryption-init tag, encrypted program tags (AES-CTR) and a
          64-byte ECDSA P-256 signature tag. Whether this unit's Gecko
          bootloader enforces the signature is a build option and is not
          established. Because the payload is encrypted, a replacement
          client can deliver the vendor's image but cannot build a new one
          without the device key. The image ships in the app and stays
          there.
      enter:
        how: "stack_characteristic"
        notes: >
          The app writes 0x00 to OTA Control (f7bf3564-…) on the running
          TP980, which reboots it into AppLoader. It offers this only when
          the unit's reported BLE firmware version is above 1.0 and below
          the bundled 1.17.
      dfu_mode:
        local_names: ["OTA"]
        address_offset: 0
        notes: >
          The app's scan filter includes the exact name "OTA". It accepts
          such an advertisement only at the address of a unit it has already
          bound, so the unit keeps its address in AppLoader. On reconnecting
          to a unit whose name is now "OTA", the app writes 0x00 to OTA
          Control again, streams the GBL to 984227f3-… in MTU-sized writes,
          then writes 0x03. On success it restores the stored name to TP980R
          and disconnects. A scanner that sees "OTA" at a known TP980
          address has found that unit mid-update.
      recovery:
        interrupted: "unknown"
      verification: "reported"
      notes: >
        From static analysis of the vendor app (its per-deviceType OTA
        dispatch, OTA config and scan config) and of the bundled image's
        header, not run on hardware. The Silicon Labs OTA data
        characteristic 984227f3-… exists only in AppLoader on a stock
        stack, which is why only the OTA service is listed under
        `services`. `vendor_cloud`: when no BLE update applies, the app asks
        the ThermoPro cloud for this unit's firmware and, if an update is
        listed, sends a cloud IoT command (id 65503, payload 0xFF). The unit
        then fetches the update itself over Wi-Fi. What that updates (the
        Wi-Fi module or the whole unit) is not established. The app also
        declares a 0x1850 service (write 0x2C00, notify 0x2C01) in a DFU
        config that it instantiates but never looks up on a device. No
        mechanism is inferred from it.

evidence:
  static_analysis: >
    Static analysis of the official ThermoPro companion app. Its OEM BLE
    stack is where the five per-family configs (UUID sets, framing), the
    scan-name table, the per-model command and parser classes, and the two
    OTA paths were read.
  reference_implementations:
    - "github.com/daniel-corbett/thermopro-cli (TP25W/TP920/TP930/TP960, Python/bleak, MIT)"
    - "github.com/Bluetooth-Devices/thermopro-ble (passive advertisement parser used by Home Assistant)"
  bundled_firmware: "Two OTA images ship inside the app: an ASR560X image, version app-2.5.0-20251011.1000, and a Silicon Labs image, version 1.17."
  date_extracted: "2026-07-28"

helpful_urls:
  - title: "vitalybibikov/ha-thermopro-meat (HACS)"
    url: "https://github.com/vitalybibikov/ha-thermopro-meat"
    description: >-
      Home Assistant (HACS) integration for the active-BLE ThermoPro meat thermometers
      (TP902/TP920/TP960 incl. TempSpike, TP25W) built on this reverse-engineered protocol;
      the HA core thermopro integration covers only the passive-advertising climate sensors.
  - title: "ThermoPro TP960 TempSpike manuals"
    url: "https://www.manualslib.com/products/Thermopro-Tp960-13097163.html"
    kind: "manual"
    description: >
      Vendor manuals for the TempSpike. They document setup and the probe-in-charger pairing, and no factory reset — which is the basis for this spec's `applicable: false`.
