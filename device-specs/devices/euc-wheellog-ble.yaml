evidence:
  open_source_review: >
    Ninebot Z framing, address and command constants, repeating-XOR transform,
    telemetry and BMS layouts were transcribed from WheelLog's open-source
    NinebotZAdapter.java at 1b3707973e3b4528bd88778f9ebdf7a79817cf3f. Its
    NinebotZAdapterTest.kt cross-checks the plaintext live/BMS layouts. The
    vectors here are independently generated with invented identifiers rather
    than copied captured serials or key material. All are reported and untested
    against hardware by this project.
  open_questions: >
    The source's key-request constructor uses parameter 0x00, but its key unit
    sample carries parameter 0x01 and asserts no extracted key, so the accepted
    over-the-air key reply and exact connection-state sequence still need a
    read-only hardware capture. The BLE GATT UUIDs and advertisement identity
    are not established. Operating-time seconds and BMS capacity units come
    from the decoder's semantics, not a new capture.

remaining_unknowns:
  - "Ninebot Z advertised name, BLE service/characteristic UUIDs and whether all units require the session-key exchange."
  - "Ninebot Z key responses with parameter 0x01 versus the 0x00 response accepted by the cited decoder, and the exact initial request ordering."
  - "Ninebot Z operating-time units and BMS capacity units on hardware; all protocol details remain reported/untested."

