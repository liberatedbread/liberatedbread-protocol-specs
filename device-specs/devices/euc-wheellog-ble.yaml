evidence:
  open_source_review: >
    Ninebot Z framing, address and command constants, repeating-XOR transform,
    telemetry and BMS layouts were transcribed from WheelLog's open-source
    NinebotZAdapter.java at 1b3707973e3b4528bd88778f9ebdf7a79817cf3f. The
    reported NUS trio comes from Constants.kt and Ninebot Z entries in
    bluetooth_services.json, not from an advertisement capture. The decoder's
    key-installation branch accepts parameter 0x00; the sole upstream key
    sample instead carries parameter 0x01 and is unhandled. Synthetic vectors
    here prove only the codec with invented identifiers, never negotiation.
    All are reported and untested against hardware by this project.
  open_questions: >
    The real key-response selector, key installation and connection-state
    sequence remain pending capture. Parameter 0x00 is only a decoder branch;
    parameter 0x01 is observed but unhandled. The advertised-name identity is
    not established. Operating-time seconds and BMS capacity units come from
    the decoder's semantics, not a new capture.

remaining_unknowns:
  - "Ninebot Z advertised name and whether all units require the session-key exchange; the NUS trio is reported transport, not identity."
  - "The real Ninebot Z key response and installation: parameter 0x00 is only the decoder-accepted branch, while the sole upstream sample is parameter 0x01 and unhandled."
  - "Ninebot Z operating-time units and BMS capacity units on hardware; all protocol details remain reported/untested."

