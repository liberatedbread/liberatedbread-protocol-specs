cloud:
  required: true
  vendor_service: "FC SmartHome account/device service for initial bluetoothKey and deviceBindUserId"
  hosts: []
  auth:
    type: "other"
    notes: "Owner account and raw device record. No cloud endpoint, key or credential is reproduced. Replacement clients must use ordinary CA/hostname validation and currently supported TLS rather than copying the public Python client's disabled verification or legacy cipher choices."
    verification: "reported"
  failure_mode: >
    Initial owner record acquisition and fresh provisioning stop without the
    service. Once bluetoothKey/deviceBindUserId are cached, local BLE session
    negotiation and read-only queries need no cloud. There is no supported
    redacted offline export/import workflow, and reset does not guarantee a new
    independent client can be provisioned offline.
  notes: "Official Wi-Fi onboarding requirements do not make later BLE traffic cloud-dependent. Raw TCP 4067 and Alink/CoAP are separate unevaluated channels."

local_access:
  status: "native"
  summary: "Local encrypted BLE after owner-record provisioning. identify_only in this catalogue until a dedicated strict session handler exists; read-only operations come first."
  covers:
    - "VERIFY_IDENTITY with deviceBindUserId and per-session AES keys"
    - "v1 FC and v2 FD frame construction, zero-fill, XOR and fragmented reassembly"
    - "Read-only model/firmware/wake metadata"
    - "Users and history with pagination and unresolved semantics preserved"
    - "Documentary advanced attended USER/0x04 command 0x10 unlock"
  not_covered:
    - "Offline initial credential issuance or a MAC-only provisioning route"
    - "Generic unlock/lock/latch/beep, unattended actuation, stale SYSTEM/0x02 command 0x0E"
    - "Battery/device-information query until 0x03 versus 0x04 and item types are captured"
    - "User/credential enrollment, reset, raw TCP 4067, Alink/CoAP and firmware upload"

