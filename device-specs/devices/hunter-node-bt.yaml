remaining_unknowns:
  - "No alternate vendor decode is established for plaintext ac (which collides with 00); ambiguous challenges are rejected for a fresh login until hardware evidence resolves the intended behavior."
  - "NODE-BT-100/100-LS/100-VALVE and NODE-BT-400 behavior is unverified; only NODE-BT-200 on the cited firmware is qualified."
  - "Wrong/non-default PIN results, PIN change, address rotation, nonzero Status values and most non-idle state captures."
  - "Factory-reset procedure/effect and all OTA entry, image and recovery behavior; no destructive write is supplied."
  - "ESPHome proxy support, safe polling cadence and connection contention beyond a shared lock/fresh discovery."
  - "IntervalDayNext conversion, LastRun/log timestamps, DailyRunTime accounting, suspension expiry and clock jumps/DST."
  - "Program T/run-all and manual program behavior beyond the app-derived fixed commands; cycle/soak and master-valve behavior."
  - "The schema cannot express the PIN exchange, JSON fragment reassembly or schedule transaction guard; a dedicated handler is required."

