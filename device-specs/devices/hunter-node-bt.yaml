  app_static_analysis: >
    com.hunter.nodev2 6.0.611246 (versionCode 611246) was reviewed without
    running it. Its base APK SHA-256 exactly matches the binary analyzed in
    the public protocol document. Derived UUIDs, PIN transform, JSON messages
    and clock behavior are reported, never hardware-confirmed by this project.
  open_questions: >
    One-/four-station units and other firmware; non-default/wrong PIN,
    nonzero statuses, address rotation and live enum values; proxy operation,
    polling cost, interval-date/log/LastRun timestamp semantics, factory reset
    and OTA. The exact firmware cause of the combined schedule-write defect
    is unknown, so the prohibition is categorical.
