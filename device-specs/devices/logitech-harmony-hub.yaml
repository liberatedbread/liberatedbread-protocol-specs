# Logitech Harmony Hub — Device Specification
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# Sources (all public; clean-room — derived facts only):
#   - ehendrix23/aioharmony (Apache-2.0; lineage pyharmony) — the local
#     WebSocket/XMPP client Home Assistant uses.
#   - JordanMartin/harmonyhub-api (Node) — the port-8088 provisioning handshake.
#   - Home Assistant harmony integration + the 2018 local-API history.
#   - Logitech's Hub quick start guide, Smart Control user guide and "Reset
#     the Harmony Hub" article — the two first-run routes, the supported
#     Wi-Fi modes and the reset procedure.
#   - jaymzh/concordance (libconcord, GPL-3.0) — the Hub's USB product ID
#     and the MyHarmony USB protocol; see
#     targets/logitech-harmony-usb-remotes.md.
#   - captivus/harmony-hub-setup (MIT, 2026) — the Bluetooth first-run over
#     RFCOMM and the pre-account setup probes on port 8088.
#   - Ripthulhu/harmony-hub-root (2026) — Wi-Fi, factory reset and firmware
#     over the Hub's USB port.

device:
  name: "Logitech Harmony Hub"
  manufacturer: "Logitech"
  manufacturer_status: "abandoned"
  testing:
    status: untested
    notes: >
      Not driven against hardware by this project. Facts are from the
      aioharmony and harmonyhub-api open-source clients and Home Assistant's
      integration; the WebSocket envelope, command strings and params in
      `websocket`/`commands` were transcribed from aioharmony's source
      (hubconnector_websocket.py, const.py, harmonyclient.py) rather than
      captured, so they are `reported`. The two first-run routes are
      Logitech's documentation; their wire formats are transcribed from
      harmony-hub-setup (Bluetooth) and harmony-hub-root (USB), both of which
      their authors ran against hubs and neither of which this project has
      replayed.
  protocol: "wifi"
  category: "hub"
  # The control surface is the port-8088 WebSocket (root `websocket` block);
  # the one HTTP exchange is the provisioning POST that yields the remoteId.
  transport: "websocket"
  notes: >
    The Harmony Hub is Logitech's IR/Bluetooth/IP universal-remote bridge: it
    holds a configuration of "activities" (Watch TV, Play Game) and "devices"
    and blasts IR / sends IP or Bluetooth commands to control an AV stack.
    Logitech ended Harmony manufacturing in April 2021 and has begun dropping
    support for older remotes, so the hardware is on borrowed time — but local
    control survives entirely without Logitech's cloud.

    LOCAL CONTROL: the hub exposes a WebSocket API on TCP 8088 with no
    authentication beyond a locally-retrievable `remoteId`. A one-time HTTP POST
    to port 8088 returns the remoteId; the client then opens a WebSocket and
    issues JSON requests: get the config (activities + devices, each with a
    label and id), get the current activity, start/stop an activity by id, send
    a device command, hold a command for a duration, and change channel. Every
    request carries a unique id echoed in the reply. Idle WebSocket connections
    are closed by the hub after ~60s unless pinged.

    HISTORY (worth knowing): firmware 4.15.206 (Dec 2018) removed the older XMPP
    local API and broke local control; after community backlash Logitech
    restored a local API path (XMPP re-enabled in 4.15.250, Feb 2019) and
    committed to keeping local access. Modern firmware defaults to the WebSocket
    transport; legacy hubs may still expose XMPP. aioharmony speaks both.

    SERVICE STATUS: on 28 May 2025 Logitech shut down Harmony Remote Software,
    the service that configured its older USB remotes (the 5xx-1100 lines and
    the Harmony for Xbox 360). The Hub is not on that list; Logitech's notice
    says it and the later remotes stay supported through the Harmony app and
    MyHarmony, and no end date has been announced. The Hub's predecessor, the
    Harmony Link, lost its service on 16 March 2018. Configuration is compiled
    by Logitech's service and synced down to the hub; there is no open way to
    author it, so keep the hub's current configuration working and note what
    it contains while the service still answers.

    SETUP CHANNELS: besides the LAN, the hub takes one packet format over two
    links. Over USB (micro-USB, 046d:c129, HID) it is the MyHarmony file
    protocol libconcord documents for the 200, 300, Link and Touch, and it
    works on a configured hub as well as a fresh one. Over Bluetooth a hub in
    setup mode takes the same format's JSON requests on an RFCOMM channel --
    Bluetooth Classic, not GATT: the Android app's path, which the open
    client was derived from. Logitech's guides say Bluetooth LE, and whether
    the iOS app reaches the hub over a GATT service instead is not known.
    Both links carry Wi-Fi setup; USB also carries factory reset and
    firmware. protocol_details.setup_channel has the frames; the byte-level
    file protocol is in targets/logitech-harmony-usb-remotes.md.

  openness:
    status: "undocumented"
    reverse_engineered: true
    source_code: "https://github.com/ehendrix23/aioharmony"
    notes: >
      Logitech publishes no local protocol documentation; the WebSocket and
      XMPP surfaces were reverse-engineered by the community. aioharmony (which
      Home Assistant uses) is the reference implementation.

  identification:
    default_port: 8088
    ssdp_search_targets:
      - "urn:myharmony-com:device:harmony:1"

  discovery:
    methods:
      - type: "ssdp"
        ssdp:
          search_targets:
            - "urn:myharmony-com:device:harmony:1"
          response_mapping:
            location:
              action: "fetch_xml"
              parse:
                device_identity:
                  stable_keys:
                    - source: "xml://device/UDN"
                      key: "udn"
                  display:
                    source: "xml://device/friendlyName"
          match:
            description: "Manufacturer 'Logitech', device type urn:myharmony-com:device:harmony:1."
            manufacturer_exact: "Logitech"
        notes: >
          Hubs answer SSDP for urn:myharmony-com:device:harmony:1 (this is the
          search target Home Assistant's discovery uses). The community
          harmonyhubjs-discover tool alternatively listens on a local UDP port
          for hub responses.
    identity:
      stable_keys: ["udn"]
      display: "friendlyName"
    static_ip_required: false

  setup:
    required: true
    confidence: "medium"
    notes: >
      Getting a hub from the box to local control is three things in order:
      put it on Wi-Fi, give it a configuration (activities and devices) through
      a Harmony account, then fetch its remoteId locally. Logitech documents
      two ways to do the first -- Bluetooth from the Harmony app, or USB from a
      computer -- and those are the two routes below. Each now has an open
      implementation: harmony-hub-setup does the Bluetooth half from Linux and
      harmony-hub-root the USB half, so the Wi-Fi step no longer needs
      Logitech's software. The account step, the same in both routes, still
      does: nothing documented can author a configuration locally. Once
      configured, local control needs no pairing: any LAN client fetches the
      remoteId with the port-8088 POST and opens the WebSocket. Confidence is
      medium rather than high because the account step's local half is
      encrypted and not fully described, and nothing here has been replayed
      by this project.
    methods:
      - type: "ble_provisioning"
        name: "Bluetooth (app or RFCOMM client) for Wi-Fi, then a Harmony account"
        role: "primary"
        verified: false
        description: >
          The route Logitech's quick start guide leads with. The Android
          Harmony app -- or any host with Bluetooth Classic -- hands the hub
          the Wi-Fi credentials over RFCOMM (the iOS app's transport is not
          established); the app then signs in to a Harmony account and the
          activities and devices are set up and synced down to the hub.
          The method type is the nearest the schema has: the credentials
          cross Bluetooth, but on an RFCOMM channel, not a GATT service.
        stages:
          - type: "ble_provisioning"
            name: "Join Wi-Fi over Bluetooth RFCOMM"
            verified: false
            description: >
              A new or factory-reset hub waits in Bluetooth setup mode. A host
              connects to RFCOMM channel 1 and exchanges JSON requests framed
              as `SetupFrame` below; each reply is a JSON object carrying the
              request's `id`, a `code` (200 on success) and `data`. The
              sequence is the Android app's, as harmony-hub-setup replays it.
              The hub takes 2.4 GHz 802.11 b/g/n networks secured with WPA,
              WPA2-AES or 64/128-bit WEP (Logitech's Smart Control guide). The
              Wi-Fi password travels as plain JSON inside the frame.
            ble:
              protocol: "Harmony setup JSON over Bluetooth Classic RFCOMM channel 1 (not GATT)"
            steps:
              - action: "Power a hub that is new or has just been factory reset; it enters Bluetooth setup mode once the reset's red flicker stops. In the Harmony app the equivalent is: when the app asks, wait 30 seconds, then press Pair/Reset on the back of the hub."
                actor: "user"
              - action: "Find the hub in a Bluetooth Classic inquiry and open an RFCOMM connection to channel 1."
                actor: "client"
                request:
                  service: "Bluetooth Classic RFCOMM, channel 1"
                expect: "The connection opens. harmony-hub-setup accepts any device whose name contains 'harmony' or 'logitech' (case-insensitive); its example shows 'Harmony Hub'."
                timeout_seconds: 10
              - action: "Send connect.ping."
                actor: "client"
                request:
                  service: "Harmony setup JSON (SetupFrame)"
                  action: "connect.ping"
                expect: "code 200; data.uuid is the hub's UID."
              - action: "Scan for networks with wifi.networks."
                actor: "client"
                request:
                  service: "Harmony setup JSON (SetupFrame)"
                  action: "wifi.networks"
                expect: "code 200; data is a list (or {networks: [...]}) of {ssid, signal, encryption, channel}. `channel` carries the frequency in MHz (2422), not a channel number; `encryption` may be a string or a list."
                timeout_seconds: 90
              - action: "Fetch the Bluetooth nonce with bt.nonce and keep it."
                actor: "client"
                request:
                  service: "Harmony setup JSON (SetupFrame)"
                  action: "bt.nonce"
                expect: "code 200; data.nonce, 32 characters. Not used by the Wi-Fi join; after account provisioning the hub's setup endpoint wants encrypted requests, and this nonce is one of the two keys for them (protocol_details.setup_endpoint)."
              - action: "Send wifi.connect with the network."
                actor: "client"
                request:
                  service: "Harmony setup JSON (SetupFrame)"
                  action: "wifi.connect"
                  arguments:
                    - name: "ssid"
                      type: "string"
                      required: true
                    - name: "password"
                      type: "string"
                      required: true
                      description: "Plain text."
                    - name: "encryption"
                      type: "string"
                      required: true
                      description: "The open clients send WPA2-PSK; use what wifi.networks reports for the network."
                expect: "code 200. A first attempt answering code 500 has been seen; send it again."
                timeout_seconds: 90
              - action: "Poll wifi.connect with no data every 10 seconds until the hub reports the join."
                actor: "client"
                request:
                  service: "Harmony setup JSON (SetupFrame)"
                  action: "wifi.connect"
                expect: "data.connect_status is \"connected\" and data.ip_address is set. harmony-hub-setup re-sends the join and keeps polling for up to 180 s."
                timeout_seconds: 180
              - action: "Send setup.account?provision with the pre-account provisionInfo (mode \"2\")."
                actor: "client"
                request:
                  service: "Harmony setup JSON (SetupFrame)"
                  action: "setup.account?provision"
                  arguments:
                    - name: "provisionInfo"
                      type: "object"
                      required: true
                      description: >
                        {"authToken": "", "discoveryServer":
                        "https://svcs.myharmony.com/Discovery/Discovery.svc",
                        "susChannel": "production", "email": "", "name":
                        "Harmony Hub", "mode": "2"} -- the Android app's
                        placeholder before an account exists.
                expect: "code 200; setup.account?getProvisionInfo then reports mode 2 with accountId, authToken, email, username and activeRemoteId empty, and the hub answers the pre-account probes on port 8088 (protocol_details.setup_endpoint)."
                timeout_seconds: 120
            payload_formats:
              SetupFrame:
                description: >
                  One request on the Bluetooth setup channel, and also the
                  JSON request form on the USB channel (where the bytes are
                  cut into 64-byte HID reports). In the MyHarmony packet
                  format it is command 0x08 with one parameter -- a packet
                  count of 2, one more than the single data packet that
                  follows -- and a data packet carrying the JSON.
                parse_rules:
                  - "Request = FF 08 00 01 01 02 01, then the payload length, then the UTF-8 JSON {\"cmd\": <command>, \"data\": <object, omitted when there is none>, \"id\": <integer>}."
                  - "Payload length up to 63 bytes: one byte, 0x80 | length. Longer: two bytes, 0xC0 | (length >> 8), then length & 0xFF. A reader tells them apart by bit 0x40 of the first byte. harmony-hub-setup already switches to the two-byte form above 62; both forms decode. Maximum 16383."
                  - "Replies arrive as a byte stream with framing bytes around JSON objects. Scan for each '{', decode one JSON object from there, and take the one whose id matches the request."
                example: |
                  connect.ping, id 1 (37 bytes):
                  FF 08 00 01 01 02 01 9D {"cmd":"connect.ping","id":1}
                  wifi.connect, 109-byte payload: FF 08 00 01 01 02 01 C0 6D <payload>
            timing:
              wifi_networks_timeout_s: 90
              wifi_connect_timeout_s: 90
              wifi_status_poll_interval_s: 10
              wifi_join_max_wait_s: 180
              provision_timeout_s: 120
          - type: "cloud_account"
            name: "Configure activities and devices in a Harmony account"
            verified: false
            description: &harmony_account_stage >
              Activities and devices are authored in the Harmony app (or
              MyHarmony) against Logitech's device database; the service
              compiles the configuration and the hub syncs it. This is the
              step no local path replaces. Restoring a reset hub from an
              account: partway through ("Preparing your hub") the app asks
              for the Pair/Reset button again, and that is expected. Leave the
              hub powered for at least two minutes after the app reports
              success; unplugging sooner has been seen to roll it back to
              unprovisioned (harmony-hub-setup's notes).
            cloud:
              local_alternative: &harmony_local_alternative >
                Yes for CONTROL -- once the hub is configured, the local
                WebSocket API on port 8088 drives it with no cloud. No for
                AUTHORING: adding or changing devices and activities needs
                Logitech's service, which still runs for the Hub as of
                2026-10 but has already been withdrawn from the older
                remotes. Keep a hub's working configuration rather than
                resetting it.
            steps:
              - action: "Create or sign in to a Harmony account and add the devices and activities (or restore them)."
                actor: "user"
                expect: "The hub syncs the configuration; get_config returns the activities and devices, and getProvisionInfo reports mode 3 with an accountId."
          - type: "none"
            name: "Fetch the remoteId for local control"
            verified: false
            description: &harmony_remote_id_stage >
              Nothing to pair: any LAN client asks the hub for its remoteId
              and opens the WebSocket with it.
            issues_credentials: &harmony_remote_id_credential
              remote_id:
                command: "get_provision_info"
                reply_path: "data.activeRemoteId"
                notes: >
                  The value the WebSocket connect path's `{remote_id}` and
                  every frame's `hubId` are filled from. Not a secret -- any
                  LAN client can fetch it again -- but it is per-hub, so
                  store it keyed by the hub's UDN.
            steps: &harmony_remote_id_steps
              - action: "Retrieve the hub's remoteId with the port-8088 provisioning POST (`get_provision_info`), then open the WebSocket for local control."
                actor: "client"
                request:
                  protocol: "http"
                  action: "POST / on port 8088"
                expect: "JSON reply whose data.activeRemoteId is the hub's remoteId."
      - type: "wired"
        name: "USB (MyHarmony or HID client) for Wi-Fi, then a Harmony account"
        role: "alternative"
        verified: false
        description: >
          Logitech's fallback for a phone without Bluetooth, and the route for
          setting up from a PC or Mac. The Hub quick start sends such users to
          setup.myharmony.com on a computer; Logitech's Smart Control guide
          shows MyHarmony reaching the hub over a USB cable plugged straight
          into the computer (the micro-USB port is also the hub's power
          connector). harmony-hub-root does the same Wi-Fi write without
          Logitech's software. The same account step follows.
        stages:
          - type: "wired"
            name: "Write the Wi-Fi credentials over USB"
            verified: false
            description: >
              Over USB the hub is 046d:c129, a HID device with 64-byte reports
              (65 with the report-ID byte a host API adds). It speaks the
              MyHarmony file protocol libconcord documents for the 200, 300
              and Link: open a path for read or write, move data packets,
              close. Wi-Fi is two text files of `key,value` lines.
              harmony-hub-root reports this working on Windows; its Linux and
              macOS paths are marked untested by its author. Framing,
              handshake and transfer are in targets/logitech-harmony-usb-remotes.md.
            steps:
              - action: "Connect the hub's micro-USB port to a USB port on the computer itself, not through a USB hub (Logitech's troubleshooting advice)."
                actor: "user"
              - action: "Open the HID device 046d:c129 and read /sys/wifi/networks for a scan."
                actor: "client"
                expect: "Blocks beginning `item,<n>` with `ssid`, `encryption`, `channel` (a frequency in MHz) and `signal_strength`, one `key,value` per line."
              - action: "Write /sys/wifi/connect with the network as `key,value` lines: `ssid,<ssid>`, `password,<passphrase>`, `encryption,<type>`, each ending in a newline. Add `nosave,true` for a join that is not remembered."
                actor: "client"
                expect: "The write is acknowledged with the file handle echoed back; the hub may drop off and rejoin while it connects. harmony-hub-root sends encryption WPA2-PSK by default and allows NONE or OPEN without a password."
                timeout_seconds: 100
              - action: "Read /sys/wifi/connect back."
                actor: "client"
                expect: "connect_status is \"connected\", error_code is none or empty, and ip_address is set. The read also returns the stored password in plain text."
          - type: "cloud_account"
            name: "Configure activities and devices in a Harmony account"
            verified: false
            description: *harmony_account_stage
            cloud:
              local_alternative: *harmony_local_alternative
            steps:
              - action: "Sign in to the Harmony account in MyHarmony (or the app) and add or restore the devices and activities."
                actor: "user"
                expect: "The hub syncs the configuration; get_config returns the activities and devices."
          - type: "none"
            name: "Fetch the remoteId for local control"
            verified: false
            description: *harmony_remote_id_stage
            issues_credentials: *harmony_remote_id_credential
            steps: *harmony_remote_id_steps
    factory_reset:
      applicable: true
      confidence: "medium"
      effect: >
        Erases the hub's account information and with it the synced
        activities and devices, and returns the hub to Bluetooth setup mode,
        so it has to go through first-run and be configured from the account
        again. Logitech's article states the account part; harmony-hub-setup
        describes the return to Bluetooth setup mode.
      procedures:
        - name: "Pair/Reset held while power is applied"
          verified: false
          basis: "Logitech support article 'Reset the Harmony Hub' (see helpful_urls), with the duration and end state from harmony-hub-setup's README; not replayed here."
          indicator: "The LED flickers red for about 30 seconds, then the hub enters Bluetooth setup mode."
          steps:
            - action: "Unplug the hub's power adapter."
              actor: "user"
            - action: "Press and hold the Pair/Reset button on the back of the hub."
              actor: "user"
            - action: "Keep holding it and plug the power adapter back in."
              actor: "user"
              expect: "The LED flickers red. Neither source gives a hold time or says exactly when to release."
            - action: "Wait until the LED stops flickering, about 30 seconds."
              actor: "user"
              expect: "The hub is back in Bluetooth setup mode."
        - name: "Factory reset over USB"
          verified: false
          basis: "harmony-hub-root's factory-reset action (see helpful_urls); not replayed here."
          steps:
            - action: "Over the USB file protocol, write the single byte '1' to /sys/factoryreset and close it."
              actor: "client"
              notes: "harmony-hub-root sends this write and the next with sequence 0 throughout and the data packet's length byte as 0x00, copying the vendor software's template; whether the ordinary form is accepted is not stated."
            - action: "Write the text 'reboot' to /sys/reboot and close it."
              actor: "client"
              expect: "The hub reboots unprovisioned and must go through first-run again."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        Wi-Fi can be changed while the hub is configured: from the app, or
        over USB by writing /sys/wifi/connect (harmony-hub-root documents
        doing this to an already set-up hub). Local control resumes once the
        hub rejoins the LAN; rediscover it by UDN rather than by its old
        address.
    credentials:
      wifi_passphrase_protection: plaintext
      stored_on_device:
        - "Wi-Fi credentials"
        - "Activity and device configuration"
        - "Harmony account binding"
      issued_to_client:
        - "remoteId (retrieved from the hub over the port-8088 POST; gates the WebSocket session)"
        - "Bluetooth nonce (from bt.nonce during first-run; one of the two keys for the setup endpoint's encrypted requests after account provisioning)"
      notes: >
        The remoteId is retrievable by any LAN client — it is not a secret so
        much as a session parameter. Local control is otherwise unauthenticated
        on the LAN. The Wi-Fi passphrase is plain text on both setup links: a
        JSON field on the Bluetooth channel, and a `password,` line in
        /sys/wifi/connect over USB, which reads back the same way. Whether the
        RFCOMM link itself is encrypted by Bluetooth pairing is not
        established.

http_endpoints:
  - method: "POST"
    path: "/"
    name: "Provisioning — get remoteId (port 8088)"
    description: >
      One-time handshake on port 8088. POST with headers Origin:
      http://sl.dhg.myharmony.com, Content-Type: application/json,
      Accept-Charset: utf-8, and body
      {"id":1,"cmd":"setup.account?getProvisionInfo","params":{}}. The reply
      carries the hub's remoteId, which the WebSocket session below needs.
    request_body:
      content_type: "application/json"
      fields:
        - name: "cmd"
          type: "string"
          description: "\"setup.account?getProvisionInfo\"."
    response_body:
      content_type: "application/json"
      fields:
        - name: "data.activeRemoteId"
          type: "string"
          description: "The hub's remoteId (per-hub, not a session credential); fills `{remote_id}` in the WebSocket connect path and every frame's `hubId`."
        - name: "data.friendlyName"
          type: "string"
          description: "The hub's user-set name."

protocol_details:
  # Narrative and history. The executable half -- where the socket is and
  # how a command becomes a frame -- is the root `websocket` block; the
  # invocations are in `commands`. Both are transcribed from the open-source
  # aioharmony client (Harmony-Libs/aioharmony: hubconnector_websocket.py
  # for the connect URL, envelope and provisioning POST; const.py and
  # harmonyclient.py for the command strings and params) and its PROTOCOL.md.
  hub_protocol:
    verification: "reported"
    transport: "WebSocket, JSON text frames, TCP 8088; provisioning over HTTP on the same port"
    provisioning: >
      Before the socket can be opened the client needs the hub's remoteId:
      POST http://<ip>:8088/ with Origin: http://sl.dhg.myharmony.com,
      Content-Type: application/json, Accept: application/json and
      Accept-Charset: utf-8, body
      {"id":1,"cmd":"setup.account?getProvisionInfo","params":{}}. The reply
      is {"cmd":..., "code":200, "data":{"activeRemoteId": "<remoteId>",
      ...}}. The Origin header is what the hub keys the request on; without
      it the POST is refused.
    envelope: >
      Every request on the socket is one JSON text frame
      {"hubId": "<remoteId>", "timeout": <seconds>, "hbus": {"cmd":
      "<mime>?<operation>", "id": <client-chosen unique id>, "params":
      {...}}}. The hub answers with a frame carrying the same id, a "code"
      (100 = in progress, 200 = done) and "data". cmd is the pair of an
      XMPP-era mime type and an operation, joined with "?":
      "vnd.logitech.harmony/vnd.logitech.harmony.engine?config",
      "harmony.activityengine?runactivity",
      "vnd.logitech.harmony/vnd.logitech.harmony.engine?holdAction". The
      `timeout` is the hub-side reply timeout in seconds (aioharmony sends
      5, the Node clients 30; either works). Reads take params
      {"verb":"get","format":"json"}.
    hold_action: >
      A device command is a press followed by a release: two holdAction
      frames whose params differ only in "status" ("press", then
      "release"). The "action" param is a STRING, not an object, and inside
      it every colon is doubled -- {"command":: "VolumeUp","type"::
      "IRCommand","deviceId":: "12345"} -- which is the hub's own escaping
      of the XMPP-era attribute syntax (PROTOCOL.md shows the same "::" in
      the XMPP form). Send the release a short interval after the press
      (aioharmony defaults to ~0.1 s; a longer gap is a held key).
    activities: >
      runactivity takes params {"async":"true","timestamp":0,"activityId":
      "<id>"}; the hub streams progress frames (code 100, data.done /
      data.total) and pushes an "activityId" change notification when the
      activity is running. Activity id "-1" is the built-in PowerOff. The
      current activity is getCurrentActivity, whose data.result is the id.
    keepalive: >
      Idle sockets are closed by the hub after ~60 s; aioharmony sends a
      WebSocket ping every 30 s and expects a pong within 15 s.
    history: >
      Firmware 4.15.206 (Dec 2018) removed the XMPP local API on TCP 5222;
      4.15.250 (Feb 2019) restored it after community backlash. The
      WebSocket surface above is the one modern firmware speaks by default;
      aioharmony keeps an XMPP connector for hubs that still expose 5222.
      Only the WebSocket transport is declared here.
    cloud_sync: >
      The hub holds a compiled configuration it pulls from Logitech's
      service. aioharmony exposes a "sync" that sends the mime
      "setup.sync" on this socket to make the hub fetch its current
      configuration from the web service. Its string formatting appends
      "?None" as the operation, and it treats a code-200 reply as success,
      so that exact string is what the hub has been answering. It is a
      trigger for the cloud, not a local configuration surface: it does
      nothing useful once the service is unreachable, and no local command is
      known that adds or edits a device or activity.
  setup_channel:
    verification: "reported"
    links: >
      USB: HID 046d:c129, 64-byte reports with no report ID (a host API that
      wants one gets 0x00 first). Bluetooth: RFCOMM channel 1, a byte
      stream. Both carry the MyHarmony packet format libconcord documents for
      its USB remotes -- command packets FF <command> <sequence> <parameter
      count> <parameters>, data packets <sequence> <length> <data> -- with
      the details in targets/logitech-harmony-usb-remotes.md.
    commands: >
      01 opens a file (path, then "R" or "W", then for a write the size as a
      big-endian 32-bit parameter); the reply carries a one-byte file handle,
      which every later message for that file repeats. 03 and 04 are write
      and read flow control, 05 commits a written file, 06 checks it (handle,
      01, checksum type as a string, seed, offset, length, expected value)
      and 07 closes it. 08 is a JSON request: one parameter, a packet
      count of 2, then one data packet holding the JSON -- the SetupFrame of
      the Bluetooth setup method, and the form harmony-hub-root uses for JSON
      commands over USB. FF with a one-byte parameter is a device control:
      0x66 resets the firmware staging area (observed to answer FF FF 81 00
      rather than echoing the request's sequence), 0x00 reboots.
    files: >
      /rf/deviceinfo -- identity (harmony-hub-root reads this, not the
      /sys/sysinfo the older MyHarmony remotes serve).
      /sys/wifi/networks -- scan, `key,value` lines in blocks starting
      `item,<n>`: ssid, encryption, channel (MHz), signal_strength.
      /sys/wifi/connect -- write ssid, password, encryption and optionally
      nosave,true to join; read for connect_status, ssid, encryption,
      ip_address, error_code and the password.
      /sys/factoryreset -- write "1" to reset; /sys/reboot -- write
      "reboot" to restart. /fw/otaupdate -- firmware (features[0]).
    json_commands: >
      On the Bluetooth channel, harmony-hub-setup sends connect.ping (data.uuid),
      wifi.networks, bt.nonce (data.nonce), wifi.connect with and without
      {ssid, password, encryption}, setup.account?getProvisionInfo,
      setup.account?provision, setup.firmware?status (data.currentVersion),
      rf.info and connect.statedigest?get. Replies are JSON objects with the
      request's id, a code and data.
  setup_endpoint:
    verification: "reported"
    description: >
      The same port 8088 that serves the WebSocket answers JSON POSTs to "/"
      during setup. harmony-hub-setup replays the Android app's pre-account
      probes there with Origin http://localhost.nebula.myharmony.com, a
      Referer under the same host, Content-Type application/json and body
      {"id": "<id>", "cmd": "<command>", "params": {...}}:
      connect.ping, connect.sysinfo?get, setup.account?getProvisionInfo,
      connect.discoveryinfo?get, setup.firmware?check and connect.rf?info.
      aioharmony's get_provision_info sends a different Origin
      (http://sl.dhg.myharmony.com) and also works, so the hub accepts at
      least these two values; which Origins it rejects is not known.
    provision_modes: >
      setup.account?getProvisionInfo reports `mode`: "2" after the Bluetooth
      first-run's placeholder provisioning (no account fields set), "3" once
      the hub is provisioned to an account (accountId and activeRemoteId set,
      `se` true).
    encryption_boundary: >
      Once a hub is in mode 3, the setup endpoint answers many plain-JSON
      commands with HTTP 417; getProvisionInfo still works in the clear. The
      app then sends its setup requests encrypted: the request JSON (id, cmd,
      optional params, timeout) under AES-CBC with an all-zero IV, keyed by
      the account's hub secret when the app has one and otherwise by the
      Bluetooth nonce, sent as hex text with Content-Type
      application/octet-stream. How the key bytes are derived from the
      32-character nonce, and the padding, are not stated by the source
      (harmony-hub-setup's provisioning notes). The WebSocket control API in
      this spec is not affected.
  community_root:
    verification: "reported"
    description: >
      harmony-hub-root also offers root SSH on a hub over the LAN. Not
      investigated here; noted because with root the hub's synced
      configuration could be copied off, which nothing else documented can
      do.

# Where the socket is and how a command becomes a frame. Placeholders:
# {remote_id} is the stored `remote_id` credential (issued by
# get_provision_info), {request_id} the client-chosen correlation id,
# {action} the command's `action` (the "<mime>?<operation>" cmd string) and
# {arguments} its `arguments` object (the hbus params).
websocket:
  connect:
    port: 8088
    scheme: "ws"
    path: "/?domain=svcs.myharmony.com&hubId={remote_id}"
    heartbeat_seconds: 30
  channels:
    - name: "hbus"
      default: true
      encoding: "json"
      frame:
        hubId: "{remote_id}"
        timeout: 30
        hbus:
          cmd: "{action}"
          id: "{request_id}"
          params: "{arguments}"
      description: >
        The only channel. Every request is one JSON text frame in this
        envelope; replies carry the same id with "code" and "data"
        (hub_protocol.envelope). The hub also pushes unsolicited frames on
        this socket (activity changes, config updates) with no request id.
  notes: >
    No pairing block: the socket needs nothing beyond the remoteId in the
    connect path, and that is fetched from the hub itself by
    get_provision_info -- not issued by a consent flow the schema's pairing
    modes describe. Verification: reported (aioharmony, harmonyhubjs).

# Invocations. The four control commands ride the hbus channel (no
# `transport` key: device.transport is websocket); get_provision_info is
# the one HTTP exchange, on the same port. Example bodies use id 1 and the
# placeholder remoteId "<remoteId>".
commands:
  get_provision_info:
    description: >
      Fetch the hub's remoteId, the value every WebSocket frame's hubId and
      the connect path carry. One HTTP POST on port 8088 -- the same port as
      the socket -- with the Origin header the hub insists on. Not
      authenticated; any LAN client may call it.
    transport: "http"
    method: "POST"
    path: "/"
    action: "Provisioning — get remoteId (port 8088)"
    headers:
      Origin: "http://sl.dhg.myharmony.com"
      Content-Type: "application/json"
      Accept: "application/json"
      Accept-Charset: "utf-8"
    body: '{"id":1,"cmd":"setup.account?getProvisionInfo","params":{}}'
    example_body: '{"id":1,"cmd":"setup.account?getProvisionInfo","params":{}}'
    returns:
      - name: "data.activeRemoteId"
        type: "string"
        description: "The remoteId; store it as the `remote_id` credential."
      - name: "data.friendlyName"
        type: "string"
        description: "The hub's user-assigned name."
    verification: "reported"
  get_config:
    description: "Fetch the full config: activities and devices, each with a label and numeric id, plus each device's controlGroup command lists (the names send_command takes)."
    action: "vnd.logitech.harmony/vnd.logitech.harmony.engine?config"
    arguments:
      verb: "get"
      format: "json"
    example_body: '{"hubId":"<remoteId>","timeout":30,"hbus":{"cmd":"vnd.logitech.harmony/vnd.logitech.harmony.engine?config","id":1,"params":{"verb":"get","format":"json"}}}'
    returns:
      - name: "data.activity[]"
        type: "array"
        description: "Activities: {id, label, type, ...}; id \"-1\" is PowerOff."
      - name: "data.device[]"
        type: "array"
        description: "Devices: {id, label, controlGroup[{name, function[{name, action}]}], ...}."
    verification: "reported"
  get_current_activity:
    description: "Which activity is running; data.result is the activity id as a string, \"-1\" when everything is off."
    action: "vnd.logitech.harmony/vnd.logitech.harmony.engine?getCurrentActivity"
    arguments:
      verb: "get"
      format: "json"
    example_body: '{"hubId":"<remoteId>","timeout":30,"hbus":{"cmd":"vnd.logitech.harmony/vnd.logitech.harmony.engine?getCurrentActivity","id":1,"params":{"verb":"get","format":"json"}}}'
    returns:
      - name: "data.result"
        type: "string"
        description: "Current activity id; \"-1\" = PowerOff."
    verification: "reported"
  get_discovery_info:
    description: >
      The hub's discovery record, over the socket rather than SSDP.
      aioharmony reads it at connect time alongside get_provision_info and
      takes the hub's display name from it; the rest of the record is not
      documented by any source read.
    action: "connect.discoveryinfo?get"
    arguments:
      verb: "get"
      format: "json"
    example_body: '{"hubId":"<remoteId>","timeout":30,"hbus":{"cmd":"connect.discoveryinfo?get","id":1,"params":{"verb":"get","format":"json"}}}'
    returns:
      - name: "data.friendlyName"
        type: "string"
        description: "The hub's user-assigned name."
    verification: "reported"
  start_activity:
    description: "Start an activity by its id (turns on and switches inputs across the AV stack). The hub streams code-100 progress frames until the activity is up."
    action: "harmony.activityengine?runactivity"
    arguments:
      async: "true"
      timestamp: 0
      activityId: "{activity_id}"
    parameters:
      activity_id:
        type: "string"
        required: true
        description: "Activity id from get_config (data.activity[].id), as a string; -1 is the built-in PowerOff activity."
    example_body: '{"hubId":"<remoteId>","timeout":30,"hbus":{"cmd":"harmony.activityengine?runactivity","id":1,"params":{"async":"true","timestamp":0,"activityId":"12345678"}}}'
    example_notes: "Worked case: activity 12345678."
    verification: "reported"
  power_off:
    description: "Stop the current activity: runactivity with the built-in PowerOff activity, id -1."
    action: "harmony.activityengine?runactivity"
    arguments:
      async: "true"
      timestamp: 0
      activityId: "-1"
    example_body: '{"hubId":"<remoteId>","timeout":30,"hbus":{"cmd":"harmony.activityengine?runactivity","id":1,"params":{"async":"true","timestamp":0,"activityId":"-1"}}}'
    verification: "reported"
  send_command:
    description: >
      Press a single device command (e.g. VolumeUp) on a device by id -- the
      PRESS half of a key. Follow it with send_command_release, ~100 ms
      later, or the hub treats the key as held. The `action` argument is a
      JSON-looking STRING with every colon doubled ("::"), exactly as the
      hub wants it (hub_protocol.hold_action).
    action: "vnd.logitech.harmony/vnd.logitech.harmony.engine?holdAction"
    arguments:
      status: "press"
      timestamp: "0"
      verb: "render"
      action: '{"command":: "{command}","type":: "IRCommand","deviceId":: "{device_id}"}'
    parameters:
      device_id:
        type: "string"
        required: true
        description: "Device id from get_config (data.device[].id)."
      command:
        type: "string"
        required: true
        description: "Command name from the device's controlGroup function list in get_config (e.g. VolumeUp, Mute, PowerToggle)."
    example_body: '{"hubId":"<remoteId>","timeout":30,"hbus":{"cmd":"vnd.logitech.harmony/vnd.logitech.harmony.engine?holdAction","id":1,"params":{"status":"press","timestamp":"0","verb":"render","action":"{\"command\":: \"VolumeUp\",\"type\":: \"IRCommand\",\"deviceId\":: \"12345\"}"}}}'
    example_notes: "Worked case: VolumeUp on device 12345. The inner action value is a string, so its quotes are escaped in the frame."
    verification: "reported"
  send_command_release:
    description: "The RELEASE half of send_command: identical frame with status \"release\". Send it after every press; the gap between the two is the hold duration."
    action: "vnd.logitech.harmony/vnd.logitech.harmony.engine?holdAction"
    arguments:
      status: "release"
      timestamp: "0"
      verb: "render"
      action: '{"command":: "{command}","type":: "IRCommand","deviceId":: "{device_id}"}'
    parameters:
      device_id:
        type: "string"
        required: true
        description: "Device id from get_config (data.device[].id)."
      command:
        type: "string"
        required: true
        description: "The same command name the press carried."
    example_body: '{"hubId":"<remoteId>","timeout":30,"hbus":{"cmd":"vnd.logitech.harmony/vnd.logitech.harmony.engine?holdAction","id":1,"params":{"status":"release","timestamp":"0","verb":"render","action":"{\"command\":: \"VolumeUp\",\"type\":: \"IRCommand\",\"deviceId\":: \"12345\"}"}}}'
    example_notes: "Worked case: the release matching the send_command example."
    verification: "reported"

features:
  - type: "firmware_update"
    dfu:
      mechanisms: ["custom", "vendor_cloud"]
      transport: ["usb", "cloud"]
      image:
        signing: "unknown"
        source: "user_supplied"
        format: >
          A Logitech .hfw2 bundle: a zip whose Description.xml lists each
          image (NAME, target PATH, OPERATIONTYPE) with a CHECKSUM element
          (TYPE MD5, SEED 0, OFFSET, LENGTH, EXPECTEDVALUE), the intended skin
          and an ORDER with a RESET flag -- the same descriptor shape as a
          MyHarmony config backup. The image itself is ota-update.EzHex,
          written to /fw/otaupdate; the zip is never written as a whole.
        notes: >
          Inside the update are a kernel (uImage.bin) and a squashfs root
          filesystem, which the hub's boot updater checks by SHA-1 before
          applying, per the log harmony-hub-root reads back. That is an
          integrity check; whether anything checks a vendor signature is not
          known. No public source of .hfw2 files is documented here.
      enter:
        how: "in_place"
        notes: >
          The running firmware takes the file over the USB file protocol and a
          reboot hands it to the boot updater. harmony-hub-root's order: FF
          device control 0x66 (reset the staging area); open /fw/otaupdate for
          writing with the image size; send the data in bursts of up to 500
          packets; send the checksum message from the descriptor (a result
          'm' means accepted); commit (05) only on 'm'; close (07); FF
          device control 0x00 (reboot). A result 'u' has been seen on an update that the
          boot updater nevertheless applied after the reboot.
      recovery:
        interrupted: "unknown"
        notes: >
          The update is staged and applied by a separate boot updater, which
          suggests an interrupted upload leaves the old system in place, but
          no source states what an interrupted apply leaves behind.
      verification: "reported"
      notes: >
        Normally the hub updates itself from Logitech's service; the 2018
        firmware that removed the local API arrived that way. The USB path is
        what harmony-hub-root implements and what makes a hub recoverable
        without the service. Flashing is a deliberate act: keep the hub
        powered throughout, and have the bundle the hub was running if one
        can be found.

local_access:
  status: "native"
  summary: >
    Control is local as shipped: the port-8088 WebSocket starts and stops
    activities and sends device commands with no account and no cloud. Wi-Fi
    setup is local too, over Bluetooth or USB, with open implementations of
    both. Configuration is not: the hub runs a configuration compiled by
    Logitech's service and nothing documented can author one locally.
  covers:
    - "Discovering the hub (SSDP) and fetching its remoteId"
    - "Reading the configured activities, devices and their command names"
    - "Starting and stopping activities; pressing and holding device commands"
    - "Joining or changing Wi-Fi over Bluetooth RFCOMM or over USB"
    - "Factory reset over USB"
    - "Writing a Logitech .hfw2 firmware bundle over USB"
  not_covered:
    - "Adding, removing or editing devices and activities -- compiled by Logitech's service"
    - "Account provisioning and restore, whose local requests are encrypted and need Logitech's service"
    - "Voice-assistant and remote-app integrations, which go through Logitech's service"

remaining_unknowns:
  - "Whether the iOS Harmony app sets the hub up over a GATT service, as Logitech's 'Bluetooth LE' wording suggests, instead of the RFCOMM channel the Android app and harmony-hub-setup use."
  - "Whether the RFCOMM setup link requires Bluetooth pairing, and so whether the plain-JSON Wi-Fi password is protected by link encryption over the air."
  - "How the setup endpoint's AES key is derived from the 32-character Bluetooth nonce or the account hub secret, and the padding; needed to drive account provisioning without the app."
  - "Which other paths the hub serves over USB beyond /rf/deviceinfo, the Wi-Fi files, /sys/factoryreset, /sys/reboot and /fw/otaupdate -- in particular whether its synced configuration can be read out the way an MH remote's /cfg/usercfg can."
  - "How long Pair/Reset must be held for a factory reset, and when to release it."
  - "What an interrupted firmware apply leaves behind, and whether the boot updater checks a signature."
  - "The rest of the connect.discoveryinfo record beyond friendlyName."

