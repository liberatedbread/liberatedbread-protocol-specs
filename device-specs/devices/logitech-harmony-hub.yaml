# Logitech Harmony Hub — Device Specification
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# Sources (all public; clean-room — derived facts only):
#   - ehendrix23/aioharmony (Apache-2.0; lineage pyharmony) — the local
#     WebSocket/XMPP client Home Assistant uses.
#   - JordanMartin/harmonyhub-api (Node) — the port-8088 provisioning handshake.
#   - Home Assistant harmony integration + the 2018 local-API history.
#   - Logitech's Hub quick start guide, Smart Control user guide and "Reset
#     the Harmony Hub" article — the two first-run routes, the supported
#     Wi-Fi modes and the reset procedure.
#   - jaymzh/concordance (libconcord, GPL-3.0) — the Hub's USB product ID
#     and the MyHarmony USB protocol; see
#     targets/logitech-harmony-usb-remotes.md.

device:
  name: "Logitech Harmony Hub"
  manufacturer: "Logitech"
  manufacturer_status: "abandoned"
  testing:
    status: untested
    notes: >
      Not driven against hardware by this project. Facts are from the
      aioharmony and harmonyhub-api open-source clients and Home Assistant's
      integration; the WebSocket envelope, command strings and params in
      `websocket`/`commands` were transcribed from aioharmony's source
      (hubconnector_websocket.py, const.py, harmonyclient.py) rather than
      captured, so they are `reported`. The two first-run routes and the
      reset procedure are Logitech's own documentation, not replayed here.
  protocol: "wifi"
  category: "hub"
  # The control surface is the port-8088 WebSocket (root `websocket` block);
  # the one HTTP exchange is the provisioning POST that yields the remoteId.
  transport: "websocket"
  notes: >
    The Harmony Hub is Logitech's IR/Bluetooth/IP universal-remote bridge: it
    holds a configuration of "activities" (Watch TV, Play Game) and "devices"
    and blasts IR / sends IP or Bluetooth commands to control an AV stack.
    Logitech ended Harmony manufacturing in April 2021 and has begun dropping
    support for older remotes, so the hardware is on borrowed time — but local
    control survives entirely without Logitech's cloud.

    LOCAL CONTROL: the hub exposes a WebSocket API on TCP 8088 with no
    authentication beyond a locally-retrievable `remoteId`. A one-time HTTP POST
    to port 8088 returns the remoteId; the client then opens a WebSocket and
    issues JSON requests: get the config (activities + devices, each with a
    label and id), get the current activity, start/stop an activity by id, send
    a device command, hold a command for a duration, and change channel. Every
    request carries a unique id echoed in the reply. Idle WebSocket connections
    are closed by the hub after ~60s unless pinged.

    HISTORY (worth knowing): firmware 4.15.206 (Dec 2018) removed the older XMPP
    local API and broke local control; after community backlash Logitech
    restored a local API path (XMPP re-enabled in 4.15.250, Feb 2019) and
    committed to keeping local access. Modern firmware defaults to the WebSocket
    transport; legacy hubs may still expose XMPP. aioharmony speaks both.

    SERVICE STATUS: on 28 May 2025 Logitech shut down Harmony Remote Software,
    the service that configured its older USB remotes (the 5xx-1100 lines and
    the Harmony for Xbox 360). The Hub is not on that list; Logitech's notice
    says it and the later remotes stay supported through the Harmony app and
    MyHarmony, and no end date has been announced. The Hub's predecessor, the
    Harmony Link, lost its service on 16 March 2018. Configuration is compiled
    by Logitech's service and synced down to the hub; there is no open way to
    author it, so keep the hub's current configuration working and note what
    it contains while the service still answers.

    USB: the hub's micro-USB port enumerates as 046d:c129, which libconcord
    lists among the MyHarmony-protocol devices (with the 200, 300, Link and
    Touch). That is the protocol behind the USB first-run route below; the
    byte-level description is in targets/logitech-harmony-usb-remotes.md.

  openness:
    status: "undocumented"
    reverse_engineered: true
    source_code: "https://github.com/ehendrix23/aioharmony"
    notes: >
      Logitech publishes no local protocol documentation; the WebSocket and
      XMPP surfaces were reverse-engineered by the community. aioharmony (which
      Home Assistant uses) is the reference implementation.

  identification:
    default_port: 8088
    ssdp_search_targets:
      - "urn:myharmony-com:device:harmony:1"

  discovery:
    methods:
      - type: "ssdp"
        ssdp:
          search_targets:
            - "urn:myharmony-com:device:harmony:1"
          response_mapping:
            location:
              action: "fetch_xml"
              parse:
                device_identity:
                  stable_keys:
                    - source: "xml://device/UDN"
                      key: "udn"
                  display:
                    source: "xml://device/friendlyName"
          match:
            description: "Manufacturer 'Logitech', device type urn:myharmony-com:device:harmony:1."
            manufacturer_exact: "Logitech"
        notes: >
          Hubs answer SSDP for urn:myharmony-com:device:harmony:1 (this is the
          search target Home Assistant's discovery uses). The community
          harmonyhubjs-discover tool alternatively listens on a local UDP port
          for hub responses.
    identity:
      stable_keys: ["udn"]
      display: "friendlyName"
    static_ip_required: false

  setup:
    required: true
    confidence: "low"
    notes: >
      Getting a hub from the box to local control is three things in order:
      put it on Wi-Fi, give it a configuration (activities and devices) through
      a Harmony account, then fetch its remoteId locally. Logitech documents
      two ways to do the first -- Bluetooth from the Harmony app, or USB from a
      computer -- and those are the two routes below. The account step is the
      same in both and needs Logitech's service; nothing documented can author
      a configuration locally. Once configured, local control needs no
      pairing: any LAN client fetches the remoteId with the port-8088 POST and
      opens the WebSocket. Confidence is low because neither Wi-Fi handover
      has been captured: the Bluetooth exchange is not publicly documented at
      all, and the USB one is known only by analogy with the Harmony Link.
    methods:
      - type: "ble_provisioning"
        name: "Harmony app: Wi-Fi over Bluetooth, then a Harmony account"
        role: "primary"
        verified: false
        description: >
          The route Logitech's quick start guide leads with. The Harmony app
          finds the hub over Bluetooth LE, hands it the home Wi-Fi
          credentials, then creates or signs in to a Harmony account in which
          the activities and devices are set up and synced down to the hub.
        stages:
          - type: "ble_provisioning"
            name: "Join Wi-Fi from the phone over Bluetooth"
            verified: false
            description: >
              The phone must be on the Wi-Fi network the hub is to join, with
              Bluetooth on. The app's setup flow asks for the hub's Pair/Reset
              button, pairs with the hub over Bluetooth LE, offers the phone's
              own network and sends the hub its password. The hub takes 2.4 GHz
              802.11 b/g/n networks secured with WPA, WPA2-AES or 64/128-bit
              WEP. The GATT service, characteristics and message format are
              not publicly documented; Logitech's guides are the only source.
            ble:
              protocol: "Harmony app hub first-run (undocumented)"
            steps:
              - action: "Power the hub; put the phone on the target 2.4 GHz Wi-Fi network with Bluetooth enabled."
                actor: "user"
              - action: "In the Harmony app start setting up a new hub or remote."
                actor: "user"
              - action: "When the app asks, wait 30 seconds, then press the Pair/Reset button on the back of the hub."
                actor: "user"
                expect: "The app finds the hub and shows its Wi-Fi setup screen with the phone's network."
              - action: "Confirm the network (or choose another), enter its password and join."
                actor: "user"
                expect: "The hub joins the network and the app continues to account setup."
          - type: "cloud_account"
            name: "Configure activities and devices in a Harmony account"
            verified: false
            description: &harmony_account_stage >
              Activities and devices are authored in the Harmony app (or
              MyHarmony) against Logitech's device database; the service
              compiles the configuration and the hub syncs it. This is the
              step no local path replaces.
            cloud:
              local_alternative: &harmony_local_alternative >
                Yes for CONTROL -- once the hub is configured, the local
                WebSocket API on port 8088 drives it with no cloud. No for
                AUTHORING: adding or changing devices and activities needs
                Logitech's service, which still runs for the Hub as of
                2026-09 but has already been withdrawn from the older
                remotes. Keep a hub's working configuration rather than
                resetting it.
            steps:
              - action: "Create or sign in to a Harmony account and add the devices and activities."
                actor: "user"
                expect: "The hub syncs the configuration; get_config returns the activities and devices."
          - type: "none"
            name: "Fetch the remoteId for local control"
            verified: false
            description: &harmony_remote_id_stage >
              Nothing to pair: any LAN client asks the hub for its remoteId
              and opens the WebSocket with it.
            issues_credentials: &harmony_remote_id_credential
              remote_id:
                command: "get_provision_info"
                reply_path: "data.activeRemoteId"
                notes: >
                  The value the WebSocket connect path's `{remote_id}` and
                  every frame's `hubId` are filled from. Not a secret -- any
                  LAN client can fetch it again -- but it is per-hub, so
                  store it keyed by the hub's UDN.
            steps: &harmony_remote_id_steps
              - action: "Retrieve the hub's remoteId with the port-8088 provisioning POST (`get_provision_info`), then open the WebSocket for local control."
                actor: "client"
                request:
                  protocol: "http"
                  action: "POST / on port 8088"
                expect: "JSON reply whose data.activeRemoteId is the hub's remoteId."
      - type: "wired"
        name: "MyHarmony on a computer: Wi-Fi over the USB cable, then a Harmony account"
        role: "alternative"
        verified: false
        description: >
          Logitech's fallback for a phone without Bluetooth LE, and the route
          for setting up from a PC or Mac. The Hub quick start sends such
          users to setup.myharmony.com on a computer to put the hub on Wi-Fi;
          Logitech's Smart Control guide shows MyHarmony reaching the hub over
          a USB cable plugged straight into the computer (its micro-USB port
          is also the hub's power connector). The same account step follows.
        stages:
          - type: "wired"
            name: "Write the Wi-Fi credentials over USB"
            verified: false
            description: >
              Over USB the hub is 046d:c129, a HID device in libconcord's
              MyHarmony-protocol family: 64-byte reports carrying a small file
              read/write protocol. libconcord puts the Harmony Link on Wi-Fi by
              writing the text file /sys/wifi/connect ("ssid,<ssid>",
              "encryption,<type>", "user,", "password,<passphrase>", one per
              line) and reads /sys/wifi/networks for a scan. That the Hub
              accepts the same files is a hypothesis nobody has tested. Framing,
              handshake and file transfer are in
              targets/logitech-harmony-usb-remotes.md.
            steps:
              - action: "Connect the hub's micro-USB port to a USB port on the computer itself, not through a USB hub (Logitech's troubleshooting advice)."
                actor: "user"
              - action: "Write the Wi-Fi credentials to the hub over USB (MyHarmony does this; an independent client would write /sys/wifi/connect if the Hub behaves like the Link)."
                actor: "client"
                expect: "Reading /sys/wifi/connect back reports a connect_status; the hub joins the network."
          - type: "cloud_account"
            name: "Configure activities and devices in a Harmony account"
            verified: false
            description: *harmony_account_stage
            cloud:
              local_alternative: *harmony_local_alternative
            steps:
              - action: "Sign in to the Harmony account in MyHarmony (or the app) and add the devices and activities."
                actor: "user"
                expect: "The hub syncs the configuration; get_config returns the activities and devices."
          - type: "none"
            name: "Fetch the remoteId for local control"
            verified: false
            description: *harmony_remote_id_stage
            issues_credentials: *harmony_remote_id_credential
            steps: *harmony_remote_id_steps
    factory_reset:
      applicable: true
      confidence: "medium"
      effect: >
        Logitech says the reset erases the hub's account information, which
        takes the synced activities and devices with it; the hub has to go
        through first-run and be configured from the account again. That it
        also forgets the Wi-Fi network is expected from "back to first-run"
        but not stated in the article.
      procedures:
        - name: "Pair/Reset held while power is applied"
          verified: false
          basis: "Logitech support article 'Reset the Harmony Hub' (see helpful_urls); not replayed here."
          indicator: "The LED flickers red until the reset has finished."
          steps:
            - action: "Unplug the hub's power adapter."
              actor: "user"
            - action: "Press and hold the Pair/Reset button on the back of the hub."
              actor: "user"
            - action: "Keep holding it and plug the power adapter back in."
              actor: "user"
              expect: "The LED flickers red; Logitech's article gives no hold time and does not say when to release."
            - action: "Wait until the LED stops flickering."
              actor: "user"
              expect: "The hub is back at first-run."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        Wi-Fi can be reconfigured from the app while the hub is reachable, or
        over USB from MyHarmony. Local control resumes once the hub rejoins the
        LAN; rediscover it by UDN rather than by its old address.
    credentials:
      wifi_passphrase_protection: unknown
      stored_on_device:
        - "Wi-Fi credentials"
        - "Activity and device configuration"
        - "Harmony account binding"
      issued_to_client:
        - "remoteId (retrieved from the hub over the port-8088 POST; gates the WebSocket session)"
      notes: >
        The remoteId is retrievable by any LAN client — it is not a secret so
        much as a session parameter. Local control is otherwise unauthenticated
        on the LAN. How the passphrase crosses to the hub is unknown on the
        Bluetooth route; on the USB route, if the Hub works like the Link, it
        is plain text inside the /sys/wifi/connect file and reads back the
        same way.

http_endpoints:
  - method: "POST"
    path: "/"
    name: "Provisioning — get remoteId (port 8088)"
    description: >
      One-time handshake on port 8088. POST with headers Origin:
      http://sl.dhg.myharmony.com, Content-Type: application/json,
      Accept-Charset: utf-8, and body
      {"id":1,"cmd":"setup.account?getProvisionInfo","params":{}}. The reply
      carries the hub's remoteId, which the WebSocket session below needs.
    request_body:
      content_type: "application/json"
      fields:
        - name: "cmd"
          type: "string"
          description: "\"setup.account?getProvisionInfo\"."
    response_body:
      content_type: "application/json"
      fields:
        - name: "data.activeRemoteId"
          type: "string"
          description: "The hub's remoteId (per-hub, not a session credential); fills `{remote_id}` in the WebSocket connect path and every frame's `hubId`."
        - name: "data.friendlyName"
          type: "string"
          description: "The hub's user-set name."

protocol_details:
  # Narrative and history. The executable half -- where the socket is and
  # how a command becomes a frame -- is the root `websocket` block; the
  # invocations are in `commands`. Both are transcribed from the open-source
  # aioharmony client (Harmony-Libs/aioharmony: hubconnector_websocket.py
  # for the connect URL, envelope and provisioning POST; const.py and
  # harmonyclient.py for the command strings and params) and its PROTOCOL.md.
  hub_protocol:
    verification: "reported"
    transport: "WebSocket, JSON text frames, TCP 8088; provisioning over HTTP on the same port"
    provisioning: >
      Before the socket can be opened the client needs the hub's remoteId:
      POST http://<ip>:8088/ with Origin: http://sl.dhg.myharmony.com,
      Content-Type: application/json, Accept: application/json and
      Accept-Charset: utf-8, body
      {"id":1,"cmd":"setup.account?getProvisionInfo","params":{}}. The reply
      is {"cmd":..., "code":200, "data":{"activeRemoteId": "<remoteId>",
      ...}}. The Origin header is what the hub keys the request on; without
      it the POST is refused.
    envelope: >
      Every request on the socket is one JSON text frame
      {"hubId": "<remoteId>", "timeout": <seconds>, "hbus": {"cmd":
      "<mime>?<operation>", "id": <client-chosen unique id>, "params":
      {...}}}. The hub answers with a frame carrying the same id, a "code"
      (100 = in progress, 200 = done) and "data". cmd is the pair of an
      XMPP-era mime type and an operation, joined with "?":
      "vnd.logitech.harmony/vnd.logitech.harmony.engine?config",
      "harmony.activityengine?runactivity",
      "vnd.logitech.harmony/vnd.logitech.harmony.engine?holdAction". The
      `timeout` is the hub-side reply timeout in seconds (aioharmony sends
      5, the Node clients 30; either works). Reads take params
      {"verb":"get","format":"json"}.
    hold_action: >
      A device command is a press followed by a release: two holdAction
      frames whose params differ only in "status" ("press", then
      "release"). The "action" param is a STRING, not an object, and inside
      it every colon is doubled -- {"command":: "VolumeUp","type"::
      "IRCommand","deviceId":: "12345"} -- which is the hub's own escaping
      of the XMPP-era attribute syntax (PROTOCOL.md shows the same "::" in
      the XMPP form). Send the release a short interval after the press
      (aioharmony defaults to ~0.1 s; a longer gap is a held key).
    activities: >
      runactivity takes params {"async":"true","timestamp":0,"activityId":
      "<id>"}; the hub streams progress frames (code 100, data.done /
      data.total) and pushes an "activityId" change notification when the
      activity is running. Activity id "-1" is the built-in PowerOff. The
      current activity is getCurrentActivity, whose data.result is the id.
    keepalive: >
      Idle sockets are closed by the hub after ~60 s; aioharmony sends a
      WebSocket ping every 30 s and expects a pong within 15 s.
    history: >
      Firmware 4.15.206 (Dec 2018) removed the XMPP local API on TCP 5222;
      4.15.250 (Feb 2019) restored it after community backlash. The
      WebSocket surface above is the one modern firmware speaks by default;
      aioharmony keeps an XMPP connector for hubs that still expose 5222.
      Only the WebSocket transport is declared here.
    cloud_sync: >
      The hub holds a compiled configuration it pulls from Logitech's
      service. aioharmony exposes a "sync" that sends the mime
      "setup.sync" on this socket to make the hub fetch its current
      configuration from the web service. Its string formatting appends
      "?None" as the operation, and it treats a code-200 reply as success,
      so that exact string is what the hub has been answering. It is a
      trigger for the cloud, not a local configuration surface: it does
      nothing useful once the service is unreachable, and no local command is
      known that adds or edits a device or activity.
  usb:
    verification: "reported"
    id: "046d:c129 (Logitech), HID"
    protocol: >
      libconcord's MyHarmony family: 64-byte HID reports carrying a file
      read/write protocol (/sys/sysinfo identity, /sys/wifi/networks scan,
      /sys/wifi/connect join on the Harmony Link). The Hub's product ID is in
      libconcord's MyHarmony list but concordance does not list the Hub as a
      supported model, so which files the Hub serves is untested. Byte-level
      detail: targets/logitech-harmony-usb-remotes.md.

# Where the socket is and how a command becomes a frame. Placeholders:
# {remote_id} is the stored `remote_id` credential (issued by
# get_provision_info), {request_id} the client-chosen correlation id,
# {action} the command's `action` (the "<mime>?<operation>" cmd string) and
# {arguments} its `arguments` object (the hbus params).
websocket:
  connect:
    port: 8088
    scheme: "ws"
    path: "/?domain=svcs.myharmony.com&hubId={remote_id}"
    heartbeat_seconds: 30
  channels:
    - name: "hbus"
      default: true
      encoding: "json"
      frame:
        hubId: "{remote_id}"
        timeout: 30
        hbus:
          cmd: "{action}"
          id: "{request_id}"
          params: "{arguments}"
      description: >
        The only channel. Every request is one JSON text frame in this
        envelope; replies carry the same id with "code" and "data"
        (hub_protocol.envelope). The hub also pushes unsolicited frames on
        this socket (activity changes, config updates) with no request id.
  notes: >
    No pairing block: the socket needs nothing beyond the remoteId in the
    connect path, and that is fetched from the hub itself by
    get_provision_info -- not issued by a consent flow the schema's pairing
    modes describe. Verification: reported (aioharmony, harmonyhubjs).

# Invocations. The four control commands ride the hbus channel (no
# `transport` key: device.transport is websocket); get_provision_info is
# the one HTTP exchange, on the same port. Example bodies use id 1 and the
# placeholder remoteId "<remoteId>".
commands:
  get_provision_info:
    description: >
      Fetch the hub's remoteId, the value every WebSocket frame's hubId and
      the connect path carry. One HTTP POST on port 8088 -- the same port as
      the socket -- with the Origin header the hub insists on. Not
      authenticated; any LAN client may call it.
    transport: "http"
    method: "POST"
    path: "/"
    action: "Provisioning — get remoteId (port 8088)"
    headers:
      Origin: "http://sl.dhg.myharmony.com"
      Content-Type: "application/json"
      Accept: "application/json"
      Accept-Charset: "utf-8"
    body: '{"id":1,"cmd":"setup.account?getProvisionInfo","params":{}}'
    example_body: '{"id":1,"cmd":"setup.account?getProvisionInfo","params":{}}'
    returns:
      - name: "data.activeRemoteId"
        type: "string"
        description: "The remoteId; store it as the `remote_id` credential."
      - name: "data.friendlyName"
        type: "string"
        description: "The hub's user-assigned name."
    verification: "reported"
  get_config:
    description: "Fetch the full config: activities and devices, each with a label and numeric id, plus each device's controlGroup command lists (the names send_command takes)."
    action: "vnd.logitech.harmony/vnd.logitech.harmony.engine?config"
    arguments:
      verb: "get"
      format: "json"
    example_body: '{"hubId":"<remoteId>","timeout":30,"hbus":{"cmd":"vnd.logitech.harmony/vnd.logitech.harmony.engine?config","id":1,"params":{"verb":"get","format":"json"}}}'
    returns:
      - name: "data.activity[]"
        type: "array"
        description: "Activities: {id, label, type, ...}; id \"-1\" is PowerOff."
      - name: "data.device[]"
        type: "array"
        description: "Devices: {id, label, controlGroup[{name, function[{name, action}]}], ...}."
    verification: "reported"
  get_current_activity:
    description: "Which activity is running; data.result is the activity id as a string, \"-1\" when everything is off."
    action: "vnd.logitech.harmony/vnd.logitech.harmony.engine?getCurrentActivity"
    arguments:
      verb: "get"
      format: "json"
    example_body: '{"hubId":"<remoteId>","timeout":30,"hbus":{"cmd":"vnd.logitech.harmony/vnd.logitech.harmony.engine?getCurrentActivity","id":1,"params":{"verb":"get","format":"json"}}}'
    returns:
      - name: "data.result"
        type: "string"
        description: "Current activity id; \"-1\" = PowerOff."
    verification: "reported"
  get_discovery_info:
    description: >
      The hub's discovery record, over the socket rather than SSDP.
      aioharmony reads it at connect time alongside get_provision_info and
      takes the hub's display name from it; the rest of the record is not
      documented by any source read.
    action: "connect.discoveryinfo?get"
    arguments:
      verb: "get"
      format: "json"
    example_body: '{"hubId":"<remoteId>","timeout":30,"hbus":{"cmd":"connect.discoveryinfo?get","id":1,"params":{"verb":"get","format":"json"}}}'
    returns:
      - name: "data.friendlyName"
        type: "string"
        description: "The hub's user-assigned name."
    verification: "reported"
  start_activity:
    description: "Start an activity by its id (turns on and switches inputs across the AV stack). The hub streams code-100 progress frames until the activity is up."
    action: "harmony.activityengine?runactivity"
    arguments:
      async: "true"
      timestamp: 0
      activityId: "{activity_id}"
    parameters:
      activity_id:
        type: "string"
        required: true
        description: "Activity id from get_config (data.activity[].id), as a string; -1 is the built-in PowerOff activity."
    example_body: '{"hubId":"<remoteId>","timeout":30,"hbus":{"cmd":"harmony.activityengine?runactivity","id":1,"params":{"async":"true","timestamp":0,"activityId":"12345678"}}}'
    example_notes: "Worked case: activity 12345678."
    verification: "reported"
  power_off:
    description: "Stop the current activity: runactivity with the built-in PowerOff activity, id -1."
    action: "harmony.activityengine?runactivity"
    arguments:
      async: "true"
      timestamp: 0
      activityId: "-1"
    example_body: '{"hubId":"<remoteId>","timeout":30,"hbus":{"cmd":"harmony.activityengine?runactivity","id":1,"params":{"async":"true","timestamp":0,"activityId":"-1"}}}'
    verification: "reported"
  send_command:
    description: >
      Press a single device command (e.g. VolumeUp) on a device by id -- the
      PRESS half of a key. Follow it with send_command_release, ~100 ms
      later, or the hub treats the key as held. The `action` argument is a
      JSON-looking STRING with every colon doubled ("::"), exactly as the
      hub wants it (hub_protocol.hold_action).
    action: "vnd.logitech.harmony/vnd.logitech.harmony.engine?holdAction"
    arguments:
      status: "press"
      timestamp: "0"
      verb: "render"
      action: '{"command":: "{command}","type":: "IRCommand","deviceId":: "{device_id}"}'
    parameters:
      device_id:
        type: "string"
        required: true
        description: "Device id from get_config (data.device[].id)."
      command:
        type: "string"
        required: true
        description: "Command name from the device's controlGroup function list in get_config (e.g. VolumeUp, Mute, PowerToggle)."
    example_body: '{"hubId":"<remoteId>","timeout":30,"hbus":{"cmd":"vnd.logitech.harmony/vnd.logitech.harmony.engine?holdAction","id":1,"params":{"status":"press","timestamp":"0","verb":"render","action":"{\"command\":: \"VolumeUp\",\"type\":: \"IRCommand\",\"deviceId\":: \"12345\"}"}}}'
    example_notes: "Worked case: VolumeUp on device 12345. The inner action value is a string, so its quotes are escaped in the frame."
    verification: "reported"
  send_command_release:
    description: "The RELEASE half of send_command: identical frame with status \"release\". Send it after every press; the gap between the two is the hold duration."
    action: "vnd.logitech.harmony/vnd.logitech.harmony.engine?holdAction"
    arguments:
      status: "release"
      timestamp: "0"
      verb: "render"
      action: '{"command":: "{command}","type":: "IRCommand","deviceId":: "{device_id}"}'
    parameters:
      device_id:
        type: "string"
        required: true
        description: "Device id from get_config (data.device[].id)."
      command:
        type: "string"
        required: true
        description: "The same command name the press carried."
    example_body: '{"hubId":"<remoteId>","timeout":30,"hbus":{"cmd":"vnd.logitech.harmony/vnd.logitech.harmony.engine?holdAction","id":1,"params":{"status":"release","timestamp":"0","verb":"render","action":"{\"command\":: \"VolumeUp\",\"type\":: \"IRCommand\",\"deviceId\":: \"12345\"}"}}}'
    example_notes: "Worked case: the release matching the send_command example."
    verification: "reported"

local_access:
  status: "native"
  summary: >
    Control is local as shipped: the port-8088 WebSocket starts and stops
    activities and sends device commands with no account and no cloud.
    Configuration is not: the hub runs a configuration compiled by Logitech's
    service and nothing documented can author one locally.
  covers:
    - "Discovering the hub (SSDP) and fetching its remoteId"
    - "Reading the configured activities, devices and their command names"
    - "Starting and stopping activities; pressing and holding device commands"
    - "Wi-Fi first-run over USB, if the Hub takes the Harmony Link's files (untested)"
  not_covered:
    - "Adding, removing or editing devices and activities -- compiled by Logitech's service"
    - "Wi-Fi first-run over Bluetooth -- the exchange is undocumented"
    - "Firmware updates"
    - "Voice-assistant and remote-app integrations, which go through Logitech's service"

remaining_unknowns:
  - "The Bluetooth LE first-run: advertised name, GATT service and characteristics, and how the Wi-Fi credentials are framed. Nothing public describes it; one HCI snoop of the Harmony app's hub setup would."
  - "Whether the Hub over USB (046d:c129) serves the Harmony Link's /sys/wifi/networks and /sys/wifi/connect files, and what else it serves (/sys/sysinfo is the first thing to try)."
  - "Whether a factory reset clears the Wi-Fi network as well as the account information; how long Pair/Reset must be held."
  - "The rest of the connect.discoveryinfo record beyond friendlyName."
  - "Whether any local surface can write a configuration, or whether the hub's synced configuration can be exported and re-imported. None is known; the configuration is compiled by Logitech's service."

