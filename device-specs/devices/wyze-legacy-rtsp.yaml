#
# Sources: Wyze's official RTSP and manual-flash support articles, official
# firmware release posts and official download host. Firmware archives were
# hashed during documentation review; no firmware bytes are committed.

device:
  name: "Wyze Cam (legacy official RTSP firmware)"
  manufacturer: "Wyze Labs"
  manufacturer_status: "active"
  testing:
    status: untested
    notes: >
      No camera was flashed, enabled or streamed by this project. Official
      support instructions and firmware packages are reported evidence. The
      three official ZIPs and their inner binaries were downloaded and SHA-256
      hashed on 2026-11-18, but no image was executed or committed.
  protocol: "wifi"
  transport: "rtsp"
  category: "camera"
  pictogram: "ip-camera"
  type: "legacy-official-rtsp-camera"
  integration: "identify_only"
  notes: >
    SCOPE IS THREE PRODUCT/INSTALLED-FIRMWARE PAIRS ONLY: Cam v2 WYZEC1-JZ
    with installed version 4.28.4.49, standalone Cam v3 WYZE_CAKP2JFUS with
    installed version 4.61.0.3, and Cam Pan v1 WYZECP1_JEF with installed
    version 4.29.4.49. Product and app-reported installed version must both
    match. The standalone Cam v3 download/archive package is named 4.61.0.1,
    but Wyze's official beta thread says it installs and reports 4.61.0.3;
    archive_package_version is for download/hash selection only and is not an
    installed-version match. Cam v1, Pan v2/v3, Cam v4, Floodlight products
    (including products sharing WYZE_CAKP2JFUS), Doorbells, Outdoor cameras and
    every other model or firmware are excluded. In particular, the newer 2025
    RTSP beta for Cam v3/Pan v3 is a different route and is not included.

    Wyze provided RTSP as a separate firmware branch. Features added after the
    branch are absent; AI and other Cam Plus functions can be unstable. Wyze
    does not commit to ongoing branch maintenance and recommends this route
    only for full-time RTSP use. Flashing is an advanced alternative, not a
    normal troubleshooting or update step.

    After the exact branch is installed, the Wyze app enables RTSP per camera,
    creates per-camera credentials and generates the complete URL. Consume
    that full URL as an opaque value. This spec deliberately invents no RTSP
    path, port, stream name or credential format beyond the vendor article.
    identify_only reflects this project's missing video player, not the
    documented feed's availability to an external RTSP client.
  variants:
    - model: "WYZEC1-JZ"
      product_name: "Wyze Cam v2"
      verification: "reported"
      firmware:
        archive_package_version: "4.28.4.49"
        installed_version: "4.28.4.49"
        match: "exact product and installed version only"
        archive_url: "https://download.wyzecam.com/firmware/rtsp/demo_v2_rtsp_4.28.4.49.bin.zip"
        archive_sha256: "5aaa61d522ab7d0edcddcd8a67da94de12338ddb3eb1e63fc67166e3f61ba084"
        inner_filename: "demo_v2_rtsp_4.28.4.49.bin"
        inner_sha256: "ec1355746aab26ff581a3a12dec55c31b9c2e7259013a106d58281be170fc1c8"
        microsd_filename: "demo.bin"
        flash_indicator: "lighter/yellowish solid blue during entry"
    - model: "WYZE_CAKP2JFUS"
      product_name: "Wyze Cam v3 (standalone, not Floodlight)"
      verification: "reported"
      firmware:
        archive_package_version: "4.61.0.1"
        installed_version: "4.61.0.3"
        match: "exact product and installed version only"
        archive_url: "https://download.wyzecam.com/firmware/rtsp/demo_v3_RTSP_4.61.0.1.zip"
        archive_sha256: "1668cfb1ca4f68b7773bcc14d5a5084771e1fbea6c757cd73e47698278f434e3"
        inner_filename: "demo_wcv3.bin"
        inner_sha256: "5e3e31f8e709e3b682000c047b9ca29d05bc0b02a5320bfbf32de6fdacbb2715"
        microsd_filename: "demo_wcv3.bin"
        flash_indicator: "solid purple during entry"
    - model: "WYZECP1_JEF"
      product_name: "Wyze Cam Pan v1"
      verification: "reported"
      firmware:
        archive_package_version: "4.29.4.49"
        installed_version: "4.29.4.49"
        match: "exact product and installed version only"
        archive_url: "https://download.wyzecam.com/firmware/rtsp/demo_Pan_rtsp_4.29.4.49.bin.zip"
        archive_sha256: "a7b3cfa8a5dd823bdb634ee50bd64e3db048358b6bbf34ff0b0c58fae82902b2"
        inner_filename: "demo_Pan_rtsp_4.29.4.49.bin"
        inner_sha256: "ea920b3d49e9fb9ee67c0a0af54dab9ab70919875e18f5fab26beb600b2a60d4"
        microsd_filename: "demo.bin"
        flash_indicator: "lighter/yellowish solid blue during entry"
  openness:
    status: "documented_api"
    reverse_engineered: false
    upstream_docs:
      - url: "https://support.wyze.com/hc/en-us/articles/360026245231-Wyze-Cam-RTSP"
        title: "Wyze Cam RTSP"
        covers: "Separate branch limitations, microSD installation, per-camera credentials and Generate URL flow."
      - url: "https://support.wyze.com/hc/en-us/articles/360031490871-How-to-flash-your-Wyze-Cam-firmware-manually"
        title: "How to flash Wyze Cam firmware manually"
        covers: "Advanced microSD route, exact filenames, button/LED sequence and removal after flashing."
      - url: "https://forums.wyze.com/t/beta-testing-for-wyze-cam-v3-rtsp-firmware-now-available/196922"
        title: "Official standalone Cam v3 RTSP beta announcement"
        covers: "Archive package 4.61.0.1 and the distinct app-reported installed version 4.61.0.3."
    notes: >
      RTSP is a standard protocol, but only on the vendor's old separate branch
      for the exact variants above. Stock firmware coverage in
      wyze-bridge-camera.yaml is a different access path.
  identification:
    notes: >
      Manually confirm product identity and exact app-reported installed
      version in the Wyze app. For standalone Cam v3 this is 4.61.0.3, not the
      4.61.0.1 archive package version. No RTSP port is asserted here, so no
      port-based matcher exists. Model code alone is insufficient for
      WYZE_CAKP2JFUS: exclude Floodlight.
  discovery:
    none: >
      No automatic discovery is documented for this legacy branch. Ask the user
      for the camera address and the complete RTSP URL generated by the Wyze
      app after the exact product/installed-version check. Do not scan for an
      assumed port 554 and do not build a path from the model or nickname.
    identity:
      stable_keys: ["product_model", "installed_firmware", "stream_url"]
      display: "product_name"
    static_ip_required: false
  setup:
    required: true
    confidence: "medium"
    notes: >
      Enabling RTSP and generating credentials requires the Wyze app/account.
      If the exact branch is not already installed, the alternative microSD
      route replaces firmware and carries feature-loss and maintenance risks.
    methods:
      - type: "cloud_account"
        name: "Already on the exact RTSP branch: enable in Wyze app"
        role: "primary"
        verified: false
        description: >
          For a camera already reporting one of the three exact installed
          versions in device.variants. Confirm the variant, enable RTSP in the
          vendor app, choose per-camera credentials, and save the generated
          complete URL. Standalone Cam v3 must report installed version
          4.61.0.3; its 4.61.0.1 archive package version is not a selection match.
        cloud:
          provider: "Wyze app/account"
          local_alternative: >
            After the app generates the URL, an RTSP player uses the camera on
            the local network. There is no documented app-free way to enable
            RTSP or mint the per-camera credentials on this branch.
        steps:
          - action: "Match both product_name/model and firmware.installed_version to one device.variants entry; reject every other model or installed version, including standalone Cam v3 reporting only archive version 4.61.0.1."
            actor: "client"
          - action: "In the Wyze app, open the camera's live view, then Settings > Advanced Settings > RTSP, and let the app confirm firmware compatibility."
            actor: "user"
          - action: "Turn on RTSP and create a username and password unique to this camera. The vendor article specifies 4-10 characters using lowercase letters and digits without special characters."
            actor: "user"
          - action: "Select Generate URL and copy the complete URL shown by the app into the RTSP client as opaque stream_url, including its credentials, host, port and path."
            actor: "user"
            expect: "The exact app-generated full URL is stored without constructing or normalizing any component."
          - action: "Open that URL with an RTSP-capable player on the same local network."
            actor: "client"
            expect: "A live feed, if the camera/network supports it; no feed or resulting state has been replayed by this project."
      - type: "none"
        name: "Advanced legacy microSD flash, then app enable"
        role: "alternative"
        verified: false
        advanced: true
        advanced_reason: >
          Replaces camera firmware with an old separate branch. Later features
          are lost, AI/Cam Plus functions may be unstable, ongoing maintenance
          is not committed, and interrupted-flash recovery is unknown. Use only
          the exact product archive and hashes; this is not routine troubleshooting.
        description: >
          Warning: this historical official installation route replaces camera
          firmware with an old separate branch. Later features are lost,
          AI/Cam Plus functions may be unstable, ongoing branch maintenance is
          not committed, and interrupted-flash recovery is unknown. Use only
          the exact product archive and hashes; this is not routine
          troubleshooting. It remains an alternative rather than
          role=historical because the official downloads still resolved during
          review. The second stage is the same app-enable route as primary.
        stages:
          - type: "none"
            name: "Flash the exact official package from microSD"
            verified: false
            description: >
              Warning: later features are lost, AI/Cam Plus functions may be
              unstable, ongoing branch maintenance is not committed, and
              interrupted-flash recovery is unknown. Wyze recommends a 32 GB
              FAT32 microSD card. Select only the variant's archive, verify
              both published SHA-256 values, and use its exact microSD filename.
            steps:
              - action: "Confirm the exact product and use its firmware.archive_package_version only to select firmware.archive_url for download and hash verification. Do not compare that archive version with the app-reported installed version or use another model's archive."
                actor: "user"
              - action: "Verify the downloaded ZIP's archive_sha256, extract only its named inner binary, and verify inner_sha256 before putting it on the card."
                actor: "client"
                expect: "Both hashes match the values independently recorded from Wyze's official host."
              - action: "Put the inner binary at the microSD root using the variant's microsd_filename: demo.bin for Cam v2/Pan v1, demo_wcv3.bin for standalone Cam v3."
                actor: "user"
              - action: "Unplug the camera and insert the card. Hold Setup while reconnecting power; release at the variant's flash_indicator (lighter/yellowish blue for v2/Pan v1, purple for v3)."
                actor: "user"
              - action: "Wait three to four minutes for the flash/reboot and status-light changes, then remove the microSD card before ordinary use."
                actor: "device"
                timeout_seconds: 300
                expect: "The camera returns in the Wyze app, normally retaining its prior account binding; an unpaired camera must be set up again."
          - type: "cloud_account"
            name: "Enable RTSP and generate the full URL"
            verified: false
            description: "Repeat the primary method's app steps; flashing alone does not enable a stream or create credentials."
            cloud:
              provider: "Wyze app/account"
              local_alternative: >
                After the app generates the URL, playback is local to the
                camera. There is no documented app-free way to enable RTSP or
                create the per-camera credentials on this legacy branch.
            steps:
              - action: "Confirm the app-reported installed firmware exactly matches the variant's firmware.installed_version: 4.61.0.3 for standalone Cam v3, not its 4.61.0.1 archive_package_version. Then open Settings > Advanced Settings > RTSP in the Wyze app."
                actor: "user"
              - action: "Enable RTSP, choose the per-camera username/password, and select Generate URL."
                actor: "user"
              - action: "Store and use the complete generated URL verbatim as stream_url; do not infer a default port or path."
                actor: "client"
    factory_reset:
      applicable: true
      confidence: "medium"
      effect: >
        Deletes the camera settings file and returns the matching camera to
        setup. Remove the microSD card first. This does not document a reset
        for Cam v1, Floodlight, Pan v2/v3 or any other excluded product.
      procedures:
        - name: "Cam v2 or Pan v1 Setup button held for 10 seconds"
          applies_to: ["WYZEC1-JZ", "WYZECP1_JEF"]
          product_names: ["Wyze Cam v2", "Wyze Cam Pan v1"]
          verified: false
          basis: "Wyze factory-reset article for Cam v1/v2/v3/Pan v1, restricted here to the two RTSP variants."
          hold_seconds: 10
          power_state: "on"
          glyph: "generic/hold-button.svg"
          indicator: "Solid yellow changes to blinking yellow."
          indicator_glyph: "generic/led-flashing.svg"
          steps:
            - action: "Remove any microSD card. With the Cam v2 or Pan v1 powered, hold its bottom Setup button for 10 seconds."
              actor: "user"
            - action: "Release and wait at least 30 seconds, allowing up to five minutes, until the light changes from solid yellow to blinking yellow."
              actor: "device"
              timeout_seconds: 300
        - name: "Standalone Cam v3 Setup button held for 10 seconds"
          applies_to: ["WYZE_CAKP2JFUS"]
          product_names: ["Wyze Cam v3 (standalone, not Floodlight)"]
          verified: false
          basis: "Wyze factory-reset article for Cam v1/v2/v3/Pan v1, restricted to the standalone v3 RTSP variant."
          hold_seconds: 10
          power_state: "on"
          glyph: "generic/hold-button.svg"
          indicator: "The status light turns red."
          indicator_glyph: "generic/led-flashing.svg"
          steps:
            - action: "Confirm this is a standalone Cam v3, not Floodlight. Remove any microSD card and hold the powered camera's bottom Setup button for 10 seconds."
              actor: "user"
            - action: "Release and wait at least 30 seconds, allowing up to five minutes, until the status light turns red and the camera is ready to set up again."
              actor: "device"
              timeout_seconds: 300
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        Use the matching model's Wyze app setup/reconnect flow first. If a
        reset is necessary, use only its procedure above. Afterward confirm the
        exact firmware.installed_version remains app-reported, re-enable RTSP
        if needed, and replace stream_url only with the URL the app generates.
    credentials:
      wifi_passphrase_protection: "unknown"
      stored_on_device:
        - "Wi-Fi credentials"
        - "Per-camera RTSP username/password created in the Wyze app"
      issued_to_client:
        - "Per-camera RTSP username/password embedded in the app-generated full URL"
        - "Complete opaque stream_url, which is itself a secret"
      notes: >
        The legacy article does not use the docker bridge's WB_API or the Wyze
        developer API key for playback. Treat the generated URL as a secret;
        do not log its embedded credentials or commit a real URL.
  pairing:
    required: true
    confidence: "medium"
    security_mode: "app_layer"
    bonding: "none"
    pin:
      source: "user_chosen"
      notes: >
        The owner chooses a separate RTSP username/password for each camera in
        the Wyze app. The app then generates the full URL carrying those
        credentials. No camera-wide default credential or URL path is claimed.
    exclusivity:
      single_connection: "unknown"
      single_bond: false
      recovery: >
        Serialize initial client setup if the camera is unstable. Concurrent
        player limits are not established. If credentials are lost, use the
        app's RTSP settings to reset/recreate them and generate a fresh URL.
    unpair:
      supported: true
      requires_factory_reset: false
      clears: "RTSP access when disabled or when replacement credentials are generated; immediate revocation of every copied old URL is unverified."
      notes: >
        Turn RTSP off in the app to stop the service. To revoke a leaked URL,
        recreate the per-camera credentials and generate a new URL, then verify
        the old one fails; the precise revocation timing is not established.
    enter_pairing_mode:
      required: true
      procedures:
        - name: "Enable RTSP and generate per-camera credentials in the Wyze app"
          verified: false
          basis: "Wyze's official Wyze Cam RTSP support article; not replayed here."
          power_state: "on"
          steps:
            - action: "Open Settings > Advanced Settings > RTSP for an exact supported camera and turn RTSP on."
              actor: "user"
            - action: "Create the per-camera username/password and select Generate URL."
              actor: "user"
              expect: "The app displays the complete RTSP URL for that camera."
      notes: "This is a software enable/credential step, not a timed Bluetooth pairing window."
    notes: >
      App-layer RTSP credentials are independent of the camera's Wyze account
      binding. Nothing in this spec authorizes flashing or playback for any
      other model/firmware pair.

features:
  - type: "firmware_update"
    variants: ["WYZEC1-JZ", "WYZE_CAKP2JFUS", "WYZECP1_JEF"]
    dfu:
      mechanisms: ["custom"]
      image:
        signing: "unknown"
        source: "public_url"
        format: "Official ZIP containing one raw binary; exact archive/inner filenames and SHA-256 values are in device.variants."
        notes: "Only the three official RTSP archives declared here. No firmware bytes or substitute images are included in this specification."
      enter:
        how: "button"
        notes: "Insert the prepared microSD while unpowered, hold Setup during power application, and release at the variant-specific blue/purple indicator."
      dfu_mode:
        notes: "Cam v2/Pan v1 show the documented lighter/yellowish solid blue; standalone Cam v3 shows solid purple. No network control surface is claimed during flashing."
      recovery:
        interrupted: "unknown"
        notes: "Interrupted-flash recovery was not established. Do not treat this advanced route as risk-free or as ordinary troubleshooting."
      verification: "reported"
      notes: "Wyze manual-flash and legacy RTSP articles. Exact archive and inner hashes were independently checked, not flash behavior."

local_access:
  status: "firmware_replacement"
  summary: >
    After installing the exact old official RTSP branch and enabling it in the
    vendor app, playback is local to the camera using the full generated URL.
  covers:
    - "Live RTSP playback from the three exact product/installed-version pairs"
  not_covered:
    - "Stock-firmware RTSP on other versions"
    - "Every other camera model, including Cam v1 and Pan v2/v3"
    - "App-free RTSP enablement or credential generation"
    - "Features added after the separate branch; Cam Plus/AI stability"
    - "A guaranteed maintenance or security-update cadence"

camera:
  enable_required: true
  enable_notes: >
    The exact legacy branch must be installed. In the Wyze app, enable RTSP,
    create per-camera credentials and select Generate URL. Copy the entire
    result as stream_url. Do not synthesize an RTSP URL from {address}.
  feed_host_source: "device"
  streams:
    - name: "Legacy official RTSP (app-generated full URL)"
      transport: "rtsp"
      url_template: "{stream_url}"
      served_by: "device"
      auth: "Per-camera username/password embedded in the app-generated full URL"
      notes: >
        stream_url is opaque and includes the generated scheme, credentials,
        camera host, port and path. No default_port is declared because Wyze's
        legacy article does not state one. Do not append /live, /stream0, 554,
        a nickname or any other guessed component.
  stream_discovery:
    method: "wyze_app_generate_full_url"
    id_source: "The complete URL displayed after Settings > Advanced Settings > RTSP > Generate URL"
    enabled_flag: "The exact camera's RTSP toggle in the Wyze app"
    notes: >
      This is user-mediated setup, not network discovery. Store the URL as one
      opaque credential; model/firmware selection happens before enabling it.

protocol_details:
  legacy_rtsp_scope:
    verification: "reported"
    selection_rule: "Accept only exact product_name + model + firmware.installed_version matches from device.variants. All other combinations are denied; standalone Cam v3 requires app-reported installed version 4.61.0.3."
    archive_rule: "Use firmware.archive_package_version only for the official download/archive hash context. Standalone Cam v3 archive 4.61.0.1 installs and reports 4.61.0.3, so never select an already-installed or post-flash camera by the archive version."
    url_rule: "Use only camera.streams[0].url_template with the complete app-generated stream_url. No path or port is specified by this project."
    official_branch_warning: "Later stock features are absent, AI/Cam Plus may be unstable, and ongoing RTSP branch maintenance is not committed by Wyze."
    flashing_route: "Advanced alternative only; verify archive and inner SHA-256 before use, confirm the installed_version afterward, and never substitute another model's image."

evidence:
  documentation_review: >
    Wyze's official RTSP article supplies the branch limitation, feature-loss
    and maintenance warning, app enable flow, per-camera credential constraints
    and Generate URL behavior. The official flash article supplies microSD
    filenames, button/LED behavior and card removal. Official release posts
    identify the v2/Pan package versions. The official standalone v3 beta
    thread identifies archive package 4.61.0.1 and its app-reported installed
    version 4.61.0.3 as distinct values. No stream path or port is published
    in those legacy instructions.
  artifacts:
    - type: "firmware_image"
      artifact: "demo_v2_rtsp_4.28.4.49.bin.zip (official Wyze archive)"
      sha256: "5aaa61d522ab7d0edcddcd8a67da94de12338ddb3eb1e63fc67166e3f61ba084"
      url: "https://download.wyzecam.com/firmware/rtsp/demo_v2_rtsp_4.28.4.49.bin.zip"
      obtained_via: "Wyze official download host, HTTP 200, hashed 2026-11-18; deleted after review"
      description: "Inner demo_v2_rtsp_4.28.4.49.bin SHA-256 ec1355746aab26ff581a3a12dec55c31b9c2e7259013a106d58281be170fc1c8. No firmware retained."
    - type: "firmware_image"
      artifact: "demo_v3_RTSP_4.61.0.1.zip (official Wyze archive)"
      sha256: "1668cfb1ca4f68b7773bcc14d5a5084771e1fbea6c757cd73e47698278f434e3"
      url: "https://download.wyzecam.com/firmware/rtsp/demo_v3_RTSP_4.61.0.1.zip"
      obtained_via: "Wyze official download host, HTTP 200, hashed 2026-11-18; deleted after review"
      description: "Inner demo_wcv3.bin SHA-256 5e3e31f8e709e3b682000c047b9ca29d05bc0b02a5320bfbf32de6fdacbb2715. No firmware retained."
    - type: "firmware_image"
      artifact: "demo_Pan_rtsp_4.29.4.49.bin.zip (official Wyze archive)"
      sha256: "a7b3cfa8a5dd823bdb634ee50bd64e3db048358b6bbf34ff0b0c58fae82902b2"
      url: "https://download.wyzecam.com/firmware/rtsp/demo_Pan_rtsp_4.29.4.49.bin.zip"
      obtained_via: "Wyze official download host, HTTP 200, hashed 2026-11-18; deleted after review"
      description: "Inner demo_Pan_rtsp_4.29.4.49.bin SHA-256 ea920b3d49e9fb9ee67c0a0af54dab9ab70919875e18f5fab26beb600b2a60d4. No firmware retained."
    - type: "vendor_documentation"
      artifact: "Wyze Cam RTSP"
      url: "https://support.wyze.com/hc/en-us/articles/360026245231-Wyze-Cam-RTSP"
      obtained_via: "Vendor support article, reviewed 2026-11-18"
      description: "Official branch/app-enable/credential evidence and feature/maintenance warning."
  open_questions: >
    Actual stream reliability, concurrent-player limits, credential revocation
    timing, interrupted-flash recovery and current app behavior remain
    unverified.

remaining_unknowns:
  - "No exact supported camera was flashed or streamed by this project."
  - "The app-generated URL's path and port are intentionally unspecified and must be taken from the app, not guessed."
  - "Interrupted microSD flashing and downgrade/return-to-stock behavior were not tested."
  - "Concurrent streams, Cam Plus behavior and old-URL revocation timing require hardware verification."

