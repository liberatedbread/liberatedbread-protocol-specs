    notes: "Opcode-20 response or Full Verify Response 2 raw uint16le * 3.6 / 1024. No percentage is inferred."

features:
  - type: "firmware_update"
    variants: ["Flic 2"]
    dfu:
      mechanisms: ["vendor_ble"]
      transport: "ble"
      image:
        signing: "signed"
        algorithm: "unknown"
        source: "vendor_cloud"
        notes: "The device rejects an invalid signature. Exact image-signature algorithm is not asserted."
      enter:
        how: "unknown"
        notes: "No separate bootloader-entry command is declared. Start is opcode 17 only inside a valid established session; see protocol_details.firmware_update."
      dfu_mode:
        notes: "No distinct bootloader name/address is established. Update runs in the normal control session and reboot follows disconnect."
      recovery:
        interrupted: "unknown"
        notes: "The start response can supply a resume word offset; interrupted-image safety and old-image guarantees are not asserted."
      verification: "reported"
      notes: "Published protocol only; no firmware request or transfer was made."
  - type: "firmware_update"
    variants: ["Flic Duo"]
    dfu:
      mechanisms: ["vendor_ble"]
      transport: "ble"
      image:
        signing: "signed"
        algorithm: "unknown"
        source: "vendor_cloud"
        notes: "Duo has a different header/byte-count protocol and backend; the base update procedure fails on Duo."
      enter:
        how: "unknown"
        notes: "No separate bootloader-entry command is declared. Duo start is opcode 38 only inside a valid established Duo session."
      dfu_mode:
        notes: "No distinct bootloader name/address is established. Update runs in the normal control session and reboot follows disconnect."
      recovery:
        interrupted: "unknown"
        notes: "The start response can supply a resume byte offset; interrupted-image safety and old-image guarantees are not asserted."
      verification: "reported"
      notes: "Published protocol only; no firmware request or transfer was made."

evidence:
  documentation_review: >
    Reviewed the official Flic 2/Duo protocol wiki at
    44001870a481a2831dce7156914e00e2463835d6 and official flic2lib-android 2.1.1
    at d18733ac31a8a20f217b64507836bf8c87d58169 on 2026-11-10. The consumer app
    corroborates the same control UUID table. No hardware, capture, account,
    firmware request or cloud call was used.
  artifacts:
    - type: "vendor_protocol"
      artifact: "50ButtonsEach/flic2-documentation wiki @ 44001870a481a2831dce7156914e00e2463835d6"
      description: "Authoritative advertising, pairing, session, framing, signature, reliable-event, Duo and firmware algorithms."
    - type: "public_implementation"
      artifact: "50ButtonsEach/flic2lib-android 2.1.1 @ d18733ac31a8a20f217b64507836bf8c87d58169"
      description: "Reference for Chaskey output vectors and Duo event-counter/acknowledgement behavior; synthetic vectors only."
  open_questions: >
    Exact physical entry into Public mode, factory reset/revocation, ATT bonding
    behavior across firmware, Public/Private capture, event-counter recovery under
    packet loss, and image signature internals remain for owner-controlled testing.

remaining_unknowns:
  - "A model-neutral Public-mode physical sequence and factory-reset procedure were not established; verify on the actual Flic 2 or Duo."
  - "No Public/Private advertisement, Full/Quick Verify session, bonding transition or packet-loss recovery was captured by this project."
  - "Device-side per-app revocation and pairing-capacity eviction behavior need hardware confirmation; response 6 alone is not proof of removal."
  - "Flic 1, Twist and hub transports are intentionally not identified or implemented."
  - "Firmware signature algorithm and distinct DFU-mode advertising are not asserted; update is outside the basic event client."

