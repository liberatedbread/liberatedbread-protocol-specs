device:
  name: "Flic 2 and Flic Duo"
  manufacturer: "Shortcut Labs AB"
  manufacturer_status: "active"
  testing:
    status: untested
    notes: >
      No button was scanned, paired, reconnected or updated by this project. The
      protocol is vendor-published and the shipping SDK uses the same GATT table.
      Independent tests use only synthetic keys, non-identifying addresses and
      invented event streams; no real pairing record or user event history appears.
  protocol: "ble"
  transport: "ble-gatt"
  category: "switch"
  type: "wireless-button"
  openness:
    status: "open_by_design"
    reverse_engineered: false
    source_code: "https://github.com/50ButtonsEach/flic2lib-android"
    upstream_docs:
      - url: "https://github.com/50ButtonsEach/flic2-documentation/wiki/Flic-2-Protocol-Specification"
        title: "Official Flic 2 Protocol Specification"
        covers: "Advertising, GATT, framing, full/quick verify, Chaskey-LTS signatures, reliable events, battery and firmware update"
      - url: "https://github.com/50ButtonsEach/flic2-documentation/wiki/Flic-Duo-Protocol-Specification"
        title: "Official Flic Duo Protocol Specification"
        covers: "Duo discriminators, dual-button events, gestures, accelerometer, push-twist and Duo firmware endpoint"
    notes: >
      The vendor publishes the actual third-party protocol and an official SDK.
      Consumer-app onboarding has a separate account/Internet requirement and is
      not the offline guarantee made here.
  variants:
    - model: "Flic 2"
      notes: "Base protocol, one big button. Base-only Duo operation also exposes just Duo's big button."
    - model: "Flic Duo"
      notes: "Duo extension adds the small button, gestures, accelerometer and push-twist; use Duo session discriminators and event init."
  companion_apps:
    - name: "Flic"
      package: "io.flic.app"
      role: "primary"
      platform: "cross_platform"
      notes: "The consumer app's first pairing requires an account and Internet. A third-party client using this published protocol does not."
  notes: >
    SCOPE: direct Flic 2 and Flic Duo BLE only. Flic 1 has a different unproven
    profile, Flic Twist requires a hub, and every Flic Hub transport/API is out of
    scope. Do not apply this service, pairing or event state machine to them.

    A button has one active BLE central, but multiple apps on that central use
    logical connection IDs and independent per-app pairings. This is not a simple
    one-write GATT protocol: fragmentation, per-direction counters, five-byte
    Chaskey-LTS signatures, reliable event initialization/acknowledgement and
    persistent pairing/event records are all required for interoperability.

    Signatures authenticate; they do not encrypt opcode/data. Standard BLE Just
    Works bonding is encouraged as an additional encrypted-link layer, not a
    substitute for the Flic application pairing and session keys.
  identification:
    local_name_prefixes: ["F2"]
    service_uuids: ["00420000-8f59-4420-870d-84f3b617e493"]
    manufacturer_data:
      company_id: 783
      company_id_hex: "0x030f"
      description: "Public-mode scan response: payload 02 | address-top-24-bit little-endian | flags. Require the full public grammar, not F2 alone."
    notes: >
      Public name grammar is exactly F2 + two firmware decimal digits + four
      URL-safe-base64 characters encoding the low 24 address bits in big-endian
      order. Private mode advertises only flags and cannot be identified as a new
      Flic 2/Duo without a stored address/pairing record.
  discovery:
    methods:
      - type: "ble_scan"
        ble:
          local_name:
            match: "regex"
            value: "^F2[0-9]{2}[A-Za-z0-9_-]{4}$"
          service_uuids: ["00420000-8f59-4420-870d-84f3b617e493"]
          manufacturer_data:
            company_id: 783
            match: "prefix"
            pattern: "02"
            description: "Public-mode scan response; decode address/flags with protocol_details.public_advertising"
        notes: "Public pairing/discovery only. Private mode requires an existing per-app pairing record."
        verification: "reported"
    identity:
      stable_keys: ["address", "pairing_identifier"]
      display: "local_name"
      notes: "Verify the Full Verify address and type; on stacks without an address, use the verified response/advertising identity."
    static_ip_required: false
  setup:
    required: true
    confidence: "medium"
    notes: >
      A new app must perform Full Verify in Public mode and persist its own 32-bit
      pairing identifier and 128-bit pairing key. Later connections use Quick
      Verify. Confidence is medium because the flow is vendor-published but was
      not run against hardware here.
    methods:
      - type: "ble_provisioning"
        name: "Full Verify in Public mode"
        role: "primary"
        verified: false
        description: "For a new app or a removed pairing. Verifies the button's Ed25519 identity, derives fresh session material with X25519 and creates this app's persistent pairing record."
        ble:
          advertised_name: "F2"
          advertised_name_match: "prefix"
          service_uuid: "00420000-8f59-4420-870d-84f3b617e493"
          write_characteristic: "00420001-8f59-4420-870d-84f3b617e493"
          read_characteristic: "00420002-8f59-4420-870d-84f3b617e493"
          pairing_required: false
        issues_credentials:
          pairing_identifier:
            reply_path: "derived:first 4 bytes of fullVerifyHmac('PK'), little-endian uint32"
            notes: "Persist per app and per button; never share across apps."
          pairing_key:
            reply_path: "derived:next 16 bytes of fullVerifyHmac('PK')"
            notes: "Persist secretly with the identifier and button identity; needed for every Quick Verify."
        steps:
          - action: "Enable Public mode and confirm the F2 public name, control service and company-0x030f scan response."
            actor: "user"
            expect: "A public advertisement matching protocol_details.public_advertising; Private mode is not initial-pairing capable."
          - action: "Connect, enable notifications, then send Full Verify Request 1 with connId 0, opcode 0 and a fresh random uint32le tmp_id, without a signature."
            actor: "client"
          - action: "Validate response 1's tmp_id, assigned logical ID, address/type and Ed25519 signature over address || address_type || button X25519 public key, trying all four recovered sigBits values."
            actor: "client"
            expect: "Exactly one sigBits value in 0-3 verifies with the vendor public key in protocol_details.full_verify."
          - action: "Generate a fresh X25519 secret/public key and 8 client random bytes; derive fullVerifySecret, then HMAC-SHA-256 AT verifier and SK session key with the model's variant byte."
            actor: "client"
          - action: "Send unsigned Full Verify Request 2 on the assigned logical ID, with the Duo support bit only for a Duo-capable client; reject failure response 3 or a mismatched response signature."
            actor: "client"
          - action: "Validate signed response 2, require app_credentials_match, derive PK, and store the pairing identifier/key before initializing reliable events."
            actor: "client"
            expect: "A per-app pairing record and established session; is_duo selects base or Duo event initialization."
      - type: "ble_provisioning"
        name: "Quick Verify with a stored per-app pairing"
        role: "alternative"
        verified: false
        description: "For a controller that already holds this app's pairing identifier/key. Uses fresh randoms and the stored key, not the consumer cloud."
        ble:
          advertised_name: "F2"
          advertised_name_match: "prefix"
          service_uuid: "00420000-8f59-4420-870d-84f3b617e493"
          write_characteristic: "00420001-8f59-4420-870d-84f3b617e493"
          read_characteristic: "00420002-8f59-4420-870d-84f3b617e493"
          pairing_required: false
        steps:
          - action: "Retrieve the pairing identifier/key for this app and button; never reuse another app's record."
            actor: "client"
          - action: "Send unsigned Quick Verify Request on connId 0 with fresh 7-byte client random, a new tmp_id, the pairing ID and discriminator 0x00 for base or 0x40 for Duo."
            actor: "client"
          - action: "Derive sessionKey = Chaskey-LTS(pairing_key, client_random || discriminator || button_random), then verify Quick Verify Response at from-button counter zero before accepting the assigned logical ID."
            actor: "client"
          - action: "If response 6 rejects the pairing ID, run Test If Really Unpaired before deleting anything; a spoofed negative response alone is not proof."
            actor: "client"
            expect: "Established signed session, or a verified removal result that deletes the local record and stops."
    factory_reset:
      applicable: "unknown"
      confidence: "low"
      effect: >
        No physical or GATT factory-reset procedure is established. A reset may
        remove pairings, but the reviewed protocol only provides an authenticated
        way to test whether a pairing is already gone, not a revocation command.
      description: "Do not send firmware, disconnect or advertising commands as a reset attempt. Test If Really Unpaired verifies removal; it does not perform removal."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: "The same app reconnects with Quick Verify. Moving to another app requires a new Full Verify and a distinct pairing record."
      steps:
        - action: "Disconnect the old central; the button supports one active central even though apps on that central have independent sessions."
          actor: "user"
        - action: "On the same app installation, Quick Verify with its stored identifier/key. On a different app, enable Public mode and Full Verify instead of copying another app's record."
          actor: "client"
          expect: "A fresh session with new session keys; pairing ID is reused, session keys and packet counters are not."
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device:
        - "Per-app pairing records and advertising settings; capacity/eviction details beyond the documented full-slot response are not established"
        - "Optional BLE bond information, user name, boot/event counters and firmware state"
      issued_to_client:
        - "32-bit pairing identifier and 128-bit pairing key from Full Verify"
        - "Per-session logical connection ID, Chaskey session key, packet counters, boot_id and reliable event counters"
      notes: "No Wi-Fi passphrase or cloud key is used. Session keys never leave the session; pairing keys are persistent secrets and must not be logged."
  pairing:
    required: true
    confidence: "medium"
    security_mode: "app_layer"
    bonding: "optional"
    exclusivity:
      single_connection: true
      single_bond: false
      recovery: "Close the other central. On the same host, filter notifications by the assigned logical connection ID instead of treating another app's traffic as an error."
      notes: "Multiple apps can hold independent pairings and logical sessions on one central; this is not multiple simultaneous centrals."
    enter_pairing_mode:
      required: true
      advertised_name: "F2"
      advertised_name_match: "prefix"
      indicator: "Public F2 firmware/name suffix, control service and company-0x030f scan response; Private mode is insufficient for initial pairing."
      procedures:
        - name: "Enable Public advertising mode (physical sequence not established)"
          verified: false
          basis: "The official protocol requires Public mode but the reviewed source gives no model-neutral button hold/press sequence."
          power_state: "on"
          indicator: "The complete public advertisement described in protocol_details.public_advertising."
          steps:
            - action: "Enable Public mode using the model-specific vendor instructions, then verify the public advertisement rather than relying on an unverified press count."
              actor: "user"
              expect: "Public F2 name, control service and manufacturer scan response are present."
      notes: "Private mode advertises only flags; existing clients can still reconnect by address."
    unpair:
      supported: "unknown"
      requires_factory_reset: false
      clears: "The host can always delete its own pairing record. A device-side per-app revocation procedure is not established."
      notes: "Test If Really Unpaired authenticates whether a pairing is already absent; it does not revoke it. Never delete a stored pairing on negative Quick Verify response 6 alone."

initialization:
  - characteristic: "00420002-8f59-4420-870d-84f3b617e493"
    subscribe: true
    notes: "Enable notifications before Full/Quick Verify; filter every packet by logical connection ID and reassemble fragments before dispatch."
  - description: "Negotiate ATT MTU 140 when the host supports it; otherwise fragment every logical packet to fit the negotiated ATT value. Session establishment is protocol_details.full_verify or quick_verify, not a fixed-byte handshake."

services:
  - uuid: "00420000-8f59-4420-870d-84f3b617e493"
    name: "Flic 2 / Duo Control Service"
    notes: >
      All commands below are logical opcode || data structures, NOT complete GATT
      values. Wrap with protocol_details.packet_framing and append a signature when
      protocol_details.packet_signatures requires one. Never write an established-
      session request without its valid counter/signature.
    characteristics:
      - uuid: "00420001-8f59-4420-870d-84f3b617e493"
        name: "Host to Button"
        properties: ["write_without_response"]
        role: "command"
        commands:
          full_verify_request_1:
            description: "Unsigned connectionless Full Verify Request 1: opcode 0 + tmp_id uint32le. Prepend byte 0 = 0."
            encoding: "bytes"
            template: [0x00, "{tmp_id}"]
            parameters:
              tmp_id: { type: "uint32", endianness: "little", min: 0, max: 4294967295, description: "Fresh cryptographically random temporary ID" }
            verification: "reported"
          quick_verify_request:
            description: "Unsigned connectionless Quick Verify: opcode 5 + random[7] + discriminator + tmp_id u32le + pairing_id u32le. Prepend byte 0 = 0."
            encoding: "bytes"
            template: [0x05, "{random_client_bytes}", "{duo_discriminator}", "{tmp_id}", "{pairing_identifier}"]
            parameters:
              random_client_bytes: { type: "bytes", min_length: 7, max_length: 7, description: "Fresh CSPRNG output" }
              duo_discriminator: { type: "uint8", allowed: [0, 64], labels: ["Flic 2/base", "Duo extension"], default: 0 }
              tmp_id: { type: "uint32", endianness: "little", min: 0, max: 4294967295 }
              pairing_identifier: { type: "uint32", endianness: "little", min: 0, max: 4294967295, source: "credential:pairing_identifier" }
            verification: "reported"
          get_battery_level:
            description: "Established-session opcode 20 with no data. Add logical ID, direction-1 counter signature and fragmentation as required."
            encoding: "bytes"
            value: [0x14]
            verification: "reported"
      - uuid: "00420002-8f59-4420-870d-84f3b617e493"
        name: "Button to Host Notifications"
        properties: ["notify"]
        notes: "Reassemble fragments and verify connId/signature/counter before parsing opcodes. A notification addressed to another app is dropped, not consumed."

payload_formats:
  BatteryLevelResponse:
    description: "Established-session response opcode 20 followed by uint16le raw battery level; signature follows the data and is removed before parsing."
    fields:
      - { index: 0, name: "opcode", type: "uint8", values: { 20: "battery response" } }
      - { index: 1, name: "battery_raw", type: "uint16", endianness: "little", scale: 0.003515625, unit: "V", device_class: "voltage", description: "raw * 3.6 / 1024 volts; not a state-of-charge percentage" }
    parse_rules: ["Require opcode 20 and at least 3 data bytes before the five-byte signature, then verify signature/counter before using the value."]
    example: "14 00 04"
  ButtonEventItem:
    description: "Eight-byte little-endian bitfield inside opcode-12 ButtonEventNotification after event_count_u32le."
    fields:
      - { index: 0, name: "timestamp", description: "Least-significant 48 bits; boot-relative ticks at 1/32768 second" }
      - { index: 48, name: "event_encoded", description: "Next 4 bits; low two select base type, bit 3 selects enriched up semantics" }
      - { index: 52, name: "was_queued", description: "One bit" }
      - { index: 53, name: "was_queued_last", description: "One bit" }
      - { index: 54, name: "rfu", description: "Two reserved bits" }
    parse_rules:
      - "Start type = event_encoded & 3 (0 up, 1 down, 2 single-click timeout, 3 hold)."
      - "If bit 3 is set: type = 0; wasHold = bit 2; singleClick = bit 1 && !bit 0; doubleClick = bit 1 && bit 0. Otherwise if event_encoded == 7, nextUpWillBeDoubleClick = true."
      - "Acknowledge once per notification when (type == 0 && (singleClick || doubleClick)) || type == 2, using opcode 16 and the packet's event_count after all items are processed."
  DuoPushTwistNotification:
    description: "Established Duo session opcode 33: flags byte followed by signed int32le angle difference."
    fields:
      - { index: 0, name: "opcode", type: "uint8", values: { 33: "push-twist data" } }
      - { index: 1, name: "button_flags", type: "uint8", description: "bits 0-1 pressed, 2-3 first event, 4-5 held at least half a second; remaining bits RFU" }
      - { index: 2, name: "angle_diff_raw", type: "int32", endianness: "little", scale: 0.0054931640625, unit: "deg", description: "Signed delta; 65536 raw units per 360 degrees, positive right" }
    parse_rules: ["Accumulate only while the corresponding button is pressed. Reset angle state when both buttons are released and a new press starts; this is not an absolute angle."]

protocol_details:
  public_advertising:
    name: "F2 + firmware as two decimal digits + URL-safe-base64(low 24 address bits, big-endian), exactly 8 characters"
    service_uuid: "00420000-8f59-4420-870d-84f3b617e493"
    company_id: 783
    scan_response_payload: "02 | address_top_24_bit_little_endian[3] | flags; extra trailing bytes are RFU"
    flags: "bit 0 address type (0 public, 1 static random); bit 1 already connected (1); all others RFU"
    private_mode: "Flags only and empty scan response; not identifiable as a new Flic 2/Duo and not eligible for initial Full Verify."
    address_recovery: "Join the three manufacturer bytes (reverse them to big-endian top 24) with the three name-decoded low bytes; verify again in Full Verify Response 1."
    test_vector:
      address: "02:00:00:76:42:06"
      firmware: 7
      local_name: "F207dkIG"
      manufacturer_payload_hex: "0200000201"
      address_type: "static random"
      connected: false
      evidence: "Synthetic locally administered address using the vendor's public suffix example; no real unit"
  packet_framing:
    byte_zero:
      bits_0_4: "Logical connection ID; 0 only for connectionless packets"
      bit_5: "newlyAssigned from button; always 0 toward button"
      bit_6: "Multiple packets in one GATT value. When 1 and bit 7 is 0, insert a length byte after byte 0 containing opcode+data+signature length, excluding byte 0 and the length byte; the next packet then starts with a new byte 0"
      bit_7: "1 = more fragments follow, 0 = final fragment"
    fragmentation: "Concatenate opcode || data || signature(if present), split to fit the negotiated ATT characteristic value, prepend the same byte 0 to every fragment, set bit 7 on all but the last, and send in order."
    mtu: { att: 140, characteristic_value_bytes: 137, maximum_reassembled_packet_bytes: 129 }
    logical_connection_filter: "After assignment, drop packets for every other connId without consuming counters or events."
    malformed_rules:
      - "Reject a new logical packet larger than 129 bytes reassembled and any fragment stream ending before a final fragment."
      - "Do not treat continuation fragments as new opcodes. Verify only after complete reassembly."
      - "Multiple-packet concatenation is optional; a receiver that implements it must honor the inserted length and stop exactly at packet boundaries."
  packet_signatures:
    algorithm: "Chaskey-LTS, 16-round permutation, 128-bit key, first 5 bytes of the 16-byte tag"
    message: "packet_counter_u64le || direction_u64le || opcode || data; direction 0 from button, 1 toward button"
    counters: "Independent per direction. First signed packet is counter 0; increment only after successful processing. Require the exact expected counter and reject a replay."
    failure: "A bad signature terminates the session. Wait 5 seconds before creating a fresh session; never reuse packet counters or the old session key."
    chaskey_subkeys:
      words: "Read key as four uint32le words K0..K3. K1 = cyclic left shift of the 128-bit key by 1, xor 0x87 into word 0 if the old word 3 top bit was 1. K2 = the same operation on K1."
    block_processing:
      - "Initialize state from K. For each complete non-final 16-byte message block: xor block into state and apply the 16-round permutation."
      - "If the final message block is exactly 16 bytes (including a message already aligned with no remainder), xor final block and K1 into state, permute, then xor K1 into state again."
      - "Otherwise zero-pad the final partial block, set the byte after the last message byte to 0x01, xor that block and K2 into state, permute, then xor K2 into state again."
      - "The 16-byte tag is state words serialized uint32le; Flic signatures are its first five bytes. Empty messages are not used for packet signatures."
    permutation:
      initial: "Before each group of 16 rounds, rotate word 2 right 16 bits; after the group, rotate word 2 right 16 bits again."
      rounds: "16 iterations, all additions modulo 2^32: v0 += v1; v1 = v0 XOR rotl(v1,5); v2 = v3 + rotr(v2,16); v3 = v2 XOR rotl(v3,8); v2 += v1; v0 = v3 + rotr(v0,16); v1 = v2 XOR rotl(v1,7); v3 = v0 XOR rotl(v3,13)."
    test_vectors:
      - { key_hex: "000102030405060708090a0b0c0d0e0f", subkey1_words_le_hex: ["06040200", "0e0c0a08", "16141210", "1e1c1a18"], subkey2_words_le_hex: ["0c080400", "1c181410", "2c282420", "3c383430"] }
      - { key_hex: "000102030405060708090a0b0c0d0e0f", message_data_hex: "60", counter: 0, direction: 1, expected_signature_hex: "06fa6d60ea" }
      - { key_hex: "000102030405060708090a0b0c0d0e0f", message_data_hex: "606162636465666768696a6b6c6d6e", counter: 0, direction: 1, expected_signature_hex: "b0fe7d9be6" }
      - { key_hex: "000102030405060708090a0b0c0d0e0f", message_data_hex: "606162636465666768696a6b6c6d6e6f", counter: 0, direction: 1, expected_signature_hex: "06e6d40f51" }
      - { key_hex: "000102030405060708090a0b0c0d0e0f", message_data_hex: "606162636465666768696a6b6c6d6e6f70", counter: 0, direction: 1, expected_signature_hex: "11a42eccc3" }
      - { key_hex: "000102030405060708090a0b0c0d0e0f", message_data_hex: "606162636465666768696a6b6c6d6e6f707172737475767778797a7b7c7d7e", counter: 0, direction: 1, expected_signature_hex: "d107d7a0d7" }
      - { key_hex: "000102030405060708090a0b0c0d0e0f", message_data_hex: "606162636465666768696a6b6c6d6e6f707172737475767778797a7b7c7d7e7f", counter: 0, direction: 1, expected_signature_hex: "23b3fc102a" }
      - { key_hex: "000102030405060708090a0b0c0d0e0f", message_data_hex: "606162636465666768696a6b6c6d6e6f707172737475767778797a7b7c7d7e7f80", counter: 0, direction: 1, expected_signature_hex: "f4a033a664" }
      - { key_hex: "000102030405060708090a0b0c0d0e0f", message_data_hex: "606162636465666768696a6b6c6d6e6f70", counter: 1, direction: 0, expected_signature_hex: "a31f62da36" }
      - { key_hex: "000102030405060708090a0b0c0d0e0f", message_data_hex: "606162636465666768696a6b6c6d6e6f70", counter: 2, direction: 0, expected_signature_hex: "dfe285777b" }
    vector_provenance: "Synthetic inputs checked against official flic2lib-android 2.1.1 @ d18733ac31a8a20f217b64507836bf8c87d58169; no device secret"
  full_verify:
    request_1: "connId 0, unsigned: opcode 0 | tmp_id u32le"
    response_1:
      layout: "opcode 0 | tmp_id u32le | ed25519_signature[64] | address[6] little-endian | address_type u8 | button_x25519_public[32] | button_random[8] | flags"
      flags: "bit 0 link encrypted, bit 1 public mode, bit 2 bond info; newlyAssigned bit in packet byte 0 supplies logical ID"
      identity_verification: "Check tmp_id and address/type. Ed25519 message = address || address_type || button_x25519_public. Public key = d33f2440dd54b31b2e1dcf40132efa41d8f8a7474168df4008f5a95fb3b0d022. Initially signature[32]&3 == 0; test all four values of those two recovered bits and keep the unique sigBits 0-3 that verifies. Zero or multiple successful verifications is failure."
    request_2:
      secret_derivation: "fullVerifySecret = SHA-256(x25519_shared_secret[32] || sigBits_u8 || button_random[8] || client_random[8] || variant_u8), variant 0x00 base or 0x80 Duo"
      hmac: "fullVerifyHmac = HMAC-SHA-256(key=fullVerifySecret). verifier = HMAC('AT')[0:16]; sessionKey = HMAC('SK')[0:16]."
      layout: "opcode 2 | client_x25519_public[32] | client_random[8] | variant/RFU byte | verifier[16], unsigned on assigned connId. Duo sets supports_duo bit 0x80; all other variant/RFU bits zero."
      abort: "Opcode 3 aborts and releases the pending session. Failure response 3: reason 0 invalid verifier, 1 not Public mode."
    response_2:
      layout: "opcode 1 | flags | button_uuid[16] big-endian | name_len | name[23] | firmware_u32le | battery_u16le | serial[11] | optional Duo color[16], then five-byte signature"
      flags: "bit 0 app_credentials_match (must be 1), bit 1 cares_about_app_credentials, bit 2 is_duo; unknown trailing fields are ignored"
      pairing_derivation: "pk = fullVerifyHmac('PK'). pairing_identifier = uint32le(pk[0:4]); pairing_key = pk[4:20]. Persist before reliable event initialization."
      battery: "battery_u16le * 3.6 / 1024 volts"
    test_vectors:
      - variant: "Flic 2/base"
        shared_secret_hex: "101112131415161718191a1b1c1d1e1f202122232425262728292a2b2c2d2e2f"
        sig_bits: 2
        button_random_hex: "2021222324252627"
        client_random_hex: "3031323334353637"
