        sig_bits: 2
        button_random_hex: "2021222324252627"
        client_random_hex: "3031323334353637"
        full_verify_secret_hex: "470232cbaa2f006d79b47bc5adcda70d956e6c728d3e018dc1268de280fe0d35"
        verifier_hex: "30965f6bd01fecdd1465c050a31026c3"
        session_key_hex: "08d569be0bc741360a93167e42eaf035"
        pairing_identifier_hex: "c21b5856"
        pairing_key_hex: "9da8525e5a69409f2b4c5390a8259b09"
        pairing_token_hex: "7cbaf91f3f244b5caac3c5934cac7d23"
        negative_result_hex: "b197a0b6dcc2c49f9dcadda74aad3cde"
    vector_provenance: "Synthetic shared secret/randoms checked with SHA-256/HMAC-SHA-256 against the published derivation; not an X25519 or Ed25519 hardware vector"
  quick_verify:
    request: "connId 0, unsigned: opcode 5 | random_client[7] | discriminator | tmp_id u32le | pairing_identifier u32le. discriminator 0x00 base or 0x40 Duo."
    response: "newlyAssigned connId, signed: opcode 8 | random_button[8] | tmp_id u32le | flags | signature[5]. Flags bit 0 link encrypted, bit 1 bond info, bit 2 is_duo."
    session_key: "Chaskey-LTS(pairing_key, random_client[7] || discriminator_u8 || random_button[8]) with one exact 16-byte block and K1, returning all 16 tag bytes."
    first_validation: "Verify response signature with from-button counter 0 before accepting the session. tmp_id mismatch or wrong connId is dropped."
    negative_response: "Opcode 6 | tmp_id u32le, unsigned on connId 0. Do not delete the pairing based on this spoofable message."
    really_unpaired:
      request: "After a fresh valid Full Verify Response 1, send unsigned opcode 4 | client_x25519_public[32] | client_random[8] | pairing_id u32le | pairing_token[16] on the assigned connId."
      pairing_token: "first 16 bytes of fullVerifyHmac('PT' || pairing_id_u32le || pairing_key)"
      response: "Unsigned opcode 4 | result[16]. expected = first 16 bytes of fullVerifyHmac('NE' || pairing_token)."
      result: "Only an exact constant-time match proves removal; delete the local record then. Every other outcome terminates and leaves it intact."
    test_vectors:
      pairing_key_hex: "000102030405060708090a0b0c0d0e0f"
      random_client_hex: "20212223242526"
      random_button_hex: "4041424344454647"
      base_discriminator_hex: "00"
      base_session_key_hex: "10dfef482752e3f3f4322b41c0930ccb"
      duo_discriminator_hex: "40"
      duo_session_key_hex: "ffc8f0c07daf72064dbb75302c1b0017"
      provenance: "Synthetic key/randoms checked against official flic2lib-android 2.1.1 Chaskey-LTS implementation"
  reliable_events:
    init_light_request:
      opcode: 23
      layout: "event_count u32le | boot_id u32le | auto_disconnect_time:9 | max_queued_packets:5 | max_queued_packets_age:20 | rfu:6, packed least-significant bit first into five bytes"
      initial_values: "First contact: event_count=0 and boot_id=0. Later use the persisted values. auto_disconnect 511 disables; otherwise at least 40 s is recommended. max_queued_packets 0-30 or 31 unlimited; age 0-0xffffe or 0xfffff unlimited seconds."
    init_response:
      with_boot_id_opcode: 10
      without_boot_id_opcode: 11
      bitfield: "uint64le has_queued_events:1 | timestamp:47, then event_count u32le and optional boot_id u32le. Timestamp is boot-relative ticks at 1/32768 s."
      storage: "Persist event_count and boot_id; has_queued_events=0 means no queued events are waiting."
    notification:
      opcode: 12
      layout: "event_count u32le | items[8 bytes each], item layout in payload_formats.ButtonEventItem"
      event_count_modulo: "1 down, 2 hold, 3 up, 0 single-click timeout. event_count/4 approximates clicks; skipped hold/timeout values require backwards reconciliation for per-item counts."
      acknowledgement: "After every item is processed, persist event_count and send at most one signed opcode 16 | event_count u32le when the rule in payload_formats.ButtonEventItem fires."
    test_vector:
      event_count: 3
      item_hex: "0080000000000a00"
      expected: { timestamp_ticks: 32768, type: 0, single_click: true, double_click: false, was_hold: false, acknowledge: true }
      acknowledgement_opcode: 16
      acknowledgement_event_count: 3
      evidence: "Invented event, not user history"
    ping: "Button opcode 15 requires a signed opcode 14 response on the same session."
    disconnect: "Opcode 9 ends a verified link. Button reason codes: 0 ping timeout, 1 invalid signature, 2 new session with same pairing ID, 3 user disconnect."
  duo_events:
    selection: "Use only when is_duo is set. Base-only support emits just the big button. Big button index 0, small button index 1."
    init_light_request: "Opcode 35 | event_count[2] u32le each | boot_id u32le | same packed five-byte queue/auto-disconnect fields as base"
    init_response: "Opcode 30 has no boot_id; opcode 31 includes it. uint64le has_queued_events:1 | timestamp_ms:47 | event_count[2] | optional boot_id. Duo timestamps are milliseconds, not 1/32768 s."
    notification: "Opcode 32 | events_data bitstream, least-significant bit first. Maintain last_timestamp=0, event_count[2] from init, and end_of_queue_marker (true initially only when no events are queued)."
    update_loop: "Decode concatenated updates; a single final byte cannot hold an update, so stop when fewer than two unread bytes remain. Ignore trailing padding bits and never emit a partial update."
    event_counter:
      first_update_per_button: "delta = extract_bits(1). If delta == 1 and extract_bits(1) == 1, delta = extract_bits({2,4,8,32}[extract_bits(2)]). delta += 1, then event_count[button] += delta."
      later_update_same_button: "event_count[button] += 1"
    timestamp: "width = {8,10,13,16,24,32,40,48}[extract_bits(3)]; last_timestamp += extract_bits(width), in milliseconds, shared across buttons."
    queue_flags: "While end_of_queue_marker is false: extract_bits(1)==0 means queued, continue. Otherwise set end_of_queue_marker=true; the next bit 0 means this is the last queued event, 1 means queued data was discarded and this is the first live event."
    type_table:
      0: "up <0.5 s; cannot yet distinguish single/double"
      1: "up 0.5-1 s; single click"
      2: "up >=1 s; was_hold and single click"
      3: "up <0.5 s; second click of double click"
      4: "up >=0.5 s; second click of double click, with one extra bit for double-click-was-also-hold"
      5: "down"
      6: "single click timeout"
      7: "hold, with one extra next_up_will_be_double_click bit"
    parity_rule: "For type <=5, if event_count[button] is even after the delta and before emitting, increment it once more; the resulting count is the event's acknowledged count."
    gesture: "For up types 0-4 and timeout 6: read withGesture bit; if 1, read recognized bit; if recognized, read 2 bits for 0 left, 1 right, 2 up, 3 down. Type 5/7 have no gesture bits."
    accelerometer: "Read signed int8 x,y,z after every event; each raw value / 64.036875 gives acceleration in g."
    event_mapping:
      was_hold: "type == 2 || (type == 4 && double_click_was_also_hold)"
      single_click: "type == 1 || type == 2"
      double_click: "type == 3 || type == 4"
      acknowledgement: "Once per packet if any event has single_click || double_click || type == 6; send signed opcode 36 | event_count[0] u32le | event_count[1] u32le after persisting both counts."
    synthetic_vectors:
      - name: "duo_down_big_button"
        initial: { event_count: [0, 0], last_timestamp_ms: 0, end_of_queue_marker: true }
        events_data_hex: "80ac4000c0"
        expected: { button: 0, event_count: [1, 0], timestamp_ms: 100, type: 5, acceleration_raw: [64, 0, -64], acknowledge: false }
      - name: "duo_single_click_big_button"
        initial: { event_count: [1, 0], last_timestamp_ms: 100, end_of_queue_marker: true }
        events_data_hex: "824c00010003"
        expected: { button: 0, event_count: [3, 0], timestamp_ms: 150, type: 1, single_click: true, acceleration_raw: [64, 0, -64], acknowledge: true }
    provenance: "Hand-laid synthetic bits from the published grammar, independently decoded in scripts/test_flic_2_duo_spec.py; not captured user activity"
    get_color: "Established Duo opcode 40; response opcode 34 followed by a null-terminated color string in a 16-byte field."
  duo_push_twist:
    enable: "Established Duo opcode 37 | button mask (bit 0 big, bit 1 small); use only when is_duo is set"
    updates: "Approximately once per connection interval; decode payload_formats.DuoPushTwistNotification"
    angle: "Signed int32le delta, 65536 units per turn. It is relative to the previous event, not an absolute position. Positive is right, negative left."
    scope_limit: "Raw direct-BLE events are described; vendor hub-specific real-time dimming behavior is not claimed."
  firmware_update:
    boundary: "Out of the ordinary event client. Start only with the model's signed-session algorithm and backend, never by replaying a fixed frame."
    flic2: "Start opcode 17: len u16le in 32-bit words | iv u64le | status_interval u16le >=17 (60 recommended). Data opcode 18, at most 30 words per packet. Status opcode 19 gives processed words; 0 means signature rejection. Backend /firmware2."
    duo: "Start opcode 38: len u32le bytes | header[76] | status_interval u16le (2 recommended). Data opcode 39, positive chunks suggested <=110 bytes and <=550 outstanding. Status 0 means signature rejection. Backend /firmware3. Base update start on Duo fails; do not use it."
    completion: "Disconnect after success to reboot. An interrupted transfer can resume from the response's start_pos; image signing details and bootloader advertisement are not published here."
  excluded_surfaces:
    - "Flic 1 and its legacy UUID/pairing table"
    - "Flic Twist and all Flic Hub, Hub LR and Hub Mini transports/APIs"
    - "Consumer-app account onboarding as a prerequisite for this third-party protocol"
    - "Firmware operations without a fresh established session and model-specific image flow"

