# Tuya Bluetooth Soil Tester (zwjcy / SGS01 family) — Device Specification
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# This is a FAMILY spec, not one exact product. The "Tuya Smart Bluetooth Soil
# Tester / Smart Plant Soil Tester" listings on Amazon/AliExpress are one Tuya
# OEM family whose canonical hardware is the SGS01 (a.k.a. HZ-SL05, "Connected
# Home PLANT MONITOR") from Shenzhen HaiHao Electronic. It maps to Tuya device
# category `zwjcy` (soil sensor / plant monitor — undocumented in Tuya's public
# standard-instruction-set docs). Near-identical BLE soil testers are instead
# certified under category `wsdcg` (temperature/humidity sensor) with a
# different DP numbering; both are covered in `device.variants`.

device:
  name: "Tuya Bluetooth Soil Tester (zwjcy / SGS01 family)"
  manufacturer: "Tuya (platform) / Shenzhen HaiHao Electronic Co., LTD (canonical SGS01) + white-label clones"
  manufacturer_status: "active"
  testing:
    status: untested
    notes: >
      No hardware has been exercised by this project. Every fact below is
      derived from community clean-room work (PlusPlus-ua/python-tuya-ble,
      garnser/ha_tuya_ble, haraldapp/SGS01BTHome, Home Assistant's Tuya
      integration) cross-checked against clean-room static analysis of the
      Smart Life app (see `evidence`), whose BLE SDK carries the transport constants
      and function codes used here. The DP tables are integration-derived and
      NOT byte-verified against a live device; the Tuya category `zwjcy` has
      no official public DP schema at all.
  protocol: "ble"
  category: "sensor"
  category_hierarchy: ["measurement", "environmental"]
  transport: "ble-gatt"  # Tuya's own framing rides on plain GATT notify/write
  integration: "identify_only"
  notes: >
    A battery-powered (2×AAA) probe that measures soil moisture and
    temperature, marketed as "works with Alexa & Google". Internally it is a
    two-processor device (per the haraldapp/SGS01BTHome teardown): a Tuya
    BT3L module on SGS01 or BTU module on SGS01B (both Telink TLSR8250, 512 KB
    flash) runs stock Tuya BLE firmware and owns the radio, while a separate
    third-party MCU owns the actual measurement, button and LED. The two are
    linked by UART running the standard Tuya MCU serial protocol (the same
    frame family as TuyaMCU Wi-Fi devices); SGS01B uses a different baud rate
    handled by the replacement firmware's auto-detection.

    PROTOCOL: this is a Tuya BLE "single-point" device — connectable GATT,
    NOT BLE mesh and NOT a passive beacon. Advertisements carry device
    identity only, never sensor readings; the ble_monitor project confirms
    SGS01 cannot be supported passively. Selection is manual because the
    generic matcher has no service_data key: classic <=3 advertisements use
    A201 and protocol-4 advertisements use FD50 service data, both with
    company ID 0x07D0. Protocol <=3 uses GATT service 0x1910 with write
    0x2B11 and notify 0x2B10. Protocol 4 instead uses service 0xFD50 with
    write 00000001-0000-1001-8001-00805f9b07d0 and notify
    00000002-0000-1001-8001-00805f9b07d0; those characteristics are not part
    of service 0x1910 and must never be mixed with it. All state moves as
    encrypted Tuya DP (datapoint) frames on the protocol-specific endpoints.
    The BLE v3 secret is the first six local-key characters:
    login_key = MD5(secret), and session_key = MD5(secret || six-byte
    device_random). PAIR still carries the UUID, but UUID is not a session-key
    input. These v3 derivations are not generalized to protocol 4. A local
    integration needs the device id + local key from a Tuya IoT cloud account
    — the same one-time key-extraction step as Tuya Wi-Fi devices.

    HUB QUESTION: with the phone nearby, Smart Life talks to the device
    directly over BLE — no hub needed for in-range monitoring. Remote
    access, Alexa/Google and cloud automations require a Tuya Bluetooth
    gateway (or multi-mode ZigBee+BLE gateway) bridging the BLE sub-device
    to Wi-Fi/cloud; the "works with Alexa" marketing presupposes that
    gateway. The device cannot be cloud-controlled standalone.

    CLOUD-FREE PATH: SGS01 uses BT3L and SGS01B uses BTU; both contain a
    Telink TLSR8250 with SWS flashing pads (chip type B85). haraldapp/
    SGS01BTHome turns them into BTHome v2 (optionally encrypted) passive
    advertisers with a GATT config profile and OTA — no Tuya account, keys or
    encryption session. The stable image covers SGS01. SGS01B (product
    gpkyrocn) is covered only by the V1.1Pre2 development image, which is not
    production-ready; it needs BTU-specific activation/unlock and an extra
    soldered wire for battery-voltage reporting.

  openness:
    status: "undocumented"
    reverse_engineered: true
    upstream_docs:
      - url: "https://github.com/PlusPlus-ua/python-tuya-ble"
        title: "python-tuya-ble — Tuya BLE single-point protocol implementation"
        covers: >
          GATT service/characteristic UUIDs, advertisement identity fields,
          pairing/key exchange, encrypted packet framing, and the function
          code + DP type tables reproduced in `tuya_ble_protocol` below.
      - url: "https://github.com/garnser/ha_tuya_ble"
        title: "ha_tuya_ble — Home Assistant custom integration (garnser fork)"
        covers: >
          Local BLE control with cloud-fetched keys; per-product DP maps for
          `zwjcy`/`gvygg3m8` and the `wsdcg` variants (`ojzlzzsw`,
          `tv6peegl`) reproduced in `dps` below.
      - url: "https://github.com/haraldapp/SGS01BTHome"
        title: "SGS01BTHome — SGS01 and SGS01B replacement firmware"
        covers: >
          Hardware internals: BT3L on SGS01 and BTU on SGS01B (both TLSR8250),
          SWS flashing, Tuya UART and factory data above 0x70000. Stable SGS01
          support and the V1.1Pre2 SGS01B development image are distinguished;
          the latter is not production-ready.
      - url: "https://github.com/home-assistant/core/tree/dev/homeassistant/components/tuya"
        title: "Home Assistant core Tuya integration"
        covers: >
          `DeviceCategory.ZWJCY` ("Soil sensor - plant monitor (undocumented)")
          exposed as temperature + humidity + battery sensors; cloud DP codes
          (humidity, temp_current, battery_state, battery_percentage).
    source_code: "https://github.com/PlusPlus-ua/python-tuya-ble"
    license: "MIT"
    notes: >
      Tuya publishes nothing about this category. The transport facts here
      are corroborated by two independent implementations (python-tuya-ble
      and the Tuya BLE SDK inside the Smart Life app); the DP maps come from
      the ha_tuya_ble integration and HA's cloud schema dumps and are marked
      `reported`, not byte-verified against hardware.

  identification:
    notes: >
      No manufacturer, service or local-name matcher is declared: generic Tuya
      advertisements must not auto-select this spec. Distinguishing a soil
      tester from any other Tuya BLE single-point device requires manual
      selection and product-ID confirmation from the vendor binding or a
      device-info/DP exchange. Service-data 0xFD50 and 0xA201 plus company
      0x07D0 are documentary platform evidence only, retained under
      protocol_details.tuya_ble_protocol.advertising, not an advertised GATT
      service UUID. The post-connection GATT services have their own
      protocol-specific mappings below.

  discovery:
    none: >
      Manual selection is required until the generic BLE schema/mobile matcher
      supports service data. Protocol-4 advertisements use FD50 service data;
      classic protocol <=3 falls back to A201, both with company 0x07D0.
      Neither is an advertised GATT service UUID or product-specific identity,
      and putting either in an invisible discovery.service_data key would make
      the spec look matched when no consumer can match it. Confirm the product
      ID and protocol-specific GATT layout before starting a session.
    identity:
      stable_keys: ["address"]
      display: "local_name"
    static_ip_required: false
    notes: >
      Advertisements are connectable and carry identity, never sensor values.
      Confidence: reported (community integrations + the Smart Life BLE SDK),
      not captured by this project.

  setup:
    required: true
    confidence: "medium"
    notes: >
      Unlike a plain BLE sensor, a stock Tuya BLE device must be PAIRED
      before it yields anything. PAIR carries the UUID, six-character secret
      and device ID; the secret comes from the cloud-issued local_key. BLE v3
      then uses login_key = MD5(secret) and session_key = MD5(secret ||
      six-byte device_random), not the UUID, for subsequent encrypted DP
      traffic. For third-party local access the device id and local key are
      fetched once from a Tuya IoT developer account (the ha_tuya_ble /
      tuya-iot-py-sdk flow). Not replayed against this hardware by this
      project.
    methods:
      - type: "ble_direct"
        name: "Pair once in the vendor app, then run the session yourself"
        role: "primary"
        verified: false
        description: >
          A stock Tuya BLE device yields nothing until it has been paired.
          The route has two phases — pair once in Smart Life or Tuya Smart to
          issue the device ID and local key, then connect directly and derive
          the BLE v3 login/session keys from the six-character secret and the
          session's six-byte device_random, with no hub and no cloud at runtime.
        stages:
          - type: "ble_provisioning"
            name: "Pair in the vendor app, and extract the keys"
            verified: false
            description: >
              Standard Tuya BLE pairing in the vendor app after manual product
              selection: classic protocol <=3 advertisements use A201 service
              data and protocol-4 advertisements use FD50 service data, both
              with company ID 0x07D0. These service-data records are not the
              advertised GATT service UUIDs. The app selects service 0x1910
              with 0x2B11/0x2B10 for protocol <=3, or service 0xFD50 with the
              two 128-bit Tuya characteristics for protocol 4, then exchanges
              PAIR frames (function code 0x0001) carrying the cloud-issued
              credentials. Requires a Tuya cloud account in Smart Life or Tuya
              Smart. No protocol-3 session or KDF claim is generalized to
              protocol 4.
            steps:
              - action: >
                  Put the tester in pairing mode (per the vendor quick-start:
                  batteries in / reset pin held), then manually select the
                  product rather than relying on an unsupported service_data
                  matcher. Expect A201 for classic <=3 or FD50 for protocol 4,
                  plus manufacturer company ID 0x07D0.
                actor: "user"
              - action: >
                  Confirm product ID and protocol version, then connect to
                  service 0x1910 for protocol <=3 or 0xFD50 for protocol 4;
                  use only the write and notify characteristics assigned to
                  that version below.
                actor: "client"
              - action: >
                  Exchange PAIR frames (function code 0x0001) carrying the
                  cloud-issued credentials, binding the device to the account.
                actor: "client"
                expect: >
                  The device appears in Smart Life / Tuya Smart and its uuid and
                  local_key exist in the account.
          - type: "ble_direct"
            name: "Run the encrypted session from a third-party client"
            verified: false
            description: >
              After one-time key extraction (device id + local key via a Tuya IoT
              developer account), a third-party client connects directly and runs
              the encrypted session itself — the python-tuya-ble / ha_tuya_ble
              path. No hub, no cloud at runtime.
            steps:
              - action: >
                  Pair the device once through the vendor app (the
                  ble_provisioning method above); local access needs the
                  credentials that pairing creates.
                actor: "user"
              - action: >
                  Fetch the device `uuid` and 16-char `local_key` once from a
                  Tuya IoT developer account (the ha_tuya_ble /
                  tuya-iot-py-sdk flow).
                actor: "user"
                expect: "Both secrets in hand; no cloud contact is needed after this."
              - action: >
                  Connect directly and run the encrypted DP session with those
                  keys — no hub and no cloud at runtime.
                actor: "client"
            ble:
              pairing_required: true
    factory_reset:
      confidence: "low"
      effect: >
        Unbinds the device from its Tuya account and clears the pairing
        keys; on re-pairing a new device id / local key pair is issued. The
        measurement MCU and its calibration are unaffected.
      procedures:
        - name: "App-initiated unbind/reset"
          steps:
            - action: "Remove the device in the Smart Life / Tuya Smart app (device settings → remove device)."
              actor: "user"
              notes: >
                The app drives an UNBIND (function code 0x0005) or
                DEVICE_RESET (0x0006) frame over GATT; the device returns to
                advertising in pairing mode. A physical button-hold reset
                likely exists on the probe's single button (generic Tuya BLE
                behavior) but is NOT documented for this family — unverified.
        - name: "Firmware replacement (nuclear option)"
          steps:
            - action: "Flash the exact SGS01 or SGS01B image over the Tuya module's SWS pads (Telink BDT or pvvx TlsrComSwireWriter)."
              actor: "user"
              notes: >
                Replaces the whole Tuya stack; afterwards there is no Tuya
                state to reset. Flash above 0x70000 holds factory
                MAC/calibration — preserve it. SGS01 uses BT3L and the stable
                image. SGS01B uses BTU/TLSR8250 and only the V1.1Pre2
                development image, which is not production-ready; follow its
                BTU activation/unlock and battery-measurement precautions.
    rejoin:
      in_place_supported: false
      requires_factory_reset: true
      notes: >
        BLE device — there is no network credential to rotate. Re-binding to
        a new Tuya account means unbind + re-pair.
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device:
        - "Tuya UUID and device ID (pairing identity)"
        - "Six-character local-key-derived secret and per-session keys derived with the six-byte device_random"
      issued_to_client:
        - "device id + 16-char local key (recoverable via Tuya IoT developer account + tuya-iot-py-sdk)"
      notes: >
        The local key IS the credential for the encrypted BLE session —
        treat it as a password.

  pairing:
    required: true
    confidence: "medium"
    security_mode: "app_layer"
    bonding: "none"
    pin:
      source: "vendor_app"
      notes: >
        Not a PIN: a device id and 16-character local key, issued by Tuya's
        cloud during the vendor-app pairing and recoverable afterwards through
        a Tuya IoT developer project. Per-unit, and rotated whenever the
        device is unbound and paired again.
    exclusivity:
      single_connection: true
      single_bond: true
      recovery: >
        Force-close Smart Life / Tuya Smart on every phone near the tester,
        and power down any Tuya Bluetooth gateway that has it, before
        connecting. A tester bound to someone else's account cannot be added
        to yours until they remove it or it is reset — and either way the
        local key changes.
      notes: >
        One binding: a tester belongs to exactly one Tuya account at a time
        (others reach it through that account's home sharing), and the
        local key is that binding's. One connection at a time is the normal
        behaviour of the stock single-link Tuya BLE firmware rather than
        something a source states for this model.
    unpair:
      # No route short of the reset: on this device unbinding IS the factory
      # reset, which is why `supported` is false rather than true.
      supported: false
      requires_factory_reset: true
      clears: >
        The Tuya account binding and the pairing keys; the device returns to
        advertising in pairing mode and is issued a new device id and local
        key on the next pairing.
      notes: >
        Unbinding and factory reset are the same operation on this device, and
        it is destructive to local access in a way users do not expect: any
        client holding the old local key stops working, and the replacement
        key can only be obtained by pairing through the vendor app and cloud
        again. Moving the tester to a different Tuya account means exactly
        this — unbind, re-pair, re-extract.
    enter_pairing_mode:
      required: true
      notes: >
        A factory-fresh or freshly reset tester advertises in pairing mode on
        its own; the procedure below is for a device that is already bound.
      procedures:
        - name: "Insert batteries, or hold the reset pin, until it advertises in pairing mode"
          glyph: "generic/pinhole-reset.svg"
          verified: false
          basis: >
            The vendor quick-start guide for this class of Tuya BLE device.
            Not replayed against hardware; the exact control differs across the
            models this spec covers.
          power_state: "off"
          steps:
            - action: "Insert the batteries, or hold the reset pin on an already-bound tester."
              actor: "user"
              expect: "The tester advertises A201 (classic <=3) or FD50 (protocol 4) service data plus manufacturer company ID 0x07D0 in pairing mode; manually select the product and confirm the protocol-specific GATT service."
    notes: >
      Nothing is readable at all without completing this: BLE v3 derives its
      session key from the local-key secret and six-byte device_random, both
      obtained only through the paired session, so a stock Tuya BLE device is
      inert to an unpaired client. UUID is carried by PAIR but is not a KDF
      input. The one hard cloud dependency is one-time — once the device id
      and local key are extracted, day-to-day local monitoring keeps working
      with the Tuya cloud gone entirely.
  # Family members this spec covers. Matching a physical unit to a variant
  # happens at cloud pairing time (product id) or via the DP layout observed
  # after pairing; the advertisement alone does not distinguish them.
  variants:
    - model: "SGS01 / HZ-SL05 (Connected Home PLANT MONITOR)"
      identification:
        product_id: "gvygg3m8"
      notes: >
        Canonical unit (Shenzhen HaiHao Electronic). Tuya category `zwjcy`;
        current product id. DP map in `dps.table` below. Supported by
        ha_tuya_ble and by the SGS01BTHome replacement firmware.
    - model: "SGS01 (older revision)"
      identification:
        product_id: "aao3yzhs"
      notes: >
        Older product id for the same hardware (per Home Assistant
        discussion #949); works in HA's cloud Tuya integration. DP map
        presumed identical to gvygg3m8; not independently verified.
    - model: "wsdcg-category BLE soil tester"
      identification:
        product_id: "ojzlzzsw"
      notes: >
        Same form factor and DPs, certified under Tuya category `wsdcg`
        (temperature/humidity sensor) with different DP numbering — see
        `dps.wsdcg_variants`.
    - model: "wsdcg-category BLE soil tester (alt DP numbering)"
      identification:
        product_id: "tv6peegl"
      notes: "wsdcg variant with DPs 101/102 — see `dps.wsdcg_variants`."
    - model: "SGS01B (2026 revision)"
      identification:
        product_id: "gpkyrocn"
      notes: >
        New hardware revision with a Tuya BTU module (TLSR8250, 512 KB flash),
        not BT3L. Community product descriptor `zwjcy_gpkyrocn` reports the
        same DP3/5/14/15 layout as gvygg3m8; retain that as a per-model
        reported boundary, not proof from this project. Stock protocol/GATT
        generation and session behavior still need a device-info/GATT dump.
        SGS01BTHome has a V1.1Pre2 development image for this revision, not a
        production-ready release. It needs BTU-specific activation/unlock and
        an extra soldered wire for battery-voltage reporting in BTHome.

protocol_handler: "tuya_ble"

# Vendor-specific protocol detail this schema does not model. Namespaced so the
# top level can stay closed; nothing here is a declared contract.
protocol_details:
  # The Tuya BLE single-point protocol as it applies to this family. Facts from
  # python-tuya-ble (const.py), corroborated by the BLE SDK classes in the
  # Smart Life app's bundled BLE SDK. Reported, not exercised by this project.
  # The BLE v3 KDF and DP record boundaries are declared below; the stateful
  # packet sequence/ACK/chunking and AES runtime remain in python-tuya-ble.
  tuya_ble_protocol:
    verification: "reported"
    transport: "BLE GATT, encrypted session, default ATT MTU 20"
    advertising:
      manufacturer_company_id: "0x07D0 (Tuya)"
      classic_le_3:
        service_data_uuid: "0xA201"
        role: "Classic protocol <=3 fallback identity record"
      protocol_4:
        service_data_uuid: "0xFD50"
        role: "Protocol-4 identity record; the maintained implementation tries FD50 before the classic fallback"
      service_data_matching_supported: false
      selection: "Manual product-ID and protocol/GATT confirmation is required because the generic BLE schema/mobile matcher has no service_data key; neither service-data UUID is an advertised GATT service UUID or soil-specific identity."
      notes: "Reported identity only; no sensor readings are ever broadcast."
    gatt:
      protocol_le_3:
        service: "0x1910"
        write_characteristic: "0x2B11"
        notify_characteristic: "0x2B10"
      protocol_4:
        service: "0xFD50"
        write_characteristic: "00000001-0000-1001-8001-00805f9b07d0"
        notify_characteristic: "00000002-0000-1001-8001-00805f9b07d0"
      selection: "Choose one complete endpoint set from the reported protocol version; never combine service 0xFD50 with 0x2B11/0x2B10."
    authentication:
      scope: "Maintained-client Tuya BLE v3 behavior; do not generalize this derivation to DP_V4."
      secret: "ASCII bytes of the first six characters of the cloud-issued 16-character local_key."
      login_key: "MD5(secret), as the 16 raw digest bytes."
      session_key: "MD5(secret || device_random), where device_random is exactly six bytes from the session negotiation; the UUID is NOT a session-key input."
      pair: "PAIR (function 0x0001) carries the UUID, secret and device ID padded to 44 bytes. UUID remains pairing data, not an input to either MD5 derivation above."
      synthetic_vector:
        secret_ascii: "123456"
        device_random_hex: "01 02 03 04 05 06"
        login_key_md5_hex: "e10adc3949ba59abbe56e057f20f883e"
        session_key_md5_hex: "b81578f4898234da5011f41415afdc3b"
        notes: "Dummy documentation values only, not credentials or a captured session."
    function_codes:
      verification: "reported"
      host_to_device:
        "0x0000": "FUN_SENDER_DEVICE_INFO"
        "0x0001": "PAIR"
        "0x0002": "DPS (DP query/set)"
        "0x0003": "DEVICE_STATUS"
        "0x0005": "UNBIND"
        "0x0006": "DEVICE_RESET"
        "0x000C..0x0010": "OTA block transfer"
        "0x0027": "DPS_V4"
      device_to_host:
        "0x8001": "FUN_RECEIVE_DP (DP report)"
        "0x8006": "FUN_RECEIVE_DP_V4"
        "0x8011": "time request"
        "0x8012": "time request (v2)"
    dp_types:
      verification: "reported"
      scope: "Tuya BLE v3 DP records; DP_V4 is not covered by this length rule."
      record_layout: "[dp id u8][type u8][length u8][payload, exactly length bytes]"
      types: "RAW=0x00, BOOL=0x01, VALUE=0x02, STRING=0x03, ENUM=0x04, BITMAP=0x05."
      signedness: "Decode VALUE and ENUM as signed big-endian integers of the declared length. Encode VALUE writes as signed four-byte big-endian."
      synthetic_vector: "05 02 04 ff ff ff f6 03 02 04 00 00 00 32"
      vector_decode: "DP5 VALUE length 4 = -10 -> -1.0 C after scale 0.1; DP3 VALUE length 4 = 50 -> 50 % moisture. A two-byte-length parser desynchronizes immediately."

  # Datapoint schema for the zwjcy family (product gvygg3m8) plus the wsdcg
  # variants. Sources: garnser/ha_tuya_ble DP maps and Home Assistant's cloud
  # schema (HA issue #93536) — two independent integrations agree, but the
  # category has no official Tuya documentation and nothing here is
  # byte-verified against a live device.
  dps:
    verification: "reported"
    table:
      - dp: 3
        code: "humidity"
        type: "value"
        access: "ro"
        unit: "%"
        min: 0
        max: 100
        description: "Soil moisture."
      - dp: 5
        code: "temp_current"
        type: "value"
        access: "ro"
        unit: "C"
        scale: 0.1
        description: "Temperature; raw value is tenths of a degree (divide by 10)."
      - dp: 14
        code: "battery_state"
        type: "enum"
        access: "ro"
        values: ["low", "normal", "high"]
        description: "Coarse battery level."
      - dp: 15
        code: "battery_percentage"
        type: "value"
        access: "ro"
        unit: "%"
        min: 0
        max: 100
        description: "Battery percentage."
      - code: "temp_unit_convert"
        type: "enum"
        access: "rw"
        values: ["c", "f"]
        description: >
          °C/°F unit preference. Seen in the cloud schema but not mapped to a
          BLE DP id in any community source — likely cloud-level only on this
          product. Unverified.
    wsdcg_variants:
      verification: "reported"
      notes: >
        Same form factor and readings under Tuya category `wsdcg`
        (temperature/humidity), different DP numbering:
      table:
        - product_id: "ojzlzzsw"
          temp_dp: 1
          moisture_dp: 2
          battery_state_dp: 3
          battery_percentage_dp: 4
          notes: "Temperature raw value ÷10, same as the zwjcy map."
        - product_id: "tv6peegl"
          temp_dp: 101
          moisture_dp: 102
          notes: "No battery DPs documented for this variant."

  # The module↔MCU side: BT3L/BTU speaks Tuya MCU serial to the measurement
  # MCU. The measurement, button and LED work with the radio reflashed, which
  # is what makes SGS01BTHome possible.
  tuyamcu_uart:
    verification: "reported"
    link: "UART between BT3L on SGS01 or BTU on SGS01B and the sensor MCU; replacement firmware auto-detects their different baud rates"
    role: >
      The sensor MCU owns measurement, button and LED; the Tuya module reports
      its state as DPs. Factory MAC/calibration live above 0x70000 — preserve
      when reflashing. This hardware fact does not establish the stock BLE
      protocol generation or validate the SGS01B development image.

services:
  - uuid: "00001910-0000-1000-8000-00805f9b34fb"
    name: "Tuya BLE protocol <=3 service"
    verification: "reported"
    notes: >
      Protocol <=3 carries encrypted framed commands on 0x2B11 and
      responses/reports on 0x2B10 within this 0x1910 service. Default ATT MTU
      20; frames are chunked/reassembled by the protocol layer. BLE v3
      session_key = MD5(local-key secret || six-byte device_random); UUID is
      not a session-key input. Do not substitute the protocol-4 service or its
      128-bit characteristics.
    characteristics:
      - uuid: "00002b11-0000-1000-8000-00805f9b34fb"
        name: "Protocol <=3 write"
        properties: ["write"]
        notes: >
          All host→device v3 commands: pairing, DP query/set, device info,
          unbind/reset and the reported OTA functions. Byte format is the Tuya
          BLE encrypted packet, chunked at the 20-byte default MTU; the full
          stateful framing remains in python-tuya-ble.
        commands:
          # No fixed bytes: v3 encryption depends on the per-session key and
          # per-frame state. These descriptions are not protocol-4 commands.
          pair:
            description: >
              Pairing handshake (function code 0x0001): carries UUID, secret
              and device ID padded to 44 bytes. The six-character local-key
              secret gives login_key = MD5(secret); the later session key is
              MD5(secret || six-byte device_random). UUID is not a KDF input.
              Not expressible as fixed bytes because the exchange carries
              per-session random state.
            verification: "reported"
          device_info:
            description: "Query device info (function code 0x0000): device id, product id, firmware and protocol version."
            verification: "reported"
          dp_query:
            description: "Request current protocol-3 DP values (function code 0x0002). Reports arrive on 0x2B10 as 0x8001; DPS_V4 is not this command."
            verification: "reported"
          device_status:
            description: "Query device status (function code 0x0003)."
            verification: "reported"
          unbind:
            description: "Unbind from the Tuya account (function code 0x0005)."
            verification: "reported"
          device_reset:
            description: "Factory reset (function code 0x0006)."
            verification: "reported"
          ota_transfer:
            description: >
              Reported protocol-3 firmware update block transfer (function
              codes 0x000C..0x0010). Exact image behavior is not established;
              do not generalize this command to the protocol-4 write endpoint.
            verification: "reported"
            advanced: true
            advanced_reason: >
              Writes new firmware to the BT3L/BTU radio module. An image for
              the wrong module or an interrupted transfer can leave the sensor
              without a working radio; wired recovery uses the SWS pads while
              keeping factory data above 0x70000.
      - uuid: "00002b10-0000-1000-8000-00805f9b34fb"
        name: "Protocol <=3 notify"
        properties: ["notify"]
        notes: >
          Protocol-3 DP reports (0x8001) carrying the sensor DPs, time
          requests (0x8011/0x8012) and command responses. Subscribe before the
          session exchange; sensor readings never arrive in advertisements.
          V4 report 0x8006 belongs to protocol 4, not this characteristic's
          protocol-3 profile.
  - uuid: "0000fd50-0000-1000-8000-00805f9b34fb"
    name: "Tuya BLE protocol-4 service"
    verification: "reported"
    notes: >
      Protocol 4 uses a different service and two Tuya-specific 128-bit
      characteristics below. Its reported advertisement uses FD50 service
      data, not A201 and not an assumed advertised GATT service UUID; manual
      product selection is still required. This entry does not claim that the
      v3 KDF, one-byte DP record length, OTA command or session implementation
      works unchanged on protocol 4; no fixed commands are declared here.
    characteristics:
      - uuid: "00000001-0000-1001-8001-00805f9b07d0"
        name: "Protocol-4 write"
        properties: ["write", "write_without_response"]
        role: "command"
        notes: >
          Protocol-4 host writes, including separately reported DPS_V4
          0x0027 after an appropriate protocol-4 session has been established.
          Do not move this characteristic to service 0x1910 or treat it as
          0x2B11. Exact protocol-4 session and OTA behavior remain open.
      - uuid: "00000002-0000-1001-8001-00805f9b07d0"
        name: "Protocol-4 notify"
        properties: ["notify"]
        role: "notify"
        notes: >
          Protocol-4 responses and DP_V4 reports (0x8006). Subscribe before
          protocol-4 negotiation; do not decode these payloads with the v3
          one-byte-length rule without independent evidence.

# No top-level `commands` block: the GATT writes live on the 0x2B11
# characteristic above (`pair`, `dp_query`, ...), which is where a BLE
# command has a UUID to go to. The entities' `state_command: dp_query`
# names that characteristic command. A top-level `transport: ble` entry
# used to duplicate two of them here; no transport arm handles that value
# and the schema no longer admits it.

features:
  - type: "firmware_update"
    dfu:
      mechanisms: ["tuya_ble_ota"]
      transport: "ble"
      image:
        signing: "unknown"
        source: "unknown"
      enter:
        how: "unknown"
        notes: >
          The reported protocol-3 stock update runs inside the encrypted
          session as function codes 0x000C..0x0010 through `ota_transfer` on
          0x2B11 within service 0x1910. Protocol 4 instead uses service
          0000fd50-0000-1000-8000-00805f9b34fb and write
          00000001-0000-1001-8001-00805f9b07d0, but its exact OTA exchange is
          not established and no command is declared. Whether either module
          receives the image in place or reboots first is not recorded.
      recovery:
        interrupted: "unknown"
        notes: >
          BT3L and BTU are both Telink TLSR8250 modules with SWS flashing pads
          (Telink BDT or pvvx TlsrComSwireWriter), but no interrupted update
          has been recovered by this project. Preserve factory MAC/calibration
          above 0x70000 and use the exact SGS01 or SGS01B wired procedure.
      verification: "reported"
      notes: >
        Function codes from python-tuya-ble; no update has been run by this
        project. Service 0x1910 and the protocol-4 service are both declared
        above with their own characteristics, so neither is repeated in
        `dfu.services`. The haraldapp/SGS01BTHome replacement firmware brings
        its own OTA once installed. SGS01B support is specifically the
        V1.1Pre2 development image, not a production-ready stock or
        replacement-firmware update path.

entities:
  - platform: "sensor"
    name: "Soil Moisture"
    device_class: "humidity"
    unit: "%"
    state_command: "dp_query"
    state_field: "dps.3"
    notes: "zwjcy products (gvygg3m8/aao3yzhs); wsdcg variants: DP 2 (ojzlzzsw) or DP 102 (tv6peegl)."
  - platform: "sensor"
    name: "Temperature"
    device_class: "temperature"
    unit: "C"
    state_command: "dp_query"
    state_field: "dps.5"
    notes: >
      Raw value is tenths of a degree — divide by 10. wsdcg variants:
      DP 1 (ojzlzzsw) or DP 101 (tv6peegl).
  - platform: "sensor"
    name: "Battery"
    device_class: "battery"
    unit: "%"
    state_command: "dp_query"
    state_field: "dps.15"
    notes: "Plus the coarse enum in DP 14 (low/normal/high). No battery DP documented for tv6peegl."

remaining_unknowns:
  - >
    The complete byte-level AES packet framing of the protocol-specific writes
    remains outside the generic command templates: per-frame sequence numbers,
    nonce state and chunking depend on the paired session. The BLE v3 secret,
    login/session MD5 derivations and PAIR boundary are explicit in
    protocol_details, but the schema has no executable stateful encryption
    declaration; protocol-4 writes deliberately have no command templates.
  - >
    DP_V4 is not covered by the BLE v3 one-byte DP length or the KDF above.
    Establish its length width, random-value location and session behavior
    from a captured, decrypted SGS01 DP_V4 exchange before generalizing.
  - >
    Each physical model's actual protocol/GATT generation needs a device-info
    and service dump. In particular SGS01B (BTU/TLSR8250, gpkyrocn) has only a
    community-reported DP map and a V1.1Pre2 development replacement image;
    neither its stock protocol-3/4 generation nor production readiness is
    asserted.

cloud:
  required: true
  vendor_service: "Tuya cloud (Smart Life / Tuya Smart platform)"
  status: "alive"
  hosts:
    - "a1/a2/a3.tuyaus.com (+ .tuyacn.com / .tuyaeu.com / .tuyain.com regional twins) — REST"
    - "m1/m2.tuyaus.com — MQTT"
  endpoints:
    - path: "a1.tuyaus.com (REST API family)"
      name: "Tuya OpenAPI / app API"
      verification: "reported"
      notes: >
        No tuya*.com hostnames appear as plaintext anywhere in the Smart Life
        app — region endpoints are delivered at runtime by
        Tuya's config service. The hosts listed are the publicly documented
        Tuya endpoint families, recorded for orientation.
  auth:
    type: "other"
    notes: >
      Tuya account + cloud-issued pairing; device-side auth for the BLE
      session is the device uuid / local key pair issued at pairing.
  failure_mode: >
    Stock firmware is dead without Tuya cloud at PAIRING time: pairing
    needs a Tuya account (the local key is cloud-issued), and the encrypted
    session cannot be established without it. Once paired and the device id
    + local key are extracted, day-to-day local monitoring (ha_tuya_ble /
    python-tuya-ble over direct BLE) keeps working with the Tuya cloud gone
    — the sensor never touches Wi-Fi itself. Remote access, Alexa/Google
    and cloud automations die with the cloud or the optional BLE gateway.
    SGS01BTHome removes the cloud dependency for SGS01; SGS01B has only the
    V1.1Pre2 development image, not a production-ready replacement path.
  notes: >
    The ONLY hard cloud dependency for local use is one-time pairing + key
    extraction: pair in Smart Life, link the account to a free Tuya IoT
    developer project, pull device id + local key (tuya-iot-py-sdk /
    ha_tuya_ble automate this). Tuya has broken this flow for some account
    types in the past — verify current status before buying hardware for a
    local-only install. The device UI in the vendor app is a cloud-delivered
    RN panel: zero hits for `zwjcy` anywhere in the Smart Life app; only the
    generic BLE transport machinery is in it.

local_access:
  status: "native"
  notes: >
    The Tuya BLE GATT protocol is native local access once the device id +
    local key are known — direct BLE, no bridge hardware, using the endpoint
    set for the reported protocol version. The catalogue integration is
    identify_only because the stock session needs a dedicated stateful
    encrypted handler; description-only commands are not generic fixed writes.
    Home Assistant path:
    garnser/ha_tuya_ble (HACS), which ships DP maps for gvygg3m8 and the
    wsdcg variants and uses tuya-iot-py-sdk for key retrieval. SGS01BTHome
    removes keys and cloud on SGS01. SGS01B is BTU/TLSR8250 product gpkyrocn
    and has only the V1.1Pre2 development image; its support and DP/session
    behavior remain reported, not production-ready or project-verified.

