      confirms:
        - "Tuya BLE manufacturer company ID 0x07D0; classic <=3 uses A201 service data and protocol 4 uses FD50 service data. Protocol <=3 uses GATT service 0x1910 with write 0x2B11 / notify 0x2B10, while protocol 4 uses service 0xFD50 with its separate 128-bit characteristics. Default ATT MTU 20."
        - "The BLE function-code and DP-type tables (PAIR 0x0001, DPS 0x0002, UNBIND 0x0005, DEVICE_RESET 0x0006, FUN_RECEIVE_DP 0x8001, etc.)."
