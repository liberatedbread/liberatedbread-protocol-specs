    No owner BLE-MIDI capture covering fragmented SysEx/clock, no advertised-name
    evidence, no midi.json before/after comparison, no host pairing matrix and no
    firmware image/update experiment exists in this research. App-specific
    visual/content protocols and USB-MIDI details remain separate work.

remaining_unknowns:
  - "No advertised OP-Z local name is established; generic MIDI service advertisements must never auto-identify the device."
  - "Real OP-Z BLE-MIDI fragmentation/coalescing, running-status behavior and actual connection MTU need an owner capture; synthetic vectors are not captures."
  - "The full JSON nesting/array shape and malformed-file behavior of midi.json are not established; preserve an existing file's structure."
  - "OS pairing/bond requirements, connection limits and bond-only clearing are unknown across hosts."
  - "Whether factory reset clears every Bluetooth bond in addition to custom content is not separately established."
  - "No latest firmware version, image signature/container, public update manifest or interrupted-update recovery behavior is asserted."
  - "Proprietary app visual/content commands and detailed USB-MIDI behavior are outside this initial standard-BLE-MIDI spec."

local_access:
