helpful_urls:
  - title: "Fitbit Aria Air User Manual, version 1.8 (vendor-hosted PDF)"
    url: "https://storage.googleapis.com/support-kms-prod/tstfwA3ivox007uvXqN4xtTKSmowts0Gzuxj"
    kind: "manual"
    description: >
      The current manual for the Aria Air (FB203) only, the copy the
      vendor's manuals page links to. Covers the unit button, the otA / clr
      restart used as the factory reset in this spec, batteries and
      specifications. HTTP 200, application/pdf, checked 2026-11-23.
  - title: "Fitbit Aria Air User Manual, version 1.1 (vendor-hosted PDF)"
    url: "https://staticcs.fitbit.com/content/assets/help/manuals/manual_aria_air_en_US.pdf"
    kind: "manual"
    description: >
      The older edition of the Aria Air (FB203) manual, PDF dated
      2020-01-03, with the same restart procedure. HTTP 200,
      application/pdf, checked 2026-11-23.
  - title: "Fitbit Aria Air manual on manua.ls (aggregator copy)"
    url: "https://www.manua.ls/fitbit/aria-air/manual"
    kind: "manual"
    description: >
      Aggregator-hosted copy of the Aria Air (FB203) manual, kept as a
      fallback for when the vendor links move. HTTP 200, checked 2026-11-23.
  - title: "Google Health Help: How do I use my Fitbit scale?"
    url: "https://support.google.com/googlehealth/answer/14236805"
    kind: "vendor_support"
    description: >
      Covers the Aria, Aria 2 and Aria Air. Carries the notice that, in the
      English text read on 2026-11-24, pairing and re-pairing of the Aria
      and Aria 2 ended on 9 November 2026 with app version 5.12, and that
      the Aria Air is not impacted. The page has been seen to change, so
      trust it over this line. Also says the app must be open on a nearby
      phone during an Aria Air weigh-in, that people without a linked
      account can still use the scale and see their weight, and how to tell
      the three scales apart by their batteries. HTTP 200, checked
      2026-11-24.
  - title: "Google Health Help: Set up your Fitbit device"
    url: "https://support.google.com/googlehealth/answer/14236818"
    kind: "vendor_support"
    description: >
      The vendor's setup steps for all three Aria scales; for the Aria Air
      (FB203), setup is in the phone app only. Carries the same pairing
      notice. HTTP 200, checked 2026-11-24.
  - title: "Google Health Help: How do I erase my Fitbit device?"
    url: "https://support.google.com/googlehealth/answer/14236515"
    kind: "vendor_support"
    description: >
      Covers the Aria, Aria 2 and Aria Air among other Fitbit devices. For
      the Aria Air (FB203) its whole erase instruction is one line saying
      the scale holds no personal data, which is the source of that
      statement in this spec. HTTP 200, checked 2026-11-24.
  - title: "Google Health Help: Fix syncing issues with Google Health"
    url: "https://support.google.com/googlehealth/answer/14236618"
    kind: "vendor_support"
    description: >
      Sync troubleshooting for Fitbit devices, with a section for the Aria
      Air (FB203), and the place to start when a paired scale stops
      syncing. Start with its first steps: app open nearby, force quit and
      reopen the app, restart Bluetooth, restart the phone. Its later steps
      reinstall the app and sign in on another phone or tablet: that is
      the vendor's advice, but where the key is kept is not established
      (Q11), so this spec cannot say what a reinstall does to it; try the
      earlier steps first. None of its Aria Air steps removes the scale
      itself from the account or resets it. HTTP 200, checked 2026-11-24.
  - title: "ha-fitbit-aria-air protocol notes (pinned)"
    url: "https://github.com/BigWebstas/ha-fitbit-aria-air/blob/d43708a1eb6acee368bde5a06b34208c9ece88f8/docs/PROTOCOL.md"
    kind: "protocol_writeup"
    description: >
      The public write-up this spec's protocol facts are restated from: one
      Aria Air on firmware A16. No licence file, so read it, do not copy it.
  - title: "ha-fitbit-aria-air (pinned)"
    url: "https://github.com/BigWebstas/ha-fitbit-aria-air/tree/d43708a1eb6acee368bde5a06b34208c9ece88f8"
    kind: "implementation"
    description: >
      Home Assistant custom integration for the Aria Air with a key
      extractor for an Android Bluetooth log and a standalone Linux reader.
      It needs the scale's key, and its documented way of getting one
      starts by removing the scale from the vendor account and resetting
      it: read device.setup before following it. Its author describes it as
      lightly tested, and it reports hundredths of the displayed unit in
      every unit mode, which is one side of conflict C1.
  - title: "openScale issue 1105: Fitbit Aria Air support"
    url: "https://github.com/oliexdev/openScale/issues/1105"
    kind: "forum"
    description: >
      The independent January 2025 capture, and the 2026-10-26 comment that
      reports writing an owner-chosen key after a reset: one unit, firmware
      not stated, introduced by its poster as an AI assistant's findings,
      reproduced by nobody. openScale itself has no Aria Air handler.
  - title: "SmarterScale: read a scale's display with a phone camera"
    url: "https://github.com/drinkcat/SmarterScale"
    kind: "implementation"
    description: >
      Open-source Android app (Apache-2.0) that reads the digits on a
      scale's display through the camera and writes the weight to Android
      Health Connect: no Bluetooth link to the scale, no key, no reset. Its
      README says it has been tested on a Fitbit Aria Air only, handles
      kilograms only and assumes where the decimal point is. Installed from
      the project's own release page, not an app store. Not run or reviewed
      by this project. README and LICENSE fetched 2026-11-24.
  - title: "FCC ID XRAFB203 (Fitbit Aria Air)"
    url: "https://fccid.io/XRAFB203"
    kind: "teardown"
    description: >
