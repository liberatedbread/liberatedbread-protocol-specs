evidence:
  documentation_review: >
    Read official introduction, getting-started, discovery, versioning, v1
    identity/measurement/telegram/system and v2 identity/authorization/
    measurement/telegram/system documents. Reviewed official Python model
    aliases, hostname mapping and sanitized v1/v2 fixtures. No APK analysis or
    live network discovery was needed or performed.
  open_questions: >
    Physical compatibility, actual token pairing, optional-field behavior on
    every firmware, live certificate chains, exact smart-meter cadence and all
    write operations remain unverified. Initial app account necessity and
    factory-reset/token-survival details were not established.
  artifacts:
    - type: "vendor_documentation"
      artifact: "homewizard/api-documentation 571384adec2183c16a79392a227d0e5ee92b4ee9"
      url: "https://github.com/homewizard/api-documentation"
      description: "Authoritative product/API compatibility, endpoints, field names/units, token flow, discovery and CA rules."
    - type: "public_implementation"
      artifact: "homewizard/python-homewizard-energy 60be21a42da6700f3939bdbf3ed4e3d87a0bc2d8"
      url: "https://github.com/homewizard/python-homewizard-energy"
      description: "Official client models, aliases, certificate mapping and sanitized offline fixtures; the wifi_ssid normalizer caveat is deliberately not copied."
    - type: "vendor_documentation"
      artifact: "HomeWizard Appliance Access CA"
      sha256: "4ec277e62033fae8bc373e3f2a976676d3f665683873f1ea8e3bdf78ac680003"
      url: "https://api-documentation.homewizard.com/homewizard-ca-cert.pem"
      description: "Public CA parsed offline; SHA-256 shown here is the certificate fingerprint, not a private artifact. No live TLS session was verified."

remaining_unknowns:
  - "No physical P1 or attached smart meter was read; firmware-specific availability and every optional-field combination need hardware confirmation."
  - "Actual v2 token issuance/revocation, live leaf certificate and hostname/TLS negotiation were not exercised."
  - "Whether initial HomeWizard Energy app provisioning strictly requires an account is unresolved; only the subsequent physical v2 token flow is established as local."
  - "Exact factory-reset procedure and Wi-Fi/v2-user/token survival across reset or network change are not established."
  - "Smart-meter timestamp timezone is deliberately unspecified by the API; local timezone interpretation must come from the meter/user, not an invented UTC claim."
  - "Behavior of future external meter types and future minor API fields must be confirmed without discarding unknown data."
