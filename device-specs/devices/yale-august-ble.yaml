# Yale Access / August BLE Locks — Device Specification
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# Sources (all public; clean-room — derived facts only):
#   - Yale-Libs/yalexs-ble (const.py / session.py / lock.py) — the local BLE
#     implementation Home Assistant uses.
#   - Home Assistant "Yale Access Bluetooth" / august integration docs.

device:
  name: "Yale Access / August Smart Locks"
  manufacturer: "August / Yale (ASSA ABLOY)"
  manufacturer_status: "active"
  testing:
    status: untested
    notes: >
      Not driven against hardware by this project. The GATT UUIDs, HAP-derived
      framing, opcodes and stateful AES-CBC session crypto are from
      Yale-Libs/yalexs-ble; the offline-key requirement from the Home Assistant
      integration docs.
  protocol: "ble"
  category: "lock"
  notes: >
    August / Yale Access smart locks (August Smart Lock, Pro, Wi-Fi Smart Lock,
    Yale Assure with a Yale Access module). There is no official local API — the
    vendor posture is closed — but direct BLE lock/unlock works once a client
    holds the lock's OFFLINE KEY and key slot (index). Those must be pulled from
    an August/Yale account (a cloud login), after which day-to-day unlock is
    fully local. yalexs-ble is the reference local implementation (Home
    Assistant's "Yale Access Bluetooth").

    GATT: primary service 0000fe24-0000-1000-8000-00805f9b34fb; write
    bd4ac611-0b45-11e3-8ffd-0800200c9a66, read bd4ac612-..., secure-write
    bd4ac613-..., secure-read bd4ac614-.... Yale company id 0x01D1 (465).

    FRAMING: every GATT command and response is 18 bytes. Normal-session
    operation requests begin 0xEE, carry the opcode at byte[1], and use a
    one-byte additive checksum at byte[3] chosen so all 18 bytes sum to zero
    mod 256. Command opcodes: 0x02 GETSTATUS, 0x03 WRITESETTING, 0x04
    READSETTING, 0x0A UNLOCK, 0x0B LOCK, 0x2D GETLOG. GETLOG pops the oldest
    activity record; it is not a passive read. The advertisement's HAP-derived
    0x06/0x11 markers are not the normal GATT operation-frame leader.

    CRYPTO/AUTH: the secure-channel handshake first uses the offline key and
    keyIndex (slot), exchanges two 8-byte random halves, and combines them into
    a 16-byte session key. The two handshake exchanges use AES-ECB. Later
    normal-session operation payloads use that session key with independent,
    persistent client-to-lock and lock-to-client CBC chains. Each chain starts
    with a 16-byte all-zero IV only when the key is installed, continues across
    consecutive frames, and resets on reconnect. If the key or slot is wrong
    the lock rejects the exchange. Motor result is read at response byte[15]
    (0x00 success; 0x1E-0x23 jam/mechanical failure).

  openness:
    status: "hostile"
    reverse_engineered: true
    source_code: "https://github.com/Yale-Libs/yalexs-ble"
    upstream_docs:
      - url: "https://www.home-assistant.io/integrations/august/"
        title: "Home Assistant — August / Yale integration"
        covers: "The requirement that the account holds the offline keys, and how to sync them from the cloud."
    notes: >
      No published local protocol; local control depends on an offline key the
      vendor cloud holds. The BLE stack was reverse-engineered and is mature
      (in production in Home Assistant). The CBC design, which starts each
      session with a zero IV and then chains frames, has drawn security
      scrutiny historically; no fresh advisory URL was verified for this spec,
      so none is asserted here.

  identification:
    service_uuids:
      - "0000fe24-0000-1000-8000-00805f9b34fb"
    manufacturer_data:
      company_id: 465
      additional_company_ids: [302]
      company_id_hex: "0x01D1"
      description: "Yale (0x01D1) or ASSA ABLOY (0x012E). Locks advertise the 0xFE24 service."

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          service_uuids:
            - "0000fe24-0000-1000-8000-00805f9b34fb"
          manufacturer_data:
            company_id: 465
            additional_company_ids: [302]
            description: "Yale company id 0x01D1 or ASSA ABLOY 0x012E; primary service 0xFE24."
        notes: >
          Match the 0xFE24 service and either Yale company id 0x01D1 or ASSA
          ABLOY 0x012E. The lock is then driven over BLE once the offline key
          and slot are supplied.
    identity:
      stable_keys: ["address"]
      display: "local_name"
    static_ip_required: false

  setup:
    required: true
    confidence: "medium"
    notes: >
      Enroll the lock in the August/Yale app, then log the account into a client
      that can sync the OFFLINE KEY + key slot from the cloud (this is what Home
      Assistant's august/yalexs integration does; a fresh owner account may be
      needed to force the keys to synchronize). Hand those to a local BLE client
      for offline unlock thereafter.
    methods:
      - type: "cloud_account"
        verified: false
        description: >
          Obtain the lock's offline key + slot from an August/Yale account (a
          one-time cloud step), then run the BLE secure handshake (0x01/0x03) and
          send LOCK (0x0B) / UNLOCK (0x0A) as AES-CBC-encrypted frames.
        cloud:
          local_alternative: >
            Yes for control — once the offline key + slot are synced from the
            cloud, lock/unlock is entirely local over BLE. The offline key itself
            can only be obtained from an August/Yale account; there is no
            documented account-free way to get it.
        steps:
          - action: "Enroll the lock in the August/Yale app and sync the account so it holds the offline keys."
            actor: "user"
          - action: "Extract the offline key + key slot via the account (e.g. the yalexs integration)."
            actor: "client"
          - action: "Run the BLE secure handshake, then send UNLOCK (0x0A) / LOCK (0x0B) as AES-CBC frames."
            actor: "client"
    factory_reset:
      applicable: true
      confidence: medium
      effect: >
        Deletes every user code including the Master code, clears enrolled
        clients and their offline keys, and returns all programming to
        factory defaults. On the Assure models, creating a new Master code is
        the only thing the lock will accept afterwards and must be done before
        anything else.
      description: >
        Read the procedure for the specific model before starting: all three
        families below need the batteries out, and two of them need the
        interior escutcheon off the door to reach a button that is not
        externally accessible. That is deliberate on the vendor's part — a
        reset that could be done from outside would be a way past the lock —
        and it means this is not something to attempt on a door someone needs
        to use in the next ten minutes.

        A lock previously enrolled in a Z-Wave network should be excluded from
        that network as well; a reset clears the lock's side but not the
        controller's.
      procedures:
        - name: "Assure Lock 2 Key Free Deadbolt: reset tool held for one minute"
          glyph: "generic/pinhole-reset.svg"
          verified: false
          basis: "Yale's installation guide for the Assure Lock 2 key-free deadbolt."
          applies_to: ["Yale Assure Lock 2 (key-free deadbolt)"]
          hold_seconds: 60
          power_state: "on"
          steps:
            - action: "Remove the battery cover and take out one battery."
              actor: "user"
            - action: "Press the reset button for one full minute with the reset tool supplied in the hardware box."
              actor: "user"
            - action: "Replace the battery and the cover."
              actor: "user"
        - name: "Assure Lock (Andersen): reset button held across a battery insertion"
          glyph: "generic/hold-button.svg"
          verified: false
          basis: "Yale's installation guide for the Assure Lock for Andersen doors."
          applies_to: ["Yale Assure Lock (Andersen)"]
          power_state: "off"
          steps:
            - action: "Remove the battery cover and all batteries."
              actor: "user"
            - action: "Remove the interior lock body to reach the reset button, which sits above the PCB cable connectors."
              actor: "user"
            - action: "Re-insert three batteries and hold the reset button for three seconds."
              actor: "user"
            - action: "Still holding, insert the fourth battery and hold for a further three seconds, then release."
              actor: "user"
            - action: "Re-install the interior lock on the door."
              actor: "user"
              expect: "The lock accepts only Master PIN code creation until a new Master code is set."
        - name: "Assure Lock SL: reset button held while the batteries go back in"
          glyph: "generic/hold-button.svg"
          verified: false
          basis: "Yale's Assure Lock SL manual."
          applies_to: ["Yale Assure Lock SL"]
          hold_seconds: 3
          power_state: "off"
          steps:
            - action: "Remove the battery cover and all batteries."
              actor: "user"
            - action: "Remove the interior side of the lock to reach the reset button, which sits beside the cable adapter."
              actor: "user"
            - action: "Press and hold the reset button for at least three seconds while reinstalling the batteries, then release."
              actor: "user"
            - action: "Replace the battery cover."
              actor: "user"
              expect: "The lock accepts only Master Entry code creation until a new Master code is set."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: "No network membership on the lock; a client with the offline key re-connects independently."
    credentials:
      wifi_passphrase_protection: not_applicable
      stored_on_device:
        - "Offline key material + key slots (enrolled devices)"
      issued_to_client:
        - "The offline key + slot (synced from the August/Yale cloud account)"
      notes: >
        The offline key is the crown jewel: it starts the AES-ECB setup that
        derives the session key used by later AES-CBC operations, and it is held
        by the vendor cloud, so obtaining it requires an account. The Wi-Fi
        variants add a separate radio/bridge; the lock core here is BLE.

  pairing:
    required: true
    confidence: "medium"
    # The lock does not bond. It runs its own secure handshake against an
    # offline key that only the vendor account can issue.
    security_mode: "app_layer"
    bonding: "none"
    pin:
      source: "vendor_app"
      notes: >
        The lock's OFFLINE KEY and key slot index, synchronised to a client
        that has logged into an August/Yale account. Per-unit key material,
        so no value appears here. Once held, unlocking is fully local and the
        account is not consulted again — which is what makes this lock
        survivable if the vendor service does not.
    exclusivity:
      single_connection: true
      single_bond: false
      recovery: >
        Close the Yale Access app before connecting; it holds the lock while
        it is in the foreground. Do not drive the same lock from HomeKit and
        from a yalexs-ble client on one host: Home Assistant's docs say the
        two contend for the lock and both fail.
    enter_pairing_mode:
      required: false
      notes: >
        There is no pairing-mode button in this flow. Authorisation is issued
        by the vendor account rather than by possession of the lock, which is
        the opposite of the Nuki model and worth knowing before someone goes
        looking for a button to hold.
    unpair:
      supported: true
      requires_factory_reset: false
      clears: "Access through the revoked or rotated key; the lock's settings stay."
      notes: >
        Revocation is account-side, and it happens to local clients
        whether or not anyone intends it. Owners remove users and devices in
        the vendor app (how and when that reaches the lock's key slots is
        not documented in the sources used here), and the keys themselves
        rotate: Home Assistant's
        documentation warns that a phone that operates the lock often can
        rotate the key, after which a client holding the old offline key
        fails the handshake until it re-syncs from the account. Treat an
        authentication failure as a stale key, not a fault. A factory reset
        clears every slot (see `setup.factory_reset`).
    notes: >
      The gate is an offline key and slot number, not a Bluetooth bond.
      The lock runs a secure handshake keyed by that offline key; a client
      gets the key either from the August/Yale cloud with an account that
      has owner-level access (what the Home Assistant integrations do) or
      by extracting it from a phone where the vendor app has stored it.
      Once held, lock and unlock are entirely local, which is what makes
      this lock survivable if the vendor service is not — with the caveat
      that the key can rotate underneath a client, and only the account
      can issue the new one. Medium confidence: Home Assistant's Yale
      Access Bluetooth integration and yalexs-ble implement this in
      production; this project has not driven a lock.
services:
  - uuid: "0000fe24-0000-1000-8000-00805f9b34fb"
    name: "August / Yale lock service (0xFE24)"
    notes: >
      Two channels share this service. The normal operation channel
      (bd4ac611/bd4ac612) carries 18-byte command and response frames after the
      handshake, encrypted with AES-CBC under the derived session key. The
      secure channel (bd4ac613/bd4ac614) is for setup and shutdown, initially
      encrypted with AES-ECB under the offline key and then under the derived
      session key. Operation results arrive at response byte[15]. The generic
      command/entity model has no stateful CBC transform, so this service
      deliberately exposes no executable characteristic commands or entities.
    characteristics:
      - uuid: "bd4ac611-0b45-11e3-8ffd-0800200c9a66"
        name: "Normal operation write"
        properties: ["write"]
        notes: >
          Stateful AES-CBC ciphertext only. Do not write the application-layer
          plaintext frames from protocol_details directly: bytes 0-15 must be
          encrypted on the continuing client-to-lock chain, while bytes 16-17
          remain clear. A fresh zero IV is used only when the session key is
          installed, not independently for each command.
      - uuid: "bd4ac612-0b45-11e3-8ffd-0800200c9a66"
        name: "Normal operation response"
        properties: ["read", "notify"]
        notes: >
          Normal-session responses and unsolicited state on an independent,
          persistent lock-to-client CBC chain. Motor result is byte[15] of a
          decrypted 0xBB lock/unlock op-response.
      - uuid: "bd4ac613-0b45-11e3-8ffd-0800200c9a66"
        name: "Secure handshake write"
        properties: ["write"]
        notes: >
          Setup and shutdown only, not lock/status operations. AES-ECB. Setup
          starts with the offline key and keyIndex, then switches to the
          derived 16-byte session key. The exact 32-bit checksum is in
          protocol_details.session_crypto.secure_handshake; it is not a bytewise checksum.
      - uuid: "bd4ac614-0b45-11e3-8ffd-0800200c9a66"
        name: "Secure handshake response"
        properties: ["read", "notify"]
        notes: "AES-ECB setup and shutdown responses; not the normal motor-result channel."

protocol_details:
  consumer_limitations:
    executable_commands: false
    entity_bindings: false
    reason: >
      The schema's characteristic value/template model and the generic mobile
      client have no transform for a session key, persistent independent CBC
      chains, or reconnect reset. Exposing the application frames below as raw
      commands would write plaintext and fail or desynchronise the session.
      They are documentation for a session-aware implementation, not generic
      executable commands. Do not add entity bindings until that transform and
      its state lifecycle are supported by the consumer.

  normal_operation:
    write_characteristic: "bd4ac611-0b45-11e3-8ffd-0800200c9a66"
    response_characteristic: "bd4ac612-0b45-11e3-8ffd-0800200c9a66"
    frame_length: 18
    application_frame:
      leader: 0xEE
      opcode_offset: 1
      subtype_offset: 4
      checksum:
        offset: 3
        initial_value: 0
        formula: "(-sum(frame[0:18])) & 0xFF"
      trailer: "02 00"
      note: >
        These are application-layer plaintext inputs to the session wrapper,
        not on-wire GATT values. Compute the simple checksum with byte 3 zero.
    requests:
      unlock:
        description: "Unlock (opcode 0x0A), operation subtype 0."
        application_frame_hex: "EE 0A 00 06 00 00 00 00 00 00 00 00 00 00 00 00 02 00"
      lock:
        description: "Lock (opcode 0x0B), operation subtype 0."
        application_frame_hex: "EE 0B 00 05 00 00 00 00 00 00 00 00 00 00 00 00 02 00"
      get_lock_status:
        description: "Read lock state (opcode 0x02, subtype 0x02)."
        application_frame_hex: "EE 02 00 0C 02 00 00 00 00 00 00 00 00 00 00 00 02 00"
      get_door_status:
        description: "Read door state (opcode 0x02, subtype 0x2E)."
        application_frame_hex: "EE 02 00 E0 2E 00 00 00 00 00 00 00 00 00 00 00 02 00"
      get_door_and_lock_status:
        description: "Read combined door and lock state (opcode 0x02, subtype 0x2F)."
        application_frame_hex: "EE 02 00 DF 2F 00 00 00 00 00 00 00 00 00 00 00 02 00"
      get_battery_status:
        description: "Read battery voltage (opcode 0x02, subtype 0x0F)."
        application_frame_hex: "EE 02 00 FF 0F 00 00 00 00 00 00 00 00 00 00 00 02 00"
      get_unread_activity_count:
        description: >
          Read unread activity count (opcode 0x02, subtype 0x09). Unlike
          GETLOG (0x2D), this does not consume activity records.
        application_frame_hex: "EE 02 00 05 09 00 00 00 00 00 00 00 00 00 00 00 02 00"

  session_crypto:
    normal_operation:
      algorithm: "AES-128-CBC"
      key: "16-byte session key derived by the secure handshake"
      encrypted_range: "bytes 0-15 of every 18-byte frame"
      clear_trailer: "bytes 16-17 remain unencrypted"
      key_installation: >
        On session-key installation, create independent client-to-lock and
        lock-to-client CBC contexts. Each direction starts with a 16-byte
        all-zero IV exactly once. Do not reset the IV for each command or
        response, and do not share one context between directions.
      chaining: >
        Persist each direction's CBC state across every consecutive command or
        response on that connection. The previous ciphertext block is the next
        block's chaining input. Two consecutive frames therefore do not use
        independent zero-IV encryptions.
      reconnect: >
        A reconnect tears down both contexts. Re-run session-key installation
        and restart both chains from zero IV; never carry CBC state across
        connections. A partial or poisoned block likewise requires a reconnect
        and fresh context, not a zero-IV rewrite of just the next frame.
    secure_handshake:
      algorithm: "AES-128-ECB"
      initial_key: "offline key plus keyIndex (slot), then the derived session key"
      frame_length: 18
      opcode_offset: 0
      trailer: "0F at byte 16 and keyIndex at byte 17"
      checksum:
        offset: 12
        length: 4
        endianness: "little"
        initial_value: 0
        formula: >
          (-(LE32(frame[0:4]) + LE32(frame[4:8]) + LE(frame[8:18]))) mod
          2^32. The first two terms are 32-bit little-endian words; the third
          is the entire 80-bit little-endian integer from bytes 8-17. Zero
          bytes 12-15 before computing, then write the resulting uint32 LE at
          bytes 12-15. This is not a negated sum of the frame's bytes.
        known_answer:
          input_hex: "01 00 00 00 01 02 03 04 05 06 07 08 00 00 00 00 0F 01"
          val1: "0x00000001"
          val2: "0x04030201"
          val3: "0x010F0000000008070605"
          sum: "0x010F000000000C0A0807"
          checksum: "0xF3F5F7F9"
          output_hex: "01 00 00 00 01 02 03 04 05 06 07 08 F9 F7 F5 F3 0F 01"
          origin: "Synthetic known-answer vector computed with the reference formula, not a capture."

  synthetic_cbc_vectors:
    description: >
      Deterministic on-wire examples derived with OpenSSL AES-128-CBC and the
      invented session key 00 01 02 ... 0F. They are full 18-byte GATT values,
      including each frame's clear two-byte trailer, and demonstrate two
      consecutive frames on independent TX and RX chains. They are not captures
      or real key data.
    key_hex: "000102030405060708090A0B0C0D0E0F"
    initial_iv_hex: "00000000000000000000000000000000"
    client_to_device:
      - name: "lock, first frame after key installation"
        plaintext_hex: "EE 0B 00 05 00 00 00 00 00 00 00 00 00 00 00 00 02 00"
        ciphertext_hex: "EE F4 51 97 34 9D 33 E3 D3 AB 6C B3 EE B3 E4 75 02 00"
      - name: "unlock, second frame on the same TX chain"
        plaintext_hex: "EE 0A 00 06 00 00 00 00 00 00 00 00 00 00 00 00 02 00"
        ciphertext_hex: "DA 22 BD 24 64 2D D5 33 F9 C9 B5 C3 43 77 48 3C 02 00"
    device_to_client:
      - name: "read acknowledgement, first frame on the independent RX chain"
        plaintext_hex: "AA 04 00 28 28 00 00 00 00 00 00 00 00 00 00 00 02 00"
        ciphertext_hex: "92 BC 6D 65 B8 40 4B C3 35 DE BA 2C 97 D0 4D BC 02 00"
      - name: "read answer, second frame on the same RX chain"
        plaintext_hex: "BB 04 00 FB 28 00 00 00 08 07 08 07 00 00 00 00 00 00"
        ciphertext_hex: "23 45 FB F1 36 34 D2 4A C0 D9 68 3A 61 1C 88 5D 00 00"

