# Belkin Wemo Smart Plug Family — Device Specification
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# Covers the Wemo Mini Smart Plug (F7C063), Wemo WiFi Smart Plug V2 (WSP080),
# and Wemo Smart Plug. All share the same UPnP/SOAP control protocol via SSDP
# discovery on the LAN. Local control requires no cloud dependency, so these
# devices survive the announced Wemo cloud shutdown (2026-01-31).
#
# Grounded in: pywemo reference implementation (github.com/pywemo/pywemo),
# Home Assistant Wemo integration, and static analysis of
# com.belkin.wemoandroid APK (widget mock data, smali, assets).
#
# ─────────────────────────────────────────────────────────────────────────
# SCHEMA GAPS — NOTED FOR FUTURE SCHEMA EXTENSION (not blocking spec creation)
#   (a) No `ssdp` identification block. SSDP multicast target
#       239.255.255.250:1900, M-SEARCH ST URNs, and UPnP deviceType have no
#       schema field. Documented in device.notes and /setup.xml endpoint.
#   (b) `identification.default_port` is a single integer, but Wemo ports
#       drift across 49152-49159. We record 49153 and document the full probe
#       list in notes. A `port_probe_list` array would fit better.
#   (c) `http_endpoints` has no `headers` field. SOAP dispatch REQUIRES a
#       SOAPACTION header per endpoint. Documented in endpoint descriptions.
# ─────────────────────────────────────────────────────────────────────────
#
# Device type family (from APK widget mock analysis, 16+ distinct types):
#   Plug family:        socket:1, controllee:1
#   Energy monitoring:  insight:1
#   Lighting:           dimmer:1, lightswitch:1, bridge:1
#   Sensors/I/O:        Maker:1, motion:1, outdoor:1
#   Appliances:         coffeemaker:1, crockpot:1, heater:1, purifier:1,
#                       humidifier:1, humidifierb:1
#
# This spec covers Phase 1 (plugs — on/off control). Phase 2+ specs
# (wemo-insight.yaml, wemo-lighting.yaml) will follow the same structure
# with additional SOAP services.

device:
  name: "Belkin Wemo Smart Plug"
  manufacturer: "Belkin"
  manufacturer_status: "shutdown"
  protocol: "wifi"
  notes: >
    Belkin Wemo Smart Plug family — Mini Smart Plug (F7C063), WiFi Smart
    Plug V2 (WSP080), and Smart Plug. Controlled locally over UPnP: SSDP
    discovery on the LAN followed by SOAP 1.1 action calls over HTTP. No
    cloud dependency for on/off or state, so the device keeps working after
    the announced Wemo cloud shutdown (2026-01-31).

    DISCOVERY (SSDP/UPnP — NOT mDNS): send HTTP-over-UDP M-SEARCH to
    239.255.255.250:1900 with MAN "ssdp:discover", MX 1, and ST
    `urn:Belkin:service:basicevent:1` (alternates: `ssdp:all`,
    `urn:Belkin:device:controllee:1`, `urn:Belkin:device:socket:1`).
    The unicast reply's LOCATION header gives
    `http://<ip>:<port>/setup.xml`; fetch that to get the UPnP device
    description (deviceType, friendlyName, UDN, serialNumber, macAddress,
    modelName, serviceList with controlURLs and eventSubURLs).

    PORT INSTABILITY: the HTTP port is not fixed — it drifts across
    49152-49159. Probe 49153 first, then 49152, 49154, 49151,
    49155-49159. Re-probe after the device reconnects or changes IP.

    CONTROL: SOAP 1.1 POST over HTTP. Required headers: Content-Type
    `text/xml; charset="utf-8"` and SOAPACTION `"<serviceType>#<Action>"`.
    The SOAP body carries the matching service-type XML namespace.
    basicevent service: SetBinaryState (BinaryState=1/0), GetBinaryState.
    Shares `/upnp/control/basicevent1` path — disambiguated by SOAPACTION.

    ASYNC EVENTS: UPnP eventing — SUBSCRIBE to each service's eventSubURL
    (e.g. /upnp/event/basicevent1) for push-based state changes.

    SETUP/PROVISIONING: factory-reset device broadcasts WiFi AP with SSID
    prefix `WeMo.Setup.`; app joins and provisions home WiFi via SOAP
    (GetApList / ConnectHomeNetwork on the wifi service). Documented for
    reference; local-control MVP assumes the device is already on the LAN.

    CLOUD ENDPOINTS (reference only — not used for local control):
    api.xwemo.com:8443, appapis.xwemo.com:8443, Firebase
    `productionwemoandroidpn.firebaseio.com`, AWS IoT. These are the
    services affected by the 2026-01-31 shutdown.

    ── SCHEMA GAPS ──
    (a) No SSDP identification: no field for the SSDP multicast target
    239.255.255.250:1900, the M-SEARCH ST URNs, or the UPnP deviceType.
    (b) default_port is a single integer; ports drift 49152-49159.
    (c) http_endpoints has no headers field; SOAPACTION documented here.

    DEVICE TYPE FAMILY (from APK widget mock analysis):
    16+ distinct device types share this protocol. Device types and their
    URNs are catalogued in targets/wemo-devices.md.

  identification:
    # mdns_service_type deliberately OMITTED — Wemo is SSDP/UPnP-only,
    # not mDNS. There is no mDNS service type for Wemo devices.
    ssid_prefix: "WeMo.Setup."
    default_port: 49153   # Port drifts 49152-49159; probe 49153 first.

# UPnP/SOAP control surface modeled as HTTP endpoints.
http_endpoints:
  - method: "GET"
    path: "/setup.xml"
    name: "UPnP Device Description"
    description: >
      UPnP device description document, fetched from the LOCATION header
      returned by SSDP discovery (http://<ip>:<port>/setup.xml).
      No SOAPACTION header required. Identifies the device and enumerates
      its services with controlURLs and eventSubURLs.

      DeviceType URNs for the plug family:
      - `urn:Belkin:device:controllee:1` (Mini F7C063)
      - `urn:Belkin:device:socket:1` (V2 WSP080, Smart Plug)

      Other Wemo deviceType URNs: :insight:1, :dimmer:1, :lightswitch:1,
      :bridge:1, :Maker:1, :motion:1, :outdoor:1, :coffeemaker:1,
      :crockpot:1, :heater:1, :purifier:1, :humidifier:1, :humidifierb:1.
    response_body:
      content_type: "text/xml"
      fields:
        - name: "deviceType"
          type: "string"
          description: "UPnP device type URN, e.g. urn:Belkin:device:controllee:1."
        - name: "friendlyName"
          type: "string"
          description: "User-assigned device name."
        - name: "UDN"
          type: "string"
          description: "Unique Device Name, e.g. uuid:Socket-1_0-<serial>."
        - name: "serialNumber"
          type: "string"
          description: "Device serial number."
        - name: "macAddress"
          type: "string"
          description: "Device WiFi MAC address."
        - name: "modelName"
          type: "string"
          description: "Model name, e.g. Socket (Mini F7C063, WSP080)."
        - name: "modelNumber"
          type: "string"
          description: "Model number, e.g. F7C063 (Mini) or WSP080 (V2)."
        - name: "serviceList"
          type: "array"
          description: "UPnP services with controlURL and eventSubURL."

  - method: "POST"
    path: "/upnp/control/basicevent1"
    name: "SetBinaryState (switch on/off)"
    description: >
      SOAP 1.1 action on the basicevent service. REQUIRED headers
      (schema gap, documented here):

      SOAPACTION: "urn:Belkin:service:basicevent:1#SetBinaryState"
      Content-Type: text/xml; charset="utf-8"

      The SOAP body uses the `urn:Belkin:service:basicevent:1` namespace.
      Shares this path with GetBinaryState — disambiguated ONLY by
      SOAPACTION header + SOAP body. Async state updates available via
      UPnP SUBSCRIBE to /upnp/event/basicevent1.
    request_body:
      content_type: "text/xml"
      fields:
        - name: "BinaryState"
          type: "integer"
          description: "Target relay state: 1 = on, 0 = off."
          required: true
          enum: [0, 1]
    response_body:
      content_type: "text/xml"
      fields:
        - name: "BinaryState"
          type: "integer"
          description: "Resulting state echoed by the device; 'Error' on failure."

  - method: "POST"
    path: "/upnp/control/basicevent1"
    name: "GetBinaryState (read on/off)"
    description: >
      SOAP 1.1 action on the basicevent service. REQUIRED headers:
      SOAPACTION: "urn:Belkin:service:basicevent:1#GetBinaryState"
      Content-Type: text/xml; charset="utf-8"

      Returns the current relay state. Shares the path with SetBinaryState;
      the two differ ONLY by SOAPACTION header + body.
    response_body:
      content_type: "text/xml"
      fields:
        - name: "BinaryState"
          type: "integer"
          description: "Current relay state: 1 = on, 0 = off."

  - method: "POST"
    path: "/upnp/control/insight1"
    name: "GetInsightParams (power/energy — Insight models)"
    description: >
      SOAP 1.1 action on the insight service (controlURL
      /upnp/control/insight1, eventSubURL /upnp/event/insight1).
      Present ONLY on Wemo Insight models (NOT the basic Mini/Smart Plug).

      REQUIRED headers:
      SOAPACTION: "urn:Belkin:service:insight:1#GetInsightParams"
      Content-Type: text/xml; charset="utf-8"

      Returns a colon-delimited InsightParams string. On Insight-class
      devices, SetPowerThreshold and GetPowerThreshold are also available
      on this service.
    response_body:
      content_type: "text/xml"
      fields:
        - name: "InsightParams"
          type: "string"
          description: >
            Colon-delimited string containing: state, lastchange, onfor
            (seconds), ontoday (seconds), ontotal (seconds), timeperiod,
            averagepower, instantpower (mW), energytoday, energytotal
            (watt-hours), and additional fields. Insight models only.

  - method: "POST"
    path: "/upnp/control/metainfo1"
    name: "GetMetaInfo (device metadata)"
    description: >
      SOAP 1.1 action on the metainfo service. REQUIRED header:
      SOAPACTION: "urn:Belkin:service:metainfo:1#GetMetaInfo"

      Returns device metadata (model, firmware version, MAC address,
      uptime, etc.). Available on all Wemo devices.
    response_body:
      content_type: "text/xml"
      fields:
        - name: "MetaInfo"
          type: "string"
          description: "Pipe-delimited device metadata string."

  - method: "POST"
    path: "/upnp/control/deviceinf1"
    name: "GetDeviceInformation"
    description: >
      SOAP 1.1 action on the deviceinf service. REQUIRED header:
      SOAPACTION: "urn:Belkin:service:deviceinf:1#GetDeviceInformation"

      Returns basic device information (model, serial, etc.).
    response_body:
      content_type: "text/xml"
      fields:
        - name: "ModelName"
          type: "string"
          description: "Device model name."
        - name: "ModelNumber"
          type: "string"
          description: "Device model number."

  - method: "POST"
    path: "/upnp/control/timesync1"
    name: "TimeSync"
    description: >
      SOAP 1.1 action on the timesync service. REQUIRED header:
      SOAPACTION: "urn:Belkin:service:timesync:1#TimeSync"

      Sets the device's real-time clock. Requires UTC timestamp in body.
    request_body:
      content_type: "text/xml"
      fields:
        - name: "UTC"
          type: "string"
          description: "UTC timestamp for device clock sync."
    response_body:
      content_type: "text/xml"
      fields:
        - name: "TimeSync"
          type: "string"
          description: "Sync confirmation."

  - method: "POST"
    path: "/upnp/control/wifi1"
    name: "GetApList"
    description: >
      SOAP 1.1 action on the wifi service (provisioning only; requires
      device to be in setup/AP mode). REQUIRED header:
      SOAPACTION: "urn:Belkin:service:WiFiSetup:1#GetApList"

      Returns list of visible WiFi access points. Provisioning flow:
      join WeMo.Setup. AP → GetApList → ConnectHomeNetwork.
    response_body:
      content_type: "text/xml"
      fields:
        - name: "ApList"
          type: "string"
          description: "List of visible WiFi access points."

entities:
  - platform: "switch"
    name: "Smart Plug"
    device_class: "outlet"
    state_topic: "/upnp/control/basicevent1"
    state_mapping:
      value: "BinaryState"
    commands:
      turn_on: "SetBinaryState"
      turn_off: "SetBinaryState"
      get_state: "GetBinaryState"

  - platform: "sensor"
    name: "Power"
    device_class: "power"
    unit: "W"
    # Insight-only. Mini/Smart Plug (F7C063, WSP080) does NOT expose
    # power metering. This entity applies only to Wemo Insight devices
    # that implement /upnp/control/insight1.
    state_topic: "/upnp/control/insight1"
    state_mapping:
      value: "InsightParams.instantpower"

references:
  - "https://github.com/pywemo/pywemo"
  - "https://github.com/pywemo/pywemo/blob/main/pywemo/ssdp.py"
  - "https://github.com/pywemo/pywemo/tree/main/pywemo/ouimeaux_device"
  - "https://github.com/pywemo/pywemo/tree/main/pywemo/ouimeaux_device/api/xsd"
  - "https://github.com/pywemo/pywemo/blob/main/pywemo/ouimeaux_device/api/wifi_setup.py"
  - "https://www.home-assistant.io/integrations/wemo/"
  - "https://github.com/home-assistant/core/tree/dev/homeassistant/components/wemo"
  - "https://github.com/iancmcc/ouimeaux"
