device:
  name: "PicoBrew PicoStill (direct read-only telemetry)"
  manufacturer: "PicoBrew Inc."
  manufacturer_status: "shutdown"
  testing:
    status: untested
    notes: >
      Derived from chiefwigms/picobrew_pico 36acae3003845b72568ef5f7d6cf168acb6f9b69,
      principally its direct still poller and PicoStill routes. No appliance,
      heater, pump, distillation session, replacement server, or firmware
      endpoint was contacted. The parser is reported, not hardware-verified.
  protocol: "wifi"
  transport: "http"
  category: "appliance"
  type: "distillation-appliance-telemetry"
  integration: "identify_only"
  aliases: ["PicoStill"]
  openness:
    status: "undocumented"
    reverse_engineered: true
    source_code: "https://github.com/chiefwigms/picobrew_pico"
    license: "MIT"
    notes: >
      The direct endpoint is reconstructed from a community replacement
      server's polling client, not from a published PicoBrew API document.
  notes: >
    SCOPE: only the PicoStill's direct, read-only GET /data telemetry route is
    declared as an appliance-local request. It returns nine comma-separated
    fields inside #...#. All fields remain raw strings: units, scaling, and
    conversion rules are not established. No temperature or pressure unit is
    assigned and no unit-bearing entity is declared.

    Community replacement servers also implement PicoStill and other PicoBrew
    routes. Those routes run on the trusted replacement server and the
    appliance calls them; they are NOT endpoints on the PicoStill and are not
    appliance-local control. protocol_details.replacement_server_routes records
    this direction without making the routes executable.
  identification:
    default_port: 80
    notes: >
      No mDNS/SSDP identity or model-specific discovery response is published.
      Select the still by its known LAN address and confirm a well-formed /data
      response; do not infer support from another PicoBrew model's routes.
  discovery:
    none: "No automatic discovery protocol is documented for the direct PicoStill telemetry endpoint; obtain the appliance address from the router or trusted replacement-server registration."
  setup:
    required: false
    confidence: "medium"
    notes: >
      A networked PicoStill can be read directly by address; no client
      onboarding is implemented by the community poller. Initial Wi-Fi join and
      appliance-to-vendor/replacement-server binding are separate and are not
      reconstructed here. A replacement server is not required merely to issue
      GET /data.
    methods:
      - type: "none"
        name: "Read an already networked still"
        verified: false
        description: >
          Obtain the PicoStill's LAN address and issue read-only GET /data on
          port 80. If using a trusted replacement server for other features,
          keep its registration and DNS configuration on that server role and
          do not redirect direct telemetry requests to it.
        steps:
          - action: "Find the PicoStill's assigned address at the router or trusted replacement-server registration."
            actor: "user"
            expect: "The still's LAN address is known without scanning or actuating it."
          - action: "Issue GET http://<still-address>/data and parse exactly one #...# record."
            actor: "client"
            expect: "Nine raw string fields in the documented order; no state-changing request is sent."
    factory_reset:
      applicable: "unknown"
      confidence: low
      effect: >
        Not established for the direct telemetry surface. No reset procedure or
        erase scope is inferred from server-side session cleanup, firmware
        replacement, or a closed log.
      description: >
        Do not factory-reset an appliance to obtain telemetry or to end a
        distillation session. Physical safety and power isolation are separate.
    rejoin:
      in_place_supported: false
      requires_factory_reset: false
      notes: >
        The appliance's Wi-Fi rejoin procedure is not established by the
        reviewed source. Changing a replacement server's DNS or registration
        does not prove an in-place Wi-Fi rejoin. No factory reset is advised.
    credentials:
      wifi_passphrase_protection: "unknown"
      stored_on_device:
        - "Appliance network and service configuration, if present; exact provisioning is outside this spec"
      issued_to_client: []
      notes: >
        The community direct poller sends no HTTP credential. Initial Wi-Fi
        provisioning and original server authorization are not established. A
        UID or registration token used by other PicoBrew routes is an
        identifier, not evidence of cryptographic authentication.
  pairing:
    required: false
    confidence: "medium"
    security_mode: "none"
    bonding: "none"
    enter_pairing_mode:
      required: false
    unpair:
      supported: false
      notes: "There is no direct client bond to revoke."
    notes: >
      The replacement server's poller issues unauthenticated plain-HTTP GET
      /data with no pairing or token. Reachability on the LAN is the only gate
      shown by that client. Keep the appliance and monitoring client on a
      trusted network. Other server-side routes may have different behavior.
  safety_advisory:
    severity: "danger"
    summary: "Distillation involves heat and pressure; telemetry and HTTP responses are not an emergency stop."
    detail: >
      Read-only monitoring cannot establish that heating or pumping has ceased
      or that a fault is safe. Keep physical isolation and the appliance's own
      safety mechanisms available. Do not rely on picoChangeState, a closed
      session log, or any replacement-server response for emergency shutdown.

http_endpoints:
  - method: "GET"
    path: "/data"
    name: "PicoStill direct telemetry"
    description: >
      Read-only appliance-local route on the PicoStill itself. Response is a
      #...# record with exactly nine comma-separated raw fields in the order
      t1,t2,t3,t4,pres,ok,d1,d2,errmsg. No units or conversions are declared.
    response_body:
      fields:
        - {name: "t1", type: "string", description: "Reported coil-inlet-related reading; raw value with unknown unit/scaling."}
        - {name: "t2", type: "string", description: "Reported coil-outlet-related reading; raw value with unknown unit/scaling."}
        - {name: "t3", type: "string", description: "Reported pot-related reading; raw value with unknown unit/scaling."}
        - {name: "t4", type: "string", description: "Reported ambient-related reading; raw value with unknown unit/scaling."}
        - {name: "pres", type: "string", description: "Pressure-related raw value; unit/scaling unknown."}
        - {name: "ok", type: "string", description: "Opaque status value; vocabulary unknown, not coerced to boolean."}
        - {name: "d1", type: "string", description: "Unassigned raw value."}
        - {name: "d2", type: "string", description: "Unassigned raw value."}
        - {name: "errmsg", type: "string", description: "Opaque error/status text; may be empty and is not parsed for safety decisions."}
      example: "#01.20,02.30,03.40,04.50,05.60,1,07.80,08.90,OK#"

payload_formats:
  PicoStillData:
    description: >
      One direct /data record. Numeric-looking values stay strings because
      units, scale, precision, and valid ranges are unknown. No entity or
      conversion consumes this format.
    delimiter: ","
    fields:
      - {index: 0, name: "t1", description: "Raw reported coil-inlet-related value; unit unknown."}
      - {index: 1, name: "t2", description: "Raw reported coil-outlet-related value; unit unknown."}
      - {index: 2, name: "t3", description: "Raw reported pot-related value; unit unknown."}
      - {index: 3, name: "t4", description: "Raw reported ambient-related value; unit unknown."}
      - {index: 4, name: "pres", description: "Raw pressure-related value; unit unknown."}
      - {index: 5, name: "ok", description: "Opaque status string, not a proven boolean."}
      - {index: 6, name: "d1", description: "Unassigned raw string."}
      - {index: 7, name: "d2", description: "Unassigned raw string."}
      - {index: 8, name: "errmsg", description: "Opaque message string; no escaping or comma handling is documented."}
    parse_rules:
      - "Strip surrounding HTTP whitespace only. Require both the leading and trailing # delimiters, then remove exactly those two characters."
      - "Split the interior on every comma and require exactly nine fields. Do not silently accept missing or additional fields."
      - "Preserve every field as a string, including leading zeros, empty errmsg, ok, and numeric-looking values. Perform no numeric conversion, unit conversion, rounding, or safety inference."
      - "A comma inside errmsg has no documented escaping and makes the record invalid under the nine-field parser. Do not join fields to rescue it."
    example: "#01.20,02.30,03.40,04.50,05.60,1,07.80,08.90,OK#"

protocol_details:
  direct_appliance_telemetry:
    role: "read-only monitoring"
    direction: "Monitoring client -> PicoStill appliance, GET /data"
    server: "PicoStill appliance on port 80"
    case_sensitive: true
    methods: ["GET"]
    actuator: false
    record_encoding: "Parse the response as text independently of the HTTP Content-Type header; the actual MIME type is unestablished."
    verification: "reported"
  replacement_server_routes:
    role: "Appliance-to-trusted-replacement-server interoperability, not appliance-local HTTP control"
    direction: "PicoStill or another PicoBrew appliance -> trusted replacement server"
    server: "A user-operated picobrew_pico instance reached through scoped DNS/network configuration"
    executable: false
    declared_as_appliance_local_control: false
    case_sensitive: true
    routes:
      - {method: "GET", path: "/API/PicoStill/getFirmwareAddress", role: "Appliance asks replacement server for a firmware address; not a route on the still", safe_binding: false}
      - {method: "GET", path: "/firmware/picostill/<file>", role: "Appliance downloads a firmware file from replacement server; deliberately not invoked by this spec", safe_binding: false}
      - {method: "GET", path: "/API/pico/picoChangeState", role: "Pico S/C/Pro state route on replacement server; current handler returns blank CRLF and performs no action", safe_binding: false}
    trust_boundary: >
      Scope any picobrew.com/www.picobrew.com DNS override to the appliance and
      trusted LAN. Do not expose the replacement server's unauthenticated
      admin/restart/shutdown routes. UIDs, registration tokens, and recipe IDs
      are identifiers, not proof of secure authentication.
  no_emergency_stop:
    picoChangeState: "The reviewed Pico S/C/Pro replacement handler only returns CRLF and performs no action; state labels do not change that finding."
    session_closure: "Ending a Pico/Zymatic session or closing ZSession finalizes a server-side log, not proof that heater or pump activity stopped."
    requirement: "No HTTP route in this spec is an emergency-abort mechanism. Use physical power/isolation and the appliance's own safety controls for a fault."
  excluded_control_surfaces:
    reason: "Avoid unsafe heating, pumping, distillation, and firmware operations and do not misplace replacement-server routes on the appliance."
    omitted: ["heater control", "pump control", "session start/stop/abort", "firmware selection/upload/activation", "recipe execution"]
    top_level_commands: false
    unit_bearing_entities: false

local_access:
  status: "native"
  summary: >
    The direct /data endpoint offers read-only telemetry on the appliance's LAN
    address without vendor cloud access. A trusted replacement server can
    separately provide recipe/session/firmware services to an appliance, but
    those are appliance-to-server roles and are not direct local control.
  covers:
    - "Read-only GET /data on a networked PicoStill"
    - "Nine-field delimiter parsing with no unit or conversion claim"
  not_covered:
    - "Heating, pumping, distillation, recipe, or emergency-stop operations"
    - "Firmware selection, download, upload, or activation"
    - "Replacement-server APIs presented as appliance-local endpoints"
    - "Automatic discovery and initial Wi-Fi provisioning"

remaining_unknowns:
  - "Units, scaling, precision, valid ranges, sentinel values, and conversion rules for t1-t4 and pres; no Celsius, Fahrenheit, or pressure unit is established."
  - "Meaning and vocabulary of ok and errmsg, and assignments of d1/d2."
  - "Whether any firmware escapes commas in errmsg; the recovered nine-way parser does not support them."
  - "Supported PicoStill firmware versions and response/content-type variations on real appliances."
  - "Initial Wi-Fi provisioning, rejoin, factory reset, original service authorization, and automatic discovery."
  - "Actual heater/pump stop and fault behavior; replacement-server host tests and blank/no-op responses establish none."

evidence:
  documentation_review: >
    Read the maintained replacement server's direct still poller and model
    routes at commit 36acae3003845b72568ef5f7d6cf168acb6f9b69, plus the
    existing PicoBrew research notes. The poller issues GET /data, strips the
    response, removes the outer characters, and unpacks nine comma-separated
    values. Its mapping labels t1-t4/pres but supplies no defensible units for
    this spec. The Pico S/C/Pro picoChangeState handler was checked separately
    and is a no-op beyond a blank response.
  open_questions: >
    Source-based parsing is not an appliance capture. Unit semantics, firmware
    coverage, fault behavior, and every state-changing operation remain open.
  artifacts:
    - type: "public_implementation"
      artifact: "chiefwigms/picobrew_pico 36acae3003845b72568ef5f7d6cf168acb6f9b69"
      url: "https://github.com/chiefwigms/picobrew_pico/tree/36acae3003845b72568ef5f7d6cf168acb6f9b69"
      obtained_via: "Public source repository"
      description: "Direct telemetry poller, replacement-server route direction, and no-op picoChangeState evidence."

helpful_urls:
  - title: "picobrew_pico community replacement server"
    url: "https://github.com/chiefwigms/picobrew_pico"
    description: "Source of the direct /data poller and replacement-server role analysis; not an appliance-local control API reference."
  - title: "Direct PicoStill polling implementation"
    url: "https://github.com/chiefwigms/picobrew_pico/blob/36acae3003845b72568ef5f7d6cf168acb6f9b69/app/main/still_polling.py"
    description: "Open-source polling client from which the nine-field route and parser are derived."
  - title: "PicoStill replacement-server routes"
    url: "https://github.com/chiefwigms/picobrew_pico/blob/36acae3003845b72568ef5f7d6cf168acb6f9b69/app/main/routes_picostill_api.py"
    description: "Shows that firmware routes belong to the replacement server, not to the PicoStill's direct /data surface."
