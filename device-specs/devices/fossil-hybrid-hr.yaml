    models: "Fossil Q hybrids without a display (no key, unencrypted files) and first-generation Misfit-protocol Q watches share the service UUID but not this spec. The Gen 6 Wear OS smartwatches are unrelated."
    not_transcribed: "Alarm entry bytes, notification-filter and icon file layouts, watchface/widget/background image formats (RLE e-ink images), translations, weather/calendar/navigation JSON shapes, workout GPS exchange, music-info file layout, voice audio."

evidence:
  public_implementations: >
    Gadgetbridge commit 160beab417a034e7ee07a65152c70213b16f9e2b
    (app/src/main/java/nodomain/freeyourgadget/gadgetbridge/service/devices/qhybrid
    and devices/qhybrid, AGPL-3.0) supplied the GATT map, handshake, file
    opcodes, encrypted-file IV and counter rules, configuration items,
    notification and button payloads, hand and factory-reset frames, and
    firmware detection. Hybridge f4b07f9dd12e187ce7310ed34941d7a8e4424401
    (Sources/Protocol, Sources/Crypto/AESCipher.swift, MIT) independently
    matches the handshake (and adds the phone-random echo check), the CTR IV,
    per-packet upload encryption, the download step search, the file
    container and the result codes. It contributes the hardware-confirmed
    64-wrap of the sequence byte, the status check on put-open, and the
    stale-reply rule.
  documentation_review: >
    Gadgetbridge's Fossil device page (supported models, key requirement,
    market exit) and its Fossil Hybrid firmware page (hardware prefixes per
    model, firmware list, the key-invalidating DN1.0.2.21r image) were read on
    2026-11-22.
  open_questions:
    - "A scrubbed GATT dump of each hardware revision (DN1.0, IV0.0, VA0.0, WA0.0, Citizen) with characteristic properties and descriptors."
    - "Advertisement contents per model: whether 3dda0001 is always in the advertisement, and the Skagen and Citizen local names."
    - "Bytes 0, 2 and 3 of the handshake challenge frame and bytes 4-7 of the transfer-complete frame."
    - "Which handles the watch refuses before authentication (result 140) and which plain puts work without a session."
    - "How the download IV step relates to MTU or packet size, rather than being searched for."
    - "What the BLE factory reset clears and whether the watch can be re-provisioned afterwards without the vendor key service."
    - "Firmware image signing and the behaviour of an interrupted update."
  artifacts:
    - type: "source_review"
      artifact: "Freeyourgadget/Gadgetbridge 160beab417a034e7ee07a65152c70213b16f9e2b, qhybrid"
      url: "https://codeberg.org/Freeyourgadget/Gadgetbridge/src/commit/160beab417a034e7ee07a65152c70213b16f9e2b/app/src/main/java/nodomain/freeyourgadget/gadgetbridge/service/devices/qhybrid"
      description: "AGPL-3.0 Android client. Read for facts; no code copied."
    - type: "source_review"
      artifact: "jfoucher/Hybridge f4b07f9dd12e187ce7310ed34941d7a8e4424401"
      url: "https://github.com/jfoucher/Hybridge/tree/f4b07f9dd12e187ce7310ed34941d7a8e4424401"
      description: "MIT iOS client; independent cross-check, not built or run here."
    - type: "vendor_documentation"
      artifact: "Gadgetbridge Fossil device and firmware pages"
      url: "https://gadgetbridge.org/internals/specifics/fossil-hybrid/"
      description: "Community documentation of models, hardware prefixes and firmware; not vendor-authored."

remaining_unknowns:
  - "Every wire fact is client-derived (reported). Nothing was driven against a watch by this project."
  - "Characteristic properties (write vs write-without-response) per characteristic. The values above follow how the clients write, not a GATT dump."
  - "Whether the key service still issues keys, and for how long. No shutdown date is known."
  - "Unmapped bytes in the handshake challenge and transfer-complete frames."
  - "Authentication requirements per file handle for plain puts."
  - "The download IV step's derivation, and whether a client can predict it instead of searching for it."
  - "Factory-reset effect on the key, physical reset procedure, unbonding."
  - "Firmware signing, update-mode appearance and interrupted-update recovery."
  - "Citizen CZ Gen2 firmware prefix, name and any differences."
  - "Configuration item 0x14 length: Gadgetbridge declares 30 bytes but fills 24."
  - "Everything listed in protocol_details.omitted_surfaces."

