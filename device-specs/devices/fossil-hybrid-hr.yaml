# Fossil Hybrid HR / Gen 6 Hybrid (Skagen, Citizen CZ) — phone-direct BLE protocol
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# Sources: Gadgetbridge (AGPL-3.0) qhybrid support at Codeberg commit
# 160beab417a034e7ee07a65152c70213b16f9e2b, read for facts only, no code
# copied; Hybridge (MIT, iOS client) at f4b07f9dd12e187ce7310ed34941d7a8e4424401
# as an independent cross-check; Gadgetbridge's public Fossil device and
# firmware pages. No watch, vendor app, account, key or capture was used.
# Every key, random number, MAC and serial below is invented.

device:
  name: "Fossil Hybrid HR / Gen 6 Hybrid"
  manufacturer: "Fossil Group"
  manufacturer_status: "abandoned"
  openness:
    status: "undocumented"
    reverse_engineered: true
    source_code: "https://codeberg.org/Freeyourgadget/Gadgetbridge/src/commit/160beab417a034e7ee07a65152c70213b16f9e2b/app/src/main/java/nodomain/freeyourgadget/gadgetbridge/service/devices/qhybrid"
    license: "AGPL-3.0 (Gadgetbridge); MIT (Hybridge)"
    upstream_docs:
      - url: "https://gadgetbridge.org/gadgets/wearables/fossil/"
        title: "Gadgetbridge: Fossil device page"
        covers: "Supported models and features, the vendor-key requirement, Fossil's market exit."
      - url: "https://gadgetbridge.org/internals/specifics/fossil-hybrid/"
        title: "Gadgetbridge: Fossil Hybrid firmware notes"
        covers: "Hardware revision prefixes per model, tested firmware versions, the firmware that invalidates the key, watch apps."
    notes: >
      Fossil never published this protocol. Every wire fact here comes from two
      open-source clients that read like independent implementations of the
      same behaviour: Gadgetbridge (Android, AGPL-3.0; facts derived, no code
      copied) and Hybridge (iOS, MIT), which follows Gadgetbridge closely and
      adds stricter checks that its author reports were confirmed on a real
      Hybrid HR. Neither is vendor documentation.
  testing:
    status: "untested"
    notes: >
      Nobody on this project has driven a watch from this document. No
      hardware, vendor app, account, exported key, BLE capture or key service
      was used. The synthetic vectors in protocol_details.test_vectors are
      rebuilt by scripts/test_fossil_hybrid_hr_spec.py from the rules stated
      here (pure-stdlib AES-128, CRC-32 and CRC-32C) with an invented key. They
      check internal consistency, not that a watch accepts the frames.
  protocol: "ble"
  transport: "ble-gatt"
  category: "wearable"
  type: "hybrid-smartwatch"
  integration: "identify_only"
  aliases:
    - "Fossil Hybrid HR"
    - "Fossil Hybrid HR Collider"
    - "Fossil Hybrid HR Monroe"
    - "Fossil Gen 6 Hybrid"
    - "Fossil Gen 6 Hybrid Wellness Edition"
    - "Skagen Jorn Hybrid HR"
    - "Skagen Jorn Gen 6 Hybrid"
    - "Citizen CZ Smart Hybrid HR (Gen 2)"
  distributors:
    - name: "Fossil"
      role: "brand"
      notes: "Hybrid HR (42 mm and 38 mm) and Gen 6 Hybrid (44/45 mm)."
    - name: "Skagen"
      role: "brand"
      notes: "Fossil Group brand; Jorn Hybrid HR and Jorn Gen 6 Hybrid."
    - name: "Citizen"
      role: "brand"
      notes: "Citizen CZ Smart hybrid (Gen 2, JX1xxx 44 mm and JX2xxx 42.5 mm references); Gadgetbridge treats it as a Gen 6 Hybrid that pairs through Citizen's own app and account."
  companion_apps:
    - name: "Fossil Smartwatches"
      role: "primary"
      platform: "cross_platform"
      notes: "Vendor app for Fossil and Skagen hybrids. Its pairing provisions the per-watch key; package identifier not recorded here."
    - name: "Citizen CZ Smart / Citizen Connected"
      role: "variant"
      platform: "cross_platform"
      notes: "Vendor app for the Citizen CZ hybrid; Gadgetbridge's page says an account is registered there first."
    - name: "Gadgetbridge"
      role: "alternative"
      platform: "android"
      url: "https://gadgetbridge.org/gadgets/wearables/fossil/"
      notes: "Open-source replacement client (AGPL-3.0); the primary source for this spec."
    - name: "Hybridge"
      role: "alternative"
      platform: "ios"
      notes: "Open-source iOS client (MIT) used here as a cross-check."
  notes: >
    Fossil's e-ink hybrids: real hands over a round e-paper display, three
    buttons, and a phone-direct BLE protocol. Everything useful (time,
    configuration, activity history) needs an application-layer session
    authenticated with a 16-byte AES-128 key unique to each watch. The vendor
    app gets that key from the vendor cloud when it pairs the watch. Nothing
    in this spec can produce the key. The owner must already hold their own
    watch's key, exported from their own account (Gadgetbridge documents
    such a flow). With the key held, every operation below is local. No cloud
    is involved after that.

    `manufacturer_status: abandoned` rather than `shutdown`. Fossil Group is
    still trading and is restructuring, but it left the smartwatch business
    in 2024. Gadgetbridge quotes it as promising software updates "for the
    next few years". No key-service shutdown date has been announced, but the
    one thing a new owner cannot do without Fossil (obtain the key) depends on
    a service the company no longer has a product reason to run. That is
    the abandoned case, and it is why the owner should export the key now.

    Wire model. Requests and replies are byte frames on vendor characteristics
    3dda0002-3dda0006. Bulk data rides a FILE layer: each file has a 16-bit
    handle (major << 8 | minor). It is opened on 3dda0003 and streamed in
    sequence-numbered packets on 3dda0004. A completion frame carries a CRC-32
    of what was streamed. Some files are AES-128-CTR encrypted, with an IV
    built from two 8-byte random numbers that the key handshake exchanged. Both
    reviewed clients run a fresh handshake before every encrypted transfer.
    Configuration (time, units, vibration, step goal, battery readback) and
    activity history are encrypted. Notifications, button mapping, alarms,
    device info, watch apps and firmware travel as plain files.

    integration is identify_only. A consumer needs a dedicated handler for the
    handshake, the file state machine and CTR, so no generic renderer can drive
    any of it. That is why there are no entities, and why the
    characteristic-level commands are documented vocabulary rather than
    one-tap writes.
  variants:
    - model: "Hybrid HR 42mm"
      identification:
        local_name_prefix: "Hybrid HR"
      notes: "Firmware revision prefix DN1.0 (e.g. DN1.0.3.0r.v13). Collider and similar 42 mm models."
    - model: "Hybrid HR 38mm"
      identification:
        local_name_prefix: "Hybrid HR"
      notes: "Firmware revision prefix IV0.0. Monroe and similar 38 mm models."
    - model: "Gen 6 Hybrid"
      notes: "Firmware revision prefix VA0.0. Fossil 44/45 mm and Wellness Edition, and Skagen Jorn 42 mm Gen 6. Gadgetbridge recognises the exact advertised name 'Fossil Gen. 6 Hybrid'. Larger battery, faster SoC, SpO2."
    - model: "Skagen Jorn 38mm Gen 6"
      notes: "Firmware revision prefix WA0.0."
    - model: "Citizen CZ Gen2"
      notes: "Documented by Gadgetbridge as behaving like the Gen 6 Hybrid. Its firmware prefix and advertised name are not recorded in the reviewed sources."
  identification:
    service_uuids: ["3dda0001-957f-7d4a-34a6-74696673696d"]
    local_name_prefixes: ["Hybrid HR"]
    local_names: ["Fossil Gen. 6 Hybrid"]
    notes: >
      3dda0001-957f-7d4a-34a6-74696673696d is the scan filter Gadgetbridge
      uses, and it is SHARED with the older Fossil Q hybrids (no display, no
      key, unencrypted files). A UUID match is a candidate, not an identity.
      After connecting, read Firmware Revision String (2a26) and classify by
      its prefix, as both reviewed clients do: IV0, VA or WA, or a '1' as the
      third character (DN1.0...), means Hybrid HR / Gen 6 and this spec
      applies. Otherwise the seventh character '2' means a Q hybrid on the
      unencrypted file protocol, and '0'/'1' means the first-generation
      Misfit-era command protocol. Neither of those is covered here. A
      firmware string containing 'prod' is the factory placeholder image
      (DN1.0.2.3r.prod.v8), which Gadgetbridge skips because it only
      supports a firmware update. Hybridge's comments disagree on whether the
      service UUID is always advertised, and it adds a name fallback. Neither
      is a reason to write without the firmware check. No MAC prefix is
      claimed, and the examples use 00:00:5e:00:53:xx documentation
      addresses.
  discovery:
    methods:
      - type: "ble_scan"
        ble:
          service_uuids: ["3dda0001-957f-7d4a-34a6-74696673696d"]
        verification: "reported"
        notes: "Gadgetbridge's scan filter. Disambiguate with 2a26 before any write (see identification.notes)."
    identity:
      stable_keys: ["address"]
      display: "local_name"
  setup:
    required: true
    confidence: "medium"
    notes: >
      Medium: two public clients implement this and Gadgetbridge rates the
      watches highly supported, but this project ran nothing. The only
      provisioning a third-party client does is hold the owner's 16-byte key.
      There is no Wi-Fi. The vendor app must have paired the watch at least
      once, because that is when the vendor service provisions the key.
      Gadgetbridge recommends updating the watch with the vendor app before
      switching, because later firmware moved functions into separately
      installed watch apps that third parties cannot redistribute.
    methods:
      - type: "ble_direct"
        name: "Connect with the owner's exported key"
        role: "primary"
        verified: false
        description: "Fully local route for an owner who already holds their own watch's 16-byte key."
        ble:
          pairing_required: false
          service_uuid: "3dda0001-957f-7d4a-34a6-74696673696d"
        issues_credentials:
          watch_key:
            user_entered: true
            notes: "The owner's own watch key as 32 hex characters (16 bytes). Store it in a secret store. Never log, commit or share it."
        steps:
          - action: "Close or unpair the vendor app on any phone currently connected to the watch, then provide the watch's 16-byte key."
            actor: "user"
          - action: "Scan for 3dda0001-957f-7d4a-34a6-74696673696d, connect, enable notifications on 3dda0002-3dda0007, read 2a26 and confirm a Hybrid HR / Gen 6 firmware prefix."
            actor: "client"
            expect: "Firmware string such as DN1.0.3.0r.v13 or VA0.0.3.0r.v21; otherwise stop without writing."
          - action: "Request an ATT MTU of 512 and read the device-info file (handle 0x0b00) for the supported file versions."
            actor: "client"
          - action: "Run the key handshake in protocol_details.authentication on 3dda0005."
            actor: "client"
            expect: "Final frame 03 02 00 (result code 0). Any other code means the key is wrong or stale (re-pairing in the vendor app, or firmware DN1.0.2.21r, can replace it)."
          - action: "On firmware 2.22 and later, if the watch asks for on-watch confirmation, press a button on the watch within the 30-second window."
            actor: "user"
            expect: "Confirmation reply 03 06 00 01."
          - action: "Set the time with an encrypted configuration-file put (protocol_details.operations.set_time)."
            actor: "client"
      - type: "cloud_account"
        name: "Owner exports their own watch's key"
        role: "alternative"
        verified: false
        description: "One-time step for an owner who does not yet hold the key: export it from their own vendor account, then use the local route."
        cloud:
          provider: "Fossil (or Citizen) account service"
          account_required: true
          local_alternative: "The ble_direct method: once exported, the key works entirely locally."
          notes: "Availability not tested. Only the owner of the watch, using their own account, is in scope. This spec documents no account API."
        steps:
          - action: "Pair the watch with the vendor app on the owner's own account, then export that watch's key with an owner-controlled tool, for example the flow Gadgetbridge documents for its users."
            actor: "user"
            expect: "A 16-byte key (32 hex characters) held in the owner's secret store."
          - action: "Continue with the ble_direct method. No later session needs the cloud."
            actor: "client"
    factory_reset:
      applicable: true
      confidence: "low"
      effect: "Reported to return the watch to its unprovisioned state; whether the stored key is cleared or kept is not established."
      description: >
        Gadgetbridge's Hybrid HR support sends a factory-reset frame (inherited
        from the Q-hybrid command set) on 3dda0002. No reviewed source says what
        the watch clears, whether the key survives, or whether the watch can
        afterwards be re-provisioned without the vendor app and key service.
        On this product that is the difference between reset and permanent
        loss of third-party use, so treat it as one-way. No physical button
        procedure is documented in the sources reviewed.
      procedures:
        - name: "BLE factory-reset frame"
          verified: false
          basis: "Gadgetbridge qhybrid source (Hybrid HR adapter's factory-reset path) at commit 160beab4. Not run by this project."
          power_state: "on"
          steps:
            - action: "Connect, then write 02 f1 23 ff ff ff ff ff to 3dda0002 (the factory_reset command on that characteristic)."
              actor: "client"
            - action: "Before doing so, confirm that a key can still be obtained for this watch afterwards."
              actor: "user"
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: "A replacement phone or client needs the same key and a fresh handshake. There is no network to rejoin. Re-pairing with the vendor app can replace the key; re-export it afterwards."
      steps:
        - action: "Move the key to the new client's secret store; disconnect the old client first."
          actor: "user"
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device: ["The per-watch 16-byte AES-128 authentication key"]
      issued_to_client: ["16-byte AES-128 watch key, owner-exported (never derivable from the watch over BLE)"]
      notes: "The key authenticates the owner's session and keys every encrypted file. It is a live secret. Examples use the invented key 0f1e2d3c4b5a69788796a5b4c3d2e1f0."
  pairing:
    required: true
    confidence: "medium"
    security_mode: "app_layer"
    bonding: "optional"
    exclusivity:
      single_connection: "unknown"
      recovery: "Disconnect the vendor app (or another client) first. Authentication is repeated on every connection and before every encrypted transfer."
    enter_pairing_mode:
      required: false
      notes: "No pairing window. The key is supplied out of band, and on firmware 2.22+ the watch may ask for a button press to confirm a new phone."
    unpair:
      supported: "unknown"
      requires_factory_reset: false
      notes: "Delete the key from the client to withdraw it. No BLE command that removes a key or bond is documented."
    notes: >
      `required` means the application-layer key handshake, not an OS bond.
      Separately, Gadgetbridge asks the watch whether it is bonded to this phone
      (01 16 on 3dda0002, reply 03 16 01 when it is), and if not, asks it to
      bond (02 16). Hybridge calls this BLE bonding. bonding is therefore
      `optional`: the clients create a bond after confirmation, and the reviewed
      sources do not show the protocol requiring one.

initialization:
  - description: "Dedicated handler only: enable notifications on 3dda0002-3dda0007, read 2a26 and 2a24, request MTU 512, read the device-info file, then run protocol_details.authentication. Nothing encrypted is attempted until the handshake returns result code 0."
    when: "connect"
    notes: "No fixed write. The handshake carries a fresh 8-byte phone random number every time."

services:
  - uuid: "3dda0001-957f-7d4a-34a6-74696673696d"
    name: "Fossil hybrid vendor service"
    notes: >
      Shared by every Fossil hybrid generation. All six characteristics are
      notify sources; both clients subscribe to 3dda0002-3dda0007 at connect.
      The clients write with response on the request channels. File data is
      chunked to the ATT payload (MTU - 3, at most 512) minus one sequence
      byte. Hybridge reports that the watch does not handle ATT long writes,
      so packets must fit one write.
    characteristics:
      - uuid: "3dda0002-957f-7d4a-34a6-74696673696d"
        name: "Basic command channel"
        properties: ["write", "notify"]
        role: "command"
        notes: >
          Q-hybrid-era commands that the Hybrid HR still accepts: hand control,
          bonding query/request, factory reset. A first byte of 01 expects a
          reply, and 02 sends without one. Replies start with 03 followed by the
          request's second byte.
        commands:
          request_hand_control:
            description: "Take the hands away from the watch (priority 1, no move-complete or control-lost notifications). Required before move_hands."
            value: [0x02, 0x15, 0x01, 0x01, 0x00, 0x00]
            verification: "reported"
          move_hands:
            description: "Absolute move of hour and minute hand: 02 15 03, mode 02 (absolute; 01 = relative), hand count, then per hand [hand id 1=hour 2=minute 3=sub-dial, degrees u16 LE, direction 03 (absolute; relative uses 01 cw / 02 ccw), speed 01]."
            template: [0x02, 0x15, 0x03, 0x02, 0x02, 0x01, "{hour_degrees}", 0x03, 0x01, 0x02, "{minute_degrees}", 0x03, 0x01]
            parameters:
              hour_degrees:
                type: "uint16"
                endianness: "little"
                min: 0
                max: 359
                description: "Hour-hand position in degrees from 12 o'clock."
              minute_degrees:
                type: "uint16"
                endianness: "little"
                min: 0
                max: 359
                description: "Minute-hand position in degrees from 12 o'clock."
            verification: "reported"
          release_hand_control:
            description: "Return the hands to the watch with zero delay; the watch re-syncs them to the time."
            value: [0x02, 0x15, 0x02, 0x00, 0x00]
            verification: "reported"
          save_calibration:
            description: "Store the current hand positions as the 12:00 reference after a calibration session."
            value: [0x02, 0xF2, 0x0E]
            advanced: true
            advanced_reason: "Rewrites the hand zero reference. If the hands were not exactly at 12:00 when saved, the watch shows the wrong time until it is recalibrated. Run the calibration again with request_hand_control and move_hands to recover."
            verification: "reported"
          check_bonded:
            description: "Ask whether the watch is BLE-bonded to this phone. Reply 03 16 <01 = bonded>."
            value: [0x01, 0x16]
            verification: "reported"
          request_bond:
            description: "Ask the watch to bond with this phone; same 03 16 reply."
            value: [0x02, 0x16]
            verification: "reported"
          factory_reset:
            description: "Factory reset (Q-hybrid command frame, still issued by Gadgetbridge's Hybrid HR support)."
            value: [0x02, 0xF1, 0x23, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF]
            advanced: true
            advanced_reason: "Erases the watch's settings and pairing. Whether the per-watch key survives is not known, and re-provisioning may need the vendor app and its key service, which may stop working. Export and keep the key first, and expect that recovery may not be possible."
            verification: "reported"
        verification: "reported"

      - uuid: "3dda0003-957f-7d4a-34a6-74696673696d"
        name: "File transfer control"
        properties: ["write", "notify"]
        role: "command"
        notes: >
          File requests and their status replies. A reply's low nibble names
          the operation: 1 get-open, 2 lookup, 3 put-open, 4 close/verify,
          8 transfer complete (CRC-32 at offset 8), 9 timeout, 0A
          ignored, 0B delete. Bytes 1-2 are the handle little-endian
          (minor, major), and byte 3 is a result code
          (protocol_details.result_codes). Hybridge discards replies whose
          handle is not the open request's, because the watch sends late
          replies and timeouts from earlier transfers. A transfer that dies
          after put-open leaves a socket open on the watch until it is closed
          (04 <handle>) or a watchdog clears it.
        commands:
          file_get_open:
            description: "Open a file for download: 01, handle LE, offset u32 = 0, length u32 = ffffffff (whole file). Reply 81 <handle> <status> <size u32 LE>, then data on 3dda0004, then an 08-type frame with the CRC-32."
            template: [0x01, "{handle}", 0x00, 0x00, 0x00, 0x00, 0xFF, 0xFF, 0xFF, 0xFF]
            parameters:
              handle:
                type: "uint16"
                endianness: "little"
                description: "File handle (major << 8 | minor), e.g. 0x0b00 device info. An encrypted file needs a fresh handshake first."
            verification: "reported"
          file_lookup:
            description: "Resolve the current concrete handle of a file type: 02 ff <major>. The reply data (a small file on 3dda0004) starts with the concrete handle u16 LE. Reply size 0 means the file is empty."
            template: [0x02, 0xFF, "{major}"]
            parameters:
              major:
                type: "uint8"
                description: "File type, e.g. 0x01 activity, 0x08 configuration, 0x15 watch apps."
            verification: "reported"
          file_put_open:
            description: "Open an upload: 03, handle LE, offset u32 = 0, length u32, length u32 again. Wait for a 5-byte 03-type reply with status 0, stream the packets, wait for the 08-type CRC frame, then send file_close."
            template: [0x03, "{handle}", 0x00, 0x00, 0x00, 0x00, "{length}", "{length}"]
            parameters:
              handle:
                type: "uint16"
                endianness: "little"
                description: "Target file handle."
              length:
                type: "uint32"
                endianness: "little"
                description: "Bytes that will be streamed, i.e. the container length (plaintext length for an encrypted put)."
            verification: "reported"
          file_close:
            description: "Close an upload after a good CRC frame: 04, handle LE. Reply 04 <handle> <status> (4 bytes)."
            template: [0x04, "{handle}"]
            parameters:
              handle:
                type: "uint16"
                endianness: "little"
                description: "Handle of the open upload."
            verification: "reported"
          file_delete:
            description: "Delete a file, e.g. the activity file after a successful sync so the watch frees it, or an installed watch app (0x15 << 8 | its minor). Reply 8b <handle> <status>."
            template: [0x0B, "{handle}"]
            parameters:
              handle:
                type: "uint16"
                endianness: "little"
                description: "Concrete handle (from a lookup or the app list)."
            advanced: true
            advanced_reason: "Deletes data on the watch. Deleting the activity file before it is parsed and stored loses that history; deleting a built-in watch app removes the function until the owner re-installs the app, which only the vendor app or a saved copy can provide. Download and keep a copy first."
            verification: "reported"
        verification: "reported"

      - uuid: "3dda0004-957f-7d4a-34a6-74696673696d"
        name: "File transfer data"
        properties: ["write", "write_without_response", "notify"]
        role: "bulk"
        encryption:
          algorithm: "aes-128-ctr"
          key_derivation: "device-specific"
        notes: >
          Packets are [flag][payload]. Flag bits 0-5 are a sequence number that
          wraps at 64 (Hybridge, confirmed on hardware; Gadgetbridge only reads
          bit 7). Bit 7 marks the last packet of a download. Uploads carry the
          packet index in the flag byte, and the reviewed clients do not set
          bit 7 on uploads. Encryption applies only to files of the encrypted
          classes (configuration 0x08, activity 0x01). For those, the WHOLE
          packet, flag byte included, is AES-128-CTR under the watch key, with
          the session IV from protocol_details.encrypted_files.
        verification: "reported"

      - uuid: "3dda0005-957f-7d4a-34a6-74696673696d"
        name: "Authentication"
        properties: ["write", "notify"]
        role: "command"
        notes: "Key handshake (protocol_details.authentication) and on-watch confirmation. Replies start with 03 followed by the request's second byte."
        commands:
          check_needs_confirmation:
            description: "Firmware 2.22+: ask whether this phone must be confirmed on the watch. Reply 03 07 <00 = confirmation needed>."
            value: [0x01, 0x07]
            verification: "reported"
          confirm_on_watch:
            description: "Vibrate and wait for a button press. Bytes 2-5 (30 75 00 00) are u32 LE 30000, read as a timeout in ms (an inference that matches the 30 s client timer). The final 00 is unexplained. Reply 03 06 00 <01 = confirmed>. Gadgetbridge also uses it as find-my-watch on 2.22+."
            value: [0x02, 0x06, 0x30, 0x75, 0x00, 0x00, 0x00]
            locate: "both"
            verification: "reported"
          auth_start:
            description: "Handshake step 1: 02 01 01 followed by a fresh random 8-byte phone number."
            template: [0x02, 0x01, 0x01, "{phone_random}"]
            parameters:
              phone_random:
                type: "bytes"
                min_length: 8
                max_length: 8
                description: "Fresh cryptographically random 8 bytes per handshake; kept for the file IV."
            verification: "reported"
          auth_reply:
            description: "Handshake step 2: 02 02 01 followed by AES-128 (one block, ECB-equivalent) of phone_random || watch_random under the watch key."
            template: [0x02, 0x02, 0x01, "{response_block}"]
            parameters:
              response_block:
                type: "bytes"
                min_length: 16
                max_length: 16
                source: "credential:watch_key"
                description: "Computed from the challenge with the stored watch key (protocol_details.authentication); not the key itself."
            verification: "reported"
        verification: "reported"

      - uuid: "3dda0006-957f-7d4a-34a6-74696673696d"
        name: "Watch events and phone replies"
        properties: ["write", "notify"]
        role: "notify"
        notes: >
          Watch-initiated events, with the type in byte 1. 01: JSON request
          from a watch app (byte 2 event id, UTF-8 JSON from byte 3, e.g.
          {"req":{"id":N,"ringMyPhone":{"action":"on"}}} or a weather
          request). 02: heartbeat. 04: call or notification action, chosen by
          byte 7 (00 accept call, 01 reject, 02 dismiss the notification whose
          id is u32 LE at byte 3, 03 quick reply with call id at byte 3 and
          reply index at byte 8). 05: music/multi-press (byte 3: 02 play-pause,
          03 next, 04 previous, 05 volume up, 06 volume down). 08: button press
          (12 bytes; byte 2 is a press counter to de-duplicate, button number
          is byte 9 >> 4). JSON answers go back as JSON file puts (handle
          0x05xx), not on this characteristic.
        commands:
          music_state:
            description: "Tell the watch the phone's playback state: 02 05 <state> 00."
            template: [0x02, 0x05, "{state}", 0x00]
            parameters:
              state:
                type: "uint8"
                min: 0
                max: 1
                labels: ["playing", "paused"]
                description: "Playback state."
            verification: "reported"
          quick_reply_sent:
            description: "Confirm that a quick-reply SMS was sent for the call id the watch named."
            template: [0x02, 0x04, "{call_id}", 0x00, 0x00, 0x00, 0x03, 0x00]
            parameters:
              call_id:
                type: "uint8"
                description: "Byte 3 of the watch's 04/03 quick-reply event."
            verification: "reported"
        verification: "reported"

      - uuid: "3dda0007-957f-7d4a-34a6-74696673696d"
        name: "Auxiliary notify"
        properties: ["notify"]
        notes: "Subscribed by both clients. Its Hybrid HR use is not established; Q-era code wrote settings and uploads here."
        verification: "hypothesis"

  - uuid: "108b5094-4c03-e51c-555e-105d1a1155f0"
    name: "Voice-assistant service"
    notes: "Gadgetbridge subscribes to 010541ae-efe8-11c0-91c0-105d1a1155f0 (voice status, byte 0: 00 start, 01 stop), fef9589f-9c21-4d19-9fc0-105d1a1155f0 and 842d2791-0d20-4ce4-1ada-105d1a1155f0 (voice audio data) for its unfinished Alexa support. Which characteristic belongs to which service is inferred from GB registering this service, and the audio format is not documented."
    characteristics:
      - uuid: "010541ae-efe8-11c0-91c0-105d1a1155f0"
        name: "Voice status"
        properties: ["notify"]
        verification: "hypothesis"
      - uuid: "fef9589f-9c21-4d19-9fc0-105d1a1155f0"
        name: "Voice (unknown role)"
        properties: ["notify"]
        verification: "hypothesis"
      - uuid: "842d2791-0d20-4ce4-1ada-105d1a1155f0"
        name: "Voice data"
        properties: ["notify"]
        verification: "hypothesis"

  - uuid: "0000180a-0000-1000-8000-00805f9b34fb"
    name: "Device Information"
    characteristics:
      - uuid: "00002a26-0000-1000-8000-00805f9b34fb"
        name: "Firmware Revision String"
        properties: ["read"]
        notes: "UTF-8, e.g. DN1.0.3.0r.v13 or VA0.0.3.0r.v21. The two letters plus 'n.n' prefix are the hardware revision; Gadgetbridge takes the numbers after it (3.0) as the comparable version for the 2.19, 2.22 and 3.0 feature gates."
        verification: "reported"
      - uuid: "00002a24-0000-1000-8000-00805f9b34fb"
        name: "Model Number String"
        properties: ["read"]
        notes: "Gadgetbridge's model switch lists DN.1.0, IV.0.0, VA.0.0, WA.0.0 (and HW.0.0, HL.0.0 for Q-era models)."
        verification: "reported"

  - uuid: "0000180f-0000-1000-8000-00805f9b34fb"
    name: "Battery"
    characteristics:
      - uuid: "00002a19-0000-1000-8000-00805f9b34fb"
        name: "Battery Level"
        properties: ["read"]
        notes: "Read at connect. The encrypted configuration file also carries a battery item with voltage (operations.read_configuration)."
        format:
          - {offset: 0, length: 1, name: "battery", type: "uint8", device_class: "battery", notes: "Percent, 0-100."}
        verification: "reported"

  - uuid: "0000180d-0000-1000-8000-00805f9b34fb"
    name: "Heart Rate"
    notes: "Listed by Gadgetbridge as a supported service and parsed when notified; its notify subscription is commented out at connect, so when the watch streams 2a37 is not established."
    characteristics:
      - uuid: "00002a37-0000-1000-8000-00805f9b34fb"
        name: "Heart Rate Measurement"
        properties: ["notify"]
        verification: "hypothesis"

features:
  - type: "firmware_update"
    dfu:
      mechanisms: ["vendor_ble"]
      transport: "ble"
      services: ["3dda0001-957f-7d4a-34a6-74696673696d"]
      image:
        signing: "unknown"
        algorithm: "unknown"
        encrypted: false
        source: "user_supplied"
        format: "Vendor image streamed verbatim. Header (u32 LE): word 0 = 1, word 1 = size, words 2 and 3 each 0x00012000 or 0x00020000; bytes 20-21 are version major/minor."
        notes: "Images are not public and not inside the vendor app. Gadgetbridge's users capture them from the vendor app's download or BLE traffic. Choose the image for the watch's hardware prefix (DN1.0, IV0.0, VA0.0, WA0.0). Whether the bootloader checks a signature is unknown. The 'encrypted: false' value means the clients send it without the session cipher; whether the image is encrypted at rest is unknown."
      enter:
        how: "in_place"
        notes: "No bootloader command: the running firmware receives the image as a plain file put to OTA handle 0x00ff (file_put_open, packets, CRC frame, file_close). Hybridge reports that the watch applies it and reboots after a clean close, dropping the link."
      dfu_mode:
        notes: "Not established. No distinct update-mode advertisement is documented."
      recovery:
        interrupted: "unknown"
        notes: "Not documented. Hybridge warns that a failed flash can need recovery and allows 90 s of silence during the post-upload CRC check. The DN1.0.2.21r image is documented to invalidate the stored key, so a firmware update can also cost third-party access."
      verification: "reported"
      notes: "The upload must be file_put_open on handle 0x00ff with the image length, followed by the chunked stream. Consumers must treat the whole flow as advanced (file_put_open has no advanced flag of its own because the same command carries ordinary uploads)."

protocol_details:
  conventions:
    byte_order: "Little-endian for every multi-byte integer in frames and files, except the CTR counter (big-endian, see encrypted_files)."
    handles: "u16 = major << 8 | minor, sent little-endian (minor first). major 0x00 OTA (minor 0xff), 0x01 activity, 0x02 hardware log, 0x03 font, 0x04 music info, 0x05 UI control / JSON (minor = rolling index), 0x06 buttons/hand actions, 0x07 assets (minor 00 backgrounds, 01 notification icons, 02 translations, 03 reply images), 0x08 configuration, 0x09 notification play, 0x0a alarms, 0x0b device info, 0x0c notification filter, 0x0e watch parameters, 0x0f look-up table, 0x10 rate, 0x13 reply messages, 0x15 watch apps (0x15fe for an install)."
    reply_matching: "One request in flight. Gadgetbridge times a request out after five minutes; Hybridge uses per-request idle timeouts (30 s, 90 s for firmware)."
  authentication:
    algorithm: "AES-128 single block under the 16-byte watch key. The clients call CBC with an all-zero IV on one 16-byte block, which is identical to ECB."
    steps:
      - "Phone generates phone_random (8 random bytes) and writes 02 01 01 || phone_random to 3dda0005."
      - "Watch notifies on 3dda0005 a frame whose byte 1 is 01. Bytes 4-19 are C = AES-encrypt(key, watch_random || phone_random). The clients read nothing else from bytes 0, 2 or 3."
      - "Decrypt C. The first 8 bytes are watch_random. The last 8 MUST equal phone_random. Hybridge rejects a mismatch as a wrong key, while Gadgetbridge does not check."
      - "Write 02 02 01 || AES-encrypt(key, phone_random || watch_random) to 3dda0005 (the halves swapped)."
      - "Watch notifies a frame with byte 1 = 02 and byte 2 = result code. 0 is success. Keep phone_random and watch_random for this session's file IV."
    failure: "A non-zero result, a missing reply or a phone-random mismatch means a wrong or stale key. Do not retry in a loop; ask the owner for the current key."
  encrypted_files:
    cipher: "AES-128-CTR, key = watch key, no padding, 128-bit big-endian counter block."
    iv: "16 bytes: [0..1] 00 00; [2..7] phone_random[0..5] with byte 7 then incremented by 1 (mod 256); [8] 00; [9..15] watch_random[0..6]."
    upload: >
      Build the container (handle u16, 02 00, offset u32 0, length u32, data,
      CRC-32C(data) u32), split it into [index byte][payload] packets, and
      encrypt EACH PACKET INDEPENDENTLY starting from the same IV. Both
      clients do this: Java's Cipher.doFinal resets the counter, and Hybridge
      uses a one-shot CTR per packet. file_put_open announces the container
      length (data + 16). The watch's 08-type frame reports CRC-32 of the
      PLAINTEXT container.
    download: >
      Packet N (0-based) is decrypted from IV + step * N, where the addition
      is to the big-endian u32 in IV bytes 12-15 and wraps at 32 bits. The
      step is not announced. Both clients find it on packet 1 by trying step
      0x1e-0x2f and taking the first whose decrypted flag byte is 01 (or 81 if
      that packet ends the file), and the default is 0x1f. Strip the decrypted
      flag byte, append the rest, and check CRC-32 of the assembled plaintext
      against the 08-type frame.
    session: "Run a fresh handshake before EVERY encrypted transfer (both clients do), so every transfer gets its own IV."
    keystream_reuse: "Because every upload packet restarts at the same IV, packets of one transfer share keystream. That is the reported protocol, not a recommendation; implement it as stated to interoperate."
  file_transfer:
    download_sequence:
      - "Optional: file_lookup (02 ff major) to resolve the concrete handle; its data is a small file whose first two bytes are the handle."
      - "file_get_open on the handle. Reply low nibble 1: bytes 1-2 handle (minor, major), byte 3 status, bytes 4-7 total size u32 LE."
      - "Collect 3dda0004 packets, dropping the flag byte (after decryption for an encrypted file), until bit 7 of a flag is set and the declared size is reached."
      - "Reply low nibble 8: bytes 1-2 handle, byte 3 status, bytes 8-11 CRC-32 (zlib/IEEE) of the assembled bytes. Bytes 4-7 are not interpreted by either client."
    upload_sequence:
      - "file_put_open with the container length."
      - "Reply low nibble 3, 5 bytes, status at byte 3. Hybridge stops on a non-zero status (e.g. 134 not enough memory), while Gadgetbridge streams regardless."
      - "Write packets [index][payload] on 3dda0004, payload = min(MTU - 3, 512) - 1 bytes."
      - "Reply low nibble 8 (a 4-byte echo is ignored): status byte 3, CRC-32 of the streamed plaintext at bytes 8-11; it must match."
      - "file_close (04 handle). Reply low nibble 4, 4 bytes (a 9-byte echo is ignored), status at byte 3. Low nibble 9 at any point is a watch-side timeout."
    container: "A 'cooked' file is handle u16 LE, file version u16 LE, offset u32 LE (0), payload length u32 LE, payload, CRC-32C (Castagnoli) of the payload u32 LE: 12 + n + 4 bytes. The file version for plain puts comes from the device-info file. Encrypted puts use 0x0002. JSON puts, watch apps (already containers) and firmware are sent raw with no container added. The activity file is not this container (offset 8 is a timestamp)."
  result_codes:
    0: "success"
    1: "invalid operation data"
    2: "operation in progress"
    3: "missed packet"
    4: "socket busy"
    5: "verification failed"
    6: "overflow"
    7: "size over limit"
    128: "firmware internal error"
    129: "not open"
    130: "access error"
    131: "not found"
    132: "not valid"
    133: "already created"
    134: "not enough memory"
    135: "not implemented"
    136: "not supported"
    137: "socket busy"
    138: "socket already open"
    139: "input data invalid"
    140: "not authenticated"
    141: "size over limit"
  device_info:
    handle: "0x0b00, plain cooked file"
    payload: "Repeated TLV: type u16 LE, length u8, value. Type 0x0a = supported file versions, value = repeated (major u8, version u16 LE). Type 0x0e = security version (2 bytes, major and minor). Other types are skipped."
    note: "Gadgetbridge adds two versions the watch does not list: 0x13 reply messages 0x0002 and 0x15 watch apps 0x0003."
  configuration_items:
    container: "Encrypted file 0x0800. Payload = repeated item: id u16 LE, length u8, value (little-endian). A put may carry one or many items. A get (lookup then encrypted get) returns all of them."
    items:
      0x02: "current step count, u32"
      0x03: "daily step goal, u32"
      0x09: "inactivity warning, 6 bytes: from hour, from minute, until hour, until minute, inactive minutes, enabled (0/1)"
      0x0a: "vibration strength, u8"
      0x0c: "time, 8 bytes: UTC epoch seconds u32, milliseconds u16, local UTC offset in minutes s16"
      0x0d: "battery (read only), 3 bytes: millivolts u16, percent u8"
      0x0e: "heart-rate measurement mode, u8"
      0x10: "units, u32 bit field: Gadgetbridge sends 8 for metric and sets bits 0x1 (distance) and 0x4 (temperature) for imperial; bit 0x8 is unexplained"
      0x11: "second-time-zone offset, s16 minutes"
      0x14: "activity auto-recognition (running, biking, walking, rowing): per-workout groups of id, mode flags (bit 0 recognise, bit 1 ask), minutes"
  operations:
    set_time:
      file: "configuration 0x0800, encrypted put"
      payload: "item 0x0c"
      verification: "reported"
    read_configuration:
      file: "configuration 0x0800: file_lookup 02 ff 08, then encrypted get of the returned handle"
      returns: "items above, including battery voltage/percent and step count"
      verification: "reported"
    activity_sync:
      steps:
        - "file_lookup 02 ff 01. Size 0 means no new data."
        - "Fresh handshake, then encrypted get of the returned handle."
        - "Parse and store. Only after that, file_delete the handle so the watch frees it."
      format: >
        Parsed raw, header included. File version u16 LE at offset 2 must be 22. The start
        timestamp is u32 LE UTC at offset 8, the UTC offset in minutes is s16 at 12, and
        the file id is u16 at 16. Two variants exist. If the byte at offset 52 is one of
        ce c2 e2 e0 dd d6 cb cc cf, it is a marker stream with heart rate (ce = minute sample with wear state,
        variability, heart rate and calories; d6 = SpO2 sample; e2 04 + u32 = time
        resync; e0 = workout summary of 14 TLV attributes, 2 = duration s, 9 =
        workout type). Otherwise 4-byte records start at offset 44 (step-only). Each
        record is one minute. Calories are the low 6 bits of a byte whose bit 0x40
        means active. Large parts of the grammar are heuristic in both clients;
        follow Gadgetbridge's and Hybridge's activity parsers for details.
      verification: "reported"
    notifications:
      file: "notification play 0x0900, plain cooked put, version from device info"
      payload: >
        total length u16 LE, header length u8 (10), type u8 (1 incoming call, 2 text,
        3 notification, 4 email, 5 calendar, 6 missed call, 7 dismiss), flags u8,
        uid length u8 (4), app-CRC length u8 (4), title length u8, sender length u8,
        message length u8, notification id u32, app CRC u32, then title, sender and
        message, each UTF-8 and NUL-terminated. Gadgetbridge puts the source app's
        package name in the title and sets app CRC = CRC-32 of that package name
        (without the NUL). It truncates the message to 475 characters.
      flags: "Text notification 0x02. Incoming call 0x18 (0x38 with quick replies). Dismiss/end call 0x02. OR in the phone's DND-suppressed bit. A call uses notification id 1 and the fixed app CRC bytes 80 00 59 b7."
      prerequisite: "At start-up Gadgetbridge also uploads a notification filter (0x0c00) and icons (0x0701). Whether a play for an unfiltered package is shown is not established."
      verification: "reported"
    buttons:
      file: "JSON put, raw, handle 0x05 << 8 | rolling index"
      payload: '{"push":{"set":{"master._.config.buttons":[{"button_evt":"top_short_press_release","name":"weatherApp"}]}}}'
      events: "top_, middle_, bottom_ + short_press_release (single_click before firmware 2.19) or hold. middle_hold only from 3.0. name must be an installed watch app; workoutApp is built in."
      verification: "reported"
    alarms:
      file: "alarms 0x0a00, plain cooked put"
      note: "Five slots. With file version 3, each alarm is a TLV record with a 3-byte time/day entry, a label (max 15 chars) and a message (max 50 chars). The byte layout of the 3-byte entry is not transcribed here; see Gadgetbridge's alarm builder."
      verification: "reported"
    watch_apps:
      list: "file_lookup 02 ff 15 then get. After the 12-byte header, each record is length u16, 1 byte, name length u8 (with NUL), name, NUL, minor handle u8, hash u32, version major u8, version minor u8, 2 bytes."
      install: ".wapp files start with fe 15 03 (handle 0x15fe, version 3) and are uploaded raw to 0x15fe. Watchfaces are apps."
      remove: "file_delete 0x15 << 8 | app minor handle."
      verification: "reported"
    music_info:
      file: "music info 0x04xx put, followed by music_state on 3dda0006"
      verification: "reported"
  test_vectors:
    provenance: "Invented key and randoms, computed by this project with a pure-stdlib AES-128 and checked against the FIPS-197 vector. No watch, capture or real key."
    watch_key_hex: "0f1e2d3c4b5a69788796a5b4c3d2e1f0"
