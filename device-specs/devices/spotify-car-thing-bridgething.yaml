device:
  name: "Spotify Car Thing (Bridgething custom firmware/daemon)"
  manufacturer: "Spotify (hardware); Bridgething project (replacement daemon)"
  manufacturer_status: "unsupported"
  testing:
    status: untested
    notes: >
      Derived from Bridgething 3f313b655ebd0aea74d194c1349a56a1c13490be,
      including docs/protocol.md and crates/lib/fixtures/golden.json. No stock
      or replacement Car Thing, gateway, network listener, or iAP2 session was
      contacted. The vectors are source fixtures, not hardware verification.
  protocol: "bluetooth_classic"
  transport: "rfcomm"
  category: "display"
  category_hierarchy: ["display", "screen"]
  type: "automotive-display-custom-daemon"
  integration: "identify_only"
  aliases: ["Car Thing", "superbird", "Bridgething"]
  openness:
    status: "open_by_design"
    reverse_engineered: false
    source_code: "https://github.com/JoeyEamigh/bridgething"
    license: "MIT"
    upstream_docs:
      - url: "https://github.com/JoeyEamigh/bridgething/blob/3f313b655ebd0aea74d194c1349a56a1c13490be/docs/protocol.md"
        title: "Bridgething wire protocol"
        covers: "DEAD v2 framing, gateway/client envelopes, transports, limits, and errors."
      - url: "https://github.com/JoeyEamigh/bridgething/blob/3f313b655ebd0aea74d194c1349a56a1c13490be/docs/stock-webapp-gateway-contract.md"
        title: "Stock webapp translation contract"
        covers: "The port-8890 translation boundary and the modern operations a gateway must supply."
    notes: >
      This is a protocol published by the replacement-daemon authors. It is not
      Spotify's stock protocol and must not be used to identify a stock unit.
  notes: >
    SCOPE: this spec applies only after the owner installs the Bridgething
    custom firmware/daemon. Stock Car Thing firmware does not provide these
    surfaces. Installation, bootloader access, and firmware images are outside
    this protocol spec.

    The primary control link is Bluetooth Classic RFCOMM service
    dead0000-854d-408e-81f0-fb6147f918fd on channel 1. The same DEAD v2 typed
    gateway protocol also runs over the daemon's iAP2 ExternalAccessory channel
    and its network-gateway WebSocket on port 8892. Port 8891 is a separate,
    unframed local-webapp surface. Port 8890 is only a compatibility translator
    for the stock Spotify webapp's string methods and untyped JSON; it is not the
    modern gateway API and does not make a stock daemon unnecessary.
  identification:
    notes: >
      Match only a unit already known to run Bridgething. The custom SDP UUID is
      strong evidence of the replacement daemon; no stock Spotify Bluetooth
      name or service is claimed. Bluetooth Classic class of device is
      0x7c0000. There is no stock-firmware auto-detection rule.
  discovery:
    methods:
      - type: "bt_classic_inquiry"
        bt_classic:
          service_uuids: ["dead0000-854d-408e-81f0-fb6147f918fd"]
          class_of_device:
            value: "0x7c0000"
          requires_discoverable_mode: "unknown"
        verification: "reported"
        notes: >
          The UUID and class come from the replacement daemon's protocol
          document. The name and discoverability window are not established;
          use an existing host pairing or manual selection when inquiry fails.
    identity:
      stable_keys: ["identity_address"]
      display: "local_name"
      notes: >
        Keep the host-resolved Bluetooth identity address, not a per-connection
        RFCOMM channel or a network peer counter. Whether BLE and BR/EDR expose
        one address is unknown.
    static_ip_required: false
  setup:
    required: true
    confidence: "medium"
    notes: >
      Setup means installing the replacement daemon and pairing a gateway, not
      provisioning a stock Car Thing. The installation mechanism and any wipe
      performed by it are deliberately not inferred from the wire document.
    methods:
      - type: "bt_classic_pairing"
        name: "Install Bridgething, then pair the gateway"
        verified: false
        description: >
          Follow the replacement project's own installation instructions, then
          pair the daemon from the host Bluetooth UI and open its custom
          RFCOMM service. The iAP2 and LAN surfaces are alternatives after the
          daemon is running, not evidence of stock support.
        steps:
          - action: "Install the Bridgething custom firmware/daemon using the upstream release and installation guide; preserve any owner data required by that guide."
            actor: "user"
            expect: "The Bridgething daemon, not the stock Spotify daemon, is running."
          - action: "Make the unit discoverable if required and pair it from the host's Bluetooth settings."
            actor: "user"
            expect: "The host has a Bluetooth Classic bond with the daemon."
          - action: "Open RFCOMM channel 1 for dead0000-854d-408e-81f0-fb6147f918fd and exchange only DEAD v2 gateway frames."
            actor: "client"
            expect: "Typed gateway envelopes can be sent and correlated by UUID."
    factory_reset:
      applicable: "unknown"
      confidence: low
      effect: >
        Not established. A daemon factoryReset request exists in the typed
        client catalogue, but the sources reviewed do not define its physical
        entry, complete erase scope, or result on Bluetooth bonds and installed
        webapps. Do not issue it as a provisioning shortcut.
      description: >
        Reinstallation and factory reset are different operations. No physical
        reset procedure is asserted from the presence of a software request.
    rejoin:
      in_place_supported: false
      requires_factory_reset: false
      notes: >
        There is no Wi-Fi provisioning rejoin in this Classic spec. To move to
        another gateway, use the daemon's Bluetooth pairing/connection UI and
        the host's forget/pair controls. Whether an existing bond excludes a
        new gateway is unknown; a factory reset is not prescribed.
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device:
        - "Bluetooth pairing state, if persisted by the daemon/host stack"
      issued_to_client: []
      notes: >
        No application token is defined for the RFCOMM gateway. Network
        WebSocket access control, authentication, TLS, and exposure defaults
        are unknown; do not expose ports 8890-8892 outside a trusted network.
  pairing:
    required: true
    confidence: "medium"
    security_mode: "unknown"
    bonding: "required"
    exclusivity:
      single_connection: true
      single_bond: "unknown"
      recovery: >
        The protocol allows one paired gateway peer per RFCOMM connection.
        Close the existing gateway before opening another. If a new host cannot
        pair, use the daemon's connection UI and forget the old host bond; do
        not assume that a factory reset is necessary.
    enter_pairing_mode:
      required: "unknown"
      notes: >
        The protocol document establishes a paired RFCOMM peer but not the
        physical/UI action or discoverability window that creates the bond.
    unpair:
      supported: "unknown"
      notes: >
        Host-side forget is available. A daemon-side operation that revokes one
        bond without broader erasure is not established by the reviewed docs.
    notes: >
      Pairing statements apply to the custom daemon only. On iOS/iPadOS,
      CoreBluetooth cannot open RFCOMM; use the documented iAP2 channel through
      ExternalAccessory with protocol name com.bridgething.gateway instead.
  host_compatibility:
    - stack: "corebluetooth"
      link: "br_edr"
      status: "incompatible"
      symptom: "no_transport"
      cause:
        missing_api: "rfcomm"
      workaround: "vendor_mfi"
      verification: "reported"
      basis: >
        Bridgething docs/protocol.md records RFCOMM and a separate iAP2
        ExternalAccessory channel. CoreBluetooth exposes no RFCOMM API.
      notes: >
        The alternative is the custom daemon's iAP2 ExternalAccessory channel:
        protocol id 1, protocol name com.bridgething.gateway, opened after the
        iAP2 link is up and carrying the same DEAD v2 stream. An iOS app must
        declare that protocol string. This is not CoreBluetooth GATT access and
        is not a claim that the stock Spotify accessory supports it.

bluetooth_classic:
  dual_mode: "unknown"
  ble_role: "unknown"
  address_shared_with_ble: "unknown"
  profiles:
    - profile: "vendor"
      uuid: "dead0000-854d-408e-81f0-fb6147f918fd"
      channel: 1
      role: "control"
      secure: true
      verification: "reported"
      notes: >
        Custom Bridgething gateway RFCOMM service. One paired peer per
        connection; carries the DEAD v2 byte stream, not BLE GATT or plain SPP
        text. The fixed channel permits direct RFCOMM binding as well as SDP.
  serial:
    profile_uuid: "dead0000-854d-408e-81f0-fb6147f918fd"
    profile_channel: 1
    encoding: "binary"
    framing:
      length_prefix: true
      checksum: "none"
      tx_start_bytes: "de ad"
      rx_start_bytes: ["de ad"]
      resync: "scan_to_start_bytes"
      max_frame_bytes: 16777232
      notes: >
        Every frame has a 16-byte header: magic DE AD, version 02, compression,
        encoding, priority, two reserved bytes, then an unsigned 64-bit
        big-endian POST-COMPRESSION payload length at offset 8. Total frame
        length is 16 + that value. The first-class schema has no u64 length-size
        arm, so the authoritative field table is protocol_details.dead_v2.
        Reads may split or coalesce frames; scan to the next DE AD after bad
        magic, unsupported version, or a length above 16 MiB.
    response_timeout_ms: 60000
    verification: "reported"
    notes: >
      UUID request correlation, msgpack/JSON encoding, compression, and lanes
      are declared in protocol_details rather than approximated as positional
      RFCOMM replies. Daemon request timeout is 60 s; SDK callers use 30 s.
  verification: "reported"
  notes: >
    The transport and framing are published replacement-daemon behavior. No
    stock Spotify protocol compatibility is claimed.

protocol_details:
  scope:
    firmware: "Bridgething custom firmware/daemon only; never stock Spotify firmware"
    direction_vocabulary:
      gateway_to_bridge: "Phone/host gateway to the on-device daemon."
      bridge_to_gateway: "On-device daemon to its phone/host gateway."
      client_to_bridge: "Local webapp to the daemon over port 8891."
      bridge_to_client: "Daemon to a local webapp over port 8891."
    verification: "reported"
  dead_v2:
    magic_hex: "dead"
    version: 2
    header_bytes: 16
    fields:
      - {name: "magic", offset: 0, size: 2, type: "uint16", endianness: "big", value: "0xdead"}
      - {name: "version", offset: 2, size: 1, type: "uint8", values: {2: "DEAD v2; skip every other version"}}
      - {name: "compression", offset: 3, size: 1, type: "uint8", values: {0: "none", 1: "gzip"}}
      - {name: "encoding", offset: 4, size: 1, type: "uint8", values: {0: "msgpack named maps", 1: "JSON"}}
      - {name: "priority", offset: 5, size: 1, type: "uint8", values: {0: "normal", 1: "bulk", 2: "background"}, unknown_value: "normal"}
      - {name: "reserved", offset: 6, size: 2, type: "bytes", encode_hex: "0000", decode: "ignore"}
      - {name: "length", offset: 8, size: 8, type: "uint64", endianness: "big", unit: "B", meaning: "payload bytes following the header after compression, not uncompressed size"}
      - {name: "payload", offset: 16, size: "length", type: "bytes", meaning: "exactly one typed envelope"}
    payload_cap_bytes: 16777216
    decompressed_cap_bytes: 16777216
    resync:
      triggers: ["bad magic", "unknown version", "declared payload length over 16 MiB"]
      algorithm: "Discard forward to the next DE AD sequence; preserve a trailing DE byte across reads so split magic is not lost. A malformed body is a failed item, not permission to read the next frame from an unchecked offset."
    scheduling:
      drain_order: ["normal", "bulk", "background"]
      normal: "Control, state, and transport messages."
      bulk: "Large payloads a user is waiting for, such as requested artwork."
      background: "Transfers with nothing on screen waiting, such as OTA images."
      fragmentation: "Split large logical payloads into typed messages so higher-priority lanes interleave."
  compression:
    algorithm: "gzip"
    receive: "Accept compression 0 and 1 on every lane; cap decompressed output at 16 MiB."
    automatic:
      lane: "normal only"
      threshold_bytes: 16256
      comparison: "strictly greater than"
      rule: "Above the threshold, gzip once and keep it only when the compressed payload is smaller. Bulk and background do not auto-gzip."
    explicit_modes:
      never: "Never compress."
      always: "Compress even when larger."
      if_smaller: "Offer gzip on any lane and size; keep only when smaller."
      auto: "Apply the normal-lane threshold rule."
    length_rule: "Header length always counts the bytes actually sent, after compression."
  envelope:
    shape:
      id: "Fresh UUID on every sent message, including responses."
      meta: "{kind: command|event|request|response}; responses add data.requestId."
      data: "{type: <surface>, data: {event: <variant>, data: <typed payload>}}; unit variants omit their inner data."
    tagging: "Outer type and inner event are camelCase. The variant fixes the legal meta.kind."
    uuid:
      fields: ["id", "requestId", "transferId", "webapp", "connectionId", "streamId", "tunnelId", "launcher", "overlay"]
      msgpack: "When a field named in fields is declared uuid::Uuid, it serializes as 16 raw bytes (MessagePack bin), never as a UTF-8 string, including when nested in TTS, WebSocket, stream, tunnel, or webapp-slot payloads."
      json: "The same UUID-typed fields serialize as canonical lowercase hyphenated UUID strings in JSON. launcher and overlay are nullable; null is not a UUID byte string."
      opaque_id_exception: "Some payloads also use id for opaque asset or other non-UUID identifiers. Those remain strings; only an actual UUID-typed id uses the 16-byte representation. The containing payload type is authoritative."
      asset_id_rule: "Within data.type=asset, the payload id field is String and stays MessagePack str even when its value is a canonical UUID string. This applies to AssetGet, AssetRequest, AssetGotReply, AssetNotFoundReply, and related asset identifiers. The sibling requestId and TransferRef.id fields are uuid::Uuid and remain 16-byte MessagePack binary."
      correlation: "A response has a fresh id and meta.data.requestId equal to the request's id. Never match by response id, arrival order, or surface alone."
      type_note: "TypeScript string annotations describe the JSON representation only. They do not change the MessagePack binary representation."
    request_rules:
      - "Answer every request with exactly one response; unanswered requests time out."
      - "A request may instead return a domain error on its own reply variant; distinguish it from a WireError."
      - "Successful commands normally have no reply and SDK command methods do not wait for one."
    json_example_request:
      id: "01924f2b-1f7e-7c1a-9f3a-6b2d9e5a4c18"
      meta: {kind: "request"}
      data:
        type: "library"
        data: {event: "browse", data: {nodeId: null, limit: 14, offset: 0}}
    json_example_response:
      id: "01924f2b-1f7e-7c1a-9f3a-6b2d9e5a4c19"
      meta:
        kind: "response"
        data: {requestId: "01924f2b-1f7e-7c1a-9f3a-6b2d9e5a4c18"}
      data:
        type: "library"
        data: {event: "browseReply", data: {result: {entries: []}}}
  errors:
    wire_shape: "data.type=error; data.data is the WireError; meta.kind=response and meta.data.requestId identifies the failed request/command where documented."
    variants:
      unsupported: "Receiver has no operation for this request variant."
      unimplemented: "Variant is known but no backend is wired."
      malformed: "{data: {reason: string}}; payload failed decoding or validation."
      handlerFailed: "{data: {reason: string}}; handler hit an internal error."
    gateway_decode_failure: "An unknown gateway request variant gets unsupported keyed to its request id."
    webapp_decode_failure: "An unknown webapp request or command gets malformed keyed to its id."
    webapp_handler_failure: "A failed command gets handlerFailed keyed to its id; it can arrive as an otherwise unmatched response because commands do not have success replies."
    typed_result:
      success: "{ok: true, response: R}"
      domain_error: "{ok: false, kind: domain, error: E}"
      protocol_error: "{ok: false, kind: protocol, error: WireError}"
  transports:
    rfcomm:
      uuid: "dead0000-854d-408e-81f0-fb6147f918fd"
      channel: 1
      device_class: "0x7c0000"
      framing: "Arbitrary byte-stream splits and coalescing; use DEAD v2 lengths and resync."
      peers: 1
    iap2:
      framework: "ExternalAccessory, not CoreBluetooth"
      protocol_id: 1
      protocol_name: "com.bridgething.gateway"
      framing: "Same DEAD v2 stream after the iAP2 link comes up."
    network_gateway:
      url: "ws://{address}:8892/"
      messages: "WebSocket binary only; each message contains one or more COMPLETE DEAD v2 frames and no trailing partial frame."
      partial_message_action: "Daemon closes the connection when a message ends part-way through a frame."
      message_cap_bytes: 1048576
      peer_address: "6 bytes: fe fe followed by a big-endian u32 counter; this is a connection label, not a Bluetooth MAC."
      access_control: "unknown"
      security_warning: "No bind address, authentication, authorization, TLS, or origin check is established. Treat exposure as unsafe until inspected and keep on a trusted network."
    local_webapp:
      url: "ws://{address}:8891/"
      boundary: "Distinct BridgeToClientMsg/ClientToBridgeMsg surface, not the gateway surface."
      framing: "One envelope per WebSocket message; no 16-byte DEAD header."
      text_messages: "JSON."
      binary_messages: "MessagePack."
      reply_encoding: "Whichever encoding the webapp sent most recently."
      access_control: "unknown"
    stock_translation:
      url: "ws://{address}:8890/"
      boundary: "Stock Spotify webapp only: string method names and untyped JSON translated by the custom daemon to modern typed operations."
      not_a_modern_api: "Do not send BridgeToGatewayMsg/GatewayToBridgeMsg here and do not infer stock daemon support."
      required_modern_operations: ["library.browse", "library.resolveContext", "asset.request", "player.snapshot", "player.queueChanged"]
      translation_map:
        - {stock: "com.spotify.superbird.get_home", modern: "library.browse", note: "nodeId=null, sections=10"}
        - {stock: "com.spotify.get_children_of_item", modern: "library.browse", note: "nodeId=parent id"}
        - {stock: "com.spotify.superbird.get_podcast", modern: "library.browse", note: "nodeId=show URI"}
        - {stock: "com.spotify.play_uri", modern: "player.play", note: "{uri, context=null}"}
        - {stock: "com.spotify.queue_spotify_uri", modern: "player.queue", note: "{uri, position=append}"}
        - {stock: "com.spotify.set_saved", modern: "library.favoritesSet"}
        - {stock: "com.spotify.get_saved", modern: "library.favoritesContains"}
        - {stock: "com.spotify.set_podcast_playback_speed", modern: "player.setSpeed"}
        - {stock: "com.spotify.get_image", modern: "asset.request", note: "artwork edge=248"}
        - {stock: "com.spotify.get_thumbnail_image", modern: "asset.request", note: "artwork edge=96"}
        - {stock: "com.spotify.superbird.earcon", modern: "audio.earcon"}
        - {stock: "com.spotify.superbird.tts.speak", modern: "audio.earcon", note: "name=spotify-stock:<file>"}
  limits:
    daemon_request_timeout_seconds: 60
    sdk_request_timeout_seconds: 30
    network_gateway_message_cap_bytes: 1048576
    frame_payload_cap_bytes: 16777216
    daemon_fragment_bytes: 4096
    in_memory_transfer_cap_bytes: 262144
  transfers:
    body:
      inline: "{type: inline, data: bytes}; small payloads carried directly."
      stream: "{type: stream, data: TransferRef}; bytes follow as transfer.fragment events."
    transfer_ref: "{id: UUID, totalSize: u32, sha256: optional lowercase hex SHA-256}"
    fragment: "{transferId: UUID, offset: u32, bytes: binary}"
    ordering: "Send ascending offsets with no gaps on the chosen lane. Reject overlaps, gaps, out-of-order fragments, and bytes beyond totalSize. Discard on transfer.abandon."
    abandon: "{transferId: UUID, reason: string}"
    ack: "transfer.ack also exists in both gateway directions; use its typed payload rather than treating it as request correlation."
  payload_types:
    AssetGet: "{id: string (opaque asset identifier, even when UUID-shaped), requestId: UUID}"
    AssetRequest: "{id: string (opaque asset identifier, even when UUID-shaped), requestId: UUID}"
    AssetGotReply: "{id: string (opaque asset identifier, even when UUID-shaped), mime: optional string, body: TransferBody; body.stream.data.id is TransferRef.id (UUID)}"
    AssetNotFoundReply: "{id: string (opaque asset identifier, even when UUID-shaped)}"
    AssetPreload: "{ids: string[]; only first 64 used}"
    SetVolume: "{level: number}"
    SetMute: "{muted: boolean}"
    Tts: "{id: UUID, text: string, voice: optional string}"
    TtsCancel: "{id: UUID}"
    Earcon: "{name: string}"
    ConnectBluetooth: "{mac: string}"
    SetBluetoothAlias: "{name: string}"
    GeoUnwatch: "{token: string}"
    DisplaySetMode: "{mode: BrightnessMode; use manual before DisplaySetLevel}"
    DisplaySetLevel: "{level: number, 0.0 dimmest through 1.0 brightest}"
    FavoritesToggle: "{item: ItemRef}"
    FavoritesSet: "{item: ItemRef, liked: boolean}"
    FavoritesSetMany: "{entries: FavoritesSet[]}"
    NetWsOpen: "{connectionId: UUID, url: string, protocols: optional string[], headers: optional HttpHeader[]}"
    NetWsClose: "{connectionId: UUID, code: optional u16, reason: optional string}"
    NetWsSend: "{connectionId: UUID, frame: WsFrame}"
    NetStreamOpen: "{streamId: UUID, request: NetFetchRequest}"
    NetStreamCancel: "{streamId: UUID}"
    NetFetchRequest: "{url: string, method: GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS, headers: HttpHeader[], body: optional bytes, timeoutMs: optional u32, redirect: follow|manual|error}"
    WsFrame: "{type: text|binary, data: string for text or bytes for binary}"
    StreamBegin: "{streamId: UUID, status: u16, headers: HttpHeader[], totalSize: optional u32}"
    StreamChunk: "{streamId: UUID, offset: u32, bytes: binary}"
    StreamEnd: "{streamId: UUID}"
    TunnelOpen: "{tunnelId: UUID, host: string, port: u16}"
    TunnelData: "{tunnelId: UUID, bytes: binary}"
    TunnelAck: "{tunnelId: UUID, consumed: u32}"
    TunnelClosed: "{tunnelId: UUID, reason: optional string}"
    WebappSlots: "{launcher: optional UUID, overlay: optional UUID}"
    NotificationInvoke: "{id: string}"
    PhoneCallAction: "{callId: string}"
    PhoneAcceptAction: "{callId: string, action: AcceptCallAction}"
    PhoneEndAction: "{callId: string, action: EndCallAction}"
    PhoneInitiateAction: "{kind: InitiateCallType, destinationId: optional string, service: optional PhoneCallService, addressBookId: optional string}"
    PhoneMuteAction: "{mute: boolean}"
    PhoneDtmfAction: "{callId: optional string, tone: DtmfTone}"
    PlayUri: "{uri: string, context: optional PlayContext}"
    QueueUri: "{uri: string, position: QueuePosition}"
    SkipPrev: "{allowSeeking: boolean; restart current track after threshold when true}"
    SkipToIndex: "{index: number}"
    SeekTo: "{positionMs: number}"
    SetShuffle: "{on: boolean}"
    SetRepeat: "{mode: RepeatMode}"
    SetSpeed: "{speed: number; positive finite playback multiplier}"
    SetCrossfade: "{durationMs: optional number}"
    TransferTo: "{targetId: string}"
    LogsUnsubscribe: "{token: string}"
    LauncherGestureSet: "{gesture: LauncherGesture}"
    CompanionLaunchSet: "{enabled: boolean}"
    MicMute: "{preserve: boolean; preserve an active capture when true}"
    MicUnmute: "{preserve: boolean}"
    ChromeNavigate: "{url: string}"
    SpotifyWakeRequest: "{allowPlayTap: boolean}"
    OtaAbandon: "{updateId: string}"
    OtaActivate: "{expected: string[]}"
    LogsSetVerbosity: "{token: string, verbosity: optional LogLevel}"
    VoiceMicOpen: "{reason: VoiceCaptureReason}"
    VoiceDispatch: "{streamId: UUID, resolved: NluResolvedIntent, stage: optional NluStage, asrConfidence: optional f32}"
    ForwardMessage: "Tagged by encoding: {encoding: text, data: string}, {encoding: json, data: any JSON value}, or {encoding: binary, data: bytes}."
    ForwardRouted: "{webapp: UUID, message: ForwardMessage}"
  typed_command_catalogue:
    semantics: "Every row is a meta.kind=command variant. data.type is surface, data.data.event is event, and payload is the named type in payload_types; null means a unit variant with no inner data. Commands are not plain JSON RPC methods."
    rows:
      - {direction: "gateway_to_bridge", surface: "chrome", event: "navigate", payload: "ChromeNavigate"}
      - {direction: "gateway_to_bridge", surface: "player", event: "requestSpotifyWake", payload: "SpotifyWakeRequest"}
      - {direction: "gateway_to_bridge", surface: "system", event: "otaAbandon", payload: "OtaAbandon", advanced: true}
      - {direction: "gateway_to_bridge", surface: "system", event: "otaActivate", payload: "OtaActivate", advanced: true}
      - {direction: "gateway_to_bridge", surface: "system", event: "cancelUpdate", payload: null, advanced: true}
      - {direction: "gateway_to_bridge", surface: "system", event: "launcherGestureSet", payload: "LauncherGestureSet"}
      - {direction: "gateway_to_bridge", surface: "system", event: "companionLaunchSet", payload: "CompanionLaunchSet"}
      - {direction: "gateway_to_bridge", surface: "system", event: "logsUnsubscribe", payload: "LogsUnsubscribe"}
      - {direction: "gateway_to_bridge", surface: "system", event: "logsSetVerbosity", payload: "LogsSetVerbosity"}
      - {direction: "gateway_to_bridge", surface: "voice", event: "micOpen", payload: "VoiceMicOpen"}
      - {direction: "gateway_to_bridge", surface: "voice", event: "micClose", payload: null}
      - {direction: "gateway_to_bridge", surface: "voice", event: "dispatch", payload: "VoiceDispatch"}
      - {direction: "bridge_to_gateway", surface: "audio", event: "volumeUp", payload: null}
      - {direction: "bridge_to_gateway", surface: "audio", event: "volumeDown", payload: null}
