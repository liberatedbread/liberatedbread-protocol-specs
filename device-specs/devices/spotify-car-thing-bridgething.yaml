local_access:
  status: "firmware_replacement"
  summary: >
    Local typed gateway/webapp control exists only after installing Bridgething.
    RFCOMM and iAP2 carry DEAD v2 streams; port 8892 is the same gateway over a
    LAN WebSocket; port 8891 is a different local-webapp API; port 8890 is only
    stock-webapp translation.
  covers:
    - "Typed playback, library, asset, phone, audio, network, system, and webapp gateway messages"
    - "Local webapp messages over port 8891"
    - "Stock Spotify webapp compatibility through the custom daemon on port 8890"
  not_covered:
    - "Any stock Spotify firmware control protocol"
    - "Firmware installation, bootloader access, and image format"
    - "Network listener authentication/access control, which is unknown"

remaining_unknowns:
  - "Physical installation and factory-reset procedures, their erase scope, and whether bonds survive them."
  - "Daemon discoverability/pairing UI, bond limits, and whether BR/EDR and BLE addresses are shared."
  - "Network ports 8890-8892 bind addresses and access control: no authentication, TLS, origin check, or safe exposure default is established."
  - "Payload enums and deeply nested media/notification/OTA structures beyond the named types and command field signatures transcribed here; use the version-pinned generated bindings before adding those operations."
  - "All protocol facts and upstream golden fixtures are reported and untested against hardware by this project."

evidence:
  documentation_review: >
    Read the replacement project's wire protocol, stock-webapp contract,
    typed Rust surface declarations, generated surface catalogue, and golden
    fixtures at commit 3f313b655ebd0aea74d194c1349a56a1c13490be. Command rows
    preserve direction, outer surface, inner event, meta.kind, and payload type.
  open_questions: >
    The docs define wire behavior but not network access control or physical
    lifecycle operations. No claim is made that source fixtures establish live
    interoperability or that custom firmware exists on an arbitrary Car Thing.
  artifacts:
    - type: "public_implementation"
      artifact: "JoeyEamigh/bridgething 3f313b655ebd0aea74d194c1349a56a1c13490be"
      url: "https://github.com/JoeyEamigh/bridgething/tree/3f313b655ebd0aea74d194c1349a56a1c13490be"
      obtained_via: "Public source repository"
      description: "Authoritative replacement-daemon wire types, protocol docs, and golden MessagePack frames."

helpful_urls:
  - title: "Bridgething custom firmware/daemon"
    url: "https://github.com/JoeyEamigh/bridgething"
    description: "Replacement project and installation entry point; required before anything in this spec exists on a Car Thing."
  - title: "Bridgething wire protocol"
    url: "https://github.com/JoeyEamigh/bridgething/blob/3f313b655ebd0aea74d194c1349a56a1c13490be/docs/protocol.md"
    description: "Authoritative DEAD v2 framing, envelopes, transports, limits, and error behavior."
  - title: "Bridgething golden protocol fixtures"
    url: "https://github.com/JoeyEamigh/bridgething/blob/3f313b655ebd0aea74d194c1349a56a1c13490be/crates/lib/fixtures/golden.json"
    description: "Source of the standard-library test vectors in this spec."
  - title: "Stock webapp gateway contract"
