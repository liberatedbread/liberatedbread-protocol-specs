device:
  name: "Withings Body / Nokia Body (WBS06) — incoming Bluetooth Classic"
  manufacturer: "Withings (Nokia branding on earlier units)"
  manufacturer_status: "active"
  model: "WBS06"
  openness:
    status: "undocumented"
    reverse_engineered: true
    source_code: "https://github.com/pierosavi/withings-local/tree/52cfaa1f9157972373d34ce3021dbcd481c2f907"
    notes: >
      No vendor protocol specification is published. This is a derived spec
      from withings-local v0.5.0 at 52cfaa1f9157972373d34ce3021dbcd481c2f907,
      including its WBS06 notes, WPP codec/auth/measures and native BlueZ
      RFCOMM listener. Upstream's one-scale hardware result is reported, not
      verification by this project.
  testing:
    status: "untested"
    notes: >
      This project did not contact a scale, register a BlueZ profile, pair an
      adapter or use an owner key/address/health measurement. Upstream reports
      one real WBS06 completing fresh Classic pairing, FragFsm, mutual WPP
      authentication and weight/battery delivery. The vectors here are
      synthetic and independent, not physical verification.
  protocol: "bluetooth_classic"
  transport: "rfcomm"
  category: "scale"
  category_hierarchy: ["measurement", "health", "other"]
  type: "weight-scale"
  integration: "identify_only"
  aliases: ["Withings Body", "Nokia Body", "WBS06"]
  notes: >
    WBS06 local measurement sync is NOT BLE GATT and NOT an outgoing RFCOMM
    connection from the host. After a weigh-in in Bluetooth mode, the scale
    initiates a Bluetooth Classic BR/EDR RFCOMM connection to a companion
    listener already registered on the local host. A Linux/BlueZ host with a
    local BR/EDR adapter registers BOTH custom SDP services below, accepts
    the socket, unwraps FragFsm and then speaks authenticated WPP.

    CoreBluetooth cannot open/host this RFCOMM path, and an ESPHome BLE proxy
    cannot supply the Classic listener or bond. Do not present a BLE fallback
    when listener registration fails. A generic SPP client is also the wrong
    shape: the two service UUIDs are host-registered server profiles, not
    proof that the scale accepts an outgoing connection to those UUIDs.

    Only weight (measurement type 1), UTC weigh-in time and battery percentage
    are published. WBS06 does not provide body-composition measurements in
    this integration. Unknown/other measure types stay private raw data and
    must not create composition sensors. No SYNC_OK is sent or echoed.

    The session is read-only apart from PROBE/challenge housekeeping and
    DISCONNECT. No delete, association, roster/user, unit, Wi-Fi, clock,
    setup or firmware operation is declared. WBS06 v551 and WBS05S patch
    claims are excluded, as is every YourOwnWeigh replacement-service or
    firmware path; those are different evidence and do not change this stock
    local Classic protocol.

    A 32-character per-association `kl` is required from an existing owner
    association. It can be pasted or retrieved once from the owner's account;
    subsequent measurement synchronization is local. Consumer integration is
    identify_only until a dedicated native BlueZ listener + FragFsm + mutual-
    auth WPP handler exists. Nothing here is an outbound socket recipe.
  identification:
    notes: >
      No safe unauthenticated scan matcher is asserted. Configure the exact
      WBS06's existing Classic address locally and accept it only on the two
      registered profiles, then require mutual WPP proof before accepting
      measurements. Do not use a generic Body name, SPP UUID or Withings OUI
      as identity. The two custom UUIDs below belong on the HOST listener.
  discovery:
    none: >
      Measurement synchronization is inbound to a preconfigured BlueZ
      listener, not an outbound host inquiry or GATT scan. An existing
      Classic address/bond and mutual WPP authentication are required.
  setup:
    required: true
    confidence: "high"
    notes: >
      High confidence reflects a working public implementation and upstream's
      one-scale result, not this project running the flow. The owner needs an
      existing kl, Bluetooth mode, a local Linux/BlueZ BR/EDR adapter and a
      Just Works Classic bond. No Wi-Fi credentials are written here.
    methods:
      - type: "bt_classic_pairing"
        name: "Existing kl, Just Works Classic bond and BlueZ listener"
        role: "primary"
        verified: false
        description: "Offline-key setup for an already associated WBS06; the scale initiates later measurement connections."
        steps:
          - action: "Use the vendor app's Wi-Fi configuration flow to select the no-Wi-Fi/Bluetooth-only option, holding the underside button for about three seconds when asked. Avoid the on-scale Reset entry."
            actor: "user"
            expect: "The scale is in Bluetooth mode."
          - action: "Provide the existing 32-character kl and the scale's Classic address through local secret/configuration storage; do not publish either."
            actor: "user"
          - action: "On Linux with a local BR/EDR adapter, start Classic pairing, then hold the scale's underside button for about three seconds and complete Just Works pairing without a PIN."
            actor: "user"
            expect: "BlueZ retains a BR/EDR bond/trust. A Setup failed display can still be followed by a valid authenticated weigh-in."
          - action: "Register both WBS06 SDP server profiles with BlueZ Profile1, route accepted sockets only for the configured address, and require FragFsm plus mutual WPP authentication before publishing data."
            actor: "client"
            expect: "Both listeners remain registered; failure is explicit and never falls back to BLE."
      - type: "cloud_account"
        name: "Retrieve the owner's existing kl once"
        role: "alternative"
        verified: false
        description: "Optional online owner-account lookup when no kl export exists; not a cloud round trip per measurement."
        cloud:
          provider: "Withings account association data, account model 7"
          account_required: true
          local_alternative: "The primary bt_classic_pairing method: use an existing kl, local Just Works bond and BlueZ listener; daily synchronization needs no cloud session."
          notes: "Use only the owner's account and refuse an ambiguous account with several WBS06 scales. This spec does not implement account login or roster provisioning."
        steps:
          - action: "Retrieve only the existing WBS06 kl with the public integration's owner helper, store it in a secret store, then continue with the offline Classic setup."
            actor: "user"
            expect: "A 32-character kl is available locally; no account password or real key enters this repository."
    factory_reset:
      applicable: true
      confidence: "medium"
      effect: "The on-scale Reset entry wipes setup. Expect the Classic bond/association and kl-backed local access to need restoration; stored-measurement retention is unknown."
      description: "Reset is not needed to add a local listener or recover a missing BlueZ profile. Do not use it as a pairing troubleshooting step."
      procedures:
        - name: "On-scale Reset menu"
          verified: false
          basis: "withings-local README shared scale instructions at the pinned revision; not run by this project."
          indicator: "The scale returns to setup/onboarding; exact screen sequence and stored-record retention were not recorded."
          steps:
            - action: "Briefly press the underside button to open the on-scale menu and deliberately select Reset only after preserving the owner's association data and accepting setup loss."
              actor: "user"
              expect: "Setup is wiped; complete owner association and restore kl before attempting local reads."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: "A replacement listener needs the same kl and a new Classic bond. Re-register missing profiles after BlueZ restarts; battery loss can require re-pairing/key restoration."
      steps:
        - action: "Preserve kl, pair the replacement local BR/EDR host without a PIN and register both service profiles."
          actor: "user"
        - action: "If Wi-Fi mode is wanted again, use the vendor app's configuration flow; this spec sends no Wi-Fi command."
          actor: "user"
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device: ["Existing association key material and settings (not modified)", "Classic BR/EDR bond"]
      issued_to_client: ["32-character per-association kl", "Classic BR/EDR bond/trust and configured scale address"]
      notes: "Never commit kl, account identifiers, real Bluetooth addresses, user IDs, roster names, measurements or raw HCI captures. Test fixtures use placeholders only."
  pairing:
    required: true
    confidence: "medium"
    security_mode: "just_works"
    bonding: "required"
    exclusivity:
      single_connection: true
      single_bond: "unknown"
      recovery: "Reject a second simultaneous socket for the same configured scale, close other readers and re-pair after a lost battery/bond. Pairing is never initiated automatically during measurement sync."
    enter_pairing_mode:
      required: true
      notes: "Classic Just Works pairing occurs while the scale is in setup mode after an underside-button hold; no six-digit code is used."
      procedures:
        - name: "WBS06 Just Works Classic pairing"
          verified: false
          basis: "withings-local WBS06 guide at the pinned revision, whose author reports a fresh hardware pairing; not run by this project."
          hold_seconds: 3
          indicator: "BlueZ retains a Classic BR/EDR bond and trust. The scale may display Setup failed even when a later authenticated weigh-in succeeds."
          steps:
            - action: "Start pairing on the local BlueZ host, then hold the scale's underside button for about three seconds and keep it in setup mode until pairing completes; accept Just Works without a PIN."
              actor: "user"
              expect: "A BR/EDR bond exists; verify the subsequent WPP session rather than relying on the scale's setup display."
    unpair:
      supported: true
      requires_factory_reset: false
      notes: "Remove only the replacement host's Classic bond to withdraw it. Do not erase LE keys or reset the scale; no remote unpair command is declared."
    notes: "The Classic bond and WPP mutual authentication are separate. An accepted socket or bonded address alone never authenticates a measurement."
  host_compatibility:
    - stack: "bluez"
      link: "br_edr"
      status: "compatible"
      verification: "reported"
      basis: "withings-local WBS06 guide and native Profile1 listener at 52cfaa1f9157972373d34ce3021dbcd481c2f907; upstream reports one real scale completing this path."
      notes: "Requires Linux, a LOCAL BR/EDR adapter, BlueZ Profile1/ProfileManager over D-Bus, file-descriptor acceptance and pairing-agent permissions. Register both UUIDs as server roles and recover registrations after BlueZ restart/release."
    - stack: "corebluetooth"
      link: "br_edr"
      status: "incompatible"
      symptom: "no_transport"
      cause:
        missing_api: "rfcomm"
      workaround: "none_known"
      verification: "reported"
      basis: "CoreBluetooth exposes no RFCOMM/Classic server-profile transport; the established WBS06 path specifically requires native BlueZ Profile1 incoming sockets."
      notes: "An iPhone/iPad cannot host this spec. BLE GATT does not replace the WBS06 Classic listener. macOS Classic IOBluetooth is a separate stack and is not claimed compatible by this verdict."

bluetooth_classic:
  dual_mode: true
  ble_role: "unknown"
  address_shared_with_ble: "unknown"
  wake_required: true
  profiles:
    - profile: "vendor"
      uuid: "00000001-e1ba-dfb7-c7f0-da2b149de289"
      role: "control"
      secure: true
      verification: "reported"
      notes: "HOST-REGISTERED BlueZ RFCOMM server profile for incoming WBS06 measurement connections. Do not assume the scale offers an outgoing server under this UUID."
    - profile: "vendor"
      uuid: "00009990-0000-1000-8000-00805f9b34fb"
      role: "control"
      secure: true
      verification: "reported"
      notes: "Second required host-registered BlueZ RFCOMM server profile. Both are registered once per host and shared by configured WBS06 scales."
  serial:
    profile_uuid: "00000001-e1ba-dfb7-c7f0-da2b149de289"
    encoding: "binary"
    correlation: "in_order"
    max_in_flight: 1
    framing:
      length_prefix: true
      length_offset: 2
      length_size: 2
      length_endianness: "big"
      length_adjust: 4
      checksum: "none"
      tx_start_bytes: "01"
      rx_start_bytes: ["01"]
      resync: "reconnect"
      max_frame_bytes: 65539
      notes: "FragFsm DATA = 01 01 | WPP_length:u16 BE | WPP bytes, so total frame length is length + 4. RESET is the separate two bytes 01 00. DATA length must be nonzero. Preserve a buffer across arbitrary socket reads; reject bad version/operation/zero length and reconnect rather than resynchronizing by guessing."
    read_chunk_bytes: 4096
    response_timeout_ms: 5000
    verification: "reported"
    notes: "Both host profiles accept the same FragFsm/WPP session shape. The profile_uuid selects one for this serial declaration; the other is an equivalent listener, not a fallback to probe concurrently."
  verification: "reported"
  notes: "Direction is scale -> previously registered host listener. A BLE role of unknown is scoped to this measurement spec: separate setup/association GATT behavior is not declared and is not a measurement fallback."

initialization:
  - description: "On an accepted configured-address socket, receive FragFsm RESET 01 00 (10-second budget, then 0.5-second settle), run PROBE with app version 8050004 and a 15-second authentication budget, strictly verify both SHA-1 proofs, then issue only the WPP reads."
    when: "connect"
    notes: "Upstream logs and continues if RESET is absent after its budget; a replacement client may instead fail closed, but in either case an RFCOMM connection alone never authorizes reads. No SYNC_OK."

protocol_details:
  classic_listener:
    direction: "WBS06 initiates; host listens. There is no outbound connect step."
    bluez_profile1:
      object_manager: "/org/bluez, org.bluez.ProfileManager1.RegisterProfile"
      role: "server"
      channel: "0 (allocate a free RFCOMM server channel for each custom UUID and publish it through SDP)"
      require_authentication: false
      require_authorization: false
      lifecycle: "Register both profiles once for all configured scales; take ownership of each accepted D-Bus file descriptor; route by validated BlueZ device path to the configured Classic address; reject unknown or already-busy addresses. Re-register after BlueZ daemon restart or Profile1 Release, with bounded exponential retry, and unregister/close on shutdown without changing system-wide SDP records."
      security: "The profile flags do not replace the earlier Just Works bond or WPP authentication. Never accept measurements before the scale proves knowledge of kl."
    incompatible_hosts:
      - "CoreBluetooth/iOS/iPadOS: no RFCOMM listener API."
      - "ESPHome BLE proxy: no local BR/EDR pairing-agent or incoming Classic RFCOMM/BlueZ Profile1 service."
      - "A BLE-only adapter or a generic outbound SPP client."
  fragfsm:
    reset: "01 00, sent by the scale at session start. Wait up to 10 seconds; the public implementation then settles for 0.5 seconds before WPP."
    data: "01 01 | length:u16 BE | exactly length bytes of one complete WPP message. Host writes use the same wrapper. Length 1..65535; zero is invalid."
    reassembly: "Append each socket chunk to one persistent buffer. Emit RESET events and complete DATA payloads independently, including partial RESET/header/payload and several frames coalesced in one read. Never assume socket reads equal frames."
    errors: "Unexpected version/operation, zero DATA length or malformed enclosed WPP is a session error; do not scan for a new 01 inside health data. Close/reconnect."
  wpp:
    framing:
      message: "01 | command:u16 BE | payload_length:u16 BE | TLV payload."
      tlv: "type:u16 BE | length:u16 BE | value. Require exact bounds and reject trailing partial objects."
      string_or_bytes: "Variable strings and byte arrays inside a TLV have a one-byte length prefix."
      device_request: "Bit 0x4000 marks device-initiated requests; base command is command & ~0x4000. Multi-message lists end with NULL TLV 256 length zero."
    command_ids: {ERROR: 256, PROBE: 257, BATTERY_PERCENT: 261, STORED_MEASURE: 271, DISCONNECT: 272, CONNECT_REASON: 273, PROBE_CHALLENGE: 296}
    object_ids: {"NULL": 256, PROBE_REPLY: 257, BATTERY_PERCENT: 263, CMD_ERROR: 272, STORED_MEASURE_ACTION: 276, STORED_MEASURE_STATUS: 277, STORED_MEASURE_META: 278, STORED_MEASURE_DATA: 279, CONNECT_REASON: 280, PROBE_CHALLENGE: 290, PROBE_CHALLENGE_RESPONSE: 291, APP_PROBE: 298, APP_PROBE_OS_VERSION: 2344}
    probe: "APP_PROBE {os:u8=1, app:u8=1, version:u32 BE=8050004} plus APP_PROBE_OS_VERSION u16 BE=34. Normal mode returns command 296 + PROBE_CHALLENGE {length-prefixed exact MAC string, length-prefixed 16-byte challenge}. Setup-mode PROBE_REPLY is unauthenticated and must not expose stored reads."
    mutual_authentication:
      timeout_seconds: 15
      secret: "Exactly 32 ASCII characters of existing kl. Preserve the advertised MAC string byte-for-byte, including case and separators; never normalize it."
      algorithm: "SHA1(challenge || exact_MAC_string_ASCII || kl_ASCII), 20 raw bytes, independently for device and fresh client challenges."
      exchange:
        - "Require the scale's 16-byte challenge. Generate an independent cryptographically fresh 16-byte client challenge."
        - "Send command 296: PROBE_CHALLENGE_RESPONSE {length 20 || SHA1(device_challenge || exact_mac || kl)}, then PROBE_CHALLENGE {length-prefixed exact_mac || length-prefixed client_challenge}."
        - "Require command 257 + the scale's 20-byte answer and constant-time compare with SHA1(client_challenge || exact_mac || kl). On absence/mismatch, issue no battery/stored reads and no SYNC_OK; close with DISCONNECT where possible."
    read_only_session:
      ordered_operations:
        - "After verified mutual authentication, request BATTERY_PERCENT 261. Object 263 is uint16 BE percent. On failure retain the previous valid value; do not substitute zero."
        - "Request CONNECT_REASON 273. Object 280 is uint16 BE: 1 button, 2 weigh-in. Last successful sync advances after every verified session, even without new measurements."
        - "Request STORED_MEASURE 271 with object 276 {action:u8=0, rc:int8=0}. Object 277 is {count:int16 BE, oldest_time:int32 BE, wifi_configured:int8 BE}."
        - "If count > 0, request the same command with action=1 and collect ALL messages through NULL TLV 256. Action=2/delete is prohibited."
        - "Do NOT send or echo SYNC_OK; its model-specific effect is unproven. Finish with DISCONNECT 272 without waiting for a reply, then close the accepted socket."
      stored_meta: "uid:u32 BE | valid:u8 | slot_count:u8 | user_ids[slot_count]:u32 BE | attrib:u8 | time:u32 BE. time is UTC Unix seconds. Only the first `valid` IDs are meaningful. A malformed META drops its following values, never attaches them to the prior group."
      stored_data: "Exactly 8 bytes: value:int32 BE | type:u16 BE | exponent:int16 BE. Decimal value = raw * 10^exponent; preserve raw triple and decimal precision. 72345e-3 = 72.345 kg for type 1."
      deduplication:
        group_key: "(time, attributed_user), where attributed_user is the first nonzero valid user ID or 0 for guest/unknown. Preserve user_ids/attrib; uid is not required as a stable identity key."
        within_group: "Deduplicate measurement types within each group. Later complete duplicates of one type replace earlier ones only for that user/time/type, never for another user or guest."
        cross_sync_key: "(attributed_user, time, measurement type). Suppress already published samples across whole-store rereads without dropping another attributed user at the same timestamp."
        guest_unknown: "attributed_user 0 remains distinct from every named user at that timestamp. Do not merge Bob, guest and another user into one weight record; multi_user_regression below proves all three survive."
      published_values:
        weight: "Only type 1, unit kg after exponent scaling."
        weigh_in_time: "META time, UTC Unix seconds; one timestamp can cover several groups."
        battery: "Object 263, uint16 BE percent."
        last_sync: "Host timestamp after a fully verified session, not a scale measurement."
        excluded: "No fat ratio/mass, muscle, water, bone, heart rate, visceral fat, BMR, metabolic-age or other composition sensor. Preserve unknown types privately without names/units."
      errors: "ERROR object 272 is {command:u16 BE, error:int32 BE}; surface -2 busy, -3 unsupported, -4 rejected, -5 unauthenticated, -8 invalid arguments, -9 arguments not set without automatic retries."
    test_vectors:
      provenance: "Synthetic placeholder MAC, invented kl/challenges and invented weight/fat-ratio values. The fat-ratio value tests generic codec scaling only and is NOT a WBS06 composition capability or real health datum."
      mac: "aa:bb:cc:dd:ee:ff"
      kl: "0123456789abcdef0123456789abcdef"
      device_challenge_hex: "000102030405060708090a0b0c0d0e0f"
      client_challenge_hex: "a0a1a2a3a4a5a6a7a8a9aaabacadaeaf"
      device_answer_sha1_hex: "61ed7e08c65508721022c15778ad3ce238d08a97"
      client_answer_sha1_hex: "9b3db49377a861643aa0f301086c7770b8b45911"
      uppercase_mac_answer_sha1_hex: "7ab1567c89136628c75d0e1ac4d1f843f8581710"
      challenge_reply_hex: "01 01 28 00 40 01 23 00 15 14 61 ed 7e 08 c6 55 08 72 10 22 c1 57 78 ad 3c e2 38 d0 8a 97 01 22 00 23 11 61 61 3a 62 62 3a 63 63 3a 64 64 3a 65 65 3a 66 66 10 a0 a1 a2 a3 a4 a5 a6 a7 a8 a9 aa ab ac ad ae af"
      scale_proof_hex: "01 01 01 00 19 01 23 00 15 14 9b 3d b4 93 77 a8 61 64 3a a0 f3 01 08 6c 77 70 b8 b4 59 11"
      get_state_hex: "01 01 0f 00 06 01 14 00 02 00 00"
      get_all_hex: "01 01 0f 00 06 01 14 00 02 01 00"
      battery_request_hex: "01 01 05 00 00"
      battery_reply_hex: "01 01 05 00 06 01 07 00 02 00 51"
      disconnect_hex: "01 01 10 00 00"
      measurement_hex: "01 01 0f 00 33 01 16 00 17 00 00 00 07 01 03 00 00 00 2a 00 00 de ad 00 00 be ef 00 65 53 f1 00 01 17 00 08 00 01 1a 99 00 01 ff fd 01 17 00 08 00 00 00 d7 00 06 ff ff"
      measurement_fields:
        time: 1700000000
        valid_user_ids: [42]
        values:
          - {raw: 72345, type: 1, exponent: -3, decoded: 72.345, unit: "kg"}
          - {raw: 215, type: 6, exponent: -1, decoded: 21.5, unit: "%", codec_only: true}
      multi_user_regression:
        provenance: "Entirely invented weight records; repeated uid demonstrates it is not the attribution key."
        time: 1700000000
        groups:
          - {label: "Bob (invented)", attributed_user: 42, uid: 7, raw: 90000, type: 1, exponent: -3, decoded: 90.0, unit: "kg"}
          - {label: "Guest/unknown (invented)", attributed_user: 0, uid: 7, raw: 55000, type: 1, exponent: -3, decoded: 55.0, unit: "kg"}
          - {label: "Alice (invented)", attributed_user: 43, uid: 7, raw: 65000, type: 1, exponent: -3, decoded: 65.0, unit: "kg"}
        expected_group_count: 3
        cross_sync_rule: "First publication emits all three; an identical reread emits none, with separate attribution preserved."
      list_end_hex: "01 01 0f 00 04 01 00 00 00"
      fragfsm_wrapped_measurement_hex: "01 01 00 38 01 01 0f 00 33 01 16 00 17 00 00 00 07 01 03 00 00 00 2a 00 00 de ad 00 00 be ef 00 65 53 f1 00 01 17 00 08 00 01 1a 99 00 01 ff fd 01 17 00 08 00 00 00 d7 00 06 ff ff"
  prohibited_writes:
    measurements: "No STORED_MEASURE action=2/delete and no body-composition publication."
    onboarding: "No association 308, roster/session 269, setup 275, user/unit 274, local self-keying or factory-reset command."
    network_clock_firmware: "No Wi-Fi, TIME_SET 1281 or firmware writes."
    sync_ok: "Never sent or echoed on WBS06."
    other_protocols: "No WBS06 v551 or WBS05S firmware patch claim and no YourOwnWeigh replacement service, host re-pointing or OTA path."
  entity_coverage: >
    No generic entities are declared: the surface is an incoming stateful
    server socket, not a characteristic/fixed response a generic renderer can
    poll. A dedicated listener publishes only weight, weigh-in time, battery
    and host last-sync as described above.

evidence:
  public_implementation: >
    withings-local v0.5.0 at 52cfaa1f9157972373d34ce3021dbcd481c2f907
    supplied native BlueZ Profile1 service registration/lifecycle, incoming
    address routing, FragFsm, shared WPP auth/codec/measures and read-only
    model behavior. Its tests cover fragmented reset/data, back-to-back
    frames, authenticated streams, duplicate readers and listener recovery.
  hardware_report: >
    The WBS06 guide reports one real scale completing fresh Classic pairing,
    RFCOMM, FragFsm, mutual WPP authentication and weight/battery delivery.
    This is attributed upstream evidence, not this project's testing and not
    a firmware-wide guarantee. It explicitly reports no body composition and
    no SYNC_OK.
  documentation_review: >
    The exact WBS06 manual page at manuals.plus was checked during this pass
    and returned HTTP 403 browser blocking, which is not treated as a dead
    link under repository policy. No BLE byte or Classic listener claim is
    inferred from that manual.
  open_questions:
    - "Firmware/version matrix for the stock incoming Classic path; upstream did not state a WBS06 version for its successful scale."
    - "Whether RESET can legitimately be absent on some firmware; the public client logs/continues after its timeout, while strict clients may fail closed."
    - "Factory-reset record retention and all battery-loss pairing cases."
  artifacts:
    - type: "source_review"
      artifact: "pierosavi/withings-local v0.5.0 WBS06 support, 52cfaa1f9157972373d34ce3021dbcd481c2f907"
      url: "https://github.com/pierosavi/withings-local/blob/52cfaa1f9157972373d34ce3021dbcd481c2f907/docs/wbs06.md"
      description: "Pinned WBS06 transport/lifecycle guide plus source and tests; one upstream hardware report, not local verification."
    - type: "vendor_documentation"
      artifact: "Withings WBS06 Digital Wi-Fi Smart Scale user manual (aggregator)"
      url: "https://manuals.plus/withings/withings-wbs06-digital-wi-fi-smart-scale-user-manual"
      description: "Exact-model owner manual; returned HTTP 403 browser blocking when checked, retained under the repository's blocked-link rule."

remaining_unknowns:
  - "Stock firmware versions exposing the incoming Classic path; no WBS06 v551 patch or replacement-service compatibility is claimed."
  - "Exact RESET optionality across firmware and whether any units use a different Classic pairing flow."
  - "Roster attribution without an account-supplied display-name map; generic User 1/User 2 labels do not establish identity."
  - "Factory-reset storage effects and every battery-loss/re-pairing case."
  - "WBS05, WBS05S, WBS12/WBS13 BLE and every other Withings model are separate protocols/profiles, not fallbacks."

