# BMW Motorcycle Diagnostics (MotoScan) — Device Specification
# Status: In Progress — addressing scheme and service data model recovered from the
#         shipped MotoScan app (de.wgsoft.motoscan, SHA-256
#         21b590cb76641731bc448cd992114c5f2b83cc38eb87f8811b91aaf51d2c9055, signature
#         verified as the genuine WGSoft.de build). The reset payloads live in
#         libmotoscan-helper.so and are NOT yet recovered.
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0

device:
  name: "BMW Motorcycle Diagnostics"
  manufacturer: "BMW Motorrad"
  manufacturer_status: "active"
  protocol: "obd2"
  notes: >
    BMW motorcycles (C-, F-, G-, K- and R-series) expose service interval reset, fault
    codes, live data, adaptations and ECU coding over the diagnostic connector. All of it
    is dealer- or paid-tool-gated; MotoScan is the tool that covers it.

    Addressing is BMW's 6F1 scheme: the tester transmits on a single CAN ID 0x6F1 with the
    target ECU address carried as the first payload byte via CAN extended addressing
    (ATCEA), and each ECU replies on 0x600 + its address. That is uniform across modules —
    unlike Triumph, which uses four bespoke stacks.

    The service interval has the same distance/date split found on the Triumph Tiger 900,
    plus a separate valve-clearance service with its own remaining-distance counter and a
    reset counter.

    CONFIDENCE: derived from the shipped app (verification: reported). Nothing has been
    executed against a bike. The reset payloads are in the native diagnostic engine and
    are not yet decoded.

    SAFETY: vehicles are safety-critical. Read-only work only. ECU coding can brick
    modules and is out of scope for this repo.

obd:
  role: "vehicle"

  connector:
    standard: "sae-j1962"
    verification: "reported"

  transport:
    standard: "iso15765-4"
    bitrate: 500000
    addressing: "11bit"
    request_id: "0x6F1"
    verification: "reported"
    notes: >
      BMW D-CAN. Single tester ID 0x6F1 with CAN extended addressing carrying the target
      ECU address; replies arrive on 0x600 + address. MotoScan's init, with <aa> as the
      target address: ATSPB, ATPBC101, ATSH6F1, ATFCSH6F1, ATFCSD<aa>300008, ATFCSM1,
      ATCEA<aa>, ATCM7FF, ATCF6<aa>, ATST90, ATBI, then STCSEGT1 / STCFCPC on STN adapters.

  adapter_requirements:
    - "CAN extended addressing (ATCEA) is mandatory — without it no BMW ECU is reachable."
    - "Client-supplied flow control (ATFCSH/ATFCSD/ATFCSM) with a per-target header."
    - "Long messages: coding and adaptation writes exceed a single frame. The UniCarScan UCSI-2100 handles this with a 255-byte message mode; STN adapters use STCSEGT1/STCFCPC."
    - >
      MotoScan ships its own adapter classification — ELM327_CLONE, ELM327_ORIGINAL,
      ELM327_UNKNOWN, OBDLINK_LX, OBDLINK_MX, OBDLINK_MX_PLUS, OBDLINK_MX_WIFI, UCSI_2000
      (UI text "UCSI-2000/2100") — and distinguishes a clone from an original at runtime.

  ecus:
    - name: "KOMBI (instrument cluster)"
      owns:
        - "service interval (distance)"
        - "service date"
        - "odometer"
        - "valve-clearance service counter"
      verification: "reported"
    - name: "ZFE (central body electronics)"
      verification: "reported"
    - name: "BMS (engine management)"
      verification: "reported"
    - name: "ABS (brake modulator)"
      verification: "reported"
    - name: "RDC (tyre pressure monitoring)"
      verification: "reported"
    - name: "DWA (alarm system)"
      verification: "reported"
    - name: "ILAF (adaptive headlight)"
      verification: "reported"

  requests:
    - name: "reset_service_interval"
      description: >
        Reset a service interval. MotoScan exposes four scopes: SI_ALL, SI_DATE,
        SI_MILEAGE and SI_DATE_CAR. The wire payload is produced by the native diagnostic
        engine and is NOT yet recovered — this entry records the function and its
        prerequisites, not its bytes.
      command_class: "advanced"
      requires: ["custom_headers", "multiframe_tx", "flow_control"]
      writes: true
      verification: "hypothesis"
      notes: "Job identifier STR_VENTILSPIELSERVICE_RESET is the valve-clearance variant."
    - name: "read_service_data"
      description: >
        Read service state from the cluster: odometer at last service, service date, and
        distance remaining to the valve-clearance service.
      command_class: "advanced"
      requires: ["custom_headers", "multiframe_rx"]
      writes: false
      verification: "hypothesis"
      notes: >
        Result identifiers: STAT_SERVICE_KMSTAND_DATA, STAT_SERVICE_DATUM_DATA,
        STAT_SERVICE_JAHR_WERT / _MONAT_WERT / _TAG_WERT,
        STAT_VENTILSPIELSERVICE_RESTWEG_WERT, STAT_VENTILSPIELSERVICE_ANZAHL_RESET_WERT.
