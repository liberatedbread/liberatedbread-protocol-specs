device:
  name: "SP107E/SP110E LED Controller"
  manufacturer: "SPLED"
  manufacturer_status: "unsupported"
  protocol: "ble"
  notes: >
    SPI LED pixel controllers used in LEDs2RAVE4/Lunchbox Dream LED products.
    SP107E (LED Chord) and SP110E (LED Hue) share the same BLE UUIDs but have
    different command bytes. SP107E adds music-reactive modes and matrix support.
    4-byte command format: [data1] [data2] [data3] [cmd_byte].
    Notifications arrive on the same FFE1 characteristic.
  identification:
    local_name_prefix: "SP1"
    service_uuids:
      - "0000ffe0-0000-1000-8000-00805f9b34fb"

services:
  - uuid: "0000ffe0-0000-1000-8000-00805f9b34fb"
    name: "LED Control Service"
    characteristics:
      - uuid: "0000ffe1-0000-1000-8000-00805f9b34fb"
        name: "Control"
        properties: ["write", "notify"]
        commands:
          # SP110E commands
          sp110e_power_on:
            description: "SP110E: Turn on"
            value: [0x00, 0x00, 0x00, 0xAA]
          sp110e_power_off:
            description: "SP110E: Turn off"
            value: [0x00, 0x00, 0x00, 0xAB]
          sp110e_set_color:
            description: "SP110E: Set static RGB color"
            template: ["{red}", "{green}", "{blue}", 0x1E]
            parameters:
              red:
                type: "uint8"
                min: 0
                max: 255
              green:
                type: "uint8"
                min: 0
                max: 255
              blue:
                type: "uint8"
                min: 0
                max: 255
          sp110e_set_brightness:
            description: "SP110E: Set brightness (0x00-0xFF)"
            template: ["{level}", 0x00, 0x00, 0x2A]
            parameters:
              level:
                type: "uint8"
                min: 0
                max: 255
          sp110e_set_effect:
            description: "SP110E: Set effect (0x01-0x78 dynamic, 0x79 static)"
            template: ["{mode}", 0x00, 0x00, 0x2C]
            parameters:
              mode:
                type: "uint8"
                min: 0
                max: 121
          sp110e_set_speed:
            description: "SP110E: Set animation speed (0x01-0xBA)"
            template: ["{speed}", 0x00, 0x00, 0x03]
            parameters:
              speed:
                type: "uint8"
                min: 1
                max: 186
          sp110e_status_query:
            description: "SP110E: Query device status (returns 12 bytes)"
            value: [0x00, 0x00, 0x00, 0x10]
          # SP107E commands
          sp107e_power_on:
            description: "SP107E: Turn on"
            value: [0x00, 0x00, 0x00, 0xAA]
          sp107e_power_off:
            description: "SP107E: Turn off"
            value: [0x00, 0x00, 0x00, 0xBB]
          sp107e_set_color:
            description: "SP107E: Set static RGB color"
            template: ["{red}", "{green}", "{blue}", 0x0C]
            parameters:
              red:
                type: "uint8"
                min: 0
                max: 255
              green:
                type: "uint8"
                min: 0
                max: 255
              blue:
                type: "uint8"
                min: 0
                max: 255
          sp107e_set_brightness:
            description: "SP107E: Set brightness"
            template: ["{level}", 0x00, 0x00, 0x0A]
            parameters:
              level:
                type: "uint8"
                min: 0
                max: 255
          sp107e_set_effect:
            description: "SP107E: Set effect (0x01-0xB4 dynamic, 0xB5 static)"
            template: ["{mode}", 0x00, 0x00, 0x08]
            parameters:
              mode:
                type: "uint8"
                min: 0
                max: 249
          sp107e_status_query:
            description: "SP107E: Query status (returns 26 bytes in 2 packets)"
            value: [0x00, 0x00, 0x00, 0x02]

entities:
  - platform: "light"
    name: "LED Strip"
    features: ["brightness", "color"]
    state_characteristic: "0000ffe1-0000-1000-8000-00805f9b34fb"
    commands:
      turn_on: "sp110e_power_on"
      turn_off: "sp110e_power_off"
      set_color: "sp110e_set_color"
      set_brightness: "sp110e_set_brightness"
