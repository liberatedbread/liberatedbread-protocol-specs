protocol_details:
  snmp_discovery:
    version: 0
    version_label: "SNMPv1"
    community: "public"
    transport: "udp"
    port: 161
    request_id:
      rule: "Generate a cryptographically fresh integer in 1..2147483647 for every newly encoded datagram, including the limited-broadcast fallback. Reuse an ID only for an identical retransmission. Match the response ID before accepting any values."
      verification: "reported"
    ordered_targets:
      - order: 1
        target: "Each active IPv4 interface's directed subnet broadcast"
        broadcasts: true
      - order: 2
        target: "255.255.255.255"
        broadcasts: true
        only_if: "No valid machine was found by the directed attempt; make this one limited fallback, not an unbounded address sweep."
    timeout_ms: 1000
    timeout_basis: "Reported monitor-app socket timeout, not a hardware requirement."
    required_response:
      community: "public"
      pdu: "GetResponse (0xa2)"
      error_status: 0
      error_index: 0
      request_id: "Same as the outstanding request"
      host_description_oid: "1.3.6.1.2.1.25.3.2.1.3.1"
      host_description_exact: "brother sewing"
      case_sensitive: true
    oids:
      - {oid: "1.3.6.1.2.1.1.1", role: "sysDescr diagnostics", required: false}
      - {oid: "1.3.6.1.2.1.1.5", role: "sysName/model field; not a matcher", required: false}
      - {oid: "1.3.6.1.2.1.1.6", role: "sysLocation/display name fallback", required: false}
      - {oid: "1.3.6.1.2.1.25.3.2.1.3.1", role: "host-resources device description", required: true, exact_value: "brother sewing"}
      - {oid: "1.3.6.1.2.1.27.1.1.2.103", role: "application name", required: false}
      - {oid: "1.3.6.1.2.1.27.1.1.6.103", role: "application operation status", required: false}
      - {oid: "1.3.6.1.4.1.2435.2.4.3.1240.5.2.3.0", role: "Brother IP data", required: false}
      - {oid: "1.3.6.1.2.1.2.2.1.6.1", role: "physical/MAC address identity", required: false}
    desktop_derived_request:
      provenance: "Design Database Transfer 1.2.0 static data; DESKTOP-DERIVED, NOT A NETWORK CAPTURE"
      request_id: 1
      length_bytes: 84
      oid_order:
        - "1.3.6.1.2.1.25.3.2.1.3.1"
        - "1.3.6.1.2.1.2.2.1.6.1"
        - "1.3.6.1.4.1.2435.2.4.3.1240.5.2.3.0"
      frame_hex: "30815102010004067075626c6963a08143020101020100020100308137300f060b2b060102011903020103010500300e060a2b0601020102020106010500301406102b0601040193030204038958050203000500"
      encoding: "BER: outer SEQUENCE, version 0, OCTET STRING public, GetRequest 0xa0, request ID, error status/index zero, three varbinds with NULL values and long-form lengths."
  https_monitoring:
    scheme: "https"
    port: 443
    allowed_methods: ["GET"]
    allowed_paths: ["/info", "/status", "/embinfo", "/embstatus"]
    read_timeout_ms: 8000
    timeout_basis: "Reported monitor-app read timeout, not a hardware limit."
    capability_gate:
      expression: "apis.monitoring.version > 0 OR apis.monitoringpr.version > 0 OR first_dotted_component(apis.monitoring.availableversion) == '1'"
      absent_or_zero: "Do not enable monitoring; absence is not converted into proof of support."
      model_id_rule: "Never require or infer an EV1-specific numeric model ID."
    tofu:
      verification: "trust_on_first_use"
      approval_required_before_first_get: true
      fingerprint: "SHA-256 of the presented DER certificate, lowercase colon-separated hex"
      persist: "Bind the approved certificate or fingerprint to machine-id (and MAC when available), not to a model family."
      changed_certificate: "Stop and ask the user again; never automatically accept a replacement."
      forbidden: ["trust-all certificates", "trust-all hostnames", "disabled certificate verification", "unverified fallback to HTTP"]
      vendor_defect_not_reproduced: "The reviewed vendor client disables both certificate-chain and hostname verification. This is a defect to correct, not interoperability evidence."
    json_parser:
      unknown_properties: "Ignore unknown properties at every object/array element; they never change known-field meanings. Preserve the raw document for forward diagnostics when practical."
      known_property_types: "Require the declared JSON types when a known property is present. A wrong type is an error, not a coerced zero/false."
      missing_properties: "Leave unavailable rather than defaulting to a real measurement. Capability fields are the exception only in that missing means unsupported."
      unknown_status_values: "Render unknown(<numeric value>) without assigning a known state, ready label or error class."
      numeric_ranges: "RGB components accept 0..255; negative colorchange means not a change; ids and counters are not silently clamped."
      content: "Parse one JSON object, reject trailing non-whitespace data and truncated JSON."
  status_codes:
    source: "Monitor app's current status-to-display mapping, reported rather than hardware-confirmed."
    values:
      10: "ready_home_embroidery"
      11: "ready_home_embroidery"
      12: "ready_pr"
      30: "embroidering"
      40: "waiting_for_thread"
      41: "paused"
      42: "stopped"
      50: "finished"
      60: "thread_error"
      61: "thread_error"
      62: "thread_broken_error"
      63: "other_error"
      70: "other_error"
      98: "settings_screen"
      99: "other_error"
    default: "waiting in the vendor app; a safe replacement MUST instead return unknown(<value>) because an unlisted value has no established meaning"
    helper_states_not_wire_values: ["monitoring_connection_error", "app_waiting_placeholder"]
  model_compatibility:
    rule: "The variant list records documented My Stitch Monitor compatibility, not a model-ID discovery matcher. Actual monitoring still requires exact SNMP identity plus /info capability and a user-approved certificate."
    entries:
      - {models: ["EV1", "EV1LE"], evidence: "Official app list (spelled EV1-LE) and shared operation manual."}
      - {models: ["BX1", "BX1E", "CX1E"], evidence: "Official app list; sewing-only CX1 is not claimed."}
      - {models: ["XP2", "XP3", "XJ2", "XE2", "BP3700", "PR1055X", "PR680W"], evidence: "Official app list."}
      - {models: ["XP1", "XJ1", "XE1", "BP3600"], evidence: "Official app list; Upgrade Kit I is required."}
      - {models: ["PR1060W"], evidence: "Official product page explicitly names My Stitch Monitor, although the global app list omitted this model when checked; treat that discrepancy as unresolved rather than dropping the model or claiming the whole PR family."}
    exclusions:
      - "PP1/PP1E use a separate BLE protocol and are not monitoring variants."
      - "Artspira or Design Database Transfer support alone does not prove My Stitch Monitor support; NQ/NS/PE/SE/LB Wi-Fi models are therefore not added."
      - "CX1, Dream Machine, Quattro, Essence, PR1050X and other models absent from the monitor evidence are not claimed."
  excluded_operations:
    executable: false
    categories:
      - "POST, PUT, PATCH and DELETE of every kind"
      - "design/embroidery transfer and any motion, start, stop or stitch operation"
      - "hoop/MDC image upload, current/progress image download and lens calibration"
      - "push registration, push notifications and cloud token exchange"
      - "firmware download, activation, update and update-status probing"
      - "PE-DESIGN Link and Design Database Transfer writes"
    rule: "Do not turn shared-library method names into endpoints. Only the four entries in http_endpoints are allowed."

remaining_unknowns:
  - "No live SNMP response, TLS certificate or JSON document has been captured; every endpoint and field remains reported and interoperability is unverified."
  - "Physical units for feature/hoop/design/x/y coordinates, previewresolution, hoopresolution, postsize and storage capacity/free are unestablished."
  - "Semantics of emb, linkstatus, hoop.type, numeric model/type and most OEM values are unestablished."
  - "Compatibility-list discrepancy for PR1060W needs a live check; BP regional aliases and exact upgrade/firmware states need per-unit confirmation."
  - "Reset-to-default and network-reset screens are not established for every listed variant; use the exact model manual instead of generalizing the procedures here."
  - "Concurrent-client limits, certificate rotation behavior, error responses and whether every listed firmware exposes identical JSON field presence are unknown."
  - "Write, design-transfer, image, push, lens and firmware protocols are intentionally not reverse engineered or declared by this spec."

