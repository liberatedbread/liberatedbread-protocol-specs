evidence:
  app_static_analysis: >
    The current and earliest public My Stitch Monitor Android implementations
    supplied the ordered directed/limited broadcast discovery, exact host
    description, OID roles, four read-only paths, capability versions, JSON
    property names/types, time units and status mapping. Their write-capable
    shared methods were reviewed only to exclude them. No vendor internal
    symbols are reproduced here.
  desktop_static_analysis: >
    Design Database Transfer 1.2.0 independently supplied an 84-byte SNMPv1
    request containing host description, physical address and Brother IP-data
    varbinds. It is a static executable-data derivation, not a capture and not
    evidence that design transfer is safe or understood.
  documentation_review: >
    Brother's official app compatibility page, PR1060W product page and model
    manuals supplied variant coverage, upgrade-kit requirements, wireless
    provisioning, saved-network rejoin and model-specific reset procedures.
    All linked manuals were checked as resolving on 2026-11-17.
  tls_defect_analysis: >
    The vendor client's certificate-chain and hostname checks were found to be
    permissive. The spec deliberately replaces them with explicit user-approved
    TOFU/pinning and never treats that vendor defect as a compatibility need.
  open_questions: >
    No hardware evidence establishes actual certificate contents, complete
    response documents, coordinate/storage units, field-presence variation,
    concurrent-client behavior or per-model reset consistency. Unknown JSON
    fields and unknown status codes must remain forward-tolerant.
  artifacts:
    - type: "static_analysis"
      artifact: "Brother My Stitch Monitor Android 2.1.5 (34) and 1.0.0"
      obtained_via: "Public APK mirror, preserved and signature-verified by the research project on 2026-11-10"
      description: "Discovery, HTTPS paths, JSON models, capability gate, status mapping and unsafe TLS behavior."
    - type: "static_analysis"
      artifact: "Brother Design Database Transfer 1.2.0"
      obtained_via: "Official Brother public installer, 2026-11-10"
      description: "Independent desktop-derived 84-byte SNMPv1 request; no transfer protocol adopted."
    - type: "vendor_documentation"
      artifact: "Official My Stitch Monitor compatibility page and PR1060W product page, reviewed 2026-11-17"
      description: "Model roster, Upgrade Kit I requirements and the PR1060W compatibility-list discrepancy."
    - type: "vendor_documentation"
      artifact: "EV1/EV1LE, XP3, XP1 Upgrade Kit I, PR1055X/PR1060W and PR1060W-addendum manuals"
      description: "Wireless setup/rejoin and variant-scoped reset procedures; no procedure was executed by this project."
