device:
  name: "Meross Wi-Fi Plugs, Switches and MSG100 Garage Opener"
  manufacturer: "Meross / Chengdu Meross Technology"
  manufacturer_status: "active"
  testing:
    status: "untested"
    notes: >
      No appliance, garage door, setup AP, UDP discovery or HTTP request was run.
      Facts are reported from Meross 3.41.1 static analysis, MerossIot,
      meross_lan and arandall/meross. All account IDs, UUIDs, MACs, keys and
      vectors are synthetic; no garage or mains relay was actuated.
  protocol: "wifi"
  category: "switch"
  type: "signed-lan-appliance-platform"
  transport: "http"
  integration: "identify_only"
  openness:
    status: "undocumented"
    reverse_engineered: true
    source_code: "https://github.com/krahabb/meross_lan"
    license: "MIT"
    notes: "The local JSON protocol is community-documented, not an official open API. meross_lan and MerossIot are maintained implementation references."
  safety_advisory:
    severity: "warning"
    summary: "A garage-door command can move the door without line of sight; the wired contact sensor is not a safety interlock."
    detail: >
      MSG100 relay output can start a door moving and can close onto a person,
      animal, vehicle or obstruction. Require an attended action and a clear
      opening, follow the opener's own safety instructions, and verify the physical
      door and photo-eye/obstruction systems. Never treat GarageDoor.State.open
      as proof that unattended closing is safe. This project's integration is
      experimental and unaffiliated with Meross.
    acknowledge_required: true
    advisory_url: "https://d386u2e9lj99mt.cloudfront.net/public/staticfile/1688608956001/6946162.pdf"
  notes: >
    SCOPE: Meross Wi-Fi plugs/switches using Appliance.Control.ToggleX and the
    MSG100 garage opener using Appliance.GarageDoor.State. The shared signed
    envelope, UDP discovery and optional Encrypt.Suite body protection apply to
    both. Bulbs, thermostats, hubs, BLE-only sensors, Matter and roller shutters
    are outside this version.

    Integration is identify_only because no dedicated Meross discovery, signed
    envelope, Encrypt.Suite and bound-identity handler exists here. Documentary
    commands require that transform and are not plain JSON posts for a generic
    consumer. The protocol itself is native LAN once the matching account key is
    known; identify_only is not a claim that local control is impossible.
  identification:
    lan_protocols: ["meross-udp-9988"]
    default_port: 80
    notes: "A valid UDP-9988 JSON reply with uuid/mac/deviceType is the strong signal. Never infer Meross from HTTP/80 or a MAC prefix."
  discovery:
    methods:
      - type: "udp_broadcast"
        udp_broadcast:
          port: 9988
          listen_port: 9989
          broadcast_address: "255.255.255.255"
          probe_hex: "7b226964223a226531306164633339343962613539616262653536653035376632306638383365222c226465764e616d65223a222a227d"
          passive_ok: false
          response_format: "json"
          identity_mapping:
            stable_keys:
              - source: "json:uuid"
              - source: "json:mac"
            display:
              source: "json:devName"
          response_match:
            - source: "json:uuid"
              match: "regex"
              value: "^[0-9a-fA-F-]{32,36}$"
              description: "Bound-device replies carry a Meross UUID; match it to the intended account/device before control."
        notes: >
          Bind client UDP 9989 before sending to broadcast 9988. The vector uses
          userid 123456: id = MD5(userid), devName = *. Send once per second for
          five sends and read replies (up to 300 bytes in the reviewed app) for
          five seconds. Match UUID/MAC to the intended bound device.
    identity:
      stable_keys: ["uuid", "mac"]
      display: "devName"
    static_ip_required: false
  setup:
    required: true
    confidence: "medium"
    notes: >
      Two different credential paths exist. Stock setup binds the appliance to a
      Meross account and the owner retains that account key. On supported legacy
      setup-AP firmware, an owner can instead choose a new user ID/key and MQTT
      broker through Config.Key. The latter does not reveal an existing stock key
      and is not universal recovery, especially where setup requires Encrypt.ECDHE.
    methods:
      - type: "softap_http"
        name: "Supported legacy AP with owner-selected Config.Key"
        role: "primary"
        verified: false
        description: >
          For a model/firmware known to accept the legacy plaintext setup-AP
          flow, join the device AP, read System.All/Ability, choose new account
          material and an owner-controlled MQTT broker, then write Config.Key
          before Wi-Fi provisioning. Stop and use another supported route if the
          device requires Encrypt.Suite/ECDHE; that setup exchange is unresolved.
        softap:
          ssid_prefix: "Meross_"
          open_network: true
          gateway_ip: "10.10.10.1"
          port: 80
        steps:
          - action: "Join the exact model's setup AP after using its manual's setup procedure."
            actor: "user"
            expect: "The client can reach http://10.10.10.1/config."
          - action: "GET Appliance.System.All and Appliance.System.Ability in cleartext and record uuid, hardware MAC and supported namespaces."
            actor: "client"
            expect: "Identity is bound to the physical unit; if Encrypt.Suite is required for setup, stop rather than treating legacy Config.Key as universal."
          - action: "Choose a new user ID/key and compatible owner-controlled broker; send Appliance.Config.Key with primary and secondary gateway set to that broker."
            actor: "client"
            expect: "The selected key, not a recovered Meross key, will authenticate later LAN signatures and bound-device encryption."
          - action: "Provision Wi-Fi with the model-appropriate Config.Wifi or Config.WifiX shape, then rediscover by UUID/MAC on the LAN."
            actor: "client"
            expect: "The appliance joins the chosen network and answers signed local requests."
      - type: "cloud_account"
        name: "Official Meross app and existing account key"
        role: "alternative"
        verified: false
        description: "Provision in the official app, then retain the account key/user ID for subsequent signed LAN requests; no cloud round trip is needed for established local control."
        cloud:
          provider: "Meross account onboarding"
          local_alternative: "Established LAN control uses the saved key locally. Supported legacy AP owners may instead choose new Config.Key material; neither path extracts the other path's key."
        issues_credentials:
          account_key:
            user_entered: true
            notes: "The existing stock Meross account key, or the different key deliberately selected during supported legacy Config.Key provisioning."
          device_uuid:
            user_entered: true
            notes: "The bound appliance UUID read from UDP discovery or Appliance.System.All and matched to that account key."
        steps:
          - action: "Add the exact model in the Meross app and bind it to the owner's account on a 2.4 GHz network."
            actor: "user"
            expect: "The appliance is provisioned and appears in UDP discovery."
          - action: "Store the account user ID/key securely and bind discovered UUID/MAC to that account before signing or deriving Encrypt.Suite keys."
            actor: "client"
            expect: "GET/SET signatures verify locally without contacting Meross cloud."
    factory_reset:
      applicable: "unknown"
      confidence: "low"
      effect: >
        A single cross-family reset procedure and the survival of Config.Key,
        Wi-Fi, relay schedules and garage pairing were not established. Do not
        substitute a short relay press, RF pairing or MQTT reconfiguration for a
        factory reset; consult the exact MSS/MSG model guide before clearing it.
      description: "The MSS110 and MSG100 manuals are linked below, but this spec does not generalize an unreviewed button hold to both families."
    rejoin:
      in_place_supported: false
      requires_factory_reset: false
      notes: >
        Re-enter the exact model's setup/AP flow to replace Wi-Fi. A setup or
        pairing mode is not automatically a full factory reset. Config.Key chooses
        account/broker material, not the Wi-Fi SSID; Config.Wifi/WifiX is a separate step.
      steps:
        - action: "Use the exact model guide to enter setup mode, preserving the old LAN configuration until the new credentials are ready where possible."
          actor: "user"
        - action: "Reprovision Wi-Fi and either retain verified stock account material or deliberately choose new Config.Key material on a supported legacy AP."
          actor: "client"
          expect: "Rediscovery resolves the same UUID/MAC; if the key changed, all clients must be updated."
    credentials:
      wifi_passphrase_protection: "device_encrypted"
      stored_on_device:
        - "Wi-Fi credentials"
        - "Account user ID/key and MQTT broker configuration"
        - "Garage/relay state and model-specific schedules"
      issued_to_client:
        - "Stock Meross account user ID/key, or owner-selected replacement user ID/key"
        - "Bound UUID and hardware MAC used to derive Encrypt.Suite key"
      notes: >
        Legacy Config.Wifi only Base64-encodes credentials; Config.WifiX uses the
        documented device-derived AES-256-CBC transform on capable firmware.
        Signed MD5 headers and fixed-IV CBC do not provide modern replay/integrity
        protection. Keep account keys out of logs and use a trusted segmented LAN.
  pairing:
    required: true
    confidence: "medium"
    security_mode: "app_layer"
    bonding: "none"
    pin:
      source: "user_chosen"
      notes: "The secret is the stock account key or a key deliberately selected during supported legacy Config.Key provisioning, not a device-label PIN."
    exclusivity:
      single_connection: false
      single_bond: false
      recovery: "Close competing writers and rediscover by UUID/MAC. A wrong account key must fail visibly rather than falling back to another identity or cloud relay."
    unpair:
      supported: true
      requires_factory_reset: false
      clears: "On a supported legacy setup AP, deliberately replacing Config.Key replaces the shared account/broker credential used by every client; it does not extract or selectively revoke the old stock key."
      notes: "Update every owner client after replacement. No per-client cryptographic identity is created."
    enter_pairing_mode:
      required: true
      notes: "Changing provisioning credentials requires the exact model's setup AP; steady-state signed LAN control does not require a button press."
    notes: >
      Local authorization is possession of shared account material plus the bound
      UUID/MAC. There is no universal default key and no supported bypass for an
      Encrypt.Suite setup flow whose ECDHE reply is not established.
  variants:
    - model: "MSS plugs and switches"
      identification: { model_prefix: "MSS" }
      notes: "ToggleX relay channels; no energy/light capabilities are inferred."
    - model: "MSG100"
      identification: { model_prefix: "MSG100" }
      notes: "GarageDoor.State channel 0 plus wired contact state. MSG150/MSG200 are not asserted by this version."

protocol_details:
  envelope:
    verification: "reported"
    endpoint: "POST http://<address>/config (and http://10.10.10.1/config on setup AP), Connection: close."
    shape: '{"header":{...},"payload":{...}}'
    required_header:
      messageId: "32 lowercase hexadecimal characters; the app uses MD5(random 16 [a-z0-9] chars || epoch seconds)."
      timestamp: "Integer epoch seconds, converted to decimal text for signing."
      sign: "MD5(messageId || account_key || timestamp) as 32 lowercase hexadecimal characters."
      method: "GET or SET for requests; accept GETACK, SETACK, PUSH and ERROR in replies."
      namespace: "Full Appliance.* namespace."
      payloadVersion: 1
      from: "Full request URL on LAN/AP: http://<address>/config."
      triggerSrc: "AndroidLocal on the reviewed local path; a replacement client may use a stable local identifier only if firmware accepts it."
      uuid: "Target bound device UUID."
    reply_validation:
      correlation_first:
        - "Require header.messageId to equal the exact outstanding request messageId, not merely a valid MD5 input or a recent response."
        - "Require header.namespace to equal the request's full expected Appliance.* namespace. A valid response for another namespace is not this command's response."
      acknowledgement:
        - "For a normal reply, require method == GETACK when the request was GET, or SETACK when it was SET. Do not accept GET, SET, PUSH, SETACK-for-GET or GETACK-for-SET."
        - "Only after exact ID, namespace and acknowledgement method match, recompute MD5(reply.messageId || account_key || reply.timestamp) and require the reply sign and bound UUID. Only then decode or act on payload."
      error_path: "method == ERROR is a separate device-failure path. After exact ID/namespace correlation, verify its signature and UUID, then surface payload.error.code; never require an ACK method or interpret normal payload as success."
      unsolicited_push: "PUSH has no outstanding-request correlation. Handle it separately as a state notification after UUID/signature checks, never as the answer that completes an in-flight command."
      uncorrelated_transport: "If a reply lacks the exact ID or arrives while no matching request is outstanding, reject it and serialize the next request with a fresh messageId. Never match replies by arrival order, reuse IDs to make correlation pass, or allow an old reply to complete a later write."
    test_vector:
      account_key: "0123456789abcdef0123456789abcdef"
      message_id: "00112233445566778899aabbccddeeff"
      timestamp: 1700000000
      expected_sign: "74bff5fbbf209aa2a54956093e9ae9ed"
  udp_discovery:
    verification: "reported"
    client_port: 9989
    destination: "255.255.255.255:9988"
    send_count: 5
    interval_seconds: 1
    receive_seconds: 5
    reply_limit_bytes: 300
    request: '{"id":md5(decimal_userid),"devName":"*"}'
    test_vector:
      userid: "123456"
      id: "e10adc3949ba59abbe56e057f20f883e"
      request_json: '{"id":"e10adc3949ba59abbe56e057f20f883e","devName":"*"}'
      probe_hex: "7b226964223a226531306164633339343962613539616262653536653035376632306638383365222c226465764e616d65223a222a227d"
  encrypt_suite:
    verification: "reported"
    negotiation: "If System.Ability contains Appliance.Encrypt.Suite, GET that namespace in cleartext. This version supports only ka=ecdhe256, se=mrskey, ds empty for bound-device control."
    cipher: "AES-256-CBC, no cipher padding mode; append zero bytes to a 16-byte multiple (always add a full zero block when already aligned), Base64 raw HTTP body. Decrypt and strip trailing zero bytes before JSON parsing. There is no MAC."
    iv_ascii: "0000000000000000"
    key_derivation: 'MD5_hex(uuid[3:22] || account_key[1:9] || mac || account_key[10:28]); use the 32 lowercase hexadecimal ASCII characters as the 32-byte AES-256 key. MAC spelling comes from system.hardware.macAddress and must match exactly.'
    cleartext_namespace_exemptions:
      - "Appliance.System.All"
      - "Appliance.System.Firmware"
      - "Appliance.System.Ability"
      - "Appliance.Encrypt.Suite"
      - "Appliance.Encrypt.ECDHE"
    setup_boundary: "Unbound ECDHE on secp256r1 is reported but its reply field/complete setup exchange is unresolved. Bound-device key derivation must not be presented as a setup bypass."
    test_vector:
      account_key: "0123456789abcdef0123456789abcdef"
      uuid: "20000000-0000-4000-8000-020000000001"
      mac: "02:00:00:00:00:01"
      input_material: "00000-0000-4000-8001234567802:00:00:00:00:01abcdef0123456789ab"
      key_ascii_hex: "6636373338663061333761613463633037353931646264316231323135636438"
      plaintext_json: '{"togglex":{"channel":0,"onoff":1}}'
      ciphertext_base64: "5DIXQIq3trBKMFNny/RAyKGMrYLuOPFTokOEUqOQF81k3Qcms51dZFypbuDyPG/I"
  config_key:
    verification: "reported"
    namespace: "Appliance.Config.Key"
    method: "SET"
    payload_shape: '{"key":{"userId":"<userid>","key":"<account-key>","gateway":{"host":"<broker>","port":443,"secondHost":"<broker>","secondPort":443,"redirect":0}}}'
    boundary: "Owner-selected replacement credentials for supported legacy AP provisioning only. It does not retrieve an existing key, authorize an unknown device, or prove arbitrary broker/TLS settings work on every firmware."
  namespaces:
    system_all: "GET Appliance.System.All with payload {}; supplies system.firmware.innerIp, system.hardware.macAddress, digest relay/garage state and identity."
    togglex: "GET/SET Appliance.Control.ToggleX with {togglex:{channel:n,onoff:0|1}}. SET changes a real mains relay."
    garage_get: "GET Appliance.GarageDoor.State with {state:{channel:0}}."
    garage_set: "SET Appliance.GarageDoor.State with {state:{channel:0,open:0|1,uuid:<device-uuid>}}. open=1 requests open, open=0 requests close; actual contact state must be read back."
    multiple: "Appliance.Control.Multiple can wrap inner {header:{namespace,method},payload} messages; do not nest Multiple or System.All."

http_endpoints:
  - method: "POST"
    path: "/config"
    name: "Signed Meross JSON message"
    description: "Cleartext header/payload envelope, or raw Base64 Encrypt.Suite body for non-exempt namespaces. Always target the discovered UUID/MAC."
    request_body:
      content_type: "application/json"
      fields:
        - {name: "header", type: "object", required: true}
        - {name: "payload", type: "object", required: true}
      example: |
        {"header":{"messageId":"00112233445566778899aabbccddeeff","timestamp":1700000000,"sign":"74bff5fbbf209aa2a54956093e9ae9ed","method":"GET","namespace":"Appliance.System.All","payloadVersion":1,"from":"http://192.0.2.10/config","triggerSrc":"AndroidLocal","uuid":"20000000-0000-4000-8000-020000000001"},"payload":{}}
    response_body:
      content_type: "application/json"
      fields:
        - {name: "header", type: "object"}
        - {name: "payload", type: "object"}
      example: |
        {"header":{"messageId":"00112233445566778899aabbccddeeff","timestamp":1700000000,"sign":"74bff5fbbf209aa2a54956093e9ae9ed","method":"GETACK","namespace":"Appliance.System.All","payloadVersion":1,"from":"http://192.0.2.10/config","uuid":"20000000-0000-4000-8000-020000000001"},"payload":{"all":{"system":{"hardware":{"macAddress":"02:00:00:00:00:01"}},"digest":{"togglex":[{"channel":0,"onoff":0}]}}}}
    verification: "reported"

commands:
  get_system_all:
    description: "Read identity, abilities and current relay/garage digest in the always-cleartext System.All namespace."
    transport: "http"
    method: "POST"
    path: "/config"
    body: '{}'
    namespace: "Appliance.System.All"
    http_method: "GET"
    body_transform: "Wrap in the signed Meross envelope; System.All is exempt from Encrypt.Suite."
    parameters:
      account_key: { type: "string", required: true, source: "credential:account_key" }
      device_uuid: { type: "string", required: true, source: "credential:device_uuid" }
    returns:
      - {name: "all.system.hardware.macAddress", type: "string"}
      - {name: "all.digest.togglex", type: "array", description: "Per-channel onoff 0/1 when present."}
      - {name: "all.digest.garageDoor", type: "array", description: "Per-channel contact state when present; not a safety interlock."}
    verification: "reported"
  togglex_on:
    description: "SET ToggleX channel 0 onoff=1 through the signed/encrypted Meross transform."
    transport: "http"
    method: "POST"
    path: "/config"
    body: '{"togglex":{"channel":0,"onoff":1}}'
    namespace: "Appliance.Control.ToggleX"
    http_method: "SET"
    body_transform: "Signed envelope; Encrypt.Suite AES-256-CBC when advertised."
    parameters:
      account_key: { type: "string", required: true, source: "credential:account_key" }
      device_uuid: { type: "string", required: true, source: "credential:device_uuid" }
    advanced: true
    advanced_reason: "Attended mains relay write: onoff=1 can energize equipment. Confirm the channel and attached load, then read back System.All."
    verification: "reported"
  togglex_off:
    description: "SET ToggleX channel 0 onoff=0 through the signed/encrypted Meross transform."
    transport: "http"
    method: "POST"
    path: "/config"
    body: '{"togglex":{"channel":0,"onoff":0}}'
    namespace: "Appliance.Control.ToggleX"
    http_method: "SET"
    body_transform: "Signed envelope; Encrypt.Suite AES-256-CBC when advertised."
    parameters:
      account_key: { type: "string", required: true, source: "credential:account_key" }
      device_uuid: { type: "string", required: true, source: "credential:device_uuid" }
    advanced: true
    advanced_reason: "Attended mains relay write: removing power may interrupt equipment or its shutdown sequence. Confirm the load and read back System.All."
    verification: "reported"
  get_garage_state:
    description: "GET GarageDoor.State channel 0; use actual contact/digest state rather than assuming the last command succeeded."
    transport: "http"
    method: "POST"
    path: "/config"
    body: '{"state":{"channel":0}}'
    namespace: "Appliance.GarageDoor.State"
    http_method: "GET"
    body_transform: "Signed envelope; Encrypt.Suite AES-256-CBC when advertised."
    parameters:
      account_key: { type: "string", required: true, source: "credential:account_key" }
      device_uuid: { type: "string", required: true, source: "credential:device_uuid" }
    returns:
      - {name: "state.channel", type: "integer"}
      - {name: "state.open", type: "integer", description: "0 closed / 1 open when reported; not a safety verdict."}
    verification: "reported"
  garage_open:
    description: "Attended SET GarageDoor.State channel 0 open=1 with the bound UUID."
    transport: "http"
    method: "POST"
    path: "/config"
    body: '{"state":{"channel":0,"open":1,"uuid":"{device_uuid}"}}'
    namespace: "Appliance.GarageDoor.State"
    http_method: "SET"
    body_transform: "Signed envelope; Encrypt.Suite AES-256-CBC when advertised."
    parameters:
      account_key: { type: "string", required: true, source: "credential:account_key" }
      device_uuid: { type: "string", required: true, source: "credential:device_uuid" }
    advanced: true
    advanced_reason: "The door may open immediately and remain unattended. Confirm identity, location and obstructions; monitor actual contact state to completion."
    verification: "reported"
  garage_close:
    description: "Attended SET GarageDoor.State channel 0 open=0 with the bound UUID; never an unattended-close automation."
    transport: "http"
    method: "POST"
    path: "/config"
    body: '{"state":{"channel":0,"open":0,"uuid":"{device_uuid}"}}'
    namespace: "Appliance.GarageDoor.State"
    http_method: "SET"
    body_transform: "Signed envelope; Encrypt.Suite AES-256-CBC when advertised."
    parameters:
      account_key: { type: "string", required: true, source: "credential:account_key" }
      device_uuid: { type: "string", required: true, source: "credential:device_uuid" }
    advanced: true
    advanced_reason: "The door can close onto a person, animal or vehicle without line of sight. Keep the opening clear and watched until physically closed; the contact sensor is not an interlock."
    verification: "reported"
  owner_config_key:
    description: "Legacy setup-AP-only Config.Key provisioning with deliberately selected account/broker material."
    transport: "http"
    method: "POST"
    path: "/config"
    body: '{"key":{"userId":"{user_id}","key":"{account_key}","gateway":{"host":"{mqtt_host}","port":443,"secondHost":"{mqtt_host}","secondPort":443,"redirect":0}}}'
    namespace: "Appliance.Config.Key"
    http_method: "SET"
    body_transform: "Signed legacy setup-AP envelope; do not send on an unknown Encrypt.Suite/ECDHE setup flow."
    parameters:
      user_id: { type: "string", required: true, description: "Owner-selected replacement user ID." }
      account_key: { type: "string", required: true, description: "Owner-selected replacement shared key, not recovered stock material." }
      mqtt_host: { type: "string", required: true, description: "Owner-controlled broker hostname compatible with this firmware's transport/TLS expectations." }
    advanced: true
    advanced_reason: "Rebinds account and MQTT configuration on the physical appliance and invalidates clients using the old key. Use only on the supported legacy setup AP after recording recovery details."
    verification: "reported"

entities:
  - platform: "switch"
    name: "Relay Channel 0 (documentary)"
    variants: ["MSS plugs and switches"]
    state_command: "get_system_all"
    state_mapping: { is_on: "all.digest.togglex[0].onoff", on_when: "nonzero" }
    commands:
      turn_on: "togglex_on"
      turn_off: "togglex_off"
    notes: "identify_only and advanced: requires a dedicated signed/encrypted handler and attended write confirmation."
  - platform: "cover"
    name: "Garage Door Channel 0 (documentary)"
    variants: ["MSG100"]
    device_class: "garage"
    state_command: "get_garage_state"
    state_mapping: { is_open: "state.open", on_when: "nonzero" }
    commands:
      open_cover: "garage_open"
      close_cover: "garage_close"
    notes: "identify_only and advanced: never offer unattended close. Actual contact state does not replace physical safety systems."

local_access:
  status: "native"
  summary: "Bound Meross appliances accept signed JSON on LAN HTTP, with optional Encrypt.Suite body encryption; supported legacy AP provisioning can use owner-selected Config.Key material."
  covers:
    - "UDP 9988/9989 discovery and UUID/MAC binding"
    - "ToggleX plugs/switches and MSG100 garage state/control"
    - "Stock account-key local control or deliberately re-provisioned owner-selected credentials"
  not_covered:
    - "Existing stock-key recovery or universal legacy/ECDHE setup"
    - "BLE-only devices, lights, hubs, thermostats, roller shutters and Matter"
    - "Unattended garage closing, generic safe relay automation or official cloud remote access"
cloud:
  required: false
  vendor_service: "Meross cloud supplies stock account onboarding and MQTT remote access; established LAN messages do not traverse it."
  failure_mode: "A saved stock key keeps local control working. An owner-selected Config.Key installation needs its compatible owner broker only for MQTT, not for LAN /config. Unknown keys and unsupported setup flows cannot be bypassed."

evidence:
  app_static_analysis: >
    Meross 3.41.1 established /config LAN and 10.10.10.1 AP behavior, UDP ports
    and timing, envelope/signature, Encrypt.Suite derivation and exemptions,
    Config.Key and ToggleX/GarageDoor payload shapes.
  documentation_review: >
    MerossIot, meross_lan and arandall/meross cross-checked the same fields.
    Custom-Meross-Pairer 29cb6c6 independently confirms owner-selected Config.Key
    as provisioning, not stock-key recovery. Official MSS110/MSG100 manuals are
    linked for model setup and safety.
  open_questions: >
