# AUTOBABA LED Backpack device spec (LOY SPACE protocol)
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0

device:
  name: "AUTOBABA LED Backpack"
  manufacturer: "LOY SPACE / popled.cn"
  manufacturer_status: "abandoned"
  protocol: "ble"
  notes: >
    Programmable full-color LED backpack screen. Uses the LOY SPACE / popled.cn protocol
    (identical to NYAN GEAR). Supports BLE and Wi-Fi (AP mode, SSID starts with "YS",
    default password 12345678, UDP port 9090).
    BLE device name starts with "YS" or "TL".
    Packet format: [0xAA, 0x55, addr_hi, addr_lo, len_hi, len_lo, sno_hi, sno_lo, flags, type, ...payload].
    Commands are JSON-based, serialized to binary TLV packets.
    Images sent as 24-bit uncompressed BMP.
    Supports multiple resolutions: 16x16, 32x16, 32x32, 48x28, 64x20, 64x64, 96x128, 160x32, 192x40.
    Backend API: store-cdn.popled.cn.
    Sliding window ACK protocol with max window size 3-10.
  identification:
    local_name_prefix: "YS"
    service_uuids:
      - "0000fff0-0000-1000-8000-00805f9b34fb"

services:
  - uuid: "0000fff0-0000-1000-8000-00805f9b34fb"
    name: "LOY SPACE BLE Service"
    characteristics:
      - uuid: "0000fff1-0000-1000-8000-00805f9b34fb"
        name: "Notify"
        properties: ["read", "notify"]

      - uuid: "0000fff2-0000-1000-8000-00805f9b34fb"
        name: "Write"
        properties: ["write"]
        commands:
          power_toggle:
            description: "Toggle screen power. JSON: {power:{type:0}}"
            value: []
          set_brightness:
            description: "Set brightness 0-15. JSON: {light:{type:0, value_fix:N}}"
            value: []
          get_device_info:
            description: "Query device info. JSON: {get:'dev_info'}"
            value: []
          get_power_state:
            description: "Query power state. JSON: {get:'power'}"
            value: []
          get_brightness:
            description: "Query brightness. JSON: {get:'light'}"
            value: []
          delete_all_programs:
            description: "Delete all programs. JSON: {delete:{del_all:1}}"
            value: []
          set_rotation:
            description: "Set screen rotation. JSON: {rotate:N}"
            value: []
          play_program:
            description: "Play a program by index. JSON: {pgm_play:{model:0, index:N}}"
            value: []

entities:
  - platform: "light"
    name: "LED Screen"
    features: ["brightness"]
    commands:
      set_brightness: "set_brightness"
