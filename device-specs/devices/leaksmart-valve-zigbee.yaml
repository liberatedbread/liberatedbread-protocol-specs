# LeakSmart / Waxman Zigbee whole-home water shut-off valve
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# Community protocol recovery only: Arcus/Iris partner drivers at a02ad0e9 and
# the independent Hubitat driver. Neither vendor phone app speaks Zigbee.
# No valve, coordinator, radio capture or actuation was used by this project.

device:
  name: "LeakSmart Zigbee Water Valve"
  manufacturer: "Waxman Consumer Products Group"
  manufacturer_status: "shutdown"
  testing:
    status: untested
    notes: >
      No LeakSmart valve, leak sensor, hub or Zigbee capture was available.
      Fingerprints, ZCL commands, reporting, alert/event handling and the join
      procedure come from the pinned Arcus/Iris partner drivers, cross-checked
      against the public Hubitat driver and the valve installation manual.
      All wire facts are reported; no open/close was sent.
  protocol: "zigbee"
  category: "irrigation"
  type: "water-shutoff-valve"
  aliases:
    - "leakSMART automatic shut-off valve"
    - "LeakSmart 8811100"
    - "LeakSmart 8815000"
    - "Waxman Smart Valve"
  companion_apps:
    - name: "LeakSmart"
      package: "com.waxman.mobile.volansys"
      role: "historical"
      platform: "android"
      notes: "Hub 3.0 app. It manages the hub/cloud, not the valve's Zigbee link; the cloud is dead and no app route is required by this spec."
    - name: "LeakSmart Classic"
      package: "com.waxman.mobile"
      role: "historical"
      platform: "android"
      notes: "Hub 2.0 app. Like the newer app, it supplies no phone-direct Zigbee control surface."
  notes: >
    Whole-home Zigbee HA 1.2 water shut-off valve. The rescue path is a
    replacement Zigbee coordinator, not either defunct vendor cloud or a phone
    directly. Endpoint 1 uses ordinary HA On/Off for the motor: On (0x01) opens
    and Off (0x00) closes. Power Configuration battery voltage is an unsigned
    byte in 0.1 V units. Appliance Events and Alerts carries obstruction and
    self-test outcomes and is mandatory for a safe integration.

    There is intentionally no generic cover/valve command binding. OPEN and
    CLOSE are documented below as advanced, attended operations for a dedicated
    Zigbee handler. A coordinator may host an explicitly owner-configured
    leak-to-close automation, but discovery, an On/Off transition, a monthly
    self-test or a readback must never itself trigger a motor command.

    The valve is a sleepy end device, not a router, despite its 9 V adapter;
    four AA cells provide backup. Re-pairing removes the old hub's leak-to-close
    logic. The replacement coordinator must recreate that automation locally;
    LeakSmart's Zigbee leak sensors cannot bind directly to the valve.
  openness:
    status: "undocumented"
    reverse_engineered: true
    source_code: "https://github.com/arcus-smart-home/arcusplatform/tree/a02ad0e9274896806b7d0108ee3644396f3780ad"
    license: "Apache-2.0"
    notes: >
      No vendor ZCL implementation guide was found. Arcus was an official Iris
      partner and its drivers cite manufacturer documentation; the independent
      Hubitat implementation agrees on the core command and event map.
  safety_advisory:
    severity: "warning"
    summary: "A CLOSED On/Off reading is not proof that water stopped. Obstruction and monthly-cycle events must be handled before trusting valve state."
    detail: >
      The public Hubitat driver reports that a seized ball can leave the motor
      and On/Off state reporting CLOSED. Any non-zero alert on cluster 0x0B02
      commands 0x00/0x01, or event 0x81 on command 0x02, is an operation failure.
      Latch that failure, suppress a contradictory normal state transition and
      require a clear alert plus a fresh readback before clearing it. Never
      automatically retry or reverse the motor. Test actual water shut-off with
      someone attending the installation before relying on it for leak safety.
  identification:
    zigbee_manufacturer_names: ["WAXMAN"]
    notes: >
      Require both manufacturerName WAXMAN and one exact modelIdentifier in
      variants; WAXMAN alone is not sufficient. The manufacturer code reported
      during interview is 0x113B on current fingerprints, or 0x1002 on some
      MDL-8810300L units. Do not confuse the Zigbee manufacturer code with the
      Basic cluster's manufacturerName string.
  discovery:
    none: >
      Zigbee end devices are identified during coordinator interview, not by a
      BLE/LAN scan. Join only after selecting the replacement coordinator and
      confirming the exact Basic cluster model string. No motor operation is
      part of discovery.
    identity:
      stable_keys: ["ieee_address"]
      display: "model_identifier"
    static_ip_required: false
  variants:
    - model: "House Water Valve - MDL-8810300L"
      identification:
        zigbee_model_id: "House Water Valve - MDL-8810300L"
        zigbee_manufacturer_names: ["WAXMAN"]
      notes: >
        Early valve; manufacturer code 0x1002 or 0x113B. Adds Groups 0x0004
        and Scenes 0x0005. Arcus documents no OTA cluster on this model.
      verification: "reported"
    - model: "House Water Valve - MDL-TBD"
      identification:
        zigbee_model_id: "House Water Valve - MDL-TBD"
        zigbee_manufacturer_names: ["WAXMAN"]
      notes: >
        Manufacturer code 0x113B, hardware version 0x0A. OTA client and the
        undecoded manufacturer cluster 0xFC02 are present.
      verification: "reported"
    - model: "leakSMART Water Valve v2.10"
      identification:
        zigbee_model_id: "leakSMART Water Valve v2.10"
        zigbee_manufacturer_names: ["WAXMAN"]
      notes: >
        Production v2.10, manufacturer code 0x113B, with OTA client and 0xFC02.
        Firmware 113B-03E8-0000001D is reported to give a false power-source
        indication; Basic Power Source must not override physical installation
        knowledge without corroboration.
      verification: "reported"
  setup:
    required: true
    confidence: "medium"
    notes: >
      Standard Zigbee HA joining to an owner-controlled coordinator. The vendor
      hubs/cloud accounts are unnecessary and their original onboarding is not
      a fallback. Confidence medium: the five-press procedure appears in the
      installation manual and both public driver families, but was not run here.
    methods:
      - type: "hub_pairing"
        name: "Join a replacement Zigbee HA coordinator"
        role: "primary"
        verified: false
        description: >
          Reset/join at the valve, interview Basic identity, configure reporting
          and alerts, then recreate leak-to-close locally. No LeakSmart account,
          hub, cloud rule or Internet connection is involved.
        steps:
          - action: "Install the valve with its 9 V adapter and AA backup, keep the water installation attended, and put the new coordinator into permit-join mode."
            actor: "user"
          - action: "Rapidly press the centre Link button five times; if nothing happens, remove adapter and battery power briefly, restore it and retry."
            actor: "user"
            expect: "The blue LED flashes and the coordinator interviews a WAXMAN valve on HA endpoint 1."
          - action: "Require an exact modelIdentifier match, bind the standard clusters, configure the reporting intervals in protocol_details and issue a read-only Get Alerts request."
            actor: "client"
            expect: "On/Off and battery-voltage readbacks succeed and current alert state is known before any actuation is offered."
          - action: "Recreate leak-sensor-to-close behavior locally, with an attended close confirmation and obstruction handling; do not restore a cloud rule or bind a sensor directly."
            actor: "user"
        troubleshooting:
          - symptom: "The valve does not join after five presses."
            causes:
              - "Power-cycle both the 9 V adapter and AA backup, then retry while the coordinator is permitting joins."
              - "The valve is an end device, not a router; add a nearby Zigbee router/repeater rather than expecting it to extend the mesh."
          - symptom: "The coordinator shows OPEN/CLOSED but water does not follow."
            causes:
              - "Read Appliance Events and Alerts and treat any non-zero alert or event 0x81 as obstruction; On/Off alone cannot prove mechanical water flow."
          - symptom: "Automations fire while the monthly test runs."
            causes:
              - "Suppress On/Off-originated automations from event 0x80 until 0x82 or 0x83; surface 0x81 as a failure rather than a normal close/open cycle."
    factory_reset:
      applicable: true
      confidence: "medium"
      effect: >
        Clears the valve's Zigbee network membership and makes it available to
        join again. It also abandons the old hub/coordinator's leak automation;
        no claim is made that mechanical calibration or the physical valve is
        reset. Recreate local automations after every migration.
      description: >
        The same five-press Link action is documented as reset and join. A power
        cycle may be needed first. This procedure is source-backed, not executed
        by this project.
      procedures:
        - name: "Centre Link button pressed five times"
          verified: false
          basis: >
            LeakSmart valve 8811100/8815000 installation manual and the pinned
            Arcus and Hubitat valve drivers.
          press_count: 5
          power_state: "on"
          indicator: "The blue LED flashes; the valve can be interviewed by a coordinator in permit-join mode."
          steps:
            - action: "Keep the installation attended and put the replacement coordinator into permit-join mode."
              actor: "user"
            - action: "Rapidly press the centre Link button five times."
              actor: "user"
              expect: "The blue LED flashes and the valve joins or is ready to join."
            - action: "If the LED does not flash, remove adapter and battery power briefly, restore power and repeat the five-press action."
              actor: "user"
    rejoin:
      in_place_supported: false
      requires_factory_reset: false
      notes: >
        Moving coordinators is device-initiated reset/leave followed by joining
        the new coordinator; the old hub and vendor cloud need not be alive.
        Resetting network membership is required, but a separate destructive
        data wipe is not documented.
      steps:
        - action: "Put the new coordinator into permit-join mode and run the five-press valve reset/join procedure."
          actor: "user"
        - action: "Remove the stale old-coordinator entry, then reconfigure reporting, alerts and local leak-to-close automation."
          actor: "user"
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device:
        - "Zigbee PAN/network membership and the network key delivered during standard joining"
      issued_to_client:
        - "Coordinator-assigned IEEE/network addressing and Zigbee network membership"
      notes: >
        No Wi-Fi credential, vendor account token or per-valve application key
        exists on this path. Protect the replacement coordinator's Zigbee
        network key as the only shared radio credential.
  pairing:
    required: true
    confidence: "medium"
    security_mode: "network_join"
    bonding: "required"
    exclusivity:
      single_bond: true
      recovery: >
        The valve belongs to one Zigbee network at a time. Run its five-press
        reset/join action with the new coordinator in permit-join; the dead
        vendor hub does not have to authorize the move.
    enter_pairing_mode:
      required: true
      indicator: "The blue LED flashes after five rapid Link-button presses."
      procedures:
        - name: "Five rapid centre Link-button presses"
          verified: false
          basis: "Valve installation manual and both public Zigbee driver families; not replayed here."
          press_count: 5
          power_state: "on"
          indicator: "Blue LED flashing."
          steps:
            - action: "Enable permit-join on the replacement coordinator."
              actor: "user"
            - action: "Press the centre Link button five times quickly and watch for the blue flashing LED."
              actor: "user"
              expect: "The coordinator reports a WAXMAN valve and reads one of the exact model strings."
    unpair:
      supported: true
      requires_factory_reset: false
      clears: "Zigbee network membership and the old coordinator relationship; local automations must be rebuilt."
      notes: "Use coordinator-backed leave where available, otherwise the same five-press reset/join action."
    notes: >
      Pairing means ordinary Zigbee network joining, not Bluetooth bonding and
      not a vendor account. No motor command belongs to the pairing flow.

protocol_details:
  zigbee:
    profile_id: "0x0104"
    profile: "Zigbee Home Automation 1.2"
    endpoint: 1
    device_role: "sleepy end device, not a router; 9 V adapter with 4xAA backup"
    input_clusters:
      - {id: "0x0000", name: "Basic", attributes: [{id: "0x0004", name: "ManufacturerName", value: "WAXMAN"}, {id: "0x0005", name: "ModelIdentifier", values: ["House Water Valve - MDL-8810300L", "House Water Valve - MDL-TBD", "leakSMART Water Valve v2.10"]}, {id: "0x0007", name: "PowerSource", type: "enum8", caveat: "False on some firmware; do not use as sole mains evidence"}]}
      - {id: "0x0001", name: "Power Configuration", attributes: [{id: "0x0020", name: "BatteryVoltage", type: "uint8", endianness: "little", scale: 0.1, unit: "V", sentinel: "0xFF means invalid/unknown per ZCL; do not publish 25.5 V"}, {id: "0x0021", name: "BatteryPercentageRemaining", type: "uint8", unit: "0.5 percent", caveat: "Arcus reports requests can cause issues; prefer BatteryVoltage and do not require this attribute"}]}
      - {id: "0x0003", name: "Identify", commands: [{id: "0x00", name: "Identify", reported_duration_s: 300}]}
      - {id: "0x0004", name: "Groups", variants: ["House Water Valve - MDL-8810300L"]}
      - {id: "0x0005", name: "Scenes", variants: ["House Water Valve - MDL-8810300L"]}
      - {id: "0x0006", name: "On/Off", attributes: [{id: "0x0000", name: "OnOff", type: "boolean", values: {0: "closed", 1: "open"}}]}
      - {id: "0x0020", name: "Poll Control", notes: "Arcus sets check-in 28 quarter-seconds (7 s), long poll 20 qs and short poll 2 qs, and answers check-in with no fast poll."}
      - {id: "0x0b02", name: "Appliance Events and Alerts", notes: "Mandatory obstruction and self-test channel; see alert_events."}
      - {id: "0xfc02", name: "Manufacturer-specific, undecoded", variants: ["House Water Valve - MDL-TBD", "leakSMART Water Valve v2.10"]}
    output_clusters:
      - {id: "0x0003", name: "Identify", variants: ["House Water Valve - MDL-8810300L"]}
      - {id: "0x0019", name: "OTA Upgrade client", variants: ["House Water Valve - MDL-TBD", "leakSMART Water Valve v2.10"]}
    zcl:
      byte_order: "Multi-byte attribute IDs, intervals and other ZCL integer fields are little-endian unless explicitly stated otherwise."
      frame_control:
        general_client_to_server: "0x00: profile-wide frame, client to server"
        cluster_client_to_server: "0x01: cluster-specific frame, client to server"
        general_server_to_client: "0x08: profile-wide frame, server to client"
        cluster_server_to_client: "0x09: cluster-specific frame, server to client"
      requests:
        open:
          cluster_id: "0x0006"
          command_id: "0x01"
          direction: "client_to_server"
          payload_hex: ""
          example_frame_hex: "01 21 01"
          advanced: true
          attended: true
          advanced_reason: "Restores water flow and can mask an unresolved obstruction or leak. Send only while attending the installation, after alerts are clear."
          verification: "reported"
        close:
          cluster_id: "0x0006"
          command_id: "0x00"
          direction: "client_to_server"
          payload_hex: ""
          example_frame_hex: "01 21 00"
          advanced: true
          attended: true
          advanced_reason: "Stops the whole home's water and moves a mechanism that can seize. Send only while attending, never from detection alone; read back after 5 s and require clear alerts."
          verification: "reported"
        read_onoff:
          cluster_id: "0x0006"
          command_id: "0x00"
          command_name: "Read Attributes"
          payload_hex: "00 00"
          example_frame_hex: "00 22 00 00 00"
          verification: "reported"
        read_battery_voltage:
          cluster_id: "0x0001"
          command_id: "0x00"
          command_name: "Read Attributes"
          payload_hex: "20 00"
          example_frame_hex: "00 23 00 20 00"
          verification: "reported"
        get_alerts:
          cluster_id: "0x0b02"
          command_id: "0x00"
          direction: "client_to_server"
          payload_hex: ""
          example_frame_hex: "01 24 00"
          verification: "reported"
        configure_onoff_reporting:
          cluster_id: "0x0006"
          command_id: "0x06"
          command_name: "Configure Reporting"
          record: "direction 0x00; attribute 0x0000 LE; Boolean 0x10; minimum 1 s LE; maximum 300 s LE"
          example_frame_hex: "00 26 06 00 00 00 10 01 00 2c 01"
          verification: "reported"
        configure_battery_reporting:
          cluster_id: "0x0001"
          command_id: "0x06"
          command_name: "Configure Reporting"
          record: "direction 0x00; attribute 0x0020 LE; uint8 0x20; minimum 3600 s LE; maximum 43200 s LE; reportable change 2 (0.2 V)"
          example_frame_hex: "00 27 06 00 20 00 20 10 0e c0 a8 02"
          verification: "reported"
      readback:
        rule: "Read On/Off again 5 seconds after any attended actuation. Also process asynchronous reports and 0x0B02; an acknowledgement is not mechanical proof."
        read_attributes_response: "frame-control, sequence, command 0x01, then per attribute: attribute-id LE, status (0=success), data-type, value. Reject failure status and wrong type/length instead of publishing."
        examples:
          - name: "valve open"
            frame_hex: "08 22 01 00 00 00 10 01"
            expected: {attribute: "0x0000", status: 0, type: "0x10", raw_hex: "01", decoded: "open"}
          - name: "valve closed"
            frame_hex: "08 22 01 00 00 00 10 00"
            expected: {attribute: "0x0000", status: 0, type: "0x10", raw_hex: "00", decoded: "closed"}
          - name: "battery 6.0 V"
            frame_hex: "08 23 01 20 00 00 20 3c"
            expected: {attribute: "0x0020", status: 0, type: "0x20", raw_hex: "3c", scale: 0.1, unit: "V", decoded: 6.0}
          - name: "battery 4.1 V"
            frame_hex: "08 23 01 20 00 00 20 29"
            expected: {attribute: "0x0020", status: 0, type: "0x20", raw_hex: "29", scale: 0.1, unit: "V", decoded: 4.1}
          - name: "battery invalid"
            frame_hex: "08 23 01 20 00 00 20 ff"
            expected: {attribute: "0x0020", status: 0, type: "0x20", raw_hex: "ff", decoded: "unknown"}
        malformed_examples:
          - {frame_hex: "08 22 01 00 00", reason: "truncated attribute record"}
          - {frame_hex: "08 22 01 00 00 00 10", reason: "missing Boolean value"}
          - {frame_hex: "08 22 01 00 00 01 10 01", reason: "nonzero attribute status"}
          - {frame_hex: "08 23 01 20 00 00 10 3c", reason: "wrong type for battery voltage"}
    alert_events:
      cluster_id: "0x0b02"
      command_payload_rule: "For command 0x00 (Get Alerts Response), 0x01 (Alerts Notification) and 0x02 (Events Notification), require at least two cluster-payload bytes. Interpret payload[1]; retain any additional raw bytes for later model-specific analysis."
      alerts:
        commands: ["0x00", "0x01"]
        values: {0: "no alert; request a fresh On/Off read before clearing a latched obstruction", nonzero: "valve operation failure / possible obstruction; latch and do not auto-retry"}
        examples:
          - {command: "0x01", payload_hex: "01 00", meaning: "clear alert"}
          - {command: "0x01", payload_hex: "01 01", meaning: "operation failure"}
      events:
        command: "0x02"
        values:
          "0x80": "monthly/self-test cycle started; enter suppression"
          "0x81": "operation failure; leave suppression if active, latch obstruction and surface the failure"
          "0x82": "monthly/self-test cycle not performed; leave suppression and surface maintenance warning"
          "0x83": "monthly/self-test cycle succeeded; leave suppression and record success"
        examples:
          - {payload_hex: "01 80", event: "cycle_start"}
          - {payload_hex: "01 81", event: "operation_failure"}
          - {payload_hex: "01 82", event: "cycle_not_performed"}
          - {payload_hex: "01 83", event: "cycle_succeeded"}
      monthly_cycle_suppression:
        enter: "Event 0x80 sets cycle_active=true."
        while_active: "Record raw On/Off transitions for diagnostics but emit no owner automation or leak/away state-change event. Never issue OPEN or CLOSE in response."
        success: "Event 0x83 sets cycle_active=false and emits a maintenance success, not a valve actuation event."
        not_performed: "Event 0x82 sets cycle_active=false and emits a maintenance warning."
        failure: "Event 0x81 sets cycle_active=false, sets obstruction=true and emits a safety fault. Do not treat it as an ordinary completed cycle."
        clear_obstruction: "Only a zero alert on command 0x00/0x01 followed by a successful fresh On/Off read may clear obstruction. Preserve the last safety-fault state until both happen."
        unknown_event: "Reject unknown event IDs for state-machine purposes and log raw payload; never guess that one means cycle completion."
      trace_vector:
        steps:
          - {input: "event 0x80", cycle_active: true, obstruction: false, emitted: "maintenance_started"}
          - {input: "OnOff=0", cycle_active: true, obstruction: false, emitted: "suppressed"}
          - {input: "OnOff=1", cycle_active: true, obstruction: false, emitted: "suppressed"}
          - {input: "event 0x83", cycle_active: false, obstruction: false, emitted: "maintenance_succeeded"}
          - {input: "event 0x81", cycle_active: false, obstruction: true, emitted: "safety_fault"}
          - {input: "OnOff=0", cycle_active: false, obstruction: true, emitted: "obstructed_readback"}
          - {input: "alert 0", cycle_active: false, obstruction: true, emitted: "readback_required"}
          - {input: "OnOff=0 read success", cycle_active: false, obstruction: false, emitted: "recovered_closed"}
    power:
      battery_voltage: "BatteryVoltage raw unsigned uint8 * 0.1 V; 0xFF is invalid. Typical backup pack is 4xAA nominal 6.0 V. Arcus uses 4.1 V as its empty threshold when the device threshold is unavailable; do not present a vendor-certified percentage curve."
      reporting:
        onoff: {minimum_s: 1, maximum_s: 300}
        battery_voltage: {minimum_s: 3600, maximum_s: 43200, reportable_change_raw: 2, reportable_change_v: 0.2}
        basic_power_source: {minimum_s: 120, maximum_s: 43200}
      percentage_attribute_warning: "Do not depend on 0x0021: Arcus says requesting it causes issues although Hubitat configures it. Voltage is the interoperable baseline."
    test_vector_provenance: "All complete frames and traces are newly constructed from the reported ZCL rules using invented sequence numbers. They are not radio captures and identify no installation."

features:
  - type: "firmware_update"
    variants: ["House Water Valve - MDL-TBD", "leakSMART Water Valve v2.10"]
    dfu:
      mechanisms: ["custom"]
      image:
        signing: "unknown"
        source: "vendor_cloud"
        format: "Zigbee OTA image; public examples identify manufacturer 0x113B / image type 0x03E8, but no image is shipped here"
        notes: >
          Arcus and Hubitat document an OTA client on these two model strings.
          Public logs name image IDs 113B-03E8-0000001D and ...00000019, but no
          matching public Waxman image or signature/rollback policy was found.
          Never substitute the unrelated Ayla-generic Salus packages reviewed
          during research.
      enter:
        how: "unknown"
        notes: "OTA is server-driven through the Zigbee OTA client cluster 0x0019; no separate user bootloader command is declared."
      dfu_mode:
        notes: "No separate advertisement/mode identity is established. During OTA the device remains a Zigbee endpoint, not a BLE DFU peripheral."
      recovery:
        interrupted: "unknown"
      verification: "reported"
      notes: "Read-only declaration so a generic consumer does not invent an upload path. No OTA operation was performed."

cloud:
  required: false
  vendor_service: "LeakSmart Hub 2.0 / Hub 3.0 clouds (Exosite and Ayla), both defunct for ordinary app use"
  hosts: []
  failure_mode: >
    The original app/hub control path is dead, but the valve's Zigbee radio is
    independent. A replacement coordinator restores local standard-ZCL control
    with no vendor account. The old hub's local sensor rules do not transfer;
    recreate them on the new coordinator. Hub 3.0 Ayla LAN support remains a
    separate conditional research question and is not claimed by this spec.
  notes: "No cloud endpoint is needed or documented for the replacement Zigbee route."

local_access:
  status: "bridge_hardware"
  summary: "Join the valve to an owner-controlled Zigbee HA coordinator. Standard On/Off, Power Configuration and Appliance Events and Alerts supply the complete documented local surface."
  covers:
    - "Attended open/close via HA On/Off commands 0x01/0x00 with 5-second readback"
    - "On/Off reporting and explicit reads"
    - "Battery voltage in 0.1 V units with invalid sentinel handling"
    - "Obstruction alerts, event IDs and monthly-cycle suppression"
    - "Standard Zigbee join/reset and coordinator migration"
  not_covered:
    - "LeakSmart Wi-Fi sensors and the two vendor hub/cloud stacks"
    - "Zigbee leak-sensor model fingerprint and wet/dry quirks; do not infer them from this valve spec"
    - "Manufacturer cluster 0xFC02 and any flow-metering valve variant"
    - "OTA image acquisition, signature policy and a safe generic upload"
  hardware:
    - name: "Any Zigbee HA coordinator capable of custom/cluster-specific handlers"
      role: "bridge"
      notes: "The coordinator must implement 0x0B02, not just expose an On/Off switch. Z2M/ZHA support for the exact model and alert handling must be checked before relying on it."
      verification: "reported"
  notes: "This spec deliberately does not claim stock Zigbee2MQTT/ZHA support; its test vectors define the handler required where stock support is absent."

payload_formats:
  BatteryVoltage:
    description: "One-byte ZCL Power Configuration BatteryVoltage reading."
    fields:
      - name: "battery_voltage_raw"
        type: "uint8"
        scale: 0.1
        unit: "V"
        device_class: "voltage"
        description: "Raw unsigned value; 0xFF is invalid/unknown, not 25.5 V."
    parse_rules:
      - "Require ZCL status success and data type uint8 (0x20) before scaling."
      - "Multiply by 0.1 to obtain volts. Treat 0xFF as unavailable."

helpful_urls:
  - title: "Arcus/Iris Waxman valve drivers (pinned)"
    url: "https://github.com/arcus-smart-home/arcusplatform/tree/a02ad0e9274896806b7d0108ee3644396f3780ad/platform/arcus-containers/driver-services/src/main/resources"
    kind: "implementation"
