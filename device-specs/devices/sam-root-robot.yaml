entities:
  - platform: "sensor"
    name: "Battery"
    device_class: "battery"
    unit: "%"
    state_characteristic: "6e400003-b5a3-f393-e0a9-e50e24dcca9e"
    state_mapping:
      value: "battery_percent"
    commands:
      poll: "get_battery_level"
    notes: >
      Query replies and battery events share the same field offsets. Reject
      other logical devices and require a valid packet CRC before updating.
  - platform: "sensor"
    name: "Battery voltage"
    device_class: "voltage"
    unit: "mV"
    state_characteristic: "6e400003-b5a3-f393-e0a9-e50e24dcca9e"
    state_mapping:
      value: "battery_mv"
    commands:
      poll: "get_battery_level"
  - platform: "button"
    name: "Stop and reset activity"
    key: "stop"
    command_characteristic: "6e400002-b5a3-f393-e0a9-e50e24dcca9e"
    commands:
      press: "stop_and_reset"
    notes: >
      Cancels pending actions and stops the robot. It does not factory-reset
      the robot or clear its advertising name.

local_access:
  status: "native"
  summary: >
    Direct BLE from a phone or computer, with no cloud, account or bridge.
    Subscribe to robot TX before writing to robot RX.
  covers:
    - "Root/RT0/RT1 identification and Device Information reads"
    - "Main-board firmware, hardware, bootloader and BLE protocol version query"
    - "Advertising-name query and battery voltage/percentage state"
    - "Stop-and-reset as a safety action"
  not_covered:
    - "Movement, drive, actuator, rename and broader sensor commands are deliberately not declared"
    - "Firmware update, bootloader entry and firmware activation are deliberately not declared"
    - "Create 3 / Ci3 and protocol versions newer than Root 1.3"

remaining_unknowns:
  - "No owner advertisement/GATT dump or read-only packet exchange on current RT0/RT1 firmware exists here. All wire facts remain reported, and device.testing remains untested."
  - "The pinned source is from 2024 and calls Root protocol 1.3 current and 1.4 planned. Whether current SAM-supported firmware changed the Root protocol is unknown; query versions rather than assuming continuity."
  - "No factory-reset procedure, persistent-state clearing list or maximum simultaneous-central count is established. Stop-and-reset is not a factory reset."
  - "The Robot State source diagram over-counts one bit while naming bump/touch/cliff flags, so this spec exposes only the low-seven-bit battery field and leaves individual flag masks undecoded."
  - "Upstream does not specify whether manufacturer data contains bytes after the three-character robot type; discovery therefore uses an RT0/RT1 prefix, not a whole-payload equality claim."
  - "Write-without-response requires host pacing but no interval is published. Use write with response until a safe interval is measured."

evidence:
  documentation_review: >
    The official successor-hosted Root BLE protocol README, CRC implementation
    and example connection code at commit 8bac987096e984cb472843f8180fef142171df70
    were read directly. The README is authoritative for UUID direction and
    packet semantics; the example's local UART variable labels are not used.
    The CRC's generated parameter block and bitwise update loop agree on poly
    0x07, init/final XOR zero and no reflection.
  app_static_analysis: >
    Research also checked the public SAM Root 3.1.0 app for successor
    continuity. No app-internal symbol, UI copy, firmware operation or new
    packet claim is imported into this spec. There was no hardware session or
    new capture.
  open_questions: >
    Current firmware/protocol support, physical reset behavior, Robot State
    flag masks, central exclusivity and write-without-response timing need an
    RT0/RT1 owner with hardware. A safe next experiment needs only an
    advertisement/GATT dump and version/name/battery exchanges.
  artifacts:
    - type: "vendor_documentation"
      artifact: "PoweredBySAM/sam-root-ble-protocol README at 8bac987096e984cb472843f8180fef142171df70"
      url: "https://github.com/PoweredBySAM/sam-root-ble-protocol/blob/8bac987096e984cb472843f8180fef142171df70/README.md"
      obtained_via: "Official successor-hosted public repository"
      description: "Source for discovery, GATT, Root protocol versions, framing, IDs and the four declared operations. Create 3 and motion/update behavior were reviewed only to exclude them."
    - type: "public_implementation"
      artifact: "Root CRC reference and BLE example code at 8bac987096e984cb472843f8180fef142171df70"
      url: "https://github.com/PoweredBySAM/sam-root-ble-protocol/tree/8bac987096e984cb472843f8180fef142171df70"
      obtained_via: "Official successor-hosted public repository"
      description: "CRC parameters and bare-GATT subscribe-first flow. No motor packet from the examples is copied or declared."
    - type: "static_analysis"
      artifact: "SAM Root 3.1.0 (93)"
      obtained_via: "Public Android app research, 2026-11-10"
      description: "Successor continuity only. No hardware verification and no vendor-internal names or owner identifiers carried into this spec."

