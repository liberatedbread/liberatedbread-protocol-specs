device:
  name: "iDotMatrix"
  manufacturer: "iDotMatrix / Tech"
  manufacturer_status: "unsupported"
  testing:
    status: untested
  protocol: "ble"
  category: "display"
  category_hierarchy: ["display", "led_matrix"]
  notes: >
    Multi-size RGB LED pixel-matrix display (text, images, GIF, effects, timers,
    schedules and one-pixel graffiti). No pairing required. Post-connect
    public GATT captures identify primary service 0x00FA, with characteristic
    0xFA02 supporting write and write-without-response and 0xFA03 supporting
    notify only. Advertisements themselves carry flags and the IDM name, not
    this service UUID.

    Framed upload protocol — 16-byte header per 4096-byte payload chunk:
      [0-1]  total frame length, header included (uint16 LE)
      [2]    command type: 1=GIF, 2=Image, 3=Text/MultiColor, 6=Phrase
      [3]    sub-type: always 0x00 in framed uploads (sub-type 0x02 exists
             only in the short MultiColor/Phrase commands below)
      [4]    chunk flag: 0=first, 2=continuation
      [5-8]  total payload length, excluding all headers (uint32 LE)
      [9-12] CRC32 of the payload only, excluding all headers (LE)
      [13-14] time/delay (uint16 LE)
      [15]   speed/type byte
      [16+]  payload
    BLE chunking: 509 bytes when MTU negotiated, else 18 bytes; 20 ms/chunk for
    GIF/image, 50 ms/chunk for text. Notify response: [?,0,cmd_type,sub_type,status]
    with status 0=invalid, 1=next-chunk, 2=error, 3=finished. Public captures
    independently confirm LE lengths and payload-only CRC32 on 0xFA02. The full
    0x1010 frame length is byte-palindromic, so short frames are the useful
    endian check.
    Display sizes (from the app's screen-size table): 1010=10x10, 1001=1x100,
    1116=16x11, 1318=18x13, 1619=19x16, 1920=20x19, 2020=20x20 (default),
    2010=10x20, 3010=10x30, 3820=20x38. Square 16x16 / 32x32 / 64x64 panels
    also exist and use this same IDM-/0x00FA protocol family.
    Upload format: public clients upload encoded PNG or GIF files, which the
    device decodes; it crops rather than resizes. Separately, public graffiti
    vector 0a 00 05 01 00 ff 00 00 1f 1f draws one red RGB888 pixel at (31,31).
    A full raw framebuffer remains unobserved. Text glyph width varies by
    device/font.
    CONFIDENCE: primary service, characteristic properties, framing header,
    CRC coverage and the one-pixel command are capture-backed. Command type
    6=Phrase and still-image material fields remain app-derived. Service
    0xFEE9 is retained only as negative evidence below: it is an unused BLE
    library default, not an alternative hardware transport.
    Evidence: 8none1/idotmatrix public captures and decoding notes,
    derkalle4/python3-idotmatrix-library, fbnlrz/homeyidotmatrix docs/idm.md,
    plus the vendor app's upload and command builders.

    Short command protocol — primary service 0x00FA: unframed length-prefixed
    byte commands ([len, 0x00, cmd, ...]) written to characteristic 0xFA02,
    with acks/notifications on 0xFA03. Name prefix "IDM-".

    APP-PROVEN-UNUSED — service 0xFEE9 with characteristics
    d44bc439-abfd-45a2-b575-925416129600/9601: these UUIDs are merely the
    shipped defaults of the app's third-party BLE library
    (a third-party BLE library's default options); the app overrides them at
    init with service 0x00FA / characteristic 0xFA02, so they are dead config
    in the app. That
    UUID pair is also a stock NXP BLE-UART demo pair reused by many unrelated
    products, and no public source has observed it on iDotMatrix hardware.
    Kept below for completeness — do not rely on 0xFEE9 being present.
  identification:
    local_name_prefix: "IDM-"
    notes: >
      Advertisements contain flags and the IDM local name, not the 0x00FA
      service UUID. The primary service and its characteristics are learned
      only through post-connect GATT discovery.

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          local_name:
            match: "prefix"
            value: "IDM-"
    identity:
      stable_keys: ["address"]
      display: "local_name"
    static_ip_required: false

  setup:
    required: false
    confidence: "medium"
    notes: >
      No provisioning. The vendor app adds a cloud content library, but none of
      it is required to connect to and drive the display.
    methods:
      - type: "ble_direct"
        verified: false
        description: >
          No provisioning step: the device advertises as soon as it is powered
          on and accepts a connection from any central. There is no account, no
          network credential exchange and no pairing PIN, so a replacement
          client only has to scan, connect and write.
        ble:
          advertised_name: "IDM-"
          pairing_required: false
        steps:
          - action: "Power the device and scan for its advertisement."
            actor: "client"
            request:
              protocol: "ble_gatt"
          - action: "Connect and run the documented initialization sequence, if the spec defines one."
            actor: "client"
    factory_reset:
      confidence: "low"
      effect: >
        No credential state to clear. Power-cycling drops the current
        connection, which is the actual remedy for the common failure mode:
        the device already being connected to another central.
      procedures:
        - name: "Power cycle"
          steps:
            - action: "Remove power (or battery) for a few seconds and reapply."
              actor: "user"
              expect: "Device advertises again and accepts a new connection."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        Nothing binds this device to a network or an owner, so switching
        controllers is just connecting from the new one. If the old client is
        an Android or iOS phone, remove the device from the OS Bluetooth list
        as well — a cached bond can keep the phone reconnecting automatically
        and holding the single available link.
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device: []
      issued_to_client: []
      notes: >
        Anything within radio range can connect and issue commands. Physical
        proximity is the only access control.
  pairing:
    required: false
    confidence: "medium"
    security_mode: "none"
    bonding: "none"
    enter_pairing_mode:
      required: false
# Custom consumer-side handler: builds framed image/GIF/text packets, computes the
# CRC32, and drives MTU-aware chunked writes. Declarative.
protocol_handler: "idotmatrix_image"

# Chunked PNG / GIF file upload with CRC32 integrity per transfer. Public
# clients upload an encoded PNG (static) or GIF (animated) FILE, which the
# device decodes. A separate capture-proven draw_pixel command writes one
# RGB888 pixel; no complete raw framebuffer upload has been observed.
# Panel sizes: the community documents square 16x16 / 32x32 / 64x64 panels
# (derkalle4 README, fbnlrz README+docs/idm.md hardware-verified on IDM-BC5C5F,
# tomglenn/idx-ai). App v2.1.4's screen-size table lists only smaller/odd
# codes (1010=10x10 .. 3820=20x38) and knows no 32x32 or 64x64 code — an
# app-vs-firmware gap, so max here follows the real 64x64 hardware, not the app
# table. The device crops rather than resizes, so a client should match the
# panel's actual size (query the device / let the user choose).
features:
  - type: "image_upload"
    format: "png"
    animation: true
    max_width: 64
    max_height: 64
  - type: "firmware_update"
    dfu:
      mechanisms: ["jieli_ota"]
      transport: "ble"
      image:
        signing: "unknown"
        source: "bundled_in_app"
        format: "JieLi OTA image (*_ota_mi.bin)."
        notes: >
          The app bundles two images (TR2401R006_01_01_ota_mi.bin,
          TR2401R007_02_01_ota_mi.bin); they stay in the app. It also runs a
          version check against the vendor cloud (manage.heaton.com.cn).
      enter:
        how: "unknown"
        notes: >
          In-band over JieLi RCSP on ae01/ae02. Whether this part is
          single-backup (reboots into a loader, client reconnects) or
          dual-backup (updates in place) is not established, and a
          session-dependent component of the exchange is unsolved (235/256
          two-byte probes elicit responses), so no entry bytes are known.
      dfu_mode:
        notes: "Not established."
      services: ["0000ae00-0000-1000-8000-00805f9b34fb"]
      recovery:
        interrupted: "unknown"
      verification: "reported"
      notes: >
        From the app (embedded JieLi OTA SDK) and fbnlrz/homeyidotmatrix
        docs/AE-SERVICE.md (hardware-probed service, not a completed
        update). The app's hard-coded AES key encrypts its cloud HTTP bodies
        and is not shown to touch the OTA wire payloads.

services:
  # APP-PROVEN-UNUSED — third-party BLE library defaults, overridden by the app
  # at init with 0x00FA/0xFA02; never observed on hardware.
  - uuid: "0000fee9-0000-1000-8000-00805f9b34fb"
    name: "iDotMatrix Data Service (app-proven-unused)"
    notes: >
      These UUIDs are the shipped defaults of the app's third-party BLE
      library (its default options); the app overrides them at init with
      service 0x00FA / characteristic 0xFA02, so this service is dead config
      and no public source has observed it on iDotMatrix hardware. The d44bc439-…-9600/9601 pair is also a stock NXP BLE-UART
      demo pair reused by unrelated products. On all hardware-documented
      units the framed protocol described here runs over 0xFA02 alongside
      the short commands.
    characteristics:
      - uuid: "d44bc439-abfd-45a2-b575-925416129600"
        name: "Data Write/Read"
        properties: ["write", "read"]
        framing:
          max_chunk_size: 4096
        notes: >
          Library-default write characteristic, unused by the app (overridden
          with 0xFA02 at init). The framing block is repeated here only for
          the record — the authoritative declaration, with the upload
          commands, is on 0xFA02. The framed protocol that
          would run here — and does run on 0xFA02 — is a 16-byte header
          (length field at [0-1] is uint16 LITTLE-endian) + up to 4096-byte
          payload per frame; CRC32 (java.util.zip.CRC32) over the whole data
          payload. Framing verified on 0xFA02 by 8none1, derkalle4 gif.py and
          Homey docs/idm.md §4.17, and app-side in the vendor app's GIF
          upload path.

      - uuid: "d44bc439-abfd-45a2-b575-925416129601"
        name: "Data Notify"
        properties: ["notify"]
        notes: "Library-default notify characteristic, unused by the app. The transfer-progress response format is verified on 0xFA03, and app-side in the vendor app's GIF upload path."
        format:
          - offset: 0
            length: 1
            name: "unknown"
            type: "uint8"
          - offset: 1
            length: 1
            name: "reserved_zero"
            type: "uint8"
          - offset: 2
            length: 1
            name: "command_type"
            type: "uint8"
          - offset: 3
            length: 1
            name: "sub_type"
            type: "uint8"
          - offset: 4
            length: 1
            name: "status"
            type: "uint8"

  # OTA service (vendor app)
  - uuid: "0000ae00-0000-1000-8000-00805f9b34fb"
    name: "JieLi RCSP / OTA Service"
    notes: >
      Jieli (杰理) OTA stack (the app embeds Jieli's OTA SDK, which is
      public as Jieli-Tech/Android-JL_OTA). ae00 is JieLi's stock RCSP
      service, shared by every JieLi product, so it marks a JieLi SoC, not
      this panel and not update mode. It is the update path: a generic
      client lists it read-only. Not yet unlocked publicly — a
      session-dependent component is unsolved (235/256 two-byte inputs elicit
      responses). Evidence: fbnlrz/homeyidotmatrix docs/AE-SERVICE.md
      (hardware-probed).
      The app bundles two OTA firmware images (TR2401R006_01_01_ota_mi.bin,
      TR2401R007_02_01_ota_mi.bin), so firmware artifacts do exist inside it.
      The hard-coded ASCII AES-256-CBC key with IV = 16 x ASCII '0' (in the
      app's crypto helper) is consumed by its cloud HTTP encryption —
      request/response bodies for manage.heaton.com.cn, including the OTA
      version-check call — and is
      NOT demonstrated to encrypt OTA wire payloads; no wire capture ties it
      to this service.
    characteristics:
      - uuid: "0000ae01-0000-1000-8000-00805f9b34fb"
        name: "OTA Write"
        properties: ["write_without_response"]
      - uuid: "0000ae02-0000-1000-8000-00805f9b34fb"
        name: "OTA Notify"
        properties: ["notify"]

  # Short-command + framed-upload protocol on the primary 0x00FA service.
  - uuid: "000000fa-0000-1000-8000-00805f9b34fb"
    name: "iDotMatrix Command/Upload Service (0x00FA)"
    notes: >
      Public GATT captures list 0x00FA as a primary service and place the
      0xFA02 and 0xFA03 characteristics beneath it. The protocol every public
      client speaks (derkalle4/python3-idotmatrix-library, nj-designs/go-idot,
      fbnlrz/homeyidotmatrix — hardware-verified) uses this service. The short
      length-prefixed commands below and the framed CRC32 upload protocol
      (16-byte header, length at [0-1] uint16 LE) both run on characteristic
      0xFA02. Additional opcodes from Homey docs/idm.md: set-time
      0b 00 01 80 …, clock 08 00 06 01 …, countdown 07 00 08 80 …,
      chronograph 05 00 09 80 …, scoreboard 08 00 0a 80 …, built-in effects
      [len, 0, 03, 02, style, 90, count, rgb…], music sync 06 00 00 02 ….
      Command acks arrive on 0xFA03 as 05 00 <cmd> <sub> 01.
      The vendor app confirms this configuration: it overrides its BLE
      library defaults with service 0x00FA + write characteristic 0xFA02 and
      sends the full short-command set below from its protocol builder.
    characteristics:
      - uuid: "0000fa02-0000-1000-8000-00805f9b34fb"
        name: "Write Data"
        properties: ["write", "write_without_response"]
        role: "command"
        # The framed CRC32 upload runs HERE on every hardware-documented unit
        # (8none1 btsnoop, derkalle4 gif.py, Homey docs/idm.md §4.17), not on
        # the app-proven-unused 0xFEE9 characteristic that used to be the only
        # place it was declared. One logical frame = 16-byte header + up to
        # 4096 payload bytes; the BLE layer then splits each frame into
        # ATT-sized writes (509 bytes with MTU negotiated, else 18; 20 ms per
        # write for GIF/image, 50 ms for text) and waits for the 0xFA03 ack
        # (status 1 = send the next frame, 3 = finished) between frames.
        framing:
          max_chunk_size: 4096
        commands:
          upload_image_chunk:
            description: >
              One frame of a static-image (PNG file) upload, command type 2:
              [packet length u16 LE][0x02][0x00][chunk flag][total file length
              u32 LE][CRC32 of the whole file u32 LE][display seconds u16 LE]
              [material type][payload]. Send the frames in order and wait for
              the 0xFA03 ack (status 1) between them; the device decodes the
              PNG once all `total_length` bytes have arrived. The last three
              header fields were unstated until now: the vendor app's image
              builder writes the display time from its material-time picker
              (5/10/30/60/300 s) and the material-type byte it was handed —
              12 for a plain upload, where the time is forced to 0, and 13 for
              a timed material. 8none1's app captures show the type-12 form
              (00 00 0c). App-derived for type 2 (derkalle4's PNG path uses a
              different, header-less DIY layout), so `reported`.
            verification: "reported"
            template: ["{packet_length}", 0x02, 0x00, "{chunk_flag}", "{total_length}", "{crc32}", "{display_seconds}", "{material_type}", "{payload}"]
            parameters:
              packet_length:
                type: "uint16"
                endianness: "little"
                auto: "packet_length"
                description: "Total bytes of this frame, header included (4112 for a full chunk); encoder-filled, LITTLE-endian — the byte-palindromic 0x1010 of a full chunk hides a byte swap until the last frame."
              chunk_flag:
                type: "uint8"
                allowed: [0, 2]
                labels: ["first chunk", "continuation chunk"]
                default: 0
                description: "0 on the first frame of a file, 2 on every later frame."
              total_length:
                type: "uint32"
                endianness: "little"
                min: 1
                max: 4294967295
                description: "Length of the whole file across all frames — the same value in every frame."
              crc32:
                type: "uint32"
                endianness: "little"
                min: 0
                max: 4294967295
                description: "CRC-32 of the whole file (zlib / java.util.zip.CRC32: reflected poly 0xEDB88320, init and xorout 0xFFFFFFFF) — over the file, not this frame, so no `auto` span role fits it; the client computes it once and repeats it in every frame."
              display_seconds:
                type: "uint16"
                endianness: "little"
                min: 0
                max: 65535
                default: 0
                description: "Seconds the material stays up in a rotation; the app offers 5, 10, 30, 60 or 300 and sends 0 with material_type 12."
              material_type:
                type: "uint8"
                min: 12
                max: 13
                labels: ["plain upload (display time ignored, sent as 0)", "timed material (display_seconds applies)"]
                default: 12
                description: "The app's material-type byte; 12 (0x0C) for a plain upload, 13 (0x0D) for a material shown for display_seconds."
              payload:
                type: "bytes"
                min_length: 1
                max_length: 4096
                description: "Up to 4096 bytes of the PNG file, in order."
          upload_gif_chunk:
            description: >
              One frame of an animated-GIF upload, command type 1 — the same
              header as upload_image_chunk with 0x01 at byte 2. The
              hardware-verified public form (derkalle4 gif.py, 8none1's
              capture 10 10 01 00 … 05 00 0d) sends display time 5 and
              material type 13; the vendor app's GIF builder fills those two
              fields exactly as the image builder does. GIF bytes go as-is —
              the device decodes the file. Ack-gate on 0xFA03 between frames.
            verification: "reported"
            template: ["{packet_length}", 0x01, 0x00, "{chunk_flag}", "{total_length}", "{crc32}", "{display_seconds}", "{material_type}", "{payload}"]
            parameters:
              packet_length:
                type: "uint16"
                endianness: "little"
                auto: "packet_length"
                description: "Total bytes of this frame, header included; encoder-filled, LITTLE-endian."
              chunk_flag:
                type: "uint8"
                allowed: [0, 2]
                labels: ["first chunk", "continuation chunk"]
                default: 0
                description: "0 on the first frame of a file, 2 on every later frame."
              total_length:
                type: "uint32"
                endianness: "little"
                min: 1
                max: 4294967295
                description: "Length of the whole GIF file — the same value in every frame."
              crc32:
                type: "uint32"
                endianness: "little"
                min: 0
                max: 4294967295
                description: "CRC-32 (zlib) of the whole GIF file, repeated in every frame."
              display_seconds:
                type: "uint16"
                endianness: "little"
                min: 0
                max: 65535
                default: 5
                description: "Seconds the GIF stays up in a rotation; 5 is what every hardware-verified client sends."
              material_type:
                type: "uint8"
                min: 12
                max: 13
                labels: ["plain upload (display time ignored, sent as 0)", "timed material (display_seconds applies)"]
                default: 13
                description: "13 (0x0D) in every hardware-verified GIF upload."
              payload:
                type: "bytes"
                min_length: 1
                max_length: 4096
                description: "Up to 4096 bytes of the GIF file, in order."
          draw_pixel:
            description: >
              Draw one RGB888 pixel at zero-based x/y in graffiti mode.
              Capture-proven public vector: mode 0, red (255,0,0), at (31,31)
              is exactly 0a 00 05 01 00 ff 00 00 1f 1f. This establishes the
              short one-pixel command only; a full raw framebuffer remains
              unobserved.
            verification: "reported"
            template: [0x0A, 0x00, 0x05, 0x01, "{mode}", "{red}", "{green}", "{blue}", "{x}", "{y}"]
            parameters:
              mode:
                type: "uint8"
                allowed: [0]
                default: 0
                description: "Graffiti mode 0, the only capture-observed value."
              red: { type: "uint8", min: 0, max: 255 }
              green: { type: "uint8", min: 0, max: 255 }
              blue: { type: "uint8", min: 0, max: 255 }
              x: { type: "uint8", min: 0, max: 255, description: "Zero-based column." }
              y: { type: "uint8", min: 0, max: 255, description: "Zero-based row." }
          screen_on:
            description: "Turn screen on"
            value: [0x05, 0x00, 0x07, 0x01, 0x01]
          screen_off:
            description: "Turn screen off"
            value: [0x05, 0x00, 0x07, 0x01, 0x00]
          freeze_screen:
            description: "Freeze/unfreeze screen"
            value: [0x04, 0x00, 0x03, 0x00]
          set_brightness:
            description: "Set brightness (5-100%)"
            template: [0x05, 0x00, 0x04, 0x80, "{brightness}"]
            parameters:
              brightness:
                type: "uint8"
                min: 5
                max: 100
          flip_screen:
            description: "Rotate screen 180 degrees (0=normal, 1=flipped)"
            template: [0x05, 0x00, 0x06, 0x80, "{flip}"]
            parameters:
              flip:
                type: "uint8"
                min: 0
                max: 1
          set_speed:
            description: "Set animation speed"
            template: [0x05, 0x00, 0x03, 0x01, "{speed}"]
            parameters:
              speed:
                type: "uint8"
                min: 0
                max: 255
          enter_diy_mode:
            description: "Enter DIY image mode (0=disable, 1=enable)"
            template: [0x05, 0x00, 0x04, 0x01, "{mode}"]
            parameters:
              mode:
                type: "uint8"
                min: 0
                max: 1
          set_password:
            description: "Set 6-digit password (000000-999999). Reset device to clear."
            template: [0x08, 0x00, 0x04, 0x02, 0x01, "{pwd_high}", "{pwd_mid}", "{pwd_low}"]
            parameters:
              pwd_high:
                type: "uint8"
                min: 0
                max: 255
              pwd_mid:
                type: "uint8"
                min: 0
                max: 255
              pwd_low:
                type: "uint8"
                min: 0
                max: 255
          set_fullscreen_color:
            description: "Fill the whole screen with one RGB colour (Homey docs/idm.md)"
            template: [0x07, 0x00, 0x02, 0x02, "{red}", "{green}", "{blue}"]
            parameters:
              red:
                type: "uint8"
                min: 0
                max: 255
              green:
                type: "uint8"
                min: 0
                max: 255
              blue:
                type: "uint8"
                min: 0
                max: 255
          reset_step_1:
            description: "Factory reset, step 1 of 2 — follow with reset_step_2 (Homey docs/idm.md; found by 8none1)"
            value: [0x04, 0x00, 0x03, 0x80]
          reset_step_2:
            description: "Factory reset, step 2 of 2 — completes the reset started by reset_step_1"
            value: [0x05, 0x00, 0x04, 0x80, 0x50]
          verify_password:
            description: "Verify 6-digit password, three 2-digit groups as bytes (app-derived, not yet hardware-verified)"
            template: [0x07, 0x00, 0x05, 0x02, "{pwd_high}", "{pwd_mid}", "{pwd_low}"]
            parameters:
              pwd_high:
                type: "uint8"
                min: 0
                max: 99
              pwd_mid:
                type: "uint8"
                min: 0
                max: 99
              pwd_low:
                type: "uint8"
                min: 0
                max: 99
          eco_mode:
            description: "Eco mode with six config bytes (app-derived, not yet hardware-verified — byte semantics unknown)"
            template: [0x0A, 0x00, 0x02, 0x80, "{b1}", "{b2}", "{b3}", "{b4}", "{b5}", "{b6}"]
            parameters:
              b1:
                type: "uint8"
                min: 0
                max: 255
              b2:
                type: "uint8"
                min: 0
                max: 255
              b3:
                type: "uint8"
                min: 0
                max: 255
              b4:
                type: "uint8"
                min: 0
                max: 255
              b5:
                type: "uint8"
                min: 0
                max: 255
              b6:
                type: "uint8"
                min: 0
                max: 255
          locate:
            description: "Locate device. This is a genuinely different frame from the short commands: not [len, 0x00, cmd, ...] but a 16-byte block whose first byte is 0x06 followed by ASCII 'LOCATE' and NUL padding (from the app's command builder). The bytes below are the PLAINTEXT — the app does not write them directly: its locate path AES-encrypts the block in place before the single BLE write, so the actual on-wire bytes are the 16-byte ciphertext, not this plaintext. App-derived only; no community/hardware source documents a locate command, so treat as unconfirmed."
            verification: "hypothesis"
            value: [0x06, 0x4C, 0x4F, 0x43, 0x41, 0x54, 0x45, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
          set_mic_type:
            description: "Set hardware microphone type (app-derived, not yet hardware-verified). Shares cmd/sub 0x0B 0x80 with mic_rhythm_command; the device dispatches on the frame's length byte (this one is length 0x05, one payload byte) rather than on cmd/sub alone."
            template: [0x05, 0x00, 0x0B, 0x80, "{mic_type}"]
            parameters:
              mic_type:
                type: "uint8"
                min: 0
                max: 255
          mic_rhythm_command:
            description: "Microphone rhythm control; first payload byte is mode+1 per app (app-derived, not yet hardware-verified). Shares cmd/sub 0x0B 0x80 with set_mic_type; the device dispatches on the frame's length byte (this one is length 0x06, two payload bytes) rather than on cmd/sub alone."
            template: [0x06, 0x00, 0x0B, 0x80, "{mode_plus_1}", "{value}"]
            parameters:
              mode_plus_1:
                type: "uint8"
                min: 1
                max: 255
              value:
                type: "uint8"
                min: 0
                max: 255
          joint:
            description: "Joint/splice setting for multi-panel setups (app-derived, not yet hardware-verified)"
            template: [0x05, 0x00, 0x0C, 0x80, "{value}"]
            parameters:
              value:
                type: "uint8"
                min: 0
                max: 255

      - uuid: "0000fa03-0000-1000-8000-00805f9b34fb"
        name: "Notify/Ack Data"
        properties: ["notify"]
        role: "notify"
        notes: >
          Notify-only channel: upload-progress responses and command acks
          (05 00 <cmd> <sub> 01) arrive here. Public GATT declarations have
          property byte 0x10 (notify), with no read property.

