remaining_unknowns:
  - "Static-image (type 2) header bytes 13-15 are read from the vendor app's image builder, which mirrors its GIF builder; no public capture of a type-2 upload exists to confirm the device honours display_seconds for stills. The public PNG path (derkalle4 image.py, Homey §4.16) uses a different header-less DIY layout after enter_diy_mode instead."
  - "Whether the device accepts material_type values other than 12 and 13 is untested; the app sends only those two."

