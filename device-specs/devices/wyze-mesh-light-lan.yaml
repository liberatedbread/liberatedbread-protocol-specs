# Wyze Bulb Color / Light Strip encrypted local HTTP API — Device Specification
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# Sources (public, clean-room derived facts only):
#   - SecKatie/wyzeapy at 907056956508d230149e63d67c21a1253e788058.
#   - SecKatie/ha-wyzeapi at 1a553da0d327d2714f1d0bf6a5c1e359ebd160f9.
#   - Public Wyze local-API discussion and vendor setup/reset guides.

device:
  name: "Wyze Bulb Color / Light Strip (encrypted LAN)"
  manufacturer: "Wyze Labs"
  manufacturer_status: "active"
  testing:
    status: untested
    notes: >
      No bulb, strip, cloud account or local request was exercised by this
      project. The request encoding and property map are reported from public
      implementations. Invented test vectors prove encoding only, not hardware
      compatibility.
  protocol: "wifi"
  transport: "http"
  category: "light"
  category_hierarchy: ["light", "led"]
  type: "mesh-light-lan"
  integration: "identify_only"
  notes: >
    SCOPE: only Wyze Bulb Color WLPA19C with cloud product_type MeshLight and
    Wyze Light Strip HL_LSL with cloud product_type LightStrip, on firmware for
    which the encrypted port-88 local API has been established. WLPA19C v2,
    WLPA19/WLPA19C BR30, HL_LSLP Light Strip Pro, white bulbs, plugs, cameras
    and every other model/type are excluded rather than inferred compatible.

    Cloud inventory supplies the model, type, firmware, MAC, enr and last-known
    IP. All three model/type/firmware gates must be checked before a write;
    model alone is insufficient. The exact minimum compatible firmware is not
    established, so an unknown firmware version stops at identification rather
    than receiving a speculative command.

    POST /device_request on TCP 88 can set attended light properties locally.
    HTTP 200 is only an acknowledgement, not proof of the resulting state.
    There is no documented local state-read schema in this spec: cloud property
    polling is still required for actual state. Do not invent a GET response,
    state_mapping, optimistic local state cache or local read entity.

    identify_only is deliberate: this project has no consumer handler for the
    custom AES/padding/outer-JSON encoding. Ordinary power and light controls
    are documented as normal attended operations, not advanced operations, but
    a generic HTTP consumer must not send the plaintext endpoint body or render
    controls until such a handler exists.
  variants:
    - model: "WLPA19C"
      product_name: "Wyze Bulb Color"
      cloud_product_type: "MeshLight"
      verification: "reported"
      firmware_gate:
        required_capability: "encrypted local HTTP API on port 88"
        minimum_version: "unknown"
        rule: "Check the exact cloud-reported firmware against established compatibility; do not write when that check is unknown, enr is absent, or the cloud model/type tuple differs."
    - model: "HL_LSL"
      product_name: "Wyze Light Strip"
      cloud_product_type: "LightStrip"
      verification: "reported"
      firmware_gate:
        required_capability: "encrypted local HTTP API on port 88"
        minimum_version: "unknown"
        rule: "Check the exact cloud-reported firmware against established compatibility; do not write when that check is unknown, enr is absent, or the cloud model/type tuple differs."
  openness:
    status: "undocumented"
    reverse_engineered: true
    source_code: "https://github.com/SecKatie/wyzeapy"
    upstream_docs:
      - url: "https://github.com/SecKatie/wyzeapy/blob/907056956508d230149e63d67c21a1253e788058/src/wyzeapy/services/base_service.py"
        title: "wyzeapy local bulb request"
        covers: "Compact inner JSON, millisecond ts, outer set_status envelope, port 88 and cloud fallback."
      - url: "https://github.com/SecKatie/wyzeapy/blob/907056956508d230149e63d67c21a1253e788058/src/wyzeapy/utils.py"
        title: "wyzeapy local encryption"
        covers: "ASCII enr key/IV, AES-CBC, constant 0x05 padding and base64 slash escaping."
    notes: >
      This is an undocumented vendor-local interface reconstructed from public
      implementations, not a Wyze-published API or a claim about every mesh
      device or firmware release.
  identification:
    default_port: 88
    notes: >
      Port 88 is not a discovery or identity signal. Identify only from the
      cloud model/type/firmware tuple and manually confirmed current LAN
      address. Do not scan for open ports and then assume a matching device.
  discovery:
    none: >
      No account-free or LAN discovery protocol is documented. Obtain the
      device MAC, enr and last-known IP from authorized Wyze cloud inventory,
      then confirm the current address against the router's DHCP lease for that
      MAC. A cloud IP can be stale; a different open port 88 is not proof.
    identity:
      stable_keys: ["mac"]
      display: "nickname"
    static_ip_required: false
  setup:
    required: true
    confidence: "medium"
    notes: >
      Vendor account, BLE-assisted 2.4 GHz onboarding and cloud inventory are
      prerequisites. Direct LAN is the final stage of this ONE route, not an
      independent account-free setup method.
    methods:
      - type: "cloud_account"
        name: "Vendor BLE onboarding, cloud inventory, then direct LAN"
        role: "primary"
        verified: false
        description: >
          Complete vendor onboarding, authorize a client to the same Wyze cloud
          account, gate the exact model/type/firmware tuple, and only then send
          encrypted commands to the confirmed device address.
        cloud:
          provider: "Wyze cloud and developer API"
          local_alternative: >
            Local writes are possible only after this account/cloud-mediated
            setup and inventory. There is no account-free provisioning,
            enr-enumeration or discovery route. Cloud polling remains necessary
            for actual state.
        stages:
          - type: "ble_provisioning"
            name: "Vendor account and BLE onboarding to 2.4 GHz Wi-Fi"
            verified: false
            description: >
              Use the vendor app with Bluetooth/location permission and a
              Wyze account. Bulb Color pulses after three power cycles; Light
              Strip pulses after its controller button is held at least seven
              seconds when a reset is needed.
            steps:
              - action: "Sign in to the Wyze app and enable Bluetooth/location access. Select the exact Bulb Color or Light Strip product, not a Pro/BR30/v2 model."
                actor: "user"
              - action: "Power the light and, if it is not already pulsing, use only its matching factory-reset procedure below."
                actor: "user"
                expect: "Bulb Color or Light Strip pulses slowly in setup mode."
              - action: "Select the 2.4 GHz Wi-Fi network and complete onboarding in the vendor app."
                actor: "user"
                expect: "The exact device appears in the owner's Wyze account."
          - type: "cloud_account"
            name: "Read and gate cloud device inventory"
            verified: false
            description: >
              Authenticate with the owner's Wyze account and developer API
              Key/ID. Match product_model and product_type exactly to one
              variant, then apply its firmware gate. Record MAC, enr, firmware
              and last-known IP; confirm the current IP by MAC at the router.
            cloud:
              provider: "Wyze cloud and developer API"
              local_alternative: >
                The next stage provides local writes only after this inventory
                step. No account-free provisioning, enr retrieval or discovery
                exists; cloud polling remains required for actual state.
            steps:
              - action: "Fetch the authorized cloud device list and select only WLPA19C/MeshLight or HL_LSL/LightStrip."
                actor: "client"
                expect: "One exact model/type tuple is selected; every other tuple is rejected."
              - action: "Check the cloud firmware against the variant's firmware_gate and require a 16-byte ASCII enr plus MAC. Stop if firmware compatibility or enr is unknown."
                actor: "client"
                expect: "The firmware and encryption prerequisites are explicitly established without probing an excluded model."
              - action: "Confirm the cloud last-known IP against the router lease for the same MAC; ask the user for the current address if it differs."
                actor: "client"
                expect: "The target address belongs to the selected device, not merely to another service on port 88."
          - type: "none"
            name: "Encrypted direct-LAN writes and cloud state polling"
            verified: false
            description: >
              Build protocol_details.local_mesh_api's inner and outer JSON
              exactly, POST to the confirmed address on port 88, and treat only
              HTTP 200 as transport acknowledgement. Continue polling cloud
              properties for state.
            steps:
              - action: "Construct the inner mac/index/ts/plist object with a current Unix-epoch millisecond ts as a decimal string and only the declared property IDs."
                actor: "client"
              - action: "Apply constant-0x05 padding, AES-CBC with ASCII enr as both key and IV, standard base64, and the documented outer slash escaping."
                actor: "client"
              - action: "POST the compact outer JSON to http://<device-ip>:88/device_request and require HTTP 200."
                actor: "client"
                expect: "Transport acknowledgement only; no power, brightness, Kelvin, color or mode state is inferred from the response."
              - action: "Poll the authorized Wyze cloud property/state endpoint for the resulting state and surface stale/offline state honestly."
                actor: "client"
    factory_reset:
      applicable: true
      confidence: "medium"
      effect: >
        Returns the selected light to vendor setup mode so it can be onboarded
        again. Refetch cloud inventory and enr afterward; whether enr rotates
        is not established. Do not use either procedure on a Pro, BR30, v2 or
        other excluded model.
      procedures:
        - name: "Bulb Color: three off/on power cycles"
          applies_to: ["WLPA19C"]
          verified: false
          basis: "Wyze Bulb Color setup and factory-reset guides."
          power_state: "on"
          indicator: "The bulb pulses slowly in setup mode."
          indicator_glyph: "generic/led-flashing.svg"
          steps:
            - action: "Using the wall switch controlling the WLPA19C Bulb Color, turn it off and on three times, completing the three cycles within six seconds with less than two seconds between toggles."
              actor: "user"
            - action: "Wait for the bulb to pulse slowly, then set it up again in the Wyze app."
              actor: "device"
              expect: "Slow pulsing confirms setup mode; no local command is sent during reset."
        - name: "Light Strip: controller button held at least seven seconds"
          applies_to: ["HL_LSL"]
          verified: false
          basis: "Wyze Light Strip connectivity and factory-reset guide."
          hold_seconds: 7
          power_state: "on"
          glyph: "generic/hold-button.svg"
          indicator: "The strip starts pulsing."
          indicator_glyph: "generic/led-flashing.svg"
          steps:
            - action: "With the HL_LSL powered, press and hold the button on the side of its controller for at least seven seconds."
              actor: "user"
            - action: "Release when the strip starts pulsing and set it up again in the Wyze app."
              actor: "device"
              expect: "Pulsing confirms setup mode; seven seconds is a minimum, not a maximum."
    rejoin:
      in_place_supported: false
      requires_factory_reset: true
      notes: >
        The reviewed vendor connectivity guides direct the owner through the
        model-specific reset and setup flow for a new network. No direct-LAN or
        account-free re-provisioning path is documented. After rejoin, repeat
        the cloud model/type/firmware gate and reconfirm MAC, enr and IP.
    credentials:
      wifi_passphrase_protection: "unknown"
      stored_on_device:
        - "Wi-Fi credentials"
        - "Per-device enr local-encryption value"
      issued_to_client:
        - "Wyze cloud session and developer API Key/ID for inventory and state polling"
        - "Per-device enr used as AES key and IV"
        - "Device MAC and last-known IP (addressing metadata, not credentials)"
      notes: >
        The provisioning exchange's passphrase protection was not established.
        The local API uses reusable symmetric obfuscation, not per-client
        pairing or forward secrecy. Anyone holding enr and network access can
        construct a write; protect cloud inventory and local network access.
  pairing:
    required: true
    confidence: "medium"
    security_mode: "app_layer"
    bonding: "none"
    pin:
      source: "vendor_app"
      notes: >
        There is no local pairing PIN. Authorization is possession of the
        per-device enr obtained from the vendor cloud after account/developer
        authentication. BLE is used for onboarding, not a persistent client
        bond for this LAN endpoint.
    exclusivity:
      single_connection: "unknown"
      single_bond: true
      recovery: >
        A light belongs to one Wyze account. Remove it in the old account or
        use its exact model reset before onboarding to a new account. HTTP
        client concurrency is not established; serialize writes per device.
    unpair:
      supported: true
      requires_factory_reset: false
      clears: "The vendor account binding when removed in the app; local enr revocation or rotation is not established."
      notes: >
        Removing a device from the cloud account is not proof that a copied enr
        stops working locally. For a compromised enr, reset and re-onboard,
        then refetch inventory; verify rotation before treating the old value
        as revoked.
    enter_pairing_mode:
      required: false
    notes: >
      No separate LAN pairing window exists. Pulsing setup mode belongs to
      vendor onboarding, not authorization of a generic local HTTP client.

local_access:
  status: "native"
  summary: >
    On an explicitly compatible model/type/firmware tuple, attended power,
    brightness, Kelvin, RGB and color/white-mode writes can be sent directly to
    the light after cloud onboarding and inventory.
  covers:
    - "P3 power 0/1"
    - "P1501 brightness 0-100"
    - "P1502 correlated color temperature 1800-6500 K"
    - "P1507 six-digit RRGGBB color and P1508 color/white mode"
  not_covered:
    - "Account-free provisioning or discovery"
    - "Local state reads or acknowledgement-independent state confirmation"
    - "Cloud-independent actual-state polling"
    - "Effects, music mode, scheduling, groups and every property not listed here"
    - "All excluded models and unestablished firmware"

http_endpoints:
  - method: "POST"
    path: "/device_request"
    name: "Encrypted mesh-light property write"
    status: "unverified"
    description: >
      Documentary port-88 write endpoint. It requires the custom encoder in
      protocol_details.local_mesh_api and is not a generic plaintext JSON
      command. HTTP 200 acknowledges the request only; no local state-read
      schema is declared. Normal attended light operation, not an advanced
      firmware/configuration endpoint, but unavailable to this project's
      generic consumer while integration is identify_only.
    request_body:
      content_type: "application/json"
      fields:
        - name: "request"
          type: "string"
          required: true
          enum: ["set_status"]
          description: "Literal operation name."
        - name: "isSendQueue"
          type: "integer"
          required: true
          enum: [0]
          description: "Numeric zero, not a string."
        - name: "characteristics"
          type: "string"
          required: true
          description: "Standard base64 AES-CBC ciphertext; its outer JSON representation escapes every / as \/."
      example: >-
        {"request":"set_status","isSendQueue":0,"characteristics":"2vHkj5+E+yO5p3zvMwUZ0K+Aivqd68Hp2gUUwzPOBZ1+bLi7j2KUqAnSpR8y5LpM38S9\/i7rZr3DcXKZdD4DPobwiLIfe+6v8Sq42P0Sj4zhNRz4pZ3f81ye7j4xw9sC"}

protocol_details:
  local_mesh_api:
    verification: "reported"
    transport: "http"
    method: "POST"
    port: 88
    path: "/device_request"
    url: "http://<device-ip>:88/device_request"
    gate:
      source: "Authorized Wyze cloud device inventory"
      required_fields: ["product_model", "product_type", "firmware_ver", "mac", "enr", "device_params.ip"]
      allowed_tuples:
        - {product_model: "WLPA19C", product_type: "MeshLight"}
        - {product_model: "HL_LSL", product_type: "LightStrip"}
      firmware: "Require established encrypted-port-88 compatibility for the exact reported version; minimum versions are unknown and no range is inferred."
      enr: "Require exactly 16 ASCII bytes for this AES-128 profile."
      address: "Confirm the current IP by device MAC at the router; cloud IP alone may be stale."
    inner_json:
      encoding: "ASCII"
      serialization: "Compact JSON with no whitespace, preserving key order mac,index,ts,plist and pid,pvalue within each property."
      field_order: ["mac", "index", "ts", "plist"]
      fields:
        mac: "Uppercase 12 hexadecimal digits with no separators, from cloud inventory."
        index: "String literal 1."
        ts: "Current Unix-epoch time in MILLISECONDS as a base-10 JSON string, not seconds and not a JSON number."
        plist: "Array of {pid: string, pvalue: string} entries in the order shown by the selected property vector."
      properties:
        P3: {meaning: "power", pvalue_type: "decimal string", allowed: ["0", "1"], labels: ["off", "on"]}
        P1501: {meaning: "brightness", pvalue_type: "decimal string", min: 0, max: 100, unit: "%"}
        P1502: {meaning: "correlated color temperature", pvalue_type: "decimal string", min: 1800, max: 6500, unit: "K"}
        P1507: {meaning: "RGB color", pvalue_type: "six ASCII hexadecimal digits RRGGBB without #; canonical vectors uppercase", pattern: "^[0-9A-Fa-f]{6}$"}
        P1508: {meaning: "light mode", pvalue_type: "decimal string", allowed: ["1", "2"], labels: ["color", "white"]}
      mode_combinations:
        color: "When explicitly selecting color, include P1507 RRGGBB followed by P1508=1 in the same plist."
        white: "When explicitly selecting white temperature, include P1502 Kelvin followed by P1508=2 in the same plist."
    encryption:
      algorithm: "AES-128-CBC"
      key: "The 16 enr ASCII bytes, used directly; do not hex-decode, hash, pad or UTF-16 encode the key."
      iv: "The same 16 enr ASCII bytes as the key."
      padding:
        name: "constant-0x05"
        block_size_bytes: 16
        rule: "Append byte 0x05 exactly 16 - (plaintext_length mod 16) times. This always adds 1-16 bytes, including a full sixteen-byte block when already aligned. It is NOT PKCS#7: do not append the pad LENGTH."
      base64: "Standard RFC 4648 alphabet with +, / and = padding; never URL-safe base64."
      openssl_equivalent: "After custom padding: openssl enc -aes-128-cbc -K <32-lowercase-hex-digits-of-enr> -iv <same-32-hex-digits> -nopad"
    outer_json:
      serialization: "Compact JSON with key order request,isSendQueue,characteristics and no whitespace."
      request: "set_status"
      isSendQueue: 0
      characteristics: "Base64 ciphertext string."
      slash_escaping:
        wire_rule: "Inside the characteristics JSON string, represent every base64 / as the two-character JSON escape \/."
        safe_construction: "Concatenate the fixed outer prefix, the base64 with / replaced by \/, and the closing quote/brace. Do not URL-encode, switch to base64url, or emit \\/ on the wire."
        rationale: "JSON parsing turns \/ back into /, so the decoded characteristics value is standard base64. The public implementation performs an equivalent final JSON-string slash escape."
      exact_prefix: "{\"request\":\"set_status\",\"isSendQueue\":0,\"characteristics\":\""
      exact_suffix: "\"}"
    response:
      success_transport: "HTTP 200"
      acknowledgement_only: true
      body_schema: null
      local_state_read_schema: null
      actual_state_source: "Authorized Wyze cloud property/state polling remains required."
      failure_handling: "Timeout, connection refusal, non-200 or stale cloud state is not success. Do not silently turn a failed local write into a cloud write without the user's chosen fallback policy."
    test_vectors:
      description: "All MAC and enr values are invented documentation values. The expected ciphertext was independently generated with OpenSSL AES-128-CBC after the stated constant-0x05 padding."
      common:
        enr: "0123456789abcdef"
        enr_hex: "30313233343536373839616263646566"
        mac: "00005E000001"
        index: "1"
        ts: "1700000000123"
      crypto:
        inner_json: "{\"mac\":\"00005E000001\",\"index\":\"1\",\"ts\":\"1700000000123\",\"plist\":[{\"pid\":\"P3\",\"pvalue\":\"1\"}]}"
        plaintext_length: 91
        padded_length: 96
        ciphertext_base64: "2vHkj5+E+yO5p3zvMwUZ0K+Aivqd68Hp2gUUwzPOBZ1+bLi7j2KUqAnSpR8y5LpM38S9/i7rZr3DcXKZdD4DPobwiLIfe+6v8Sq42P0Sj4zhNRz4pZ3f81ye7j4xw9sC"
        outer_json: "{\"request\":\"set_status\",\"isSendQueue\":0,\"characteristics\":\"2vHkj5+E+yO5p3zvMwUZ0K+Aivqd68Hp2gUUwzPOBZ1+bLi7j2KUqAnSpR8y5LpM38S9\\/i7rZr3DcXKZdD4DPobwiLIfe+6v8Sq42P0Sj4zhNRz4pZ3f81ye7j4xw9sC\"}"
      padding:
        - {plaintext_hex: "", expected_padded_hex: "05050505050505050505050505050505"}
        - {plaintext_hex: "41", expected_padded_hex: "41050505050505050505050505050505"}
        - {plaintext_hex: "000102030405060708090a0b0c0d0e0f", expected_padded_hex: "000102030405060708090a0b0c0d0e0f05050505050505050505050505050505"}
      properties:
        power_on:
          plist: [{pid: "P3", pvalue: "1"}]
          inner_json: "{\"mac\":\"00005E000001\",\"index\":\"1\",\"ts\":\"1700000000123\",\"plist\":[{\"pid\":\"P3\",\"pvalue\":\"1\"}]}"
        power_off:
          plist: [{pid: "P3", pvalue: "0"}]
          inner_json: "{\"mac\":\"00005E000001\",\"index\":\"1\",\"ts\":\"1700000000123\",\"plist\":[{\"pid\":\"P3\",\"pvalue\":\"0\"}]}"
        brightness:
          plist: [{pid: "P1501", pvalue: "100"}]
          inner_json: "{\"mac\":\"00005E000001\",\"index\":\"1\",\"ts\":\"1700000000123\",\"plist\":[{\"pid\":\"P1501\",\"pvalue\":\"100\"}]}"
        white_4000k:
          plist: [{pid: "P1502", pvalue: "4000"}, {pid: "P1508", pvalue: "2"}]
          inner_json: "{\"mac\":\"00005E000001\",\"index\":\"1\",\"ts\":\"1700000000123\",\"plist\":[{\"pid\":\"P1502\",\"pvalue\":\"4000\"},{\"pid\":\"P1508\",\"pvalue\":\"2\"}]}"
        color_00ff80:
          plist: [{pid: "P1507", pvalue: "00FF80"}, {pid: "P1508", pvalue: "1"}]
          inner_json: "{\"mac\":\"00005E000001\",\"index\":\"1\",\"ts\":\"1700000000123\",\"plist\":[{\"pid\":\"P1507\",\"pvalue\":\"00FF80\"},{\"pid\":\"P1508\",\"pvalue\":\"1\"}]}"

payload_formats:
  MeshLocalAcknowledgement:
    description: "Transport acknowledgement only, deliberately not a state envelope."
    parse_rules:
      - "Require HTTP 200 before counting the write as acknowledged."
      - "Do not infer a resulting property value from HTTP 200 or from an undocumented response body."
      - "Use authorized Wyze cloud polling for actual state; no local state-read schema is declared."

evidence:
  public_implementation: >
    wyzeapy's local request builder establishes the compact mac/index/ts/plist
    document, millisecond string timestamp, outer envelope and port-88 URL. Its
    encryption helper establishes direct ASCII enr key/IV and constant-0x05
    padding. ha-wyzeapi establishes P1508=1 with RGB and P1508=2 with Kelvin.
    Nothing in those sources establishes a local state-read response schema.
  artifacts:
    - type: "public_implementation"
      artifact: "SecKatie/wyzeapy"
      commit: "907056956508d230149e63d67c21a1253e788058"
      url: "https://github.com/SecKatie/wyzeapy"
      obtained_via: "Public Git repository, reviewed 2026-11-18"
      description: "Request and encryption transcription source; SHA is the reviewed Git commit, not a file digest."
    - type: "public_implementation"
      artifact: "SecKatie/ha-wyzeapi"
      commit: "1a553da0d327d2714f1d0bf6a5c1e359ebd160f9"
      url: "https://github.com/SecKatie/ha-wyzeapi"
      obtained_via: "Public Git repository, reviewed 2026-11-18"
      description: "Property ranges and color/white-mode pairing; SHA is the reviewed Git commit, not a file digest."
    - type: "community_thread"
      artifact: "Wyze Local API - Encoding Changes"
      url: "https://forums.wyze.com/t/wyze-local-api-encoding-changes/206479"
      obtained_via: "Public forum, reviewed 2026-11-18"
      description: "Independent report of the port-88 encrypted characteristics envelope and cloud-issued enr."
  open_questions: >
    Exact compatible firmware ranges, response-body semantics, enr rotation,
    offline longevity and the reliability of Light Strip writes remain open.
    No local state read is inferred from cloud property APIs.

remaining_unknowns:
  - "Minimum and maximum compatible firmware for each allowed model/type tuple are not established; unknown firmware must not receive writes."
  - "The local response body beyond HTTP acknowledgement is undocumented and must not be treated as state."
  - "Whether factory reset, re-onboarding or account removal rotates enr is not established."
  - "Cloud IP freshness and operation during a prolonged cloud outage require hardware verification."
  - "No local effects, music, schedules, groups, scene or state-read protocol is claimed."

