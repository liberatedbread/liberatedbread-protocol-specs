# Anova Precision Cooker Nano — model-specific COBS/proto2 BLE spec
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# Sources: Anova's Nano developer pages, MIT reference client and actual proto2
# schema at 2e912490ab4273240ff42b37e7476189cdd46bac, plus a static UUID check
# of com.anovaculinary.android 3.6.6. No hardware capture or live-device test.

device:
  name: "Anova Precision Cooker Nano"
  manufacturer: "Anova Applied Electronics"
  manufacturer_status: "active"
  type: "sous-vide-immersion-circulator"
  model: "Precision Cooker Nano"
  category: "appliance"
  protocol: "ble"
  transport: "ble-gatt"
  testing:
    status: untested
    notes: >
      No Nano was scanned, connected, paired or driven by this project. Anova's
      official client and actual proto2 schema were exercised only with synthetic
      data and fake BLE objects in the research pack. The unified Android app's
      React Native bundle corroborates the service and all three characteristics,
      not COBS, protobuf opcodes or live compatibility. Independent standard-
      library framing and decode checks are in
      scripts/test_anova_precision_cooker_nano.py; vectors are not captures.
  openness:
    status: "documented_api"
    reverse_engineered: true
    source_code: "https://github.com/anova-culinary/developer-project-nano"
    license: "MIT"
    upstream_docs:
      - url: "https://developer.anovaculinary.com/docs/devices/nano/overview"
        title: "Anova developer docs: Precision Cooker Nano overview"
        covers: "Service/RX/TX/ASYNC roles, command envelope, COBS framing and chunking."
      - url: "https://developer.anovaculinary.com/docs/devices/nano/ble-protocol"
        title: "Anova developer docs: Nano BLE communication protocol"
        covers: "UUIDs, RX/ASYNC subscriptions, COBS delimiter, TX writes and response aggregation guidance."
      - url: "https://developer.anovaculinary.com/docs/devices/nano/implementation-example"
        title: "Anova developer docs: Nano implementation example"
        covers: "Identifies the official MIT reference implementation used as the primary command/schema source."
    notes: >-
      The cached web command/protobuf tables conflict with the executable source.
      They assign configuration domain 0x01 and different opcodes, while the
      actual schema and client use configuration domain 0x00. This spec follows
      the pinned executable schema and records the conflict rather than sending
      the web-only values. No bulk transfer, reset, message-spoof or firmware
      command is declared.
  safety_advisory:
    severity: "warning"
    summary: >-
      This spec can start and retarget an immersion heater. Starting a cook and
      changing its setpoint require a deliberate action; stopping remains an
      ordinary, immediately available command.
    detail: >-
      Use only a correctly installed cooker with the water and vessel conditions
      required by its own vendor instructions. No authentic Nano manual was
      acquired, so this spec supplies no safe temperature range, water-depth rule
      or unattended-use claim. Read the temperature unit before every setpoint,
      preserve every sensor's own unit and scale, and never trust the reference
      client's optimistic local cooking flag or an arbitrary response as proof of
      a state change. Keep stop_cooking available, serialize requests with
      timeouts, and confirm attended stop behavior before testing a start.
  companion_apps:
    - name: "Anova Culinary"
      package: "com.anovaculinary.android"
      role: "primary"
      platform: "android"
      url: "https://play.google.com/store/apps/details?id=com.anovaculinary.android"
      notes: >-
        Version 3.6.6 (versionCode 2127) was checked statically in the November
        15 follow-up. Its React Native bundle contains all four Nano UUIDs in
        this spec. That corroborates identifiers only; the COBS/proto2 mapping
        comes from Anova's official Nano source, not from this string check.
  notes: >
    The BLE Nano uses one custom service with TX, RX and ASYNC characteristics.
    Commands have a two-byte domain/type header followed by an optional proto2
    payload, then the entire logical packet is COBS-encoded and terminated by one
    zero delimiter. TX writes are split into at most 20-byte chunks in the
    official client. RX responses are reassembled; ASYNC is subscribed but its
    payload schema is not decoded by that client.

    Normal operations use domain 0x00. Set/get target, get sensors, set/get unit,
    start/stop, set/get timer and get firmware are the demonstrated subset. The
    timer is MINUTES in the executable method, README and interactive prompts;
    a source-file top comment saying seconds is an internal documentation error,
    not a wire fact. Target temperature uses the current unit at scale 10.
    Sensors each carry their own unit and scale; never divide every sensor by 10.

    SCOPE: this is the BLE Precision Cooker Nano. It is not the Mini's
    JSON/Base64 protocol, the original cooker's CR-terminated ASCII protocol on
    FFE0/FFE1, Nano 3.0/Wi-Fi models, later Mini/Lite hardware, or Anova cloud
    APIs. The original cooker's fixed PIN and the Mini's explicit host-pairing
    and reset instructions are not inherited.

  identification:
    service_uuids:
      - "0e140000-0af1-4582-a242-773e63054c68"
    notes: >-
      Require this advertised custom service, then confirm TX, RX and ASYNC after
      connecting. A third-party 2019 capture advertised the name Nano, but the
      official client matches the service and does not require that name. Do not
      use the name alone to distinguish a Nano from other Anova generations.
  discovery:
    methods:
      - type: "ble_scan"
        ble:
          service_uuids:
            - "0e140000-0af1-4582-a242-773e63054c68"
        verification: "reported"
        notes: >-
          The official client filters on this service and compares advertisement
          UUIDs case-insensitively. It chooses the first match; a production
          client should let the owner confirm the cooker before any heater write.
    identity:
      stable_keys: ["address"]
      display: "local_name"
      notes: >-
        The reference client keys the connection on the host Bluetooth device.
        Address type and stability are not established. DeviceInfo defines a
        serial field, but its read is not implemented in the reference client and
        no real serial may be logged or published.
    static_ip_required: false
  setup:
    required: false
    confidence: "medium"
    notes: >-
      No Wi-Fi provisioning, Anova account, cloud API, application key or fixed
      PIN appears in the official local client. Connect, subscribe to RX then
      ASYNC, and read the temperature unit before commands. Bonding remains
      unknown; see device.pairing. This flow has not been replayed on hardware.
    methods:
      - type: "ble_direct"
        name: "Direct BLE with RX/ASYNC subscriptions"
        role: "primary"
        verified: false
        description: >-
          Scan for the Nano service, connect, subscribe to RX then ASYNC, read
          the temperature unit and serialize framed commands with timeouts. No
          heater write is part of setup.
        ble:
          service_uuid: "0e140000-0af1-4582-a242-773e63054c68"
          write_characteristic: "0e140001-0af1-4582-a242-773e63054c68"
          read_characteristic: "0e140002-0af1-4582-a242-773e63054c68"
        steps:
          - action: "Power the Nano and scan for advertisements carrying 0e140000-0af1-4582-a242-773e63054c68, then connect."
            actor: "client"
            timeout_seconds: 10
          - action: "Subscribe to RX 0e140002-0af1-4582-a242-773e63054c68 first and ASYNC 0e140003-0af1-4582-a242-773e63054c68 second."
            actor: "client"
          - action: "Send get_temperature_unit through the COBS handler and wait for its IntegerValue response with a timeout."
            actor: "client"
            expect: "A known UnitType establishes the current temperature unit. Unknown units are an error, not a Fahrenheit fallback. Do not send start_cooking during setup."
          - action: "Serialize subsequent commands one at a time, reassembling RX with the bounded rules in protocol_details.transport and preserving ASYNC bytes for future capture analysis rather than guessing a state object."
            actor: "client"
        troubleshooting:
          - symptom: "No response or responses appear to belong to another request."
            fix: "Stop sending, drain stale RX chunks, then retry get_temperature_unit with one request in flight and a bounded timeout. The reference has no sequence number or response correlation; never continue a heater sequence after losing alignment."
    factory_reset:
      applicable: "unknown"
      confidence: "low"
      effect: >-
        No physical factory-reset procedure was recovered. The schema contains a
        bulk-domain system-reset message, but it is excluded from this spec and is
        not evidence of a safe owner reset flow or of what it clears.
      description: >-
        No authentic Nano quickstart manual was acquired. Do not reuse the
        Mini's ten-second top-button hold or the original cooker's Bluetooth
        button procedure for the Nano.
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >-
        There is no router to rejoin on this BLE path. Moving hosts means
        scanning and connecting from the new host; whether an old bond must be
        removed, and how, is unknown. No factory reset is asserted as necessary.
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device: []
      issued_to_client: []
      notes: >-
        No Wi-Fi credential, application key or fixed PIN crosses the documented
        BLE protocol. Whether link-layer bonds are stored is unknown, so the
        empty list is not a claim that no bond state exists.
  pairing:
    required: "unknown"
    confidence: "low"
    security_mode: "unknown"
    bonding: "unknown"
    exclusivity:
      single_connection: "unknown"
      single_bond: "unknown"
      recovery: >-
        Close other clients and retry a read-only connection and
        get_temperature_unit. Do not invent a PIN, borrow a sibling model's
        pairing hold, or issue reset/bulk-domain writes to force rebinding.
      notes: >-
        The official source does not state a PIN, bonding workflow, application
        key, central limit or bond capacity.
    enter_pairing_mode:
      required: "unknown"
      notes: >-
        The service is advertised for scanning, but no physical pairing-mode
        procedure or window was recovered.
    unpair:
      supported: "unknown"
      clears: "Unknown; no Nano-specific bond-removal procedure was recovered."
      notes: >-
        Do not infer that host-side Forget clears device state, or that a factory
        reset is required. Actual bonding and reconnect behavior needs hardware.
    notes: >-
      Pairing is an open question, not a hidden fixed-PIN or app-key flow. The
      official client connects and subscribes without demonstrating whether an
      unbonded link can complete every command.

# Command values/templates below are LOGICAL domain/type/proto2 packets, not
# bytes safe to write directly. This handler applies strict COBS, the delimiter,
# chunking and RX reassembly. A consumer without it must not send raw templates.
protocol_handler: "anova_nano_cobs"

initialization:
  - characteristic: "0e140002-0af1-4582-a242-773e63054c68"
    subscribe: true
    when: "connect"
    notes: "Open RX notifications first. Command responses are reassembled from this characteristic."
  - characteristic: "0e140003-0af1-4582-a242-773e63054c68"
    subscribe: true
    when: "connect"
    notes: "Open ASYNC second, as the official client does. Its payload schema is unknown; do not treat alert/message definitions as proof of the envelope."
  - characteristic: "0e140001-0af1-4582-a242-773e63054c68"
    description: "Send get_temperature_unit through protocol_handler before interpreting or setting temperatures. This is deliberately not a raw initialization write: the logical 00 07 packet must be COBS-framed first."
    when: "connect"

services:
  - uuid: "0e140000-0af1-4582-a242-773e63054c68"
    name: "Anova Precision Cooker Nano control"
    notes: >-
      UUIDs come from Anova's Nano source and are corroborated in the unified
      app bundle. Commands declared on TX are logical packets BEFORE COBS. RX
      responses use the same outer framing, but their header/payload correlation
      is not fully established and must be checked per the expected request.
    characteristics:
      - uuid: "0e140001-0af1-4582-a242-773e63054c68"
        name: "TX (host to cooker)"
        properties: ["write", "write_without_response"]
        role: "command"
        verification: "reported"
        notes: >-
          The official client writes sequential chunks of at most 20 bytes with
          no explicit response argument, so the exact hardware property set and
          required ATT write mode were not established. Both write modes are
          listed as candidates, not as a claim that every unit exposes both.
          Discover actual properties and follow the reference's default behavior
          rather than forcing response=False. Apply the COBS handler to every
          logical command value/template below before writing.
        commands:
          set_target_temperature:
            description: >-
              Domain 0, type 3, IntegerValue field 1. The UI parameter is the raw
              signed-scale numerator: raw = truncate-toward-zero(temperature x
              10), in the current unit. The template is pre-COBS. This declared
              varint form accepts non-negative raw values only; negative int32
              encoding and any safe operating range are outside this spec.
            template: [0x00, 0x03, 0x08, "{setpoint}"]
            command_id: 3
            parameters:
              setpoint:
                type: "varint"
                min: 0
                scale: 0.1
                unit_source: "device_setting"
                unit_reference: "get_temperature_unit"
                unit_values:
                  0: "C"
                  1: "F"
                description: "Non-negative raw tenths of a degree in the current unit (65.5 becomes 655). The handler truncates temperature x 10 toward zero and emits unsigned protobuf varint; no safe maximum is asserted."
            advanced: true
            advanced_reason: >-
              Changing the target can heat an active bath, and the same number
              means different temperatures in C and F. Read the current unit and
              confirm physical setup with the owner present; read target/sensors
              afterwards and keep stop_cooking available for recovery.
            verification: "reported"
          get_target_temperature:
            description: "Domain 0, type 4, empty payload, pre-COBS. Expected IntegerValue response is raw tenths of a degree in the current unit; validate its response header instead of assuming every response echoes type 4."
            value: [0x00, 0x04]
            command_id: 4
            verification: "reported"
          get_sensors:
            description: "Domain 0, type 5, empty payload, pre-COBS. Expected SensorValueList response; preserve all sensors and apply each entry's own unit scale. It does not establish cooking state."
            value: [0x00, 0x05]
            command_id: 5
            verification: "reported"
          set_temperature_unit:
            description: "Domain 0, type 6, IntegerValue field 1: 0 selects 0.1 C and 1 selects 0.1 F, pre-COBS. Read the unit and all temperatures afterwards; do not interpret any other input as Fahrenheit."
            template: [0x00, 0x06, 0x08, "{unit}"]
            command_id: 6
            parameters:
              unit:
                type: "varint"
                min: 0
                max: 1
                labels: ["0.1 Celsius", "0.1 Fahrenheit"]
                description: "UnitType enum value placed in IntegerValue.value. The reference client uses only 0 and 1 for writes."
            verification: "reported"
          get_temperature_unit:
            description: "Domain 0, type 7, empty payload, pre-COBS. Required before temperature interpretation. Expected IntegerValue carries a UnitType; 0/4/6 mean C and 1/5/7 mean F for display, with scale 10/100/1 respectively."
            value: [0x00, 0x07]
            command_id: 7
            verification: "reported"
          start_cooking:
            description: "Domain 0, type 10 (0x0a), empty payload, pre-COBS. The reference sets a local flag after any raw response; that is not evidence of actual heating. Confirm state through real responses once a capture establishes them, and keep stop_cooking available."
            value: [0x00, 0x0a]
            command_id: 10
            advanced: true
            advanced_reason: >-
              This can start an immersion heater. Confirm the unit, setpoint,
              timer and physical setup with the owner present. No validated
              cooking-state response exists here, so stop immediately on any
              unexpected result and do not treat a raw acknowledgment as success.
            verification: "reported"
          stop_cooking:
            description: "Domain 0, type 11 (0x0b), empty payload, pre-COBS. Ordinary recovery command, deliberately not advanced. A raw response or cleared local flag does not prove the heater stopped."
            value: [0x00, 0x0b]
            command_id: 11
            verification: "reported"
          set_cooking_timer:
            description: "Domain 0, type 16 (0x10), IntegerValue field 1 containing MINUTES, pre-COBS. The executable method, README and prompts agree on minutes; the source-file top comment saying seconds is wrong. Zero semantics, maximum and running-timer behavior are unknown."
            template: [0x00, 0x10, 0x08, "{minutes}"]
            command_id: 16
            parameters:
              minutes:
                type: "varint"
                min: 0
                unit: "min"
                description: "Non-negative whole minutes encoded as unsigned protobuf varint. No maximum is asserted; do not assign disabled/unlimited meaning to zero without device evidence."
            verification: "reported"
          get_cooking_timer:
            description: "Domain 0, type 18 (0x12), empty payload, pre-COBS. Expected IntegerValue is minutes. Validate the response header; stop/cancel timer operations are not part of the demonstrated client subset."
            value: [0x00, 0x12]
            command_id: 18
            verification: "reported"
          get_firmware_info:
            description: "Domain 0, type 26 (0x1a), empty payload, pre-COBS. Expected FirmwareInfo has commit ID, tag ID and uint32 date code. The client's Unix-timestamp interpretation of date code is not hardware-verified."
            value: [0x00, 0x1a]
            command_id: 26
            verification: "reported"
      - uuid: "0e140002-0af1-4582-a242-773e63054c68"
        name: "RX (cooker responses)"
        properties: ["notify"]
        role: "notify"
        verification: "reported"
        notes: >-
          Subscribe before commands. Reassemble notification chunks with the
          bounded source heuristic in protocol_details.transport, remove the
          delimiter before strict COBS decode, then parse the two-byte header and
          expected proto2 payload. No sequence number or universal response-type
          echo is established; serialize requests and reject stale responses.
      - uuid: "0e140003-0af1-4582-a242-773e63054c68"
        name: "ASYNC (unsolicited cooker data)"
        properties: ["notify"]
        role: "notify"
        verification: "reported"
        notes: >-
          Subscribe after RX, but the reference handler only logs raw chunks.
          DeviceState and alert messages in the schema are capture candidates,
          not proven ASYNC payloads. No cooking state, alert bit or notification
          envelope is decoded or exposed as fact here.

payload_formats:
  IntegerValue:
    description: >-
      Proto2 message with required signed int32 value as field 1: tag 0x08
      followed by a protobuf base-128 varint. It is not fixed-width little-endian.
      Command meanings and units come from the request's domain/type header.
    fields:
      - name: "value"
        description: "Signed int32 at field 1. Non-negative command values use ordinary unsigned LEB128; standard int32 negative values use sign-extended protobuf encoding, which this spec's non-negative UI parameters do not emit."
    parse_rules:
      - "Strictly COBS-decode after removing the frame delimiter, then separate the two-byte domain/type header from the proto2 body only after validating the expected response shape."
      - "Require field tag 0x08 for IntegerValue and consume the complete varint with bounds checks. Reject truncated/overlong encodings and unexpected trailing fields rather than returning zero."
      - "For target temperature use raw x 0.1 in the current unit. For the timer use raw minutes. For unit selection interpret raw as UnitType, not temperature."
    example: "00 03 08 8f 05 = domain 0, type 3, IntegerValue.value 655 (65.5 in the current unit)"
  SensorValueList:
    description: >-
      Proto2 repeated field 1 of SensorValue entries. Each list entry is a
      length-delimited SensorValue with required int32 value field 1 (tag 08),
      UnitType units field 2 (tag 10), and sensorType field 3 (tag 18).
    fields:
      - name: "values"
        description: "Zero or more complete SensorValue entries. Preserve ordering, raw values, units and sensor types; do not expose only the first temperature."
    parse_rules:
      - "For the expected get_sensors response require header 00 05 before parsing the list. Other response headers are not silently accepted as this shape."
      - "Parse each length-delimited entry within its declared boundary and require all three fields. Unknown wire types, units and sensor types remain explicit errors/unknowns."
      - "Temperature conversions use protocol_details.unit_types: raw/10 for units 0 or 1, raw/100 for 4 or 5, and raw unchanged for 6 or 7. Motor speed and Boolean are not temperatures."
      - "Water temperature is sensorType 0 only. A missing water sensor is unknown, never zero; do not copy the reference client's unknown-unit Fahrenheit fallback."
    example: "00 05 0a 07 08 8f 05 10 00 18 00 = one water-temperature sensor, raw 655, units 0, sensorType 0 = 65.5 C"
  FirmwareInfo:
    description: "Proto2 fields: string commitId field 1, string tagId field 2, uint32 dateCode field 3."
    parse_rules:
      - "Parse length-delimited strings with bounds checks and a bounded uint32 varint. Do not search for the first 0x0a as a universal header-stripping rule."
      - "Expose dateCode as a raw integer unless firmware evidence confirms the reference client's assumed Unix-timestamp interpretation."
  DeviceInfo:
    description: >-
      Schema-only message, not a declared read response: uint32 revision,
      modelNumber, boardRevision, bom, platform, cmCode and dateCode at fields
      1-7, followed by string serialNumber at field 8. The reference client does
      not implement its read; never publish a real serial.
  DeviceState:
    description: >-
      Schema-only message with required SensorValue waterTemp field 1 and
      SysAlertBitVector alerts field 2. The web page's flat DeviceStatus and
      CookingState definitions are absent from the actual schema. ASYNC transport
      of this message is unverified.
  SysAlertBitVector:
    description: "Required uint32 prevSetVector field 1 and currVector field 2. Flag meanings are bit masks, not list indices; previous/current and transport semantics are unverified."
    values:
      0x0001: "Heating rate updated"
      0x0002: "Cooking started"
      0x0004: "Setpoint reached"
      0x0008: "Event log full"
      0x0010: "Water leak"
      0x0020: "Water low"
      0x0040: "Motor stuck"
      0x0080: "Heater over-temperature"
      0x0100: "Triac over-temperature"
      0x0200: "Cooking timer started"
      0x0400: "Setpoint changed"
      0x0800: "Units changed"
      0x1000: "Reset"
      0x2000: "Cooking timer expired"
      0x4000: "Delta temperature"
    parse_rules:
      - "Do not decode arbitrary ASYNC bytes as this message until a capture establishes the envelope. Surface safety bits if later confirmed; never use them to suppress or override device protections."

protocol_details:
  transport:
    logical_packet: "[one-byte domain][one-byte message type][zero or more proto2 payload bytes]"
    configuration_domain: 0
    bulk_transfer_domain: 1
    command_template_boundary: >-
      Every value/template under TX.commands is the logical packet above and is
      NOT COBS-encoded yet. protocol_handler anova_nano_cobs must perform the
      following steps. Writing a raw template directly is a client bug.
    encode_steps:
      - "Build the two-byte domain/type header and append the exact proto2 payload, if any. Normal commands use domain 0."
      - "COBS-encode the entire header-plus-payload using standard consistent-overhead-byte-stuffing code blocks, including long blocks of 254 non-zero bytes."
      - "Append exactly one 0x00 frame delimiter. COBS supplies framing, not a checksum or authentication."
      - "Split the encoded frame INCLUDING its delimiter into consecutive chunks of at most 20 bytes and write them in order to TX. Twenty is the source chunk size, not a negotiated-MTU prohibition."
    decode_steps:
      - "Accumulate RX chunks in arrival order. The source heuristic completes a response when a chunk is shorter than 20 bytes OR ends in 0x00; bound total size and time because the heuristic is not a validated general fragmentation protocol."
      - "Remove the transport delimiter before applying a strict COBS decoder. Reject malformed codes, truncation and excess data. Do not copy the reference decoder's permissive full-delimiter behavior, which can add a trailing zero."
      - "Validate the response header and expected proto2 body for the one request in flight. Do not strip headers by searching for 0x08, 00 05 or the first 0x0a anywhere in the body."
      - "Serialize requests with a timeout and stale-frame rejection. No request ID, command lock or universal response domain/type correlation is documented."
    response_vector_note: >-
      The published command vectors are exact source-generated offline vectors.
      The response vector below is synthetic and independently transcribed from
      the actual proto2 field definitions, not a cooker capture.
  command_vectors:
    - name: "get_temperature_unit"
      raw_hex: "00 07"
      framed_hex: "01 02 07 00"
    - name: "get_sensors"
      raw_hex: "00 05"
      framed_hex: "01 02 05 00"
    - name: "start_cooking"
      raw_hex: "00 0a"
      framed_hex: "01 02 0a 00"
    - name: "stop_cooking"
      raw_hex: "00 0b"
      framed_hex: "01 02 0b 00"
    - name: "set_target_temperature"
      parameters: {"setpoint": 655}
      raw_hex: "00 03 08 8f 05"
      framed_hex: "01 05 03 08 8f 05 00"
      decoded_example: "65.5 in the current unit"
    - name: "set_temperature_unit"
      parameters: {"unit": 0}
      raw_hex: "00 06 08 00"
      framed_hex: "01 03 06 08 01 00"
      decoded_example: "0.1 C"
    - name: "set_cooking_timer"
      parameters: {"minutes": 60}
      raw_hex: "00 10 08 3c"
      framed_hex: "01 04 10 08 3c 00"
      decoded_example: "60 minutes"
    - name: "get_firmware_info"
      raw_hex: "00 1a"
      framed_hex: "01 02 1a 00"
  response_vectors:
    - name: "One water-temperature sensor at 65.5 C"
      command: "get_sensors"
      raw_hex: "00 05 0a 07 08 8f 05 10 00 18 00"
      framed_hex: "01 08 05 0a 07 08 8f 05 10 02 18 01 00"
      expected:
        sensor_type: 0
        units: 0
        raw_value: 655
        decoded_value: 65.5
        decoded_unit: "C"
  unit_types:
    - {value: 0, meaning: "0.1 C", scale: 0.1, unit: "C", write_use: "set_temperature_unit"}
    - {value: 1, meaning: "0.1 F", scale: 0.1, unit: "F", write_use: "set_temperature_unit"}
    - {value: 2, meaning: "Motor speed", scale: 1.0, unit: "unknown motor-dependent unit", write_use: "decode only"}
    - {value: 3, meaning: "Boolean", scale: 1.0, unit: "0 false; nonzero true", write_use: "decode only"}
    - {value: 4, meaning: "0.01 C", scale: 0.01, unit: "C", write_use: "decode only"}
    - {value: 5, meaning: "0.01 F", scale: 0.01, unit: "F", write_use: "decode only"}
    - {value: 6, meaning: "whole C", scale: 1.0, unit: "C", write_use: "decode only"}
    - {value: 7, meaning: "whole F", scale: 1.0, unit: "F", write_use: "decode only"}
  sensor_types:
    0: "Water temperature"
    1: "Heater temperature"
    2: "Triac temperature"
    3: "Unused temperature"
    4: "Internal temperature"
    5: "Water low"
    6: "Water leak"
    7: "Motor speed"
  message_errors:
    0: "No error"
    1: "Unclassified failure"
    2: "Resource in use"
    3: "RX overrun"
    4: "TX overrun"
    5: "Unknown command"
    6: "Bad length"
    7: "Invalid resource"
    8: "Unsupported operation"
  error_envelope: >-
    The schema defines MessageError values 0-8 but neither the web pages nor the
    client defines how errors are encapsulated or correlated with requests. Do
    not reinterpret a returned IntegerValue as one of these errors without a
    capture.
  excluded_operations:
    reason: >-
      The schema contains additional power, sound, display, timer-control,
      connection-parameter, device-info, alert and message-spoof IDs, plus a
      separate bulk-transfer domain with page/file/reset operations. The
      reference client does not implement or validate these paths. No bytes for
      them are offered as commands here.
    bulk_domain: "Domain 1 page/file/erase/reset operations are excluded, including firmware transfer and system reset."
    state_and_alerts: "ASYNC, DeviceState and alert vectors are schema candidates only; no live state machine is claimed."

entities:
  - platform: "climate"
    name: "Nano Sous Vide"
    icon: "mdi:pot-steam"
    temp_step: 0.1
    state_characteristic: "0e140002-0af1-4582-a242-773e63054c68"
    state_command: "get_sensors"
    commands:
      set_temperature: "set_target_temperature"
      turn_on: "start_cooking"
      turn_off: "stop_cooking"
    notes: >-
      Sensor responses supply readings, not a validated cooking state. Setpoint
      and start are advanced. Do not expose the reference client's optimistic
      local cooking flag as HVAC state; unknown ASYNC state must remain unknown.
  - platform: "sensor"
    name: "Nano Water Temperature"
    device_class: "temperature"
    state_characteristic: "0e140002-0af1-4582-a242-773e63054c68"
    state_command: "get_sensors"
    notes: >-
      Select only sensorType 0 and decode with that entry's UnitType. Preserve
      all other sensors separately in diagnostics. A missing water sensor or
      unknown unit is an unknown reading, never zero or default Fahrenheit.
  - platform: "sensor"
    name: "Nano Target Temperature"
    device_class: "temperature"
    precision: 0.1
    state_characteristic: "0e140002-0af1-4582-a242-773e63054c68"
    state_command: "get_target_temperature"
    notes: "IntegerValue raw x 0.1 in the current unit returned by get_temperature_unit."
  - platform: "select"
    name: "Nano Temperature Unit"
    state_characteristic: "0e140002-0af1-4582-a242-773e63054c68"
    state_command: "get_temperature_unit"
    state_mapping:
      options:
        "0": "0.1 Celsius"
        "1": "0.1 Fahrenheit"
        "4": "0.01 Celsius"
        "5": "0.01 Fahrenheit"
        "6": "Celsius"
        "7": "Fahrenheit"
    commands:
      select_option: "set_temperature_unit"
    notes: >-
      Reads may report any temperature UnitType; writes offer only 0 and 1.
      Values 0/4/6 are C and 1/5/7 are F, with different scaling. Unknown values
      are not coerced to Fahrenheit.
  - platform: "number"
    name: "Nano Timer Remaining"
    unit: "min"
    min: 0
    step: 1
    icon: "mdi:timer-sand"
    state_characteristic: "0e140002-0af1-4582-a242-773e63054c68"
    state_command: "get_cooking_timer"
    commands:
      set_value: "set_cooking_timer"
    notes: "Whole minutes from IntegerValue. Timer running/completion semantics and zero behavior are unknown; set_cooking_timer does not start heating."
  - platform: "sensor"
    name: "Nano Firmware Version"
    icon: "mdi:chip"
    state_characteristic: "0e140002-0af1-4582-a242-773e63054c68"
    state_command: "get_firmware_info"
    notes: "Show FirmwareInfo.tagId and commitId. Keep dateCode raw unless its timestamp interpretation is confirmed."

evidence:
  documentation_review: >-
    Anova's Nano overview, BLE protocol, commands, API, protobuf and
    implementation pages were compared with the actual pinned MIT client and
    schema. The executable source is primary wherever the cached web tables
    conflict. Research validation covered standard COBS examples, exact command
    frames, source methods, sensor scaling and fake transport behavior, with no
    real scan or command.
  app_static_analysis: >-
    The November 15 follow-up checked the sibling-held unified app
    com.anovaculinary.android 3.6.6 (versionCode 2127). The Nano service and TX,
    RX and ASYNC UUIDs all occur in its React Native bundle. This supports the
    model's identifier map only. No opcode, COBS or protobuf claim is inferred
    from those strings.
  artifacts:
    - type: "public_implementation"
      artifact: "anova-culinary/developer-project-nano @ 2e912490ab4273240ff42b37e7476189cdd46bac (MIT)"
      url: "https://github.com/anova-culinary/developer-project-nano"
      obtained_via: "research store clone, reviewed 2026-11-01"
      description: "Actual client and proto2 schema: GATT roles, COBS transport, opcodes, units, sensors and exact offline vectors."
    - type: "vendor_documentation"
      artifact: "Anova Nano developer documentation"
      url: "https://developer.anovaculinary.com/docs/devices/nano/overview"
      obtained_via: "cached public pages, 2026-11-01"
      description: "Transport overview and official implementation linkage; conflicting web opcodes/schema are retained only as a documented source conflict."
    - type: "static_analysis"
      artifact: "com.anovaculinary.android 3.6.6 (versionCode 2127), XAPK"
      obtained_via: "sibling research directory, checked 2026-11-15"
      description: "Corroborates all four Nano UUIDs; does not establish command framing or live compatibility."
    - type: "vendor_documentation"
      artifact: "Anova Precision Cooker Nano Quick Start Guide article metadata"
      url: "https://support.anovaculinary.com/hc/en-us/articles/360003905251-The-Anova-Precision-Cooker-Nano-Quick-Start-Guide"
      obtained_via: "public support metadata, 2026-11-01"
      description: "Points to a guide, but no complete manual was acquired. Not used for operating limits, reset or pairing claims."
    - type: "public_research"
      artifact: "neilpa/circulate issue 7 Nano captures (2019)"
      url: "https://github.com/neilpa/circulate/issues/7"
      obtained_via: "existing research store, previously reviewed"
      description: "Used by the original-cooker spec for model separation and the advertised Nano name. It does not validate this spec's opcode map, which remains source-derived."
  open_questions: >-
    See remaining_unknowns. Start with read-only hardware captures of GATT,
    get_temperature_unit and get_sensors, then resolve response headers, ASYNC,
    pairing and timer semantics. Obtain the authentic manual and verify attended
    stop before any start or setpoint write.

remaining_unknowns:
  - "Actual firmware acceptance of the executable schema's domain/opcode map over the conflicting web tables, plus complete GATT properties and required TX write mode."
  - "Response headers, request/response correlation, RX short-chunk termination, timeout behavior, MTU negotiation and malformed-frame handling."
  - "ASYNC payload envelope and whether DeviceState/SysAlertBitVector is actually transported; no reliable cooking state machine is known."
  - "Pairing, bonding, central/bond limits, reconnect behavior, unpairing and physical factory reset. Do not inherit sibling procedures."
  - "Authenticated manual electrical limits, safe temperature range, water/vessel requirements and regional-model differences; unused client constants are not promoted as limits."
  - "Timer running/completion behavior, zero semantics, maximum and exact minutes behavior on firmware."
  - "FirmwareInfo.dateCode semantics and the unimplemented DeviceInfo read/serial handling."
  - "Error encapsulation and correlation for MessageError 0-8."
  - "Bulk transfer, firmware update, reset, message spoof, additional settings and unattended-heating behavior are excluded and unverified."

