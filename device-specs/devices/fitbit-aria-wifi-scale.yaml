  public_captures_2016:
    what: "Twenty packet captures of one FB201 being set up, made for an academic device-fingerprinting study and mirrored in a public repository."
    paper:
      title: "IoT Sentinel: Automated Device-Type Identification for Security Enforcement in IoT"
      authors: "Miettinen, Marchal, Hafeez, Asokan, Sadeghi, Tarkoma"
      arxiv: "1611.04880"
      url: "https://arxiv.org/abs/1611.04880"
    method_per_paper: "Each device's setup was repeated 20 times with a hard reset between rounds, against a software access point on a laptop, with a packet capture taken on the gateway."
    dataset_terms: "The paper says the dataset is available on request for research use. A public repository mirrors the capture files; its code is MIT-licensed and its right to redistribute the captures is not stated."
    mirror: "https://github.com/andypitcher/IoT_Sentinel"
    files: "The 20 setup captures for the device the study labels Aria."
    capture_dates: ["2016-06-09", "2016-08-18", "2016-09-05"]
    scale_under_capture: "One FB201 on firmware 37, MAC in the Delta Electronics block, talking to Fitbit's own server after the vendor's own setup flow."
    handling: >
      CITED, NEVER COMMITTED. The files contain a real MAC, tokens and an
      account id; none of them appears in this repository, and every
      example here uses invented values. The files were read as bytes with
      this project's own standard-library parsers: all 20 by three
      independent readers and 3 of 20 by a fourth. Only counts and
      product-fixed values were taken from them.
    adds:
      - "The whole sequence after a setup, against the vendor: register, validate on the same connection, then an upload with zero records on a second connection, about half a second end to end."
      - "Request headers on firmware 37: register and validate carry Host and nothing else; the upload carries the same four headers as on firmware 35, with no User-Agent."
      - "The header word at offset 34 is 33 on firmware 37, and the request CRC verifies with initial value 0 in 20 of 20 uploads."
      - "Vendor reply facts in 20 of 20 replies: unit 2, status 0x32, byte 6 equal to 1, one user, reserved bytes zero, the word at offset 57 zero, a window exactly 4000 g either side of the previous weight, length 0x66, a valid CRC."
      - "The vendor's tail words were 0, 0, 0 in 20 of 20 replies."
      - "The sex byte in the vendor's user record was 0x36 in 20 of 20 replies."
      - "The vendor's validate reply was chunked with no Content-Length, and the scale went on to upload."
      - "auth_code was identical across the 20 setups although each used a different token."
      - "The DHCP host name pattern, the DHCP option list, and a DNS transaction identifier of 0x0001 every time."
      - "The scale's clock after a hard reset: the same morning in November 2014 each time."
    does_not_show:
      - "Whether the scale accepted any reply: the captures have no record of the display."
      - "A weigh-in upload: every upload has zero records."
      - "Anything against a local server: the peer is the vendor throughout, and the tokens are vendor-issued."
      - "Any other unit or firmware."
    verification: "reported"
  public_implementations:
    read_on: "2026-11-23"
    notes: >
      Commits are the head of each repository on the day its files were
      read. This project ran none of this code. Licences decide what may be
      reused: take facts from the AGPL and GPL projects, never code. Two
      2026 forks of helvetic name a different upload hostname in their
      README; every capture says www.fitbit.com, so there is no sign they
      were run against a scale. A Perl collector published in 2026 uses yet
      another reply layout and makes no hardware statement; it is not
      listed.
    projects:
      - name: "helvetic"
        url: "https://github.com/micolous/helvetic"
        commit: "62a3564cb3abba15126f47e87f977635f458364c"
        license: "AGPL-3.0-only"
        kind: "Django application plus a small test server"
        hardware_reported: "Firmware 35 (author, 2014); firmware 37 and 39 with one and two users (contributor, 2017)."
        implements: "register, validate (always T), upload; issues its own token and prints the setup request."
        caveats: "Last commit 2018-12-08. Its protocol.md prints a wrong reply layout; the code is right. A new user has a window of 0 to 0 until a measurement is stored for them. It refuses an upload whose auth_code differs from the first one it saw for that MAC."
      - name: "helvetic ESP32 port"
        url: "https://github.com/tao-j/helvetic"
        commit: "49ef7a37b72710d122fe6044da2e858970c1dfb9"
        license: "AGPL-3.0-only (fork of helvetic; no separate statement)"
        kind: "ESP32 firmware that is the access point, the DNS server and the upload server at once"
        hardware_reported: "Firmware 37, author-reported: one README line says the code was tested, with no log. One user."
        implements: "register, validate, upload, against an access point with no internet."
        caveats: "An unreviewed fork. Hard-codes pounds. NUL-pads the name. Its one user's window follows the last weight uploaded, and on a zero-record upload it would derive that window from an unset value. Needs a hand-made library patch that its README says might be incorrect."
      - name: "aria-bridge"
        url: "https://github.com/ty-machine/aria-bridge"
        commit: "3293d0d902ea6bb3959fdee0c97919aaa2360d49"
        license: "MIT"
        kind: "Python interceptor plus a script that sends the setup request and tolerates the scale's malformed reply"
        hardware_reported: "FB201B on firmware 39 (2026): setup request answered 200; uploads received; unit byte reported applied."
        implements: "upload with zero users."
        caveats: "No validate route. Its tail is 3, 3, 0 with a fixed length of 0x66, which differs from the layout here; acceptance is described only in a code comment. Its notes are a session handoff, and only what they mark as observed is used here: they do not show the scale joining after the setup request, and their statements about power cycling and retries come with no log."
      - name: "fitbit-aria-php-server"
        url: "https://github.com/m322345/fitbit-aria-php-server"
        commit: "cba76e93fee34e4f0ea5a9c8f9d4fc25df8ac854"
        license: "GPL-3.0"
        kind: "PHP server"
        hardware_reported: "No explicit tested-on statement; its README lists what was not verified on a real scale."
        implements: "upload with users; checks the request CRC and answers 400 on a mismatch; an operator-entered starting weight per user."
        caveats: "No validate route and no local setup step: it sends owners to the vendor's pairing, which no longer exists."
      - name: "aria-spoof"
        url: "https://github.com/ads04r/aria-spoof"
        commit: "1720bdaeb9fd48e42b1d5380b10be55d237bdb0f"
        license: "Unlicense"
        kind: "PHP relay that rewrites guest readings and forwards to the vendor"
        hardware_reported: "Firmware 39 (2018 to 2020)."
        implements: "A relay, not a replacement: it depends on the vendor answering."
        caveats: "Its history is the evidence that the vendor checked the request CRC."
      - name: "aria2mqtt"
        url: "https://github.com/bigbadbob2003/aria2mqtt"
        commit: "6f7d688c74ef811422bc4526cc0b06b4e77e0255"
        read_on: "2026-11-24"
        license: "MIT"
        kind: "Container that copies readings to MQTT and relays each request to the vendor"
        hardware_reported: "Its README describes it in use behind a Pi-hole record; no firmware is stated."
        implements: "A pass-through relay: it depends on the vendor answering."
        caveats: "It reaches the vendor by an IP address its operator has to supply, because the name is overridden. Its name means Aria to MQTT, not Aria 2."
  protocol_version_2_historical:
    status: "Historical and reconstructed. Not implementable from this file and not tested by anyone since 2012."
    firmware_example: 28
    summary: >
      A 2012 write-up describes an earlier format: the request has no
      auth_code and no CRC (a 30-byte header with version 2, then the same
      32-byte record), and the reply has a 10-byte header without the
      constant byte, the same 77-byte user record, then eight zero bytes
      with no CRC and no length. The field widths are reconstructed from
      cell counts in diagrams whose spacing has been lost on the live page;
      the archived original could not be opened. The authors showed that an
      upload could be captured and re-sent with altered values; helvetic
      attributes the version 3 additions to that report. No source says
      whether any version 2 scale is still in service or what it does with
      a version 3 reply.
    verification: "hypothesis"
    basis: "Hackerspace Bamberg write-up, published 2012-10-31; widths are this project's researcher's reconstruction."
  capture_guidance:
    rig: >
      A scale, a Wi-Fi network you control whose resolver answers
      www.fitbit.com with a logging server built from this file (a laptop
      sharing a WPA2 hotspot with its own DNS answer does), and, for any
      setup-mode work, a SECOND computer to join the scale's access point.
      None of the experiments in remaining_unknowns needs the vendor.
    which_scale: "Anything that needs setup mode is a one-way door: use a spare scale, or one whose vendor sync and stored network no longer matter. Experiments that only change the server's reply can be run on any scale that already talks to a local server."
    capture:
      - "Every request with a timestamp: request line, all headers, raw body bytes as hex."
      - "Every reply sent: status line, headers, raw body bytes as hex."
      - "Which TCP connection each request arrived on."
      - "What the display showed after each exchange, word for word."
      - "The firmware number shown at power-up."
      - "For setup-mode work: the status line, the header names and the body size of each reply from the scale's access point, and what the page or script does, in your own words."
    do_not_share: "The scale's own setup page and script files, and any firmware image: they are the vendor's code, and this project cannot accept them. Report what the page and its scripts do in your own words: paths, parameter names, header names, sizes, what each request does."
    scrub_before_sharing:
      - "MAC: bytes 8 to 13 of the upload body, the serialNumber query parameter, the six characters of the setup network name, and the six characters of the DHCP host name. Replace with 00:00:5e:00:53:01."
      - "auth_code: bytes 14 to 29 of the upload body. Replace with an invented value."
      - "The token cookie and query parameter, the home network name, and any passphrase."
      - "User ids, names and profile values in replies; real weights and body-fat figures if they matter to you."
      - "Recompute the CRC after editing bytes, and say that you did."
    never: "Do not test the firmware-update form on a scale. Do not send test traffic to the vendor with a real serial. Do not weigh on a scale that is wired to mains-powered equipment."
  entity_coverage: >
    No generic entities are declared: readings arrive in a scale-initiated
    upload, not in a response a renderer can poll. A dedicated server
    publishes, per accepted record, weight (grams on the wire), the re-based
    time, the user or guest, the body-fat figure (thousandths of a percent
    on the wire) and the raw impedance, plus battery percent and firmware
    version per upload.

remaining_unknowns:
  - "HIGHEST PRIORITY. Does a battery re-insert on firmware 38 or 39 keep the Wi-Fi key, and does reaching SETUP ACTIVE erase the stored network at once? The vendor's troubleshooting assumes a battery pull is harmless; a 2015 write-up says a fix then in preparation should wipe the key when the batteries are removed; one firmware 39 log prints an empty passphrase field and then four failed joins at weak signal, which cannot tell a weak signal from a lost key. Cheapest experiment, in two parts: (a) on a scale that already talks to a local server, next to its router, pull a battery, do not press, weigh, and look for an upload. RISK of (a): if the key does not survive, the scale is off Wi-Fi and the only way back is the direct setup request, which has no success report on firmware 38 and no logged join on 39. Do it when the batteries need changing anyway, or on a scale you can afford to lose from Wi-Fi, and never on a scale whose vendor sync matters. (b) ONLY on a spare scale, press during TAP TO CHANGE, send nothing, pull a battery again without pressing, see whether WIFI IS and the network name come back, and then weigh to see whether it still joins."
  - "Does a freshly set-up scale on firmware 35, 38 or 39 complete register, validate and a first empty upload against a purely local server? Does the direct request work on 38 at all, and does the scale actually join on 39? Cheapest experiment: the rig in protocol_details.capture_guidance on a spare scale; run the direct setup once per firmware and log every request with timestamps and the display text."
  - "What does the scale do when validate answers 404 or F? Cheapest experiment: same rig; change only the validate reply and note the display and whether uploads follow."
  - "Will the scale join a different access point that has the same network name and passphrase as the one it stored? Cheapest experiment: main router off, a second access point up with identical settings and 802.11b rates, weigh, and look for an upload or a check mark. Nothing is lost if it fails."
  - "What should a server send for a user with no weight yet, and what does a scale do with a window of 0 to 0? No rule is established (protocol_details.upload_server.users.first_window). Cheapest experiment: reply with one user whose window is 0 to 0 and weigh; then with an operator-entered window around the person's weight; note GUEST or initials and whether a body-fat figure appears."
  - "Where does auth_code come from, and does it change after a re-setup with a made-up token? It stayed the same across 20 vendor re-setups of one firmware 37 scale. Cheapest experiment: on a spare scale log an upload, re-run setup with a different token, log again and compare."
  - "Which tail word does the scale read as the update status, and does it check the trailing length field? The vendor sent 0, 0, 0 and local servers send 0, 3, 0. Cheapest safe experiment: send a correct reply with the tail 0, 0, 0 once and record check mark or NO SYNC; then a correct reply with the length bytes of a different user count. Never send 1 in any tail word."
  - "What does the vendor's reply look like today? Cheapest observation: an owner already running a pass-through relay logs the vendor's reply bytes, scrubs them as protocol_details.capture_guidance says, and reports the tail words, the sex byte and the length."
  - "The layout of the firmware-update form of the reply, and the one unexplained 0xac length byte. Do NOT test on a scale. Answerable only from a saved vendor reply that offered an update."
  - "How the scale checks a firmware image, whether it refuses a version older than its own, and what it does with a bad one. Do NOT test on a scale: no recovery has ever been shown."
  - "The header word at offset 34 on firmware 38 and 39 (33 on firmware 28, 35 and 37). Cheapest experiment: read it from one logged upload."
  - "The scale of body_fat on current firmware and the meaning of body_fat_2 and of the covariance value. Cheapest experiment: one barefoot weigh-in as a recognised user; compare the displayed percentage with body_fat / 1000 and note the other two."
  - "The sex byte: what the vendor's 0x34 and 0x36 mean, whether bit 1 alone is the sex, and where the Regular or Lean body-fat mode travels. Cheapest experiment: same person, same minute, reply once with 0x02 and once with 0x36 and compare the body-fat figure the display shows."
  - "The unit of the impedance word, and whether guests upload a non-zero impedance. Cheapest experiment: one guest weigh-in and a look at the word."
  - "The order of records in a multi-record upload. Cheapest experiment: with the server stopped, weigh three objects of different known weights at known times, start the server, and read the order."
  - "What the display shows, and whether the backlog clears, when the reply carries zero users. Cheapest experiment: reply with user_count 0 and watch."
  - "Whether three to eight user records are accepted from a local server (the vendor's limit was eight; one and two are reported). Cheapest experiment: send three, then eight, and see which initials the scale offers."
  - "Whether Content-Length is truly required on the upload reply and whether a chunked upload reply is tolerated (the vendor did chunk its one-byte validate reply in 2016). Cheapest experiment: one upload reply delimited by closing the connection, one chunked."
  - "Connection handling: does the scale open a new connection for validate when the server closes after register, and does it ever send two uploads on one connection? Cheapest experiment: log which connection each request arrives on, once with a server that keeps connections open and once with one that closes after every reply."
  - "The name field: how many characters the display shows, and whether NUL padding or lower case changes it. Cheapest experiment: send ABCDEFGH space-padded, then NUL-padded, then lower case, and read the display."
  - "How often the scale checks in without a weigh-in, and what it sends. Cheapest experiment: leave the logging server running for 72 hours without weighing."
  - "The setup web server on firmware 37 to 39: its reply headers, what its own page sends, whether the token cookie is required, whether the debug page still discloses the passphrase, how open networks and special characters are expressed. It needs setup mode, so only on a spare scale. Cheapest experiment: in setup mode, GET the setup page and the two script paths with a raw-socket client and read them; then try a network name with a space. Report what they do in your own words (paths, parameter names, header names, sizes); do not share the page or script files, which are the vendor's code."
  - "How long the TAP TO CHANGE prompt accepts the corner press, whether SETUP ACTIVE times out, and how setup mode is left. Cheapest experiment: a stopwatch, on a spare scale."
  - "Whether anything on the scale listens while it is on the home network. Never tested. Cheapest experiment: have the local server hold its upload reply for 20 seconds and scan the scale's address meanwhile."
  - "Whether Fitbit's endpoints keep serving already-paired FB201 scales, and until when. Google's help page says they will continue to sync and names no end date; its static notice says it no longer connects to these scales. Cheapest observation: owners of still-paired scales note check mark or NO SYNC with the date."
  - "Which date the vendor enforced for the end of pairing: its English pages now say 2026-11-09, they said 2026-11-28 until 2026-11-23, and other language editions still say the 28th. Not safely testable: finding out means unpairing a scale, which cannot be undone. Cheapest observation: re-read the pages before quoting a date."
  - "The effect of status byte 0x64. Cheapest experiment, on a spare scale only because the value was described as unconfigured and nobody knows what a scale does on receiving it: reply once with it and zero users and note the display."
  - "Request headers on firmware 38 and 39 (firmware 35 and 37 send no User-Agent). Cheapest experiment: log raw request bytes."
  - "Channels 12 and 13, WPA2/WPA3 mixed mode, and the maximum network-name length. Cheapest experiment: hotspot settings, one try each, on a spare scale."
  - "Whether re-running setup with a new token stops the vendor accepting a scale that was still paired, and whether the scale re-registers each time it rejoins Wi-Fi. Not safely testable on a scale whose vendor sync matters; assume the vendor link is lost."
  - "Whether the scale rewrites the times of stored records when a reply sets its clock. Cheapest experiment: on a scale that already talks to a local server, weigh with the server stopped, start the server, and compare measured_at across two uploads of the same record."
  - "The console's electrical facts: the voltage on the header's supply pad and the signal level, and what the three switches on the board connect to. Cheapest experiment: a multimeter on an opened unit running on its own batteries, before any adapter is attached, and a continuity test on an unpowered board. Nobody stands on the scale while it is open."
  - "The console's log format on firmware 35, 37 and 38, and whether it prints body-fat values for a recognised user. Cheapest experiment: one weigh-in per firmware, listening only, with battery-powered or isolated equipment."
  - "Whether the upload host name is stored in the firmware image or in a separate settings area. Nobody has looked. Not safely testable on a scale you rely on, and no route depends on it."
  - "The original field widths of protocol version 2. Cheapest step: open the 2014 Internet Archive snapshot of the 2012 write-up from an unrestricted network."

evidence:
  documentation_review: >
    Consolidated on 2026-11-23 and revised on 2026-11-24 from public sources
    only, re-fetched on those days: helvetic's protocol and firmware notes,
    code, test server and git history; the ESP32 port of helvetic;
    aria-spoof and its history; aria-bridge; a PHP server; a relay
    container; three Pen Test Partners write-ups from 2015 with their
    capture figures; the 2012 Hackerspace Bamberg write-up; a 2024 relay
    write-up; a 2015 teardown with serial logs and a second tester's console
    notes; the FCC record for XRAFB201A; the Wi-Fi module maker's datasheet;
    the vendor's manual Rev C; Google Health help pages; and a public 2016
    capture set with the paper that describes it. Where these disagreed the
    original was re-read; the reply layout in particular follows helvetic's
    code and git history rather than its notes, is fixed by arithmetic on
    two length bytes seen from the vendor (0x66 for one user, 0xb3 for two:
    the difference, 77, is the user-record size, and 0x66 = 11 + 77 + 12 +
    2), and parses 20 real vendor replies cleanly.
  third_party_hardware_reports: >
    The statements "reported on firmware N" in this file are other people's
    runs: a 2014 capture and helvetic's author on firmware 35, a 2016
    capture set on 37, a helvetic contributor on 37 and 39, the ESP32 port
    on 37 (one line in a README), aria-spoof and aria-bridge on 39. Several
    were read through figures, commit messages or code comments rather than
    published logs, and helvetic's issues only through a summarising tool.
    None was repeated by this project, which is why nothing here is marked
    confirmed. A second research round re-opened every source behind the
    routes in protocol_details.local_routes and re-rated each one; where it
    was more cautious than the first reading, the cautious rating is the
    one printed.
  public_capture_set: >
    One third-party capture set is used as evidence and is not in this
    repository (protocol_details.public_captures_2016). It was read as
    bytes with this project's own parsers; only counts and product-fixed
    values were taken, and no MAC, token or account id from it appears
    here. It is still someone else's capture of someone else's scale, so
    the facts drawn from it are `reported`.
  first_hand_web_checks: >
    On 2026-11-23 and 2026-11-24 this project's researchers made
    parameterless web requests to the vendor (listed in
    protocol_details.vendor_status), header-only requests to the firmware
    image path, and downloaded the vendor's manual to read it; its SHA-256
    is recorded below. No register, validate-with-parameters, upload or
    firmware download was sent. The manual and help-page links in
    helpful_urls returned 200 on 2026-11-24; github.com pages are refused by
    the authoring environment's proxy and were checked through raw file
    URLs and read-only git instead; the Internet Archive replay host was
    unreachable, so the archived manual rests on the Archive's availability
    index, which listed the snapshot with status 200 on 2026-11-24.
  synthetic_vectors: >
    The vectors in protocol_details.upload_server.test_vectors were produced
    by independently written generators (the researcher's, the spec
    author's and the reviser's), which agree byte for byte, and are rebuilt
    from this file's own tables by the test. The CRC was checked against the
    standard check value and against Python's binascii.crc_hqx. They prove
    internal consistency only.
  open_questions: >
    Still inference or unsettled, in order of how much an owner should care:
    whether a battery pull keeps the Wi-Fi key on firmware 38 and 39 and
    whether entering setup mode erases the stored network at once; whether
    from-scratch setup completes against a local server on every firmware
    (one failure report on 38, no log of a join on 39, no published log of
    the registration exchange against a local server); whether a recreated
    network is rejoined; what happens without a validate route; whether and
    until when the vendor keeps serving paired scales, and which date it
    enforced; what to send for a user with no weight yet; which tail word is
    the update status (the vendor sent 0, 0, 0; local servers send 0, 3, 0);
    what the vendor's sex-byte values mean; everything about the
    firmware-update form; the origin of auth_code; the meaning of the
    constants 33, 2 and 0x01, of the second body-fat figure and of the
    covariance float; the impedance unit; record order; behaviour with zero
    or more than two users; whether Content-Length is mandatory; connection
    handling; the check-in cadence; whether anything listens on the scale.
    Each is listed in remaining_unknowns with the cheapest experiment.
