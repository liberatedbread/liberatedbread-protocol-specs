  station_mode:
    summary: >
      What the scale looks like on the home network once it has joined. All
      of it is from one unit on firmware 37 in a public 2016 capture set (20
      sessions, protocol_details.public_captures_2016) unless said
      otherwise.
    radio_up: "Reported to be up only while the scale is calling out (a 2015 write-up for firmware 35; firmware 39 serial logs)."
    inbound_services: >
      NEVER TESTED. No listening port, ping reply or other inbound service
      has been reported, and nobody has published a port scan of a scale in
      station mode. The captures hold only traffic the scale started: every
      TCP connection in all 20 is from the scale to port 80.
    dhcp:
      host_name_pattern: "GainSpan followed by the last three MAC bytes as six lower-case hexadecimal digits"
      host_name_regex: "^GainSpan[0-9a-f]{6}$"
      host_name_example: "GainSpan005301"
      client_identifier: "hardware type 1 followed by the MAC"
      parameter_request_list: [1, 3, 6, 15, 66, 67, 13, 44]
      vendor_class_option: "absent"
      evidence: "20 of 20 sessions, one unit, firmware 37."
      identification_value: >
        A ranking hint in a router's lease table, and a way to see that the
        scale joined. Probably the Wi-Fi module maker's default host name,
        so other products built on the same module may send the same
        pattern; not proof that a device is an Aria.
    dns:
      resolver_used: "the one the DHCP lease names"
      queries_per_session: 1
      query: "an A record for www.fitbit.com"
      transaction_id_observed: "0x0001 in 20 of 20 sessions between June and September 2016: the fixed identifier Fitbit said in 2016 that it had patched. This unit was still on firmware 37."
    sequence_after_setup:
      - "DHCP"
      - "one DNS query for www.fitbit.com"
      - "GET /scale/register, answered 200 with an empty body"
      - "GET /scale/validate on the same TCP connection, answered T"
      - "a new TCP connection: POST /scale/upload with zero records, answered with a one-user reply"
    security_joined: "A WPA2 personal network (a key handshake is present in every capture)."
    protocols_not_seen: ["mDNS", "SSDP", "NetBIOS", "NTP", "IPv6", "any inbound TCP connection"]
    not_shown: "Whether the scale accepted the replies (there is no record of the display), any weigh-in upload, and any other unit or firmware."
    verification: "reported"
  setup_access_point:
    purpose: "A provisioning hook and nothing else. It takes Wi-Fi credentials. No source shows it serving readings, a firmware upload or a debug channel."
    ssid_pattern: "Aria XXXXXX"
    ssid_regex: "^Aria [0-9A-F]{6}$"
    ssid_suffix: "The last three bytes of the scale's MAC as six upper-case hexadecimal digits."
    security: "open: no passphrase and no encryption"
    scale_address: "192.168.240.1"
    client_addressing: "DHCP from the scale, in 192.168.240.0/24; in a 2014 capture the client received the address after the scale's."
    dns: "The scale is the DNS server on this network and answers for 1.scale.www.fitbit.com with its own address. The direct method does not need a name."
    open_ports: [{port: 80, protocol: "tcp"}]
    open_ports_basis: "A 2014 scan of the most common TCP ports in setup mode (firmware 35 era). UDP was not scanned."
    provisioning_request:
      method: "GET"
      path: "/scale/setup"
      query_parameters:
        - {name: "ssid", required: true, meaning: "Network to join."}
        - {name: "custom_password", required: true, max_characters: 31, meaning: "Its passphrase."}
      cookies:
        - {name: "token", required: true, max_characters: 31, max_characters_basis: "Reported, not tested: a third party's reading of the request templates in firmware 35 and 39 images, relayed through a helvetic issue thread this project could read only through a summarising tool. Use at most 31 characters.", meaning: "Opaque; stored and echoed, never checked by the scale. Vendor-issued tokens were six characters, a dash and nine characters in 2014 and twenty letters and digits in 2016; ten letters and sixteen hexadecimal characters are also reported accepted."}
      reply_by_firmware:
        "35": "Works per helvetic; the parameterless form of the same path returned 200 with a Content-Length and a roughly 50 KB HTML setup page in a 2014 capture."
        "37": "Author-reported tested, in one line; the reply is not described."
        "38": "No report of the request itself. The one report on this firmware is a scale that would not reliably connect."
        "39": "200 status line, then a body that declares chunked transfer encoding without valid chunk framing; the connection is not closed cleanly. No public log shows the scale joining afterwards."
      networks_reported_joined: "WPA2 personal (firmware 37, both ciphers); an open network on firmware 35 through the vendor's page. How the direct request expresses an open or WEP network is unknown."
      encoding_unknowns: "How `+`, `%20` and other escapes are decoded, the maximum network-name length, how an open or WEP network is expressed, and whether the cookie is mandatory."
      verification: "reported"
    other_paths:
      - {path: "/", reply: "404 (firmware 35)."}
      - {path: "/scale/error_list.js", reply: "SECURITY NOTE, not a tool. In June 2015 (firmware not stated) it returned a debug list holding the stored network name, the passphrase in clear text and four yes/no checks. The one published sample contradicts itself (password wrong, yet vendor host found and HTTP exchange successful), so the checks cannot be trusted as a diagnosis. Its authors wrote that Fitbit was working on a fix; whether firmware 37 to 39 still serve it is not established. Reading it needs setup mode, which is a one-way door on a configured scale."}
      - {path: "/scale/ssid_info.js", reply: "Existence only, reported by a third party; never fetched by any source."}
    do_not_probe: "Send the one provisioning GET and nothing else to a scale you want to keep. Nothing shows what the scale's web server does with a POST or with other paths, and nobody has tested whether it has an upload handler."
    cleartext: "Everything on this access point, the passphrase included, is unencrypted radio traffic."
    weighing_in_setup_mode: "Weighing still works in setup mode, weight only."
  local_routes:
    as_of: "2026-11-24"
    rating_key: >
      evidence is one of: hardware-demonstrated (a named third party shows
      it on a real FB201), author-reported (an author says so, without a
      log), vendor-documented, or inferred (it follows from documented
      facts and nobody has done it). brick_risk is none, recoverable,
      unrecoverable or unknown. pairing_impact covers two things that are
      kept apart: scale-side state (stored network, token, user table) and
      the vendor-side link between scale and account, which cannot be
      recreated any more. Nothing here was run by this project.
    routes:
      - id: "dns_override_lan_server"
        name: "DNS override plus a server on the LAN"
        standing: "The primary route."
        evidence: "hardware-demonstrated by third parties (firmware 35 and 39; reported on 37)"
        needs: "A DNS resolver you control and an always-on server on TCP 80."
        gives: "Full local operation: readings, users, unit and clock."
        brick_risk: "none"
        pairing_impact: "No setup mode needed: stored network and token untouched. The server's reply replaces the display unit and the user table. Reversible while the vendor still serves paired scales (inferred)."
        who_should_not: "An owner who wants to keep vendor sync: while the override is in place the vendor receives nothing."
        details: "device.setup (first method) and protocol_details.upload_server"
      - id: "pass_through_relay"
        name: "DNS override plus a relay that logs each upload and passes it on to the vendor"
        standing: "The route for a scale that still syncs to the vendor and whose owner wants to keep that."
        evidence: "hardware-demonstrated: a December 2024 write-up (firmware not stated) and a 2024 container; an earlier relay ran on firmware 39 from 2018 to 2020"
        needs: "The override, a small relay, and the vendor's current address: the relay must reach the vendor by IP address because the name now points at itself, and that address has changed over the years."
        gives: "A local copy of every reading now, while the vendor link keeps working, and a place to switch to local replies on the day the vendor stops answering."
        brick_risk: "none while no update signal is handed to the scale; unknown for a relay that hands one on (see firmware_exposure)"
        pairing_impact: "None: no setup mode, stored network and token untouched. The vendor's reply reaches the scale, so users, unit and clock stay the vendor's."
        firmware_exposure: "A relay CHANGES the firmware-update exposure. The published relays hand the vendor's reply back as it came, any update signal included; the one whose script is printed in its write-up is installed on the upload path only. With the redirect in place the image request that follows such a signal arrives at the relay, not at Fitbit, and nobody has published what a scale does when that fetch fails or is answered by a web server's error page. No recovery from a bad image has been shown (protocol_details.firmware_danger)."
        relay_rules:
          status: "This project's inference from the facts in protocol_details.firmware_danger. No published relay does this and nobody has tested it on a scale."
          check_every_vendor_reply_with: "payload_formats.AriaUploadReplyTail.parse_rules"
          hand_on_only: "a vendor reply whose three tail words are each 0 or 3 and whose length is exactly 27 + 77 * user_count"
          withhold: "any other vendor reply (1 in a tail word, any other tail value, extra bytes): it is the update form or something unknown. Do not hand it to the scale. Log it and answer the scale with an error status and no binary body."
          consequence_of_withholding: "The scale shows NO SYNC, keeps its readings and sends them again at the next attempt, for as long as the vendor answers that way; the backlog grows meanwhile, and what happens when it fills is unknown. What to do then is the owner's decision, and neither choice has been tested. With the override taken out, the scale is in direct contact with the vendor again, which can deliver the signal itself; the scale would then fetch the vendor's image as it always could, and no recovery from a failed update has been shown. With local replies the scale never sees the signal, and vendor sync ends."
          error_status: "Any status other than 200, with no binary body; 502 is the conventional one for a relay. Whether the scale tells one error status from another is not reported."
          never_answer_or_forward_path_prefix: "/scale/firmware/"
          alternative_not_recommended: "Handing the signal on and forwarding the image request to the vendor whole. It would put the relay in the path of a firmware transfer whose format nobody has described, and a transfer that is cut short or altered has no shown recovery. Nobody has reported doing it."
          on_vendor_error_or_timeout: "While vendor sync is wanted, answer the scale with an error status and no binary body, not with a locally written reply. The scale is reported to keep readings whose upload was not accepted and to send them again; that it does so after an error status from a relay has not been logged. During a long outage the backlog grows, and what happens when it fills is unknown (17 readings in one request is the most seen)."
        limits: "It depends on the vendor answering, and the vendor can withdraw the endpoint at any time. Make the switch to local replies a decision, not an automatic fallback: a locally written reply is accepted as delivered, so those readings never reach the Fitbit account, and it replaces the scale's user list, display unit and clock with local ones (protocol_details.upload_server). Everyone's readings in the upload, guests included, go to the vendor as before. This file does not specify a relay byte for byte."
      - id: "same_network_name_and_passphrase"
        name: "Recreate the network the scale already knows"
        standing: "A pattern to try before setup mode. Untested."
        evidence: "inferred"
        needs: "An access point with the old network name, passphrase and security mode, on 2.4 GHz with 802.11b rates."
        gives: "Keeps scale-side state and any vendor link through a router change, and lets a dedicated access point be used without re-provisioning."
        brick_risk: "none"
        pairing_impact: "None if it works; nothing lost if it does not."
        details: "device.setup (second method)"
      - id: "direct_setup_request"
        name: "One HTTP request to the scale's setup access point"
        standing: "The only way to hand the scale new Wi-Fi credentials. A one-way door."
        evidence: "hardware-demonstrated on firmware 35; author-reported on 37 (one line); on 39 the request returned 200 but no public log shows the join; no success report on 38, one unexplained failure"
        needs: "A battery re-insert, then on a configured scale a deliberate press during TAP TO CHANGE; a computer with a tolerant HTTP client; the DNS override and server already answering."
        gives: "Joins the scale to a WPA or WPA2 personal network without the vendor."
        brick_risk: "none"
        pairing_impact: "ONE-WAY. New token; entering setup mode resets the Wi-Fi settings (stated for firmware 35); the vendor-side link is lost for good."
        details: "device.setup (third method). It is a provisioning hook only: the setup access point is not a data or debug channel."
      - id: "plain_scale"
        name: "Use it as a plain scale"
        standing: "Always available."
        evidence: "vendor-documented"
        needs: "Nothing."
        gives: "Weight on the display."
        brick_risk: "none"
        pairing_impact: "None."
        limits: "Body fat shows only while a stored weight window still matches the person, and nothing moves that window without a server. A firmware 39 log shows each weigh-in spending four attempts to join Wi-Fi before the reading is stored. What happens when the stored backlog fills is unknown."
    variants_of_the_primary_route:
      - id: "per_device_dhcp_resolver"
        name: "Hand the overriding resolver to the scale alone, by a per-client DHCP option"
        evidence: "inferred; cheap to test. Grounded in the captures (the scale asks the resolver its lease names) and in one deployment whose household-wide resolver change caused failures for other devices."
        needs: "A DHCP server that can set options per client."
        brick_risk: "none"
        pairing_impact: "None."
      - id: "destination_nat"
        name: "Rewrite the scale's port-80 traffic at a gateway instead of touching DNS"
        evidence: "inferred; nobody has published it for this scale. It rests on the scale speaking plain HTTP with a Host header and not checking who answers."
        needs: "A gateway you control that can rewrite the destination of TCP 80 from the scale's address."
        brick_risk: "none"
        pairing_impact: "None."
      - id: "dedicated_access_point_or_travel_router"
        name: "A separate small network for the scale, with its own resolver"
        evidence: "inferred: pieces demonstrated, bundle not published. A software access point with its own DHCP and DNS carried a scale to the vendor in 2014 (firmware 35) and in 2016 (firmware 37); nobody has published the same box with a local server, or a travel-router setup."
        needs: "An access point with 802.11b rates and a resolver you control. It can keep 802.11b alive when a new main router drops it."
        brick_risk: "none"
        pairing_impact: "As the direct setup request (one-way), because the scale has to be moved onto the new network, unless the recreated-network pattern works."
      - id: "all_in_one_esp32"
        name: "An ESP32 that is access point, DNS and upload server at once"
        evidence: "author-reported on firmware 37 (one line, no log); an unreviewed fork"
        needs: "Building the project, with a hand-made patch to a library that its README says might be incorrect."
        limits: "It sets the display to pounds, knows one user whose window follows whoever weighed last, and takes its time from the board's clock."
        brick_risk: "none"
        pairing_impact: "As the direct setup request (one-way), unless the recreated-network pattern works."
    research_notes:
      - id: "serial_console"
        name: "The internal serial console"
        standing: "Diagnostics only. It cannot redirect the scale: no known command sets a network credential, a server name or a resolver, and the console's own list says it is partial."
        evidence: "hardware-demonstrated on firmware 39 by two people (2016 and 2017)"
        needs: "Opening the case (two screws by the battery bay, then the rear cover lifted; the glued rubber seal left alone), wires soldered or held in the bare holes of an unpopulated header, and a serial adapter. 115200 baud, 8 data bits, no parity, 1 stop bit. It answers only in the seconds after a battery is inserted or while the scale is awake."
        gives: "Diagnosis: firmware and hardware identity, a self-test, the battery reading, the stored user table and network name, live weight."
        brick_risk: "unknown. No damage was reported with the level-following cable both testers used, but the signal level and the voltage on the header's supply pad are published nowhere, and the Wi-Fi module's absolute maximum is 4.0 V: an adapter with a powered supply wire, or 5 V logic, can destroy it."
        pairing_impact: "None if only reading. Each cold boot of a configured scale opens the TAP TO CHANGE prompt."
        warnings:
          - "Measure the header's supply pad before attaching anything, and never connect an adapter's own supply output to it."
          - "NEVER STAND ON THE SCALE WHILE IT IS WIRED TO MAINS-POWERED EQUIPMENT. A cable to a laptop on its charger removes the isolation of a battery product whose glass passes a signal through bare feet. Battery power or galvanic isolation only."
          - "The log prints the household's initials, body data and Wi-Fi name. Do not share it unscrubbed."
          - "The console's list also names commands that write or erase stored state: identity, factory and calibration data among them. None has been shown running in public. Treat them as able to destroy calibration or identity for good, and do not run them."
      - id: "listen_only_logger"
        name: "A battery-powered logger on the console's transmit line"
        standing: "An idea. Nobody has built it."
        evidence: "inferred. The console prints each weigh-in as text on firmware 39 (one published log, of a guest reading); the format on 35, 37 and 38 is unknown."
        needs: "Opening the case; the transmit line and ground to a high-impedance input through a series resistor; BATTERY OR ISOLATED POWER for the logger, because someone stands on the scale while it runs. Measure the line's level first, on the scale's own batteries: it is published nowhere, and a 3.3 V input is an assumption. Never leave an unpowered logger attached to the line. The resistor, the level check and the unpowered-logger caution are engineering inference with no source behind them."
        gives: "In principle, readings with no network at all."
        brick_risk: "none (inferred: a subset of the connections the console testers made)"
        pairing_impact: "None."
      - id: "load_cell_retrofit"
        name: "Wire the four load cells to a new amplifier and controller"
        standing: "Last resort, for a dead board or a parts donor, not for a working scale."
        evidence: "inferred: done on other scales, never shown on an Aria. The teardown describes four load sensors with three wires each; colours, connector and capacity are unpublished."
        needs: "Opening the case, soldering, calibration weights."
        gives: "A new plain scale in the Aria's body. The display, user recognition and body fat are lost."
        brick_risk: "recoverable (inferred: only by re-soldering the original wiring, which nobody has done or undone)"
        pairing_impact: "Abandons the product; stored state stays in the unused board."
    not_routes:
      - id: "bluetooth"
        statement: "The FB201 has no Bluetooth. Its FCC grant covers 2.4 GHz Wi-Fi only. Bluetooth belongs to the Aria 2 and Aria Air."
      - id: "inbound_service_on_the_lan"
        statement: "Never tested. No inbound service has ever been observed on a set-up scale, and nobody has published a scan of one."
      - id: "setup_page_alone_in_a_browser"
        statement: "The scale serves its setup page to a plain request by address (a 2014 figure), but nobody has shown the page completing a setup without the vendor's site, or what token the scale then holds."
      - id: "phone_app_for_setup"
        statement: "No app that performs the setup request exists in public, and nobody reports sending it from a phone."
      - id: "state_changing_console_commands"
        statement: "Listed by the console and never shown running; what they take and what they erase is unknown."
      - id: "module_program_mode"
        statement: "The Wi-Fi module's maker documents a wired download mode and the board carries a switch and headers that look like it, but it has never been used on an Aria; that flow starts with a full erase and no Aria image or read-back exists in public, so any erase is permanent."
      - id: "jtag"
        statement: "The module has a debug port on paper; nobody has found its pads on this board or used it on an Aria, and any erase is permanent."
      - id: "internal_bus_tap"
        statement: "Nobody has tapped the bus between the module, the weighing chip and the display driver, and neither the display's segment map nor the weighing chip's protocol is published."
      - id: "modified_firmware_or_provoked_update"
        statement: "A danger, not a route: see protocol_details.firmware_danger."
    honest_negatives:
      - "No inbound service has ever been tested for."
      - "No Bluetooth."
      - "No console command is known to set the network or the server."
      - "No modified firmware image, no wired reflash and no debug-port session has ever been shown on this product."
      - "No setup app exists."
  firmware_danger:
    status: "A danger to avoid, not a route. Nothing in this block is a procedure."
    facts:
      - "The update signal is part of the reply to an upload, so whoever answers www.fitbit.com for the scale can send it."
      - "On that signal the scale fetches an image over plain HTTP, with no TLS, from whatever answers www.fitbit.com on its network: the same name, and so the same server, as every other request."
      - "The path is /scale/firmware/ followed by a version number, with the scale's MAC as a query parameter. A local server must never answer it."
      - "The vendor's image endpoint was still answering on 2026-11-23. Header-only requests, with no image fetched, returned 200 and a binary content type for versions 35, 38 and 39, 404 for version 33 (which could be fetched in 2017) and for a made-up version, and 400 without the serial parameter. They went through an HTTPS proxy, so they are not a clean test of port 80."
      - "So a scale that is told to update could still be handed a real image by the vendor's server, and anything at all by whoever answers the name on its network."
      - "Nobody has built or flashed a modified image for this scale. The one public attempt, in 2015, was abandoned: its authors wrote that the update process was well protected and that they ran out of time, and published nothing further."
      - "No public description exists of the image container, of any signature or integrity field, or of where the server name sits in an image."
      - "Nobody has sent the update signal to a real scale from a local server, and nobody has shown a downgrade."
      - "No recovery from a bad image has been shown. Over the air, a bad image on a sealed scale has no known way back; the wired download mode the module's maker documents has never been used on an Aria."
      - "A pass-through relay as published hands the vendor's reply to the scale unchanged, any update signal included. With the redirect in place the scale's image request then arrives at the relay, not at Fitbit, and nobody has published what a scale does when that fetch fails or is answered by a web server's error page. A relay therefore changes this exposure."
    rules:
      - "Never put 1 in any tail word of the upload reply."
      - "Never add bytes to the upload reply."
      - "Never answer a request under /scale/firmware/."
      - "Never test the update form on a scale."
      - "Never let a relay hand a vendor reply in the update form on to a scale, and never let it forward a request under /scale/firmware/ (this project's inference, untested: protocol_details.local_routes, pass_through_relay.relay_rules)."
    verification: "reported"
    basis: "helvetic's firmware notes (2017); Pen Test Partners, parts 2 and 3 (2015); header-only requests by this project's researchers on 2026-11-23; repository and web searches the same day that found no firmware project for this scale."
  hardware:
    model: "FB201"
    retail_models: ["FB201B (black)", "FB201W (white)"]
    regulatory_model_name: "FB201A"
    fcc_id: "XRAFB201A"
    fcc_grant_date: "2012-06-25"
    fcc_id_caution: "The ID has a trailing A. XRAFB201 without it is not a granted ID."
    ised_certification: "8542A-0000F201A"
    ised_certification_other_reading: "8542A-F201A, as printed in the test report of the FCC filing. The first form is the one on the label artwork and in the 19-page manual. Both are recorded; which one the Canadian register carries was not checked."
    wifi_module: "GainSpan GS1011MEE (module FCC ID YOPGS1011MEE). The scale's application runs on this module; there is no separate main processor driving it."
    bluetooth: "None."
    radio:
      standard: "802.11b only (1, 2, 5.5 and 11 Mbit/s)"
      band: "2.4 GHz"
      certified_channels: "1 to 11 (2412 to 2462 MHz)"
      can_join:
        - "WEP, WPA personal and WPA2 personal networks (vendor); WPA2 personal with either cipher is seen on firmware 37, and an open network on firmware 35"
        - "a 2.4 GHz network that still accepts 802.11b rates, including b/g/n mixed mode"
        - "a hidden network, by giving its name (vendor flow; the direct request takes whatever name it is given)"
        - "a network with a DHCP server"
      cannot_join:
        - "5 GHz networks"
        - "2.4 GHz networks with 802.11b rates disabled"
        - "enterprise (802.1X) networks: the vendor lists personal modes only"
        - "networks that require a static address: DHCP only"
        - "networks whose passphrase is longer than 31 characters (vendor limit)"
      not_established:
        - "channels 12 and 13"
        - "WPA3, alone or in WPA2/WPA3 mixed mode; the module predates WPA3"
        - "network names or passphrases with characters other than letters and digits (the vendor advises against them)"
    power: "Four AA cells in series; the pack reads about 5.3 to 5.5 V on a working unit."
    label: "The underside label carries the MAC address and a separate 16-digit serial number."
    display: "Round backlit segment display at the top centre of the glass."
    capacity: "20 to 350 lb (9 to 158 kg) per the manual."
    user_reset_control: "None on the outside. Three switches sit on the circuit board inside the case; what each does is not documented. A 2015 write-up mentions a reset button as another way into setup mode, without saying which switch."
    service_console: "An internal serial header gives a text console at 115200 baud, 8 data bits, no parity, 1 stop bit. Its signal level is published nowhere. Diagnostics only, with electrical and body-contact warnings: see protocol_details.local_routes."
    firmware_versions_evidenced: "28 (protocol version 2, 2012); 33, 35, 38, 39 (downloadable from the vendor in 2017); 35 (2014 captures); 37 (2016 captures, 2017, 2024); 38 (2020); 39 (2016 to 2026; build date 2016-02-29)."
    verification: "reported"
    basis: "FCC record and exhibits for XRAFB201A; vendor manual Rev C (114-0019); Google Health help pages; a 2015 teardown and its serial logs; a second tester's console notes (2017); the module maker's datasheet; helvetic's firmware notes. The manual's model names, FCC ID, radio and security lines were re-read by this project on 2026-11-23."
  display_messages:
    - {text: "HI :)", when: "Power-up, and the start of a weigh-in.", meaning: "Greeting."}
    - {text: "V39", when: "About 1.6 seconds after power-up.", meaning: "V and the application firmware number; 39 is an example."}
    - {text: "SETUP ACTIVE", when: "Setup mode.", meaning: "The open setup access point is up and waiting for credentials. Assume the previously stored network is already gone."}
    - {text: "WIFI IS <network name> / TAP TO CHANGE", when: "Power-up with a stored network, about 3 seconds after the firmware number.", meaning: "A network is stored. Leave the scale alone and it keeps it. A brief press on the two lower corners now, or a step onto the scale, enters setup mode, which is a one-way door."}
    - {text: "STEP ON, SENSING, STEP OFF, THINKING", when: "Phases of a weigh-in.", meaning: "Follow the prompt. SENSING also shows during recalibration after the scale was moved."}
    - {text: "weight, then body-fat percent", when: "Result.", meaning: "Body fat appears only for a recognised, barefoot user."}
    - {text: "initials or GUEST", when: "End of the reading.", meaning: "Recognised user, or nobody matched."}
    - {text: "TAP TO SELECT USER", when: "Two users within 8 lb.", meaning: "Tap to cycle initials (2012 draft manual)."}
    - {text: "progress bar, then check mark", when: "After a weigh-in.", meaning: "Uploading, then accepted."}
    - {text: "check mark or smiley face", when: "End of setup.", meaning: "Joined and linked (vendor wording)."}
    - {text: "WIFI ERR or NO SYNC during setup", when: "Right after credentials were sent.", meaning: "Could not join the network or reach a server."}
    - {text: "NO SYNC, or a Wi-Fi symbol with an X, after a weigh-in", when: "After a reading.", meaning: "Upload failed or the reply was rejected (wrong CRC or layout); the reading is kept and re-sent."}
    - {text: "SENSING, THINKING, ERR", when: "During a weigh-in.", meaning: "Measurement failure, not a network problem."}
