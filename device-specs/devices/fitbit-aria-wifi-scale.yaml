      artifact: "micolous/helvetic @ 62a3564cb3abba15126f47e87f977635f458364c (protocol.md, firmware.md, helvetic/views/aria_api.py, testserver/testserver.py, git history)"
      url: "https://github.com/micolous/helvetic"
      obtained_via: "Raw file URLs and a read-only clone, 2026-11-23. AGPL-3.0: facts only."
      description: >
        Setup request, register and validate, the request layout, and (from
        code, not notes) the 77-byte user record, the 0, 3, 0 tail, the CRC
