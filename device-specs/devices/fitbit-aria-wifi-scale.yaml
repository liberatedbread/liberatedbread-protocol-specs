device:
  name: "Fitbit Aria Wi-Fi Smart Scale (FB201)"
  manufacturer: "Fitbit (Google)"
  manufacturer_status: "abandoned"
  model: "FB201"
  aliases:
    - "Fitbit Aria"
    - "Fitbit Aria Wi-Fi Smart Scale"
    - "Aria Wi-Fi Smart Scale"
    - "Aria 1"
    - "Fitbit Aria (original, 2012)"
    - "FB201B"
    - "FB201W"
    - "FB201A"
  openness:
    status: "undocumented"
    reverse_engineered: true
    source_code: "https://github.com/micolous/helvetic"
    license: "AGPL-3.0-only"
    upstream_docs:
      - url: "https://github.com/micolous/helvetic/blob/master/protocol.md"
        title: "helvetic — notes on the Aria upload protocol"
        covers: >
          The setup request, the register request and the upload REQUEST
          layout. Its printed REPLY structures are wrong (an 81-byte user
          record and a misplaced update flag); the reply in this spec follows
          helvetic's code, which is what was run against scales.
    notes: >
      Fitbit never published this protocol. It was recovered by third parties
      from packet captures and by trial against real scales between 2012 and
      2026. Public implementations and their licences are listed in
      protocol_details.public_implementations: helvetic and its forks are
      AGPL-3.0, one PHP server is GPL-3.0, two projects are MIT or Unlicense,
      and several write-ups carry no licence at all. This file takes FACTS
      from them and no text or code; every layout here is restated as a table
      in this project's own words.
  testing:
    status: untested
    notes: >
      No scale, vendor account or firmware image was used by this project,
      and it made no capture of its own. Every byte-level fact is transcribed
      from the public write-ups and open-source servers listed in
      evidence.artifacts, whose authors report runs on firmware 35, 37 and
      39, and from one public third-party capture set (one FB201 on firmware
      37 talking to Fitbit's server in 2016, protocol_details.public_captures_2016)
      that this project read with its own parser; the captures are cited,
      never committed. None of those runs was repeated here, so every fact
      is `reported` at best. The hex vectors in protocol_details.upload_server
      are synthetic, were built from the tables in this file and were never
      sent to a scale.
  protocol: "wifi"
  transport: "http"
  category: "scale"
  category_hierarchy: ["measurement", "health", "body_composition"]
  type: "body-composition-scale"
  integration: "identify_only"
  security_advisory:
    severity: "reported"
    summary: >-
      Open setup access point, clear-text Wi-Fi passphrase, and unauthenticated
      plain-HTTP uploads and firmware fetch; no security updates since 2020.
    detail: >
      Six things, none fixable by the owner beyond the precautions at the
      end.
      (1) In setup mode the scale is an OPEN Wi-Fi access point, and the home
      network's name and passphrase reach it as a clear-text URL query, with
      the setup token in a clear-text cookie. Anyone in radio range during
      those minutes can read them. (2) A June 2015 write-up found a
      setup-mode page that handed back the stored network name and
      passphrase to any client on that access point (the firmware is not
      stated). Its authors wrote that Fitbit was working on a fix;
      whether firmware 37 to 39 still serve the page is not established.
      Setup mode is reachable by anyone who can take a battery out, and no
      way to clear the stored passphrase or users is established (a battery
      pull is not a wipe: device.setup.factory_reset). So a scale that
      leaves the house may take the passphrase with it. The remedy is on
      the network side: change the passphrase of the network it knew. That
      also cuts off every other device that knows it, and an Aria that
      stays in the house would then need setup mode, which cannot be
      undone. Removing a scale from the vendor account is permanent as
      well. (3) In normal use the scale
      talks plain HTTP on TCP 80 to the name www.fitbit.com with no TLS and
      no check of who answers. Whatever answers that name on the scale's
      network receives body weight, body-fat and impedance figures, the
      scale's MAC and a per-scale code, and can set the scale's clock, unit
      and user list. (4) Firmware updates ride the same channel: the reply
      to an upload can tell the scale that an update exists, and the scale
      then fetches an image over plain HTTP from whatever answers that same
      name. Nobody has published how the scale checks an image. The only
      public attempt to load a modified one (2015) was abandoned, its
      authors reporting that the update process was well protected; nobody
      has built or flashed a modified image since, and nobody has shown a
      way to recover a scale from a bad one. See
      protocol_details.firmware_danger. (5) Google states that security
      updates for this scale ended in 2020; the newest firmware evidenced
      anywhere is version 39, built in February 2016. (6) In 2016 Fitbit
      patched a fixed DNS transaction identifier that let an attacker forge
      the scale's DNS answers. A public capture set shows the flaw itself:
      one scale on firmware 37 sent the identifier 0x0001 in every one of 20
      sessions between June and September 2016. Which firmware carries the
      fix is not stated (firmware 39's build date matches the month), so a
      scale on older firmware may still have the flaw. The same lack of
      authentication is what makes a local server possible. Reduce the
      exposure: keep setup mode short and private. When a scale has to be
      provisioned anyway, give it a network name and passphrase of its own,
      so the passphrase that crosses the open access point is not the one
      protecting everything else. NEVER re-provision a working scale for
      this: moving a joined scale to another network needs setup mode,
      which is a one-way door (device.setup). To isolate a working scale,
      leave the network it knows exactly as it is and move the other
      devices to a new one. Run the server only on a trusted LAN and never
      expose it to the internet. For a scale that is run locally, keep the
      DNS override in place for good so it never talks to whoever holds the
      public name; an owner who keeps vendor sync adds no override. And
      never send the firmware-update signal or serve a firmware path.
    advisory_url: "https://www.pentestpartners.com/security-blog/are-your-smart-weighing-scales-lying-to-you-quite-possibly-part-1/"
  safety_advisory:
    severity: "caution"
    summary: >-
      Body-fat measurement sends a small electrical signal through the body
      (bioimpedance); the vendor says not to use the scale with a pacemaker or
      other implanted medical device, or during pregnancy.
    detail: >
      Electrodes on the glass measure impedance through bare feet. A
      third-party serial log shows the scale taking that measurement before
      it decides whose reading it is, so assume it happens for anyone who
      steps on barefoot, guests included. Running your own server changes
      where the numbers go, not how they are measured. The vendor's manual
      (Rev C) says: do not use with a pacemaker or any other internal medical
      device; do not use when pregnant; not intended for children under 10;
      not for diagnosing or treating any medical condition. The body-fat
      figure is computed inside the scale from impedance, weight and the age,
      sex and height its server supplies; nobody has published the formula,
      and a replacement server that supplies wrong profile data gets a wrong
      figure. One more rule for anyone who opens the case: NEVER STAND ON A
      SCALE THAT IS WIRED TO MAINS-POWERED EQUIPMENT. The manual classes the
      glass as a "Type BF applied part", and the product is isolated because
      it runs on four AA cells. A cable from its circuit board to a laptop on
      its charger, or to a USB-powered logger, removes that isolation while a
      person stands barefoot on the electrodes. Battery power or galvanic
      isolation only (this project's inference from the manual's
      classification; no source tests it). This project is unaffiliated with
      the manufacturer; the manufacturer's instructions govern.
    advisory_url: "https://staticcs.fitbit.com/content/assets/help/manuals/manual_aria_en_US.pdf"
    advisory_archive_url: "https://web.archive.org/web/20260427164741/https://staticcs.fitbit.com/content/assets/help/manuals/manual_aria_en_US.pdf"
  notes: >
    DIRECTION MATTERS: the SCALE is the HTTP client. After a weigh-in it joins
    Wi-Fi, opens a plain-HTTP connection to the name www.fitbit.com on TCP 80
    and POSTs its readings; no service that a LAN client could call on a
    set-up scale has been reported (nobody has published a port scan of one,
    so that is "never tested", not "none"). Local operation therefore means
    the OWNER RUNS A SMALL SERVER on the LAN and answers that one name with
    it through a DNS override. REDIRECT the name; never block it. The server
    contract is protocol_details.upload_server; it is not a set of endpoints
    on the scale and must not be bound to the scale's address.

    identify_only is deliberate: a phone app cannot be an always-on HTTP
    server answering for a vendor hostname, so this file documents a host
    implementation. What would earn `supported` back is a consumer that runs
    that server role.

    SCOPE: the ORIGINAL Aria, model FB201 (retail FB201B black, FB201W
    white), four AA cells, Wi-Fi only, no Bluetooth, upload protocol version
    3 as reported on firmware 35, 37 and 39. Aria 2 (FB202, three AA,
    Bluetooth-assisted setup) and Aria Air (FB203, three AAA, Bluetooth
    only) are different products with different transports and are not
    covered. The 2012-era protocol version 2 is mentioned only in
    protocol_details.protocol_version_2_historical.

    VENDOR PAIRING HAS ENDED. By Google's current English help pages,
    pairing and re-pairing of Aria and Aria 2 scales ended on 2026-11-09:
    read on 2026-11-24 at 01:01 UTC they say "Starting November 9, 2026,
    with the release of app version 5.12, you can no longer pair or re-pair
    Aria and Aria 2 scales." The same pages said "Starting November 28,
    2026" when read on 2026-11-23 between 05:11 and 06:57 UTC and "November
    9" from 23:07 UTC that day; nothing else in the sentence changed and the
    edit was not announced. The German, French and Japanese editions still
    said 28 November on 2026-11-24. Do not plan around the 28th: treat the
    vendor's door as already shut. The web page that used to set up an
    FB201 answered "no longer supported" when checked on 2026-11-23 and
    2026-11-24. Google still says scales paired before the date and left
    paired "will continue to sync", and names no end date. See
    protocol_details.vendor_status.

    ROUTE ORDER, because one step cannot be undone. (1) A scale that is
    already on Wi-Fi needs nothing done AT the scale: a DNS override plus a
    LAN server is the primary route, it needs no setup mode, and it leaves
    the stored network and token alone. (2) An owner who wants to KEEP
    vendor sync must not add that override on the scale's network; the
    choices are to do nothing or to run a pass-through relay. (3) Putting
    the scale into setup mode and sending it new Wi-Fi credentials is a
    ONE-WAY DOOR: the stored network is discarded, the vendor's token is
    replaced, and the vendor will not pair the scale again. All routes,
    with their evidence and risk, are in protocol_details.local_routes.

    NOTHING HERE WAS RUN ON THIS PROJECT'S HARDWARE. The upload exchange is
    reported working by several independent owners; setting up a scale from
    scratch against a purely local server is reported on firmware 35,
    author-reported on 37, unproven on 39 and has one unexplained failure
    report on firmware 38. Read remaining_unknowns before relying on it.
  identification:
    ssid_prefix: "Aria "
    mac_prefixes:
      - prefix: "00:1D:C9"
        confidence: "low"
        notes: >
          The IEEE registry (registries/ieee-oui.tsv) assigns this block to
          GainSpan Corp., maker of the scale's Wi-Fi module, not to Fitbit.
          Evidenced on FB201: the module label in the FCC internal-photo
          exhibit for XRAFB201A (2012 sample), the FCC label artwork, and a
          note in helvetic's firmware notes. Any GainSpan-based product can
          carry it.
      - prefix: "20:F8:5E"
        confidence: "low"
        notes: >
          The IEEE registry (registries/ieee-oui.tsv) assigns this block to
          Delta Electronics, not to Fitbit. Evidenced on FB201 units in a
          2014 packet-capture write-up, in helvetic's notes, in a public
          2016 capture set (firmware 37) and in third-party serial logs on
          firmware 39. Why two blocks are in use is not stated by any
          source; nobody has compared the address on the module's label
          with the address the same scale uses on the air.
    notes: >
      The only product-specific signal is the setup access point: an OPEN
      network named `Aria ` (the word, one space) followed by exactly six
      upper-case hexadecimal digits, which are the last three bytes of the
      scale's MAC. It exists only while the display reads SETUP ACTIVE.
      Match the whole pattern (regular expression `^Aria [0-9A-F]{6}$`), not
      the bare prefix, which would also claim any unrelated network whose
      name starts with that word. Neither MAC block belongs to Fitbit, and
      none of the blocks registered to Fitbit has been reported on an FB201,
      so a matcher keyed on the vendor's own blocks misses every unit; treat
      the two prefixes as a ranking hint in a router's client list and
      nothing more. Once provisioned the scale's Wi-Fi is reported to be up
      only while it is calling out, and no inbound service has been
      reported; none has been tested for either (the only published port
      scan is of setup mode). No default_port is declared for that reason.
      One more LAN-side hint exists: when it asks for an address the scale
      gives the DHCP host name `GainSpan` followed by six lower-case
      hexadecimal digits, the last three bytes of its MAC (regular
      expression `^GainSpan[0-9a-f]{6}$`; reported from a public capture set
      of one unit on firmware 37, 20 of 20 sessions). That is probably the
      Wi-Fi module maker's default and not unique to this product, so it is
      a ranking hint in a router's lease table, not proof. The schema has no
      identification field for a DHCP host name; the data is in
      protocol_details.station_mode.
  discovery:
    none: >
      Once on the home network the scale behaves as an outbound-only HTTP
      client whose radio is reported to be up only while it uploads. No
      mDNS, SSDP or listening port has been reported, and nobody has
      published a scan of a set-up scale, so "nothing to find" is absence
      of evidence, not a tested fact. The owner's server learns of the
      scale from the requests it receives, and a router's lease table may
      show its DHCP host name (protocol_details.station_mode). In setup
      mode the scale can be recognised by its open `Aria XXXXXX` access
      point, which is identification, not LAN discovery.
    identity:
      stable_keys: ["mac"]
      display: "mac"
      notes: >
        The MAC arrives as the `serialNumber` query parameter of the
        register and validate requests (12 upper-case hex digits) and as the
        6-byte `mac` field of every upload header. It is also printed on the
        underside label, next to a separate 16-digit serial the protocol
        never uses.
  setup:
    required: true
    confidence: "medium"
    notes: >
      Read the methods in order; the order is the safety advice. (1) A scale
      that is ALREADY joined to the home Wi-Fi keeps its stored network: for
      local operation the owner only starts the server and adds the DNS
      override, and the next weigh-in arrives. That is the best-evidenced
      path here (independent owners on firmware 35 and 39, reported on 37).
      Nothing is done AT the scale, with no setup mode and the stored
      network and token left alone, but the first accepted local reply does
      replace the scale's stored user list, display unit and clock. (2) A
      scale that lost its network only because a router was replaced may
      come back if the old network name and passphrase are recreated; that
      is an inference nobody has reported testing, the vendor's manual says
      a router change needs a reconnect, and it costs nothing to try. (3) A
      scale with no usable network (second-hand unit, never set up, old
      network gone for good) must be given Wi-Fi credentials through its own
      setup access point. The vendor page that used to do this is dead; the
      third method sends the same single request by hand. It is a ONE-WAY
      DOOR, reported on firmware 35, author-reported on 37, unproven on 39
      and with one unexplained failure report on 38, hence medium overall.
      WHO SHOULD NOT TOUCH ANYTHING: an owner whose scale still syncs to a
      Fitbit / Google account and who wants to keep that. (a) Do not enter
      setup mode and do not re-run setup: assume the stored network is
      discarded on entry, the request replaces the vendor's token with a
      made-up one, and the vendor-side link cannot be recreated because the
      vendor no longer pairs this scale. (b) Do not add the DNS override on
      the network the scale uses: the scale talks to one server only, so
      while the override is in place nothing reaches the vendor, and
      readings the local server accepts are treated as delivered and never
      reach the Fitbit account. For that owner the choices are to do
      nothing, or to run a pass-through relay
      (protocol_details.local_routes). A DNS override by itself leaves the
      stored network and token alone and can be taken out again; that it is
      fully reversible is an inference, not a tested fact. A battery change
      is expected to be safe, because the vendor's troubleshooting tells
      owners to do it, but whether the Wi-Fi key survives one on firmware
      38 and 39 is not established. So do not pull a battery on a working
      scale without a reason, and never press or step on the scale while it
      shows TAP TO CHANGE unless re-provisioning is the goal: see
      factory_reset and remaining_unknowns for what a battery pull is and
      is not shown to keep.
    methods:
      - type: "none"
        name: "Scale already on Wi-Fi: answer www.fitbit.com on the LAN (no setup mode)"
        role: "primary"
        verified: false
        evidence_level: "hardware-demonstrated by third parties on firmware 35 and 39 and reported on 37; not run by this project"
        brick_risk: "none"
        pairing_impact: >
          No setup mode is needed, so the stored network and the stored
          token are untouched. The server's first accepted reply replaces
          the scale's display unit, clock and user table. Taking the
          override out again should return the scale to the vendor while the
          vendor still serves paired scales (inferred, not tested).
        not_for: >
          An owner who wants to keep vendor sync. With the override in place
          the vendor receives nothing, and readings the local server accepts
          never reach the Fitbit account. That owner does nothing, or runs a
          pass-through relay instead (protocol_details.local_routes).
        basis: >
          Reported by third parties, not run by this project. helvetic's
          notes (firmware 35, 2014); a helvetic contributor on firmware 37
          and 39 (2017, read through a summarising tool); aria-spoof (39,
          2018 to 2020); a December 2024 relay write-up (firmware not
          stated); aria-bridge (39, 2026), whose source says the display
          followed the unit byte of its reply once the reply's CRC was
          right. A public 2016 capture set shows a firmware 37 scale asking
          the resolver its DHCP lease named for this one name.
        description: >
          Nothing is changed on the scale. The network's DNS resolver
          answers the scale's lookup of www.fitbit.com with the address of a
          server on the LAN that speaks protocol_details.upload_server. The
          scale keeps doing what it always did: join Wi-Fi after a weigh-in,
          look the name up, POST to TCP 80. The override must be on the
          resolver the scale's DHCP lease names, for that one name only, and
          for the scale alone where the network allows it.
        steps:
          - action: >-
              Start the LAN server on TCP 80 and test it WITHOUT changing
              DNS: from another device request /scale/validate at the
              server's address with the header `Host: www.fitbit.com`.
            actor: "user"
            expect: "Status 200 and the single character T."
            notes: >
              Testing by address touches neither the scale nor anyone's DNS,
              so an owner who still wants vendor sync can build and test a
              server this far and stop.
          - action: >-
              Add the DNS override: the single name www.fitbit.com answers
              with the server's LAN address, on the resolver the scale
              receives by DHCP, for the scale alone where the network allows
              it.
            actor: "user"
            expect: >-
              A lookup of www.fitbit.com from a second device that uses the
              same resolver returns the server's LAN address.
            notes: >
              CONSEQUENCE, from the next weigh-in on: the scale talks to the
              local server only. Nothing reaches the vendor; readings the
              local server accepts are treated by the scale as delivered and
              never reach the Fitbit account; the first accepted local reply
              replaces the scale's stored user list, display unit and clock.
              Do not add the override on the scale's network if vendor sync
              is to be kept. Other devices on the network look this name up
              too, and an Aria 2 in the same house may depend on it, so
              scope the override to this scale
              (protocol_details.upload_server.dns_override).
          - action: >-
              From a second device on the same resolver, fetch
              http://www.fitbit.com/scale/validate with curl or another
              plain-HTTP client, not a browser.
            actor: "client"
            expect: >-
              `T` from the owner's server. `F` is the vendor's answer to
              that bare request and means the override is not in effect for
              that device.
            notes: >
              A browser that has visited the vendor's site upgrades the
              request to HTTPS and fails against a port-80 server; that is a
              false alarm.
          - action: "Step on the scale for a normal weigh-in. Do not pull a battery first."
            actor: "user"
            expect: >-
              Nothing changes on the display until the reading is taken;
              then a progress bar.
            notes: >
              The scale is seen looking the name up at the start of a
              session, so a changed answer is expected to apply at the next
              weigh-in. A battery pull is not needed for this and opens the
              `TAP TO CHANGE` window on a working scale.
          - action: "Join the stored Wi-Fi network, look up www.fitbit.com and POST /scale/upload to whatever answers."
            actor: "device"
            expect: >-
              A POST /scale/upload reaches the server roughly 20 seconds
              after the reading. The vendor describes a progress bar and
              then a check mark on the display. A tick is reported on
              firmware 39 through a relay that handed the vendor's own reply
              back; for a server that writes its own replies a check mark
              is not explicitly reported by anyone. `NO SYNC`, or a Wi-Fi
              symbol with an X, means the upload failed or the reply was
              rejected; the reading is kept and sent again next time, so a
              wrong first reply loses nothing.
        troubleshooting:
          - symptom: "No request reaches the server after a weigh-in."
            causes:
              - "The override was added on a resolver the scale does not use. The scale uses the DNS server its DHCP lease names."
              - "The router's own local-DNS feature did not override a name that has a real public answer (reported on one UniFi gateway; another owner reports the opposite). Test from a second device, not from the DNS box itself."
              - "The server listens on a port other than 80, or redirects to HTTPS."
          - symptom: "Every reading arrives as user 0 with no body fat."
            causes:
              - "The reply carries no user whose weight window contains the reading. A new user has no window until the server is given a starting weight; see protocol_details.upload_server.users.first_window."
          - symptom: "`NO SYNC` although the upload arrives, and the same records come back every time."
            causes:
              - "The reply is being rejected: wrong CRC (initial value 0xffff is the usual mistake), wrong layout or length, or a missing Content-Length."
      - type: "none"
        name: "Router replaced: bring back the old network name and passphrase (untested)"
        role: "alternative"
        verified: false
        evidence_level: "inferred; nobody has reported trying it"
        brick_risk: "none"
        pairing_impact: "None if it works: stored network, token and any vendor link are untouched. Nothing is lost if it does not."
        basis: >
          An inference, not a report. In favour: a third-party serial log on
          firmware 39 shows the scale scanning for its stored network by
          name, and no source shows it tied to one access point's hardware
          address. Against: the vendor's manual says that after a change of
          network name, password, router or provider the scale has to be
          reconnected, without saying whether an identical network on new
          hardware counts. Not run by this project or, as far as it could
          find, by anyone in public.
        description: >
          Try this before setup mode whenever the scale's stored network
          disappeared because a router was replaced. The new router, or a
          dedicated access point, is given exactly the network name,
          passphrase and security mode the scale already holds, on 2.4 GHz
          with 802.11b rates still allowed. If the scale rejoins, nothing
          about it has changed. If it does not, nothing has been lost and
          the one-way method below is still available.
        steps:
          - action: >-
              Configure a 2.4 GHz network with exactly the old network name,
              the old passphrase and the old security mode (WPA2 personal
              unless the old network used something else), with 802.11b
              rates enabled and band steering off.
            actor: "user"
            notes: >
              A dedicated access point for the scale does as well as the
              main router, and can keep 802.11b rates that a new router
              drops. If local operation is wanted, that network's resolver
              carries the www.fitbit.com override; if vendor sync is to be
              kept, it must not.
          - action: "Step on the scale for a normal weigh-in. Do not pull a battery and do not press anything."
            actor: "user"
            expect: >-
              A check mark, or an upload at the local server, means the
              scale rejoined. `NO SYNC` means it did not, or that it joined
              and nothing usable answered; a router's client list showing a
              host named `GainSpan` plus six hexadecimal digits tells the
              two apart.
      - type: "softap_http"
        name: "ONE-WAY DOOR: direct request to the scale's setup access point"
        role: "alternative"
        verified: false
        evidence_level: >-
          hardware-demonstrated on firmware 35; author-reported on 37 (one
          line, no log); on 39 the request returned 200 but no public log
          shows the scale joining; no success report on 38, one unexplained
          failure
        brick_risk: "none (repeatable; no firmware is touched)"
        pairing_impact: >
          ONE-WAY. Entering setup mode is to be assumed to discard the
          stored network (stated for firmware 35; not tested on 37 to 39).
          The request stores a new token in place of the vendor's. The
          vendor-side link between scale and account is lost for good,
          because the vendor no longer pairs this scale.
        one_way_door:
          point_of_no_return: "The deliberate press while the display shows TAP TO CHANGE. A battery re-insert alone is not expected to change anything (expected, not established on firmware 38 and 39: a 2015 write-up says a fix then in preparation should wipe the key when the batteries are removed; see remaining_unknowns)."
          consequences:
            - "Assume the stored Wi-Fi network is discarded the moment the display reads SETUP ACTIVE, before any request is sent."
            - "The request replaces the stored token. A vendor-issued token cannot be put back."
            - "A scale that still synced to a Fitbit / Google account stops doing so, and by Google's current statement it cannot be paired again."
            - "After that the only way back onto any Wi-Fi network is this same unverified request."
          before_you_start:
            - "Have the DNS override and the server answering first, and test them from a second device."
            - "If the scale lost its network to a router change, try the method above first."
            - "Know the firmware number (shown as V and a number at power-up). On 38 there is no success report; on 39 nobody has published a log of the scale joining."
            - "Use a computer that is not the machine running the server, the resolver or a hotspot."
        basis: >
          Reported by third parties, not run by this project. helvetic's
          notes are headed as tested on firmware 35 and give the request,
          the display sequence and the register call that follows a made-up
          token (2014). The ESP32 port's README gives the same request and
          says, in one line with no log, that the code was tested with
          firmware 37; its access point has no upstream by construction
          (2024). aria-bridge's pairing script received a 200 status line
          for the request on firmware 39 (2026); its how-to says the scale
          then joins, but no log shows it and the project's own notes say
          the scale was already on the home network. Against that: helvetic
          issue 4 (2020-01-14, firmware 38) is an unexplained, unresolved
          report of a scale that would not reliably connect while DNS was
          redirected; its only reply says that registering against Fitbit
          first and redirecting afterwards worked, which is no longer
          possible (read through a summarising tool, not verbatim). A
          public 2016 capture set shows the register, validate and empty
          upload that follow a setup on firmware 37, but against Fitbit's
          server after the vendor's own setup; no source publishes a log of
          those requests arriving at a local server.
        description: >
          The scale, in setup mode, is an open Wi-Fi access point with a
          small web server. One HTTP GET to that server carries the home
          network's name and passphrase in the URL and a token in a cookie.
          The scale stores them, drops its access point, joins the named
          network, and then calls register, validate and upload on whatever
          answers www.fitbit.com there. The token is not checked by the
          scale; it is stored and echoed, so any short string works. Use at
          most 31 characters: a longer token is reported to be cut to 31
          when the scale echoes it (basis under the token argument below;
          not tested). No Fitbit page, app or account takes part.
          Everything crosses the open access point in clear text. This is a
          provisioning hook and nothing else: the setup access point has
          never been shown to serve readings or a debug channel.
        softap:
          ssid_prefix: "Aria "
          ssid_examples: ["Aria 005301"]
          open_network: true
          gateway_ip: "192.168.240.1"
          port: 80
        timing:
          battery_out_before_reinsert_s: 10
          firmware_version_shown_after_boot_s: 1.6
          tap_to_change_prompt_after_version_s: 3
          standby_holdoff_after_cold_boot_s: 15
          access_point_dropped_after_request: "within seconds per one how-to (firmware 39); not logged"
          tap_to_change_window: "not documented; on the order of seconds"
          setup_active_timeout: "not documented"
          register_to_validate_s: {min: 0.17, max: 0.35, basis: "20 public captures, firmware 37, against the vendor"}
          validate_to_first_upload_s: {min: 0.17, max: 0.33, basis: "20 public captures, firmware 37, against the vendor"}
        steps:
          - action: >-
              Start the LAN server and put the DNS override for www.fitbit.com
              in place BEFORE touching the scale, and confirm from a second
              device that the name resolves to the server and that
              /scale/validate answers T.
            actor: "user"
            expect: >-
              A lookup of www.fitbit.com from another device on the home
              network returns the server's LAN address.
            notes: >
              Without the override the scale's register request, which
              carries its MAC, the token and the home network's name, goes to
              the vendor instead. If the scale is already joined to this
              network, STOP HERE and weigh in: no provisioning is needed and
              the steps below would only destroy what it has stored.
          - action: "Take one battery out of the scale, wait 10 seconds, and put it back. Do not press or step on the scale."
            actor: "user"
            expect: >-
              The display shows `HI :)`, then `V` and the firmware number
              (for example V39), then `SETUP ACTIVE` if no network is stored.
              If it instead scrolls `WIFI IS <network name>` and `TAP TO
              CHANGE`, a network is still stored: read the next step before
              doing anything.
            notes: >
              A battery re-insert on a configured scale does not by itself
              enter setup mode, and the vendor's own troubleshooting assumes
              it keeps the stored network. Against that, a 2015 write-up
              says a fix Fitbit was then preparing should wipe the stored
              key when the batteries are removed. Whether the Wi-Fi key
              survives a battery pull on firmware 38 and 39 is not
              established (remaining_unknowns). To back out at this point,
              leave the scale alone until the display goes dark.
          - action: >-
              POINT OF NO RETURN. Only if the display shows `TAP TO CHANGE`,
              and only to re-provision: press briefly and firmly, for under
              a second, on the two lower corners of the scale, the ones
              farthest from the display.
            actor: "user"
            expect: >-
              `SETUP ACTIVE`. If the display goes blank or shows `STEP ON`
              or a weight, the moment was missed: repeat the battery step.
            notes: >
              CONSEQUENCE: assume that once the display reads `SETUP ACTIVE`
              the stored network is gone, even if no request is ever sent
              (helvetic, firmware 35, describes loading the platform at this
              prompt as forcing a reset of the Wi-Fi settings; a 2015
              write-up says a fix Fitbit was then preparing should wipe the
              stored name and key when the scale is reset into setup mode;
              nobody has tested firmware 37 to 39). A scale that still
              synced to the vendor will stop, and the vendor will not pair
              it again. The press is vendor wording
              (manual Rev C and the current help page); helvetic describes
              the same moment as standing on the scale. Both load the
              platform during the prompt, which is why nobody should step on
              the scale while it shows.
          - action: >-
              From a computer that is NOT the machine running the server,
              the resolver or a hotspot, join the open Wi-Fi network named
              `Aria ` plus six hexadecimal characters.
            actor: "user"
            expect: >-
              The client gets an address by DHCP in 192.168.240.0/24; the
              scale is 192.168.240.1 and is also the DNS server there.
            notes: >
              The six characters are the end of the MAC printed on the
              underside label. Every published report used a computer;
              nobody reports doing this from a phone, and a phone may leave
              a network that has no internet. A second machine matters
              because the scale calls the server within a second of joining
              (this project's inference from the timings; not a reported
              failure). The network is open: everything sent on it,
              passphrase included, can be read by anyone in radio range.
          - action: >-
              Send the home network's name and passphrase to the scale with
              one HTTP GET to 192.168.240.1 port 80: the path /scale/setup,
              `ssid` and `custom_password` in the query string, and the
              token in a `Cookie: token=<value>` header.
            actor: "client"
            request:
              protocol: "http"
              action: "GET /scale/setup"
              arguments:
                - name: "ssid"
                  type: "string"
                  required: true
                  in: "query"
                  description: >-
                    URL query parameter. Name of the 2.4 GHz network the
                    scale should join. The vendor advises letters and digits
                    only; how the scale decodes `+`, `%20` or other escapes
                    is not documented.
                - name: "custom_password"
                  type: "string"
                  required: true
                  in: "query"
                  max_characters: 31
                  description: >-
                    URL query parameter. The network passphrase, at most 31
                    characters (vendor limit), letters and digits advised.
                    How an open or WEP network is expressed, and whether the
                    parameter may be left out, is not documented.
                - name: "token"
                  type: "string"
                  required: true
                  in: "cookie"
                  max_characters: 31
                  max_characters_basis: >-
                    Reported, not tested. A third party read the request
                    templates in firmware 35 and 39 images and reported that
                    the scale copies at most 31 characters of the token into
                    its register and validate requests. That reading reached
                    this project through a helvetic issue thread it could
                    only read through a summarising tool, not verbatim. What
                    the scale does with a longer cookie value is not
                    reported. Every token reported in use is between 10 and
                    20 characters long.
                  description: >-
                    NOT a URL parameter: sent as the request header
                    `Cookie: token=<value>`. Use at most 31 characters; the
                    scale stores the token and echoes it to the register and
                    validate requests, and a longer one is reported to be
                    cut to 31 there (see max_characters_basis). Whether the
                    cookie may be omitted is not documented; every reported
                    working request sends it.
            expect: >-
              A status line with code 200. Do not rely on the body: firmware
              39 declares chunked transfer encoding without valid chunk
              framing and does not close the connection cleanly, so a strict
              HTTP client raises an error or times out AFTER the request has
              succeeded. Read the status line, then stop.
            timeout_seconds: 15
            notes: >
              Send this one GET and nothing else. Do not POST to the scale
              or probe other paths on a scale you want to keep: nothing
              shows what its web server does with them.
          - action: "Drop the setup access point and join the named network."
            actor: "device"
            expect: >-
              The `Aria XXXXXX` network disappears (within seconds per one
              how-to; never logged). On failure the display shows `WIFI
              ERR` or `NO SYNC`. On firmware 39 nobody has published a log
              of this join, and on 38 nobody reports it succeeding.
          - action: >-
              Call GET /scale/register and then GET /scale/validate on the
              host www.fitbit.com, which the DNS override has pointed at the
              owner's server, then POST a first /scale/upload with zero
              records.
            actor: "device"
            expect: >-
              All three requests appear in the server's log within about a
              second and are answered as protocol_details.upload_server.routes
              says. Against the vendor in 2016 (firmware 37) validate
              followed register after 0.2 to 0.4 seconds on the same
              connection, and the empty upload followed on a second
              connection 0.2 to 0.3 seconds later. The vendor describes a
              check mark or a smiley face on the display at the end of a
              successful setup.
            notes: >
              No published log shows this exchange against a local server;
              see remaining_unknowns. What the scale does if validate is
              missing or answers anything but `T` is unknown.
          - action: "Step on the scale for a first weigh-in."
            actor: "user"
            expect: >-
              A POST /scale/upload reaches the server roughly 20 seconds
              after the reading. `NO SYNC`, or a Wi-Fi symbol with an X,
              means the upload failed or the reply was rejected; the reading
              is kept and sent again next time.
        troubleshooting:
          - symptom: "The HTTP client reports a protocol, chunked-encoding or timeout error on the setup request."
            causes:
              - "Expected on firmware 39: the scale's reply is malformed after a valid 200 status line. If the status line was 200 the request was accepted."
          - symptom: "`WIFI ERR` or `NO SYNC` on the display right after sending the request."
            causes:
              - "Wrong passphrase, or one longer than 31 characters."
              - "The router does not accept 802.11b clients on 2.4 GHz, or the network is 5 GHz only."
              - "MAC filtering, a firewall, or a Wi-Fi extender between scale and router (causes the vendor names)."
              - "A network name or passphrase with characters other than letters and digits."
              - "Nothing answered www.fitbit.com over plain HTTP on TCP 80: the DNS override is missing, or is not served by the resolver the scale receives by DHCP."
              - "The machine that sent the request is also the server, resolver or hotspot and was still on the scale's network when the scale called (inferred cause)."
              - "Firmware 38: the one public report on that version is a failure with no explanation."
          - symptom: "The scale joined the network but no request reaches the server."
            causes:
              - "The override was added on a resolver the scale does not use. The scale uses the DNS server its DHCP lease names."
              - "The router's own local-DNS feature did not override a name that has a real public answer (reported on one UniFi gateway; another owner reports the opposite). Test from a second device, not from the DNS box itself."
              - "The server listens on a port other than 80, or redirects to HTTPS."
          - symptom: "The display never leaves the stored-network prompt, or goes blank."
            causes:
              - "The corner press came too late or was too long. Pull a battery and try again; the prompt appears about three seconds after the firmware number."
          - symptom: "`SETUP ACTIVE` appeared by accident on a scale that was working."
            causes:
              - "The scale was pressed or stepped on while it showed `TAP TO CHANGE`. UNTESTED SUGGESTION: nobody has reported what recovers from this, or whether setup mode ends by itself. Send nothing. Take one battery out for 10 seconds, put it back and do not touch the scale. If `WIFI IS <network name>` appears, the name is still stored; that does not show the key is (the one firmware 39 log that shows the name also prints an empty passphrase field and four failed joins), so weigh in to find out whether the scale can still join. If `SETUP ACTIVE` appears again the network is gone, and this method is the only way back onto Wi-Fi."
      - type: "cloud_account"
        name: "Fitbit web setup page and desktop program (dead for this scale)"
        role: "historical"
        verified: false
        basis: >
          Vendor manual Rev C and Google Health help pages describe the flow;
          its current state was observed first-hand by this project's
          researchers on 2026-11-23 and 2026-11-24 with plain web requests.
          Never run with a scale by this project.
        description: >
          Fitbit's own flow drove the same scale-hosted request. Two vendor
          routes did it from 2012: a desktop program, and a web page at
          fitbit.com/scale/setup/start that signed the owner in, set a
          `token` cookie for the vendor's domain and sent the browser to the
          scale's setup access point so the cookie went with the request.
          Manual Rev C (PDF dated 2018-12-05) documents only the web page,
          so from about December 2018 it was the only one. No FB201 manual
          documents setup in the mobile app. Press reported in May 2023
          that a removed original Aria could not be added back to an
          account. On 2026-11-20 press reported the web flow answering "no
          longer supported"; on 2026-11-23 and 2026-11-24 this project saw
          the setup URL redirect to a static page titled "Aria is no longer
          supported", last modified 2026-11-09. Google's English help pages
          now give 2026-11-09, "with the release of app version 5.12", as
          the date from which Aria and Aria 2 can no longer be paired or
          re-paired (protocol_details.vendor_status has the wording, its
          earlier form and the fetch times). Kept here so a reader who
          finds this flow in the manual knows why it fails.
        cloud:
          provider: "Fitbit / Google Health"
          local_alternative: >
            Yes, reported and not verified by this project: the direct
            request above sends the same request to the scale's setup access
            point with no vendor page, app or account, and a scale that is
            already on Wi-Fi needs no setup at all.
        steps:
          - action: >-
              Do not start here. The vendor's setup page no longer works for
              this scale, and by the vendor's current statement pairing has
              ended. Do not unpair or remove a scale that still syncs: it
              cannot be paired again.
            actor: "user"
    factory_reset:
      applicable: "unknown"
      confidence: "low"
      effect: >
        No user-level factory reset is established for FB201, and what the
        vendor's "erase" does is not established either. The vendor's
        instruction is a 10-second battery removal. A third-party serial log
        on firmware 39 shows the user table read back from flash and the
        stored network NAME still shown after a power loss. A weigh-in log
        from the same clock epoch prints the stored passphrase field empty
        and then shows four failed joins at weak signal (about -82 dBm), so
        it does not show that the Wi-Fi key survived and cannot tell a weak
        signal from a lost key. The vendor's own troubleshooting tells
        owners of configured scales to take the batteries out for 10
        seconds, which assumes the network is kept. Against that, a 2015
        write-up says Fitbit was preparing a fix under which the stored
        name and key should be wiped when the reset switch is pressed, and
        the key also when the batteries are removed; whether that shipped,
        and in which firmware, is not published. So: users and the network
        name are shown to survive on one firmware 39 unit; whether the key
        survives a battery pull is not established on any firmware; and
        entering setup mode is to be assumed to discard the network. Three
        switches sit on the circuit board inside the case; what each does
        is not documented (the 2015 write-up mentions a reset button as
        another way into setup mode, without saying which switch). Changing
        Wi-Fi does not need a reset.
      description: >
        Do not attempt a reset as troubleshooting, and do not remove the
        scale from a vendor account to "start clean": the vendor will not
        pair an FB201 again. No way to clear a scale before it is sold or
        given away is established either. An internal serial console lists
        commands whose names suggest clearing stored users and the stored
        weight log. Do not run them: none was shown running by any source,
        their effect is unknown and may destroy calibration or identity for
        good, the same listing names commands that write factory,
        calibration and identity data, and reaching the console means
        opening the scale (protocol_details.local_routes has the warnings).
      procedures:
        - name: "Vendor 'erase' instruction: batteries out for 10 seconds (what it erases is not established)"
          verified: false
          basis: >
            Google Health help article "How do I erase my Fitbit device?"
            gives this as the whole instruction for the original Aria. On
            one firmware 39 unit a third-party serial log shows stored users
            and the stored network name still present after power loss, and
            does not show whether the Wi-Fi key survived. Not run by this
            project.
          description: >
            What is reported to happen is a restart: the display greets,
            shows the firmware number, then either `SETUP ACTIVE` (nothing
            stored) or the stored network's name. Treat it as a restart, not
            as a wipe: it is not shown to remove users, so it is not a way
            to clear a scale before selling it. CONSEQUENCE on a working
            scale: it opens the `TAP TO CHANGE` prompt, and a press or a
            step during that prompt enters setup mode, which is to be
            assumed to discard the stored network; whether the Wi-Fi key
            survives the battery pull itself on firmware 38 and 39 is an
            open question. Do it only when there is a reason, and keep
            hands and feet off the scale until the display goes dark.
          power_state: "any"
          indicator: "`HI :)`, then `V` and the firmware number."
          steps:
            - action: "Remove the batteries, wait 10 seconds, and put them back. Do not press or step on the scale while the display is lit."
              actor: "user"
              expect: >-
                The scale restarts. If the display then shows `WIFI IS
                <network name>`, the stored network name was NOT erased.
    rejoin:
      in_place_supported: false
      requires_factory_reset: false
      notes: >
        No reset is needed, but there is no in-place way to hand the scale a
        new network: new credentials are accepted only in setup mode, and
        setup mode is a one-way door (see the third setup method). So the
        order is: (1) avoid re-provisioning altogether by giving the
        replacement router, or a dedicated access point, the same network
        name, passphrase and security mode as the old one, with 802.11b
        rates enabled on 2.4 GHz. That is an inference from the scale's
        stored-network behaviour, not a tested procedure; the vendor's
        manual says a router change needs a reconnect; it costs nothing to
        try. (2) Only if that fails, repeat the direct request with the new
        name and passphrase, accepting its consequences: the stored network
        and token are replaced, and a scale that still synced to the vendor
        stops for good. Either way, a network meant for local operation
        must carry the www.fitbit.com override on its DHCP-advertised
        resolver, and one meant to keep vendor sync must not. A third-party
        log shows the firmware trying three network slots, one of them
        populated; whether setup can store a second network is not shown.
        Whether the scale must complete register and validate again after
        re-provisioning before it uploads is unknown.
      steps:
        - action: >-
            First try without touching the scale: give the new router or a
            dedicated access point the old network name, passphrase and
            security mode, with 802.11b rates on 2.4 GHz, and weigh in.
          actor: "user"
          expect: "A check mark or an upload. Untested; if it fails nothing has been lost."
        - action: >-
            Only if that failed and the one-way consequences are accepted:
            put the www.fitbit.com override and the server in place on the
            new network and confirm them from a second device.
          actor: "user"
        - action: >-
            Take one battery out, wait 10 seconds, put it back, and press
            the two lower corners briefly when `TAP TO CHANGE` appears. This
            press is the point of no return: assume the stored network is
            discarded and any vendor link is lost for good.
          actor: "user"
          expect: "`SETUP ACTIVE`."
        - action: "From a second computer, join the `Aria XXXXXX` network and send GET /scale/setup with the new network name, passphrase and a token cookie."
          actor: "client"
          expect: "A 200 status line; the scale is then expected to leave setup mode and join the new network (not logged on firmware 39; no success report on 38)."
    credentials:
      wifi_passphrase_protection: "plaintext"
      stored_on_device: ["wifi_passphrase", "setup_token", "user_profiles"]
      issued_to_client: []
      notes: >
        The passphrase and the token cross an OPEN access point as a
        clear-text URL query and cookie. A 2015 write-up found a setup-mode
        page that returned the stored network name and passphrase; whether
        later firmware still serves it is not established. The scale keeps
        each user's id, name, weight window, age, sex and height in flash.
        The token is not a secret that protects anything: the scale does not
        check it and a local server need not either. Every upload also
        carries a 16-byte `auth_code` whose origin is unknown; treat real
        values of it, the MAC, the token and the network name as private
        and keep them out of shared logs.
  pairing:
    required: false
    confidence: "medium"
    security_mode: "none"
    bonding: "none"
    enter_pairing_mode:
      required: false
      notes: >
        There is no pairing mode. Setup mode (device.setup) only hands the
        scale Wi-Fi credentials; it does not bind the scale to a server, and
        entering it is a one-way door for a scale that still syncs to the
        vendor.
    notes: >
      There is no Bluetooth and nothing pairs. The scale trusts whatever
      answers the name www.fitbit.com on the network it joined: it opens a
      plain-HTTP connection, sends its readings, and accepts any reply whose
      layout and CRC-16 are right. It does not authenticate the server, and
      a local server needs no key, certificate or prior registration to be
      accepted. In the other direction the scale presents its MAC, a 16-byte
      per-scale code and (at registration) the setup token; a local server
      may ignore all three. The network is the only gate: anyone who can
      answer that name for the scale, or who is in radio range during setup
      mode, is trusted. Medium confidence because this rests on working
      public implementations, not on a run by this project. What the vendor
      called "pairing" was the link between a scale and a Fitbit / Google
      account. By Google's current statement that link can no longer be
      created or re-created for this scale, so "unpairing" in the vendor
      app, or removing yourself from the scale, cannot be undone: do not
      use either on a scale whose vendor sync matters.

cloud:
  required: false
  vendor_service: "Fitbit / Google Health scale sync (the /scale/ endpoints on www.fitbit.com)"
  failure_mode: >
    With nothing usable answering www.fitbit.com the scale still weighs and
    shows weight. It shows `NO SYNC` or a Wi-Fi symbol with an X, keeps each
    reading and sends the backlog with the next attempt (up to 17 readings
    in one request have been seen). It receives no clock, display unit or
    user list, so a scale that has no stored users shows weight only, as a
    guest, with no body-fat figure. On the vendor side: the setup page is
    gone; pairing and re-pairing have ended by Google's current statement
    (2026-11-09 on its English help pages, which said 2026-11-28 until
    2026-11-23); and Google says scales paired before that date and left
    paired "will continue to sync", with no end date and no guarantee.
  egress:
    - host: "www.fitbit.com"
      contacted_by: "both"
      roles: ["device_cloud", "provisioning", "firmware_check", "firmware_download", "time"]
      ports: [{port: 80, protocol: "tcp"}]
      when_blocked:
        impact: "breaks"
        effect: >
          REDIRECT this name to your own LAN server; never sinkhole or block
          it. It is the only name the scale talks to: every weigh-in upload,
          the registration calls after setup, and the scale's clock, display
          unit and user list all come from whatever answers it over plain
          HTTP on TCP 80. Blocked or unanswered, the scale shows NO SYNC,
          never gets a clock or users, and re-sends its stored readings on
          every attempt. Answer it instead, for this one name only and from
          the resolver the scale receives by DHCP, with a server that speaks
          the upload protocol in the fitbit-aria-wifi-scale spec. Phones and
          browsers look the same name up, so give the answer to the scale
          alone where your network allows it. Leave the name alone entirely
          if the scale still syncs to Fitbit and you want to keep that.
        workaround: >
          Split-horizon DNS for the single name www.fitbit.com (not
          fitbit.com, not a wildcard), pointing at the owner's server, served
          by the resolver the scale's DHCP lease names. Best is a resolver
          handed to the scale alone by a per-device DHCP option. A separate
          network segment does the same only if the scale is already on it:
          moving a joined scale to another network needs setup mode, which
          cannot be undone. A network-wide record also sends every other
          client's lookups of that name to the server. Once the scale is run
          locally, keep the override permanently: if the public name ever
          changes hands, whoever answers it receives the uploads and can
          send the firmware-update signal.
      verification: "reported"
      basis: >
        Hostname and port: a 2014 packet capture of firmware 35 (Pen Test
        Partners, part 2), helvetic protocol.md, a public 2016 capture set
        in which a firmware 37 scale makes one DNS query for this name and
        sends register, validate and upload to it, and several later owner
        deployments on firmware 37 and 39 that redirected this name.
        The firmware roles rest on helvetic's notes and a 2015 write-up
        whose author fetched an image from a path on this name (the update
        signal rides the upload reply; images were served under
        /scale/firmware/ on the same name). The time role is the
        server-time field of the upload reply. `both` because the vendor's
        browser setup flow used the same name. Not observed by this project.
    - host: "1.scale.www.fitbit.com"
      contacted_by: "app"
      roles: ["provisioning"]
      ports: [{port: 80, protocol: "tcp"}]
      when_blocked:
        impact: "none"
      verification: "reported"
      basis: >
        2014 write-up of the vendor's web setup (Pen Test Partners, part 1):
        the BROWSER was sent to this name while joined to the scale's setup
        access point, where the scale's own DNS answered it with the scale's
        address. The scale never looks it up, the vendor flow that used it
        is dead, and the direct local method uses the scale's address
        instead.
    - host: "aria1.fitbit.com"
      contacted_by: "app"
      roles: ["other"]
      ports: [{port: 443, protocol: "tcp"}]
      when_blocked:
        impact: "none"
      verification: "reported"
      basis: >
        First-hand web checks by this project's researchers on 2026-11-23
        and 2026-11-24: the vendor's setup URL redirects a BROWSER here, to
        a static "Aria is no longer supported" page. Nothing reports the
        scale contacting it.
      notes: "Landing page for the dead web setup; listed so nobody mistakes it for a name the scale needs."
  endpoints:
    - path: "/scale/register"
      method: "GET"
      name: "vendor_register"
      returns: "Empty 200 with Content-Length 0 in a 2014 capture and in 20 public captures from 2016. A bare request with no parameters returned 400 on 2026-11-23."
      verification: "reported"
    - path: "/scale/validate"
      method: "GET"
      name: "vendor_validate"
      returns: "One character: `T` for a valid serial and token (2014 capture; 20 public captures from 2016), `F` otherwise. A bare request with no parameters returned 200 and `F` over plain HTTP on 2026-11-23 and 2026-11-24."
      verification: "reported"
    - path: "/scale/upload"
      method: "POST"
      name: "vendor_upload"
      returns: "The binary reply documented in protocol_details.upload_server. A bare GET returned 400 on 2026-11-23; no real upload was sent to the vendor by this project."
      verification: "reported"
    - path: "/scale/firmware/{version}"
      method: "GET"
      name: "vendor_firmware_image"
      returns: "A firmware image for the given version, with the scale's MAC as the serialNumber query parameter (helvetic's notes, 2017; a 2015 write-up). Header-only requests on 2026-11-23 were still answered 200 with a binary content type for versions 35, 38 and 39, and 404 for version 33; no image was fetched by this project. A local server must never serve this path. See protocol_details.firmware_danger."
      verification: "reported"
    - path: "/scale/setup/start"
      method: "GET"
      name: "vendor_web_setup"
      returns: "Formerly the browser setup flow. On 2026-11-23 and 2026-11-24 a 301 redirect to a static 'Aria is no longer supported' page."
      verification: "reported"
  data_leaves_device:
    - "body weight"
    - "body-fat percentage and bio-impedance"
    - "the scale's MAC address and a 16-byte per-scale code"
    - "the home Wi-Fi network name and the setup token (in the register request)"
    - "battery level and firmware version"
    - "per-user ids, and the readings of guests who step on"
  notes: >
    State of the vendor service on 2026-11-24, the edit to the vendor's
    stated date, and the disagreements between the vendor's own pages are in
    protocol_details.vendor_status. Whether Fitbit's endpoints keep serving
    already-paired FB201 scales, and for how long, is an open question: the
    help page says they "will continue to sync" and names no end date, while
    the vendor's static notice says it no longer supports or connects to
    these scales.

local_access:
  status: "native"
  summary: >
    The stock scale uploads over plain HTTP to a name the owner can answer
    on the LAN, so stock firmware and no extra hardware are enough, but an
    always-on server on the LAN is required: a small HTTP server on TCP 80
    plus a DNS override that points www.fitbit.com at it. A scale already on
    the home Wi-Fi needs nothing done to it, and that is the primary route.
    A scale that needs Wi-Fi credentials can be given them through its own
    setup access point with one HTTP request, which is a one-way door for a
    scale that still syncs to the vendor. All of it is reported by third
    parties and untested by this project. Every route, with evidence level,
    needs, brick risk and pairing impact, is in
    protocol_details.local_routes.
  covers:
    - "Receiving every weigh-in: weight in grams, time, user id or guest, body-fat figure, impedance, battery level"
    - "Setting the display unit (lb, st, kg) and the scale's clock from the server's reply"
    - "Giving the scale its user list (name, weight window, age, sex, height) so it recognises people and shows body fat"
    - "Joining the scale to a Wi-Fi network without any Fitbit page, app or account (reported on firmware 35, author-reported on 37; one-way)"
    - "Refusing firmware updates for good"
    - "What a pass-through relay is, for owners who want to keep vendor sync while it lasts (described, not specified byte for byte)"
  not_covered:
    - "Aria 2 (FB202) and Aria Air (FB203): different transports, not this protocol"
    - "Getting readings into a Fitbit / Google Health account from a local server: only the vendor's own endpoint does that, and only for a scale the vendor still accepts"
    - "Firmware update: documented for refusal only; the update form is unverified and must never be sent, and no modified image has ever been built"
    - "A factory reset: none is established for this model"
    - "Anything on protocol version 2 firmware (2012)"
    - "A phone-only path: something on the LAN has to answer TCP 80 whenever the scale wakes"
    - "Bluetooth: the FB201 has none"
    - "Any connection INTO the scale on the home network: no inbound service has been reported and none has been tested for"

features:
  - type: "firmware_update"
    dfu:
      mechanisms: ["vendor_cloud"]
      transport: "http"
      image:
        signing: "unknown"
        source: "device_pulls"
        format: "Unknown. Images were fetched by version number from a path on www.fitbit.com; no source describes the container beyond section boundaries guessed by a file-scanning tool."
        notes: >
          No source describes image signing or integrity checking. The
          authors of a 2015 write-up tried to load a modified image,
          reported that the update process was well protected, and stopped;
          nothing has been published since. Nobody has built or flashed a
          modified image for this scale. This spec supplies no image and no
          URL to one.
      enter:
        how: "automatic"
        notes: >
          The scale decides from the upload reply. The 12-byte tail
          (payload_formats.AriaUploadReplyTail) carries an update status:
          local servers that mean "no update" send the tail words 0, 3, 0
          (one, aria-bridge, sends 3, 3, 0), and Fitbit's own server sent
          0, 0, 0. The value 1 is reported to
          mean "update available" and to be followed by more bytes carrying
          a URL. Which of the first two tail words the scale reads as the
          status is not settled. A check-in with zero records about once a
          day is reported as the moment the scale asks.
      dfu_mode:
        notes: >
          Not established. The display text UPDATING and NO UPDATE appears
          only in the title of a forum thread nobody could read; treat as
          unverified.
      recovery:
        interrupted: "unknown"
        notes: >
          No recovery from a bad or interrupted image has ever been shown on
          this product. Treat a failed update as permanent.
      verification: "reported"
      notes: >
        DOCUMENTED FOR REFUSAL ONLY. To say "no update", a server sends the
        tail words 0, 3, 0. helvetic, its test server and the ESP32 port
        send that (firmware 35 by helvetic's author; 37 author-reported; 37
        and 39 by one helvetic contributor). aria-bridge, the one local
        server whose own author reports firmware 39, sends 3, 3, 0. None
        reports a scale attempting an update. The
        "update available" form is NOT implementable from this file and
        must never be sent: its byte placement is unverified (helvetic's
        printed structure is known to be wrong elsewhere, and the only
        numeric trace is one unexplained length byte), no local server has
        ever sent it, and its effect would be to make the scale fetch
        firmware over unauthenticated plain HTTP from whatever answers
        www.fitbit.com, with no demonstrated recovery if that goes wrong.
        So: never put 1 in any tail word, never add bytes to the reply, and
        never answer requests under /scale/firmware/. The facts behind this
        rule, and nothing resembling a procedure, are in
        protocol_details.firmware_danger. What a scale on old firmware does
        when it is told "no update" indefinitely has not been reported.

payload_formats:
  AriaUploadRequestHeader:
    description: >
      First 46 bytes of the body of POST /scale/upload, protocol version 3.
      Sent by the scale. Field keys used in every table in this block:
      `offset` is the byte offset from the start of this structure and
      `length` is in bytes; multi-byte integers and floats are
      little-endian; `constant` is the only value ever reported for the
      field, from any sender; `server_sends` (reply tables only) is the
      value a local server places there when more than one value has been
      seen or described; `values` maps raw decimal values to their meaning;
      `other_values_seen` lists raw values that have been observed and that
      `values` does not explain, so a parser must accept them;
      `values_seen` lists every raw value observed in the field from any
      sender; `never_send` lists raw values a server must never place
      there;
      `meaning_unknown: true` marks a field whose purpose nobody has
      established; `encoding`, `pad_byte` (decimal) and `truncate_to_bytes`
      say how a fixed-width text field is filled. Each table's `example` is
      hex only, a slice of a vector in
      protocol_details.upload_server.test_vectors, and `example_notes` says
      what it decodes to.
    fields:
      - {name: "protocol_version", offset: 0, length: 4, type: "uint32", endianness: "little", constant: 3, verification: "reported", description: "Upload protocol version. 3 on firmware 35, 37 and 39. Reject anything else."}
      - {name: "battery_percent", offset: 4, length: 4, type: "uint32", endianness: "little", unit: "%", verification: "reported", description: "Battery level 0 to 100, whole percent, derived by the scale from the pack voltage of its four AA cells."}
      - {name: "mac", offset: 8, length: 6, type: "bytes", min_length: 6, max_length: 6, verification: "reported", description: "The scale's MAC address, bytes in the order they are printed (first printed octet at offset 8)."}
      - {name: "auth_code", offset: 14, length: 16, type: "bytes", min_length: 16, max_length: 16, meaning_unknown: true, verification: "reported", description: "Opaque per-scale value, constant across one scale's uploads and not a nonce. In a public capture set it stayed the same across 20 fresh setups that used 20 different tokens (one unit, firmware 37). Origin unknown. Treat as opaque; never publish a real one."}
      - {name: "firmware_version", offset: 30, length: 4, type: "uint32", endianness: "little", verification: "reported", description: "Application firmware number as shown on the display at power-up (35, 37, 39 reported)."}
      - {name: "unknown_34", offset: 34, length: 4, type: "uint32", endianness: "little", meaning_unknown: true, verification: "reported", description: "Unknown. 33 on firmware 28 (version 2), 35 and 37; not published for 38 or 39. Do not validate it."}
      - {name: "scale_clock", offset: 38, length: 4, type: "uint32", endianness: "little", unit: "s", verification: "reported", description: "The scale's clock at the moment of upload, Unix epoch seconds. It is whatever the last accepted reply set, advanced by the scale; after a power loss it restarts at a fixed time that on firmware 39 is the firmware build time (a firmware 37 scale fresh from a hard reset reported a morning in November 2014 in 20 of 20 public captures made in 2016)."}
      - {name: "record_count", offset: 42, length: 4, type: "uint32", endianness: "little", verification: "reported", description: "Number of 32-byte measurement records that follow. 0 is legal and is what the first upload after setup carries; 1 and 17 have been seen."}
    parse_rules:
      - "Read the raw request body as bytes. The request declares a form content type; a framework that parses form bodies corrupts the data."
      - "Require body length >= 48 and (length - 48) divisible by 32, then require protocol_version == 3 and record_count == (length - 48) / 32."
      - "Compute CRC-16/XMODEM over every byte before the last two and compare with the trailer (payload_formats.AriaUploadRequestTrailer). Log a mismatch; rejecting is optional."
      - "Records start at byte 46; record i starts at 46 + 32 * i."
    example: "03000000 57000000 00005e005301 a0a1a2a3a4a5a6a7a8a9aaabacadaeaf 27000000 21000000 3cd2496b 02000000"
    example_notes: "Synthetic: version 3, battery 87 %, documentation-range MAC, invented auth code, firmware 39, unknown word 33, clock 1800000060, 2 records."
  AriaUploadRecord:
    description: >
      One 32-byte weigh-in, repeated record_count times starting at byte 46
      of the upload body. Offsets are relative to the start of the record.
    fields:
      - {name: "record_constant", offset: 0, length: 4, type: "uint32", endianness: "little", constant: 2, meaning_unknown: true, verification: "reported", description: "Always 2, in version 2 as well. Possibly a record-format number; that reading is a guess."}
      - {name: "impedance", offset: 4, length: 4, type: "uint32", endianness: "little", verification: "reported", description: "Bio-impedance reading, raw. The unit is not confirmed: reported values (476; 532 and 555 with a person on the scale) are typical foot-to-foot figures in ohms, and one code comment says ohms, but nobody has checked. Whether guests get a non-zero value is open; accept either."}
      - {name: "weight", offset: 8, length: 4, type: "uint32", endianness: "little", unit: "g", verification: "reported", description: "Body weight in grams."}
      - {name: "measured_at", offset: 12, length: 4, type: "uint32", endianness: "little", unit: "s", verification: "reported", description: "Time of the weigh-in by the SCALE's clock, Unix epoch seconds. Re-base it with protocol_details.upload_server.clock before storing."}
      - {name: "user_id", offset: 16, length: 4, type: "uint32", endianness: "little", values: {0: "guest"}, verification: "reported", description: "0 for an unrecognised person. Otherwise the id from a user record of the last accepted reply, echoed unchanged."}
      - {name: "body_fat", offset: 20, length: 4, type: "uint32", endianness: "little", unit: "%", scale: 0.001, verification: "reported", description: "The body-fat figure the display showed, in thousandths of a percent (22500 is 22.5 %). 0 for guests. Reported on firmware 35; a 2012 write-up of version 2 firmware words the scale differently."}
      - {name: "covariance", offset: 24, length: 4, type: "float32", endianness: "little", meaning_unknown: true, verification: "reported", description: "IEEE-754 single. Called a covariance by the sources; meaning unknown. About 0.57 in one capture; 0 for guests. Store it, do not interpret it."}
      - {name: "body_fat_2", offset: 28, length: 4, type: "uint32", endianness: "little", meaning_unknown: true, verification: "reported", description: "A second body-fat figure, reported as higher than body_fat and presumably on the same scale; which of a filtered and a raw value it is has not been established. 0 for guests. Use body_fat."}
    parse_rules:
      - "Do not rely on record order. One source says newest first and then older ones oldest first; another says real uploads do not bear that out. Sort by measured_at."
      - "The scale re-sends records it believes undelivered. De-duplicate on (mac, measured_at, weight) as received."
      - "A guest record has user_id 0 and zero in body_fat, covariance and body_fat_2."
    example: "02000000 f4010000 80380100 00d2496b 01000000 e4570000 0000003f 3c5a0000"
    example_notes: "Synthetic: impedance 500, 80000 g, time 1800000000, user 1, body fat 22.500 %, covariance 0.5, second figure 23100."
  AriaUploadRequestTrailer:
    description: >
      Last two bytes of the upload body, at offset 46 + 32 * record_count.
    fields:
      - {name: "crc", offset: 0, length: 2, type: "uint16", endianness: "little", verification: "reported", description: "CRC-16/XMODEM over every preceding byte of the body, low byte first. Parameters in protocol_details.upload_server.crc."}
    example: "771c"
    example_notes: "CRC value 0x1c77 of the synthetic two-record request."
  AriaUploadReplyHeader:
    description: >
      First 11 bytes of the body the SERVER returns to POST /scale/upload.
      Offsets are relative to the start of the reply body.
    fields:
      - {name: "server_time", offset: 0, length: 4, type: "uint32", endianness: "little", unit: "s", verification: "reported", description: "The server's current time, Unix epoch seconds. The scale sets its clock from it."}
      - {name: "display_unit", offset: 4, length: 1, type: "uint8", values: {0: "lb", 1: "st", 2: "kg"}, verification: "reported", description: "Unit the scale's display uses from now on: pounds, stone or kilograms. The server decides, so send the unit the household wants; two public servers hard-code pounds."}
      - {name: "status", offset: 5, length: 1, type: "uint8", values: {50: "configured", 100: "unconfigured"}, server_sends: 50, verification: "reported", description: "Send 50 (0x32); it is what the vendor and every local server send. 100 (0x64) was described once in 2012 as unconfigured with no users yet and has not been seen since; its effect is unknown."}
      - {name: "unknown_6", offset: 6, length: 1, type: "uint8", constant: 1, meaning_unknown: true, verification: "reported", description: "Always 1 in version 3; the byte does not exist in version 2."}
      - {name: "user_count", offset: 7, length: 4, type: "uint32", endianness: "little", verification: "reported", description: "Number of 77-byte user records that follow. 1 and 2 are hardware-reported from local servers; 0 is reported accepted once; the vendor's limit was 8."}
    example: "41d2496b 02 32 01 01000000"
    example_notes: "Synthetic: time 1800000065, kilograms, configured, constant, one user."
  AriaUploadReplyUser:
    description: >
      One 77-byte user record, repeated user_count times starting at byte 11
      of the reply. The record is PACKED: height starts one byte after the
      one-byte sex field, with no padding. Offsets are relative to the start
      of the record.
    fields:
      - {name: "user_id", offset: 0, length: 4, type: "uint32", endianness: "little", verification: "reported", description: "Any non-zero value that stays the same for the same person. The scale echoes it in that person's records. 0 is reserved for guests."}
      - {name: "reserved_zero", offset: 4, length: 16, type: "bytes", min_length: 16, max_length: 16, constant: "00000000000000000000000000000000", meaning_unknown: true, verification: "reported", description: "Sixteen zero bytes from the vendor and from every local server."}
      - {name: "name", offset: 20, length: 20, type: "string", encoding: "ascii", pad_byte: 32, truncate_to_bytes: 20, verification: "reported", description: "Display name, exactly 20 bytes: upper-case ASCII padded on the right with spaces, as the vendor sent it. Cut a longer name to 20 bytes before padding and replace anything outside ASCII; two public servers upper-case and truncate, and one refuses accented names. The scale is reported to show only the first three characters, as initials. One server pads with NUL bytes instead of spaces (author-reported on firmware 37); what the display then shows is not reported."}
      - {name: "weight_min", offset: 40, length: 4, type: "uint32", endianness: "little", unit: "g", verification: "reported", description: "Lower bound of this user's recognition window, absolute grams."}
      - {name: "weight_max", offset: 44, length: 4, type: "uint32", endianness: "little", unit: "g", verification: "reported", description: "Upper bound of this user's recognition window, absolute grams."}
      - {name: "age", offset: 48, length: 4, type: "uint32", endianness: "little", unit: "years", verification: "reported", description: "Age in whole years."}
      - name: "sex"
        offset: 52
        length: 1
        type: "uint8"
        values: {0: "female", 2: "male"}
        other_values_seen: [52, 54]
        verification: "reported"
        description: >-
          Send 0 (0x00) for female or 2 (0x02) for male; that is what the
          local servers with hardware reports send. The vendor's own replies
          carried other values: 0x34 in a 2014 capture and 0x36 in 20 of 20
          replies of a public 2016 capture set, so a parser must accept any
          value. What those values mean is unsettled; the two readings are
          in protocol_details.upload_server.users.sex_byte.
      - {name: "height", offset: 53, length: 4, type: "uint32", endianness: "little", unit: "mm", verification: "reported", description: "Height in millimetres. Unaligned: it follows the one-byte sex field directly."}
      - {name: "unknown_57", offset: 57, length: 4, type: "uint32", endianness: "little", constant: 0, meaning_unknown: true, verification: "reported", description: "Described once, in 2012, as some weight or 0. The vendor sent 0 (a 2014 capture; 20 of 20 replies in 2016) and so does every local server."}
      - {name: "last_body_fat", offset: 61, length: 4, type: "uint32", endianness: "little", unit: "%", scale: 0.001, server_sends: 0, verification: "reported", description: "The vendor sent the user's previous body-fat figure in thousandths of a percent (non-zero in 20 of 20 replies in 2016). Local servers send 0 and recognition is reported to work regardless."}
      - {name: "last_covariance", offset: 65, length: 4, type: "float32", endianness: "little", server_sends: 0, meaning_unknown: true, verification: "reported", description: "IEEE-754 single. The vendor sent a previous covariance value in a 2014 capture (about 0.78) and zero in 20 of 20 replies in 2016. Local servers send 0."}
      - {name: "last_weight", offset: 69, length: 4, type: "uint32", endianness: "little", unit: "g", server_sends: 0, verification: "reported", description: "The vendor sent the user's previous weight in grams; in 20 of 20 replies in 2016 it was exactly the centre of the weight window. Local servers send 0."}
      - {name: "last_weight_time", offset: 73, length: 4, type: "uint32", endianness: "little", unit: "s", server_sends: 0, verification: "reported", description: "The vendor sent the server-clock time of the previous weight, Unix epoch seconds. helvetic and the PHP server send 0; the ESP32 port sends the scale's own clock minus 1000 seconds."}
    parse_rules:
      - "The scale, not the server, decides whose reading it is: it compares the weight in grams with each stored user's weight_min and weight_max and labels the reading a guest when none matches."
      - "Keep windows from overlapping. The vendor used 4000 g either side of the last weight; when two users are within 8 lb the scale asks which one, showing initials."
      - "helvetic sends zero in the four last_ fields (firmware 35; 37 and 39 by one contributor). The ESP32 port sends zero in three of them and the scale's own clock minus 1000 seconds in last_weight_time (author-reported, firmware 37). Whether a scale accepts real previous values from a local server is unverified."
      - "When parsing a saved vendor reply, accept any value in the sex byte and non-zero values in the last_ fields."
    example: "01000000 00000000000000000000000000000000 4142432020202020202020202020202020202020 e0280100 20480100 28000000 02 d6060000 00000000 00000000 00000000 00000000 00000000"
    example_notes: "Synthetic: id 1, name ABC, window 76000 to 84000 g, age 40, male, 1750 mm, five zero words."
  AriaUploadReplyTail:
    description: >
      Twelve bytes, once, straight after the last user record, at offset
      11 + 77 * user_count of the reply. Three 32-bit words. One of the
      first two is the firmware-update status; which one is not settled
      (protocol_details.upload_server.firmware_update_refusal). The words
      are therefore named by position, not by meaning.
    fields:
      - {name: "tail_word_0", offset: 0, length: 4, type: "uint32", endianness: "little", server_sends: 0, values_seen: [0, 3], never_send: [1], meaning_unknown: true, verification: "reported", description: "Send 0. The vendor sent 0, and so do helvetic, its test server, the ESP32 port and the PHP server. aria-bridge sends 3 here and its author describes the reply as accepted (firmware 39, a code comment). helvetic's notes place the update status in this word. NEVER 1."}
      - {name: "tail_word_1", offset: 4, length: 4, type: "uint32", endianness: "little", server_sends: 3, values_seen: [0, 3], never_send: [1], meaning_unknown: true, verification: "reported", description: "Send 3. Every local server sends 3 here and is reported accepted on firmware 35 and 37 (39 by one contributor); helvetic's code labels this word the update status with 3 meaning no update. The vendor's own server sent 0 here (20 of 20 replies in 2016; twelve NUL bytes per a 2015 write-up). NEVER 1."}
      - {name: "tail_word_2", offset: 8, length: 4, type: "uint32", endianness: "little", server_sends: 0, values_seen: [0], never_send: [1], meaning_unknown: true, verification: "reported", description: "Send 0. Nothing else has been seen. NEVER 1."}
    parse_rules:
      - "A server writes exactly these twelve bytes and nothing after them but the CRC and the length. The reported update form adds bytes here; it is not documented in this file and must never be sent."
      - "A parser of saved replies accepts 0 or 3 in the first two words. Any other value, 1 in particular, or a reply longer than 27 + 77 * user_count bytes, is the update form or something unknown: stop and do not replay it to a scale."
      - "A relay applies the same rule to every live vendor reply before handing it to the scale (protocol_details.local_routes, pass_through_relay.relay_rules)."
    example: "00000000 03000000 00000000"
    example_notes: "The recommended tail, 0, 3, 0: what helvetic, its test server and the ESP32 port send. aria-bridge sends 3, 3, 0 and the vendor sent 0, 0, 0."
  AriaUploadReplyTrailer:
    description: >
      Last four bytes of the reply, at offset 23 + 77 * user_count.
    fields:
      - {name: "crc", offset: 0, length: 2, type: "uint16", endianness: "little", verification: "reported", description: "CRC-16/XMODEM over the reply header, every user record and the 12-byte tail, low byte first. It does not cover itself or the length that follows."}
      - {name: "length", offset: 2, length: 2, type: "uint16", endianness: "little", unit: "bytes", verification: "reported", description: "Byte count of everything before this field, the CRC included: 25 + 77 * user_count (0x19 + 0x4d per user). From the vendor, 0x0066 for one user (a 2014 capture; 20 of 20 replies in 2016) and 0x00b3 for two (one contributor) were seen. Whether the scale checks it is unknown: one server sends 0x66 with zero users and its author describes the reply as accepted. Compute it correctly."}
    example: "56fe 6600"
    example_notes: "CRC value 0xfe56 and length 102 of the synthetic one-user reply."

protocol_details:
  upload_server:
    role: "Scale-to-owner-server interoperability; NOT scale-local HTTP control"
    direction: "scale_initiates_http_to_owner_server"
    server: "An owner-operated HTTP server on the LAN, reached because a DNS override answers the vendor hostname with its address"
    executable: false
    declared_as_device_local_control: false
    protocol_version: 3
    firmware_coverage:
      upload_exchange_reported_on: [35, 37, 39]
      local_provisioning_hardware_demonstrated_on: [35]
      local_provisioning_author_reported_on: [37]
      provisioning_request_accepted_on: [39]
      unexplained_failure_report_on: [38]
      registration_sequence_captured_against_vendor_on: [35, 37]
      notes: >
        Numbers are the application firmware shown on the display at
        power-up (V35, V39). Firmware 38 appears in one report only, the
        failure. On 39 the provisioning request returned 200 but no public
        log shows the scale joining afterwards. The first firmware to speak
        version 3 is not known.
    listen:
      scheme: "http"
      tls: false
      transport: "tcp"
      port: 80
      host_header_sent_by_scale: "www.fitbit.com"
      accept_any_host_header: true
      notes: >
        The scale's Wi-Fi is reported to be up only while it is calling out,
        so the server must be reachable whenever someone steps on the scale.
        No inbound service on the home LAN has been reported, and none has
        been tested for.
    dns_override:
      name: "www.fitbit.com"
      action: "redirect"
      record_type: "A"
      target: "The owner's server address on the LAN. Examples in this project use the placeholder 192.168.1.50."
      match: "this one name exactly; not fitbit.com and not a wildcard"
      who_should_not_add_it: >
        An owner whose scale still syncs to a Fitbit / Google account and
        who wants to keep that. The scale talks to one server only: with the
        override in place nothing reaches the vendor, and readings the local
        server accepts never reach the account. That owner does nothing, or
        runs a pass-through relay (protocol_details.local_routes).
      scope: >
        The scale only, where the network allows it. Phones and browsers on
        the same network look this name up too; a network-wide record sends
        them to the owner's server, where they fail. One 2026 deployment
        that pointed a whole household's resolver at a shared machine
        reports intermittent failures for every device. An Aria 2 on the
        same network may depend on the same name (nobody knows which names
        it resolves), which is one more reason to scope the override to
        this scale.
      resolver_requirement: >
        The override must be served by the DNS resolver named in the scale's
        DHCP lease. No hard-coded resolver or address has been reported: a
        firmware 37 scale sent its one query to the DHCP-supplied resolver
        in 20 of 20 public captures, and deployments on firmware 37 and 39
        rely on the same behaviour.
      takes_effect: >
        Expected at the next weigh-in, with nothing done to the scale: it is
        seen looking the name up at the start of a session (one query per
        session in 20 public captures, firmware 37), and a firmware 39
        serial log shows it restarting on every wake. One how-to says a
        power cycle makes the scale pick up a changed answer (firmware 39,
        no log); nothing shows that it is needed. Do NOT pull a battery on a
        working scale for this: a battery pull opens the TAP TO CHANGE
        prompt, and a press or a step during that prompt enters setup mode,
        which is to be assumed to discard the stored network.
      reported_working:
        - "dnsmasq with an address entry for the name, or a hosts-file entry on a dnsmasq box that the router hands out as DNS server (firmware 39)"
        - "Pi-hole local DNS record, with Pi-hole handed out by DHCP"
        - "An ESP32 access point answering every DNS query with its own address (author-reported, firmware 37)"
      disputed:
        - "A UniFi gateway's built-in local DNS record: one owner reports it did not override a name that has a real public answer (2026); another reports a UniFi redirect working (2024)."
      examples:
        dnsmasq_exact_name: "host-record=www.fitbit.com,192.168.1.50"
        dnsmasq_name_and_everything_under_it: "address=/www.fitbit.com/192.168.1.50"
        hosts_file_line: "192.168.1.50 www.fitbit.com"
      scale_only_example:
        dnsmasq_dhcp: "dhcp-host=00:00:5e:00:53:01,set:aria  and  dhcp-option=tag:aria,option:dns-server,192.168.1.51"
        placeholders: "192.168.1.50 is the owner's HTTP server. 192.168.1.51 is a resolver that carries the www.fitbit.com record above and forwards every other name; it may be the same machine as the server, but whatever address is handed out as DNS server must actually run a resolver. The MAC is the documentation-range placeholder; use the one on the scale's label."
        evidence: "Ordinary dnsmasq configuration. Inferred to work because the scale uses the resolver its lease names; no source reports this exact form with the scale."
      check: >
        From a second device that uses the same resolver, look the name up
        and expect the server's address; a lookup run on the DNS box itself
        can pass falsely. Then request http://www.fitbit.com/scale/validate
        from that device with curl or another plain-HTTP client, not a
        browser: the vendor's name sends an HTTPS-only policy, so a browser
        that has visited it upgrades the request and fails against a port-80
        server. The owner's server answers `T`, while the vendor answered
        `F` to the same bare request on 2026-11-23 and 2026-11-24.
      variants: "Per-device DHCP resolver, destination NAT, a dedicated access point or travel router, and an all-in-one ESP32 are rated in protocol_details.local_routes. The last two put the scale on a different network, and a scale that is already joined can only be moved through setup mode, which is a one-way door."
      verification: "reported"
    routes:
      - name: "register"
        method: "GET"
        path: "/scale/register"
        sent_when: "Right after the scale joins Wi-Fi at the end of setup. Whether it is repeated on later joins is not established."
        query_parameters:
          - {name: "serialNumber", required: true, format: "12 upper-case hexadecimal digits, no separators", meaning: "The scale's MAC address. NOT the 16-digit serial printed on the label."}
          - {name: "token", required: true, format: "opaque string; reported to be at most 31 characters as the scale sends it (a third party's reading of firmware images, not tested)", meaning: "The token from the provisioning cookie, echoed; a server must not depend on its length."}
          - {name: "ssid", required: true, format: "string", meaning: "The name of the network the scale was told to join."}
        request_headers_observed:
          firmware: [37]
          http_version: "HTTP/1.1"
          header_names: ["Host"]
          host_value: "www.fitbit.com"
          basis: "20 of 20 public captures, one unit, against the vendor: a request line and a Host header, nothing else. Not shown for other firmware."
        reply:
          status: 200
          body_hex: ""
          required_headers: {"Content-Length": "0"}
          vendor_content_type: "text/plain;charset=UTF-8"
          vendor_reply_observed: "HTTP/1.1 200 with Content-Length: 0 and Connection: keep-alive (a 2014 capture; 20 of 20 public captures from 2016)."
        server_action: "Log serialNumber, token and ssid. Nothing needs to be stored for the scale to proceed."
        safe_binding: false
        verification: "reported"
        basis: "2014 capture against the vendor on firmware 35; helvetic protocol.md; 20 public captures against the vendor on firmware 37 (2016); reported from firmware 37 and 39 by a helvetic contributor in 2017. No published log of it arriving at a local server."
      - name: "validate"
        method: "GET"
        path: "/scale/validate"
        sent_when: "0.2 to 0.4 seconds after register and on the same TCP connection (20 of 20 public captures, firmware 37, the vendor answering keep-alive); about one second after register in a 2014 capture (firmware 35)."
        query_parameters:
          - {name: "serialNumber", required: true, format: "12 upper-case hexadecimal digits, no separators", meaning: "Same value as in register."}
          - {name: "token", required: true, format: "opaque string; reported to be at most 31 characters as the scale sends it (a third party's reading of firmware images, not tested)", meaning: "Same value as in register."}
        request_headers_observed:
          firmware: [37]
          http_version: "HTTP/1.1"
          header_names: ["Host"]
          host_value: "www.fitbit.com"
          basis: "20 of 20 public captures, one unit, against the vendor. Not shown for other firmware."
        reply:
          status: 200
          body_ascii: "T"
          body_hex: "54"
          recommended_headers: {"Content-Length": "1"}
          vendor_content_type: "text/plain;charset=UTF-8"
          framing_observed_from_vendor:
            - "Content-Length: 1 (2014 capture, firmware 35)."
            - "Transfer-Encoding: chunked with a single one-byte chunk and no Content-Length (20 of 20 public captures, 2016, firmware 37). The scale went on to upload each time."
          never_send: "F (the vendor's answer when a parameter did not match; its effect on the scale is unknown)"
        server_action: "Answer T unconditionally."
        safe_binding: false
        verification: "reported"
        basis: "2014 capture against the vendor on firmware 35; 20 public captures against the vendor on firmware 37; helvetic answers T unconditionally since 2017 after a contributor saw firmware 37 and 39 call it. Two 2026 servers have no such route and still receive uploads from already-configured scales; what a freshly set-up scale does without it is unknown."
      - name: "upload"
        method: "POST"
        path: "/scale/upload"
        sent_when: "About 20 seconds after a weigh-in (one capture). At the end of setup, a zero-record upload 0.2 to 0.3 seconds after validate on a NEW TCP connection (20 of 20 public captures, firmware 37). Reportedly also about once a day with zero records."
        request_headers_observed:
          firmware: [35, 37]
          lines:
            - "POST /scale/upload HTTP/1.1"
            - "Content-Length: 80"
            - "Connection: keep-alive"
            - "Content-Type: application/x-www-form-urlencoded"
            - "Host: www.fitbit.com"
          header_block_bytes: 146
          notes: >
            The firmware 35 capture's header block is exactly 146 bytes,
            which is these five lines with CRLF line ends plus the blank
            line, for a one-record body of 80 bytes. Firmware 37 sends the
            same four headers in the same order (20 of 20 public captures,
            there with Content-Length: 48 for a zero-record body, which is
            again 146 bytes). So neither sends a User-Agent or any other
            header. Not checked on firmware 38 or 39.
        request_body: "Binary despite the declared form content type: payload_formats.AriaUploadRequestHeader, then record_count times payload_formats.AriaUploadRecord, then payload_formats.AriaUploadRequestTrailer."
        reply:
          status: 200
          body: "payload_formats.AriaUploadReplyHeader, then user_count times payload_formats.AriaUploadReplyUser, then payload_formats.AriaUploadReplyTail, then payload_formats.AriaUploadReplyTrailer."
          required_headers: {"Content-Length": "exact body length in bytes (27 + 77 * user_count)"}
          recommended_headers: {"Content-Type": "application/octet-stream"}
          vendor_reply_observed: "HTTP/1.1 200 with Content-Length: 104, Connection: keep-alive and Content-Type: application/octet-stream;charset=UTF-8 (20 of 20 public captures from 2016, one user)."
        safe_binding: false
        verification: "reported"
        basis: "2014 capture tables (firmware 35); 20 public captures against the vendor (firmware 37, zero-record uploads); helvetic's code and test server (35; 37 and 39 by a contributor); the ESP32 port (37); aria-spoof (39); aria-bridge (39); a PHP server. All agree on the request; the reply follows the three servers that share one layout, and real vendor replies parse cleanly at the same offsets."
    messages:
      byte_order: "little"
      upload_request:
        sections:
          - {format: "AriaUploadRequestHeader", offset: 0, length: 46, repeat: "once"}
          - {format: "AriaUploadRecord", offset: 46, length: 32, repeat: "record_count"}
          - {format: "AriaUploadRequestTrailer", offset_base: 46, offset_per_record: 32, length: 2, repeat: "once"}
        total_length: {base: 48, per_record: 32}
        total_length_formula: "48 + 32 * record_count"
        crc_covers: "bytes 0 to 45 + 32 * record_count: everything before the two CRC bytes"
        record_count_range_seen: {min: 0, max: 17}
        validation:
          min_length: 48
          record_length: 32
          required_protocol_version: 3
          record_count_must_equal: "(length - 48) / 32"
          on_crc_mismatch: "log it; answering 400 is optional (one public server does)"
          on_malformed_upload:
            status: 400
            applies_to: "a body shorter than 48 bytes, a length that is not 48 plus a multiple of 32, a protocol version other than 3, or a record count that does not match the length"
            body: "none; never a binary reply"
            basis: "What public servers do: helvetic answers 400 to a wrong version or a truncated record, the ESP32 port to a body too short for the header, aria-bridge to anything it cannot parse, and the PHP server to a short body, a wrong version or a CRC mismatch."
            consequence: "The scale treats anything but an accepted reply as not delivered, shows NO SYNC and sends the same records again, so answer 400 only to a body that really is malformed."
      upload_reply:
        sections:
          - {format: "AriaUploadReplyHeader", offset: 0, length: 11, repeat: "once"}
          - {format: "AriaUploadReplyUser", offset: 11, length: 77, repeat: "user_count"}
          - {format: "AriaUploadReplyTail", offset_base: 11, offset_per_user: 77, length: 12, repeat: "once"}
          - {format: "AriaUploadReplyTrailer", offset_base: 23, offset_per_user: 77, length: 4, repeat: "once"}
        total_length: {base: 27, per_user: 77}
        total_length_formula: "27 + 77 * user_count"
        length_field: {base: 25, per_user: 77}
        length_field_formula: "25 + 77 * user_count (0x19 + 0x4d * user_count); counts header, users, tail and CRC, not itself"
        crc_covers: "bytes 0 to 22 + 77 * user_count: header, user records and tail; not the CRC, not the length field"
      size_examples:
        request_bytes_by_record_count: {"0": 48, "1": 80, "2": 112, "16": 560, "17": 592}
        reply_bytes_by_user_count: {"0": 27, "1": 104, "2": 181, "8": 643}
        reply_length_field_by_user_count: {"0": 25, "1": 102, "2": 179, "8": 641}
    crc:
      name: "CRC-16/XMODEM"
      also_known_as: ["CRC-16-CCITT (XMODEM variant)", "ZMODEM", "CRC-16/ACORN"]
      width_bits: 16
      polynomial: 4129
      polynomial_hex: "0x1021"
      initial_value: 0
      reflect_input: false
      reflect_output: false
      final_xor: 0
      check_input_ascii: "123456789"
      check_value: 12739
      check_value_hex: "0x31c3"
      wire_byte_order: "little"
      wire_order_note: "Low byte first in both directions: value 0x31c3 goes on the wire as c3 31."
      common_mistake:
        name: "CRC-16/CCITT-FALSE"
        initial_value: 65535
        check_value_hex: "0x29b1"
        note: "Same polynomial, initial value 0xffff. It does not reproduce the trailer of a real upload, and a scale answered NO SYNC to replies computed with it (firmware 39)."
      verification: "reported"
      basis: >
        Request direction: aria-spoof's history records Fitbit's server
        refusing an altered upload with a stale checksum and accepting it
        with a recomputed one (firmware 39, 2018); aria-bridge reports that
        of about 30 CRC-16 variants only this one reproduces a real upload's
        trailer (firmware 39, 2026). Reply direction: helvetic's first test
        reply failed with a random value and worked with this CRC (firmware
        35, 2014); the ESP32 port (firmware 37); aria-bridge (firmware 39).
        Both directions can also be checked on public bytes: in a 2016
        capture set (firmware 37) the trailer of 20 of 20 uploads equals
        this CRC over the preceding bytes and does not match with initial
        value 0xffff, and the trailer of 20 of 20 vendor replies equals this
        CRC over the first 100 bytes.
    http_reply:
      status: 200
      required_headers:
        - name: "Content-Length"
          value: "exact body length"
          applies_to: "the upload reply"
          basis: "helvetic's notes say the header is required (firmware 35); never tested in isolation by anyone. Every working server sends it on the upload reply, and so did the vendor in every reply seen (2014 and 2016)."
      content_type:
        recommended: "application/octet-stream"
        notes: "Working servers send different content types and one leaves its framework's default (an HTML type), so the scale does not appear to check it."
      connection:
        http_version: "HTTP/1.1"
        scale_sends: "Connection: keep-alive on the upload request (firmware 35 and 37); no Connection header on register and validate (firmware 37)."
        observed_with_vendor: "The vendor answered all three requests with Connection: keep-alive. The scale sent validate on the connection that carried register, and opened a second connection for the upload (20 of 20 public captures, firmware 37)."
        local_servers: "No public server sets its connection handling; each leaves it to its framework or web server, and none reports a problem either way."
        guidance: "Be able to answer a second request on the same connection, and do not depend on the scale reusing one. Whether the scale minds a server that closes the connection after each reply is not reported."
        unknown: "Whether the scale ever sends two uploads on one connection, what it does when the server closes after register, and its timeouts."
      never:
        - "a 3xx answer of any kind, for example a web server that upgrades port 80 to HTTPS: the scale is reported to ignore redirects, and it cannot speak TLS"
        - "chunked transfer encoding on the upload reply: never seen there and untested (the vendor did send its one-byte validate reply chunked in 2016, and the scale's own web server gets chunking wrong)"
        - "a non-200 status for a well-formed upload: the scale shows NO SYNC and re-sends its whole backlog every time (the one exception, for a pass-through relay, is under requirements.must_never)"
    users:
      attribution: "Done by the scale: a reading whose weight in grams falls inside a stored user's weight_min to weight_max window is that user's; otherwise it is a guest."
      window:
        vendor_half_width_g: 4000
        vendor_observations: "The last weight minus and plus 4000 g exactly: 8000 g wide and centred on the last_weight field in 20 of 20 replies of a public 2016 capture set (one account); 8000 g wide in a 2014 capture; described in 2012 as last weight plus or minus 4 kg. A 2016 serial log shows a stored window 8060 g wide."
        local_server_choices: "helvetic: last weight rounded down to a whole kilogram, minus and plus 4000 g, never below 0. ESP32 port: the weight just uploaded minus and plus 4000 g. PHP server: last weight rounded down to a whole kilogram, minus and plus 3000 g."
        overlap: "When two users are within 8 lb of each other the scale asks which one, showing initials; the person taps to cycle (vendor manual)."
      first_window:
        question: "What to send for a user who has no weight yet, which is every user of a newly built server."
        rule: "None established. No source says what the vendor sent for a new account, and nobody has compared the choices below on a scale."
        vendor: "unknown"
        known_servers:
          - server: "helvetic (the Django application)"
            sends: "weight_min 0 and weight_max 0 until the user has a stored measurement"
            evidence: "Read from its code. What a scale does with a window of 0 to 0 is not reported. A reading the scale labels a guest is stored with no user, so nothing in the upload path ever gives that user a first measurement."
          - server: "helvetic's test server"
            sends: "a fixed window the operator configures in grams (its defaults are 89000 and 97000)"
            evidence: "Read from its code; the test server is what its author ran against firmware 35."
          - server: "ESP32 port"
            sends: "the weight of the last record in the upload it is answering, minus and plus 4000 g; with a zero-record upload that weight was never set"
            evidence: "Read from its code; author-reported on firmware 37 (one line, no log). One user only, and the window follows whoever weighed last, so the next person of similar weight is recognised as that user."
          - server: "PHP server"
            sends: "an operator-entered starting weight, minus and plus 3000 g, until a first weigh-in exists"
            evidence: "Read from its code and README, which also let a person claim a guest reading afterwards and let the server attribute an unrecognised reading to the nearest user. No hardware statement."
          - server: "aria-bridge"
            sends: "no user records at all; the server sorts readings into people by weight band"
            evidence: "Read from its code; firmware 39, acceptance described in a code comment. The scale then shows weight only."
        consequence_of_no_window: "The scale labels every reading a guest (user id 0) and uploads weight with no body-fat figure. A server that learns weights only from readings already attributed to a user never leaves that state."
        what_a_server_needs: "A first weight per user from somewhere other than the scale's own attribution: a starting weight entered by the operator, or a guest reading the operator assigns to the user. Both exist in public servers; which a scale handles best is not established."
        verification: "reported"
      guest:
        user_id: 0
        display: "GUEST"
        zero_fields: ["body_fat", "covariance", "body_fat_2"]
        uploaded: true
        notes: "Guest readings ARE uploaded, with user id 0, weight only. Whether their impedance word is zero is open."
      name_field: "Upper-case ASCII, space padded to 20 bytes, longer names cut to 20 bytes first; the first three characters are reported to be what the display uses."
      sex_byte:
        settled: false
        server_sends: [0, 2]
        observed_from_vendor: [52, 54]
        readings:
          - id: "enumeration"
            claim: "0x00 is female, 0x02 is male, 0x34 means not set."
            evidence: "helvetic's test server uses these three codes and sends 0x34 when no sex is configured (run by its author on firmware 35). A figure in a 2015 write-up labels the vendor's 0x34 as unset, for a 2014 account its author says he filled with false data."
            problem: "It has no place for the 0x36 the vendor sent in 2016."
          - id: "bit_field"
            claim: "Bit 1 (value 0x02) is the sex bit, set for male. The vendor also set the bits 0x34, whose meaning is unknown."
            evidence: "0x36 is 0x34 with the 0x02 bit set. The vendor sent 0x36 in 20 of 20 replies of a public 2016 capture set (one unit, one account, firmware 37) and 0x34 in the 2014 capture. Local servers that send plain 0x00 or 0x02 are reported working."
            problem: "Neither capture says what sex the account was set to, so the reading cannot be checked from the bytes."
        related_unknown: "The vendor's manual describes a Regular or Lean body-fat mode that reaches the scale at its next sync. No field for it is known. That the vendor's extra bits carry it is a guess nobody has tested, and nobody has compared the scale's body-fat figure between 0x02 and the vendor's values."
        parsing: "Accept any value."
      profile_use: "Age, sex and height are used by the scale to compute body fat. The formula is not published."
      stored_on_scale: "The scale keeps the user records in flash; they were read back after a power loss on one firmware 39 unit."
      counts:
        vendor_limit: 8
        hardware_reported_from_local_servers: [1, 2]
        zero_users: "Reported once (firmware 39, a code comment): the scale keeps weighing and uploading as user 0. What the display shows is not written down."
        more_than_two: "Untested from a local server."
      verification: "reported"
    clock:
      set_by: "server_time of each accepted reply (payload_formats.AriaUploadReplyHeader)"
      after_power_loss: "The scale's clock restarts at a fixed time until the next accepted reply. On firmware 39 that is the firmware build time, 1456758714 (2016-02-29T15:11:54Z). A firmware 37 scale fresh from a hard reset reported a time on the morning of 2014-11-19 in 20 of 20 public captures made in 2016, which fits the same behaviour."
      rebase_formula: "true_time = server_now - (scale_clock - measured_at)"
      rebase_inputs:
        server_now: "the server's clock when the upload arrives, Unix seconds"
        scale_clock: "payload_formats.AriaUploadRequestHeader field scale_clock"
        measured_at: "payload_formats.AriaUploadRecord field measured_at"
      when_measured_at_is_later_than_scale_clock: >
        The formula then gives a time in the future. It can happen when a
        reading was stored before a power loss and uploaded after it. No
        source handles the case: helvetic applies the formula
        unconditionally, and the PHP server shifts times only when the
        scale's clock is more than 120 seconds away from its own. This
        project's suggestion, which is not a device fact: do not re-base
        such a record; keep its raw time and mark it as unplaced.
      notes: >
        Store the re-based time, not the raw one: record times are only as
        good as the scale's clock, and that is wrong after every battery
        change. The same subtraction reproduces the "time of last weight"
        the vendor sent back in a 2014 capture. A record measured before a
        power loss and uploaded after it cannot be re-based reliably; keep
        the raw values alongside.
      verification: "reported"
    delivery:
      upload_delay_after_weigh_in_s: 20
      upload_delay_basis: "One capture: the header clock minus the record time was 20 seconds."
      first_upload_after_setup: "Zero records, straight after validate (20 of 20 public captures, firmware 37, against the vendor)."
      join_attempts_before_storing: 4
      backlog: "Readings that could not be delivered, or whose reply was rejected, are kept and sent again with the next upload."
      max_records_seen_in_one_request: 17
      rejected_reply_behaviour: "While replies were being rejected one scale re-sent its entire backlog on every upload and showed NO SYNC (firmware 39)."
      record_order: "Unsettled; do not rely on it."
      dedup_key: ["mac", "measured_at", "weight"]
      dedup_note: "Compare the values as received. Whether the scale rewrites stored record times when a reply sets its clock is not documented, so keep the raw tuple as the key and the re-based time as data."
      daily_check_in: "A zero-record upload about once a day is reported by one source and implied by the vendor's 2016 remark that updates install overnight. Cadence and content have never been logged. Between uses the scale wakes on a 480-second timer and goes back to standby without using the network."
      success_display: "Progress bar, then a check mark."
      failure_display: "NO SYNC, or a Wi-Fi symbol with an X; the reading is kept."
      verification: "reported"
    firmware_update_refusal:
      in_format: "AriaUploadReplyTail"
      tail_words_to_send: [0, 3, 0]
      tail_words_to_send_basis: "What helvetic, its test server, the ESP32 port and the PHP server send; reported accepted on firmware 35 (helvetic's author), 37 (author-reported) and 37 and 39 (a helvetic contributor). No scale is reported to have attempted an update against any of them."
      other_tails_seen_meaning_no_update:
        - words: [0, 0, 0]
          sender: "Fitbit's own server"
          evidence: "20 of 20 replies in a public 2016 capture set (one unit, firmware 37, reply CRC valid each time); a 2015 write-up of 2014 captures describes the same twelve bytes as NULs (firmware 35). Never reported from a local server."
        - words: [3, 3, 0]
          sender: "aria-bridge"
          evidence: "Read from its code; its author describes the reply as accepted on firmware 39 in a code comment, with zero users and a fixed length field."
      allowed_tail_word_values: [0, 3]
      never_send_in_any_tail_word: [1]
      never_append_bytes: true
      never_serve_path_prefix: "/scale/firmware/"
      status_word:
        settled: false
        readings:
          - position: "tail_word_0"
            evidence: "helvetic's printed notes place the update status straight after the user records, and aria-bridge's code follows that order (it sends 3 there)."
          - position: "tail_word_1"
            evidence: "helvetic's code and the PHP server label the middle word as the update status with 3 meaning none; helvetic's test server calls the same word an unknown that is always 3."
        why_it_does_not_matter_for_a_server: "The vendor sent 0 in both words and local servers send 0 or 3 in both, so 0 and 3 are both observed as 'no update' wherever the status really sits. The one value never to send, 1, is forbidden in every word."
      what_a_server_may_send:
        - "0, 3, 0: the recommended tail. helvetic, its test server and the ESP32 port send it (firmware 35 by helvetic's author; 37 author-reported; 37 and 39 by one helvetic contributor, read through a summarising tool). The PHP server sends it too and makes no hardware statement."
        - "0, 0, 0: what the vendor's own server sent (20 of 20 replies in 2016). Not reported from a local server."
        - "3, 3, 0: what aria-bridge sends; its author describes the reply as accepted on firmware 39 in a code comment. One server, one unit; not the recommendation."
      what_a_server_must_never_send:
        - "1 in any of the three tail words."
        - "Any tail word other than 0 or 3."
        - "Any byte between the tail and the CRC, or after the length field. The update form is reported to append a URL."
        - "Any reply at all to a request under /scale/firmware/."
      reason: >
        The value 1 is reported to announce an update and to be followed by
        a URL from which the scale fetches firmware over plain HTTP. The
        byte layout of that form is unverified, no local server has sent it,
        and nothing is published about how the scale checks an image or
        recovers from a bad one. See protocol_details.firmware_danger.
      verification: "reported"
    requirements:
      must:
        - {id: "listen_plain_http_80", rule: "Listen on TCP 80 with plain HTTP/1.1 and accept any Host header; the scale sends Host: www.fitbit.com."}
        - {id: "answer_register", rule: "Answer GET /scale/register with 200, an empty body and Content-Length: 0."}
        - {id: "answer_validate", rule: "Answer GET /scale/validate with 200 and a body that is the single character T. Content-Length: 1 is recommended; the vendor sent it in 2014 and a chunked body in 2016, and the scale went on to upload after both."}
        - {id: "read_raw_body", rule: "Read the POST /scale/upload body as raw bytes, ignoring the declared form content type."}
        - {id: "validate_request", rule: "Require length >= 48, (length - 48) divisible by 32, protocol version 3 and a record count that matches the length; check the CRC and at least log a mismatch."}
        - {id: "accept_zero_records", rule: "Accept an upload with zero records and answer it like any other; it is the first thing a freshly set-up scale sends."}
        - {id: "rebase_times", rule: "Re-base every record time with the clock formula before storing it."}
        - {id: "deduplicate", rule: "De-duplicate records, because the scale re-sends what it believes undelivered."}
        - {id: "reply_exact_layout", rule: "Reply 200 with Content-Length and exactly: server time, unit, status 0x32, constant 0x01, user count, the user records, tail words 0, 3, 0, CRC-16/XMODEM low byte first, then the 16-bit length; nothing after it."}
        - {id: "user_record_content", rule: "Give each user a stable non-zero id, an upper-case ASCII name space-padded to 20 bytes, an absolute gram window that contains the person's weight (the vendor used the last weight minus and plus 4000 g), age, sex byte 0x00 or 0x02, height in millimetres and five zero trailing words. For a user with no weight yet no rule is established: see users.first_window."}
      should:
        - {id: "malformed_gets_400", rule: "Answer a malformed upload with 400 and no binary reply, as the public servers do."}
        - {id: "second_request_same_connection", rule: "Be able to answer validate on the connection that carried register."}
        - {id: "auth_code_opaque", rule: "Treat auth_code as opaque. Remembering the first value per MAC is optional; do not reject on change by default. It stayed the same across 20 re-setups of one scale against the vendor, but its origin is unknown."}
        - {id: "windows_do_not_overlap", rule: "Keep user weight windows from overlapping."}
        - {id: "log_bytes", rule: "Log the full request and reply bytes privately; the open questions in remaining_unknowns are answerable from such logs."}
        - {id: "override_one_name", rule: "Scope the DNS override to www.fitbit.com only, and to the scale only where possible."}
        - {id: "trusted_lan_only", rule: "Run on a trusted LAN segment and never expose the server to the internet."}
      must_never:
        - {id: "signal_firmware_update", rule: "Never put 1 in ANY of the three tail words, never send a tail word other than 0 or 3, and never add bytes to the reply. Send 0, 3, 0."}
        - {id: "serve_firmware_path", rule: "Never serve anything under /scale/firmware/."}
        - {id: "redirect_to_https", rule: "Never answer with a 3xx status, in particular not an upgrade from port 80 to HTTPS. The scale is reported to ignore redirects and it has no TLS."}
        - {id: "drop_content_length_or_chunk", rule: "Never omit Content-Length or use chunked encoding on the upload reply."}
        - {id: "crc_init_ffff", rule: "Never compute the CRC with an initial value of 0xffff."}
        - {id: "non_200_for_valid_upload", rule: "Never answer a well-formed upload with anything but 200. One exception, for a pass-through relay only: when the vendor fails to answer, or answers in the update form, the relay answers the scale with an error status so that the reading is kept and sent again (protocol_details.local_routes, pass_through_relay.relay_rules)."}
        - {id: "forward_to_vendor_by_default", rule: "Never forward uploads to the vendor unless the owner explicitly chose a relay; other household members' and guests' readings are in the same request."}
        - {id: "relay_hands_on_update_form", rule: "A relay never hands a vendor reply in the update form to the scale (1 in a tail word, a tail word other than 0 or 3, or extra bytes) and never answers or forwards a request under /scale/firmware/. This project's inference, untested."}
        - {id: "publish_identifiers", rule: "Never publish, or write to shared logs, a real unit's MAC, auth_code, token, network name or user ids."}
    trust_boundary: >
      Plain HTTP with no server authentication. Anything that answers the
      name on the scale's network receives body-weight data and controls the
      scale's clock, unit, user list and update signal. Keep the override
      and the server on a trusted LAN segment.
    test_vectors:
      description: >
        SYNTHETIC. Every value is invented: documentation-range MAC
        00:00:5e:00:53:01 (RFC 7042), a made-up auth code, round timestamps,
        made-up body values. Built from the tables in payload_formats and
        the CRC parameters above; never sent to a scale. They show that the
        layouts, sizes, length formulas and CRC parameters in this file are
        mutually consistent, nothing more. scripts/test_fitbit_aria_wifi_scale_spec.py
        rebuilds each one from the tables and compares byte for byte. Reply
        vectors carry `sender`: `local_server` vectors are what a server
        built from this file sends; the one `vendor_form` vector has the
        shape of what Fitbit's server sent, for parsers and relays, and is
        not something a local server is told to send.
      crc_check:
        input_ascii: "123456789"
        value_hex: "0x31c3"
        wire_hex: "c331"
      upload_request_two_records:
        note: "A recognised user's reading and an older cached guest reading. The guest's impedance of 480 is arbitrary, because whether guests upload a non-zero impedance is an open question."
        content_length: 112
        hex: >-
          030000005700000000005e005301a0a1a2a3a4a5a6a7a8a9aaabacadaeaf27000000210000003cd2496b02000000
          02000000f40100008038010000d2496b01000000e45700000000003f3c5a0000
          02000000e001000010ef0000f0aa496b00000000000000000000000000000000
          771c
        decoded:
          header: {protocol_version: 3, battery_percent: 87, mac: "00005e005301", auth_code: "a0a1a2a3a4a5a6a7a8a9aaabacadaeaf", firmware_version: 39, unknown_34: 33, scale_clock: 1800000060, record_count: 2}
          records:
            - {record_constant: 2, impedance: 500, weight: 80000, measured_at: 1800000000, user_id: 1, body_fat: 22500, covariance: 0.5, body_fat_2: 23100}
            - {record_constant: 2, impedance: 480, weight: 61200, measured_at: 1799990000, user_id: 0, body_fat: 0, covariance: 0.0, body_fat_2: 0}
          crc: 7287
          crc_hex: "0x1c77"
        derived:
          mac_text: "00:00:5e:00:53:01"
          register_serial_number: "00005E005301"
          setup_ssid: "Aria 005301"
          dhcp_host_name: "GainSpan005301"
          body_fat_percent: [22.5, 0.0]
          guest: [false, true]
          record_age_s: [60, 10060]
          server_now: 1800000065
          rebased_measured_at: [1800000005, 1799990005]
          wrong_crc_with_initial_value_ffff_hex: "0x753f"
      upload_request_no_records:
        note: "The zero-record upload a freshly set-up scale sends after validate, and reportedly the daily check-in."
        content_length: 48
        hex: >-
          030000005700000000005e005301a0a1a2a3a4a5a6a7a8a9aaabacadaeaf27000000210000003cd2496b00000000
          55c4
        decoded:
          header: {protocol_version: 3, battery_percent: 87, mac: "00005e005301", auth_code: "a0a1a2a3a4a5a6a7a8a9aaabacadaeaf", firmware_version: 39, unknown_34: 33, scale_clock: 1800000060, record_count: 0}
          records: []
          crc: 50261
          crc_hex: "0xc455"
      upload_reply_one_user:
        sender: "local_server"
        note: "The reply to the two-record request above: kilograms, one user whose window is 4000 g either side of 80000 g, and no firmware update."
        content_length: 104
        hex: >-
          41d2496b02320101000000
          01000000000000000000000000000000000000004142432020202020202020202020202020202020
          e0280100204801002800000002d60600000000000000000000000000000000000000000000
          000000000300000000000000
          56fe6600
        decoded:
          header: {server_time: 1800000065, display_unit: "kg", status: "configured", unknown_6: 1, user_count: 1}
          users:
            - {user_id: 1, reserved_zero: "00000000000000000000000000000000", name: "ABC", weight_min: 76000, weight_max: 84000, age: 40, sex: "male", height: 1750, unknown_57: 0, last_body_fat: 0, last_covariance: 0.0, last_weight: 0, last_weight_time: 0}
          tail: {tail_word_0: 0, tail_word_1: 3, tail_word_2: 0}
          crc: 65110
          crc_hex: "0xfe56"
          length: 102
        derived:
          wrong_crc_with_initial_value_ffff_hex: "0xb862"
      upload_reply_no_users:
        sender: "local_server"
        note: "The shortest legal reply. Acceptance of a zero-user reply is reported once and thinly."
        content_length: 27
        hex: >-
          41d2496b02320100000000
          000000000300000000000000
          50a71900
        decoded:
          header: {server_time: 1800000065, display_unit: "kg", status: "configured", unknown_6: 1, user_count: 0}
          users: []
          tail: {tail_word_0: 0, tail_word_1: 3, tail_word_2: 0}
          crc: 42832
          crc_hex: "0xa750"
          length: 25
      upload_reply_two_users:
        sender: "local_server"
        note: "Two users and pounds, to exercise the per-user length term (the length bytes b3 00 are what the vendor sent for two users)."
        content_length: 181
        hex: >-
          41d2496b00320102000000
          01000000000000000000000000000000000000004142432020202020202020202020202020202020
          e0280100204801002800000002d60600000000000000000000000000000000000000000000
          020000000000000000000000000000000000000058595a2020202020202020202020202020202020
          a8de0000e8fd00002300000000720600000000000000000000000000000000000000000000
          000000000300000000000000
          4b35b300
        decoded:
          header: {server_time: 1800000065, display_unit: "lb", status: "configured", unknown_6: 1, user_count: 2}
          users:
            - {user_id: 1, reserved_zero: "00000000000000000000000000000000", name: "ABC", weight_min: 76000, weight_max: 84000, age: 40, sex: "male", height: 1750, unknown_57: 0, last_body_fat: 0, last_covariance: 0.0, last_weight: 0, last_weight_time: 0}
            - {user_id: 2, reserved_zero: "00000000000000000000000000000000", name: "XYZ", weight_min: 57000, weight_max: 65000, age: 35, sex: "female", height: 1650, unknown_57: 0, last_body_fat: 0, last_covariance: 0.0, last_weight: 0, last_weight_time: 0}
          tail: {tail_word_0: 0, tail_word_1: 3, tail_word_2: 0}
          crc: 13643
          crc_hex: "0x354b"
          length: 179
      vendor_form_reply_one_user:
        sender: "vendor_form"
        note: >-
          FOR PARSERS AND RELAYS ONLY. The shape of what Fitbit's server
          sent in a public 2016 capture set, with invented values: the sex
          byte 0x36, non-zero previous body fat, weight and time, a window
          of exactly 4000 g either side of the previous weight, and the tail
          0, 0, 0. The covariance of 0.5 is there to pin the float field;
          the 2016 replies carried zero in it. Whether a scale accepts this
          from a local server is not reported.
        content_length: 104
        hex: >-
          41d2496b02320101000000
          01000000000000000000000000000000000000004142432020202020202020202020202020202020
