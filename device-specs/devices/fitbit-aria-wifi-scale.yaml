  - title: "Google Health help: How do I use my Fitbit scale?"
    url: "https://support.google.com/googlehealth/answer/14236805"
    kind: "vendor_support"
    description: >
      Carries the notice that Aria and Aria 2 can no longer be paired or
      re-paired (it gives 2026-11-09 as read on 2026-11-24; it gave
      2026-11-28 until 2026-11-23) and the display-message table. It also
      still prints reconnect steps that must NOT be followed for this
      model: they begin with a battery pull and the corner press, which is
      the one-way door, and they end at the dead web page. Covers Aria (four
      AA cells), Aria 2 and Aria Air; this spec is the four-AA model only.
      Returned 200 on 2026-11-24.
  - title: "Google Health help: Set up your Fitbit device"
    url: "https://support.google.com/googlehealth/answer/14236818"
    kind: "vendor_support"
    description: >
      Router requirements for the original Aria (802.11b, personal security
      modes, DHCP, 31-character passphrase limit, letters and digits
      advised). Its setup steps for this model point at the dead web page.
      Returned 200 on 2026-11-24.
  - title: "Google Health help: How do I erase my Fitbit device?"
    url: "https://support.google.com/googlehealth/answer/14236515"
    kind: "vendor_support"
    description: >
      The vendor's battery-removal "erase" instruction for the original
      Aria. What it erases is not established: a third-party log shows
      users and the network name still present afterwards. Returned 200 on
      2026-11-24.
  - title: "Google Health help: How do I export my Google Health data?"
    url: "https://support.google.com/googlehealth/answer/14236615"
    kind: "vendor_support"
    description: >
      The vendor's export instructions, for owners of an original Aria who
      want their weight history out of the account while it is still
      there. Returned 200 on 2026-11-24.
  - title: "helvetic — protocol notes"
    url: "https://github.com/micolous/helvetic/blob/master/protocol.md"
    kind: "protocol_writeup"
    description: >
      The primary community write-up: setup request, registration and the
      upload request. Do not use its reply structures; read the code
      instead. AGPL-3.0.
  - title: "helvetic — server code and test server"
    url: "https://github.com/micolous/helvetic"
    kind: "implementation"
    description: >
      Django application and a small test server, run by its author on
      firmware 35 and by a contributor on 37 and 39. The reply layout in
      this spec follows this code. AGPL-3.0; last commit 2018.
  - title: "helvetic ESP32 port"
    url: "https://github.com/tao-j/helvetic/tree/master/esp32"
    kind: "implementation"
    description: >
      An ESP32 that is access point, DNS and upload server in one. Its
      README says in one line that it was tested on firmware 37; there is
      no log. It sets pounds and knows one user.
  - title: "aria-bridge"
    url: "https://github.com/ty-machine/aria-bridge"
    kind: "implementation"
    description: >
      2026 Python interceptor for an FB201B on firmware 39, with a script
      that sends the setup request and copes with the scale's malformed
      reply, and notes on DNS overrides. MIT. Its reply tail differs from
      this spec.
  - title: "fitbit-aria-php-server"
    url: "https://github.com/m322345/fitbit-aria-php-server"
    kind: "implementation"
    description: >
      2026 PHP upload server with multiple users, starting weights and
      request-CRC checking. GPL-3.0. No validate route and no local setup
      step.
  - title: "aria-spoof"
    url: "https://github.com/ads04r/aria-spoof"
    kind: "implementation"
    description: >
      2018 relay that rewrote guest readings before forwarding them to
      Fitbit; the source of the request-CRC evidence. Depends on the vendor
      answering. Unlicense.
  - title: "aria2mqtt"
    url: "https://github.com/bigbadbob2003/aria2mqtt"
    kind: "implementation"
    description: >
      2024 container that copies the original Aria's readings to MQTT and
      relays each request to Fitbit, so vendor sync keeps working while it
      lasts. MIT. The name means Aria to MQTT; it is not for the Aria 2.
  - title: "Pen Test Partners: smart weighing scales, part 1 (setup mode)"
    url: "https://www.pentestpartners.com/security-blog/are-your-smart-weighing-scales-lying-to-you-quite-possibly-part-1/"
    kind: "protocol_writeup"
    description: >
      2015 analysis of firmware 35: the open setup access point, its
      address, the vendor's token cookie and the clear-text credentials.
  - title: "Pen Test Partners: smart weighing scales, part 2 (upload protocol)"
    url: "https://www.pentestpartners.com/security-blog/are-your-smart-weighing-scales-lying-to-you-quite-possibly-part-2/"
    kind: "protocol_writeup"
    description: >
      Captures of register, validate and upload against the vendor on
      firmware 35, with field tables for the request and the reply.
  - title: "Pen Test Partners: extracting the Wi-Fi passphrase from the scale"
    url: "https://www.pentestpartners.com/security-blog/extracting-your-wpa-psk-from-bathroom-scales/"
    kind: "protocol_writeup"
    description: >
      June 2015: a setup-mode page that returned the stored network name
      and passphrase, and the authors' abandoned attempt to load modified
      firmware.
  - title: "IoT Sentinel (paper describing the public 2016 capture set)"
    url: "https://arxiv.org/abs/1611.04880"
    kind: "other"
    description: >
      The device-fingerprinting study whose 20 setup captures of an
      original Aria on firmware 37 are cited here as evidence. The paper
      says the dataset is available on request for research use.
  - title: "IoT Sentinel capture mirror"
    url: "https://github.com/andypitcher/IoT_Sentinel"
    kind: "other"
    description: >
      A public repository that mirrors the study's capture files. The
      captures contain a real MAC, tokens and an account id: read them for
      facts, do not redistribute them, and never copy an identifier out of
      them.
  - title: "Hackerspace Bamberg: Fitbit Aria Wi-Fi Smart Scale"
    url: "https://www.hackerspace-bamberg.de/projekte/fitbit-aria-wi-fi-smart-scale/"
    kind: "protocol_writeup"
    description: >
      The 2012 write-up of protocol version 2 (firmware 28). Historical;
      the diagrams have lost their spacing on the live page.
  - title: "Wayne Piekarski: intercepting the Fitbit Aria"
    url: "https://www.waynepiekarski.net/blog/2024/12/fitbit-mitm.htm"
    kind: "protocol_writeup"
    description: >
      December 2024 relay through a DNS redirect that passes each upload on
      to Fitbit. Useful as a deployment report; two of its field offsets
      are off.
  - title: "Fitbit Aria teardown with serial-console logs"
    url: "https://pooloferrors.com/project/2015/01/10/fitbit-teardown.html"
    kind: "teardown"
    description: >
      How the FB201 comes apart, what is on the board, and the serial
      console whose logs show the power-up display sequence and what is
      still stored after a power loss. Read the electrical and body-contact
      warnings in this spec before copying its wiring.
  - title: "FCC ID XRAFB201A"
    url: "https://fccid.io/XRAFB201A"
    kind: "other"
    description: >
      The FCC record for the original Aria: 802.11b, 2412 to 2462 MHz,
      internal photos, label artwork and a 2012 draft manual.
  - title: "The Register: Fitbit Aria DNS flaw fixed (2016)"
    url: "https://www.theregister.com/2016/04/29/fitbit_aria_scales_security_flaw/"
    kind: "other"
    description: >
      Press report of the 2016 firmware fix for a fixed DNS transaction
      identifier, with the vendor's remark that updates install overnight.
  - title: "Gadgets & Wearables: the Aria pairing cut-off arrived early"
    url: "https://gadgetsandwearables.com/2026/11/20/fitbit-aria-support-cutoff-early/"
    kind: "other"
    description: >
      Press report of 2026-11-20 that owners were already refused by the
      web setup flow. It quotes 2026-11-28, the date Google's page gave at
