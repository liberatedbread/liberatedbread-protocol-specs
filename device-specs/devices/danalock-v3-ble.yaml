remaining_unknowns:
  - "Default/custom token TTL, maximum lifetime, predecessor invalidation/revocation and long-term cached-token acceptance."
  - "DMI compatibility on BT, BTZB/BTZBE and dual-mode BTHK; only BTZE has author-reported live evidence."
  - "Full offline enrollment/self-keying and any authority accepted for owner-independent token issuance."
  - "Production certificate revocation behavior and a maintained reference implementation with complete X.509 checks."
  - "Exact battery_raw scaling and all Power Source TLV member semantics across variants."
  - "Bootloader signature enforcement, anti-downgrade policy, interrupted-update recovery and Danabridge trust enforcement."

evidence:
  public_implementation: >
    buggy-shep/pydanalock-ble 0.10.0 at
    ec3bec0c2da580c08d69d33bc923063222db60cf supplied the final DMI frame,
    CCITT-FALSE, RPD, TLS, AFI and advertisement layouts and their synthetic
    fixtures. Its public tests passed in the research environment (238 tests);
    this project did not run them against hardware. The companion HA
    integration at 9d12d7f1f961c4ac36d6417e6dbee15d838d6ce2 establishes the
    BTZE-only live-evidence boundary and the current persistence/insecure-mode
    limitations.
  app_and_firmware_analysis: >
    The two vendor apps and native protocol library established GATT/company
    IDs, enrollment and credential roles. Public firmware packages established
    Nordic DFU metadata and the shared DMI trust-anchor fingerprint. No owner
    blob, CA private key, token or certificate signing was used.
  documentation_review: >
    Official Salto Bluetooth, click-command, Z-Wave, Zigbee, HomeKit and Danapad
    pages supplied variant/reset/survival boundaries. Z-Wave JS and Zigbee2MQTT
    pinned configs corroborate those alternative routes; they are notes, not
    extra unimplemented specs.
  open_questions: >
    Authorized BT/BTZB/BTHK DMI sessions, full-validation interoperability,
    token TTL/rotation and safe owner export remain unresolved. Public RPD and
    DMI JSON fixtures used here are explicitly synthetic, not raw captures.
  artifacts:
    - type: "public_implementation"
      artifact: "buggy-shep/pydanalock-ble 0.10.0 @ ec3bec0c2da580c08d69d33bc923063222db60cf"
      url: "https://github.com/buggy-shep/pydanalock-ble/tree/ec3bec0c2da580c08d69d33bc923063222db60cf"
      description: "Pinned public protocol source and synthetic DMI/RPD/broadcast vectors. No real serial, token or capture is reproduced."
    - type: "public_implementation"
      artifact: "buggy-shep/danalock-ble-ha-integration 0.10.0 @ 9d12d7f1f961c4ac36d6417e6dbee15d838d6ce2"
      url: "https://github.com/buggy-shep/danalock-ble-ha-integration/tree/9d12d7f1f961c4ac36d6417e6dbee15d838d6ce2"
      description: "Public HA integration and BTZE-only author evidence; its insecure TLS/device-key persistence choices are explicitly rejected here."
    - type: "static_analysis"
      artifact: "Danalock com.danalock.wormhole 3.5.1 and com.danalock.v3 2.4.0 native DMI library"
      sha256: "351ce047247d62249c36b71544832371a47717156c06f679a37503ae37b44b5f"
      obtained_via: "third-party app mirrors, 2026-09"
      description: "Identical native DMI library in both apps, used for enrollment/GATT/credential roles; no binary or internal symbols are committed."
    - type: "vendor_documentation"
      artifact: "Salto Danalock click-command installation guide 226565 and online radio guides"
      url: "https://support.saltosystems.com/installation-guides/226565.pdf"
      description: "Physical reset and radio survival boundaries; installation-guide URL returned HTTP 200 on 2026-11-18."
