    p001_key: "qwertyuiopasdfghjklz"
    p002_iv: "zyxwvutsrqponmlk"
    config:
      cmd: 2
      ssid: "ExampleNet"
      pwd: "example-passphrase"
      bssid: "00005e005301"
      type: 1
      macAddr: "00005E00532A"
      caUrl: "http://192.168.1.50:8080/ca.pem"
      certSvrUrl: "https://192.168.1.50:9443/n/RXhhbXBsZSBmYW4"
      certToken: "ExampleToken0123456789abcdefghij"
      serial: "LOCAL000005E00532A"
    config_protobuf_hex: ""
    p001_hex: "503030310801121c6358646c636e523564576c766347467a5a475a6e6147707262486f3d"
    p001_fragments_hex:
      - "03000100503030310801121c6358646c636e5235"
