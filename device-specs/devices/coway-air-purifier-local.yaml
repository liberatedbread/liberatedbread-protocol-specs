remaining_unknowns:
  - "Every attribute code is the AP-1022K's. The 250S's own modes (rapid mode) and light settings, PM10 and other A1020 fields, and filter notification flags are not mapped."
  - "What MITG, MITGLWT (the will payload), MCert, MFota and the shadow delta carry, and when A1000 is sent."
  - "Firmware update: protocol, image source, signing and whether it can work without Coway are all unknown."
  - "The unit of the pre-filter cycle values (112/168/224) and what lighting levels 0-3 look like."
  - "Whether mode 0 really means manual, or only appears after a manual speed is set; and whether setting smart/sleep changes the reported speed."
  - "The base-36 decoding of the advertised product code (byte order and digit alphabet), the 0xFFFF layout's protocol/encryption field, the 0xFF single-byte notification, the ff00 and ffc3 roles, and scan bytes 0-1."
  - "Hotspot SSID, the meaning of the hotspot path's status codes, and whether a fan keeps new Wi-Fi settings when setup does not complete."
  - "Whether the fan pins anything beyond the downloaded CA (it appears not to: any CA served at caUrl was trusted), and its MQTT keepalive."
  - "Factory reset: none documented."
  - "Schema gap: the Bluetooth fragment header (u16 LE count + u16 LE index) is not one of the `framing` schemes, so it lives in protocol_details."
  - "Schema gap: entity state_mapping paths are dotted, and every attribute key here contains a literal '.', so the entities name their attribute in notes instead of state_mapping."
  - "Schema gap: request_id is a millisecond timestamp plus '-22', not one of the `auto` roles; `auto: sequence` is the nearest, and a consumer needs the named handler to render it."
  - "Schema gap: no setup-method type for a SoftAP whose setup channel is a raw TCP socket; the hotspot method is typed `none` and carries the softap block."
  - "Schema gap: a device that is an MQTT CLIENT of an owner-run broker has no first-class declaration; the mqtt block models a device that IS the broker, and a consumer that is not a broker cannot drive this spec's commands."
  - "Not replayed on hardware by this project."

