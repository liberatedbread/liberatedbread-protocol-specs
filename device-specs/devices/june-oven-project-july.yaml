remaining_unknowns:
  - "Physical installer 0.9.1 behavior, APX recovery and full-backup restoration were not tested by this project."
  - "Project July Gen 1 support remains under evaluation; Gen 3 is blocked and no alternative path is established."
  - "Exact guided-cook/preset content in each 0.9.1 payload, including Proof availability, must be checked on the installed oven."
  - "Per-home CA issuance and hostname/IP validation on every potential client were not tested; no live leaf or TLS session was examined."
  - "The stable wireless-update manifest may have changed after 2026-11-01; its current target and sequence must be rechecked before any update, and no recommendation to use it is made here."
  - "Exact APX/RCM USB identifiers and reset-persistence behavior across every installation layout still need hardware confirmation."
