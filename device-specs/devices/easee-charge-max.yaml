      "27": {name: "currentL2", unit: "A", absent_means: 0}
      "28": {name: "currentL3", unit: "A", absent_means: 0}
      "33": {name: "voltageL1N", unit: "V"}
      "34": {name: "voltageL2N", unit: "V"}
      "35": {name: "voltageL3N", unit: "V"}
      "36": {name: "voltageL1L2", unit: "V"}
      "37": {name: "voltageL1L3", unit: "V"}
      "38": {name: "voltageL2L3", unit: "V"}
      "43": {name: "equalizerLimitL1", unit: "A"}
      "44": {name: "equalizerLimitL2", unit: "A"}
      "45": {name: "equalizerLimitL3", unit: "A"}
      "46": {name: "ledMode", absent_means: 0, notes: "0 off, 16/17 error, 18 idle master, 21/22 smart not charging/charging, 23/24 normal not charging/charging, 25 awaiting authorization, 29 RFID pairing, 36-39 self-test, 46 Bluetooth connected; preserve other codes."}
    zero_when_absent: ["currentN", "currentL1", "currentL2", "currentL3", "totalPower", "lifetimeEnergy", "reasonForNoCurrent", "sessionEnergy", "energyPerHour", "isEnabled", "ocppEnabled", "cableLocked", "enableIdleCurrent", "authorizationRequired", "ledMode", "dynamicChargerCurrent", "maxChargerCurrent"]
    absent_rule: "Apply zero_when_absent only to those exact names. Missing voltage, cableRating, unknown fields and absent dynamic circuit fields remain unknown."
    vectors:
      dynamic_current_state: {hex: "00 41 01 01 00 08 58 20", expected: {field: 11, name: "dynamicChargerCurrent", value: 32, unit: "A"}}
      config_phase_led: {hex: "00 40 01 01 00 0a 38 02 68 4b", expected: {phase_field: 7, phaseMode: 2, led_field: 13, ledStripBrightness: 75}}
      command_accepted: '{"id":40,"code":1,"res":{"nws":3}}'
      command_refused: '{"id":41,"code":0,"resultcode":0,"Comment":"command 41 not supported","res":{"nws":3}}'
  control_policy:
    required_before_current_write:
      - "Poll Config/State and establish the lowest current allowed by circuit maxima (Config 8-10), charger max (Config 2), cable rating (State 2), existing dynamic limits and the owner's confirmed continuous-load rule."
      - "Send only command 48 with the clamped whole-ampere value in [0,40]. The 40 is a serializer bound, not hardware qualification."
      - "Require COMMAND code 1 and fresh State field 11 / Config as applicable. A refusal or a different readback is not success."
    allowed_commands: [29, 40, 48, 96]
    excluded:
      installer: "Commands 21/22/24/47/50 and phase mode 38: fallback/dynamic/max circuit/charger limits, fuse and phase installation settings are not exposed."
      provisioning_access: "Wi-Fi 7/53, local authorization/RFID 25/26/33/69/98/99/100/101/102 and cable lock 30 are excluded."
      destructive_maintenance: "Reboot 1, self-test 16, factory reset 97, MID/display/maintenance operations and every firmware operation are excluded."
      sensitive: "STRUCTURE is never polled; DEBUG has no named fields. Do not publish account/key material."
      persistence: "Only command 48 temporary current is offered for power control. Do not replace it with persistent max-current writes."

entities:
  - platform: "switch"
    name: "Charger Enabled"
    commands:
      turn_on: "set_charger_enabled"
      turn_off: "set_charger_disabled"
    notes: "Config field 1; absent means 0. Charger OpMode can remain Awaiting Start while disabled, so also inspect reasonForNoCurrent=53."
  - platform: "number"
    name: "Dynamic Charger Current"
    min: 0
    max: 40
    step: 1
    unit: "A"
    commands:
      set_value: "set_dynamic_charger_current"
    notes: "Advanced temporary limit, State field 11. Clamp max dynamically to installation/cable/charger bounds before every send; 40 A is not a rating."
  - platform: "number"
    name: "LED Brightness"
    min: 0
    max: 100
    step: 1
    unit: "%"
    commands:
      set_value: "set_led_brightness"
    notes: "Config field 13."
  - platform: "button"
    name: "Bluetooth Always-On"
    commands:
      press: "set_bt_always"
    notes: "COMMAND 96 mode 3; confirm Config field 20=3. Not an OS pairing setting."
  - platform: "button"
