      "20": {name: "btEnableMode", values: {"1": "button_press", "3": "always_on"}}
      "21": {name: "ipAddress", notes: "Owner-private; redact."}
      "22": {name: "macAddress", notes: "Owner-private; redact."}
    state_fields:
      "2": {name: "cableRating", unit: "A"}
      "3": {name: "lifetimeEnergy", unit: "kWh", absent_means: 0}
      "4": {name: "lifetimeHours", unit: "h"}
      "5": {name: "reasonForNoCurrent", absent_means: 0, values: {"0": "ok", "1": "max_circuit_limit_too_low", "2": "max_dynamic_circuit_limit_too_low", "3": "max_dynamic_offline_limit_too_low", "4": "circuit_fuse_too_low", "5": "waiting_in_queue", "6": "waiting_fully_charged_queue", "7": "illegal_grid_type", "8": "no_current_request", "9": "not_connected_to_master", "10": "equalizer_current_too_low", "11": "phase_not_connected", "25": "limited_by_circuit_fuse", "26": "limited_by_circuit_max", "27": "limited_by_circuit_dynamic", "28": "limited_by_equalizer", "29": "limited_by_load_balancing", "30": "limited_by_offline", "50": "secondary_or_no_car", "51": "max_charger_limit_too_low", "52": "max_dynamic_charger_limit_too_low", "53": "charger_disabled", "54": "waiting_schedule_or_authorization", "55": "pending_authorization", "56": "charger_error", "57": "erratic_ev", "75": "limited_by_cable", "76": "limited_by_schedule", "77": "limited_by_charger_max", "78": "limited_by_charger_dynamic", "79": "ev_not_charging", "80": "limited_by_local_adjustment", "81": "limited_by_ev", "100": "undefined"}}
      "11": {name: "dynamicChargerCurrent", unit: "A", absent_means: 0}
      "12": {name: "chargerOpMode", values: {"0": "offline", "1": "disconnected", "2": "awaiting_start", "3": "charging", "4": "completed", "5": "error", "6": "ready_to_charge", "7": "awaiting_authorization", "8": "de_authorizing"}}
