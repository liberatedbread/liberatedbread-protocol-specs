      "9": {name: "circuitMaxCurrentP2", unit: "A"}
      "10": {name: "circuitMaxCurrentP3", unit: "A"}
      "11": {name: "wifiSSID", notes: "Configured SSID, not proof of connection; redact in diagnostics."}
      "12": {name: "enableIdleCurrent", absent_means: 0}
      "13": {name: "ledStripBrightness", unit: "%"}
      "14": {name: "authorizationRequired", absent_means: 0}
