# Sources (all public; open format):
#   - docs.ruuvi.com (Data Format 5 / RAWv2 and Data Format 3 / RAWv1).

device:
  name: "RuuviTag Environmental Sensor"
  manufacturer: "Ruuvi Innovations Ltd"
  manufacturer_status: "active"
  testing:
    status: untested
    notes: >
      Not driven against hardware by this project. The DF5/DF3 byte layouts and
      company id 0x0499 are from Ruuvi's own published data-format documentation.
  protocol: "ble"
  category: "sensor"
  category_hierarchy: ["measurement", "temperature"]
  pictogram: "air-quality"
  notes: >
    The RuuviTag is an open BLE environmental sensor. Ruuvi publishes its
    advertisement formats and firmware, so this is a clean open target: passive
    BLE listen, no pairing, no cloud. Data is in the BLE Manufacturer Specific
    Data under company id 0x0499 (on-air little-endian 99 04); the format is
    discriminated by the first payload byte (0x05 = Data Format 5 / RAWv2, 0x03 =
    Data Format 3 / RAWv1).

    DATA FORMAT 5 (RAWv2), 24-byte payload, multi-byte fields MSB-first:
      @0 format id 0x05
      @1-2 temperature s16 x0.005 C (invalid 0x8000)
      @3-4 humidity u16 x0.0025 % (invalid 0xFFFF)
      @5-6 pressure u16, 1 Pa with -50000 Pa offset (invalid 0xFFFF)
      @7-8/@9-10/@11-12 acceleration X/Y/Z s16, 1 mG (invalid 0x8000)
      @13-14 power info: upper 11 bits battery mV (+1600 offset; raw 0x7FF
             unavailable), lower 5 bits TX power (2 dBm step, -40 offset;
             raw 0x1F unavailable)
      @15 movement counter u8 (invalid 0xFF)
      @16-17 measurement sequence u16 (invalid 0xFFFF)
      @18-23 MAC address (FF FF FF FF FF FF unavailable)

    DATA FORMAT 3 (RAWv1), 14-byte legacy: @0 0x03; @1 humidity u8 x0.5 %; @2-3
    sign-magnitude temperature: (-1 if byte2 & 0x80 else +1) *
    ((byte2 & 0x7F) + byte3/100) C, NOT int16; @4-5 pressure u16 BE + 50000 Pa;
    @6-7/@8-9/@10-11 accel X/Y/Z s16 BE mG; @12-13 battery u16 BE mV.

  openness:
    status: "open_by_design"
    reverse_engineered: false
    upstream_docs:
      - url: "https://docs.ruuvi.com/communication/bluetooth-advertisements/data-format-5-rawv2"
        title: "Ruuvi — Data Format 5 (RAWv2)"
        covers: "The 24-byte DF5 payload layout and company id 0x0499."
      - url: "https://docs.ruuvi.com/communication/bluetooth-advertisements/data-format-3-rawv1"
        title: "Ruuvi — Data Format 3 (RAWv1)"
        covers: "The 14-byte legacy DF3 payload layout."
    notes: >
      Ruuvi publishes the data formats and firmware; nothing was reverse-
      engineered. Company id 0x0499 is Ruuvi's own SIG assignment.

  identification:
    manufacturer_data:
      company_id: 1177
      company_id_hex: "0x0499"
      description: >
        Ruuvi Innovations. The first payload byte selects the format (0x05 = DF5
        / RAWv2, 0x03 = DF3 / RAWv1). Name prefix "Ruuvi".

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          local_name:
            match: "prefix"
            value: "Ruuvi"
          manufacturer_data:
            company_id: 1177
            description: "Ruuvi (0x0499); decode by the leading format byte (0x05 / 0x03)."
        notes: "Passive scan: match company id 0x0499, decode DF5 (or legacy DF3)."
    identity:
      stable_keys: ["address"]
      display: "local_name"
    static_ip_required: false

  setup:
    required: false
    confidence: "high"
    notes: >
      Nothing to provision: the tag ships broadcasting. A magnet/button and the
      Ruuvi Station app can change the interval, but the sensor stream needs no
      onboarding.
    methods:
      - type: "ble_direct"
        verified: false
        description: >
          Passive: scan for company id 0x0499 and decode the DF5 (or DF3) payload.
          No connection required.
        ble:
          pairing_required: false
        steps:
          - action: "Scan for company id 0x0499 and decode the manufacturer-data payload per its format byte."
            actor: "client"
            expect: "Temperature/humidity/pressure/acceleration/battery update every advertisement."
    factory_reset:
      applicable: true
      confidence: medium
      effect: >
        Restarts the sensor and, on stock firmware, clears the measurement
        history held on the tag. There are no credentials, no bond and no
        network membership to clear — a RuuviTag broadcasts and nothing else.
      description: >
        The reset is the battery, and that is the whole procedure: Ruuvi
        documents no button-based reset and no hold time. A related detail
        from the same page saves a lot of confusion — the sensors appear in a
        phone's Bluetooth settings but cannot be connected from there, which
        is exactly what an advertisement-first device that never bonds looks
        like, and not a fault to be reset away.
      procedures:
        - name: "Remove and reinsert the coin cell"
          verified: false
          basis: "Ruuvi's own support documentation on powering and resetting RuuviTag."
          power_state: "off"
          glyph: "generic/pinhole-reset.svg"
          steps:
            - action: "Open the enclosure and take out the coin cell."
              actor: "user"
            - action: "Reinsert it. The sensor restarts on its own."
              actor: "user"
              expect: "The tag resumes advertising; stored history is gone."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: "No network membership; reading is passive."
    credentials:
      wifi_passphrase_protection: not_applicable
      stored_on_device: []
      issued_to_client: []
      notes: "No pairing/auth; measurements are broadcast in the clear. No Wi-Fi."

  pairing:
    required: false
    confidence: "medium"
    security_mode: "none"
    bonding: "none"
    enter_pairing_mode:
      required: false
# Broadcast-only sensor: the standard Generic Access below records a connectable
# surface; the telemetry is entirely in the advertisement (payload_formats).
services:
  - uuid: "00001800-0000-1000-8000-00805f9b34fb"
    name: "Generic Access (standard)"
    notes: >
      Placeholder connectable surface. RuuviTag telemetry is in the manufacturer
      advertisement (company id 0x0499), decoded in payload_formats. Firmware also
      offers a Nordic UART GATT for history on some builds (not documented here).
    characteristics:
      - uuid: "00002a00-0000-1000-8000-00805f9b34fb"
        name: "Device Name"
        properties: ["read"]
        notes: "Standard device-name characteristic (\"Ruuvi ...\")."

payload_formats:
  data_format_5:
    description: "RAWv2 (DF5), 24-byte manufacturer-data payload; multi-byte fields MSB-first."
    fields:
      - index: 0
        length: 1
        name: "format"
        description: "byte 0 = 0x05."
      - index: 1
        length: 2
        name: "temperature"
        unit: "C"
        scale: 0.005
        description: "s16 BE @1, x0.005 C; 0x8000 invalid."
      - index: 3
        length: 2
        name: "humidity"
        unit: "%"
        scale: 0.0025
        description: "u16 BE @3, x0.0025 %; 0xFFFF invalid."
      - index: 5
        length: 2
        name: "pressure"
        unit: "Pa"
        value_offset: 50000
        description: "u16 BE @5, raw + 50000 Pa; 0xFFFF invalid."
      - index: 7
        length: 6
        name: "acceleration_xyz"
        description: "Three s16 BE values at @7/@9/@11, 1 mG; 0x8000 invalid per axis."
      - index: 13
        length: 2
        name: "power_info"
        description: "u16 BE @13. Battery raw = value >> 5, unavailable at 0x7FF, otherwise battery_mV = raw + 1600. TX raw = value & 0x1F, unavailable at 0x1F, otherwise TX_dBm = -40 + 2*raw. Test each sentinel independently before scaling."
      - index: 15
        length: 1
        name: "movement_counter"
        description: "u8 @15; 0xFF invalid."
      - index: 16
        length: 2
        name: "sequence"
        description: "u16 BE @16; 0xFFFF invalid."
      - index: 18
        length: 6
        name: "mac"
        description: "Six-byte MAC @18; FF FF FF FF FF FF means unavailable."
    example: "05 12 01 02 03 04 05 06 07 08 09 0a 0b ac 36 00 00 00 00 00 5e 00 53 00"
    parse_rules:
      - "A leading byte 0x03 is the legacy 14-byte DF3 layout instead; decode accordingly."
      - "Treat per-field sentinels as unavailable before sign extension or scaling: 0x8000 / 0xFFFF / 0xFF, battery raw 0x7FF, TX raw 0x1F, and all-ones MAC."
      - "The power fixture uses raw 0xAC36: battery = (0xAC36 >> 5) + 1600 = 2977 mV and TX = -40 + 2*(0xAC36 & 0x1F) = +4 dBm."
  data_format_3:
    description: "RAWv1 (DF3), 14-byte manufacturer-data payload. Multi-byte integers are big-endian except the sign-magnitude temperature pair."
    fields:
      - index: 0
        length: 1
        name: "format"
        description: "byte 0 = 0x03."
      - index: 1
        length: 1
        name: "humidity"
        unit: "%"
        scale: 0.5
        description: "u8 @1, 0.5 % per step."
      - index: 2
        length: 2
        name: "temperature"
        unit: "C"
        description: "Sign-magnitude @2-3: (-1 if byte2 & 0x80 else +1) * ((byte2 & 0x7F) + byte3/100). Not int16."
      - index: 4
        length: 2
        name: "pressure"
        unit: "Pa"
        value_offset: 50000
        description: "u16 BE @4 + 50000 Pa. Raw 0xFFFF is a valid pressure here; do not import DF5's pressure sentinel."
      - index: 6
        length: 2
        name: "acceleration_x"
        unit: "mG"
        description: "s16 BE @6."
      - index: 8
        length: 2
        name: "acceleration_y"
        unit: "mG"
        description: "s16 BE @8."
      - index: 10
        length: 2
        name: "acceleration_z"
        unit: "mG"
        description: "s16 BE @10."
      - index: 12
        length: 2
        name: "battery_mv"
        unit: "mV"
        description: "u16 BE @12, millivolts."
    example: "03 29 1a 1e ce 1e fc 18 f9 42 02 ca 0b 53"
    parse_rules:
      - "The official example decodes to 26.30 C, 20.5 %RH, 102766 Pa, acceleration (-1000, -1726, +714) mG and 2899 mV."
      - "Temperature bytes 81 45 decode as -(1 + 0x45/100) = -1.69 C; do not two's-complement the pair."

entities:
  - platform: "sensor"
    name: "Temperature"
    device_class: "temperature"
    unit: "C"
  - platform: "sensor"
    name: "Humidity"
    device_class: "humidity"
    unit: "%"
  - platform: "sensor"
    name: "Pressure"
    device_class: "atmospheric_pressure"
    unit: "Pa"
  - platform: "sensor"
    name: "Battery Voltage"
    device_class: "voltage"
    unit: "mV"

helpful_urls:
  - title: "Ruuvi — Data Format 5 (RAWv2)"
    url: "https://docs.ruuvi.com/communication/bluetooth-advertisements/data-format-5-rawv2"
    description: "The 24-byte DF5 payload layout and company id 0x0499."
  - title: "Ruuvi — Data Format 3 (RAWv1)"
    url: "https://docs.ruuvi.com/communication/bluetooth-advertisements/data-format-3-rawv1"
    description: "The 14-byte legacy DF3 payload layout."
  - title: "Ruuvi: powering and resetting RuuviTag"
    url: "https://ruuvi.com/manuals/tag/powering-and-resetting-ruuvitag/"
    kind: "vendor_support"
    description: >
      Vendor page behind the reset procedure in this spec: the battery cycle is the whole of it.
