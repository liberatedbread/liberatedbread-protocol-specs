# Cricut legacy stock USB — query-only identification and status.
# Public implementation-derived facts; no stock-hardware probe by this project.
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0

device:
  name: "Cricut Legacy USB Cutters (stock firmware, query only)"
  manufacturer: "Cricut, Inc. (formerly Provo Craft & Novelty)"
  manufacturer_status: "unsupported"
  testing:
    status: untested
    notes: >
      No stock Cricut was opened, probed or driven. Facts and response vectors
      are reported from pinned libcutter and licut source and from official
      manuals. The independent stdlib tests parse the four published response
      examples, rebuild only the implementation-derived five-byte emitted
      request form, and reject the six-byte documentary alternative; they are
      not serial captures.
  protocol: "uart"
  category: "tool"
  type: "cutting-machine"
  aliases:
    - "Cricut Personal Electronic Cutter"
    - "Cricut Create"
    - "Cricut Expression"
    - "Cricut Cake"
    - "Cricut Cake Mini"
  openness:
    status: "undocumented"
    reverse_engineered: true
    source_code: "https://github.com/vangdfang/libcutter"
    license: "LGPL-2.1"
    notes: >
      libcutter is LGPL-2.1; licut at the reviewed commit has no license grant.
      This document derives protocol facts and published vectors but copies no
      licut implementation code or embedded command keys. The legacy vendor
      software workflow is discontinued, while the machines' stock USB query
      surface remains useful for identification and preservation.
  notes: >
    STOCK LEGACY USB, QUERY-ONLY. Only model/firmware (0x12), status (0x14),
    mat bounds (0x11), and cartridge information (0x18) are documented here.
    No motion, cutting, start/stop transaction, design upload, command key or
    firmware operation is exposed. Modern Bifrost machines and Explore Air 2
    use different protocols and are outside this spec. Replacement-firmware
    protocols are also out of scope.

    Select the exact model and serial port manually. There is no universal USB
    VID/PID matcher and no blind probing of modern cutters. A serial device
    belonging to another product must not receive these requests.
  discovery:
    none: >
      Automatic discovery is intentionally disabled. The user identifies the
      legacy model physically and chooses its serial device. licut's adapter-
      specific lookup is not a universal Cricut USB identity and is not adopted.
  setup:
    required: false
    confidence: "medium"
    notes: >
      No account, pairing or network provisioning is needed for the query
      surface. Physical model and serial-port selection is still mandatory.
      The user chooses a baud/framing variant only from evidence for that unit;
      the 200000 versus 198347 baud and five- versus six-byte request
      discrepancies are not silently reconciled.
    methods:
      - type: "wired"
        name: "Manual legacy USB selection and read-only queries"
        role: "primary"
        verified: false
        description: >
          Connect a stock legacy cutter by USB, select the exact model and host
          serial port, then configure 200000 baud 8N1 receive with two stop
          intervals on transmit. Use 198347 baud only when independent evidence
          for that unit supports it. Always emit the five-byte implementation
          request. The six-byte example is only a documentary inconsistency
          with an extra trailing zero, not a selectable wire form.
        steps:
          - action: "Identify the cutter as Personal, Create, Expression, Cake or Cake Mini from its physical labels and manual; do not select Mini, Explore Air 2 or a modern Bifrost model."
            actor: "user"
            expect: "A stock legacy model is selected without relying on a universal USB ID."
          - action: "Connect USB and select the corresponding host serial device, excluding other serial equipment."
            actor: "user"
          - action: "Open the port for one client at 200000 baud, 8 data bits, no parity, 1 stop bit for receive; transmit two stop intervals using 8N2 when supported or a 1 ms inter-byte gap."
            actor: "client"
            notes: "200000 baud is reported by both implementations and explicitly marked for remeasurement by libcutter. Use 198347 only as a separately sourced user override."
          - action: "Issue the five-byte request 04 12 00 00 00 alone, then read exactly its 6-byte body after the length prefix."
            actor: "client"
            expect: "Six body bytes decode as model ID, firmware major and firmware minor, all big-endian uint16. A response has no opcode echo, so only one query may be outstanding."
          - action: "If status, mat bounds or cartridge information is wanted, issue the five-byte forms of 0x14, 0x11 or 0x18 separately and validate the exact body length and all offsets before decoding."
            actor: "client"
            expect: "Read-only status is returned. No motion, transaction, upload, key or firmware request follows."
        troubleshooting:
          - symptom: "No response or implausible values."
            fix: "Stop rather than trying other opcodes or the documentary six-byte example. Confirm the physical model and port, drain stale input, verify receive is 8N1 and transmit has two stop intervals, then resolve the unit's baud evidence. Do not automatically switch baud rates."
    factory_reset:
      applicable: true
      confidence: "medium"
      effect: >
        The physical Reset All key clears the current display and restores panel
        settings to defaults. It is not a serial command and does not pair,
        upload or update anything. Cake Mini's Reset All procedure is not
        established by the manuals reviewed here.
      description: >
        Reset All is a single physical key press with the machine on. Personal,
        Create, Expression and Cake have explicit manual procedures. Cake Mini
        remains an open documentation item rather than inheriting Cake's
        procedure without evidence.
      procedures:
        - name: "Personal: press Reset All"
          applies_to: ["Personal"]
          verified: false
          basis: "Cricut Personal Electronic Cutter User Manual, Reset All, page 9; not performed by this project."
          power_state: "on"
          press_count: 1
          indicator: "The LCD contents clear and settings return to factory defaults."
          steps:
            - action: "With the machine on and no cut in progress, press the physical Reset All key once."
              actor: "user"
              expect: "The display clears and panel settings return to factory defaults."
        - name: "Create: press Reset All"
          applies_to: ["Create"]
          verified: false
          basis: "Cricut Create User Manual, Reset All, page 12; not performed by this project."
          power_state: "on"
          press_count: 1
          indicator: "The display clears and no key remains backlit green."
          steps:
            - action: "With the machine on and no cut in progress, press the physical Reset All key once."
              actor: "user"
              expect: "The display clears, settings return to defaults, and no key remains backlit green."
        - name: "Expression: press Reset All"
          applies_to: ["Expression"]
          verified: false
          basis: "Cricut Expression User Manual, Reset All, page 13; not performed by this project."
          power_state: "on"
          press_count: 1
          indicator: "The display clears and no key remains backlit green."
          steps:
            - action: "With the machine on and no cut in progress, press the physical Reset All key once."
              actor: "user"
              expect: "The display clears, settings return to defaults, and no key remains backlit green."
        - name: "Cake: press Reset All"
          applies_to: ["Cake"]
          verified: false
          basis: "Cricut Cake User Manual, Reset All, page 13; not performed by this project."
          power_state: "on"
          press_count: 1
          indicator: "The display clears and no key remains backlit green."
          steps:
            - action: "With the machine on and no cut in progress, press the physical Reset All key once."
              actor: "user"
              expect: "The display clears, settings return to defaults, and no key remains backlit green."
    rejoin:
      in_place_supported: false
      requires_factory_reset: false
      notes: >
        There is no network binding, pairing or router to rejoin. Moving the USB
        cable to another host only requires closing the old serial client and
        manually selecting the correct model/port on the new host.
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device: []
      issued_to_client: []
      notes: >
        The four queries require no account, network credential, pairing key or
        motion-command key. licut's embedded command keys are not reproduced;
        libcutter requires owner-provided keys only for excluded motion paths,
        not for this read-only surface.
  pairing:
    required: false
    confidence: "medium"
    security_mode: "none"
    bonding: "none"
    exclusivity:
      single_connection: true
      single_bond: false
      recovery: >
        Close the other serial client and drain stale input before retrying the
        same benign query. Do not reset the cutter or try motion commands to
        release a port.
      notes: >
        The exclusivity is host-side: one process should own the serial port and
        keep one query outstanding. No device bond is created.
    enter_pairing_mode:
      required: false
      notes: "USB serial has no pairing mode for this query surface; physical access and manual model selection are the only gate."
    unpair:
      supported: false
      requires_factory_reset: false
      clears: "Nothing; no bond exists. Closing the serial port ends the host association."
      notes: "Reset All restores panel settings and is not an unpairing operation."
    notes: >
      There is no Bluetooth pairing, network join or application-layer session
      key for these four queries. Excluded encrypted motion commands are a
      separate subject and are not part of this spec.
  variants:
    - model: "Personal"
    - model: "Create"
    - model: "Expression"
    - model: "Cake"
    - model: "Cake Mini"

bus:
  link:
    type: "uart"
    baud: 200000
    framing: "8N1 receive; two stop intervals on host transmit (8N2 or 1 ms inter-byte gap)"
    verification: "reported"
    notes: >
      libcutter and licut both report 200000 baud, while libcutter explicitly
      says it needs remeasurement and a separate toolkit reports 198347. Keep
      the conflict. Do not alter receive to 8N2: receive is 8N1; the second
      stop interval applies only to host output.
  style: "request_response"
  checksum:
    algorithm: "none"
    scope: "No checksum is present in these four query/response exchanges."
    verification: "reported"
  notes: >
    A response begins with one length byte counting only the body, not the
    length byte itself. It has no opcode echo. Keep one query outstanding and
    correlate the response with that query. Read until the entire declared body
    arrives; serial reads may split or coalesce frames. Reject truncated,
    oversized and trailing data rather than zero-filling it.
  messages:
    - name: "model_firmware"
      description: "0x12: model ID and two firmware-version components."
      direction: "bidirectional"
      request: "04 12 00 00 00"
      response: "06"
      length: 7
      writes: false
      verification: "reported"
      notes: >
        This five-byte request is the sole executable form. licut's separate
        comment shows an extra trailing zero; that six-byte documentary
        inconsistency is not a request variant. See
        protocol_details.request_width_discrepancy.
      fields:
        - {offset: 0, length: 1, name: "payload_length", type: "uint8", encoding: "Always 6 for this response.", verification: "reported"}
        - {offset: 1, length: 2, name: "model_id", type: "uint16", endianness: "big", encoding: "0x000a Personal, 0x0014 Expression, 0x001e Mini detection-only; other values remain unknown.", verification: "reported"}
        - {offset: 3, length: 2, name: "firmware_major", type: "uint16", endianness: "big", verification: "reported"}
        - {offset: 5, length: 2, name: "firmware_minor", type: "uint16", endianness: "big", verification: "reported"}
    - name: "status"
      description: "0x14: cartridge-loaded and mat-loaded flags."
      direction: "bidirectional"
      request: "04 14 00 00 00"
      response: "04"
      length: 5
      writes: false
      verification: "reported"
      notes: "The sole executable request is the five-byte form shown here."
      fields:
        - {offset: 0, length: 1, name: "payload_length", type: "uint8", encoding: "Always 4 for this response.", verification: "reported"}
        - {offset: 1, length: 2, name: "cartridge_loaded", type: "uint16", endianness: "big", values: {0: "not loaded", 1: "loaded"}, verification: "reported"}
        - {offset: 3, length: 2, name: "mat_loaded", type: "uint16", endianness: "big", values: {0: "not loaded", 1: "loaded"}, verification: "reported"}
    - name: "mat_bounds"
      description: "0x11: four big-endian uint16 mat-boundary coordinates."
      direction: "bidirectional"
      request: "04 11 00 00 00"
      response: "08"
      length: 9
      writes: false
      verification: "reported"
      notes: >
        The sole executable request is the five-byte form shown here. libcutter
        uses 404 internal position units per inch. Boundary origin and
        per-model interpretation still need stock-hardware confirmation.
      fields:
        - {offset: 0, length: 1, name: "payload_length", type: "uint8", encoding: "Always 8 for this response.", verification: "reported"}
        - {offset: 1, length: 2, name: "x_min", type: "uint16", endianness: "big", unit: "in", scale: 0.002475247524752475, notes: "Exact conversion is raw / 404 inches.", verification: "reported"}
        - {offset: 3, length: 2, name: "y_min", type: "uint16", endianness: "big", unit: "in", scale: 0.002475247524752475, notes: "Exact conversion is raw / 404 inches.", verification: "reported"}
        - {offset: 5, length: 2, name: "x_max", type: "uint16", endianness: "big", unit: "in", scale: 0.002475247524752475, notes: "Exact conversion is raw / 404 inches.", verification: "reported"}
        - {offset: 7, length: 2, name: "y_max", type: "uint16", endianness: "big", unit: "in", scale: 0.002475247524752475, notes: "Exact conversion is raw / 404 inches.", verification: "reported"}
    - name: "cartridge_info"
      description: "0x18: cartridge presence, name region and revision."
      direction: "bidirectional"
      request: "04 18 00 00 00"
      response: "26"
      length: 39
      writes: false
      verification: "reported"
      notes: >
        The sole executable request is the five-byte form shown here. The
        published response has a 38-byte body, name_offset 33 and version at
        body offset 4 + 33 = 37, which is frame offset 38 once the length byte
        at frame offset 0 is counted. The field offsets below are
        frame-relative, like every other message in this spec. A parser must compute that offset dynamically
        and bounds-check it instead of trusting it. With no cartridge,
        present = 0 and name_offset = 0 permit an empty name.
      fields:
        - {offset: 0, length: 1, name: "payload_length", type: "uint8", encoding: "0x26 = 38 in the published response.", verification: "reported"}
        - {offset: 1, length: 2, name: "cartridge_present", type: "uint16", endianness: "big", values: {0: "not present", 1: "present"}, verification: "reported"}
        - {offset: 3, length: 2, name: "name_offset", type: "uint16", endianness: "big", encoding: "Name region length; version is at body offset 4 + name_offset.", verification: "reported"}
        - {offset: 5, length: 33, name: "name_region", type: "string", encoding: "Published vector's region (frame offset 5 = body offset 4): ASCII name followed by NUL and zero padding; decode only before the first NUL. Its length is name_offset.", verification: "reported"}
        - {offset: 38, length: 1, name: "cartridge_version", type: "uint8", encoding: "Published revision when name_offset is 33 (frame offset 38 = body offset 37). Otherwise compute frame offset 5 + name_offset (body offset 4 + name_offset).", verification: "reported"}

entities:
  - platform: "sensor"
    name: "Legacy Cricut Model ID"
    state_field: "model_firmware.model_id"
    notes: "Raw uint16 model identifier; only Personal and Expression have established mappings here. Unknown IDs stay unknown."
  - platform: "sensor"
    name: "Legacy Cricut Firmware"
    state_field: "model_firmware.firmware_major"
    notes: "Display major.minor using both model_firmware fields; this entity's raw source is the major component."
  - platform: "binary_sensor"
    name: "Legacy Cricut Cartridge Loaded"
    state_field: "status.cartridge_loaded"
  - platform: "binary_sensor"
    name: "Legacy Cricut Mat Loaded"
    state_field: "status.mat_loaded"
  - platform: "sensor"
    name: "Legacy Cricut Cartridge Name"
    state_field: "cartridge_info.name_region"
    notes: "Decoded ASCII before the first NUL; revision is available separately in the same message."
  - platform: "sensor"
    name: "Legacy Cricut Mat X Maximum"
    unit: "in"
    state_field: "mat_bounds.x_max"
    notes: "Raw boundary / 404 inches; origin and per-model interpretation are unverified."

protocol_details:
  serial_discrepancies:
    baud:
      primary_reported: 200000
      alternate_reported: 198347
      rule: "200000 is the primary reported configuration; 198347 is a separate toolkit's conflicting value, not a proven correction or fallback. A stock-hardware serial capture is required."
      sources:
        - "libcutter/libcutter: 200000, with an explicit remeasurement note"
        - "licut: 200000, 8N1 receive and 8N2-equivalent output timing"
        - "cricut-re-toolkit: 198347 for Personal/Expression/Create legacy serial"
    transmit_stop_intervals: 2
    receive_stop_intervals: 1
    inter_byte_gap_ms: 1
    post_response_drain_ms: 250
    inter_byte_rule: "licut sleeps 1 ms after each output byte, including the last, to supply the second stop interval while configured 8N1. libcutter alternatively enables 8N2 output and also delays output bytes."
  request_width_discrepancy:
    executable_form: "[04][opcode][00][00][00]"
    documentary_comment_only: "[04][opcode][00][00][00][00]"
    source: "licut's response examples show six bytes, while its packet builder and libcutter's fixed command writer both emit five. The sixth byte in the comment is only an extra-zero documentary inconsistency."
    rule: "Always emit five bytes. The six-byte example is not a selectable wire form and is never used by the executable messages or test vectors. Do not send both forms or infer a different protocol from a missing response."
  response_framing:
    length_prefix: "One byte; exact number of following body bytes, excluding itself"
    opcode_echo: false
    max_in_flight: 1
    expected_body_lengths:
      17: 8
      18: 6
      20: 4
      24: 38
    expected_body_lengths_note: "Keys are decimal opcodes: 0x11, 0x12, 0x14 and 0x18 respectively."
    read_rule: "Read the length byte, then exactly that many body bytes. Require the expected length for the outstanding query and reject short or trailing frames. Do not treat a short read as a complete frame."
    cartridge_rule: "For 0x18, body offsets 0–1 are presence, 2–3 name_offset, 4 onward name bytes, and 4 + name_offset is revision. Require 4 + name_offset < body length. With present = 0 and name_offset = 0, accept an empty name without a terminator. With present = 1, require a NUL-terminated, nonempty ASCII name; absent-carriage names need no terminator."
  model_ids:
    10: "Personal (0x000a)"
    20: "Expression (0x0014)"
    30: "Mini (0x001e; detection-only in libcutter and NOT a supported variant here)"
    unknown: "Create, Cake and Cake Mini numeric IDs are not established by the reviewed query parser; do not assign Expression's ID to them."
  reported_firmware_compatibility:
    note: "libcutter's broader support table, not this project's hardware verdict and not permission to use its motion path."
    entries:
      - {model: "Personal", reported: "1.31 and 1.34 work; 1.00 too old"}
      - {model: "Create", reported: "1.51 and 1.54 should work"}
      - {model: "Expression", reported: "2.31 works; 2.34 and 2.43 should work; 2.00 too old"}
      - {model: "Cake", reported: "2.35 should work; licut's alpha release also says it works with Cake"}
      - {model: "Cake Mini", reported: "1.54 should work"}
  excluded_operations:
    executable: false
    categories:
      - "motion, cutting, start/stop transactions and mat ejection"
      - "SVG/G-code/design upload and encrypted command construction"
      - "embedded or owner command keys"
      - "firmware read/write, update and replacement-firmware protocols"
      - "Explore Air 2 and modern Bifrost USB/BLE protocols"
      - "universal USB-ID probing or probing a Mini as if it were supported"
  published_vectors:
    provenance: >
      The request_hex values are implementation-derived five-byte emitted forms,
      not exact published requests. Only the four model_firmware, status,
      mat_bounds and cartridge_info response_hex values are exact licut
      published response examples, independently decoded here. The no-cartridge
      response is a synthetic parser boundary vector. Nothing here was captured
      by this project or is evidence of a live unit.
    model_firmware:
      request_hex: "04 12 00 00 00"
      response_hex: "06 00 14 00 02 00 22"
      expected: {model_id: 20, firmware_major: 2, firmware_minor: 34}
    status:
      request_hex: "04 14 00 00 00"
      response_hex: "04 00 01 00 01"
      expected: {cartridge_loaded: 1, mat_loaded: 1}
    mat_bounds:
      request_hex: "04 11 00 00 00"
      response_hex: "08 01 3c 00 32 13 62 12 58"
      expected: {x_min: 316, y_min: 50, x_max: 4962, y_max: 4696}
      expected_inches: "x_min = 79/101, y_min = 25/202, x_max = 2481/202, y_max = 1174/101"
    cartridge_info:
      request_hex: "04 18 00 00 00"
      response_hex: "26 00 01 00 21 43 72 69 63 75 74 28 52 29 20 43 61 6b 65 20 42 61 73 69 63 73 00 00 00 00 00 00 00 00 00 00 00 00 23"
      expected: {cartridge_present: 1, name_offset: 33, name: "Cricut(R) Cake Basics", cartridge_version: 35}
    no_cartridge:
      provenance: "Synthetic boundary vector for the documented present = 0, name_offset = 0 parser case; not a hardware capture."
      response_hex: "26 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00"
      expected: {cartridge_present: 0, name_offset: 0, name: "", cartridge_version: 0}

remaining_unknowns:
  - "No stock-hardware serial capture establishes whether 200000 or 198347 is correct for a given model/firmware, or why licut's documentary example carries an extra trailing zero. The emitted five-byte request remains the only executable form here."
  - "Create, Cake and Cake Mini model IDs and field-presence/version variation are unestablished; libcutter's support table is reported, not a live query guarantee."
  - "Mat boundary origin and per-model interpretation, and confirmation that every boundary uses the 404-units-per-inch motion scale, need hardware evidence."
  - "Cake Mini's physical Reset All procedure is not established by the manuals reviewed; do not copy Cake's procedure without its manual."
  - "Mini is detection-only in libcutter and its official legacy workflow is defunct; it is not a supported variant."
  - "licut has no license grant found. No code or embedded keys are copied; only derived protocol facts and its published vectors are used."
  - "Explore Air 2, Bifrost, replacement firmware, motion, upload, start/stop and firmware behavior are intentionally outside this spec."

