evidence:
  public_implementation_review: >
    libcutter at d7711ed396aac542781fc4c81dbe6d0eb787b3fd supplied the five-
    byte writer, model IDs, 200000-baud remeasurement caveat, stop-bit and
    404-units-per-inch details. licut at
    a90f4d735d04df758d0fb385e4967b5daa21058f supplied the four exact response
    examples, six-byte documentary requests, big-endian response fields,
    200000-baud 8N1 receive/two-stop output timing and the implementation's
    five-byte discrepancy. cricut-re-toolkit at
    fa09550991380668681a6f20df96d5995fa4de3a supplied the conflicting 198347
    value. No community code was run and no key material is reproduced.
  documentation_review: >
    Official Personal, Create, Expression and Cake manuals established the
    physical Reset All operation and indicator. The current model/connectivity
    survey separated stock legacy machines from Explore Air 2 and Bifrost.
    Every linked manual resolved when checked on 2026-11-17.
  open_questions: >
    Nothing here verifies a physical unit. The two baud values, two request
    widths, additional model IDs, boundary semantics and Cake Mini reset
    require owner-authorized stock-hardware evidence. licut's missing license
    is recorded rather than treating source availability as permission to copy.
  artifacts:
    - type: "public_implementation"
      artifact: "vangdfang/libcutter d7711ed396aac542781fc4c81dbe6d0eb787b3fd"
      url: "https://github.com/vangdfang/libcutter"
      description: "Legacy writer, model IDs, reported firmware table and serial/scale facts."
    - type: "public_implementation"
      artifact: "Geremia/licut a90f4d735d04df758d0fb385e4967b5daa21058f"
      url: "https://github.com/Geremia/licut"
      description: "Exact query vectors and response parsing facts; no license grant found and no code or embedded keys copied."
    - type: "public_implementation"
      artifact: "christianmeurer/cricut-re-toolkit fa09550991380668681a6f20df96d5995fa4de3a"
      url: "https://github.com/christianmeurer/cricut-re-toolkit"
