# openScale-documented BLE Body Scales — Device Specification
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# Sources (all public; clean-room — derived facts only):
#   - openScale (oliexdev, GPLv3) wiki — per-scale BLE protocol pages.
#
# Covers three families openScale documents that are NOT already in this repo:
# Beurer/Sanitas, Medisana BS444, and Trisa Body Analyze 4.0.

device:
  name: "openScale-documented BLE Body Scales (Beurer/Sanitas, Medisana BS444, Trisa)"
  manufacturer: "Beurer / Sanitas / SilverCrest, Medisana, Trisa (openScale documents 85 scales)"
  manufacturer_status: "active"
  testing:
    status: untested
    notes: >
      Not driven against hardware by this project. The service/characteristic
      UUIDs, command bytes and record layouts are from the openScale wiki pages
      for each family.
  protocol: "ble"
  category: "scale"
  category_hierarchy: ["measurement", "health", "body_composition"]
  notes: >
    openScale (GPLv3) documents dozens of Bluetooth body-composition scales whose
    vendor apps are cloud/account-oriented; this spec captures three families
    openScale documents that are not already in this registry. All are local BLE
    reads (some need a one-time user register / time-set write) — no cloud.

    BEURER / SANITAS / SilverCrest (shared platform): service 0xFFE0,
    characteristic 0xFFE1 (writes AND notifications). Frames start with e7/f7.
    Command bytes: user-ID query 0x4F, set unit 0x4D, add user 0x31, request user
    list 0x33, perform measurement 0x40, request saved measurements 0x41. A
    measurement record is 22 bytes: <timestamp><weight><impedance><fat><water>
    <muscle><bone><BMR><AMR><BMI>; weight = 2 bytes big-endian in g/50; impedance
    2 bytes BE; unix timestamp 4 bytes.

    MEDISANA BS444: weight service 000078b2-...; weight-measurement
    00008a21-... (indicate), body-composition 00008a22-... (indicate), command
    00008a81-... (write). Weight packet (0x8a21): byte0 flags (bits for unit
    kg/lb/st), bytes1-2 weight little-endian /100 for the demonstrated kg
    example only (lb/st divisors unresolved), bytes5-8 timestamp LE32,
    byte13 user-ID (1-8, 0xFF unset). Body-comp packet
    (0x8a22): bytes6-7 kCal LE, bytes8-9 fat% /10 (mask 0xF0), 10-11 water%,
    12-13 muscle%, 14-15 bone mass. TRIGGER: write 02 7b 7b f6 0d to the command
    characteristic. EPOCH: the BS444/BS440 count seconds since 2010-01-01,
    but openScale's Medisana handler treats the BS430 (names starting 0203B)
    as Unix seconds, for both the weight timestamp and its 02 <LE32> time-set
    write. For a name it cannot place, openScale starts with Unix time and
    switches to 2010 when only the 2010 reading lands near the current time,
    then remembers the choice per scale.

    TRISA Body Analyze 4.0: Weight Scale Service 0x7802 (distinct from Medisana's
    0x78b2); chars 0x8a20 (feature),
    0x8a21 (measurement indicate), 0x8a81 (download/command write), 0x8a82
    (upload indicate). Challenge-response pairing: device sends a0AABBCCDD
    (32-bit password) on 0x8a82; client writes 21AABBCCDD (set broadcast id) then
    22 (disconnect) to 0x8a81. For reads: device sends a1AABBCCDD challenge;
    client replies 20<challenge XOR password> then 02<seconds since 2010-01-01
    UTC, LE32>. Weight = 24-bit LE mantissa x 10^(signed 8-bit exponent).

  openness:
    status: "undocumented"
    reverse_engineered: true
    source_code: "https://github.com/oliexdev/openScale"
    license: "GPL-3.0"
    upstream_docs:
      - url: "https://github.com/oliexdev/openScale/wiki/Supported-scales-in-openScale"
        title: "openScale — supported scales"
        covers: "The full catalogue (85 scales / 59 handlers) and links to each family's protocol page."
    notes: >
      The vendors do not document these; openScale reverse-engineered them and
      its wiki is the authoritative per-scale reference. Credit openScale — it
      documents dozens of scale families.

  identification:
    service_uuids:
      - "000078b2-0000-1000-8000-00805f9b34fb"   # Medisana BS44x/BS430
      - "00007802-0000-1000-8000-00805f9b34fb"   # Trisa Body Analyze 4.0
    local_name_prefixes: ["013197", "013198", "0202B6", "0203B", "01257B", "11257B"]
    notes: >
      0xFFE0 is deliberately not identity: it is the generic HM-10-style
      serial service on countless unrelated peripherals. Beurer/Sanitas/
      SilverCrest are matched by name instead, as openScale's Beurer/Sanitas
      handler does (case-insensitive substrings bf-700, bf700, bf-800,
      bf800, bf710, libra-b, libra-w, sbf70, sbf75, aicdscale1), and their
      0xFFE0/0xFFE1 layout is checked after connecting. Medisana is matched
      by the 0x78b2 service or the name prefixes 013197/013198/0202B6
      (BS444/BS440) and 0203B (BS430); Trisa by the name prefixes
      01257B/11257B. Those prefixes are openScale's, compared
      case-insensitively for Medisana.

  discovery:
    methods:
      - type: "ble_scan"
        name: "Beurer / Sanitas / SilverCrest by name"
        ble:
          local_name:
            match: "regex"
            value: "[Bb][Ff](?:-?[78]00|710)|[Ll][Ii][Bb][Rr][Aa]-[BbWw]|[Ss][Bb][Ff]7[05]|[Aa][Ii][Cc][Dd][Ss][Cc][Aa][Ll][Ee]1"
        notes: >
          Name-only, mirroring openScale's Beurer/Sanitas handler (it
          lowercases the name and tests substrings). 0xFFE0 is not a matcher:
          it is shared with many unrelated serial-bridge peripherals. Confirm
          the 0xFFE0/0xFFE1 layout and an e7/f7 frame after connecting.
      - type: "ble_scan"
        name: "Medisana BS44x / BS430"
        ble:
          local_name:
            match: "regex"
            value: "^(?:013197|013198|0202[Bb]6|0203[Bb])"
          service_uuids:
            - "000078b2-0000-1000-8000-00805f9b34fb"
        notes: >
          openScale matches Medisana on these name prefixes or on the 0x78b2
          service alone. The prefix also picks the timestamp epoch (see the
          Medisana notes): 0203B* (BS430) uses Unix seconds, the others
          seconds since 2010-01-01.
      - type: "ble_scan"
        name: "Trisa Body Analyze 4.0"
        ble:
          local_name:
            match: "regex"
            value: "^[01]1257B"
          service_uuids:
            - "00007802-0000-1000-8000-00805f9b34fb"
        notes: >
          openScale matches Trisa on the 01257B / 11257B name prefixes only;
          0x7802 is also listed because it is this scale's own weight service.
    identity:
      stable_keys: ["address"]
      display: "local_name"
    static_ip_required: false

  setup:
    required: false
    confidence: "medium"
    notes: >
      Local BLE read; some families need a one-time on-device write: Beurer/
      Sanitas and Medisana register a user and (Medisana) require the trigger
      magic; Trisa uses the XOR challenge-response with a password captured during
      a pairing handshake. No cloud.
    methods:
      - type: "ble_direct"
        verified: false
        description: >
          Connect over BLE, subscribe to the family's measurement/indicate
          characteristic, and (per family) register a user, send the trigger
          magic, or complete the challenge-response before measurements arrive.
        ble:
          pairing_required: false
        steps:
          - action: "Connect and subscribe to the measurement/indicate characteristic for the family."
            actor: "client"
          - action: "Beurer/Sanitas: register a user (0x31) / request measurements (0x41). Medisana: write 02 7b 7b f6 0d. Trisa: complete the challenge-response."
            actor: "client"
          - action: "Step on the scale; read the measurement record."
            actor: "user"
    factory_reset:
      applicable: "unknown"
      confidence: low
      effect: >
        Not established for any of the three families. The vendor manuals cover
        selecting and overwriting the per-user memory slots but describe no
        operation that clears the scale wholesale, and none of the families
        stores a credential or a bond that a reset would need to remove.
      description: >
        What the manuals do give is per-user memory rather than a reset: the
        Medisana units hold eight user profiles with thirty measurements each,
        selected with the SET button, and a profile is changed by overwriting
        it rather than deleted.

        The privacy-shaped answer, which is usually what someone reaching for a
        reset actually wants, is the guest slot. Weighing in guest mode stores
        nothing at all on the scale — and on Medisana it also disables the
        Bluetooth transmission, so it is not a mode to use when the point is to
        record a reading.
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: "No network membership; a new BLE client connects (and re-registers a user) independently."
    credentials:
      wifi_passphrase_protection: not_applicable
      stored_on_device:
        - "Registered user profiles"
        - "Trisa: a broadcast-id / password bound during pairing"
      issued_to_client: []
      notes: >
        No Wi-Fi. Trisa binds a 32-bit password during pairing used in its XOR
        challenge-response; the others are unauthenticated local reads.

  pairing:
    required: false
    confidence: "medium"
    # No link-layer pairing on any of the three families. Trisa's password is
    # exchanged in the family's own frames, above the transport.
    security_mode: "app_layer"
    bonding: "none"
    notes: >
      All three families connect without a bond. What differs is what a client
      must do once connected: Beurer/Sanitas/SilverCrest register a user,
      Medisana needs its trigger magic, and Trisa completes an XOR
      challenge-response against a password captured during its own
      first-contact handshake. None of that is BLE pairing, and a client that
      treats it as such will go looking for an SMP exchange that never happens.
    enter_pairing_mode:
      required: false
services:
  - uuid: "0000ffe0-0000-1000-8000-00805f9b34fb"
    name: "Beurer / Sanitas scale service"
    notes: >
      Writes and notifications both on 0xFFE1. Frames start e7/f7. Commands:
      0x4F user-ID query, 0x4D set unit, 0x31 add user, 0x33 request users, 0x40
      perform measurement, 0x41 request saved measurements. 22-byte record:
      timestamp, weight (BE, g/50), impedance, fat, water, muscle, bone, BMR,
      AMR, BMI.
    characteristics:
      - uuid: "0000ffe1-0000-1000-8000-00805f9b34fb"
        name: "Command / measurement"
        properties: ["write", "notify"]
        notes: "Both the command write channel and the measurement notification channel."
  - uuid: "000078b2-0000-1000-8000-00805f9b34fb"
    name: "Medisana BS444 weight service (0x78b2)"
    notes: >
      Medisana BS444 (service 0x78b2): weight 0x8a21 (indicate), body-comp 0x8a22
      (indicate), command 0x8a81 (write; trigger 02 7b 7b f6 0d).
      NOTE: the Trisa Body Analyze 4.0 exposes the SAME 0x8a2x characteristic
      UUIDs (feature 0x8a20, measurement 0x8a21 indicate, command 0x8a81 write,
      upload 0x8a82 indicate; challenge-response) but under its own weight service
      0x7802, NOT 0x78b2 — resolve the characteristics by UUID. Timestamps use
      epoch 2010, except the Medisana BS430 (names 0203B*), which openScale
      treats as Unix seconds.
    characteristics:
      - uuid: "00008a21-0000-1000-8000-00805f9b34fb"
        name: "Weight measurement (indicate)"
        properties: ["indicate"]
        notes: >
          Medisana: byte0 flags (unit), bytes1-2 weight LE /100 for the kg
          example only, bytes5-8 seconds since 2010 LE (Unix seconds on the
          BS430, names 0203B*), byte13 user-ID. Do
          not generalize that divisor to lb/st. Trisa: weight = 24-bit LE
          mantissa x 10^(signed 8-bit exponent). Full reassembled layouts are
          under protocol_details.reassembled_records.
      - uuid: "00008a22-0000-1000-8000-00805f9b34fb"
        name: "Body composition (indicate, Medisana)"
        properties: ["indicate"]
        notes: "bytes6-7 kCal LE, 8-9 fat% /10 (mask 0xF0), 10-11 water%, 12-13 muscle%, 14-15 bone mass."
      - uuid: "00008a81-0000-1000-8000-00805f9b34fb"
        name: "Command (write)"
        properties: ["write"]
        notes: >
          Medisana trigger: write 02 7b 7b f6 0d. Trisa: 21AABBCCDD set
          broadcast-id, 22 disconnect, 20<challenge XOR password>,
          02<seconds since 2010 LE32>.
        commands:
          medisana_trigger:
            description: "Medisana BS444: start/handshake write (02 7b 7b f6 0d)."
            encoding: "bytes"
            verification: "reported"
            value: [0x02, 0x7B, 0x7B, 0xF6, 0x0D]

protocol_details:
  reassembled_records:
    verification: "reported"
    scope: "These layouts apply only after joining the notification fragments for one complete measurement; do not parse an individual fragment by these offsets."
    beurer_sanitas:
      length_bytes: 22
      endianness: "big"
      timestamp_mask: 0x7fffffff
      timestamp_note: "BF800 live records can set bit 31 as a flag; mask it before interpreting Unix seconds. Saved records may carry the same timestamp with the bit clear."
      fields:
        - {offset: 0, length: 4, name: "unix_seconds", type: "uint32", unit: "s"}
        - {offset: 4, length: 2, name: "weight", type: "uint16", scale: 0.05, unit: "kg"}
        - {offset: 6, length: 2, name: "impedance", type: "uint16", unit: "ohm"}
        - {offset: 8, length: 2, name: "fat", type: "uint16", scale: 0.1, unit: "%"}
        - {offset: 10, length: 2, name: "water", type: "uint16", scale: 0.1, unit: "%"}
        - {offset: 12, length: 2, name: "muscle", type: "uint16", scale: 0.1, unit: "%"}
        - {offset: 14, length: 2, name: "bone", type: "uint16", scale: 0.05, unit: "kg"}
        - {offset: 16, length: 2, name: "bmr_raw", type: "uint16", notes: "Raw value; unit unresolved."}
        - {offset: 18, length: 2, name: "amr_raw", type: "uint16", notes: "Raw value; unit unresolved."}
        - {offset: 20, length: 2, name: "bmi", type: "uint16", scale: 0.1}
    medisana_bs444:
      length_bytes: 19
      example_hex: "1d 80 25 00 fe 80 0f f4 0d 6a 17 00 ff 01 09 00 00 00 00"
      fields:
        - {offset: 0, length: 1, name: "flags", type: "uint8", notes: "Bits 5-6 select display unit; only the kg scaling below is established."}
        - {offset: 1, length: 2, name: "weight_kg", type: "uint16", endianness: "little", scale: 0.01, unit: "kg", notes: "Valid only for the kg example; lb/st divisors remain unresolved."}
        - {offset: 5, length: 4, name: "seconds_since_2010", type: "uint32", endianness: "little", unit: "s", notes: "BS444/BS440. The BS430 (names starting 0203B) sends Unix seconds here per openScale's Medisana handler; see device.notes."}
        - {offset: 13, length: 1, name: "user_id", type: "uint8", notes: "1-8; 0xff unset."}
    trisa_body_analyze:
      maximum_length_bytes: 20
      full_example_length_bytes: 20
      layout: "Five fixed bytes followed by compact flag-conditioned fields in timestamp, resistance-1, resistance-2, user, status order. The full 20-byte example is not a universal record length."
      example_hex: "df 28 1e 00 fe 04 0a 70 10 00 00 00 ff 60 14 00 ff 00 09 00"
      example_weight_kg: 77.20
      fields:
        - {offset: 0, length: 1, name: "flags", type: "uint8", notes: "Bits 0-4 condition timestamp, resistances, user and status. Bits 5-6 select kg/lb/st; the 0x60 alias is unresolved."}
        - {offset: 1, length: 3, name: "weight_mantissa", type: "uint24", endianness: "little"}
        - {offset: 4, length: 1, name: "weight_exponent", type: "int8", notes: "Weight = mantissa * 10^exponent; example mantissa 7720, exponent -2."}
        - {offset: 5, length: 4, name: "seconds_since_2010", type: "uint32", endianness: "little", unit: "s", presence: "flag bit 0", advance_on_present: true}
        - {offset: 5, length: 4, name: "resistance_1", type: "bytes", presence: "flag bit 1", advance_on_present: true, notes: "Starts after the fixed header and any timestamp already consumed; 24-bit LE mantissa plus signed exponent."}
        - {offset_formula: "5 + 4*(flag bit 0) + 4*(flag bit 1)", length: 4, name: "resistance_2", type: "bytes", presence: "flag bit 2", advance_on_present: true, notes: "Starts at 9 when timestamp is present but R1 is absent, at 13 when both are present, and at 5 when both are absent. 24-bit LE mantissa plus signed exponent."}
        - {offset_formula: "5 + 4*(flag bit 0) + 4*(flag bit 1) + 4*(flag bit 2)", length: 1, name: "user_id", type: "uint8", presence: "flag bit 3", advance_on_present: true}
        - {offset_formula: "5 + 4*(flag bit 0) + 4*(flag bit 1) + 4*(flag bit 2) + (flag bit 3)", length: 1, name: "measurement_status", type: "uint8", presence: "flag bit 4"}
        - {offset_formula: "19 only when all optional fields are present", length: 1, name: "reserved", type: "uint8", presence: "full example only; trailing role/length not established for shorter records"}

entities:
  - platform: "sensor"
    name: "Weight"
    unit: "kg"
    notes: "Weight from the family's measurement characteristic (see per-family scaling)."
  - platform: "sensor"
    name: "Body Fat"
    unit: "%"
    notes: "Body-fat percentage (Beurer 22-byte record; Medisana 0x8a22)."

helpful_urls:
  - title: "openScale — supported scales"
    url: "https://github.com/oliexdev/openScale/wiki/Supported-scales-in-openScale"
    description: "GPLv3 — catalogue of 85 scales and links to each family's BLE protocol page."
  - title: "openScale — Medisana BS444 protocol"
    url: "https://github.com/oliexdev/openScale/wiki/Medisana-BS444"
    description: "The 0x78b2 service, indicate characteristics and the 02 7b 7b f6 0d trigger."
  - title: "openScale — Trisa Body Analyze protocol"
    url: "https://github.com/oliexdev/openScale/wiki/Trisa-Body-Analyze"
    description: "The challenge-response pairing and weight mantissa/exponent encoding."
  - title: "Medisana BS 444 connect instruction manual"
    url: "https://www.manualslib.com/manual/1922343/Medisana-Bs-444-Connect.html"
    kind: "manual"
    description: >
      Vendor manual for the Medisana family, including the eight user slots and the guest mode that stores nothing.
  - title: "Medisana: BS 444 connect product documents"
    url: "https://www.medisana.com/en/Docs/?artnum=40444"
    kind: "vendor_support"
    description: >
