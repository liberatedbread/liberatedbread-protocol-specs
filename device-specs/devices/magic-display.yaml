# Magic Display device spec
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0

device:
  name: "Magic Display"
  manufacturer: "tirohk / AiTURE"
  manufacturer_status: "abandoned"
  testing:
    status: untested
  protocol: "ble"
  category: "display"
  notes: >
    Bluetooth-controlled LED displays for shoes, bags, hats, crafts.
    Uses Quintic (NXP QN-series) BLE chipset with QPP (Quintic Private Profile) on service 0xFEE9
    (chipset is NOT family-wide Quintic: sibling Shining Glasses hardware is Panchip-based with
    a 0xFD00 OTA service, so Magic Display variants may likewise differ).
    All command traffic is AES-128-ECB encrypted via the native libAES.so
    (aes.keyExpansionDefault() is a JNI native method; the 16-byte key is
    compiled into the .so, NOT present in Java — the recovered key is recorded
    as static_key on the WRITE1 characteristic below).
    Commands are fixed 16-byte ASCII-named packets: [length, ASCII_CMD..., params..., zero_pad].
    CORRECTION: there is NO connection-time 3-way handshake (the earlier claim was
    wrong). After connecting, the app simply queries the LED matrix type (STYPE) and
    parses the response. Bulk image transfer uses DATS (data_transfer_start) framing
    followed by data frames and DATCP (data_transfer_complete) — that is
    transfer framing, not an authentication handshake.
    Supports multiple display sizes: 5x36, 12x48, 14x56, 16x64 (reported via STYPE response).
    Monochrome 1-bit-per-pixel bitmap encoding (threshold: any RGB channel >= 128 = ON).
    Device identification by manufacturer-specific adv data: {0x54, 0x52, 0x00, 0x27}
    ("TR" + 0x0027; ble/BleConfig.java:8, BROADCAST_AiTURE_PRODUCT).
    No pairing required. Shares the com.cdbwsoft BLE codebase with Shining Glasses.
    A secondary Texas Instruments profile (service 0xFFF0 / char 0xFFF1) is also
    supported for TI-based hardware variants.
    Also has OTA service at 0xFEE8 (Quintic OTA protocol).
    FEE9/9600 is the generic Quintic-SDK QPP profile reused by unrelated products
    (e.g. Zhiyun Crane V2 gimbal), so scanning by service UUID alone false-positives —
    the manufacturer-data prefix match is the real discriminator.
    CONFIDENCE: command/UUID mapping HIGH (jadx of com.tirohk.magicdisplay);
    AES key RECOVERED from the arm64 libAES.so bundled in the APK split
    config.arm64_v8a.apk — 16 bytes at .so file offset 0x3020:
    34522a5b7a6e492c08090a9d8d2a23f8, identical to the public iDeal LED
    family key. App-derived, not yet verified against hardware.

    Enrich-branch evidence: version 1.5.6 (versionCode 156) was inspected with
    jadx. Java class csh.tiro.cc.aes exposes cipher / invCipher / keyExpansion /
    keyExpansionDefault backed by lib/arm64-v8a/libAES.so; Agreement.getEncryptData()
    encrypts every command before write and Agreement.getDecodeData() decrypts
    notifications. Bulk pixel/image upload uses DATS on WRITE1, waits for DATSOK,
    sends data chunks on WRITE2, then sends DATCP and waits for DATCPOK.
    CORRECTION (2026-08-14, verified against jadx of com.tirohk.magicdisplay —
    supersedes the 2026-07-31 sibling-derived notes, which were WRONG for this
    device): bulk image data on WRITE2 (960a) IS AES-128-ECB encrypted. The app
    splits the payload into 16-byte blocks ([length][up to 15 payload bytes]),
    encrypts each block with Agreement.getEncryptData() and writes it with
    writeCharacteristicBy2 at a fixed 60 ms pacing
    (data/ImageAgreement.java:404-436; BleDevice.onEncrypt itself is an
    identity no-op, library/ble/BleDevice.java:130-132). There is NO per-chunk
    acknowledgement — the string "REOK" appears nowhere in the app; flow
    control is timing-only. Only the framing commands are acked
    (DATS→DATSOK, DATCP→DATCPOK). WRITE3 (960b) is likewise encrypted: live
    DIY writes go through Agreement.getEncryptData() before
    writeCharacteristicBy3 (activity/LedEditActivity.java:319), and the
    music/rhythm visualizer sends encrypted 16-byte packets ([0x12][14 bytes
    of packed 4-bit levels]) on the same channel
    (music/VisualizerView.java:111-121) — not the sibling's plain 20-byte
    pixel writes. Animation upload (data/AnimationAgreement.java) uses the
    same DATS/data/DATCP flow as images but with 50 ms pacing. This app has
    NO multi-frame MANY transaction — a 2026-08-18 re-mine finds no
    MANY/MANCPOK strings and no DiyMutiAgreement class; the MANY <count>
    <profile> … MANYOK … MANCPOK flow is sibling-only (shining-glasses).
    STYPE response to a size code: STYPE5X36→536, STYPE5X36N→5360,
    STYPE12X48→1248, STYPE12X48N→12480, STYPE14X56→1456, STYPE16X64→1664
    (data/Agreement.java:44-78; N-suffixed variants exist only for 5X36 and
    12X48). Additional observed app features include LIGHTON/LIGHTOFF torch
    control, MODE 7 music/rhythm mode backed by libint16fft.so, MODE 8/9
    connected scroll right/left (daisy-chained displays) with a speed byte
    (Agreement.java:127-133), SMVEW DIY sync draw, LEDFIRST/LEDSECOND chained
    display selection, CALL notification passthrough, SCHD/STSC scheduling
    (timer response prefix "SBHD", Agreement.java:192-208), and ANIM
    animation selection. Four OTA firmware images are bundled in the app
    assets: TR1805R03-9_OTA.bin, TR1805R03-10_OTA.bin, TR1806R06-2_OTA.bin,
    TR1806R06-3_OTA.bin.
  identification:
    service_uuids:
      - "0000fee9-0000-1000-8000-00805f9b34fb"

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          service_uuids:
            - "0000fee9-0000-1000-8000-00805f9b34fb"
          manufacturer_data:
            company_id: 21076
            match: "prefix"
            pattern: "54520027"
            description: "Manufacturer-specific advertising data starts with 0x54 0x52 0x00 0x27."
    identity:
      stable_keys: ["address"]
      display: "service_uuid"
    static_ip_required: false

  setup:
    required: false
    confidence: "medium"
    notes: >
      No provisioning. Identify by service UUID and the manufacturer-data prefix
      rather than by name, since these units advertise without a stable local
      name.
    methods:
      - type: "ble_direct"
        verified: false
        description: >
          No provisioning step: the device advertises as soon as it is powered
          on and accepts a connection from any central. There is no account, no
          network credential exchange and no pairing PIN, so a replacement
          client only has to scan, connect and write.
        ble:
          pairing_required: false
        steps:
          - action: "Power the device and scan for its advertisement."
            actor: "client"
            request:
              protocol: "ble_gatt"
          - action: "Connect and run the documented initialization sequence, if the spec defines one."
            actor: "client"
    factory_reset:
      confidence: "low"
      effect: >
        No credential state to clear. Power-cycling drops the current
        connection, which is the actual remedy for the common failure mode:
        the device already being connected to another central.
      procedures:
        - name: "Power cycle"
          steps:
            - action: "Remove power (or battery) for a few seconds and reapply."
              actor: "user"
              expect: "Device advertises again and accepts a new connection."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        Nothing binds this device to a network or an owner, so switching
        controllers is just connecting from the new one. If the old client is
        an Android or iOS phone, remove the device from the OS Bluetooth list
        as well — a cached bond can keep the phone reconnecting automatically
        and holding the single available link.
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device: []
      issued_to_client: []
      notes: >
        Anything within radio range can connect and issue commands. Physical
        proximity is the only access control.
# Custom consumer-side handler for the cdbwsoft AES-128-ECB command framing
# (shared by Magic Display and Shining Glasses). Declarative.
protocol_handler: "cdbwsoft_ecb"

# Monochrome bitmap image upload (1 bit/pixel; any RGB channel >= 128 = ON).
features:
  - type: "image_upload"
    format: "1bit-bitmap"
    max_width: 64
    max_height: 16

services:
  - uuid: "0000fee9-0000-1000-8000-00805f9b34fb"
    name: "QPP Service"
    characteristics:
      - uuid: "d44bc439-abfd-45a2-b575-925416129600"
        name: "Command (WRITE1)"
        properties: ["write"]
        encryption:
          algorithm: "aes-128-ecb"
          key_derivation: "static"
          static_key: "34522a5b7a6e492c08090a9d8d2a23f8"
        notes: >
          AES-128-ECB, fixed static key. Key recovered verbatim from the vendor
          APK split's arm64 libAES.so (16 bytes at .so file offset 0x3020);
          identical to the public iDeal LED family key. The key is compiled
          into the native lib (loaded via aes.keyExpansionDefault, a JNI
          method) and is not present in the decompiled Java. App-derived, not
          yet verified against hardware. Confidence: HIGH structure.
          Evidence: com/tirohk/magicdisplay/MainApplication.java:26 (keyExpansionDefault);
          csh/tiro/cc/aes.java:11 (native); com/cdbwsoft/library/ble/BleManager.java:50-57.
        commands:
          query_device_type:
            description: >
              Query display dimensions. Response on notify: 'STYPE5X36',
              'STYPE12X48', 'STYPE16X64', etc. NOTE: the builder
              (Agreement.getTypeCommand) has no call site in app 1.5.6 — the
              device pushes its STYPE notification unsolicited after connect
              (parsed in MainPresenter.java:158), so clients can simply listen.
            value: [0x05, 0x53, 0x54, 0x59, 0x50, 0x45]
          led_on:
            description: "Turn LED display on"
            value: [0x05, 0x4C, 0x45, 0x44, 0x4F, 0x4E]
          led_off:
            description: "Turn LED display off"
            value: [0x06, 0x4C, 0x45, 0x44, 0x4F, 0x46, 0x46]
          set_brightness:
            description: "Set brightness level"
            template: [0x06, 0x4C, 0x49, 0x47, 0x48, 0x54, "{brightness}"]
            parameters:
              brightness:
                type: "uint8"
                min: 0
                max: 255
          set_speed:
            description: "Set animation speed"
            template: [0x06, 0x53, 0x50, 0x45, 0x45, 0x44, "{speed}"]
            parameters:
              speed:
                type: "uint8"
                min: 0
                max: 255
          set_mode_static:
            description: "Static display mode"
            value: [0x05, 0x4D, 0x4F, 0x44, 0x45, 0x01]
          set_mode_scroll_left:
            description: "Scroll left mode"
            template: [0x06, 0x4D, 0x4F, 0x44, 0x45, 0x03, "{speed}"]
            parameters:
              speed:
                type: "uint8"
                min: 0
                max: 255
          set_mode_scroll_right:
            description: "Scroll right mode"
            template: [0x06, 0x4D, 0x4F, 0x44, 0x45, 0x04, "{speed}"]
            parameters:
              speed:
                type: "uint8"
                min: 0
                max: 255
          set_time:
            description: "Set device clock"
            template: [0x07, 0x54, 0x49, 0x4D, 0x45, "{hour}", "{minute}", "{second}"]
            parameters:
              hour:
                type: "uint8"
                min: 0
                max: 23
              minute:
                type: "uint8"
                min: 0
                max: 59
              second:
                type: "uint8"
                min: 0
                max: 59
          invert_display:
            description: "Invert/flip display"
            value: [0x05, 0x45, 0x56, 0x45, 0x52, 0x54]
          set_mode_flash:
            description: "Flash mode; interval in ms, big-endian 16-bit (Agreement.getFlashingScreenCommand)."
            template: [0x07, 0x4D, 0x4F, 0x44, 0x45, 0x02, "{interval_hi}", "{interval_lo}"]
            parameters:
              interval_hi:
                type: "uint8"
                min: 0
                max: 255
              interval_lo:
                type: "uint8"
                min: 0
                max: 255
          set_mode_music:
            description: "Music/rhythm mode (MODE 7); level frames go to WRITE3. Backed by libint16fft.so."
            value: [0x05, 0x4D, 0x4F, 0x44, 0x45, 0x07]
          set_mode_scroll_right_linked:
            description: "Daisy-chained scroll right across linked displays (MODE 8), with speed byte."
            template: [0x06, 0x4D, 0x4F, 0x44, 0x45, 0x08, "{speed}"]
            parameters:
              speed:
                type: "uint8"
                min: 0
                max: 255
          set_mode_scroll_left_linked:
            description: "Daisy-chained scroll left across linked displays (MODE 9), with speed byte."
            template: [0x06, 0x4D, 0x4F, 0x44, 0x45, 0x09, "{speed}"]
            parameters:
              speed:
                type: "uint8"
                min: 0
                max: 255
          torch_on:
            description: "Torch/flashlight on (LIGHTON; distinct from LIGHT brightness — Agreement.getFlashLight)."
            value: [0x07, 0x4C, 0x49, 0x47, 0x48, 0x54, 0x4F, 0x4E]
          torch_off:
            description: "Torch/flashlight off (LIGHTOFF)."
            value: [0x08, 0x4C, 0x49, 0x47, 0x48, 0x54, 0x4F, 0x46, 0x46]
          select_animation:
            description: "Select built-in animation frame (ANIM n — Agreement.getImageCommand)."
            template: [0x05, 0x41, 0x4E, 0x49, 0x4D, "{index}"]
            parameters:
              index:
                type: "uint8"
                min: 0
                max: 255
          call_notification:
            description: "Phone-call notification passthrough (CALL status time — Agreement.getCallPhone)."
            template: [0x06, 0x43, 0x41, 0x4C, 0x4C, "{status}", "{time}"]
            parameters:
              status:
                type: "uint8"
                min: 0
                max: 255
              time:
                type: "uint8"
                min: 0
                max: 255
          set_schedule:
            description: "Timer auto on/off schedule (SCHD enable hour minute — Agreement.getTimerLightSwitch). Response to STSC uses prefix 'SBHD'."
            template: [0x07, 0x53, 0x43, 0x48, 0x44, "{enable}", "{hour}", "{minute}"]
            parameters:
              enable:
                type: "uint8"
                min: 0
                max: 1
              hour:
                type: "uint8"
                min: 0
                max: 23
              minute:
                type: "uint8"
                min: 0
                max: 59
          read_schedule:
            description: "Read back the timer schedule (STSC — Agreement.readTimerLight)."
            value: [0x04, 0x53, 0x54, 0x53, 0x43]
          diy_sync_mode:
            description: "DIY sync-draw mode (SMVEW): 1 = enter, 0 = exit, 2 = save-and-exit (Agreement.getEnterDiyCommand/getExitDiyCommand/getExitDiyAndSaveCommand)."
            template: [0x06, 0x53, 0x4D, 0x56, 0x45, 0x57, "{mode}"]
            parameters:
              mode:
                type: "uint8"
                min: 0
                max: 2
          stop_rhythm:
            description: "Stop music/rhythm mode (STOPR — Agreement.getStopRhythmCommand)."
            value: [0x05, 0x53, 0x54, 0x4F, 0x50, 0x52]
          select_display_first:
            description: "Address this unit as the first of a daisy chain (LEDFIRST — Agreement.getWhichCommand(1)). Sent on connect based on join order (MainPresenter.java:246)."
            value: [0x08, 0x4C, 0x45, 0x44, 0x46, 0x49, 0x52, 0x53, 0x54]
          select_display_second:
            description: "Address this unit as the second of a daisy chain (LEDSECOND — Agreement.getWhichCommand(2))."
            value: [0x09, 0x4C, 0x45, 0x44, 0x53, 0x45, 0x43, 0x4F, 0x4E, 0x44]
          data_transfer_start:
            description: "Start bulk data transfer. hi/lo = big-endian 16-bit data length."
            template: [0x08, 0x44, 0x41, 0x54, 0x53, "{len_hi}", "{len_lo}", 0x00, "{link_flag}"]
            parameters:
              len_hi:
                type: "uint8"
                min: 0
                max: 255
              len_lo:
                type: "uint8"
                min: 0
                max: 255
              link_flag:
                type: "uint8"
                min: 0
                max: 1
          data_transfer_complete:
            description: "Signal bulk data transfer complete"
            value: [0x05, 0x44, 0x41, 0x54, 0x43, 0x50]
          multi_frame_animation_start:
            description: >
              NOT PRESENT in com.tirohk.magicdisplay 1.5.6: a 2026-08-18
              re-mine of the jadx tree finds no MANY/MANCPOK command and no
              DiyMutiAgreement class — in this app, animation upload
              (data/AnimationAgreement.java) is a plain DATS/DATSOK → data →
              DATCP/DATCPOK transfer on WRITE2 with 50 ms pacing (vs 60 ms in
              ImageAgreement). The multi-frame transaction is sibling-only
              (shining-glasses DiyMutiAgreement + hardware captures): send
              "MANY <frameCount> <profile>" (profile 01 = stable/fast, 02/03
              slower), wait for MANYOK, upload each frame via the normal
              DATS/data/DATCP sequence, then send MANCPOK and wait for the
              MANCPOK reply. Whether Magic Display firmware accepts this flow
              is unknown — unverified for this device.

      - uuid: "d44bc439-abfd-45a2-b575-925416129601"
        name: "Notification"
        properties: ["notify"]

      - uuid: "d44bc439-abfd-45a2-b575-92541612960a"
        name: "Bulk Data (WRITE2)"
        properties: ["write"]
        encryption:
          algorithm: "aes-128-ecb"
          key_derivation: "static"
          static_key: "34522a5b7a6e492c08090a9d8d2a23f8"
        notes: >
          Bulk image data channel. Data is sent as AES-128-ECB encrypted
          16-byte blocks — [length][up to 15 payload bytes] per block, each
          block passed through Agreement.getEncryptData() before
          writeCharacteristicBy2, with a fixed 60 ms sleep between blocks
          (data/ImageAgreement.java:404-436; animation uploads use 50 ms,
          data/AnimationAgreement.java:68-72). There is no per-chunk ack
          ("REOK" appears nowhere in the app); flow control is timing-only.
          Only the framing commands on WRITE1 are acked (DATS→DATSOK,
          DATCP→DATCPOK). BleDevice.onEncrypt is an identity no-op
          (library/ble/BleDevice.java:130-132); the encryption is applied
          explicitly by the Agreement layer. Verified against jadx of
          com.tirohk.magicdisplay — supersedes earlier sibling-derived notes
          claiming unencrypted ~100-byte chunks with REOK flow control.

      - uuid: "d44bc439-abfd-45a2-b575-92541612960b"
        name: "Auxiliary (WRITE3)"
        properties: ["write"]
        encryption:
          algorithm: "aes-128-ecb"
          key_derivation: "static"
          static_key: "34522a5b7a6e492c08090a9d8d2a23f8"
        notes: >
          Live DIY pixel writes and music/rhythm visualizer data. Packets are
          16-byte and AES-128-ECB encrypted via Agreement.getEncryptData()
          before writeCharacteristicBy3 (activity/LedEditActivity.java:319);
          the visualizer sends [0x12][14 bytes of packed 4-bit levels]
          (music/VisualizerView.java:111-121). Verified against jadx of
          com.tirohk.magicdisplay — supersedes earlier sibling-derived notes
          claiming unencrypted 20-byte 05 RR GG BB II packets.

  # Texas Instruments profile used by TI-based hardware variants (BleManager.java:55,58).
  - uuid: "0000fff0-0000-1000-8000-00805f9b34fb"
    name: "TI Service"
    characteristics:
      - uuid: "0000fff1-0000-1000-8000-00805f9b34fb"
        name: "TI Command"
        properties: ["write", "notify"]
        encryption:
          algorithm: "aes-128-ecb"
          key_derivation: "static"
          static_key: "34522a5b7a6e492c08090a9d8d2a23f8"
        notes: >
          TI-variant command characteristic; same AES-128-ECB native key as
          WRITE1 (recovered from libAES.so, see there). Evidence:
          BleManager.java:55 (FFF1 characteristic), 58 (FFF0 service).

  # Quintic OTA service (library/ble/BleGlobalVariables.java:10-16).
  - uuid: "0000fee8-0000-1000-8000-00805f9b34fb"
    name: "OTA Service"
    characteristics:
      - uuid: "013784cf-f7e3-55b4-6c4c-9fd140100a16"
        name: "OTA Write"
        properties: ["write"]
        notes: >
          Standard Quintic OTA: host sends meta data (cmd 0x01), then the
          firmware image in 256-byte packets (cmd 0x02), then data-verify
          (0x03) and execution-new-code (0x04); the device reports an
          OtaResult status byte on the notify characteristic
          (library/ble/BleOtaUpdater.java, BleGlobalVariables.java:20-51).
          OTA writes are NOT AES-encrypted (BleDevice.writeOtaData writes raw,
          library/ble/BleDevice.java:616-641). Four firmware images are
          bundled in the app assets (TR1805R03-9/-10, TR1806R06-2/-3 OTA
          bins, ~39 KB each; ConnectPresenter.java:221-269).
      - uuid: "003784cf-f7e3-55b4-6c4c-9fd140100a16"
        name: "OTA Notify"
        properties: ["notify"]

# Vendor cloud is app-side only; the device itself never talks to it. All
# control is local BLE, so this device keeps working when the service dies.
cloud:
  required: false
  vendor_service: "e-toys.cn app backend (Tianlang Innovation Technology, Shenzhen)"
  hosts:
    - "http://api.e-toys.cn/api/ (hardcoded as AppConfig.SERVER, com/cdbwsoft/library/AppConfig.java:27)"
  endpoints:
    - path: "app/lastOtaUpdate"
      method: "POST"
      name: "OTA version check"
      returns: "Latest OTA metadata for an app_id. Server alive on 2026-07-31 but returns {\"status\":0,\"data\":null} for com.tirohk.magicdisplay — no firmware is served; the app falls back to the four OTA images bundled in its own assets."
      verification: "reported"
    - path: "ad/getAdInfo"
      method: "POST"
      name: "Ad fetch"
      verification: "reported"
    - path: "app/uploadLog"
      method: "POST"
      name: "Log upload (telemetry)"
      verification: "reported"
    - path: "app/runningLog"
      method: "POST"
      name: "Running-log upload (telemetry)"
      verification: "reported"
  failure_mode: >
    Nothing user-visible stops working. The device is driven entirely over
    local BLE with no account and no pairing; the cloud only feeds the app's
    OTA-version check, ads and log/telemetry uploads
    (com/cdbwsoft/library/net/Api.java, NetApi.java). OTA images are bundled
    in the APK assets, so even firmware update survives the backend.
  data_leaves_device:
    - "app usage/diagnostic logs (phone-side; the BLE device itself has no network interface)"
  notes: >
    Endpoint set and parameter shapes read from jadx of
    com.tirohk.magicdisplay 1.5.6 (com/cdbwsoft/library/net/). The library
    also carries app/count, app/lastUpdate, app/bindDevice and
    app/appInstalled call paths. Server reachability/empty-data status per
    the 2026-07-31 CONFIRMATION report; not re-probed 2026-08-18.

local_access:
  status: "native"
  summary: >
    Full local control over BLE as shipped: connect to the FEE9 QPP service
    (or FFF0 on TI variants), AES-128-ECB with the static key recorded on
    WRITE1, no pairing, no account, no cloud dependency at any step.
  covers:
    - "power on/off, brightness, speed, all display modes"
    - "text/image/animation upload (DATS/data/DATCP)"
    - "DIY sync draw and music/rhythm visualizer"
    - "timer schedule (SCHD/STSC) and clock sync (TIME)"
    - "firmware OTA from the app-bundled images"
  not_covered: []

entities:
  - platform: "light"
    name: "LED Display"
    features: ["brightness"]
    commands:
      set_brightness: "set_brightness"
