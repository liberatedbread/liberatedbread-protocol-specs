device:
  name: "SPOTLED LED Panel"
  manufacturer: "Host No.4 Technology (Chengdu) Co., Ltd."
  manufacturer_status: "unsupported"
  testing:
    status: verified
    detail: minimally-verified
    notes: >
      This project queried and uploaded to a 96x16 RGB Lunchbox panel on
      2026-11-07/08. A supplied 2026-11-10 official-app Pixel 8 capture of the
      same panel generation independently confirmed all queries, seven data
      transactions, one- and three-frame RGB888 uploads, visual RGB channel
      order, and offset resume after exactly 7280 data bytes. The official-app
      capture was analysed, not generated by our client; OTA, PIXELY protocol
      v2/v3, other geometries, monochrome panels and settings writes remain
      unverified.
  protocol: "ble"
  category: "display"
  category_hierarchy: ["display", "led_matrix"]
  notes: >
    OEM full-colour LED matrix panels driven by SPOTLED (Android package
    com.led.spotled; iOS bundleId com.sunday.led, App Store id 1564039607).
    SPOTLED 1.9.4 (2023) is the last release on both platforms. The same
    protocol covers hats, badges, backpack skins, chest panels and flexible
    banners under many reseller names. Lunchbox / LEDs 2 RAVE 4 Dream Skin 2.0
    and early 3.0 panels are members; leds2rave4-lunchbox-led.yaml carries the
    retail generations. THIS spec is the canonical protocol reference.

    DISCOVERY: reseller-set names vary. Known prefixes are LBXDRMSKIN_LED_ and
    SpotLED_. FF20 is useful when advertised but can be absent from short
    advertisements. The tested panel advertises 0x1812 and manufacturer company
    0x05D6; neither is a family-wide unique matcher, so do not match generic
    HID-over-GATT devices on 0x1812 alone. Confirm FF20/FF21/FF22 after connect.

    PAIRING IS OPTIONAL, NOT ABSENT: bondless community clients work. The
    official app initiates legacy Just Works pairing; the captured panel answers
    No Bonding, distributes no LTK, and the phone requests encryption for that
    connection. There is no PIN, MITM protection or persistent bond requirement.

    BOOTSTRAP: connect, negotiate MTU, enable FF21 notifications through the
    GATT client, discover FF21/FF22, then query Version, DisplayInfo and
    BufferSize, awaiting each FF21 notification. The official app's fuller order
    is version -> display -> animation/text capability -> playlist/object
    queries -> receive capacity. The three queries in this spec are sufficient
    for the documented upload path; do not treat notification values as ATT
    characteristic reads. Use the standard two-byte 01 00 CCCD value if writing
    the descriptor directly, and never write descriptor bytes to FF21 itself.

    LEGACY COMMAND FRAME (FF21): [u8 frame_length][u8 command_id]
    [u16_be serial][u16_be command_type][u32_be command_length]. Fixed queries
    are only the first four bytes. Vendor serial counters are byte-wide and wrap
    at 255 although the wire fields are wider; other clients use the full fields.

    LEGACY DATA FRAME (FF22): 15-byte header [u32_be header_length=15]
    [u16_be command_type=0x8004][u32_be serial][u32_be content_length]
    [u8 checksum], then typed records [u32_be length][u16_be type][fields]
    [u8 checksum]. Record types: 2 colour, 3 character, 4 character string,
    5 word stock, 6 lattice frame, 7 time, 8 effect, 9 speed, 10 number bar,
    11 animation, 13 font glyph, 14 brightness (0-100), 15 screen mode
    (0 normal / 1 upside-down / 2 mirror / 3 both), 96 dynamic colour frame.
    Effects: 0 none, 1 up, 2 down, 3 left, 4 right, 5 stack, 6 expand, 7 laser.
    Checksum: sum the covered bytes; when the sum exceeds 0xFF negate it with
    (~sum)+1 and keep the low byte. Preserve the conditional: a sum already
    below 0x100 is emitted unchanged.

    UPLOAD FLOW CONTROL: send SendingDataStart and require type-2 status zero.
    Serialize the complete data payload once, then slice it into raw writes;
    never add a length/checksum to each ATT chunk. The official app uses 182-byte
    application chunks in the captured legacy session even after MTU 512 was
    negotiated; MTU-3 is a ceiling, not a promise of the app's chosen size.
    Pace writes and react to responses. ContinueSending (type 255) carries the
    offset to RESUME FROM, not the client's cursor. The capture paused after
    exactly 7280 bytes and resumed both 13902-byte transfers successfully.
    Finish with SendingDataFinish and require type-4 status zero. PauseSending
    (type 254) is not by itself an MTU diagnosis.

    TEXT: rendering client-side into animation/type-96 frames is the capture-
    proven route. Character-string records let the device lay out text but need
    font/glyph records first. The tested firmware reported a 160-character UI
    limit; older community clients used smaller conservative limits.

    FIRMWARE AND NEWER APPS: static analysis now identifies the FF10 OTA
    service, FF11 instructions, FF12 data, and the metadata download flow; the
    OTA wire sequence remains reported, not capture-verified. PIXELY GLOW keeps
    the legacy FF20 transport on this panel and also contains protocol v2/v3
    paths. Those extensions are recorded separately below and must not be sent
    merely because a panel speaks the captured legacy protocol.

  identification:
    local_name_prefixes: ["LBXDRMSKIN_LED_", "SpotLED_"]
    service_uuids:
      - "0000ff20-0000-1000-8000-00805f9b34fb"
    notes: >
      Match a known name or FF20, then confirm the GATT layout. The observed
      0x1812/company-0x05D6 advertisement is corroboration only: 0x1812 is the
      shared HID service and the company/prefix combination has one captured
      unit behind it, so neither is declared as an independent matcher.

  discovery:
    methods:
      - type: "ble_scan"
        ble:
          local_name:
            match: "prefix"
            values: ["LBXDRMSKIN_LED_", "SpotLED_"]
          service_uuids:
            - "0000ff20-0000-1000-8000-00805f9b34fb"
        notes: "Match any known name or FF20; some shorter advertisement samples omit FF20."
    identity:
      stable_keys: ["address"]
      display: "local_name"
    static_ip_required: false

  setup:
    required: false
    confidence: "high"
    notes: >
      No provisioning, account or network credential exchange. Pairing is not
      required for control; an official-app pairing attempt may still occur.
    methods:
      - type: "ble_direct"
        verified: true
        description: >
          Power on, scan, connect and enable FF21 notifications. This project
          completed queries and uploads without a persistent bond. A transient
          official-app Just Works exchange is optional, not a provisioning step.
        ble:
          pairing_required: false
        steps:
          - action: "Power the device and scan for its advertisement."
            actor: "client"
            request:
              protocol: "ble_gatt"
          - action: "Connect, enable FF21 notifications, then issue the Version, DisplayInfo and BufferSize queries and await their notifications."
            actor: "client"
            request:
              protocol: "ble_gatt"
              action: "get_version"
    factory_reset:
      confidence: "low"
      effect: >
        No factory wipe is established. Power-cycling drops the current
        connection; it is not evidence that user content or settings are erased.
      procedures:
        - name: "Power cycle (connection recovery only)"
          verified: false
          basis: "Observed connection recovery during owner testing; no factory-reset operation was found or exercised."
          steps:
            - action: "Remove power (or battery) for a few seconds and reapply."
              actor: "user"
              expect: "Device advertises again and accepts a new connection; stored content is not claimed to be cleared."
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        Nothing binds the panel to a network or owner. Rediscover and connect
        from the new controller, closing the old central first. No persistent
        LTK bond was established in the official-app capture.
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device: []
      issued_to_client: []
      notes: >
        Physical proximity is the only established access control. Transient
        pairing does not provide MITM protection or a durable owner credential.

  pairing:
    required: false
    confidence: "high"
    security_mode: "just_works"
    bonding: "none"
    enter_pairing_mode:
      required: false
    exclusivity:
      single_connection: true
      single_bond: false
      recovery: "Close the vendor app or other central; power-cycle the panel if it no longer advertises or accept connections."
    notes: >
      Bondless operation is confirmed. In the 2026-11-10 SMP capture the app
      asks for bonding/MITM/Secure Connections, but the panel selects legacy
      Just Works, No Bonding, no MITM and no LTK distribution. The phone then
      enables encryption for the connection. Do not describe this as a secure
      persistent bond or as proof that pairing never occurs.
  variants:
    - model: "Lunchbox Dream Skin 2.0 / 3.0 (early boards)"
      identification:
        local_name_prefixes: ["LBXDRMSKIN_LED_", "SpotLED_"]
        service_uuids:
          - "0000ff20-0000-1000-8000-00805f9b34fb"
      notes: >
        See leds2rave4-lunchbox-led.yaml for SP107E v1 and recent iLEDColor v3,
        which are different protocols.

services:
  - uuid: "0000ff20-0000-1000-8000-00805f9b34fb"
    name: "SPOTLED Service"
    initialization:
      - characteristic: "0000ff21-0000-1000-8000-00805f9b34fb"
        subscribe: true
        notes: "Enable notifications through the GATT client; the captured CCCD value is the standard 01 00."
      - characteristic: "0000ff21-0000-1000-8000-00805f9b34fb"
        write: [0x04, 0x10, 0x00, 0x00]
        notes: "Version first in the official bootstrap; await type 17."
      - characteristic: "0000ff21-0000-1000-8000-00805f9b34fb"
        write: [0x04, 0x12, 0x00, 0x00]
        notes: "Await type-19 DisplayInfo and use its geometry rather than a retail-model assumption."
      - characteristic: "0000ff21-0000-1000-8000-00805f9b34fb"
        write: [0x04, 0x14, 0x00, 0x00]
        notes: "Await type-21 receive-capacity/BufferSize notification before uploads."
    characteristics:
      - uuid: "0000ff21-0000-1000-8000-00805f9b34fb"
        name: "Command"
        properties: ["write_without_response", "notify"]
        notes: >
          Values/templates below are COMPLETE legacy frames; do not prepend
          another length or append a checksum. The command channel has no
          checksum. Notification layout and field offsets are declared under
          protocol_details.legacy_responses. A notification can contain a
          complete response rather than an ATT read-back value.
        commands:
          get_version:
            description: "Query hardware type/revision and firmware revision; full base notification is 15 bytes."
            value: [0x04, 0x10, 0x00, 0x00]
            verification: "confirmed"
          get_display_info:
            description: "Query dimensions, colour type, advertised frame limit, brightness and font count; full base notification is 13 bytes."
            value: [0x04, 0x12, 0x00, 0x00]
            verification: "confirmed"
          get_animation_text_capability:
            description: "Query animation/text capability (command 26, response 27). Newer firmware may append a u32 storage size."
            value: [0x04, 0x1A, 0x00, 0x00]
            verification: "confirmed"
          get_buffer_size:
            description: "Query the u32 big-endian receive window; full notification is 9 bytes."
            value: [0x04, 0x14, 0x00, 0x00]
            verification: "confirmed"
          sending_data_start:
            description: "Announce a data payload; require response type 2 with matching serial/type and status zero."
            template: [0x0A, 0x01, "{serial_hi}", "{serial_lo}", "{type_hi}", "{type_lo}", "{len_b3}", "{len_b2}", "{len_b1}", "{len_b0}"]
            verification: "confirmed"
            parameters:
              serial_hi: { type: "uint8" }
              serial_lo: { type: "uint8" }
              type_hi: { type: "uint8" }
              type_lo: { type: "uint8" }
              len_b3: { type: "uint8" }
              len_b2: { type: "uint8" }
              len_b1: { type: "uint8" }
              len_b0: { type: "uint8" }
          sending_data_finish:
            description: "Finish a data payload; require response type 4 with matching serial/type and status zero, not type 2."
            template: [0x0A, 0x03, "{serial_hi}", "{serial_lo}", "{type_hi}", "{type_lo}", "{len_b3}", "{len_b2}", "{len_b1}", "{len_b0}"]
            verification: "confirmed"
            parameters:
              serial_hi: { type: "uint8" }
              serial_lo: { type: "uint8" }
              type_hi: { type: "uint8" }
              type_lo: { type: "uint8" }
              len_b3: { type: "uint8" }
              len_b2: { type: "uint8" }
              len_b1: { type: "uint8" }
              len_b0: { type: "uint8" }

      - uuid: "0000ff22-0000-1000-8000-00805f9b34fb"
        name: "Data"
        properties: ["write_without_response"]
        notes: >
          Bulk legacy data channel. The 15-byte payload header and each typed
          record carry their own length/checksum; individual ATT writes do not.
          Slice the serialized stream into writes no larger than MTU-3. The
          captured official app chose 182-byte writes at negotiated MTU 512.
          ContinueSending offset resume is mandatory after a receive-window
          pause. Brightness and screen mode are data records, not FF21 commands.

  - uuid: "0000ff10-0000-1000-8000-00805f9b34fb"
    name: "SPOTLED OTA Service"
    verification: "reported"
    notes: >
      Enumerated on the tested unit and identified in two app generations.
      Ordinary display traffic stays on FF20. The OTA command IDs use a
      little-endian 16-bit ID field, unlike the legacy display command IDs.
    characteristics:
      - uuid: "0000ff11-0000-1000-8000-00805f9b34fb"
        name: "OTA Instruction"
        properties: ["write", "notify"]
        verification: "reported"
        commands:
          ota_query_ready:
            description: "Begin OTA by presenting whole-image CRC-16 and length; expect readiness before streaming."
            template: [0x08, 0x50, 0x00, "{crc_hi}", "{crc_lo}", "{len_b2}", "{len_b1}", "{len_b0}"]
            verification: "reported"
            advanced: true
            advanced_reason: "Starts a firmware-update session. Use only an exact-model vendor image and preserve power; no recovery path has been tested."
            parameters:
              crc_hi: { type: "uint8", description: "High byte of CRC-16 poly 0x1021, init 0, MSB-first over the complete image." }
              crc_lo: { type: "uint8", description: "Low byte of the same CRC." }
              len_b2: { type: "uint8", description: "Most-significant byte of the u24 big-endian image length." }
              len_b1: { type: "uint8" }
              len_b0: { type: "uint8", description: "Least-significant byte of the image length." }
          ota_query_ack_window:
            description: "Query the device's OTA acknowledgement window before sending image data."
            value: [0x03, 0x51, 0x00]
            verification: "reported"
            advanced: true
            advanced_reason: "Part of the firmware-update sequence; do not issue outside an owner-approved update."
          ota_query_complete:
            description: "Ask whether the streamed image is complete; response status zero means done."
            value: [0x03, 0x53, 0x00]
            verification: "reported"
            advanced: true
            advanced_reason: "Finalizes a firmware update; only use after every image block and acknowledgement completed."
      - uuid: "0000ff12-0000-1000-8000-00805f9b34fb"
        name: "OTA Data"
        properties: ["write", "notify"]
        verification: "reported"
        notes: >
          Command 82 (0x52) carries image bytes in application blocks; wait for
          an acknowledgement at each device-supplied window. Static analysis
          reports five application-MTU units per block and 20 ms pacing, but no
          capture validates those values or image compatibility.

features:
  - type: "image_upload"
    format: "rgb888"
    resolution_source: "device_reported"
    animation: true
    verification: "confirmed"
    notes: >
      The official-app capture contains one- and three-frame 96x16 RGB888
      DynamicColorFrame uploads; decoded frames match camera images, including
      RGB order. Each frame record is 4620 bytes. Three-frame 13902-byte
      transfers pause at 7280 bytes, resume from that offset, and finish with
      status zero. This proves three frames, not the advertised 20-frame limit
      or arbitrary geometry. Earlier custom-client three/eight-frame attempts
      failed; their serialization difference remains unresolved.
  - type: "firmware_update"
    dfu:
      mechanisms: ["vendor_ble"]
      transport: "ble"
      services: ["0000ff10-0000-1000-8000-00805f9b34fb"]
      image:
        signing: "unknown"
        algorithm: "crc_only"
        source: "vendor_cloud"
        format: "Raw .bin image; whole-image CRC-16 (poly 0x1021, init 0, MSB-first) and u24 length are presented before transfer."
        notes: >
          Firmware metadata is recovered from the vendor API and images exist,
          but signature enforcement and exact hardware compatibility are not
          established. CRC is an integrity check, not proof of authorization.
      enter:
        how: "command"
        command: "ota_query_ready"
        notes: "Sequence: query ready -> query ACK window -> stream command-82 image blocks -> query complete. No OTA capture was made."
      dfu_mode:
        notes: "No separate bootloader advertisement, name or address is established."
      recovery:
        interrupted: "unknown"
      verification: "reported"
      notes: >
        FF10/FF11/FF12 and the command sequence come from static app analysis.
        Do not replay an image from this documentary block alone.

entities:
  - platform: "light"
    name: "LED Panel"
    features: ["brightness"]
    state_characteristic: "0000ff21-0000-1000-8000-00805f9b34fb"
    notes: "Brightness is a type-14 FF22 data record; no generic state decoder or verified brightness write is declared."
  - platform: "select"
    name: "Screen Mode"
    state_characteristic: "0000ff21-0000-1000-8000-00805f9b34fb"
    state_mapping:
      "0": "normal"
      "1": "upside_down"
      "2": "mirror"
      "3": "mirror_upside_down"
    notes: "Screen mode is a three-byte type-15 FF22 record (value plus two padding bytes); writes remain unverified."

protocol_details:
  advertisement:
    verification: "confirmed"
    observed_service_uuid: "00001812-0000-1000-8000-00805f9b34fb"
    observed_company_id: 1494
    observed_company_id_hex: "0x05D6"
    observed_manufacturer_value_hex: "08 00 4a 4c 41 49 53 44 4b"
    scope: "One 96x16 legacy panel; not a universal family signature and not an independent matcher."
    protocol_selection: "PIXELY GLOW reads a big-endian u16 protocol value from a seven-byte manufacturer AD structure and selects protocol 3 at >= 0x0300; this captured value selects legacy behavior."
  legacy_responses:
    verification: "confirmed"
    common_layout:
      total_length: { offset: 0, length: 1, endianness: "big" }
      response_type: { offset: 1, length: 1 }
      serial: { offset: 2, length: 2, endianness: "big" }
      status: { offset: 4, length: 1, success_value: 0 }
      payload: { offset: 5 }
    version:
      response_type: 17
      full_frame_bytes: 15
      fields:
        hardware_type: { offset: 5, length: 2, endianness: "big" }
        hardware_version: { offset: 7, length: 4, endianness: "big" }
        firmware_version: { offset: 11, length: 4, endianness: "big" }
    display_info:
      response_type: 19
      full_frame_bytes: 13
      fields:
        width: { offset: 5, length: 2, endianness: "big" }
        height: { offset: 7, length: 2, endianness: "big" }
        color_type: { offset: 9, length: 1 }
        advertised_max_frames: { offset: 10, length: 1 }
        brightness: { offset: 11, length: 1, min: 0, max: 100, unit: "%" }
        word_stock: { offset: 12, length: 1 }
        optional_light_up: { offset: 13, length: 1, presence: "length-gated" }
    receive_capacity:
      response_type: 21
      full_frame_bytes: 9
      fields:
        capacity_bytes: { offset: 5, length: 4, endianness: "big", unit: "bytes" }
    flow_control:
      continue_response_type: 255
      pause_response_type: 254
      continue_resume_offset: { offset: 6, length: 4, endianness: "big", unit: "bytes" }
      confirmed_resume_offset: 7280
      rule: "Resume from the device offset; deduplicate retransmitted ATT chunks and require final type-4 status zero."
  colour_types:
    verification: "reported"
    dynamic_colour_frame_record: 96
    values:
      16: { pixel_format: "1bpp monochrome", depth_byte: 1 }
      128: { pixel_format: "RGB332", depth_byte: 8 }
      238: { pixel_format: "RGB565", depth_byte: 16 }
      255: { pixel_format: "RGB888", depth_byte: 24, verification: "confirmed" }
      49: { record_type: 6, pixel_format: "RGB888 lattice frame", depth_byte: 24 }
    note: "Only RGB888/type-96 on a 96x16 panel is capture-confirmed; the other modes are static app findings."
  ota_protocol:
    verification: "reported"
    frame_layout: "[u8 length][u8 command_id_lo][u8 command_id_hi][content]"
    command_ids: { ready: 80, ack_window: 81, data: 82, complete: 83 }
    crc: { width: 16, polynomial: "0x1021", initial_value: "0x0000", input: "whole image, MSB-first", output_endianness: "big" }
    metadata_endpoint:
      method: "POST"
      host: "https://led.spotled.xyz"
      path: "/led/device/download/package"
      request: "Device JSON with protocolVersion forced to zero"
      response_path: "hardwarePackage"
      verification: "confirmed"
      note: "The metadata endpoint was exercised without authentication in research; image host configuration and exact model selection still need care."
  pixely_glow_extensions:
    verification: "reported"
    boundary: "Static findings from PIXELY GLOW 1.0.4/1.9.9; not observed on the captured legacy panel and not a license to probe every SPOTLED unit."
    protocol_query: { command: 28, response: 29, value: "u32 big-endian; >= 0x0200 selects aggregate device-info object 0xFFFF" }
    protocol_3:
      selection: "Manufacturer protocol value >= 0x0300"
      frame_layout: "[u32_be total_length][u16_be request_id][u8 small_protocol][u16_be serial][payload][u8 checksum]"
      checksum: "Same conditional byte-sum/two's-complement rule as legacy data records."
      response_layout: "Request/response ID at bytes 4-5, serial at 7-8, status at 9, payload from 12 where applicable."
      request_ids:
        device_info: [257, 258]
        global_config: [259]
        text: [289]
        gif: [290]
        graffiti: [321, 322, 323]
        effect: [330]
        play_item_exists: [352, 353]
        playlist: [354]
        control_play: [400]
      transport: "Large writes are MTU-chunked and matched by serial/status, not the legacy ContinueSending receive-window mechanism."
  test_vectors:
    empty_data_header_hex: "00 00 00 0f 80 04 00 00 00 01 00 00 00 00 94"
    empty_data_header_expected:
      header_length: 15
      command_type: 32772
      serial: 1
      content_length: 0
      checksum: 148
    display_info_response_hex: "0d 13 00 01 00 00 60 00 10 ff 14 64 01"
    display_info_expected:
      serial: 1
      status: 0
      width: 96
      height: 16
      color_type: 255
      advertised_max_frames: 20
      brightness: 100
      word_stock: 1
    continue_response_hex: "0a ff 00 01 80 04 00 00 1c 70"
    continue_expected:
      response_type: 255
      serial: 1
      command_type: 32772
      resume_offset: 7280

remaining_unknowns:
  - "Earlier custom-client three/eight-frame RGB uploads failed although the official three-frame path succeeds. Identify the byte-level difference before blaming a panel resource limit; the advertised 20-frame field is still not a proven guarantee."
  - "Other geometries, monochrome/RGB332/RGB565 modes, arbitrary animations, device-rendered text, brightness/screen-mode writes, factory reset and OTA remain unverified by a live client."
  - "FF10 OTA framing is source-derived only; image signature policy, recovery and model compatibility are unknown. AE30 remains unexplained."
  - "PIXELY GLOW protocol v2/v3, aggregate device info, material shapes/borders and protocol-3 uploads need advertisement-gated hardware captures; none are claimed for this legacy unit."

