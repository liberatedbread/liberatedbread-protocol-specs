entities:
  - platform: "sensor"
    name: "Pack Voltage"
    device_class: "voltage"
    unit: "V"
    notes: "Legacy offset 4 big-endian *0.1; 2021+ offset 38+S little-endian *0.01."
  - platform: "sensor"
    name: "Pack Current"
    device_class: "current"
    unit: "A"
    notes: "Legacy signed BE32 *-0.1; 2021+ signed LE16 at 40+S *+0.1. Positive decoded current means charging."
  - platform: "sensor"
    name: "State of Charge"
    device_class: "battery"
    unit: "%"
    notes: "Legacy u8 at 74; 2021+ u16 LE at 42+S."
  - platform: "sensor"
    name: "State of Health"
    unit: "%"
    notes: "2021+ u16 LE at 44+S; the legacy 140-byte protocol has no SOH field."
  - platform: "sensor"
    name: "Power"
    device_class: "power"
    unit: "W"
    notes: "Legacy signed BE32 at 111; 2021+ signed LE32 at 62+S."
  - platform: "sensor"
    name: "Cell Count"
    notes: "Legacy at 123 (max 32); 2021+ at 9 (clamp 32) and used to compute dynamic offsets."
  - platform: "sensor"
    name: "Cell 1 Voltage"
    device_class: "voltage"
    unit: "V"
    notes: "Legacy BE u16 at 6 *0.001; 2021+ LE u16 at 34 *0.001. Instantiate remaining cells only through cell_count."
  - platform: "sensor"
    name: "Temperature 1"
    device_class: "temperature"
    unit: "C"
    notes: "Legacy signed BE16 at 91; 2021+ signed LE16 at 34+2*cell_count. Additional probes use temp_count; then MOSFET and balancer."
  - platform: "sensor"
    name: "Cycle Charge"
    unit: "Ah"
    notes: "Legacy BE u32 at 79 *1e-6; 2021+ LE u32 at 54+S *1e-6."
  - platform: "sensor"
    name: "Cell Voltage Delta"
    device_class: "voltage"
    unit: "V"
    notes: "2021+ u16 LE at 82+S *0.001; legacy derives max-min from offsets 116 and 119 *0.001."

evidence:
  documentation_review: >
    Official four-page ANT communication protocol: six-byte Bluetooth status
    request, 140-byte response, big-endian layout and checksum.
    syssi/esphome-ant-bms at f93196ecd7917ad138300bdee0390732ec61eabb
    supplies exact 2021+ models. patman15/aiobmsble at
    eb3fe1488eceeb25eadffbf2d40b24c9facd371b supplies separate decoders and
    recorded vectors. fl4p/batmon-ha at
    af401fa12414e16fcdf02ac71019c60587abfb8c supplies the conflicting prose
    length form and current-sign cross-check; executable code wins.
  app_static_analysis: >
    Official ant.bms 2.3.5 binary (store metadata 2.3.9) and ant.bmsV2 3.4.0
    (versionCode 249) corroborate FFE0/FFE1, name separators, fallback pairs,
    the ten-byte read-only probe and optional owner authentication. No app
    internal symbols, real secret or cloud/DTU behavior is carried into this
    spec.
  open_questions: >
    Actual fallback channels on named boards, live confirmation of one-byte
    length versus the secondary two-byte prose, device-info length quirk,
    non-default authentication, disconnect/bond behavior and exact model
    coverage. No production-safe writes or firmware behavior was established.
  artifacts:
    - type: "vendor_documentation"
      artifact: "ANT asynchronous serial interface protocol, four pages"
      url: "https://github.com/syssi/esphome-ant-bms/blob/f93196ecd7917ad138300bdee0390732ec61eabb/docs/ANT_communication_protocol_EN.1.pdf"
      obtained_via: "Pinned public repository copy"
      description: "Legacy request, 140-byte frame, field offsets and checksum."
    - type: "public_implementation"
      artifact: "patman15/aiobmsble @ eb3fe1488eceeb25eadffbf2d40b24c9facd371b"
      url: "https://github.com/patman15/aiobmsble/tree/eb3fe1488eceeb25eadffbf2d40b24c9facd371b"
      obtained_via: "Pinned public Git repository"
      description: "Independent legacy/new decoders and recorded response vectors; its required venv was absent, so fixtures were reviewed rather than executed upstream."
    - type: "public_implementation"
      artifact: "syssi/esphome-ant-bms @ f93196ecd7917ad138300bdee0390732ec61eabb"
      url: "https://github.com/syssi/esphome-ant-bms/tree/f93196ecd7917ad138300bdee0390732ec61eabb"
      obtained_via: "Pinned public Git repository"
      description: "Exact model list, legacy manual, new dynamic decoder and capture files."
    - type: "public_implementation"
      artifact: "fl4p/batmon-ha @ af401fa12414e16fcdf02ac71019c60587abfb8c"
      url: "https://github.com/fl4p/batmon-ha/tree/af401fa12414e16fcdf02ac71019c60587abfb8c"
      obtained_via: "Pinned public Git repository"
      description: "Third implementation, sign convention and the explicitly rejected two-byte length prose."

remaining_unknowns:
  - "Which named retail boards actually expose fff3/fff4 or fff5/fff6 and their parent service UUIDs; fallback is bounded but unverified."
  - "The one-byte executable length form still needs live wire confirmation against the secondary two-byte prose; never implement both by guessing."
  - "Function 0x12's incorrect declared length and trailing bytes need capture on more firmware; no equivalent exception is allowed for status."
  - "Whether every 2021+ board shares the same decoded current direction; validate against FET/charging state before using current as a control input."
  - "Exact behavior for counts above 32 cells/6 probes, unused temperature sentinels and non-default application authentication."
  - "No safe writes, factory reset effect, firmware update path or other BLE models are asserted; wired-only cross-check models are not BLE-qualified."
  - "The schema cannot express dynamic scalar offsets or generation-specific checksum/current transforms declaratively; a generationed handler is required."

