# Belkin Wemo Mini Smart Plug — Device Specification
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# First WiFi device spec authored for OpenGreenIoT. Grounded in the pywemo
# reference implementation (github.com/pywemo/pywemo) plus static analysis of
# the com.belkin.wemoandroid APK. Local control is via UPnP: SSDP discovery on
# the LAN followed by SOAP 1.1 action calls over HTTP. NO cloud dependency for
# on/off/state; the Wemo cloud is being shut down (see manufacturer_status).
#
# ─────────────────────────────────────────────────────────────────────────
# SCHEMA GAPS FLAGGED FOR HUMAN REVIEW (see device.notes for the same list).
# device-specs/schema.json was intentionally NOT modified. Where the WiFi/UPnP
# model does not fit the current schema, data is documented in `description`
# strings and here:
#
#   (a) SSDP has no home in `identification`. There is no field for the
#       multicast target 239.255.255.250:1900, the M-SEARCH search-target URN
#       `urn:Belkin:service:basicevent:1`, or the UPnP `deviceType`
#       (`urn:Belkin:device:controllee:1`). Wemo is SSDP/UPnP-only, NOT mDNS,
#       so `mdns_service_type` is deliberately omitted (left null). All SSDP
#       facts live in device.notes + the /setup.xml endpoint description.
#
#   (b) `identification.default_port` is a single integer, but a Wemo's HTTP
#       port is NOT stable: it drifts across 49152-49159 and changes after a
#       device reconnect. pywemo probes 49153 first, then 49152, 49154, 49151,
#       49155-49159. We record 49153 as `default_port` and document the full
#       probe list in notes. A `port_probe_list` array would fit better.
#
#   (c) `http_endpoints` has no `headers` field. SOAP dispatch REQUIRES a
#       `SOAPACTION` request header (`"<serviceType>#<Action>"`) plus the
#       service-type XML namespace in the body — neither has a schema home, so
#       both are documented in each endpoint's `description`. Consequently
#       SetBinaryState and GetBinaryState share ONE path
#       (/upnp/control/basicevent1) and are disambiguated ONLY by SOAPACTION,
#       which the current schema cannot express as two distinct endpoints
#       cleanly (they differ only by header + body, not by method+path).
# ─────────────────────────────────────────────────────────────────────────

device:
  name: "Belkin Wemo Mini Smart Plug"
  manufacturer: "Belkin"
  # "shutdown" chosen from the enum {abandoned, active, shutdown, unsupported}:
  # Belkin announced the Wemo cloud shutdown (app + account features end
  # 2026-01-31). Local UPnP/SOAP control survives the shutdown, which is
  # exactly why this device is a rescue target.
  manufacturer_status: "shutdown"
  protocol: "wifi"
  notes: >
    Belkin Wemo Mini Smart Plug (model F7C063) and the closely related Wemo
    WiFi Smart Plug V2 (WSP080). Controlled locally over UPnP: SSDP discovery
    then SOAP 1.1 action calls — no cloud required for on/off or state, so the
    device keeps working after the announced Wemo cloud shutdown (2026-01-31).
    The same protocol covers the wider Wemo family (Insight Switch, Light
    Switch, Dimmer, Bridge) which differ by UPnP deviceType and service list.


    DISCOVERY (SSDP / UPnP — NOT mDNS): send an HTTP-over-UDP M-SEARCH to the
    multicast group 239.255.255.250:1900 with MAN "ssdp:discover", MX 1, and
    ST `urn:Belkin:service:basicevent:1` (alternates that also match:
    `ssdp:all` and `urn:Belkin:device:controllee:1`). The unicast reply's
    LOCATION header gives `http://<ip>:<port>/setup.xml`; the USN looks like
    `uuid:Socket-1_0-<serial>::urn:Belkin:service:basicevent:1`. GET that
    LOCATION to read the device description (deviceType, friendlyName, UDN,
    serialNumber, macAddress, modelName/modelNumber, serviceList).


    PORT INSTABILITY: the HTTP port is not fixed. pywemo PROBE_PORTS tries
    49153 first, then 49152, 49154, 49151, 49155, 49156, 49157, 49158, 49159.
    A client must re-probe after the device reconnects / changes IP, since the
    port can move within that range.


    CONTROL: SOAP 1.1 POST. Required headers are `Content-Type: text/xml;
    charset="utf-8"` and `SOAPACTION: "<serviceType>#<Action>"` — e.g.
    `"urn:Belkin:service:basicevent:1#SetBinaryState"`. The SOAP body carries
    the matching service-type XML namespace. SetBinaryState sends
    BinaryState=1 (on) / 0 (off); GetBinaryState reads current state;
    GetInsightParams returns power/energy telemetry on Insight models.
    Asynchronous state changes are delivered via UPnP eventing (SUBSCRIBE to
    each service's eventSubURL, e.g. /upnp/event/basicevent1).


    SETUP / PROVISIONING: a factory-reset device broadcasts a WiFi AP with SSID
    prefix `WeMo.Setup.`; the app joins it and provisions home WiFi via the
    same SOAP surface (pywemo api/wifi_setup.py — GetApList, ConnectHomeNetwork).


    HYBRID CLOUD (from APK, for reference only — not used by a local-only
    client): remote/account features talk to `api.xwemo.com:8443` /
    `appapis.xwemo.com:8443`, Firebase
    (`productionwemoandroidpn.firebaseio.com`) for push, and AWS IoT. These are
    the services affected by the shutdown.


    ── SCHEMA GAPS (schema.json NOT modified; see header comment for detail) ──
    (a) No `identification` field for the SSDP multicast target
    239.255.255.250:1900, the M-SEARCH ST URN
    `urn:Belkin:service:basicevent:1`, or the UPnP deviceType
    `urn:Belkin:device:controllee:1`; documented here + in /setup.xml.
    (b) `default_port` is a single integer but the port drifts 49152-49159
    (probe 49153 first, re-probe after reconnect); a probe-list array would fit
    better.
    (c) `http_endpoints` has no `headers` field, so the required SOAPACTION
    header and service-type XML namespace live in each endpoint's
    `description`; SetBinaryState and GetBinaryState share one path and are
    disambiguated only by SOAPACTION.
  identification:
    # mdns_service_type intentionally OMITTED — Wemo is SSDP/UPnP-only, not
    # mDNS. (The old target doc's "_wemo._tcp" guess was wrong; see notes.)
    ssid_prefix: "WeMo.Setup."
    default_port: 49153   # SEE NOTES: port drifts 49152-49159; probe 49153 first

# UPnP/SOAP control surface modeled as HTTP endpoints. The current schema has
# no `headers` field, so the mandatory SOAPACTION header lives in `description`
# (schema gap (c)). SetBinaryState/GetBinaryState share /upnp/control/basicevent1
# and are told apart ONLY by SOAPACTION.
http_endpoints:
  - method: "GET"
    path: "/setup.xml"
    name: "UPnP Device Description"
    description: >
      UPnP device description document, fetched from the LOCATION header
      returned by SSDP discovery (http://<ip>:<port>/setup.xml). No SOAPACTION
      header. Identifies the device and enumerates its services/controlURLs.
      deviceType is `urn:Belkin:device:controllee:1` for the Mini plug
      (others: :insight:1, :dimmer:1, :lightswitch:1, :bridge:1).
    response_body:
      content_type: "text/xml"
      fields:
        - name: "deviceType"
          type: "string"
          description: "UPnP device type, e.g. urn:Belkin:device:controllee:1 (plug)."
        - name: "friendlyName"
          type: "string"
          description: "User-assigned device name."
        - name: "UDN"
          type: "string"
          description: "Unique Device Name, e.g. uuid:Socket-1_0-<serial>."
        - name: "serialNumber"
          type: "string"
          description: "Device serial number."
        - name: "macAddress"
          type: "string"
          description: "Device WiFi MAC address."
        - name: "modelName"
          type: "string"
          description: "Model name, e.g. Socket (Mini F7C063 / WSP080)."
        - name: "modelNumber"
          type: "string"
          description: "Model number, e.g. F7C063 (Mini) or WSP080 (V2)."
        - name: "serviceList"
          type: "array"
          description: "UPnP services with their controlURL / eventSubURL (basicevent, metainfo, insight)."

  - method: "POST"
    path: "/upnp/control/basicevent1"
    name: "SetBinaryState (switch on/off)"
    description: >
      SOAP 1.1 action on the basicevent service (controlURL
      /upnp/control/basicevent1, eventSubURL /upnp/event/basicevent1).
      REQUIRED header (schema gap (c), no headers field):
      SOAPACTION: "urn:Belkin:service:basicevent:1#SetBinaryState".
      Content-Type: text/xml; charset="utf-8". The SOAP body uses the
      `urn:Belkin:service:basicevent:1` namespace and sets BinaryState.
      Shares this path with GetBinaryState — disambiguated ONLY by SOAPACTION.
    request_body:
      content_type: "text/xml"
      fields:
        - name: "BinaryState"
          type: "integer"
          description: "Target relay state: 1 = on, 0 = off."
          required: true
          enum: [0, 1]
    response_body:
      content_type: "text/xml"
      fields:
        - name: "BinaryState"
          type: "integer"
          description: "Resulting state echoed by the device (may be 'Error' on failure)."

  - method: "POST"
    path: "/upnp/control/basicevent1"
    name: "GetBinaryState (read on/off)"
    description: >
      SOAP 1.1 action on the basicevent service. REQUIRED header
      (schema gap (c)): SOAPACTION:
      "urn:Belkin:service:basicevent:1#GetBinaryState".
      Content-Type: text/xml; charset="utf-8". Returns the current relay
      state. Shares the /upnp/control/basicevent1 path with SetBinaryState;
      the two differ ONLY by SOAPACTION header + body, which the schema
      cannot model as distinct endpoints. Async updates: UPnP SUBSCRIBE to
      /upnp/event/basicevent1.
    response_body:
      content_type: "text/xml"
      fields:
        - name: "BinaryState"
          type: "integer"
          description: "Current relay state: 1 = on, 0 = off."

  - method: "POST"
    path: "/upnp/control/insight1"
    name: "GetInsightParams (power/energy — Insight models)"
    description: >
      SOAP 1.1 action on the insight service (controlURL
      /upnp/control/insight1). Present ONLY on Insight-class devices, NOT on
      the basic Mini plug (F7C063 / WSP080 have no power metering). REQUIRED
      header (schema gap (c)): SOAPACTION:
      "urn:Belkin:service:insight:1#GetInsightParams".
      Content-Type: text/xml; charset="utf-8". Returns a colon-delimited
      InsightParams string carrying on/off state, on-for/on-today/on-total
      seconds, and instantaneous + cumulative power.
    response_body:
      content_type: "text/xml"
      fields:
        - name: "InsightParams"
          type: "string"
          description: >
            Colon-delimited: state:lastchange:onfor:ontoday:ontotal:timeperiod:
            averagepower:instantpower(mW):energytoday:energytotal:... (Insight only).

entities:
  - platform: "switch"
    name: "Smart Plug"
    device_class: "outlet"
    # State read via GetBinaryState; toggled via SetBinaryState. state_topic
    # points at the shared basicevent control path (HTTP endpoint reuse).
    state_topic: "/upnp/control/basicevent1"
    state_mapping:
      value: "BinaryState"
    commands:
      turn_on: "SetBinaryState"    # BinaryState=1
      turn_off: "SetBinaryState"   # BinaryState=0
      get_state: "GetBinaryState"

  - platform: "sensor"
    name: "Power"
    device_class: "power"
    unit: "W"
    # NOTE: Insight-only. The Mini plug (F7C063 / WSP080) does NOT expose
    # power metering; this entity applies to Wemo Insight-class devices that
    # implement /upnp/control/insight1 (GetInsightParams -> instantpower).
    state_topic: "/upnp/control/insight1"
    state_mapping:
      value: "InsightParams.instantpower"

# References (each verified to resolve 2026-07-11; two originally-suggested
# links 404'd and were dropped: 10c.github.io/wemo and ckuethe/wemo-utils).
references:
  - "https://github.com/pywemo/pywemo"
  - "https://github.com/pywemo/pywemo/blob/main/pywemo/ssdp.py"
  - "https://github.com/pywemo/pywemo/tree/main/pywemo/ouimeaux_device"
  - "https://github.com/pywemo/pywemo/tree/main/pywemo/ouimeaux_device/api/xsd"
  - "https://github.com/pywemo/pywemo/blob/main/pywemo/ouimeaux_device/api/wifi_setup.py"
  - "https://www.home-assistant.io/integrations/wemo/"
  - "https://github.com/home-assistant/core/tree/dev/homeassistant/components/wemo"
  - "https://github.com/iancmcc/ouimeaux"
