    verification: "reported"
  platform_host:
    direction: "Rabbit -> configured HTTP platform server for firmware and resources; separate from client -> rabbit root API."
    default_host_without_scheme: "andreax79.github.io/ServerlessNabaztag"
    derived_root: "The firmware appends /vl to the configured host."
    self_host: "Copy the repository's vl directory into a plain-HTTP server directory named vl and configure that server without http://."
    warning: "Never rewrite a rabbit-local /status, /left, or other action to the platform host, and never prefix those rabbit-local routes with /vl."
  external_dependencies:
    resource_fetch:
      routes: ["/play"]
      direction: "Rabbit -> URL supplied by caller"
      requirement: "Plain HTTP only; HTTPS is unsupported. Availability and content are outside the rabbit-local API."
      local_alternative: "Serve the MP3 from a trusted LAN HTTP server."
    weather:
      routes: ["/update-weather", "/setup"]
      provider: "open-meteo, per README; exact endpoints are outside OpenAPI"
      direction: "Rabbit -> external weather/air-quality provider"
      impact: "Weather and air-quality refresh stop when the provider is unreachable; direct LED and other basic local actions remain separate."
      local_alternative: "A compatible trusted-LAN provider or manually set /weather and /pollution codes."
    ntp:
      routes: ["/update-time", "/setup"]
      provider: "Configured NTP server; hostname and port are not specified by the reviewed OpenAPI/README"
      direction: "Rabbit -> configured time server"
      impact: "Automatic time and time-dependent sounds/schedules can be wrong or stop when unavailable."
      local_alternative: "Configure a trusted LAN NTP server."
    ai:
      routes: ["/ask", "/setup-ai"]
      provider: "Owner-configured stateful Node.js realtime relay and its external OpenAI connection"
      direction: "Rabbit -> plain-HTTP LAN relay -> TLS/WSS OpenAI service"
      default_state: "Assistant and experimental wake word disabled by default."
      relay_requirements: "Node.js and FFmpeg on a trusted LAN host; restrict the relay port to that LAN."
      secret_rule: "OPENAI_API_KEY and TTS_SIGNING_SECRET exist only in the relay's protected environment. They are never accepted by /setup-ai, stored in rabbit flash, exposed through /status, or sent over the rabbit's plain-HTTP hop."
      impact: "AI turns and experimental wake word are unavailable without the relay/external service; non-AI local actions are independent."
  action_semantics:
    ear_direction: {0: "forward", 1: "backward"}
    ear_position: {minimum: 0, maximum: 16, units: "device-specific positions, not degrees"}
    nose_values: [0, 1, 2, 3, 4]
    led_fields: {n: "nose", l: "left", c: "center", r: "right", b: "base"}
    led_value: "#rrggbb or -1 to disable override"
    weather_values: [0, 1, 2, 3, 4, 5]
    stock_values: [0, 1, 2, 3, 4, 5, 6]
    traffic_values: [0, 1, 2, 3, 4, 5, 6]
    pollution_range: [0, 10]
    service4_service5: "Integer with no OpenAPI range or labels; do not invent one."
    mail_values: [0, 1, 2, 3]
  lifecycle:
    telnet: "README also describes a Forth Telnet service on port 22 and configurable login settings; its authentication and protocol are outside the OpenAPI and this spec."
    stop_scope: "/stop halts current movements and sound; /abort plays a sound. Neither is represented as a universal emergency stop for external tools or AI-invoked actions."
    firmware_update: "Resource installation is an owner-led replacement-firmware operation. No generic firmware-upload endpoint or safe update procedure is declared here."

local_access:
  status: "firmware_replacement"
  summary: >
    ServerlessNabaztag puts an HTTP API on the rabbit itself after replacement
    firmware and a resource platform are configured. Direct root actions do not
    require the old Violet/Mindscape cloud. External resources and optional
    services retain the separate dependencies listed above.
  covers:
    - "Device-local action, ear, LED, sound, sleep/wake, status, settings, and advanced routes"
    - "Owner-hosted /vl firmware and resource platform"
    - "Direct LED status setting without a weather/stock/traffic provider"
  not_covered:
    - "Stock Nabaztag v1/v2 or Karotz protocols"
    - "NTP and weather freshness without their configured providers"
    - "AI without the relay and its external service"
    - "Arbitrary MP3/resource fetching without a reachable plain-HTTP source"
    - "The unspecified optional web/Telnet authentication flow"

remaining_unknowns:
  - "Exact optional web/Telnet authentication mechanism and whether a given configuration requires it on root API routes."
  - "Property schemas for /status, /animations, /tasks, and /forth responses; OpenAPI declares only JSON objects."
  - "Human meanings of numeric nose/weather/stock/traffic/mail codes beyond the published ranges."
  - "Factory-reset existence and erase scope; head-button setup mode is not evidence of erasure."
  - "NTP provider defaults, speech-service backing for /say, and exact external weather/resource endpoints."
  - "All operations are source-reported and untested against a rabbit by this project."

evidence:
  documentation_review: >
    Read the replacement project's README and OpenAPI 1.1.0 at commit
    63e654955aadffeff82786d03d345cd6e910d230. Every one of the 34 operations is
    represented with its original method, parameter schema, body encoding, and
    response. External dependencies and relay-secret boundaries come from README,
    not invented route security schemes.
  open_questions: >
    OpenAPI does not define response-object fields, error responses, security
    schemes, or numeric code labels. The README's optional password protection
    and NTP defaults are not expanded into guesses.
  artifacts:
    - type: "public_implementation"
      artifact: "andreax79/ServerlessNabaztag 63e654955aadffeff82786d03d345cd6e910d230"
      url: "https://github.com/andreax79/ServerlessNabaztag/tree/63e654955aadffeff82786d03d345cd6e910d230"
      obtained_via: "Public source repository"
      description: "Replacement firmware, device-local OpenAPI, setup flow, resource platform, and AI relay documentation."

