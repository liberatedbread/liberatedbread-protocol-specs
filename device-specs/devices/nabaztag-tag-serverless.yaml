device:
  name: "Nabaztag/tag (ServerlessNabaztag replacement firmware)"
  manufacturer: "Violet / Mindscape (hardware); ServerlessNabaztag project (replacement firmware)"
  manufacturer_status: "shutdown"
  testing:
    status: untested
    notes: >
      Transcribed from ServerlessNabaztag 63e654955aadffeff82786d03d345cd6e910d230,
      vl/api/openapi.yaml version 1.1.0 and README. No rabbit, SoftAP, local
      HTTP route, resource host, NTP service, weather service, or AI relay was
      contacted. Host tests exercise the document, not physical hardware.
  protocol: "wifi"
  transport: "http"
  category: "robot"
  type: "companion-robot-custom-firmware"
  integration: "supported"
  aliases: ["Nabaztag", "Nabaztag:tag", "Serverless Nabaztag"]
  openness:
    status: "open_by_design"
    reverse_engineered: false
    source_code: "https://github.com/andreax79/ServerlessNabaztag"
    upstream_docs:
      - url: "https://github.com/andreax79/ServerlessNabaztag/blob/63e654955aadffeff82786d03d345cd6e910d230/vl/api/openapi.yaml"
        title: "Serverless Nabaztag OpenAPI 1.1.0"
        covers: "Every device-local route, method, parameter, encoding, and declared response."
      - url: "https://github.com/andreax79/ServerlessNabaztag/blob/63e654955aadffeff82786d03d345cd6e910d230/README.md"
        title: "ServerlessNabaztag setup and operation"
        covers: "SoftAP setup, /vl platform semantics, resource hosting, optional services, and relay key placement."
    notes: >
      Open replacement firmware with a published device-local OpenAPI. No stock
      Violet/Mindscape server protocol is claimed, and no licence is inferred
      for the repository because the reviewed root has no licence file.
  notes: >
    SCOPE: this spec is for a Nabaztag/tag after installation of
    ServerlessNabaztag replacement firmware. It is not the stock rabbit's v1
    polling or v2 XMPP protocol, and it does not cover Karotz.

    The rabbit serves HTTP on its own address at the root paths in
    http_endpoints. The separate configured platform host supplies firmware and
    resources below /vl; that host is not the rabbit and /vl is not a prefix for
    the rabbit's local action routes. Basic actions are device-local once the
    replacement firmware and resources are installed. Weather, NTP, AI, and
    arbitrary resource fetching have separate external dependencies declared in
    protocol_details.external_dependencies.
  identification:
    ssid_prefix: "Nabaztag"
    default_port: 80
    notes: >
      A provisioned rabbit has no documented mDNS/SSDP identity. Find its DHCP
      address at the router or select it manually. The setup AP name is
      Nabaztag<XX>; do not identify arbitrary stock rabbits as running this
      replacement firmware without checking their configuration.
  discovery:
    none: "No automatic LAN discovery protocol is documented for this replacement firmware; use the DHCP assignment shown by the router or enter the rabbit address manually."
  admin_url: "http://{address}/"
  setup:
    required: true
    confidence: "medium"
    notes: >
      Setup installs the replacement firmware, joins the setup AP, and points
      the rabbit at a plain-HTTP platform host. The published flow has not been
      replayed here. Self-hosting the vl directory removes the dependency on
      the project's GitHub Pages resource host but not the need for a resource
      host during installation and resource updates.
    methods:
      - type: "softap_http"
        name: "Head-button setup AP and platform host"
        verified: false
        description: >
          Hold the head button while applying power, release when every LED is
          blue, then use the configuration page at 192.168.0.1. Set the Violet
          Platform to andreax79.github.io/ServerlessNabaztag without an HTTP
          scheme, or to a self-hosted plain-HTTP server holding the vl folder.
          The firmware appends /vl itself.
        softap:
          ssid_prefix: "Nabaztag"
          ssid_examples: ["NabaztagXX"]
          gateway_ip: "192.168.0.1"
          port: 80
          credential_encryption:
            algorithm: "none; plain HTTP"
            notes: >
              The configuration page is plain HTTP. Any Wi-Fi passphrase or
              settings entered there have no TLS protection. The README does
              not specify the form fields or an application-layer cipher.
        steps:
          - action: "Unplug the rabbit, hold the button on its head, and restore power while continuing to hold it."
            actor: "user"
            expect: "All lights turn blue; release the head button."
          - action: "Join the Nabaztag<XX> setup Wi-Fi network and open http://192.168.0.1."
            actor: "client"
            expect: "The rabbit's configuration page loads."
          - action: "In General Info, set Violet Platform to andreax79.github.io/ServerlessNabaztag or a trusted self-hosted equivalent, without http://. Do not add /vl manually."
            actor: "user"
            expect: "The platform host has no scheme and the firmware can derive its /vl resource root."
          - action: "Select Update settings and wait for the rabbit to reboot."
            actor: "device"
            expect: "The rabbit joins its configured network and serves the root HTTP UI/API on its DHCP address."
          - action: "Find the assigned address at the router and open the root web interface; configure optional services only after choosing their external dependencies."
            actor: "client"
            expect: "Device-local routes such as /status respond on the rabbit, not on the /vl platform host."
    factory_reset:
      applicable: "unknown"
      confidence: low
      effect: >
        Not established. The head-button sequence enters setup mode; the README
        does not establish that it erases Wi-Fi credentials, settings, scripts,
        or paired clients, and no separate factory-reset procedure is asserted.
      description: >
        Use the setup sequence to change configuration, not as evidence of a
        complete erase. Firmware replacement and factory reset are separate.
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        Re-enter the same head-button setup AP to change network/platform
        settings. No factory reset is required by the published setup flow.
      steps:
        - action: "Hold the head button while applying power and release when all lights are blue."
          actor: "user"
          expect: "The Nabaztag<XX> setup AP appears."
        - action: "Open http://192.168.0.1, update the desired settings, select Update settings, and wait for reboot."
          actor: "client"
          expect: "The rabbit returns with the new configuration."
    credentials:
      wifi_passphrase_protection: "plaintext"
      stored_on_device:
        - "Wi-Fi and replacement-firmware settings"
        - "Optional owner-configured web/Telnet login settings, if enabled"
      issued_to_client: []
      notes: >
        The setup page uses plain HTTP. The README mentions optional simple
        password protection for web and Telnet but does not specify its API
        exchange, so no Authorization header, cookie, pairing token, or default
        credential is invented. The OpenAI API key and TTS signing secret belong
        only on the AI relay, never on the rabbit.
  pairing:
    required: "unknown"
    confidence: low
    security_mode: "unknown"
    bonding: "none"
    enter_pairing_mode:
      required: false
      notes: >
        There is no pairing-mode exchange in the OpenAPI. The setup AP is a
        provisioning state, not proof of client pairing.
    unpair:
      supported: "unknown"
      notes: >
        Revocation for an optional web/Telnet password is not documented.
    notes: >
      OpenAPI 1.1.0 declares no security scheme, but the README also mentions
      optional simple password protection without defining its HTTP behavior.
      Consequently the need for credentials on a configured rabbit is unknown,
      not an assertion that every route is open. Implement the documented
      unauthenticated requests only where the owner's configuration permits and
      do not guess an auth mechanism.

http_endpoints:
- method: GET
  path: /taichi
  name: Tai Chi choreography
  description: Start the Tai Chi choreography on the rabbit.
- method: GET
  path: /nose
  name: Nose LED state
  description: Set nose LED status value.
- method: GET
  path: /left
  name: Left ear position
  description: Move the left ear to position 0-16 in the selected direction.
- method: GET
  path: /right
  name: Right ear position
  description: Move the right ear to position 0-16 in the selected direction.
- method: GET
  path: /clear
  name: Clear service LEDs
  description: Clear all informational service LED states.
- method: GET
  path: /weather
  name: Weather LED status
  description: Set the weather display code directly; this is not the external weather refresh route.
- method: GET
  path: /stock
  name: Stock trend LED status
  description: Set stock-market trend display code.
- method: GET
  path: /traffic
  name: Traffic LED status
  description: Set traffic display code.
- method: GET
  path: /pollution
  name: Pollution LED status
  description: Set pollution display level.
- method: GET
  path: /service4
  name: Generic service 4 LED status
  description: Set generic service 4 status; OpenAPI gives no bounded enum.
- method: GET
  path: /service5
  name: Generic service 5 LED status
  description: Set generic service 5 status; OpenAPI gives no bounded enum.
- method: GET
  path: /mail
  name: Mail LED status
  description: Set mail indicator value.
- method: POST
  path: /leds
  name: LED color overrides
  description: 'Set nose (n), left (l), center (c), right (r), and base (b) overrides. Each is #rrggbb or -1 to disable the override; omitted fields are allowed.'
  request_body:
    content_type: application/x-www-form-urlencoded
    fields:
    - name: n
      type: string
      required: false
      description: Nose LED color override.
    - name: l
      type: string
      required: false
      description: Left LED color override.
    - name: c
      type: string
      required: false
      description: Center LED color override.
    - name: r
      type: string
      required: false
      description: Right LED color override.
    - name: b
      type: string
      required: false
      description: Base LED color override.
    example: n=-1&l=%23ff0000&c=%2300ff00&r=-1&b=-1
- method: GET
  path: /communication
  name: Communication sound
  description: Play the Communication sound.
- method: GET
  path: /ack
  name: Ack sound
  description: Play the Ack sound.
- method: GET
  path: /abort
  name: Abort sound
  description: Play the Abort sound; the name is a sound effect, not a safety-stop guarantee.
- method: GET
  path: /ministop
  name: Ministop sound
  description: Play the Ministop sound.
- method: GET
  path: /play
  name: Play MP3 URL
  description: Fetch and play an MP3 from a plain HTTP URL; HTTPS is not supported and the fetch target is an external dependency.
- method: GET
  path: /say
  name: Text to speech
  description: Speak text. The OpenAPI does not define the backing speech service or its availability offline.
- method: GET
  path: /surprise
  name: Surprise action
  description: Perform the surprise choreography with ear movement and sound.
- method: GET
  path: /stop
  name: Stop activity
  description: Stop current movements and sound playback.
- method: GET
  path: /sleep
  name: Sleep
  description: Put the rabbit to sleep.
- method: GET
  path: /wakeup
  name: Wake up
  description: Wake the rabbit.
- method: GET
  path: /status
  name: Device status
  description: Return current status as a JSON object. OpenAPI defines no property names, so no field-level entity or secret-free schema is inferred beyond the README's statement that no API credential is exposed.
  response_body:
    content_type: application/json
- method: GET
  path: /animations
  name: Service animations
  description: Return available animations grouped by service as an otherwise unspecified JSON object.
  response_body:
    content_type: application/json
- method: GET
  path: /update-time
  name: Refresh system time
  description: Force an update from the configured NTP server; NTP is a separate external dependency and its host is not named in OpenAPI.
- method: GET
  path: /update-weather
  name: Refresh weather
  description: Fetch weather using the configured location and external weather provider; this differs from directly setting /weather LEDs.
- method: GET
  path: /reboot
  name: Reboot rabbit
  description: Restart the rabbit and temporarily interrupt local control.
  advanced: true
  advanced_reason: Reboot interrupts all activity and network availability. Confirm the owner intends a restart; this is not a factory reset.
- method: GET
  path: /setup
  name: General settings
  description: Set location, language, timezone/DST, sleep/wake hours, and Tai Chi frequency. All parameters are optional.
- method: GET
  path: /ask
  name: Start AI turn
  description: Send text to the configured realtime relay asynchronously; requires the optional external AI relay/service.
- method: POST
  path: /setup-ai
  name: AI settings form
  description: Save non-secret AI preferences as a form. POST is preferred for the personality prompt. No API key parameter exists or may be added.
  request_body:
    content_type: application/x-www-form-urlencoded
    fields:
    - name: e
      type: integer
      required: false
      enum:
      - 0
      - 1
    - name: b
      type: integer
      required: false
      enum:
      - 0
      - 1
    - name: w
      type: integer
      required: false
      enum:
      - 0
      - 1
    - name: s
      type: integer
      required: false
      min: 0
      max: 255
    - name: r
      type: integer
      required: false
      min: 2
      max: 20
    - name: t
      type: integer
      required: false
      min: 15
      max: 255
    - name: u
      type: string
      required: false
    - name: m
      type: string
      required: false
    - name: v
      type: string
      required: false
    - name: l
      type: string
      required: false
    - name: p
      type: string
      required: false
    - name: o
      type: string
      required: false
    - name: n
      type: string
      required: false
- method: GET
  path: /setup-ai
  name: AI settings query
  description: Update non-secret AI preferences through query parameters. Never accepts an OpenAI API key.
- method: GET
  path: /tasks
  name: Task status
  description: Return the task list as an otherwise unspecified JSON object.
  response_body:
    content_type: application/json
- method: POST
  path: /forth
  name: Execute Forth
  description: Execute arbitrary Forth code and return a JSON object. This exposes the full rabbit programming environment, not a restricted action vocabulary.
  advanced: true
  advanced_reason: Arbitrary Forth can move hardware, change settings, access network functions, and run operations outside this spec's safe route catalogue. Require explicit owner intent and review the code.
  request_body:
    content_type: application/x-www-form-urlencoded
    fields:
    - name: c
      type: string
      required: true
      description: Forth code to execute.
    example: c=left-ear+forward+10+move-ear
  response_body:
    content_type: application/json
commands:
  stop_activity:
    description: "Stop current ear movements and sound."
    transport: "http"
    method: "GET"
    path: "/stop"
    verification: "reported"
  sleep_rabbit:
    description: "Put the rabbit to sleep."
    transport: "http"
    method: "GET"
    path: "/sleep"
    verification: "reported"
  wake_rabbit:
    description: "Wake the rabbit."
    transport: "http"
    method: "GET"
    path: "/wakeup"
    verification: "reported"
  left_ear_forward:
    description: "Move left ear forward to a position from 0 through 16."
    transport: "http"
    method: "GET"
    path: "/left?p={position}&d=0"
    parameters:
      position: {type: "integer", required: true, min: 0, max: 16}
    verification: "reported"
  right_ear_forward:
    description: "Move right ear forward to a position from 0 through 16."
    transport: "http"
    method: "GET"
    path: "/right?p={position}&d=0"
    parameters:
      position: {type: "integer", required: true, min: 0, max: 16}
    verification: "reported"
  nose_status:
    description: "Set nose status to one of the five OpenAPI codes; labels beyond numeric values are not published."
    transport: "http"
    method: "GET"
    path: "/nose?v={state}"
    parameters:
      state: {type: "integer", required: true, values: {0: "code 0", 1: "code 1", 2: "code 2", 3: "code 3", 4: "code 4"}}
    verification: "reported"
  reboot_rabbit:
    description: "Restart the rabbit; advanced and disruptive."
    transport: "http"
    method: "GET"
    path: "/reboot"
    advanced: true
    advanced_reason: "Interrupts activity and network availability; not a factory reset."
    verification: "reported"

entities:
  - platform: "button"
    name: "Stop activity"
    key: "stop"
    commands: {press: "stop_activity"}
    notes: "Stops current movement and sound; not a claim about any external or safety-critical process."
  - platform: "button"
    name: "Sleep"
    commands: {press: "sleep_rabbit"}
  - platform: "button"
    name: "Wake up"
    commands: {press: "wake_rabbit"}
  - platform: "number"
    name: "Left ear position"
    min: 0
    max: 16
    step: 1
    commands: {set_value: "left_ear_forward"}
    notes: "Write-only forward movement; OpenAPI defines no ear-position read-back field."
  - platform: "number"
    name: "Right ear position"
    min: 0
    max: 16
    step: 1
    commands: {set_value: "right_ear_forward"}
    notes: "Write-only forward movement; OpenAPI defines no ear-position read-back field."
  - platform: "select"
    name: "Nose status"
    state_mapping:
      options: {0: "code 0", 1: "code 1", 2: "code 2", 3: "code 3", 4: "code 4"}
    commands: {select_option: "nose_status"}
    notes: "Write-only numeric codes; the OpenAPI does not assign human labels or a status read-back field."

protocol_details:
  openapi:
    version: "3.0.3"
    api_version: "1.1.0"
    server: "http://{nabaztag_ip}; root paths on the rabbit itself"
    documentation_routes:
      openapi_json: "http://{nabaztag_ip}/openapi.json (README documentation, not an operation declared in the OpenAPI paths object)"
      swagger_ui: "https://andreax79.github.io/ServerlessNabaztag/vl/api/"
    operation_count: 34
    path_count: 33
    route_case: "Case-sensitive; preserve every path and single-letter parameter exactly."
    encoding: "Percent-encode query values and application/x-www-form-urlencoded fields once. In particular, a leading # in an LED color is %23 on the wire. Do not send JSON for the three form operations."
    response_rule: "Only the declared statuses are asserted: 204 with no documented body for commands, or 200 application/json for /status, /animations, /tasks, and /forth. JSON object properties are intentionally unspecified."
    operations:
      - method: GET
        path: /taichi
        responses:
          '204':
            description: Command sent successfully.
      - method: GET
        path: /nose
        query_parameters:
        - name: v
          in: query
          required: true
          schema:
            type: integer
            enum:
            - 0
            - 1
            - 2
            - 3
            - 4
        responses:
          '204':
            description: Command sent successfully.
      - method: GET
        path: /left
        query_parameters:
        - name: p
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 16
        - name: d
          in: query
          required: true
          schema:
            type: integer
            enum:
            - 0
            - 1
          description: 0 forward, 1 backward.
        responses:
          '204':
            description: Command sent successfully.
      - method: GET
        path: /right
        query_parameters:
        - name: p
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 16
        - name: d
          in: query
          required: true
          schema:
            type: integer
            enum:
            - 0
            - 1
          description: 0 forward, 1 backward.
        responses:
          '204':
            description: Command sent successfully.
      - method: GET
        path: /clear
        responses:
          '204':
            description: Command sent successfully.
      - method: GET
        path: /weather
        query_parameters:
        - name: v
          in: query
          required: true
          schema:
            type: integer
            enum:
            - 0
            - 1
            - 2
            - 3
            - 4
            - 5
        responses:
          '204':
            description: Command sent successfully.
      - method: GET
        path: /stock
        query_parameters:
        - name: v
          in: query
          required: true
          schema:
            type: integer
            enum:
            - 0
            - 1
            - 2
            - 3
            - 4
            - 5
            - 6
        responses:
          '204':
            description: Command sent successfully.
      - method: GET
        path: /traffic
        query_parameters:
        - name: v
          in: query
          required: true
          schema:
            type: integer
            enum:
            - 0
            - 1
            - 2
            - 3
            - 4
            - 5
            - 6
        responses:
          '204':
            description: Command sent successfully.
      - method: GET
