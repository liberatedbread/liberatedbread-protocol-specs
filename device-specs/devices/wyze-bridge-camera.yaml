# Wyze Cam (via docker-wyze-bridge) — Device Specification
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# Sources (public, clean-room derived facts only):
#   - mrlt8/docker-wyze-bridge README and Authentication/Network Connection Modes
#     wikis, pinned at bf893749b748f142199c9bce14fac44f8a661d6e.
#   - Wyze factory-reset article and model-specific quick-start guides.

device:
  name: "Wyze Cam (via docker-wyze-bridge)"
  manufacturer: "Wyze Labs"
  manufacturer_status: "active"
  testing:
    status: untested
    notes: >
      No camera or bridge was driven by this project. Supported models, TUTK
      session modes, stream URLs, slug construction and authentication are
      reported from docker-wyze-bridge; reset procedures come from Wyze support.
  protocol: "wifi"
  category: "camera"
  pictogram: "ip-camera"
  transport: "rtsp"
  integration: "identify_only"
  admin_url: "http://{address}:5000/"
  notes: >
    On stock firmware these cameras have no first-party general-purpose local
    API. The exception is the separate, model- and firmware-specific official
    RTSP branch documented in wyze-legacy-rtsp.yaml; that exception must not be
    generalized to other firmware or models.

    The community docker-wyze-bridge authenticates to the Wyze cloud and uses
    each camera's cloud-issued TUTK values, then serves RTSP, HLS and WebRTC on
    the bridge/NVR host. A Wyze account and developer API Key/ID are required;
    this is not an account-free or permanently cloud-isolated path. The bridge
    prefers a LAN upstream connection but can fall back to P2P or relay. The
    RTSP/HLS/WebRTC endpoints below are still local to the bridge host even
    when that upstream media path is relayed.

    identify_only reflects this project's missing video-player integration,
    not the bridge's capabilities. {address} is always the manually configured
    bridge/NVR host, never the camera address. A consumer with a player can use
    the opaque per-camera slug and authentication facts below.
  variants:
    - model: "WYZEC1"
      products: ["Wyze Cam v1 (HD only)"]
      verification: "reported"
    - model: "WYZEC1-JZ"
      products: ["Wyze Cam v2"]
      verification: "reported"
    - model: "WYZE_CAKP2JFUS"
      products: ["Wyze Cam v3", "Wyze Cam Floodlight v1"]
      verification: "reported"
      notes: >
        The model code is shared. Use the cloud product/accessory identity to
        distinguish the standalone v3 from Floodlight v1, especially for reset.
    - model: "HL_CAM3P"
      products: ["Wyze Cam v3 Pro (2K)"]
      verification: "reported"
    - model: "HL_CAM4"
      products: ["Wyze Cam v4 (2K)"]
      verification: "reported"
    - model: "WYZECP1_JEF"
      products: ["Wyze Cam Pan v1"]
      verification: "reported"
    - model: "HL_PAN2"
      products: ["Wyze Cam Pan v2"]
      verification: "reported"
    - model: "HL_PAN3"
      products: ["Wyze Cam Pan v3"]
      verification: "reported"
    - model: "HL_PANP"
      products: ["Wyze Cam Pan Pro (2K)"]
      verification: "reported"
    - model: "WVOD1"
      products: ["Wyze Cam Outdoor v1"]
      verification: "reported"
    - model: "HL_WCO2"
      products: ["Wyze Cam Outdoor v2"]
      verification: "reported"
    - model: "WYZEDB3"
      products: ["Wyze Cam Doorbell v1"]
      verification: "reported"
    - model: "HL_DB2"
      products: ["Wyze Cam Doorbell v2 (2K)"]
      verification: "reported"
    - model: "HL_CFL"
      products: ["Wyze Cam Floodlight v1"]
      verification: "reported"
      notes: >
        Floodlight v1 is also represented by WYZE_CAKP2JFUS with an HL_CFL
        accessory identity; do not infer Floodlight Pro from either code.
    - model: "HL_CFL2"
      products: ["Wyze Cam Floodlight v2 (2K)"]
      verification: "reported"
  openness:
    status: "hostile"
    reverse_engineered: true
    source_code: "https://github.com/mrlt8/docker-wyze-bridge"
    upstream_docs:
      - url: "https://github.com/mrlt8/docker-wyze-bridge/blob/bf893749b748f142199c9bce14fac44f8a661d6e/README.md#supported-cameras"
        title: "docker-wyze-bridge supported-camera table"
        covers: "The exact TUTK-supported product/model allowlist used here."
      - url: "https://github.com/mrlt8/docker-wyze-bridge/wiki/Authentication"
        title: "docker-wyze-bridge authentication"
        covers: "Default WB_AUTH, WB_API stream credentials and STREAM_AUTH alternatives."
      - url: "https://github.com/mrlt8/docker-wyze-bridge/wiki/Network-Connection-Modes"
        title: "docker-wyze-bridge network connection modes"
        covers: "LAN preference, P2P/relay fallback and NET_MODE=LAN."
    notes: >
      Wyze publishes no general local API for stock firmware. The bridge is an
      independent implementation of the TUTK transport and a local media server.
  identification:
    default_port: 8554
    notes: >
      There is no camera-discovery matcher in this spec. Select a supported
      cloud product/model and manually supply the bridge/NVR host. In
      particular, the bridge does not advertise _http._tcp on port 8554.
  discovery:
    none: >
      No automatic bridge discovery is documented. Cameras are enumerated from
      the owner's Wyze cloud account, not through an on-LAN _http8554 service.
      Ask the user for the bridge/NVR hostname or address and the camera's
      bridge slug; do not substitute the camera's own IP for {address}.
    identity:
      stable_keys: ["bridge_host", "camera_name"]
      display: "camera_name"
    static_ip_required: false
  setup:
    required: true
    confidence: "medium"
    notes: >
      Camera onboarding, camera enumeration and TUTK credentials all depend on
      the Wyze account/cloud. Cached bridge tokens may survive a restart, but
      permanent cloud isolation is explicitly unsupported upstream.
    methods:
      - type: "cloud_account"
        name: "Wyze cloud credentials and a community bridge"
        role: "primary"
        verified: false
        description: >
          Onboard a listed camera in the Wyze app, configure the bridge with the
          same account's email/password and developer API Key/ID, then consume
          streams on the bridge host. There is no account-free alternative.
        cloud:
          provider: "Wyze cloud and Wyze developer API"
          local_alternative: >
            Partial only: LAN mode keeps the upstream media on the LAN when it
            succeeds, and every re-served endpoint is on the bridge host. Wyze
            account/API access remains required and permanent isolation is not
            supported. NET_MODE=LAN rejects non-LAN upstream sessions rather
            than making the camera independent of the cloud.
        steps:
          - action: "Confirm that the exact product and model code appear in device.variants; do not try an excluded Gwell, Meari, Battery Cam Pro, Floodlight Pro, Doorbell Pro or HL_PAN4 product."
            actor: "user"
          - action: "Onboard the camera to a Wyze account in the vendor app."
            actor: "user"
          - action: "Create a Wyze developer API Key and API ID and configure docker-wyze-bridge with those values and the account email/password."
            actor: "user"
          - action: "Leave the default LAN preference, or set NET_MODE=LAN to reject P2P and relay sessions; do not describe either choice as permanent offline support."
            actor: "user"
          - action: "Manually configure the bridge/NVR host as {address}, derive {camera_name} with protocol_details.camera_slug, and use the selected local stream URL with the configured authentication."
            actor: "client"
            expect: "The bridge serves the camera on RTSP 8554, HLS 8888 or WebRTC 8889, subject to its authentication configuration."
    factory_reset:
      applicable: true
      confidence: "medium"
      effect: >
        Deletes the camera's settings file and returns it to setup. Remove the
        microSD card first; cloud recordings are outside this procedure. These
        procedures cover only standalone Cam v1, v2, v3 and Pan v1, not the
        other supported bridge products and not Floodlight v1 despite its
        shared WYZE_CAKP2JFUS model code.
      description: >
        Wyze gives Cam v1 a 20-second hold and the other three covered cameras
        a 10-second hold. Do not apply a generic hold to every bridge variant,
        and do not use a factory reset as a routine bridge reconnect step.
      procedures:
        - name: "Cam v1 Setup button held for 20 seconds"
          applies_to: ["WYZEC1"]
          product_names: ["Wyze Cam v1 (HD only)"]
          verified: false
          basis: "Wyze's factory-reset article for Cam v1/v2/v3/Pan v1 and the Cam v1 QSG."
          hold_seconds: 20
          power_state: "on"
          glyph: "generic/hold-button.svg"
          indicator: "Solid yellow changes to blinking yellow."
          indicator_glyph: "generic/led-flashing.svg"
          steps:
            - action: "Remove any microSD card. With the Cam v1 powered, hold its bottom Setup button for 20 seconds."
              actor: "user"
            - action: "Release and wait at least 30 seconds, allowing up to five minutes, until the light changes from solid yellow to blinking yellow."
              actor: "device"
              timeout_seconds: 300
        - name: "Cam v2 or Pan v1 Setup button held for 10 seconds"
          applies_to: ["WYZEC1-JZ", "WYZECP1_JEF"]
          product_names: ["Wyze Cam v2", "Wyze Cam Pan v1"]
          verified: false
          basis: "Wyze's factory-reset article for Cam v1/v2/v3/Pan v1 and the Cam v2/Pan v1 QSGs."
          hold_seconds: 10
          power_state: "on"
          glyph: "generic/hold-button.svg"
          indicator: "Solid yellow changes to blinking yellow."
          indicator_glyph: "generic/led-flashing.svg"
          steps:
            - action: "Remove any microSD card. With the Cam v2 or Pan v1 powered, hold its bottom Setup button for 10 seconds."
              actor: "user"
            - action: "Release and wait at least 30 seconds, allowing up to five minutes, until the light changes from solid yellow to blinking yellow."
              actor: "device"
              timeout_seconds: 300
        - name: "Standalone Cam v3 Setup button held for 10 seconds"
          applies_to: ["WYZE_CAKP2JFUS"]
          product_names: ["Wyze Cam v3"]
          excluded_product_names: ["Wyze Cam Floodlight v1"]
          verified: false
          basis: "Wyze's factory-reset article for Cam v1/v2/v3/Pan v1 and the standalone Cam v3 QSG."
          hold_seconds: 10
          power_state: "on"
          glyph: "generic/hold-button.svg"
          indicator: "The status light turns red."
          indicator_glyph: "generic/led-flashing.svg"
          steps:
            - action: "Confirm this is a standalone Cam v3, not Floodlight v1. Remove any microSD card and hold the powered camera's bottom Setup button for 10 seconds."
              actor: "user"
            - action: "Release and wait at least 30 seconds, allowing up to five minutes, until the status light turns red and the camera is ready to set up again."
              actor: "device"
              timeout_seconds: 300
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        Use the exact model's Wyze app setup/reconnect flow, then let the bridge
        rediscover the account device. A factory reset is not the default
        network-change procedure; if one becomes necessary, use only the
        matching procedure above. The bridge/NVR host may also need its own
        address updated in the client.
    credentials:
      wifi_passphrase_protection: "unknown"
      stored_on_device:
        - "Wi-Fi credentials on the camera"
        - "Per-camera TUTK values issued through the Wyze account"
      issued_to_client:
        - "Wyze account session and developer API Key/ID for the bridge"
        - "Bridge WB_PASSWORD and unique WB_API key"
        - "Optional STREAM_AUTH per-user credentials"
      notes: >
        The bridge obtains per-camera TUTK values from the cloud device list.
        WB_API and stream credentials are separate from the Wyze developer API
        Key/ID. Keep all of them secret and never expose the media ports to an
        untrusted network.
  pairing:
    required: true
    confidence: "medium"
    security_mode: "app_layer"
    bonding: "none"
    pin:
      source: "vendor_app"
      notes: >
        There is no camera PIN. The cloud supplies the per-camera TUTK identity
        and secret to the bridge after account/developer-API authentication.
        Consumer-to-bridge authorization is independently controlled by
        WB_AUTH/WB_API and STREAM_AUTH as declared in
        protocol_details.bridge_authentication.
    exclusivity:
      single_connection: "unknown"
      single_bond: true
      recovery: >
        A camera belongs to one Wyze account. Remove it from the old account or
        use its exact reset procedure before adding it elsewhere. Close other
        TUTK clients if the bridge reports that the camera's session limit was
        reached; the numeric limit is not established here.
    unpair:
      supported: true
      requires_factory_reset: false
      clears: "The bridge's cloud/API authorization, or the camera's account binding when removed in the vendor app."
      notes: >
        Revoke the Wyze developer API key and clear cached bridge credentials
        to cut off that bridge. Remove the camera in the vendor app to release
        its account binding. Also rotate WB_API/STREAM_AUTH secrets when a
        stream consumer must lose access; revoking cloud access alone does not
        change credentials already configured on the local media server.
    enter_pairing_mode:
      required: false
    notes: >
      No Bluetooth-style pairing window exists. Cloud-issued camera values and
      local bridge credentials are separate app-layer gates.

local_access:
  status: "native"
  summary: >
    Stock cameras can use TUTK LAN mode through the community bridge, whose
    media endpoints are local. Account/API bootstrapping and continuing cloud
    dependence remain; permanent isolation is unsupported.
  covers:
    - "RTSP, HLS and WebRTC served by the manually configured bridge/NVR host"
  not_covered:
    - "Account-free onboarding or camera enumeration"
    - "A guarantee of LAN-only upstream media unless NET_MODE=LAN is enforced"
    - "Permanent cloud isolation"
    - "Models outside device.variants"

camera:
  enable_required: true
  enable_notes: >
    Run docker-wyze-bridge with the Wyze account and developer API Key/ID.
    Select a supported cloud product/model and manually supply the bridge/NVR
    host. These streams are not served by the camera's own address.
  feed_host_source: "nvr"
  streams:
    - name: "Local RTSP (via bridge)"
      transport: "rtsp"
      url_template: "rtsp://{address}:8554/{camera_name}"
      default_port: 8554
      served_by: "nvr"
      auth: "WB_AUTH/WB_API or STREAM_AUTH; see protocol_details.bridge_authentication"
      notes: "{address} is the bridge/NVR host; {camera_name} is the bridge slug."
    - name: "Local HLS (via bridge)"
      transport: "hls"
      url_template: "http://{address}:8888/{camera_name}/stream.m3u8"
      default_port: 8888
      served_by: "nvr"
      auth: "WB_AUTH/WB_API or STREAM_AUTH; see protocol_details.bridge_authentication"
      notes: "Actual MediaMTX HLS playlist path on the bridge/NVR host."
    - name: "Local WebRTC (via bridge)"
      transport: "webrtc"
      url_template: "http://{address}:8889/{camera_name}"
      default_port: 8889
      served_by: "nvr"
      auth: "WB_AUTH/WB_API or STREAM_AUTH; see protocol_details.bridge_authentication"
      notes: "MediaMTX WebRTC endpoint; additional WebRTC/ICE configuration may be required in standard Docker mode."

protocol_details:
  source_revision: "bf893749b748f142199c9bce14fac44f8a661d6e"
  verification: "reported"
  supported_camera_scope:
    source: "https://github.com/mrlt8/docker-wyze-bridge/blob/bf893749b748f142199c9bce14fac44f8a661d6e/README.md#L161-L188"
    rule: "Allow only device.variants and their listed products. Unknown, warning-marked and different-SDK products are denied, not experimental matches."
    excluded:
      - "HL_PAN4"
      - "All Gwell models, including GW_GC1 and GW_GC2"
      - "All Meari models"
      - "Battery Cam Pro (AN_RSCW)"
      - "Floodlight Pro (LD_CFP)"
      - "Doorbell Pro (GW_BE1) and Doorbell Pro 2 (AN_RDB1)"
  tutk_sessions:
    cloud_account_and_api_required: true
    preferred_mode: 2
    permanent_isolation_supported: false
    modes:
      - {value: 0, name: "P2P", meaning: "Direct peer-to-peer upstream path over the internet."}
      - {value: 1, name: "relay", meaning: "Upstream media relayed through Wyze servers; local bridge endpoints do not move into the cloud."}
      - {value: 2, name: "LAN", meaning: "Upstream media flows directly between camera and bridge on the LAN."}
    default: "ANY tries LAN first, then can fall back to P2P or relay."
    lan_only: "NET_MODE=LAN rejects any session whose numeric mode is not 2."
  camera_slug:
    default_separator: "-"
    algorithm:
      - "Trim leading/trailing whitespace from the Wyze nickname (or use the MAC when no nickname exists)."
      - "Replace every ASCII space with a hyphen."
      - "Apply the upstream default-name filter: retain ASCII letters, digits, underscore, hyphen and plus; remove other non-ASCII/special characters."
      - "Lowercase the result."
    examples:
      - {nickname: "Front Porch Cam", camera_name: "front-porch-cam"}
      - {nickname: "Garage+East", camera_name: "garage+east"}
    overrides_out_of_scope: "URI_SEPARATOR and URI_MAC can change upstream names; this spec uses the unmodified default only."
  bridge_authentication:
    default:
      WB_AUTH: true
      stream_username: "wb"
      stream_password_source: "The unique WB_API key shown at the bottom of the bridge Web UI, or an explicitly configured WB_API value."
      webui_username_default: "wbadmin"
      webui_password_source: "WB_PASSWORD; if unset, the bridge derives it from the Wyze email local part."
      rest_api: "The WB_API key is accepted in the api query parameter or api header."
    custom_stream_auth:
      variable: "STREAM_AUTH"
      syntax: "user:password[:client-ip[,client-ip...]][@path[,path...]], with multiple entries separated by |"
      behavior: "Each entry can grant a user all paths or only named camera slugs. When WB_AUTH supplies WB_API and STREAM_AUTH is also set, both mechanisms are configured."
    explicitly_disabled:
      configuration: "WB_AUTH=false with STREAM_AUTH unset"
      behavior: "An anonymous MediaMTX read user is configured and the streams need no credentials."
      warning: "This is a deliberate insecure choice for a trusted isolated LAN, not the default and not safe port-forwarding exposure."
  reset_product_scope: ["Wyze Cam v1 (HD only)", "Wyze Cam v2", "Wyze Cam v3", "Wyze Cam Pan v1"]

evidence:
  documentation_review: >
    The supported-camera allowlist is transcribed from README lines 161-188 at
    the pinned bridge revision. Authentication and network-mode behavior were
    checked against the project wikis and public implementation. Wyze's current
    factory-reset article supplies the v1-specific 20-second hold and the
    10-second hold for the other three covered products.
  artifacts:
    - type: "community_repo"
      artifact: "mrlt8/docker-wyze-bridge"
      sha256: "bf893749b748f142199c9bce14fac44f8a661d6e"
      url: "https://github.com/mrlt8/docker-wyze-bridge"
      obtained_via: "Public Git repository, reviewed 2026-11-18"
      description: "Source for models, stream behavior, slugs and authentication; the SHA is the reviewed Git commit, not a file digest."
  open_questions: >
    Exact per-firmware TUTK reliability, maximum concurrent camera sessions and
    how long cached credentials can survive without cloud access remain
    unverified. WebRTC support varies by model and host networking.

remaining_unknowns:
  - "No supported camera was streamed through the bridge by this project."
  - "The duration and failure mode of operation during an extended cloud outage are not established."
  - "Per-model WebRTC and substream support are not claimed by the three generic stream templates."
  - "Reset procedures for every non-v1/v2/v3/Pan-v1 bridge variant are deliberately not established here."

