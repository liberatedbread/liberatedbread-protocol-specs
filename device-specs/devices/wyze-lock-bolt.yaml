  - "Complete ID2 field ordering and CCM tag/parameters; no ID2 command is implemented."
  - "Exact advertised local names and any safe pre-connect model discriminator; NUS remains excluded."
  - "Credential rotation/revocation behavior, long-term offline acceptance and BLE central/bond limits."
  - "Door-state value mapping beyond the 0xFF sentinel and custom lock/door parent-service identity."
  - "OTA image, signature/rollback policy, bootloader identity and interrupted-update recovery."

evidence:
  app_static_analysis: >
    Wyze app 3.22.1.979 supplied the transport, CRC, two L2 generations,
    encrypted status layout, legacy challenge-response and the existence of an
    ID2 path. Descriptions here name protocol roles only; no internal app
    symbols, source paths, account endpoints or real credentials are included.
  public_implementations: >
    willdatrill2007/Wyze-Lock-Bolt-Local at
    1f128cbea748c17a17a52e76457314ac366aaf1b supplied the final independent
    CRC, field-order, session-flag and marker checks. Earlier research also
    cross-checked its owner-export helper at
    46ca436aeceadfeabbcab9593ad1b9a31b189368 without running it.
    tpawley2001/Wyze-Bolt-WiFi-Bridge-ESP32 at
    c212299aa104802f9a6c147a39c609d859226a48 independently corroborates the
    battery block and radio boundary. Public live success remains reported.
  documentation_review: >
    Official v1 quick-start, setup, reset and v1/v2 comparison pages establish
    model scope, physical pairing, initial Internet dependency and reset. The
    quick-start's battery removal is a power cycle, not a substitute for the
    app's Delete Device reset.
  open_questions: >
    A sanitized owner capture of read-only status and one deliberately attended
    legacy operation is still needed to establish current-firmware dialect,
    challenge field placement and post-command notification behavior.
