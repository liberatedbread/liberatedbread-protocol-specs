# Wyze Lock Bolt v1 (WLCKB1 / XFPL106 / YD_BT1) local BLE protocol
# Copyright 2026 Pigs Can Fly Labs LLC
# SPDX-License-Identifier: Apache-2.0
#
# Static app analysis plus public implementations. No lock, BLE capture,
# account, owner credential or actuation was used by this project.

device:
  name: "Wyze Lock Bolt v1 (WLCKB1)"
  manufacturer: "Wyze Labs"
  manufacturer_status: "active"
  testing:
    status: untested
    notes: >
      No Wyze lock, owner account, real key material or BLE capture was used.
      L1/L2 framing, encrypted status and legacy challenge-response come from
      the reviewed vendor protocol codec, cross-checked against the pinned
      public local integrations. Public implementation success is reported
      evidence, not a hardware run by this project. ID2 firmware selection is
      unresolved and no ID2 actuation is offered.
  protocol: "ble"
  transport: "ble-gatt"
  category: "lock"
  type: "electronic_door_lock"
  integration: "identify_only"
  aliases: ["Wyze Lock Bolt", "WLCKB1", "XFPL106", "YD_BT1"]
  distributors:
    - name: "Wyze Labs"
      role: "brand"
      notes: "Retail brand and account/cloud operator."
    - name: "Lockin / Yunding"
      role: "oem"
      notes: "Protocol and hardware platform partner named by the v1 quick-start guide; not an assertion that other Lockin products are compatible."
  companion_apps:
    - name: "Wyze"
      package: "com.hualai"
      role: "primary"
      platform: "android"
      notes: "Initial v1 provisioning and cloud-backed owner credential source. Not needed for later BLE sessions after export."
  variants:
    - model: "WLCKB1"
      name: "Wyze Lock Bolt v1 (app model XFPL106, factory family YD_BT1)"
      notes: "BLE-only v1 with fingerprint/keypad and four AA batteries. This is the only model covered by this spec."
      verification: "reported"
  notes: >
    SCOPE IS v1 ONLY. Wyze Lock Bolt v2 adds Wi-Fi and is a different product;
    do not apply this BLE credential or frame profile to it. The older Wyze
    Lock, the separate Lock Bolt Keypad, gateways and other Yunding products
    are also out of scope.

    Consumer integration is identify_only and manual-selection-only. Nordic
    UART Service (NUS) is a shared byte transport, never Wyze identity. A scan
    must not select this spec from NUS, an unknown name or manufacturer data.
    The owner selects WLCKB1 explicitly, supplies that lock's exported address
    and credentials, and a dedicated handler validates encrypted status before
    any write. There are no generic entities or executable command bindings.

    Once the owner has exported the cloud device UUID, 32-character BLE token,
    numeric BLE key id and lock address, later operation is local BLE without
    cloud access. The UUID's last 16 ASCII characters decrypt state/door/
    battery. The token's last 16 ASCII characters are the legacy operate key.
    These are account-bound per-lock secrets: keep them out of logs, docs,
    diagnostics and shell history. Initial provisioning/export still requires
    the vendor cloud; no offline credential-issuance path is claimed.
  openness:
    status: "undocumented"
    reverse_engineered: true
    source_code: "https://github.com/willdatrill2007/Wyze-Lock-Bolt-Local/tree/1f128cbea748c17a17a52e76457314ac366aaf1b"
    notes: "No official local protocol document was found. Public implementations and the vendor codec agree on the legacy wire format; current-firmware acceptance of legacy versus ID2 remains unverified."
  safety_advisory:
    severity: "warning"
    summary: "Legacy lock/unlock moves a real deadbolt. It is advanced and attended only; NUS discovery, a timeout or an automatic scan must never actuate it."
    detail: >
      Keep a person at the door with the independent mechanical entry method
      available. Complete a fresh challenge, send at most one intentional
      command, require the result/ACK and validate the subsequent encrypted
      state notification. Never replay a timed-out actuation automatically,
      fall back to ID2, or expose either operation as a one-tap generic entity.
  identification:
    notes: >
      Deliberately empty of executable matchers. The vendor's normal connection
      flow resolves a provisioned lock by its account-associated BLE address,
      not by an advertised model name. NUS is shared with unrelated devices;
      manufacturer ID 0xFFFF is not a Wyze assignment. Manually select WLCKB1
      and confirm Device Information plus marker-valid encrypted status.
  discovery:
    none: >
      Manual selection only. Do not auto-identify from NUS, an advertisement
      name, company ID 0xFFFF or a bare address. The address is a connection
      locator supplied by the owner's device record, not public proof of model.
      Wyze Lock Bolt v2 and other Yunding devices are excluded.
    identity:
      stable_keys: ["owner_supplied_device_uuid", "owner_supplied_address"]
      display: "manual WLCKB1 selection"
      notes: "The account UUID is secret credential material and is never logged; retain it in a secret store. Re-resolve a changed BLE address through the owner record rather than guessing from a scan."
    static_ip_required: false
  setup:
    required: true
    confidence: "medium"
    notes: >
      First-time provisioning needs the Wyze app, Internet access and the
      account-backed device record. Official setup uses the physical P button
      under the batteries. A replacement client needs the four exported values
      above. After that, cloud-free local BLE works until credentials are
      rotated/revoked; actual longevity on current firmware is unverified.
    methods:
      - type: "cloud_account"
        name: "Provision/export once, then use cached credentials locally"
        role: "primary"
        verified: false
        description: >
          A staged owner route: official v1 setup and credential export once,
          then a dedicated local handler using only the cached values. The
          public extraction helper's account/API prerequisites are a boundary,
          not something this project ran or reproduces.
        cloud:
          provider: "Wyze account/device service"
          local_alternative: "No offline first-time credential issuance is known. Later sessions need only the cached per-lock UUID, token, BLE key id and address."
        steps:
          - action: "Install v1 WLCKB1 with four AA batteries, enable Bluetooth and Internet access, and stay within about 16 feet of the lock."
            actor: "user"
          - action: "In the Wyze app select the v1 Lock Bolt, then press and hold the round P button under the batteries until release produces three beeps and a white flashing keypad."
            actor: "user"
            expect: "The app connects and completes initial v1 setup; do not confuse this with the Wi-Fi-capable v2."
          - action: "Through an owner-authorized account export, privately record the device UUID, BLE token, numeric BLE key id and lock address in a secret store; never paste them into shared logs."
            actor: "user"
            expect: "All four values are available offline. The UUID/token suffixes are not printed or committed."
          - action: "Manually select WLCKB1, connect and subscribe to UART/state, read Device Information, and require a 16-byte encrypted status block to decrypt with zero padding and ASCII loock at bytes 11..15."
            actor: "client"
            expect: "Read-only status and battery validate. Stop on another model, bad marker/padding or an ID2-only dialect; do not send actuation."
        troubleshooting:
          - symptom: "A generic battery reader returns nonsense or status decryption fails."
            causes:
              - "Battery 0x2A19 is not a plain SIG byte here: decrypt exactly one AES block with the UUID suffix and require the marker and zero padding."
              - "The selected device may not be the provisioned v1, or the exported UUID/address may belong to another lock."
          - symptom: "The legacy command is not accepted."
            causes:
              - "Current firmware may require the unresolved ID2 path. Do not retry with guessed CCM parameters or replay the legacy command; capture owner-authorized read-only traffic first."
          - symptom: "The lock cannot be found after migration."
            causes:
              - "Close the other central, use an active Bluetooth proxy if range is poor, and re-check the owner-supplied address rather than identifying every NUS advertiser."
    factory_reset:
      applicable: true
      confidence: "medium"
      effect: >
        Returns the lock to new-device setup. Treat stored users/settings and
        previously exported client credentials as no longer usable; exact key
        rotation is not established. Re-provision and export fresh values.
      description: >
        Official v1 factory reset is Delete Device in the Wyze app while in BLE
        range, confirmed by a short series of beeps. Removing/reinserting one
        battery is only a power cycle. Do not power-cycle during the pairing
        period: official guidance warns that pairing-button plus battery
        removal can delete all users and settings.
      procedures:
        - name: "Delete the v1 lock in the official app"
          verified: false
          basis: "Official Wyze v1 factory-reset guide, updated 2024-05-02; not executed by this project."
          power_state: "on"
          indicator: "A short series of beeps confirms the reset."
          steps:
            - action: "Keep the door attended and move within Bluetooth range of the v1 lock."
              actor: "user"
            - action: "In the Wyze app open the v1 lock and choose Settings, then Delete Device."
              actor: "user"
              expect: "A short beep series confirms factory reset; set the lock up as a new device and export fresh credentials."
            - action: "Do not remove a battery during pairing; if only a power cycle is intended, stop and use the separate battery power-cycle procedure instead."
              actor: "user"
    rejoin:
      in_place_supported: true
      requires_factory_reset: false
      notes: >
        There is no Wi-Fi network on v1. A client holding the current exported
        values reconnects over BLE without cloud access. A new client needs an
        owner-authorized export; loss/rotation of those values requires the
        vendor account, not an automatic factory reset.
      steps:
        - action: "Close the previous central and select the exact provisioned WLCKB1 manually."
          actor: "user"
        - action: "Reconnect with cached credentials and validate read-only status before any write; fetch fresh values only if the lock rejects them."
          actor: "client"
    credentials:
      wifi_passphrase_protection: "not_applicable"
      stored_on_device:
        - "Account-bound device identity and legacy BLE operation credentials"
        - "Owner access codes, fingerprints and settings, managed outside this spec"
      issued_to_client:
        - "Device UUID: state/door/battery AES key is its last 16 ASCII characters"
        - "32-character BLE token: legacy operate key is its last 16 ASCII characters"
        - "Numeric BLE key id, encoded uint16 big-endian under legacy L2 key 0x05"
        - "BLE address used to locate the provisioned lock"
      notes: >
        v1 has no Wi-Fi. The four exported values are live owner secrets or
        secret-associated locators; no real value appears in this spec. The
        public helper requires the owner's account and developer API
        credentials, but its endpoints and output are deliberately not copied.
  pairing:
    required: true
    confidence: "medium"
    security_mode: "app_layer"
    bonding: "none"
    exclusivity:
      single_connection: "unknown"
      single_bond: "unknown"
      recovery: "Close the vendor app/other central and reconnect with the cached owner values; do not erase users/settings to resolve a busy link."
    enter_pairing_mode:
      required: true
      indicator: "Three beeps and a white flashing keypad after releasing the P button."
      procedures:
        - name: "Hold the round P button under the batteries"
          verified: false
          basis: "Official Wyze Lock Bolt v1 setup guide, updated 2025-03-24; not replayed here."
          power_state: "on"
          indicator: "Three beeps and white keypad flashing."
          steps:
            - action: "Select the v1 Lock Bolt in the official app with Internet and Bluetooth enabled."
              actor: "user"
            - action: "Press and hold the round P button under the batteries, then release when the lock gives three beeps and the keypad flashes white."
              actor: "user"
              expect: "The app finds and connects to the v1 lock. Do not remove a battery during pairing."
    unpair:
      supported: false
      requires_factory_reset: true
      clears: "The account binding and stored setup state; treat old exported credentials as invalid and re-provision."
      notes: "There is no unpair short of the official Delete Device factory reset; a plain OS Bluetooth 'forget' action is not the provisioning reset."
    notes: >
      Pairing is application-layer provisioning, not an established OS BLE bond.
      Later sessions use the exported secrets and challenge-response; no PIN or
      bond flow is asserted for a replacement client.

initialization:
  - characteristic: "6e400003-b5a3-f393-e0a9-e50e24dcca9e"
    subscribe: true
    notes: "Open UART notifications and reassemble L1 frames across arbitrary ATT chunks; never treat one notification as a complete frame."
  - characteristic: "00002220-0000-6b63-6f6c-2e6b636f6f6c"
    subscribe: true
    notes: "Validate each encrypted 16-byte state block before publishing. A failed marker/padding check rejects the reading, not a command retry."

services:
  - uuid: "6e400001-b5a3-f393-e0a9-e50e24dcca9e"
    name: "Nordic UART Service (shared transport, not identity)"
    verification: "reported"
    notes: >
      Carries L1-framed L2 messages. This service appears on many incompatible
      products and is deliberately absent from discovery identity. Write without
      response to 6e400002; reassemble notifications from 6e400003.
    characteristics:
      - uuid: "6e400002-b5a3-f393-e0a9-e50e24dcca9e"
        name: "UART command write"
        properties: ["write_without_response"]
        verification: "reported"
        notes: "L1 bytes only after manual v1 selection, read-only validation and a dedicated session handler. No characteristic commands are exposed to generic consumers."
      - uuid: "6e400003-b5a3-f393-e0a9-e50e24dcca9e"
        name: "UART response notify"
        properties: ["notify"]
        verification: "reported"
        notes: "Responses use data flags 0x40 and ACK+data flags 0x48 in the public implementation; ACK frames echo sequence."
  - uuid: "0000180f-0000-1000-8000-00805f9b34fb"
    name: "Battery Service with encrypted non-standard value"
    verification: "reported"
    characteristics:
      - uuid: "00002a19-0000-1000-8000-00805f9b34fb"
        name: "Battery level (AES-encrypted, not plain SIG uint8)"
        properties: ["read"]
        verification: "reported"
        encryption:
          algorithm: "aes-128-ecb"
          key_derivation: "device-specific"
        notes: "Exactly 16 ciphertext bytes. Decrypt with the last 16 ASCII characters of the device UUID; require bytes 5..10 zero and bytes 11..15 ASCII loock. Byte 0 is percent 0..100; 0xFF means unknown. Timestamp is uint32 BE seconds at 1..4."
  - uuid: "0000180a-0000-1000-8000-00805f9b34fb"
    name: "Device Information Service"
    verification: "reported"
    characteristics:
      - {uuid: "00002a24-0000-1000-8000-00805f9b34fb", name: "Model Number String", properties: ["read"], verification: "reported"}
      - {uuid: "00002a25-0000-1000-8000-00805f9b34fb", name: "Serial Number String", properties: ["read"], verification: "reported", notes: "Owner identifier: redact in exports and logs."}
      - {uuid: "00002a26-0000-1000-8000-00805f9b34fb", name: "Firmware Revision String", properties: ["read"], verification: "reported"}
      - {uuid: "00002a27-0000-1000-8000-00805f9b34fb", name: "Hardware Revision String", properties: ["read"], verification: "reported"}
      - {uuid: "00002a28-0000-1000-8000-00805f9b34fb", name: "Software Revision String", properties: ["read"], verification: "reported"}
      - {uuid: "00002a29-0000-1000-8000-00805f9b34fb", name: "Manufacturer Name String", properties: ["read"], verification: "reported"}

protocol_details:
  consumer_limitations:
    integration: "identify_only"
    manual_selection_required: true
    nus_is_identity: false
    generic_entities: false
    executable_characteristic_commands: false
    required_handler: "Manual WLCKB1 selection + strict encrypted-status validation + legacy challenge/session sequencing + advanced attended confirmation."
  status_characteristics:
    lock_state:
      uuid: "00002220-0000-6b63-6f6c-2e6b636f6f6c"
      properties: ["read", "notify"]
      values: {0: "unlocked", 1: "locked", 255: "unknown/invalid"}
      verification: "reported"
    door_state:
      uuid: "00002222-0000-6b63-6f6c-2e6b636f6f6c"
      properties: ["read", "notify"]
      values: "Raw byte preserved; state mapping beyond 0xFF unknown is not asserted."
      verification: "reported"
    battery:
      uuid: "00002a19-0000-1000-8000-00805f9b34fb"
      service_uuid: "0000180f-0000-1000-8000-00805f9b34fb"
      values: "0..100 percent; 0xFF unknown/invalid"
      verification: "reported"
    parent_service_note: "The lock/door custom-characteristic parent service is not asserted from the reviewed evidence; address characteristics by UUID rather than inventing a parent."
    encrypted_block:
      length_bytes: 16
      cipher: "AES-128-ECB, no padding, exactly one block"
      key: "ASCII bytes of device_uuid[-16:]; the cloud UUID itself remains secret"
      plaintext_fields:
        - {offset: 0, length: 1, name: "payload", type: "uint8", description: "Lock/door raw state or battery percent; 0xFF unknown"}
        - {offset: 1, length: 4, name: "timestamp", type: "uint32", endianness: "big", unit: "s", scale: 1, description: "Unix seconds; multiply by 1000 only if milliseconds are required"}
        - {offset: 5, length: 6, name: "zero_padding", type: "bytes", min_length: 6, max_length: 6, required_hex: "00 00 00 00 00 00"}
        - {offset: 11, length: 5, name: "marker", type: "bytes", min_length: 5, max_length: 5, required_ascii: "loock"}
      validation: "Require ciphertext length 16, valid AES key length 16, exact zero padding and marker, and battery range 0..100 or 0xFF. Reject wrong keys and malformed values; never display decrypted garbage."
  l1_transport:
    layout:
      - {offset: 0, length: 1, name: "magic", value: "0xAB"}
      - {offset: 1, length: 1, name: "flags", values: "0x00 client request; 0x08 ACK; 0x40 device data; 0x48 device ACK+data"}
      - {offset: 2, length: 2, name: "payload_length", type: "uint16", endianness: "big"}
      - {offset: 4, length: 2, name: "crc16", type: "uint16", endianness: "big", coverage: "L2 payload only"}
      - {offset: 6, length: 2, name: "sequence", type: "uint16", endianness: "big"}
      - {offset: 8, length: "payload_length", name: "l2_payload", type: "bytes"}
    crc:
      name: "CRC-16/ARC (CRC-16/IBM)"
      polynomial_normal: "0x8005"
      polynomial_reflected: "0xA001"
      init: "0x0000"
      reflect_input: true
      reflect_output: true
      xor_out: "0x0000"
      known_answer: {input_ascii: "123456789", output: "0xBB3D"}
      wire_endianness: "big"
    sequencing: "Challenge request sequence 1, legacy actuation sequence 2. ACK echoes the data frame's sequence. Sequence is a uint16 counter; overflow behavior is not asserted."
    reassembly: "Scan to 0xAB, retain incomplete frames, validate declared length and CRC before delivery. On bad magic/CRC discard through the bad frame and rescan at the next 0xAB; never deliver a corrupt payload."
    ack: "An ACK has flags 0x08 and empty payload. Its eight-byte header still contains the CRC of empty input, 0x0000."
  l2_payload:
    header: "command uint8, version_flags uint8. High nibble 0 selects legacy one-byte TLV keys; high nibble 7 selects ID2 two-byte big-endian TLV keys."
    legacy_tlv: "key uint8 | length uint16 BE | value[length]"
    id2_tlv: "key uint16 BE | length uint16 BE | value[length]. Syntax documentation only; no ID2 actuation implementation is declared."
    validation: "Require the full two-byte header and exact TLV lengths, reject truncation/duplicate keys, and reject an unsupported version nibble rather than guessing."
    challenge_request:
      command: "0x91"
      version_flags: "0x00"
      fields: [{"key": "0x0A", "value_hex": "27"}]
      l2_hex: "91 00 0a 00 01 27"
      l1_sequence: 1
      l1_hex: "ab 00 00 06 d3 5e 00 01 91 00 0a 00 01 27"
    challenge_response:
      command: "0x86"
      required_field: "0xD2 containing exactly 16 random bytes"
      synthetic_l2_hex: "86 00 d2 00 10 00 01 02 03 04 05 06 07 08 09 0a 0b 0c 0d 0e 0f"
      synthetic_l1_hex: "ab 40 00 15 16 7f 00 02 86 00 d2 00 10 00 01 02 03 04 05 06 07 08 09 0a 0b 0c 0d 0e 0f"
    id2_syntax_example:
      l2_hex: "91 70 00 0a 00 01 27"
      decoded: {command: "0x91", version_flags: "0x70", fields: [{"key": "0x000A", "length": 1, "value_hex": "27"}]}
  legacy_actuation:
    scope: "Documentary for a dedicated handler only. Do not execute unless v1 was manually selected, read-only status validated, the user is attending, and legacy support is confirmed."
    advanced: true
    attended: true
    generic_binding: false
    verification: "reported"
    algorithm:
      - "Start with the 0x91 challenge request and require its ACK plus command 0x86 / field 0xD2 with a fresh 16-byte challenge."
      - "operate_key = ASCII bytes of ble_token[16:32]. Require a 32-character token and a 16-byte challenge."
      - "response = AES-128-ECB-encrypt(operate_key, challenge), no padding. XOR each byte with the 16-byte operation marker: byte0=0x01 unlock or 0x02 lock, bytes1..10 zero, bytes11..15 ASCII loock."
      - "Build legacy L2 command 0x04/version 0x00 with key 0x05 = numeric BLE key id uint16 BE, key 0x04 = 16-byte response, then key 0xAD=00, key 0xF4=01 and key 0xF7=01 (each one-byte value). Preserve this field order."
      - "Wrap in L1 with flags 0 and sequence 2. Send once; require data/result handling and ACK as documented, then require a marker-valid state notification. Never auto-replay after timeout."
    synthetic_vector:
      provenance: "Newly generated with invented token, BLE id, challenge and sequence. Not a real credential or capture."
      ble_token_ascii: "00112233445566778899aabbccddeeff"
      operate_key_ascii: "8899aabbccddeeff"
      ble_key_id: "0x1234"
      challenge_hex: "00 01 02 03 04 05 06 07 08 09 0a 0b 0c 0d 0e 0f"
      aes_challenge_hex: "ca ce 63 1a 10 72 da 8e f7 c8 87 79 be 93 40 8d"
      unlock_response_hex: "cb ce 63 1a 10 72 da 8e f7 c8 87 15 d1 fc 23 e6"
      lock_response_hex: "c8 ce 63 1a 10 72 da 8e f7 c8 87 15 d1 fc 23 e6"
      unlock_l1_hex: "ab 00 00 26 bf 0f 00 02 04 00 05 00 02 12 34 04 00 10 cb ce 63 1a 10 72 da 8e f7 c8 87 15 d1 fc 23 e6 ad 00 01 00 f4 00 01 01 f7 00 01 01"
      lock_l1_hex: "ab 00 00 26 7f 09 00 02 04 00 05 00 02 12 34 04 00 10 c8 ce 63 1a 10 72 da 8e f7 c8 87 15 d1 fc 23 e6 ad 00 01 00 f4 00 01 01 f7 00 01 01"
    result_sequence:
      - "The public client expects challenge ACK flags 0x48 / sequence 1, then device data flags 0x40."
      - "ACK each device data frame with flags 0x08 and its sequence. Command ACK may be absent on some firmware; a command 0x04 result is the alternative, not a reason to resend."
      - "Wait for encrypted state notification. Treat absent notification as a later read-back requirement, never as permission to send the operation again."
  id2_unresolved:
    status: "documentary only; not implemented and not a fallback"
    header: "version_flags 0x70; two-byte TLV keys"
    reported_algorithm: "Fold challenge[0:8] XOR challenge[8:16] into an 8-byte AES-CCM nonce, encrypt the same operation marker with the legacy operate-key suffix, and carry plaintext marker under key 0x0111 before CCM protection."
    unknowns: "Accepted firmware, exact CCM tag/parameters and complete field ordering are not capture-confirmed. Do not construct or send an ID2 operation from this outline."
  status_test_vectors:
    provenance: "Newly encrypted with invented device UUID suffix and timestamps. No owner values or captures."
    device_uuid: "YD_BT1.0123456789abcdef0123456789abcdef"
    state_key_ascii: "0123456789abcdef"
    wrong_key_ascii: "ffffffffffffffff"
    vectors:
      - name: "locked"
        plaintext_hex: "01 12 34 56 78 00 00 00 00 00 00 6c 6f 6f 63 6b"
        ciphertext_hex: "97 f3 79 31 a4 51 17 9a f7 72 9e 2b ac f4 1d 03"
        expected: {payload: 1, state: "locked", timestamp: 305419896}
      - name: "battery 87 percent"
        plaintext_hex: "57 12 34 56 79 00 00 00 00 00 00 6c 6f 6f 63 6b"
        ciphertext_hex: "1e bc c9 16 cf de b4 c7 ae dd 58 7b ae af cd cf"
        expected: {payload: 87, battery_percent: 87, timestamp: 305419897}
      - name: "unknown payload"
        plaintext_hex: "ff 12 34 56 7a 00 00 00 00 00 00 6c 6f 6f 63 6b"
        ciphertext_hex: "e1 cf 83 25 bc 16 31 6a 7e d2 65 37 82 d5 e6 75"
        expected: {payload: 255, state: "unknown", timestamp: 305419898}
      - name: "nonzero padding must fail"
        plaintext_hex: "01 12 34 56 78 00 00 00 00 00 01 6c 6f 6f 63 6b"
        ciphertext_hex: "cf 99 e9 7b 0b 8e 30 6b 2c ab 51 71 7c d5 8a 06"
        expected_error: "zero padding missing"
    malformed:
      - {input_hex: "00", reason: "not one AES block"}
      - {input_hex: "97 f3 79 31 a4 51 17 9a f7 72 9e 2b ac f4 1d", reason: "15-byte ciphertext"}
      - {use: "wrong_key_ascii", ciphertext_from: "locked", reason: "wrong key fails loock marker"}

features:
  - type: "firmware_update"
    dfu:
      mechanisms: ["nordic_secure_dfu"]
      transport: "ble"
      image:
        signing: "unknown"
        algorithm: "unknown"
        source: "vendor_cloud"
        format: "Cloud-supplied image for the Nordic secure DFU path"
        notes: "The reviewed app contains a secure-DFU client but no v1 Bolt image. A similarly named bundled image belongs to an unrelated camera. No public v1 image, signature verification result or downgrade policy was established."
      enter:
        how: "unknown"
        notes: "No DFU-entry command is declared; firmware upload and bootloader entry are outside the safe surface."
      dfu_mode:
        notes: "No v1 bootloader name, address offset or advertisement identity was observed. Do not label an arbitrary Nordic DFU peripheral as this lock."
      recovery:
        interrupted: "unknown"
      verification: "reported"
      notes: "Declaration only; no image or DFU command was used."

cloud:
  required: true
  vendor_service: "Wyze account/device service, required for initial provisioning and owner credential export"
  hosts: []
  auth:
    type: "other"
    notes: "Owner account plus developer API credentials for the public export helper. Endpoints and real output are deliberately not reproduced."
    verification: "reported"
  failure_mode: >
    First-time provisioning and fresh credential export stop without the vendor
    service. A replacement client that already holds all four values performs
    status and legacy challenge-response locally over BLE without further cloud
    contact. Firmware download and credential rotation/reissue remain cloud
    dependent; acceptance after rotation or on ID2-only firmware is unknown.
  notes: "The v1 lock itself has no Wi-Fi/LAN path. The service dependency is bootstrap, not a claim that every later BLE session is cloud-routed."

local_access:
  status: "native"
  summary: "Phone-direct encrypted BLE after one owner-authorized cloud export. identify_only here until a consumer implements strict status validation and the legacy session handler."
  covers:
    - "Manual v1-only identity and Device Information reads"
    - "AES-ECB lock/door/battery status with marker/padding/range validation"
    - "L1 CRC/reassembly and legacy/ID2 TLV parsing"
    - "Legacy challenge-response construction for an advanced attended dedicated handler"
  not_covered:
    - "Automatic discovery from NUS or any other advertisement-only signal"
    - "Generic lock entities, one-tap actions, unattended actuation or timed-out replay"
    - "ID2/CCM actuation, current-firmware negotiation, owner credential issuance"
    - "Separate keypad, older Wyze Lock, v2, gateway, access-code/fingerprint management and OTA delivery"

payload_formats:
  EncryptedStatusBlock:
    description: "Sixteen-byte AES-128-ECB plaintext shared by lock state, door state and battery reads."
    fields:
      - {index: 0, name: "payload", type: "uint8", description: "Raw state or battery percent; 0xFF unknown"}
      - {index: 1, name: "timestamp", type: "uint32", endianness: "big", unit: "s", description: "Unix timestamp in seconds"}
    parse_rules:
      - "Decrypt exactly one block using device_uuid[-16:] as 16 ASCII key bytes; never use the BLE token for status."
      - "Require bytes 5..10 zero and bytes 11..15 ASCII loock before using payload/timestamp."
      - "Interpret lock payload 0 as unlocked, 1 as locked, 0xFF as unknown; battery accepts only 0..100 or unknown."

