features:
  - type: "firmware_update"
    dfu:
      mechanisms: ["vendor_ble", "vendor_cloud"]
      transport: ["ble", "cloud"]
      services: ["0000fe4d-0000-1000-8000-00805f9b34fb"]
      image:
        signing: "unknown"
        algorithm: "unknown"
        encrypted: false
        source: "public_url"
        format: "Casambi 0xca5a0002 container with outer CRC-32, typed blocks and a 64-byte trailer"
        notes: >
          Public images were inspected offline only. CRC and exact container
          length passed for retained public samples; the trailer's algorithm,
          trust key and node-side enforcement are not established.
      enter:
        how: "in_place"
        notes: "The running application receives PREPARE on characteristic 0003. Every OTA stage is advanced under protocol_details.ota; no generic command is declared."
      dfu_mode:
        notes: "No distinct update-mode name, service advertisement, address offset or guaranteed bootloader identity is established. FE4D is also the ordinary service and does not prove update mode."
      recovery:
        interrupted: "unknown"
        notes: "The 20-second PREPARE watchdog is not a bootloader inactivity timeout. Do not assume the old image survives."
      verification: "reported"
      notes: "Image board/device/CPU/grade/variant must all match. Classic-to-Evolution conversion is a separate advanced operation with no network rollback."

cloud:
  required: false
  vendor_service: "Casambi cloud (first-time provisioning and recovery only after warm cache)"
  auth:
    type: "other"
    notes: "Authorized account/network session and network password/token are required for initial download; no credential is included here."
    verification: "reported"
  egress:
    - host: "api.casambi.com"
      contacted_by: "app"
      roles: ["account", "provisioning", "api", "firmware_download"]
      ports: [{port: 443, protocol: "tcp"}]
      when_blocked:
        impact: "degraded"
        effect: "First-time provisioning, missing/expired fixture refresh, foreign-unpair keys and uncached firmware fail; a complete warm cache can still control locally."
        workaround: "Provision and back up all keys, topology and fixture controls while online, then use a dedicated BLE client offline."
      verification: "reported"
      basis: "Pinned public clients and anonymous fixture/firmware endpoint review; no live account or device session."
    - host: "bridge.casambi.com"
      contacted_by: "app"
      roles: ["device_cloud"]
      ports: [{port: 443, protocol: "tcp"}]
      when_blocked:
        impact: "none"
        effect: "Optional out-of-range Cloud Gateway relay is unavailable; in-range BLE does not use this host."
      verification: "reported"
      basis: "Public client and app cloud-relay configuration."
  endpoints:
    - path: "/network/uuid/<48-bit-network-id>"
      method: "GET"
      returns: "Server network id; resolution only, not session creation"
      verification: "reported"
    - path: "/network/<id>/session"
      method: "POST"
      returns: "Authorized session/keyID after password/deviceName (and app-generation token) is supplied"
      verification: "reported"
    - path: "/network/<id>/"
      method: "PUT"
      returns: "UPTODATE/MERGED/FETCHED/CONFLICT plus network keyStore, protocol, units, groups, scenes and settings with revision; requires formatVersion/deviceName/revision and X-Casambi-Session"
      verification: "reported"
    - path: "fixture/<id>"
      method: "GET"
      returns: "Fixture state length and control bit layout; current public route has no /api prefix"
      verification: "reported"
    - path: "fixture/unpair/v2 and fixture/<id>/firmware/<version>"
      method: "GET"
      returns: "Foreign-unpair authorization or selected firmware; neither is an offline replacement service"
      verification: "reported"
  failure_mode: >
    Existing control continues only with a complete compatible warm cache.
    New/lost-credential provisioning, missing fixture types, foreign unpair,
    Network History, uncached OTA and out-of-range relay stop.
  data_leaves_device:
    - "Account/network session and authorization metadata during provisioning"
    - "Network topology, fixture identifiers, configuration and revision metadata during synchronization"
  notes: "The spec does not reproduce the Android REST hostname-verification defect; new clients must use normal platform CA and hostname validation."

local_access:
  status: "native"
  summary: "Phone-direct BLE to a mesh node after one authorized cloud/cache provisioning step; no bridge is needed for steady-state in-range control."
  covers:
    - "P-256 ECDH encrypted/authenticated sessions for protocols 10 and 11"
    - "Level, temperature, white, HS, full fixture state and XY invocations to cached targets"
    - "Structured unit-state records with fixture-specific semantic decoding"
    - "Time sync and manager-authorized management for provisioned clients"
  not_covered:
    - "Offline first-time provisioning, new-network creation or recovery with no complete backup"
    - "Protocol 12, Classic networks, legacy UUID scheme and separate direct FE3D API"
    - "Foreign-fixture unpair without the vendor-issued key, and any universal hardware reset"
    - "Out-of-range Cloud Gateway relay, uncached firmware and unverified OTA signature/recovery behavior"
  notes: "Local protocol availability does not mean this project's generic mobile app can operate it; a bespoke consumer is still required."

entities:
  - platform: "light"
    name: "Evolution mesh light (per cached unit)"
    instances: {keyed_by: "device_id", label_path: "name"}
    notes: >
      Descriptive only while identify_only. A bespoke consumer enumerates units
      from the warm cache, decodes type-6 state using each fixture's controls,
      and sends encrypted type-7 invocations. There are deliberately no generic
      command bindings, because a fixed GATT write cannot supply session keys,
      counters, targets or fixture state.

evidence:
  app_static_analysis: >
    Vendor Android app v3.20.2 supplied discovery, new UUID mapping, node-information packet,
    ECDH/auth, directional CTR/CMAC, invocation and state layouts, Classic versus
    Evolution selection, cache boundaries, management and OTA. Facts are reported,
    not hardware-confirmed; no internal class or method names are reproduced.
  public_implementation: >
    lkempf/casambi-bt 0.3.2 at ec23769ab3459abf8ba5f332267900964319d03e
    independently corroborates protocols 10–11, FE4D/0001, node-information offsets,
    little-endian P-256 coordinates, folded transport key, CTR nonce directions,
    authentication, invocation header/opcodes and fixture-driven state. Its lack
    of auth-digest verification and lenient parser behavior is not copied. Its
    three-byte high-X/low-Y 22-bit XY packing is the one used here. The static
    app's apparent four-byte independent-u16le writer is explicitly NOT treated
    as corroborating XY; the disagreement needs an owner-controlled capture.
    lian/esp32-casambi at 2903401ee7bd61ec4c3c697e29178c5d4b1683a2 corroborates
    the session shape but is protocol-10-only; its node-information unit/flags endian
    interpretation is not used over the app plus Python agreement.
  public_fixtures: >
    Anonymous fixture/1 and fixture/9000 metadata supplied the two public state
    layouts. No owner network, fixture address, key or topology was accessed.
  open_questions: >
    Capture the app's 0x0d versus library 0x01 key-exchange capability and the
    conflicting four-byte versus hardware-tested three-byte XY encodings; verify
    type-5 digest on hardware, establish type-12 signature auth, test OTA block
    acknowledgements/signature enforcement/recovery, and establish a model-specific
    physical reset and foreign-fixture offline recovery if one exists.
  artifacts:
    - type: "static_analysis"
      artifact: "casambi.ambi v3.20.2 (versionCode 240483), base APK"
      sha256: "f29e99161fd8fbe68e30913b215a44561c6662b5eb630ea80f4d62645eed7cce"
      obtained_via: "Third-party APK mirror, 2026-09; static analysis only"
      description: "Derived protocol and lifecycle facts; no binary or decompiled source committed."
    - type: "public_implementation"
      artifact: "lkempf/casambi-bt 0.3.2, commit ec23769ab3459abf8ba5f332267900964319d03e"
      url: "https://github.com/lkempf/casambi-bt/tree/ec23769ab3459abf8ba5f332267900964319d03e"
      description: "Pinned Evolution client and fixture-cache behavior; maximum network protocol 11."
    - type: "public_implementation"
      artifact: "lian/esp32-casambi, commit 2903401ee7bd61ec4c3c697e29178c5d4b1683a2"
      url: "https://github.com/lian/esp32-casambi/tree/2903401ee7bd61ec4c3c697e29178c5d4b1683a2"
      description: "Second Evolution implementation, protocol 10 only; no successful current build or hardware operation claimed."
    - type: "public_document"
      artifact: "Public fixture 1 metadata"
      sha256: "44f618a672bc59283dca9a59e6073475c16b9df91e1d5fa203dc2938b539e858"
      url: "https://api.casambi.com/fixture/1"
      description: "Generic one-byte dimmer state vector used by independent tests."
    - type: "public_document"
      artifact: "Public fixture 9000 metadata"
      sha256: "1ae7265fb4ac9e66c433deb242b2d40817c31d8e592ad089fc0744a585d9b768"
      url: "https://api.casambi.com/fixture/9000"
      description: "Evolution-only CBU-DCS eight-byte state layout used by independent tests."

remaining_unknowns:
  - "Protocol-12 wire compatibility is unverified and deliberately unsupported."
  - "The static app's apparent independent-u16le XY writer conflicts with the hardware-tested client's three-byte high-X/low-Y 22-bit encoding used here; capture must resolve it."
  - "Meaning of key-exchange capability 0x0d versus 0x01 and the complete type-12 site-key signature-auth exchange."
  - "Universal per-node connection limit and all node-information flag bits; the ESP32 client's unit/flags byte order disagrees with app plus Python."
  - "Foreign-fixture offline unpair, universal physical reset, cache conversion, and lost-credential recovery without cloud/backup."
  - "OTA trailer algorithm/trust key, node-side rejection, block acknowledgement details and interrupted-update appearance/recovery."

helpful_urls:
  - title: "lkempf/casambi-bt 0.3.2 (pinned Evolution client)"
    url: "https://github.com/lkempf/casambi-bt/tree/ec23769ab3459abf8ba5f332267900964319d03e"
    kind: "implementation"
