site_name: OpenGreenIoT Protocol Docs
site_description: Reverse-engineered IoT device protocol documentation
site_author: Pigs Can Fly Labs LLC
repo_name: PigsCanFlyLabs/opengreeniot-protocol-docs
repo_url: https://github.com/PigsCanFlyLabs/opengreeniot-protocol-docs
copyright: Copyright &copy; 2026 Pigs Can Fly Labs LLC

theme:
  name: material
  palette:
    - scheme: default
      primary: green
      accent: light-green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: light-green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/index.md
      - Tools: getting-started/tools.md
      - Methodology: getting-started/methodology.md
  - Devices:
      - Device Registry: devices/index.md
      - AdMore Light Bar Pro: devices/admore-light-bar.md
  - Reverse Engineering Workspace:
      - Executive Summary: EXEC_SUMMARY.md
      - Clean-room Rules: CLEANROOM_RULES.md
      - Auto-detection Workflow: AUTODETECTION.md
      - APK Decompile Playbook: APK_DECOMPILE_PLAYBOOK.md
  - Protocols:
      - Overview: protocols/index.md
      - Common BLE Patterns: protocols/ble-common.md
      - Common WiFi Patterns: protocols/wifi-common.md
  - Contributing:
      - How to Contribute: contributing/index.md
      - Documentation Guide: contributing/documentation-guide.md
